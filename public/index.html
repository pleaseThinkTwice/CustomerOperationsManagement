<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQLBot · 问数工作台</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1b293b; background: #f6f8fb; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    header { background: #fff; border-bottom: 1px solid #e3e8ef; min-height: 64px; display: flex; align-items: center; gap: 38px; padding: 0 max(24px, calc((100vw - 980px) / 2)); }
    .brand { font-size: 18px; font-weight: 730; white-space: nowrap; }
    nav { display: flex; gap: 20px; }
    nav button { color: #64748b; background: none; border: 0; border-bottom: 2px solid transparent; padding: 21px 2px 19px; white-space: nowrap; }
    nav button.active { color: #215caf; border-bottom-color: #215caf; font-weight: 650; }
    main { max-width: 980px; margin: 44px auto; padding: 0 24px; }
    h1 { font-size: 27px; letter-spacing: -.03em; margin: 0 0 8px; }
    h2 { font-size: 17px; margin: 0; }
    p { margin: 0; }
    .lead, .muted { color: #68788e; line-height: 1.65; }
    .lead { margin-bottom: 27px; }
    .panel { background: white; border: 1px solid #e1e7f0; border-radius: 14px; padding: 28px; box-shadow: 0 8px 28px #243c5a08; }
    .form { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(180px, .8fr); gap: 20px; margin-top: 22px; }
    #parameter-fields { display: contents; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; }
    select, input { width: 100%; height: 44px; color: #213348; background: white; border: 1px solid #cbd6e3; border-radius: 8px; padding: 0 12px; }
    .single-name { display: flex; align-items: center; min-height: 44px; font-size: 17px; font-weight: 650; }
    select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #93bafb; outline-offset: 2px; }
    .note { color: #718096; font-size: 13px; margin-top: 10px; line-height: 1.55; min-height: 18px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 22px; }
    .primary, .secondary { border-radius: 8px; padding: 11px 19px; border: 1px solid #2365b7; }
    .primary { color: white; background: #2365b7; font-weight: 650; }
    .primary:hover:not(:disabled) { background: #17559e; }
    .secondary { color: #215caf; background: white; }
    .secondary:hover:not(:disabled) { background: #f0f5fd; }
    .status { color: #66788d; font-size: 13px; min-height: 23px; margin-top: 13px; }
    .status.error { color: #b63f36; }
    .result { border-top: 1px solid #e9edf4; padding-top: 25px; margin-top: 19px; }
    .result-label { font-size: 13px; color: #68788e; }
    .number { color: #1d56a1; font-size: 40px; font-weight: 750; letter-spacing: -.05em; margin-top: 5px; }
    .number small { font-size: 17px; letter-spacing: 0; margin-left: 7px; }
    .table-wrap { overflow: auto; max-height: 440px; margin-top: 10px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border-bottom: 1px solid #e9edf3; padding: 10px 12px; text-align: left; white-space: nowrap; }
    th { background: #f6f8fb; }
    details { border-top: 1px solid #edf0f5; margin-top: 22px; padding-top: 14px; }
    summary { color: #546a86; cursor: pointer; font-size: 13px; }
    pre { background: #f5f7fa; border-radius: 8px; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.65; }
    .saved-area { margin-top: 26px; }
    .saved-list { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 12px; }
    .saved-item { background: white; border: 1px solid #d9e3ef; border-radius: 8px; padding: 9px 13px; color: #29557e; }
    .saved-item:hover { border-color: #6799d4; }
    #bot { display: none; width: 100%; height: calc(100vh - 65px); border: 0; }
    .knowledge-grid { display: grid; gap: 12px; }
    .knowledge-item { background: white; border: 1px solid #e1e7f0; border-radius: 10px; padding: 0 20px; }
    .knowledge-item details { margin: 0; padding: 0; border: 0; }
    .knowledge-item summary { list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 18px 0; font-size: 15px; font-weight: 650; color: #273b52; }
    .knowledge-item summary::-webkit-details-marker { display: none; }
    .knowledge-item summary::after { content: "展开"; font-size: 12px; font-weight: 400; color: #718096; }
    .knowledge-item details[open] summary::after { content: "收起"; }
    .knowledge-item pre { margin: 0 0 18px; }
    @media (max-width: 700px) { header { padding: 0 15px; gap: 15px; } .brand { font-size: 15px; } nav { gap: 12px; overflow-x: auto; } nav button { font-size: 13px; } main { margin: 25px auto; padding: 0 15px; } .panel { padding: 19px; } .form { grid-template-columns: 1fr; gap: 14px; } .number { font-size: 34px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">SQLBot 工作台</div>
    <nav aria-label="功能">
      <button id="tab-saved" class="active" type="button" aria-pressed="true">常用查询</button>
      <button id="tab-bot" type="button" aria-pressed="false">智能问数</button>
      <button id="tab-knowledge" type="button" aria-pressed="false">知识说明</button>
    </nav>
  </header>

  <main id="saved">
    <h1>常用查询</h1>
    <p class="lead">默认选择上一个完整月。点“查询”即可查看结果。</p>
    <section class="panel" aria-label="运行查询">
      <h2>查询条件</h2>
      <div class="form">
        <div><label for="template">查询</label><select id="template"></select><div id="single-name" class="single-name" hidden></div><p id="description" class="note"></p></div>
        <div id="parameter-fields"></div>
      </div>
      <div class="actions">
        <button class="primary" id="run" type="button">查询</button>
        <button class="secondary" id="save" type="button" hidden>保存到常用</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="output" class="result" hidden>
        <div id="scalar"><p id="result-label" class="result-label"></p><p id="number" class="number"></p></div>
        <div id="table-wrap" class="table-wrap" hidden></div>
        <p id="empty" class="muted" hidden>这一时间段没有查询结果。可以换个月份再试。</p>
        <details><summary>查看本次 SQL 和参数</summary><pre id="sql"></pre></details>
      </div>
    </section>
    <section class="saved-area" id="saved-area" hidden><h2>已保存</h2><div id="saved-list" class="saved-list"></div></section>
  </main>

  <iframe id="bot" title="SQLBot 智能问数" src="/#/chat/index?start_chat=1"></iframe>

  <main id="knowledge" hidden>
    <h1>知识说明</h1>
    <p class="lead">常用口径、表字段和问答都随项目保存。点击标题查看，修改请编辑项目的 knowledge/ 文件。</p>
    <div id="knowledge-list" class="knowledge-grid"></div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let templates = [];
    let saved = [];
    let lastRunKey = null;
    const api = async (url, options) => {
      let response;
      try { response = await fetch(url, options); }
      catch { throw new Error('无法连接服务，请确认项目仍在运行。'); }
      if (!response.ok) throw new Error((await response.text()).slice(0, 180) || '请求失败，请稍后重试。');
      return response.json();
    };
    function showStatus(message, error = false) { $('status').textContent = message; $('status').classList.toggle('error', error); }
    function currentTemplate() { return templates.find(x => x.id === $('template').value); }
    function chooseTemplate() {
      const template = currentTemplate();
      $('description').textContent = template?.description || '';
      $('parameter-fields').replaceChildren();
      for (const p of template?.parameters || []) {
        const field = document.createElement('div'), label = document.createElement('label'), input = document.createElement('input');
        input.id = 'param-' + p.name;
        input.dataset.parameter = p.name;
        input.type = ['month', 'number'].includes(p.type) ? p.type : 'text';
        if (p.type === 'month') { input.min = '2000-01'; input.max = '2100-12'; }
        if (p.type === 'month' && p.default === 'previous_month') {
          const today = new Date();
          input.value = today.getMonth() === 0 ? `${today.getFullYear() - 1}-12` : `${today.getFullYear()}-${String(today.getMonth()).padStart(2, '0')}`;
        } else input.value = p.default ?? '';
        input.required = !!p.required;
        label.htmlFor = input.id;
        label.textContent = p.label || p.name;
        field.append(label, input);
        $('parameter-fields').append(field);
      }
      if (!template?.parameters?.length) $('parameter-fields').textContent = '这项查询无需填写条件。';
      $('output').hidden = true;
      $('save').hidden = true;
      lastRunKey = null;
      showStatus('');
    }
    async function refreshSaved() {
      const data = await api('/saved/api/queries');
      saved = data.queries || [];
      $('saved-area').hidden = saved.length === 0;
      $('saved-list').replaceChildren();
      for (const item of saved) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'saved-item';
        button.textContent = item.name;
        button.addEventListener('click', () => { $('template').value = item.template_key; chooseTemplate(); $('template').focus(); });
        $('saved-list').append(button);
      }
    }
    async function loadTemplates() {
      try {
        templates = (await api('/saved/api/templates')).templates || [];
        $('template').replaceChildren();
        for (const item of templates) {
          const option = document.createElement('option'); option.value = item.id; option.textContent = item.name; $('template').append(option);
        }
        if (!templates.length) { $('run').disabled = true; showStatus('暂无查询模板，请在项目的 queries/ 目录添加。', true); return; }
        $('template').hidden = templates.length === 1;
        $('single-name').hidden = templates.length !== 1;
        if (templates.length === 1) $('single-name').textContent = templates[0].name;
        chooseTemplate();
        await refreshSaved();
      } catch (error) { $('run').disabled = true; showStatus(error.message, true); }
    }
    async function runQuery() {
      const template = currentTemplate();
      if (!template) return showStatus('请先选择查询。', true);
      const inputs = {};
      for (const p of template.parameters || []) {
        const value = $('param-' + p.name)?.value ?? '';
        if (p.required && !value) return showStatus('请填写' + (p.label || p.name) + '。', true);
        if (p.type === 'month' && !/^\d{4}-(0[1-9]|1[0-2])$/.test(value)) return showStatus('请选择有效月份。', true);
        inputs[p.name] = value;
      }
      $('run').disabled = true;
      $('run').textContent = '查询中…';
      $('output').hidden = true;
      $('save').hidden = true;
      showStatus('正在查询…');
      try {
        const data = await api('/saved/api/templates/' + encodeURIComponent(template.id) + '/run', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(inputs)
        });
        const columns = data.columns || [], rows = data.rows || [];
        $('scalar').hidden = true; $('table-wrap').hidden = true; $('empty').hidden = true;
        if (!rows.length) $('empty').hidden = false;
        else if (columns.length === 1 && rows.length === 1) {
          $('result-label').textContent = template.result_label || columns[0];
          const raw = rows[0][0];
          const number = raw !== null && raw !== '' && /^-?\d+(\.\d+)?$/.test(String(raw)) ? Number(raw) : null;
          $('number').textContent = number === null || !template.result_unit ? (raw ?? '—') : number.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
          if (template.result_unit) { const unit = document.createElement('small'); unit.textContent = template.result_unit; $('number').append(unit); }
          $('scalar').hidden = false;
        } else {
          const table = document.createElement('table');
          const head = document.createElement('thead'), body = document.createElement('tbody');
          const tr = document.createElement('tr');
          for (const col of columns) { const th = document.createElement('th'); th.textContent = col; tr.append(th); }
          head.append(tr);
          for (const row of rows) { const tr = document.createElement('tr'); for (const value of row) { const td = document.createElement('td'); td.textContent = value ?? '—'; tr.append(td); } body.append(tr); }
          table.append(head, body); $('table-wrap').replaceChildren(table); $('table-wrap').hidden = false;
        }
        $('sql').textContent = data.sql + '\n\n参数：' + JSON.stringify(data.parameters || {}, null, 2);
        $('output').hidden = false;
        lastRunKey = template.id;
        const alreadySaved = saved.some(item => item.template_key === template.id);
        $('save').hidden = alreadySaved;
        showStatus('查询完成。' + (alreadySaved ? '这项查询已保存。' : '结果合适的话，可以保存到常用。'));
      } catch (error) { lastRunKey = null; showStatus(error.message, true); }
      finally { $('run').disabled = false; $('run').textContent = '查询'; }
    }
    async function saveQuery() {
      if (!lastRunKey || lastRunKey !== currentTemplate()?.id) return;
      $('save').disabled = true;
      try {
        const data = await api('/saved/api/queries', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ template_key: lastRunKey }) });
        await refreshSaved(); $('save').hidden = true;
        showStatus(data.already_saved ? '这项查询已经在常用列表里。' : '已保存。下次打开即可直接选择。');
      } catch (error) { showStatus(error.message, true); }
      finally { $('save').disabled = false; }
    }
    async function loadKnowledge() {
      if ($('knowledge-list').childElementCount) return;
      try {
        const data = await api('/saved/api/knowledge');
        if (!data.files?.length) { $('knowledge-list').textContent = '知识文件暂时为空。'; return; }
        for (const file of data.files) {
          const box = document.createElement('section'); box.className = 'knowledge-item';
          const details = document.createElement('details'), title = document.createElement('summary'), content = document.createElement('pre');
          title.textContent = file.title; content.textContent = file.content; details.append(title, content); box.append(details); $('knowledge-list').append(box);
        }
      } catch (error) { $('knowledge-list').textContent = error.message; }
    }
    function switchTab(tab) {
      for (const key of ['saved', 'bot', 'knowledge']) {
        const active = key === tab;
        $(key).hidden = !active;
        if (key === 'bot') $(key).style.display = active ? 'block' : 'none';
        $('tab-' + key).classList.toggle('active', active);
        $('tab-' + key).setAttribute('aria-pressed', String(active));
      }
      if (tab === 'knowledge') loadKnowledge();
    }
    for (const key of ['saved', 'bot', 'knowledge']) $('tab-' + key).addEventListener('click', () => switchTab(key));
    $('template').addEventListener('change', chooseTemplate);
    $('run').addEventListener('click', runQuery);
    $('save').addEventListener('click', saveQuery);
    loadTemplates();
  </script>
</body>
</html>
