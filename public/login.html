<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 客户运营管理平台</title>
<style>
  :root { --bg: #0a0e27; --card: rgba(15, 25, 60, .85); --line: rgba(100, 210, 255, .25); --accent: #64d2ff; --text: #e8f4ff; --muted: #8ba4c4; --danger: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0a0e27 100%); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .mk { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #0a0e27; display: grid; place-items: center; font-weight: 800; }
  h1 { font-size: 18px; margin: 0; } small { color: var(--muted); font-size: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(10,14,39,.8); color: var(--text); font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #0a0e27; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 12px; }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="brand"><div class="mk">运</div><div><h1>客户运营平台</h1><small>请使用平台账号登录</small></div></div>
  <label for="u">账号</label><input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">密码</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">登 录</button>
  <div class="err" id="e"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' },
      body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value }) });
    const d = await r.json();
    if (r.ok && d.success) location.href = '/';
    else e.textContent = d.error || '登录失败';
  } catch (err) { e.textContent = '网络错误：' + err.message; }
  b.disabled = false;
};
</script>
</body>
</html>
