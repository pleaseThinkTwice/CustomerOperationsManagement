<title>用户与权限管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============ 令牌：深浅双主题（深蓝科技风，深色默认） ============ */
:root{
  /* light（浅色）*/
  --bg:#eef2f8; --panel:#ffffff; --panel-2:#f6f8fc; --elev:#ffffff;
  --line:#dde5f0; --line-strong:#c7d3e5;
  --ink:#141d2e; --ink-2:#3a4761; --muted:#6c7a94; --faint:#9aa8c0;
  --brand:#2563eb; --brand-ink:#ffffff; --brand-soft:#e6efff;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef1dc;
  --danger:#dc2626; --danger-soft:#fde4e4;
  --ring:rgba(37,99,235,.35);
  --shadow:0 1px 2px rgba(20,29,46,.06),0 8px 24px rgba(20,29,46,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --panel:#111b2e; --panel-2:#0e1728; --elev:#16223b;
  --line:#22304c; --line-strong:#2d3d5e;
  --ink:#e8eefb; --ink-2:#b7c4dc; --muted:#8496b6; --faint:#5e6f8f;
  --brand:#4f8cff; --brand-ink:#08122a; --brand-soft:#182a49;
  --ok:#34d399; --ok-soft:#0f2e26; --warn:#fbbf24; --warn-soft:#2e2410;
  --danger:#f87171; --danger-soft:#33141a;
  --ring:rgba(79,140,255,.45);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#0b1220; --panel:#111b2e; --panel-2:#0e1728; --elev:#16223b;
  --line:#22304c; --line-strong:#2d3d5e;
  --ink:#e8eefb; --ink-2:#b7c4dc; --muted:#8496b6; --faint:#5e6f8f;
  --brand:#4f8cff; --brand-ink:#08122a; --brand-soft:#182a49;
  --ok:#34d399; --ok-soft:#0f2e26; --warn:#fbbf24; --warn-soft:#2e2410;
  --danger:#f87171; --danger-soft:#33141a;
  --ring:rgba(79,140,255,.45);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#eef2f8; --panel:#ffffff; --panel-2:#f6f8fc; --elev:#ffffff;
  --line:#dde5f0; --line-strong:#c7d3e5;
  --ink:#141d2e; --ink-2:#3a4761; --muted:#6c7a94; --faint:#9aa8c0;
  --brand:#2563eb; --brand-ink:#ffffff; --brand-soft:#e6efff;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef1dc;
  --danger:#dc2626; --danger-soft:#fde4e4;
  --ring:rgba(37,99,235,.35);
  --shadow:0 1px 2px rgba(20,29,46,.06),0 8px 24px rgba(20,29,46,.08);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Manrope","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; text-wrap:balance}

/* ============ 外壳 ============ */
.wrap{max-width:1160px; margin:0 auto; padding:22px 24px 60px}
.top{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7db1ff);
  display:grid;place-items:center;color:var(--brand-ink);font-weight:800;font-size:18px;flex:none;
  box-shadow:0 4px 14px var(--ring)}
.top .titles{flex:1}
.top h1{font-size:19px; font-weight:800; letter-spacing:-.2px}
.top .crumb{color:var(--muted); font-size:12.5px; margin-top:2px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink-2);cursor:pointer;display:grid;place-items:center;font-size:16px}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.me{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel)}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:12px}
.me small{color:var(--muted)}

/* ============ 统计条 ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.stat .k{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.stat .bar{height:4px;border-radius:3px;margin-top:11px;background:var(--panel-2);overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--brand),#7db1ff)}

/* ============ 面板 + 选项卡 ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tabbar{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);background:var(--panel-2)}
.tab{border:none;background:transparent;padding:11px 16px;font-size:14px;font-weight:600;color:var(--muted);
  cursor:pointer;border-radius:9px 9px 0 0;position:relative;font-family:inherit}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}

.toolbar{display:flex;gap:10px;align-items:center;padding:16px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:0 12px}
.search input{flex:1;border:none;background:transparent;color:var(--ink);font-size:14px;padding:10px 0;outline:none;font-family:inherit}
.search input::placeholder{color:var(--faint)}
.chipset{display:flex;gap:6px}
.fchip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.fchip.on{background:var(--brand-soft);border-color:transparent;color:var(--brand)}

.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;
  padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghostdanger{color:var(--danger);border-color:transparent;background:transparent}
.btn.ghostdanger:hover{background:var(--danger-soft)}

/* ============ 表格 ============ */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
thead th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
.user{display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.uname{font-weight:700}
.ulogin{color:var(--muted);font-size:12.5px;margin-top:1px}

.role{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.role::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.role.admin{color:var(--brand);background:var(--brand-soft)}
.role.manager{color:var(--warn);background:var(--warn-soft)}
.role.viewer{color:var(--muted);background:var(--panel-2)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%}
.pill.on .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.pill.off .dot{background:var(--faint);box-shadow:0 0 0 3px var(--panel-2)}
.pill.on{color:var(--ok)} .pill.off{color:var(--muted)}

.rowact{display:flex;gap:4px;justify-content:flex-end}
.act{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);
  cursor:pointer;display:grid;place-items:center;font-size:14px}
.act:hover{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
.act.danger:hover{color:var(--danger);background:var(--danger-soft)}

/* 开关 */
.switch{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:var(--line-strong);border-radius:999px;transition:.18s}
.switch .thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--ok)}
.switch input:checked + .track + .thumb{transform:translateX(16px)}

/* ============ 角色 + 权限矩阵 ============ */
.roles-pane{padding:16px;display:grid;grid-template-columns:260px 1fr;gap:16px}
.rolelist{display:flex;flex-direction:column;gap:9px}
.rolecard{border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;background:var(--panel)}
.rolecard:hover{border-color:var(--line-strong)}
.rolecard.on{border-color:var(--brand);background:var(--brand-soft)}
.rolecard .rn{font-weight:800;display:flex;align-items:center;justify-content:space-between}
.rolecard .rc{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45}
.rolecard .cnt{font-size:12px;font-weight:700;color:var(--brand)}
.tag-builtin{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

.matrix{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.matrix .mhead{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.matrix .mhead h3{font-size:15px;font-weight:800}
.matrix .mhead p{color:var(--muted);font-size:12.5px;margin-top:2px}
.permgroup{padding:6px 15px}
.permgroup + .permgroup{border-top:1px solid var(--line)}
.permgroup .gt{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
.perms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.perm{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.perm code{font-size:11.5px;color:var(--faint)}
.perm .pt{font-weight:600}
.perm label{margin-left:auto}
.cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);cursor:pointer;display:grid;place-items:center;background:var(--panel);color:transparent}
.cbx.ck{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.matrix .mfoot{display:flex;justify-content:flex-end;gap:9px;padding:13px 15px;border-top:1px solid var(--line);background:var(--panel-2)}

/* ============ 弹窗 ============ */
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.55);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50;padding:20px}
.scrim.show{display:grid}
.modal{width:100%;max-width:460px;background:var(--elev);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.modal header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal header h3{font-size:16px;font-weight:800}
.modal .body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring);background:var(--panel)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:var(--panel-2)}
.hint{font-size:12px;color:var(--muted)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-weight:600;font-size:13.5px;
  transition:.25s;z-index:80;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .roles-pane{grid-template-columns:1fr}
  .perms{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <!-- 顶栏 -->
  <div class="top">
    <div class="logo">运</div>
    <div class="titles">
      <h1>用户与权限管理</h1>
      <div class="crumb">系统管理 · 控制谁能进入哪些页面、执行哪些操作</div>
    </div>
    <button class="iconbtn" id="themeBtn" title="切换主题">🌙</button>
    <div class="me"><span class="av">冯</span><div><div style="font-weight:700;font-size:13px">冯锦轶</div><small>管理员</small></div></div>
  </div>

  <!-- 统计 -->
  <div class="stats">
    <div class="stat"><div class="k">用户总数</div><div class="v">14</div><div class="bar"><i style="width:100%"></i></div></div>
    <div class="stat"><div class="k">已启用</div><div class="v">12<small>/ 14</small></div><div class="bar"><i style="width:86%"></i></div></div>
    <div class="stat"><div class="k">角色</div><div class="v">3</div><div class="bar"><i style="width:40%"></i></div></div>
    <div class="stat"><div class="k">今日活跃</div><div class="v">7</div><div class="bar"><i style="width:50%"></i></div></div>
  </div>

  <!-- 主面板 -->
  <div class="card">
    <div class="tabbar">
      <button class="tab on" data-pane="users">用户管理</button>
      <button class="tab" data-pane="roles">角色与权限</button>
    </div>

    <!-- 用户管理 -->
    <div id="pane-users">
      <div class="toolbar">
        <div class="search"><span>🔍</span><input id="q" placeholder="搜索姓名 / 登录名 / 部门…"></div>
        <div class="chipset" id="roleFilter">
          <button class="fchip on" data-r="all">全部</button>
          <button class="fchip" data-r="admin">管理员</button>
          <button class="fchip" data-r="manager">客户经理</button>
          <button class="fchip" data-r="viewer">只读员</button>
        </div>
        <button class="btn primary" onclick="openUser()">＋ 新增用户</button>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>用户</th><th>部门</th><th>角色</th><th>状态</th><th>最近登录</th><th style="text-align:right">操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <!-- 角色与权限 -->
    <div id="pane-roles" hidden>
      <div class="roles-pane">
        <div class="rolelist" id="rolelist"></div>
        <div class="matrix">
          <div class="mhead">
            <div><h3 id="mrole">管理员</h3><p id="mdesc">拥有全部权限，可管理用户、审批需求与查看操作日志。</p></div>
            <button class="btn" onclick="toast('已全选当前角色权限')">全选</button>
          </div>
          <div id="permbox"></div>
          <div class="mfoot">
            <button class="btn" onclick="toast('已还原为保存前状态')">还原</button>
            <button class="btn primary" onclick="toast('权限已保存 ✓')">保存授权</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="hint" style="margin-top:14px">演示界面 · 数据为示例。接入真实接口后，表格与权限矩阵将读写 <code>/api/users</code>、<code>/api/roles</code>、<code>/api/roles/&lt;id&gt;/permissions</code>。</p>
</div>

<!-- 新增/编辑用户 -->
<div class="scrim" id="userModal">
  <div class="modal">
    <header><h3 id="umTitle">新增用户</h3><button class="iconbtn" onclick="closeUser()" style="width:32px;height:32px">✕</button></header>
    <div class="body">
      <div class="grid2">
        <div class="field"><label>姓名</label><input id="f_name" placeholder="张伟"></div>
        <div class="field"><label>登录名</label><input id="f_login" placeholder="zhangwei"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>部门</label><input id="f_dept" placeholder="客户运营"></div>
        <div class="field"><label>角色</label><select id="f_role"><option value="admin">管理员</option><option value="manager" selected>客户经理</option><option value="viewer">只读员</option></select></div>
      </div>
      <div class="field"><label id="pwLabel">初始密码</label><input id="f_pw" placeholder="至少 8 位，首次登录须修改"></div>
      <label style="display:flex;align-items:center;gap:9px;cursor:pointer">
        <span class="switch"><input type="checkbox" id="f_active" checked><span class="track"></span><span class="thumb"></span></span>
        <span style="font-weight:600">账号启用</span>
      </label>
    </div>
    <footer><button class="btn" onclick="closeUser()">取消</button><button class="btn primary" onclick="saveUser()">保存</button></footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- 示例数据 ---------- */
const AVCOLORS=['#4f8cff','#f59e0b','#10b981','#8b5cf6','#ec4899','#06b6d4','#ef4444','#84cc16'];
const ROLE_NAME={admin:'管理员',manager:'客户经理',viewer:'只读员'};
let users=[
  {id:1,name:'冯锦轶',login:'admin',dept:'客户运营',role:'admin',active:true,last:'刚刚'},
  {id:2,name:'张伟',login:'zhangwei',dept:'客户运营',role:'manager',active:true,last:'12 分钟前'},
  {id:3,name:'李娜',login:'lina',dept:'售后质量',role:'manager',active:true,last:'1 小时前'},
  {id:4,name:'王强',login:'wangqiang',dept:'数据分析',role:'viewer',active:true,last:'今天 09:14'},
  {id:5,name:'陈静',login:'chenjing',dept:'客户运营',role:'manager',active:true,last:'昨天 18:02'},
  {id:6,name:'赵磊',login:'zhaolei',dept:'售后质量',role:'viewer',active:false,last:'3 天前'},
  {id:7,name:'测试账号',login:'test',dept:'—',role:'viewer',active:true,last:'昨天 15:40'},
];
let filterRole='all', kw='';

const roles=[
  {code:'admin',name:'管理员',builtin:true,count:1,desc:'拥有全部权限，可管理用户、审批需求与查看操作日志。'},
  {code:'manager',name:'客户经理',builtin:true,count:3,desc:'可使用全部业务页面与写操作，不含用户管理、审批与操作日志。'},
  {code:'viewer',name:'只读员',builtin:true,count:3,desc:'仅可查看各页面，不能新增、修改或删除任何数据。'},
];
const PERMS=[
  {g:'页面访问',items:[['dashboard.view','首页看板'],['customer.view','客户档案'],['meeting.view','会议纪要'],['warning.view','预警闭环'],['qa.view','Q&A 知识库'],['analysis.view','数智分析'],['demand.view','需求管理']]},
  {g:'业务操作',items:[['customer.edit','编辑客户/关键人'],['meeting.edit','编辑会议/任务'],['warning.edit','编辑预警/逻辑'],['knowledge.rebuild','知识库重建/增强']]},
  {g:'审批与需求',items:[['demand.approve','审批需求'],['demand.delete','删除需求'],['task.notify','推送钉钉通知']]},
  {g:'系统管理',items:[['user.manage','用户与权限管理'],['oplog.view','查看操作日志'],['opinion.assess','意见 AI 评估'],['password.view','查看密码字段']]},
];
// 各角色默认授权集合
const GRANT={
  admin:new Set(PERMS.flatMap(p=>p.items.map(i=>i[0]))),
  manager:new Set(['dashboard.view','customer.view','meeting.view','warning.view','qa.view','analysis.view','demand.view','customer.edit','meeting.edit','warning.edit','knowledge.rebuild','task.notify']),
  viewer:new Set(['dashboard.view','customer.view','meeting.view','warning.view','qa.view','analysis.view','demand.view']),
};
let curRole='admin';

/* ---------- 渲染：用户表 ---------- */
function initials(n){return n.slice(0,1)}
function renderUsers(){
  const box=document.getElementById('rows'); box.innerHTML='';
  const list=users.filter(u=>(filterRole==='all'||u.role===filterRole)
    && (u.name.includes(kw)||u.login.includes(kw)||u.dept.includes(kw)));
  if(!list.length){box.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:34px">没有匹配的用户</td></tr>';return;}
  list.forEach(u=>{
    const c=AVCOLORS[u.id%AVCOLORS.length];
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><div class="user"><div class="avatar" style="background:${c}">${initials(u.name)}</div>
        <div><div class="uname">${u.name}</div><div class="ulogin mono">@${u.login}</div></div></div></td>
      <td>${u.dept}</td>
      <td><span class="role ${u.role}">${ROLE_NAME[u.role]}</span></td>
      <td><span class="pill ${u.active?'on':'off'}"><span class="dot"></span>${u.active?'启用':'停用'}</span></td>
      <td class="mono" style="color:var(--muted)">${u.last}</td>
      <td><div class="rowact">
        <button class="act" title="编辑" onclick="openUser(${u.id})">✎</button>
        <button class="act" title="重置密码" onclick="toast('已向 ${u.name} 发送重置密码')">⟳</button>
        <button class="act danger" title="删除" onclick="delUser(${u.id})">🗑</button>
      </div></td>`;
    box.appendChild(tr);
  });
}

/* ---------- 渲染：角色 + 权限矩阵 ---------- */
function renderRoles(){
  const box=document.getElementById('rolelist'); box.innerHTML='';
  roles.forEach(r=>{
    const d=document.createElement('div');
    d.className='rolecard'+(r.code===curRole?' on':'');
    d.onclick=()=>{curRole=r.code;renderRoles();renderPerms();};
    d.innerHTML=`<div class="rn">${r.name} <span class="cnt">${r.count} 人</span></div>
      <div class="rc">${r.desc}</div>
      <div style="margin-top:9px">${r.builtin?'<span class="tag-builtin">内置</span>':''}</div>`;
    box.appendChild(d);
  });
  const r=roles.find(x=>x.code===curRole);
  document.getElementById('mrole').textContent=r.name+' · 权限';
  document.getElementById('mdesc').textContent=r.desc;
}
function renderPerms(){
  const box=document.getElementById('permbox'); box.innerHTML='';
  const grant=GRANT[curRole], locked=(curRole==='admin');
  PERMS.forEach(group=>{
    const g=document.createElement('div'); g.className='permgroup';
    g.innerHTML=`<div class="gt">${group.g}</div>`;
    const grid=document.createElement('div'); grid.className='perms';
    group.items.forEach(([code,label])=>{
      const on=grant.has(code);
      const el=document.createElement('div'); el.className='perm';
      el.innerHTML=`<div><div class="pt">${label}</div><code>${code}</code></div>
        <div class="cbx ${on?'ck':''}">✓</div>`;
      const cb=el.querySelector('.cbx');
      cb.onclick=()=>{
        if(locked){toast('管理员默认拥有全部权限，不可取消');return;}
        if(grant.has(code)){grant.delete(code);cb.classList.remove('ck');}
        else{grant.add(code);cb.classList.add('ck');}
      };
      grid.appendChild(el);
    });
    g.appendChild(grid); box.appendChild(g);
  });
}

/* ---------- 选项卡 ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  const p=t.dataset.pane;
  document.getElementById('pane-users').hidden=(p!=='users');
  document.getElementById('pane-roles').hidden=(p!=='roles');
});

/* ---------- 过滤 ---------- */
document.getElementById('roleFilter').onclick=e=>{
  const b=e.target.closest('.fchip'); if(!b)return;
  document.querySelectorAll('#roleFilter .fchip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filterRole=b.dataset.r; renderUsers();
};
document.getElementById('q').oninput=e=>{kw=e.target.value.trim();renderUsers();};

/* ---------- 用户弹窗 ---------- */
let editId=null;
function openUser(id){
  editId=id||null;
  const m=document.getElementById('userModal');
  document.getElementById('umTitle').textContent=id?'编辑用户':'新增用户';
  document.getElementById('pwLabel').textContent=id?'重置密码（留空则不改）':'初始密码';
  if(id){const u=users.find(x=>x.id===id);
    f_name.value=u.name;f_login.value=u.login;f_dept.value=u.dept;f_role.value=u.role;f_active.checked=u.active;f_pw.value='';
  }else{f_name.value='';f_login.value='';f_dept.value='';f_role.value='manager';f_active.checked=true;f_pw.value='';}
  m.classList.add('show');
}
function closeUser(){document.getElementById('userModal').classList.remove('show');}
function saveUser(){
  const name=f_name.value.trim(), login=f_login.value.trim();
  if(!name||!login){toast('请填写姓名和登录名');return;}
  if(editId){const u=users.find(x=>x.id===editId);Object.assign(u,{name,login,dept:f_dept.value.trim()||'—',role:f_role.value,active:f_active.checked});toast('已保存 ✓');}
  else{users.unshift({id:Date.now(),name,login,dept:f_dept.value.trim()||'—',role:f_role.value,active:f_active.checked,last:'从未登录'});toast('用户已创建 ✓');}
  closeUser();renderUsers();
}
function delUser(id){const u=users.find(x=>x.id===id);if(confirm(`确定删除用户「${u.name}」？该操作会解除其所有权限。`)){users=users.filter(x=>x.id!==id);renderUsers();toast('已删除');}}
document.getElementById('userModal').addEventListener('click',e=>{if(e.target.id==='userModal')closeUser();});

/* ---------- 主题 ---------- */
const tb=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);tb.textContent=t==='dark'?'🌙':'☀️';try{localStorage.setItem('ua-theme',t)}catch(e){}}
tb.onclick=()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
(function(){let t='dark';try{t=localStorage.getItem('ua-theme')||'dark'}catch(e){}applyTheme(t);})();

/* ---------- toast ---------- */
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1900);}

renderUsers();renderRoles();renderPerms();
</script>
