    // 配置角色可见页面 + 可编辑模块
    async openRolePagePerms(rid, code) {
        if (code === 'admin') { alert('管理员拥有全部权限，无需配置'); return; }
        Modal.open('<div class="loading">加载中…</div>');
        const res = await API.get('/api/permissions/pages');
        const rp = await API.get(`/api/roles/${rid}/permissions`);
        const pages = (res && res.pages) || [];
        const edits = (res && res.edits) || [];
        if (!pages.length || !rp || !rp.success) { Modal.open('<div class="empty-state">加载失败</div>'); return; }
        const name = (rp.role && rp.role.name) || code;
        const cur = new Set(rp.permissions || []);
        const cb = (cls, p) => `
            <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;cursor:pointer;">
                <input type="checkbox" class="${cls}" value="${p.perm}" ${cur.has(p.perm) ? 'checked' : ''}>
                ${Utils.esc(p.name)}
            </label>`;
        const pageHtml = pages.map(p => cb('rpp-cb', p)).join('');
        const editHtml = edits.map(p => cb('rpp-eb', p)).join('');
        Modal.open(`
            <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;">
                <h3 style="margin:0;">配置角色权限 · ${Utils.esc(name)}</h3>
                <button class="modal-close" onclick="Modal.close()">&times;</button>
            </div>
            <div style="font-size:12px;color:var(--text-muted);margin:6px 0 10px;">勾选该角色能访问的业务页面与可编辑的模块（新增/修改/删除）。保存后，该角色下所有成员登录后即生效。</div>
            <div style="font-weight:700;font-size:12px;color:var(--text-muted);margin:0 0 4px;">可见页面</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px 20px;max-height:200px;overflow:auto;border:1px solid var(--border-card);border-radius:8px;padding:12px;">
                ${pageHtml || '<div class="empty-state">无可配置页面</div>'}
            </div>
            <div style="font-weight:700;font-size:12px;color:var(--text-muted);margin:10px 0 4px;">可编辑模块</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px 20px;max-height:160px;overflow:auto;border:1px solid var(--border-card);border-radius:8px;padding:12px;">
                ${editHtml || '<div class="empty-state">无可配置模块</div>'}
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end;">
                <button class="btn btn-sm btn-secondary" onclick="document.querySelectorAll('.rpp-cb').forEach(c=>c.checked=true)">页面全选</button>
                <button class="btn btn-sm btn-primary" id="rpp-save">保存</button>
            </div>`);
        document.getElementById('rpp-save').onclick = async () => {
            const picked = [...document.querySelectorAll('.rpp-cb:checked,.rpp-eb:checked')].map(c => c.value);
            // 保留勾选清单之外的其他权限点（demand.delete/qa.import 等定制点），避免保存时误删
            const listed = new Set([...pages, ...edits].map(p => p.perm));
            const keep = [...cur].filter(p => !listed.has(p));
            const res = await API.put(`/api/roles/${rid}/permissions`, { permissions: [...picked, ...keep] });
            if (res && res.success) { Toast.success('角色权限已保存'); Modal.close(); this.loadRoles(); }
            else Toast.error((res && res.message) || '保存失败');
        };
    },

    async openEdit(id) {
        let u = {};
        if (id) {
            const list = await API.get('/api/users');
            u = (list || []).find(x => x.id === id) || {};
        }
        const roles = await API.get('/api/roles');
        const roleOpts = (roles || []).map(r =>
            `<option value="${r.id}" ${u.role_id == r.id ? 'selected' : ''}>${Utils.esc(r.name)} (${Utils.esc(r.code)})</option>`).join('');
        Modal.open(`
            <h3>${id ? '编辑用户' : '新增用户'}</h3>
            <div class="form-group"><label>用户名 ${id ? '' : '<span class="req">*</span>'}</label>
                <input type="text" id="psa-username" value="${Utils.esc(u.username || '')}" ${id ? 'readonly' : 'placeholder="登录用户名（可填工号）"'}></div>
            <div class="form-group"><label>姓名</label><input type="text" id="psa-name" value="${Utils.esc(u.name || '')}" placeholder="姓名"></div>
            <div class="form-group"><label>密码 ${id ? '(留空不改)' : '<span class="req">*</span>'}</label>
                <input type="password" id="psa-password" value="${id ? '' : '123456'}" autocomplete="new-password" placeholder="${id ? '留空不修改' : '初始密码'}"></div>
            <div class="form-group"><label>角色</label><select id="psa-role">${roleOpts}</select></div>
            <div class="form-group"><label>部门</label><input type="text" id="psa-dept" value="${Utils.esc(u.department || '')}" placeholder="部门"></div>
            <div class="form-group"><label>职位</label><input type="text" id="psa-pos" value="${Utils.esc(u.position || '')}" placeholder="职位"></div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="psa-save">保存</button>
            </div>`);
        document.getElementById('psa-save').onclick = () => this.save(id);
    },

    async save(id) {
        const data = {
            username: document.getElementById('psa-username').value.trim(),
            name: document.getElementById('psa-name').value.trim(),
            password: document.getElementById('psa-password').value.trim(),
            role_id: parseInt(document.getElementById('psa-role').value),
            department: document.getElementById('psa-dept').value.trim(),
            position: document.getElementById('psa-pos').value.trim(),
        };
        if (!id && !data.username) { Toast.error('用户名不能为空'); return; }
        const res = id
            ? await API.put(`/api/users/${id}`, data)
            : await API.post('/api/users', data);
        if (res && (res.id || res.success)) {
            Toast.success(id ? '已更新' : '已创建');
            Modal.close();
            this.loadUsers();
            this.loadAll();
        } else {
            Toast.error((res && res.message) || '操作失败');
        }
    },

    async toggleActive(id) {
        const res = await API.put(`/api/users/${id}/toggle-active`, {});
        if (res && res.success) {
            Toast.success(res.is_active ? '已启用' : '已停用');
            this.loadUsers();
            this.loadAll();
        }
    },

    async del(id) {
        if (!confirm('确定删除该用户？')) return;
        const res = await API.del(`/api/users/${id}`);
        if (res && res.success) { Toast.success('已删除'); this.loadUsers(); this.loadAll(); }
    }
};
</script>

<!-- /static/js/pages/page_contract.js -->
<script>
/**
 * 页面12 - 合同管理（台账 + 统计可视化 + 导入导出）
 */
const PageContract = {
    initialized: false,

    init() {
        const container = document.getElementById('page12');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.loadList();
        this.loadStats();
    },

    renderLayout() {
        const canEdit = App.hasPerm('contract.edit');
        return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
            <div style="font-size:15px;color:var(--text-secondary);">合同台账 · 统计${canEdit ? ' · 导入导出' : ''}</div>
            <div style="display:flex;gap:8px;">
                ${canEdit ? `<button class="btn btn-sm btn-secondary" id="pcImport">⬆ 导入</button>` : ''}
                <button class="btn btn-sm btn-secondary" id="pcExport">⬇ 导出</button>
                ${canEdit ? `<button class="btn btn-sm btn-primary" id="pcAdd">+ 新增合同</button>` : ''}
            </div>
        </div>
        <div id="pcStats" style="margin-bottom:20px;"></div>
        <div class="filter-bar" style="margin-bottom:12px;">
            <div class="form-group"><label>客户</label><select id="pcOem">${this.customerOptions('')}</select></div>
            <div class="form-group"><label>状态</label><select id="pcStatus">
                <option value="">全部</option><option>执行中</option><option>已完结</option><option>已终止</option><option>待签</option>
            </select></div>
            <div class="form-group"><label>搜索</label><input type="text" id="pcKw" placeholder="合同编号/名称/对方公司"></div>
            <button class="btn btn-sm btn-primary" id="pcSearch">查询</button>
        </div>
        <div id="pcList"></div>`;
    },

    // 客户下拉 options（复用全局 App.customers；选中值 = oem，显示「中文名(oem)」）
    customerOptions(selected) {
        const opts = (App.customers || []).map(c =>
            `<option value="${Utils.esc(c.oem)}" ${c.oem === selected ? 'selected' : ''}>${Utils.esc(c.oem_ch || c.name_cn || c.oem)} (${Utils.esc(c.oem)})</option>`).join('');
        return `<option value="">全部客户</option>${opts}`;
    },

    // 根据 oem 反查客户显示名（下拉里也可能存在「未指定」等自由文本）
    oemLabel(oem) {
        if (!oem) return '-';
        const c = (App.customers || []).find(x => x.oem === oem);
        return c ? (c.oem_ch || c.name_cn || c.oem) : Utils.esc(oem);
    },

    // 金额友好显示：≥1万 转「x.x万」，可加币种前缀
    fmtAmount(amount, currency) {
        const n = Number(amount);
        if (!amount || isNaN(n) || n === 0) return '-';
        const cur = (currency || '').toUpperCase() === 'CNY' ? '¥' : (currency ? currency + ' ' : '');
        const abs = Math.abs(n);
        const str = abs >= 10000 ? (n / 10000).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + '万' : n.toLocaleString('zh-CN');
        return `${cur}${str}`;
    },

    // 距指定日期的天数（本地时区，避免 ISO 字符串按 UTC 解析差 1 天）
    daysUntil(dateStr) {
        if (!dateStr) return null;
        const d = new Date(dateStr.replace(/-/g, '/') + ' 00:00:00');
        if (isNaN(d)) return null;
        const today = new Date();
        const x = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        return Math.round((d - x) / 86400000);
    },

    bindEvents() {
        const addBtn = document.getElementById('pcAdd');
        if (addBtn) addBtn.onclick = () => this.openEdit(null);
        document.getElementById('pcSearch').onclick = () => this.loadList();
        document.getElementById('pcExport').onclick = () => { Toast.info('正在生成下载文件...'); window.location.href = '/api/contracts/export'; };
        const imp = document.getElementById('pcImport');
        if (imp) imp.onclick = () => this.importFile();
        document.getElementById('pcOem').onchange = document.getElementById('pcStatus').onchange = () => this.loadList();
        document.getElementById('pcKw').oninput = () => { clearTimeout(this._searchTimer); this._searchTimer = setTimeout(() => this.loadList(), 300); };
    },

    async loadList() {
        const box = document.getElementById('pcList');
        const oem = document.getElementById('pcOem').value;
        const status = document.getElementById('pcStatus').value;
        const kw = document.getElementById('pcKw').value.trim();
        box.innerHTML = '<div class="loading">加载中...</div>';
        let url = '/api/contracts?';
        if (oem) url += `oem=${encodeURIComponent(oem)}&`;
        if (status) url += `status=${encodeURIComponent(status)}&`;
        if (kw) url += `kw=${encodeURIComponent(kw)}&`;
        const data = await API.get(url);
        if (!data || !data.length) {
            box.innerHTML = '<div class="empty-state">暂无合同记录</div>';
            return;
        }
        // 拆分主合同 / 子合同：默认列表只展示主合同(parent_id为空)，子合同按展开显示
        this._contractData = data;
        const mains = data.filter(c => !c.parent_id);
        const trs = mains.map(c => this._renderContractRow(c, false)).join('');
        box.innerHTML = `<div class="card"><div class="table-wrapper"><table id="pcTable">
            <thead><tr><th>合同编号</th><th>合同名称</th><th>客户</th><th>类型</th><th>签订日期</th><th>到期日期</th><th>金额</th><th>重要事项</th><th>状态</th><th>对方公司</th><th data-no-sort>原合同</th><th data-no-sort>操作</th></tr></thead>
            <tbody id="pcTbody">${trs}</tbody>
        </table></div></div>`;
        Utils.enableTableSort(document.getElementById('pcTable'));
    },

    _renderContractRow(c, isSub) {
        const statusBadge = {'执行中':'badge-success','已完结':'badge-info','已终止':'badge-danger','待签':'badge-warning'}[c.status] || 'badge-secondary';
        const amt = this.fmtAmount(c.amount, c.currency);
        const daysLeft = c.end_date ? this.daysUntil(c.end_date) : null;
        const expiry = daysLeft !== null && daysLeft >= 0 && daysLeft <= 30
            ? `<span class="badge ${daysLeft === 0 ? 'badge-danger' : 'badge-warning'}" title="${daysLeft === 0 ? '今天到期' : daysLeft + '天后到期'}">${daysLeft === 0 ? '今天到期' : daysLeft + '天后到期'}</span>` : '';
        const expired = daysLeft !== null && daysLeft < 0;
        const expiryBadge = expired ? '<span class="badge badge-danger" title="已到期">已到期</span>' : expiry;
        const indent = isSub ? 'style="background:var(--panel-2);"' : '';
        const prefix = isSub ? '<span style="color:var(--text-muted);margin-right:4px;">└─</span>' : '';
        const expandBtn = (!isSub && c.sub_count > 0)
            ? `<button class="btn btn-sm btn-secondary" style="padding:1px 6px;" onclick="PageContract.toggleSubs(${c.id})" id="pc-exp-${c.id}">▶ ${c.sub_count}</button>` : '';
        return `<tr ${indent} ${isSub ? `data-parent="${c.parent_id}" data-parent-id="${c.parent_id}" class="pc-sub pc-sub-${c.parent_id}" style="display:none;background:var(--panel-2);"` : `id="pc-row-${c.id}"`}>
            <td class="mono" style="font-size:12px;">${prefix}${Utils.esc(c.contract_no)}</td>
            <td style="max-width:300px;"><div style="display:flex;align-items:center;gap:4px;min-width:0;"><strong class="cell-ellipsis" style="min-width:0;" title="${Utils.esc(c.title)}">${Utils.esc(c.title)}</strong> ${expandBtn}</div></td>
            <td title="${Utils.esc(c.oem)}" data-sort-value="${Utils.esc(c.oem || '')}">${this.oemLabel(c.oem)}</td>
            <td>${Utils.esc(c.contract_type) || '-'}</td>
            <td>${Utils.formatDate(c.sign_date)}</td>
            <td>${Utils.formatDate(c.end_date)} ${expiryBadge}</td>
            <td class="mono" style="text-align:right;" data-sort-value="${c.amount || 0}">${amt}</td>
            <td class="cell-ellipsis" title="${Utils.esc(c.important_notes)}" style="max-width:260px;">${Utils.esc(c.important_notes) || '<span style="color:var(--text-muted);">-</span>'}</td>
            <td><span class="badge ${statusBadge}">${Utils.esc(c.status)}</span></td>
            <td class="cell-ellipsis" title="${Utils.esc(c.their_company)}">${Utils.esc(c.their_company) || '-'}</td>
            <td>${c.has_file ? '<a href="javascript:;" class="btn btn-sm btn-secondary" onclick="PageContract.viewFile(' + c.id + ')" title="查看原合同">📄 原合同</a>' : (App.hasPerm('contract.edit') ? `<a href="javascript:;" class="btn btn-sm btn-secondary" style="font-size:11px;" onclick="PageContract.uploadFile(${c.id})">📎 上传</a>` : '<span style="color:var(--text-muted);font-size:11px;">-</span>')}</td>
            <td class="actions">
                ${App.hasPerm('customer.edit') ? `<button class="btn btn-sm btn-secondary" onclick="PageContract.openEdit(${c.id})">编辑</button>
                <button class="btn btn-sm btn-danger" onclick="PageContract.del(${c.id})">删</button>` : '<span style="color:var(--text-muted);font-size:11px;">只读</span>'}
            </td>
        </tr>`;
    },

    toggleSubs(parentId) {
        const btn = document.getElementById(`pc-exp-${parentId}`);
        const subs = document.querySelectorAll(`.pc-sub-${parentId}`);
        const expanded = btn && btn.textContent.startsWith('▼');
        subs.forEach(tr => { tr.style.display = expanded ? 'none' : ''; });
        if (btn) btn.textContent = (expanded ? '▶' : '▼') + ' ' + (btn.textContent.replace(/^[▶▼]\s*/, ''));
    },

    async uploadFile(id) {
        Utils.pickFiles({
            onPicked: async (files) => {
                const fd = new FormData();
                fd.append('file', files[0]);
                Toast.info('正在上传...');
                const res = await API.upload(`/api/contracts/${id}/file`, fd);
                if (res && res.success) { Toast.success('附件已导入'); this.loadList(); this.loadStats(); }
                else Toast.error((res && res.error) || '导入失败');
            }
        });
    },

    async loadStats() {
        const box = document.getElementById('pcStats');
        const s = await API.get('/api/contracts/stats');
        if (!s) return;
        const amtStr = s.total_amount ? this.fmtAmount(s.total_amount, 'CNY') : '0';
        // 统计块
        const tiles = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
            <div class="card stat-card" style="padding:16px 17px;position:relative;">
                <div class="tile-icon brand" style="position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(100,210,255,0.12);color:var(--accent);">📋</div>
                <div class="stat-label">合同总数</div><div class="stat-value" style="margin-top:8px;">${s.total}</div>
            </div>
            <div class="card stat-card" style="padding:16px 17px;position:relative;">
                <div class="tile-icon info" style="position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(116,192,252,0.12);color:var(--info);">💰</div>
                <div class="stat-label">合同总额</div><div class="stat-value" style="margin-top:8px;">${amtStr}</div>
            </div>
            <div class="card stat-card" style="padding:16px 17px;position:relative;">
                <div class="tile-icon warn" style="position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(255,169,77,0.12);color:var(--warning);">⏳</div>
                <div class="stat-label">执行中</div><div class="stat-value" style="margin-top:8px;">${(s.by_status||[]).find(x=>x.label==='执行中')?.value||0}</div>
            </div>
            <div class="card stat-card" style="padding:16px 17px;position:relative;">
                <div class="tile-icon danger" style="position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(255,107,107,0.12);color:var(--danger);">✅</div>
                <div class="stat-label">已完结</div><div class="stat-value" style="margin-top:8px;">${(s.by_status||[]).find(x=>x.label==='已完结')?.value||0}</div>
            </div>
        </div>`;
        // 按类型饼图 + 按客户柱状图
        const typePie = this.renderPie(s.by_type || [], '按类型金额分布');
        const oemBar = this.renderBar(s.by_oem || [], '按客户金额 Top10');
        box.innerHTML = tiles + `<div class="grid g-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;">
            <div class="card"><div class="card-title" style="padding:15px 17px;border-bottom:1px solid var(--border-row);"><h3 style="font-size:15px;font-weight:800;margin:0;">按类型金额分布</h3></div><div style="padding:16px 17px;">${typePie}</div></div>
            <div class="card"><div class="card-title" style="padding:15px 17px;border-bottom:1px solid var(--border-row);"><h3 style="font-size:15px;font-weight:800;margin:0;">按客户金额 Top10</h3></div><div style="padding:16px 17px;">${oemBar}</div></div>
        </div>`;
    },

    renderPie(data, title) {
        if (!data || !data.length) return '<p class="empty-state">暂无数据</p>';
        const total = data.reduce((s, d) => s + d.value, 0) || 1;
        const R = 70, CX = 90, CY = 80;
        const colors = ['#4f8cff','#34d399','#fbbf24','#f472b6','#a78bfa','#38bdf8','#fb7185','#2dd4bf'];
        let arc = '', angleStart = -Math.PI / 2;
        data.forEach((d, i) => {
            const frac = d.value / total;
            const angleEnd = angleStart + frac * 2 * Math.PI;
            const large = frac > 0.5 ? 1 : 0;
            const x1 = CX + R * Math.cos(angleStart), y1 = CY + R * Math.sin(angleStart);
            const x2 = CX + R * Math.cos(angleEnd), y2 = CY + R * Math.sin(angleEnd);
            arc += `<path d="M${CX},${CY} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${colors[i % colors.length]}"><title>${Utils.esc(d.label)}: ${Number(d.value).toLocaleString()} (${(frac*100).toFixed(1)}%)</title></path>`;
            angleStart = angleEnd;
        });
        const legend = data.map((d, i) => `<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:4px;">
            <span style="width:10px;height:10px;border-radius:2px;background:${colors[i % colors.length]};display:inline-block;"></span>
            ${Utils.esc(d.label)}: <strong>${Number(d.value).toLocaleString()}</strong></div>`).join('');
        return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
            <svg width="180" height="160" viewBox="0 0 180 160">${arc}</svg>
            <div>${legend}</div></div>`;
    },

    renderBar(data, title) {
        if (!data || !data.length) return '<p class="empty-state">暂无数据</p>';
        const maxVal = Math.max(...data.map(d => d.value), 1);
        const bars = data.map(d => {
            const h = Math.round(d.value / maxVal * 100);
            const lbl = d.value >= 10000 ? (d.value / 10000).toFixed(1) + '万' : String(d.value);
            return `<div class="bar" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;">
                <div class="col" style="width:100%;max-width:30px;height:${h}%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent));position:relative;">
                    <span style="position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;">${lbl}</span>
                </div>
                <div style="color:var(--text-muted);font-size:10px;font-weight:600;text-align:center;writing-mode:vertical-rl;">${Utils.esc(String(d.label).slice(0,6))}</div>
            </div>`;
        }).join('');
        return `<div class="bars" style="display:flex;align-items:flex-end;gap:8px;height:140px;padding:8px 4px 0;">${bars}</div>`;
    },

    async openEdit(id) {
        let c = {};
        if (id) {
            const list = await API.get('/api/contracts');
            c = (list || []).find(x => x.id === id) || {};
        }
        const oemOpts = '<option value="">请选择客户</option>' + (App.customers || []).map(o => `<option value="${o.oem}" ${o.oem === c.oem ? 'selected' : ''}>${Utils.esc(o.oem_ch || o.name_cn || o.oem)} (${Utils.esc(o.oem)})</option>`).join('');
        // 主合同下拉：列出已有主合同(parent_id为空)，排除自身
        const mains = (this._contractData || []).filter(x => !x.parent_id && x.id !== id);
        // 主合同 id -> 显示文本（合同编号 | 标题）；用于归属输入框 datalist + 反查
        // 用 " | " 分隔便于按编号或标题模糊匹配；编号放最前，datalist 前缀匹配友好
        this._parentMap = {};
        this._parentMains = mains;  // 保留原始数据用于模糊匹配
        mains.forEach(m => {
            const no = m.contract_no || '';
            const title = m.title || '';
            const label = no && title ? `${no} | ${title}` : (no || title);
            this._parentMap[m.id] = label;
        });
        const parentList = mains.map(m => `<option value="${Utils.esc(this._parentMap[m.id])}">`).join('');
        const parentInputVal = c.parent_id ? (this._parentMap[c.parent_id] || '') : '';
        const fileHtml = id && c.has_file
            ? `<div style="font-size:12px;color:var(--text-secondary);">当前附件：${Utils.esc(c.file_name || '')} <a href="javascript:;" onclick="PageContract.viewFile(${id})">查看</a></div>`
            : (id ? '<div style="font-size:12px;color:var(--text-muted);">暂无附件，保存后可点击列表"📎 上传"</div>' : '');
        Modal.open(`<h3>${id ? '编辑合同' : '新增合同'}</h3>
        <div class="form-group"><label>合同编号 *</label><input type="text" id="pc-no" value="${Utils.esc(c.contract_no)}" placeholder="如：CATL-2026-001"></div>
        <div class="form-group"><label>合同名称 *</label><input type="text" id="pc-title" value="${Utils.esc(c.title)}" placeholder="合同名称"></div>
        <div class="form-row" style="display:flex;gap:12px;">
            <div class="form-group" style="flex:1;"><label>客户</label><select id="pc-oem2">${oemOpts}</select></div>
            <div class="form-group" style="flex:1;"><label>归属</label>
                <input type="text" id="pc-parent-input" list="pc-parent-list" value="${Utils.esc(parentInputVal)}" placeholder="主合同（默认），可输入编号/名称搜索">
                <datalist id="pc-parent-list">${parentList}</datalist>
                <input type="hidden" id="pc-parent" value="${c.parent_id || ''}">
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">留空或清空 = 主合同；输入可选择挂在某主合同下</div>
            </div>
        </div>
        <div class="form-row" style="display:flex;gap:12px;">
            <div class="form-group" style="flex:1;"><label>类型</label><select id="pc-type">
                ${['采购','服务','质保','技术','其他'].map(t => `<option value="${t}" ${c.contract_type===t?'selected':''}>${t}</option>`).join('')}
            </select></div>
            <div class="form-group" style="flex:1;"><label>状态</label><select id="pc-status2">
                ${['执行中','已完结','已终止','待签'].map(t => `<option value="${t}" ${c.status===t?'selected':''}>${t}</option>`).join('')}
            </select></div>
        </div>
        <div class="form-row" style="display:flex;gap:12px;">
            <div class="form-group" style="flex:1;"><label>签订日期</label><input type="date" id="pc-sign" value="${c.sign_date ? String(c.sign_date).substring(0,10) : ''}"></div>
            <div class="form-group" style="flex:1;"><label>生效日期</label><input type="date" id="pc-start" value="${c.start_date ? String(c.start_date).substring(0,10) : ''}"></div>
            <div class="form-group" style="flex:1;"><label>到期日期</label><input type="date" id="pc-end" value="${c.end_date ? String(c.end_date).substring(0,10) : ''}"></div>
        </div>
        <div class="form-row" style="display:flex;gap:12px;">
            <div class="form-group" style="flex:1;"><label>金额(元)</label><input type="number" id="pc-amount" value="${c.amount || ''}" placeholder="0"></div>
            <div class="form-group" style="flex:1;"><label>币种</label><input type="text" id="pc-currency" value="${Utils.esc(c.currency || 'CNY')}"></div>
        </div>
        <div class="form-row" style="display:flex;gap:12px;">
            <div class="form-group" style="flex:1;"><label>对方公司</label><input type="text" id="pc-their-co" value="${Utils.esc(c.their_company)}" placeholder="对方公司全称"></div>
            <div class="form-group" style="flex:1;"><label>对方签约人</label><input type="text" id="pc-their-signer" value="${Utils.esc(c.their_signer)}"></div>
        </div>
        <div class="form-group"><label>付款条款</label><input type="text" id="pc-payment" value="${Utils.esc(c.payment_terms)}" placeholder="如：预付30%，验收后70%"></div>
        <div class="form-group"><label>重要事项</label><textarea id="pc-important" rows="2" placeholder="合同价值、风险、续约要点等">${Utils.esc(c.important_notes)}</textarea></div>
        <div class="form-group"><label>备注</label><textarea id="pc-remark" rows="2">${Utils.esc(c.remark)}</textarea></div>
        ${fileHtml ? `<div class="form-group"><label>合同附件</label>${fileHtml}</div>` : ''}
        <div style="text-align:right;"><button class="btn btn-secondary" onclick="Modal.close()">取消</button> <button class="btn btn-primary" id="pc-save">保存</button></div>`);
        document.getElementById('pc-save').onclick = () => this.save(id);
        // 归属输入框：根据输入文本反查 id 同步隐藏字段（清空 = 主合同）
        const parentInput = document.getElementById('pc-parent-input');
        if (parentInput) {
            parentInput.oninput = () => {
                const val = parentInput.value.trim();
                const hidden = document.getElementById('pc-parent');
                if (!val) { hidden.value = ''; return; }
                // 1) 精确匹配 datalist 值 → 直接命中 id
                let hitId = Object.keys(this._parentMap || {}).find(id => this._parentMap[id] === val);
                if (hitId) { hidden.value = hitId; return; }
                // 2) 模糊匹配：按合同编号或标题"包含"查找，命中唯一结果时自动填 id
                //    （多结果时不自动选，避免误填；用户需进一步输入或从下拉选）
                const lower = val.toLowerCase();
                const hits = (this._parentMains || []).filter(m => {
                    const no = (m.contract_no || '').toLowerCase();
                    const title = (m.title || '').toLowerCase();
                    return no.includes(lower) || title.includes(lower);
                });
                if (hits.length === 1) {
                    hidden.value = hits[0].id;
                    // 自动补全显示文本（让用户看到选中了哪条）
                    if (parentInput.value !== this._parentMap[hits[0].id]) {
                        parentInput.value = this._parentMap[hits[0].id];
                    }
                } else {
                    // 0 或多结果：清空 id，等用户继续输入或从下拉选
                    hidden.value = '';
                }
            };
        }
    },

    async save(id) {
        const data = {
            contract_no: document.getElementById('pc-no').value.trim(),
            title: document.getElementById('pc-title').value.trim(),
            oem: document.getElementById('pc-oem2').value,
            parent_id: document.getElementById('pc-parent').value || null,
            contract_type: document.getElementById('pc-type').value,
            status: document.getElementById('pc-status2').value,
            sign_date: document.getElementById('pc-sign').value,
            start_date: document.getElementById('pc-start').value,
            end_date: document.getElementById('pc-end').value,
            amount: parseFloat(document.getElementById('pc-amount').value) || 0,
            currency: document.getElementById('pc-currency').value.trim() || 'CNY',
            their_company: document.getElementById('pc-their-co').value.trim(),
            their_signer: document.getElementById('pc-their-signer').value.trim(),
            payment_terms: document.getElementById('pc-payment').value.trim(),
            important_notes: document.getElementById('pc-important').value.trim(),
            remark: document.getElementById('pc-remark').value.trim(),
        };
        if (!data.title) { Toast.error('合同名称不能为空'); return; }
        const res = id ? await API.put(`/api/contracts/${id}`, data) : await API.post('/api/contracts', data);
        if (res && (res.id || res.success)) {
            Toast.success(id ? '已更新' : '已创建');
            Modal.close();
            this.loadList();
            this.loadStats();
        } else { Toast.error('保存失败'); }
    },

    async del(id) {
        if (!confirm('确定删除该合同？')) return;
        const res = await API.del(`/api/contracts/${id}`);
        if (res && res.success) { Toast.success('已删除'); this.loadList(); this.loadStats(); }
    },

    async viewFile(id) {
        // 取文件信息（含真实的文件名/类型/大小/预览URL）
        const info = await API.get(`/api/contracts/${id}/file-info`);
        if (!info) return;
        if (!info.has_file) {
            Toast.info((info.message) || '该合同无附件');
            return;
        }
        // 共享盘引用且服务器无法代理：引导 file:// 直连（内网资源管理器打开）
        if (info.unc_only) {
            const name = Utils.esc(info.file_name);
            const path = Utils.esc(info.file_path);
            const link = Utils.esc(info.unc_link);
            Modal.open(`<h3>📄 原合同 · ${name}</h3>
            <div style="margin:14px 0;display:flex;gap:8px;flex-wrap:wrap;">
                <a href="${link}" target="_blank" class="btn btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">📂 在资源管理器打开</a>
                <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${path}').then(()=>{Toast.success('已复制路径')})">📋 复制共享路径</button>
            </div>
            <div style="font-size:13px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:10px 12px;">
                该附件为公司共享盘（NAS）文件，当前服务器无法代理预览/下载。<br>
                请在<b>内网环境</b>点击上方按钮直接访问，或复制路径到资源管理器打开。
            </div>
            <div class="form-group" style="margin-top:12px;"><label>共享路径（UNC）</label>
                <div style="padding:8px;word-break:break-all;font-family:var(--font-mono);font-size:12px;background:var(--bg);border-radius:8px;">${path}</div>
            </div>
            <div style="text-align:right;"><button class="btn btn-secondary" onclick="Modal.close()">关闭</button></div>`);
            return;
        }
        const name = Utils.esc(info.file_name);
        const path = Utils.esc(info.file_path);
        const link = Utils.esc(info.unc_link);
        const viewUrl = info.view_url || `/api/contracts/${id}/file`;
        const dlUrl = `/api/contracts/${id}/file?download=1`;
        const sizeTxt = info.size ? this.fmtBytes(info.size) : '';
        const extTxt = (info.ext || '').replace('.', '').toUpperCase() || '文件';

        // 内联预览：仅浏览器可渲染的类型（如 PDF）用 iframe；其余提示下载
        let previewHtml = '';
        if (info.can_inline) {
            previewHtml = `
              <div style="position:relative;width:100%;height:560px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);">
                <iframe src="${viewUrl}" style="width:100%;height:100%;border:0;" title="原合同预览"></iframe>
              </div>`;
        } else {
            previewHtml = `
              <div style="padding:28px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--panel-2);">
                <div style="font-size:34px;margin-bottom:8px;">🗂️</div>
                <div style="color:var(--ink-2);font-weight:600;">该文件类型（${extTxt}）不支持浏览器内联预览</div>
                <div style="color:var(--text-muted);font-size:13px;margin:6px 0 18px;">请下载后使用本地对应软件查看。</div>
                <a href="${dlUrl}" class="btn btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">⬇️ 下载原合同</a>
              </div>`;
        }

        Modal.open(`<h3>📄 原合同 · ${name}</h3>
        <div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;">
            <a href="${viewUrl}" target="_blank" class="btn btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">🔍 新标签页查看</a>
            <a href="${dlUrl}" class="btn btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">⬇️ 下载${sizeTxt ? '（' + sizeTxt + '）' : ''}</a>
            <a href="${link}" target="_blank" class="btn btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">📂 在资源管理器打开</a>
            <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${path}').then(()=>{Toast.success('已复制路径')})">📋 复制路径</button>
        </div>
        ${previewHtml}
        <div style="margin:12px 0;">
            <div class="form-group"><label>文件名</label><div style="padding:4px 0;word-break:break-all;">${name}</div></div>
            <div class="form-group"><label>存储路径（UNC）</label>
                <div style="padding:8px;word-break:break-all;font-family:var(--font-mono);font-size:12px;background:var(--bg);border-radius:8px;">${path}</div>
            </div>
            <div style="font-size:12px;color:var(--text-muted);">提示：新标签页查看/资源管理器打开需在内网环境，且须有 NAS 共享权限；预览与下载经服务器代理，无需额外权限。</div>
        </div>
        <div style="text-align:right;"><button class="btn btn-secondary" onclick="Modal.close()">关闭</button></div>`);
    },

    // 字节数格式化
    fmtBytes(n) {
        n = Number(n) || 0;
        if (n < 1024) return n + ' B';
        if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
        if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
        return (n / 1073741824).toFixed(1) + ' GB';
    },

    async importFile() {
        Utils.pickFiles({
            accept: '.xlsx,.xls,.csv',
            onPicked: async (files) => {
                const fd = new FormData();
                fd.append('file', files[0]);
                Toast.info('正在导入...');
                try {
                    const res = await API.upload('/api/contracts/import', fd);
                    if (res && res.success) {
                        Toast.success(`已导入 ${res.added} 条合同`);
                        this.loadList();
                        this.loadStats();
                    } else {
                        Toast.error((res && res.message) || '导入失败');
                    }
                } catch (err) { Toast.error('导入失败'); }
            }
        });
    }
};
</script>

<!-- /static/js/pages/page_devlog.js -->
<script>
/**
 * 页面13 - 项目管理（由"开发日志"演进的 Teambition 风格）
 * 视图：项目树(方向→迭代→大任务→子任务，无限层级) / 按周 / 按责任人 / 待完善池 / 全部
 * 能力：大任务无限拆解、起止时间、优先级、依赖、预估工时、迭代/方向、待完善清单、周报月报导出
 */
const PageDevlog = {
    initialized: false,
    view: 'tree',        // 当前视图：tree | week | owner | todo | all
    _logs: [],           // 全部日志（含 parent_id）
    _todo: [],           // 待完善清单
    _tree: [],           // 项目树（后端聚合）
    _expanded: new Set(), // XMind 式逐层展开：存已展开的 key（方向="dir:名字" / 迭代="iter:方向|迭代" / 节点=数字id）

    init() {
        const container = document.getElementById('page13');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.refresh();
    },

    renderLayout() {
        return `
        <div class="devlog-topbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
            <div style="font-size:15px;color:var(--text-secondary);font-weight:600;">📊 项目管理 · 项目树 / 迭代 / 待完善</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.exportReport('week')">📄 周报</button>
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.exportReport('month')">📅 月报</button>
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.exportTodoMd()">📝 待完善导出</button>
                <span style="width:1px;height:20px;background:var(--border-row);margin:0 2px;"></span>
                <button class="btn btn-sm btn-primary" onclick="PageDevlog.openTodoEdit(null)">✏ 记一条待完善</button>
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.openEdit(null,'milestone')">🎯 里程碑</button>
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.openEdit(null,'meeting')">📝 会议纪要</button>
                <button class="btn btn-sm btn-primary" onclick="PageDevlog.setView('weekly')">🗓 周会</button>
                <button class="btn btn-sm btn-primary" onclick="PageDevlog.openEdit(null,'task')">+ 大任务</button>
            </div>
        </div>

        <div id="dlStats" style="margin-bottom:18px;"></div>

        <!-- 视图切换 -->
        <div style="display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border-row);padding-bottom:10px;flex-wrap:wrap;align-items:center;">
            ${['tree','week','weekly','owner','todo','all','done'].map(v => `
                <button class="btn btn-sm dl-view-tab ${this.view===v?'btn-primary':'btn-secondary'}" data-view="${v}"
                    onclick="PageDevlog.setView('${v}')">${this._viewLabel(v)}</button>`).join('')}
            <span style="flex:1;"></span>
            <span class="sub" style="color:var(--text-muted);font-size:12px;align-self:center;">大任务下可无限拆子任务，按起止时间排布；待完善池记录零散改进点</span>
        </div>

        <div id="dlContent"></div>`;
    },

    _viewLabel(v) {
        return { tree: '🌳 项目树', week: '📅 按周', weekly: '🗓 周会', owner: '👤 按责任人', todo: '✅ 待完善池', all: '📋 全部', done: '🏁 完成记录' }[v] || v;
    },

    setView(v) {
        this.view = v;
        document.querySelectorAll('.dl-view-tab').forEach(b => {
            const on = b.dataset.view === v;
            b.classList.toggle('btn-primary', on);
            b.classList.toggle('btn-secondary', !on);
        });
        this.renderContent();
    },

    bindEvents() {
        this.bindTreeDelegation();
    },

    // 刷新全部：重拉日志 + 项目树 + 待完善 + 统计
    async refresh() {
        this._logs = await API.get('/api/devlogs') || [];
        this._tree = await API.get('/api/devlogs/tree') || [];
        this._todo = await API.get('/api/devlogs/todo') || [];
        this.loadStats();
        this.renderContent();
    },

    // ========== 顶部统计 ==========
    _tile(icon, label, value, color, bg) {
        return `<div class="card stat-card" style="padding:14px 16px;position:relative;">
            <div style="position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:${bg};color:${color};">${icon}</div>
            <div class="stat-label">${label}</div><div class="stat-value" style="margin-top:6px;color:${color};">${value}</div>
        </div>`;
    },

    async loadStats() {
        const box = document.getElementById('dlStats');
        const s = await API.get('/api/devlogs/stats');
        if (!s) return;
        const st = (s.by_status || []).reduce((o, x) => { o[x.label] = x.value; return o; }, {});
        const u = this._todo || [];
        const todoOpen = u.filter(x => ['待完善','进行中','待讨论'].includes(x.status)).length;
        box.innerHTML = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:12px;">`
            + this._tile('📋', '总记录', s.total, 'var(--accent)', 'rgba(100,210,255,.12)')
            + this._tile('⬜', '大/子任务待办', st['待办'] || 0, 'var(--warning)', 'rgba(255,169,77,.12)')
            + this._tile('▶', '进行中', st['进行中'] || 0, 'var(--info)', 'rgba(116,192,252,.12)')
            + this._tile('✅', '已完成', st['已完成'] || 0, 'var(--success)', 'rgba(37,211,102,.12)')
            + this._tile('⚠', '已逾期', s.overdue, 'var(--danger)', 'rgba(255,107,107,.12)')
            + this._tile('✏', '待完善', todoOpen, 'var(--warning)', 'rgba(255,215,120,.12)')
            + this._tile('👤', '责任人', Object.keys(s.by_owner || {}).length, 'var(--text-secondary)', 'rgba(150,200,255,.10)')
            + `</div>`;
    },

    // ========== 内容渲染（按当前视图） ==========
    renderContent() {
        const box = document.getElementById('dlContent');
        const v = this.view;
        box.innerHTML = `<div class="dl-loading" style="color:var(--text-muted);padding:30px;text-align:center;">加载中…</div>`;
        if (v === 'weekly') { this.initWeekly(box); return; }
        if (v === 'tree') this._renderTree(box);
        else if (v === 'week') this._renderWeek(box);
        else if (v === 'owner') this._renderOwner(box);
        else if (v === 'todo') this._renderTodo(box);
        else if (v === 'done') this._renderDone(box);
        else this._renderAll(box);
    },

    // ========== 项目树（方向 → 迭代 → 大任务 → 子任务，无限层级，XMind 式逐层展开） ==========
    async _renderTree(box) {
        const tree = this._tree;
        if (!tree || !tree.length) { box.innerHTML = `<p class="empty-state">暂无项目任务，点击右上角「+ 大任务」开始拆解</p>`; return; }
        const html = tree.map(d => {
            const dKey = 'dir:' + d.name;
            const dOpen = this._expanded.has(dKey);
            const iters = d.iterations || [];
            const iterHtml = iters.map(it => {
                const iKey = 'iter:' + d.name + '|' + it.name;
                const iOpen = this._expanded.has(iKey);
                return `
                <div class="card" style="margin-bottom:12px;">
                    <div data-dkey="${Utils.esc(dKey)}" data-ikey="${Utils.esc(iKey)}" data-kk="1"
                        style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-row);background:var(--bg-card-hover);cursor:pointer;">
                        <span class="dl-toggle" style="display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;border-radius:4px;background:rgba(100,210,255,.12);color:var(--accent);font-size:11px;">${iOpen?'▾':'▸'}</span>
                        <span style="font-size:13px;color:var(--accent-light);font-weight:600;">迭代：${Utils.esc(it.name)}</span>
                        <div style="flex:1;height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden;max-width:160px;">
                            <div style="width:${it.progress}%;height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));border-radius:3px;"></div>
                        </div>
                        <span class="mono" style="font-size:12px;color:var(--text-secondary);">${it.done}/${it.total}</span>
                        <span class="mono" style="font-size:12px;color:var(--text-muted);">${it.progress}%</span>
                    </div>
                    ${iOpen ? `<div>${this._treeNodes(it.tasks || []).join('')}</div>` : ''}
                </div>`;
            }).join('');
            return `<div class="card" style="margin-bottom:14px;border-left:3px solid var(--accent);">
                <div data-dkey="${Utils.esc(dKey)}" data-kk="1"
                    style="display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;">
                    <span class="dl-toggle" style="display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:4px;background:rgba(100,210,255,.14);color:var(--accent);font-size:12px;">${dOpen?'▾':'▸'}</span>
                    <span style="font-size:16px;">${d.name==='未分方向'?'📁':'🗂'}</span>
                    <strong style="flex:1;color:var(--text-primary);font-size:15px;">${Utils.esc(d.name)} <span class="mono" style="font-size:11px;color:var(--text-muted);">(${iters.length} 迭代)</span></strong>
                    <div style="width:130px;height:7px;background:var(--bg-input);border-radius:3px;overflow:hidden;">
                        <div style="width:${d.progress}%;height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));border-radius:3px;"></div>
                    </div>
                    <span class="mono" style="font-size:12px;color:var(--text-secondary);">${d.done}/${d.total}</span>
                    <span class="mono" style="font-size:12px;color:var(--text-muted);">${d.progress}%</span>
                    <span class="badge badge-info" style="font-size:10px;">进行中 ${d.doing||0}</span>
                </div>
                <div style="padding:${dOpen?'10px 12px 10px':'0'};">${dOpen ? iterHtml : ''}</div>
            </div>`;
        }).join('');
        // 顶部：全部展开/收起
        box.innerHTML = `
            <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
                <span style="font-size:12px;color:var(--text-muted);align-self:center;">逐层展开查看（类 XMind）</span>
                <button class="btn btn-sm btn-secondary" data-act="expand">⤵ 全部展开</button>
                <button class="btn btn-sm btn-secondary" data-act="expand1">⤵ 展开一级</button>
                <button class="btn btn-sm btn-secondary" data-act="collapse">⤴ 全部收起</button>
            </div>
            ${html}`;
    },

    // 事件委托：统一处理树内点击（展开/收起/编辑/删除/加子）——避免内联 onclick / event 依赖
    bindTreeDelegation() {
        const box = document.getElementById('dlContent');
        if (!box) return;
        // 事件挂在 box 上（input 事件会重新渲染 box，但同一个 box 元素复用，监听不丢失）
        if (box.__bound) return;
        box.__bound = true;
        box.addEventListener('click', (e) => {
            const target = e.target;
            // 操作按钮
            const btn = target.closest('[data-act]');
            if (btn) {
                const act = btn.getAttribute('data-act');
                const id = parseInt(btn.getAttribute('data-id') || '0', 10) || null;
                const type = btn.getAttribute('data-type') || 'task';
                e.preventDefault(); e.stopPropagation();
                if (act === 'addsub' && id) this.openAddSub(id);
                else if (act === 'edit' && id) this.openEdit(id, type);
                else if (act === 'del' && id) this.del(id);
                else if (act === 'view' && id) this.viewTask(id);
                else if (act === 'expand') this.expandAll();
                else if (act === 'expand1') this.expandOneLevel();
                else if (act === 'collapse') this.collapseAll();
                return;
            }
            // 展开/收起箭头（data-tid，优先于任务行查看——箭头在行内）
            const row2 = target.closest('[data-tid]');
            if (row2) { e.preventDefault(); e.stopPropagation(); this.toggleNode(parseInt(row2.getAttribute('data-tid'), 10) || 0); return; }
            // 任务行点击（标题区）→ 查看详情
            const viewRow = target.closest('[data-view-id]');
            if (viewRow) { e.preventDefault(); e.stopPropagation(); this.viewTask(parseInt(viewRow.getAttribute('data-view-id'), 10) || 0); return; }
            // 方向/迭代头
            const hdr = target.closest('[data-ikey],[data-dkey]');
            if (hdr) { e.preventDefault(); this.toggleKey(hdr.getAttribute('data-ikey') || hdr.getAttribute('data-dkey')); }
        });
    },

    // 逐层展开/收起：点击节点箭头切换
    toggleNode(id) {
        if (this._expanded.has(id)) this._expanded.delete(id);
        else this._expanded.add(id);
        const tab = document.querySelector('.dl-view-tab[data-view="tree"]');
        if (tab) this.renderContent();
    },

    toggleKey(key) {
        if (this._expanded.has(key)) this._expanded.delete(key);
        else this._expanded.add(key);
        this.renderContent();
    },

    // 全部收起（回到方向一层）
    collapseAll() {
        this._expanded.clear();
        this.renderContent();
    },

    // 展开所有节点（含子树所有层级）
    expandAll() {
        const walk = (nodes) => (nodes || []).forEach(n => { this._expanded.add(n.id); walk(n.children); });
        (this._tree || []).forEach(d => {
            this._expanded.add('dir:' + d.name);
            (d.iterations || []).forEach(it => {
                this._expanded.add('iter:' + d.name + '|' + it.name);
                walk(it.tasks);
            });
        });
        this.renderContent();
    },

    // 只展开一级：方向 + 各方向上第一层任务（子任务收起）
    expandOneLevel() {
        this._expanded.clear();
        (this._tree || []).forEach(d => {
            this._expanded.add('dir:' + d.name);
            (d.iterations || []).forEach(it => {
                this._expanded.add('iter:' + d.name + '|' + it.name);
                (it.tasks || []).forEach(t => this._expanded.add(t.id));
            });
        });
        this.renderContent();
    },

    // 递归渲染父/子任务节点（无限层级，XMind 式逐层展开）——用事件委托，无内联 onclick/event 依赖
    _treeNodes(tasks) {
        return tasks.map(n => {
            const indent = n.depth * 24;
            const hasChild = !!(n.children && n.children.length);
            const open = this._expanded.has(n.id);
            const stCls = this._statusCls(n.status);
            const toggle = hasChild
                ? `<span class="dl-toggle" data-tid="${n.id}" style="display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;background:rgba(100,210,255,.10);color:var(--accent);font-size:11px;">${open ? '▾' : '▸'}</span>`
                : `<span style="display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;color:var(--line-strong);font-size:11px;">•</span>`;
            const childrenHtml = (open && hasChild) ? this._treeNodes(n.children).join('') : '';
            return `
                <div style="border-bottom:1px solid var(--border-row);">
                    <div data-view-id="${n.id}" data-row="1"
                        style="display:flex;align-items:center;gap:6px;padding:7px 12px;padding-left:${12 + indent}px;font-size:12.5px;flex-wrap:wrap;cursor:pointer;">
                        ${toggle}
                        <span class="dl-title" style="flex:1;min-width:120px;color:var(--text-primary);font-weight:${n.depth===0?'700':'400'};">${Utils.esc(n.title)}</span>
                        ${hasChild ? `<span class="mono" style="font-size:10px;color:var(--text-muted);">${open?'−':'+'}&nbsp;${n.children.length}</span>` : ''}
                        ${n.entry_type==='meeting' && n.topics ? `<div style="flex:1;min-width:100%;order:99;padding:3px 0 0 16px;display:flex;flex-direction:column;gap:1px;">${String(n.topics).split('\n').filter(Boolean).slice(0,6).map(t => `<span style="font-size:11px;color:var(--text-secondary);">· ${Utils.esc(t)}</span>`).join('')}</div>` : ''}
                        ${n.iteration ? `<span class="badge badge-secondary" style="font-size:10px;">🔄 ${Utils.esc(n.iteration)}</span>` : ''}
                        ${n.owner ? `<span class="badge badge-info" style="font-size:10px;">${Utils.esc(n.owner)}</span>` : ''}
                        <span class="badge ${stCls}" style="font-size:10px;">${Utils.esc(n.status||'待办')}</span>
                        ${n.parent_id && n.parent_id>0 ? '' : (n.priority?`<span class="badge ${n.priority==='高'?'badge-danger':n.priority==='中'?'badge-warning':'badge-secondary'}" style="font-size:10px;">${Utils.esc(n.priority)}</span>`:'')}
                        ${n.start_date ? `<span class="mono" style="font-size:11px;color:var(--text-muted);">${Utils.formatDate(n.start_date)}</span>` : ''}
                        ${n.due_date ? `<span class="mono" style="font-size:11px;color:var(--text-muted);">→${Utils.formatDate(n.due_date)}</span>` : ''}
                        ${n.estimate ? `<span class="mono" style="font-size:11px;color:var(--text-muted);">${n.estimate}h</span>` : ''}
                        <span style="white-space:nowrap;">
                            <button class="btn btn-sm btn-secondary" data-act="view" data-id="${n.id}">看</button>
                            <button class="btn btn-sm btn-secondary" data-act="addsub" data-id="${n.id}">+子</button>
                            <button class="btn btn-sm btn-secondary" data-act="edit" data-id="${n.id}" data-type="${Utils.esc(n.entry_type)}">编辑</button>
                            <button class="btn btn-sm btn-danger" data-act="del" data-id="${n.id}">删</button>
                        </span>
                    </div>
                    ${childrenHtml}
                </div>`;
        });
    },

    // ========== 周视图 ==========
    async _renderWeek(box) {
        const data = await API.get('/api/devlogs/weekly');
        const logs = this._logs;
        const byWeek = {};
        (logs || []).forEach(l => {
            const key = this._weekOf(l);
            if (!key) return;
            (byWeek[key] = byWeek[key] || []).push(l);
        });
        const weeks = (data && data.weeks) || [];
        if (!weeks.length) { box.innerHTML = `<p class="empty-state">暂无开发记录</p>`; return; }

        const html = weeks.map(w => {
            const items = byWeek[w.key.join('-')] || [];
            const total = items.length;
            const done = items.filter(x => x.status === '已完成').length;
            const doing = items.filter(x => x.status === '进行中').length;
            const pct = total ? Math.round(done / total * 100) : 0;
            const overdue = items.filter(x => ['待办','进行中'].includes(x.status)
                && x.due_date && this._localToday() > String(x.due_date).substring(0, 10)).length;
            const itemHtml = items.map(i => this._logRow(i)).join('');
            return `<div class="card" style="margin-bottom:14px;">
                <div class="dl-head" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-row);">
                    <span style="font-weight:800;color:var(--accent-light);font-size:14px;min-width:96px;">${Utils.esc(w.label)}</span>
                    <span style="font-size:11px;color:var(--text-muted);">${w.start} ~ ${w.end}</span>
                    <div style="flex:1;height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden;max-width:200px;">
                        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));border-radius:3px;"></div>
                    </div>
                    <span style="font-size:12px;font-weight:700;color:var(--text-secondary);">${done}/${total} 完成</span>
                    <span class="badge ${doing?'badge-info':'badge-secondary'}" style="font-size:10px;">进行中 ${doing}</span>
                    ${overdue ? `<span class="badge badge-danger" style="font-size:10px;">逾期 ${overdue}</span>` : ''}
                </div>
                ${itemHtml || '<div style="padding:10px 16px;color:var(--text-muted);font-size:12px;">本周无记录</div>'}
            </div>`;
        }).join('');
        box.innerHTML = html;
    },

    // 本地今天日期字符串（YYYY-MM-DD），用于逾期判断（避免 UTC 解析边界差一天）
    _localToday() {
        const t = new Date();
        return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    },

    _weekOf(l) {
        // 与后端 _eff_date 同优先级：完成日→截止日→开始日→创建日
        const s = String(l.actual_date || l.due_date || l.start_date || l.created_at || '').substring(0, 10);
        if (!s) return null;
        const d = new Date(s + 'T00:00:00');
        if (isNaN(d)) return null;
        const year = d.getFullYear();
        const target = new Date(d.valueOf());
        const dayNr = (d.getDay() + 6) % 7;
        target.setDate(target.getDate() - dayNr + 3);
        const firstThursday = new Date(target.getFullYear(), 0, 4);
        const fDay = (firstThursday.getDay() + 6) % 7;
        firstThursday.setDate(firstThursday.getDate() - fDay + 3);
        const weekNo = 1 + Math.round((target - firstThursday) / (7 * 24 * 3600 * 1000));
        return [year, weekNo].join('-');
    },

    // ========== 责任人视图 ==========
    async _renderOwner(box) {
        const logs = this._logs;
        const byOwner = {};
        (logs || []).forEach(l => {
            const o = l.owner || '未指定';
            (byOwner[o] = byOwner[o] || []).push(l);
        });
        const owners = Object.keys(byOwner);
        if (!owners.length) { box.innerHTML = `<p class="empty-state">暂无开发记录</p>`; return; }
        const html = owners.map(o => {
            const items = byOwner[o];
            const total = items.length;
            const done = items.filter(x => x.status === '已完成').length;
            const doing = items.filter(x => x.status === '进行中').length;
            const pct = total ? Math.round(done / total * 100) : 0;
            return `<div class="card" style="margin-bottom:12px;">
                <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-card-hover);">
                    <span style="width:30px;height:30px;border-radius:50%;background:rgba(100,210,255,.14);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;">${Utils.esc((o||'?').charAt(0))}</span>
                    <strong style="flex:1;color:var(--accent-light);font-size:14px;">${Utils.esc(o)}</strong>
                    <div style="width:120px;height:7px;background:var(--bg-input);border-radius:3px;overflow:hidden;">
                        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--success),var(--ok));border-radius:3px;"></div>
                    </div>
                    <span class="mono" style="font-size:12px;color:var(--text-secondary);">${done}/${total} 完成</span>
                    ${doing ? `<span class="badge badge-info" style="font-size:10px;">进行中 ${doing}</span>` : ''}
                </div>
                <div>${items.map(i => this._logRow(i, true)).join('')}</div>
            </div>`;
        }).join('');
        box.innerHTML = html;
    },

    // ========== 完成记录（按日/周/自选时间，看某人完成了哪些工作） ==========
    _curUserOwner() {
        // 默认责任人 = 当前登录人（中文名）；否则回退 冯瑾奕
        const me = (App.currentUser || {});
        return me.name || me.username || '冯瑾奕';
    },

    _doneParams() {
        // 从 _doneRange 构建 from/to；Range=[日|周|自]
        const r = this._doneRange || {};
        const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const now = new Date();
        if (r.kind === 'day') {
            return { from: fmt(now), to: fmt(now) };
        }
        if (r.kind === 'week') {
            const day = (now.getDay() + 6) % 7;      // 周一起
            const mon = new Date(now); mon.setDate(now.getDate() - day);
            const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
            return { from: fmt(mon), to: fmt(sun) };
        }
        // 自选
        const f = r.from || (() => { const d = new Date(now); d.setDate(d.getDate()-6); return fmt(d); })();
        const t = r.to || fmt(now);
        return { from: r.from || f, to: t };
    },

    async _renderDone(box) {
        if (!this._doneRange) this._doneRange = { kind: 'week', from: '', to: '' };
        const p = this._doneParams();
        const owner = this._doneOwner || this._curUserOwner();
        let list = [];
        try {
            list = await API.get(`/api/devlogs?done=1&owner=${encodeURIComponent(owner)}&from=${p.from}&to=${p.to}`);
        } catch (e) { list = []; }
        // 按实际完成日期分组
        const groups = {};
        (list || []).forEach(t => {
            const d = (t.actual_date || String(t.updated_at || t.created_at || '').slice(0,10)) || '未填日期';
            (groups[d] = groups[d] || []).push(t);
        });
        const segBtn = (k, label) => `<button class="btn btn-sm ${(this._doneRange.kind===k)?'btn-primary':'btn-secondary'}" onclick="PageDevlog.setDoneRange('${k}')">${label}</button>`;
        const ownerInput = `<input id="dl-done-owner" value="${Utils.esc(owner)}" placeholder="责任人" style="width:120px;padding:6px;border:1px solid var(--border-card);border-radius:6px;"/>`;
        const rangeInputs = this._doneRange.kind === 'custom'
            ? `<input type="date" id="dl-done-from" value="${this._doneRange.from||''}"><span style="color:var(--text-muted);">至</span><input type="date" id="dl-done-to" value="${this._doneRange.to||''}">`
            : '';
        const groupHtml = Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(d => {
            const items = groups[d].map(t => `<div style="display:flex;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border-row);font-size:12.5px;align-items:center;">
                <span class="badge badge-success" style="font-size:10px;flex:none;">完成</span>
                <span style="flex:1;">${Utils.esc(t.title)}</span>
                ${t.direction?`<span class="badge badge-secondary" style="font-size:10px;">${Utils.esc(t.direction)}</span>`:''}
                ${t.iteration?`<span class="badge badge-secondary" style="font-size:10px;">🔄 ${Utils.esc(t.iteration)}</span>`:''}
                <button class="btn btn-sm btn-secondary" style="font-size:11px;" onclick="PageDevlog.viewTask(${t.id})">看</button>
            </div>`).join('');
            return `<div class="card" style="margin-bottom:10px;">
                <div style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border-row);">
                    <span style="font-weight:700;font-size:13px;">📅 ${Utils.esc(d)}</span>
                    <span class="mono" style="font-size:12px;color:var(--text-muted);">${items?groups[d].length:0} 项</span>
                </div><div>${items || '<div style="padding:10px 14px;color:var(--text-muted);font-size:12px;">该日无完成</div>'}</div>
            </div>`;
        }).join('') || `<div class="empty-state">该时间段内没有「${Utils.esc(owner)}」完成的记录</div>`;

        box.innerHTML = `
            <div class="card" style="margin-bottom:12px;">
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;">
                    <span style="font-weight:700;font-size:14px;">🏁 我（${Utils.esc(owner)}）完成的工作</span>
                    <span style="flex:1;"></span>
                    ${segBtn('day','今天')}${segBtn('week','本周')}${segBtn('custom','自选')}
                    ${rangeInputs}
                    <button class="btn btn-sm btn-primary" onclick="PageDevlog.applyDoneRange()">🔍 查询</button>
                </div>
                <div style="padding:0 16px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <span style="font-size:12px;color:var(--text-muted);">责任人</span>${ownerInput}
                    <span style="font-size:12px;color:var(--text-muted);">统计时间：${p.from} ~ ${p.to}　共 ${(list||[]).length} 项</span>
                    <span style="flex:1;"></span>
                    <button class="btn btn-sm btn-secondary" onclick="PageDevlog.copyDoneReport()">📋 复制日报</button>
                </div>
            </div>
            ${groupHtml}`;
    },

    setDoneRange(kind) {
        this._doneRange = this._doneRange || {};
        this._doneRange.kind = kind;
        // 顺带读责任人输入框（用户改了责任人再点时间快捷，不用再点查询）
        const ow = document.getElementById('dl-done-owner');
        if (ow && ow.value && ow.value.trim()) this._doneOwner = ow.value.trim();
        this._rerenderDone();
    },

    applyDoneRange() {
        const ow = document.getElementById('dl-done-owner');
        if (ow) this._doneOwner = ow.value.trim();
        const f = document.getElementById('dl-done-from'), t = document.getElementById('dl-done-to');
        if (f) this._doneRange.from = f.value;
        if (t) this._doneRange.to = t.value;
        this._rerenderDone();
    },

    _rerenderDone() {
        const box = document.getElementById('dlContent');
        if (box) this._renderDone(box);
    },

    // 生成「完成记录日报」文字并复制到剪贴板
    async copyDoneReport() {
        const box = document.getElementById('dlContent');
        // 先从输入框同步当前 owner/范围
        const ow = document.getElementById('dl-done-owner');
        if (ow && ow.value.trim()) this._doneOwner = ow.value.trim();
        const p = this._doneParams();
        const owner = this._doneOwner || this._curUserOwner();
        let list = [];
        try {
            list = await API.get(`/api/devlogs?done=1&owner=${encodeURIComponent(owner)}&from=${p.from}&to=${p.to}`);
        } catch (e) { list = []; }
        const rangeLabel = this._doneRange.kind === 'day' ? '今天'
            : (this._doneRange.kind === 'week' ? '本周' : '自选');
        const lines = [];
        lines.push(`【${owner} · ${rangeLabel}工作完成记录】`);
        lines.push(`时间：${p.from} ~ ${p.to}　共 ${(list||[]).length} 项`);
        lines.push('');
        const groups = {};
        (list || []).forEach(t => {
            const d = (t.actual_date || String(t.updated_at || t.created_at || '').slice(0,10)) || '未填日期';
            (groups[d] = groups[d] || []).push(t);
        });
        Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(d => {
            lines.push(`【${d}】` + groups[d].length + ' 项');
            groups[d].forEach(t => {
                let item = `- ${t.title || ''}`;
                if (t.direction) item += `（${t.direction}` + (t.iteration ? ` · ${t.iteration}` : '') + '）';
                lines.push(item);
            });
            lines.push('');
        });
        if (!list || !list.length) {
            lines.push('（该时间段内无完成记录）');
        }
        const text = lines.join('\n');
        try {
            await navigator.clipboard.writeText(text);
            Toast.success('已复制日报，可直接粘贴');
        } catch (e) {
            // 剪贴板不可用则降级弹显示
            Modal.open(`<div style="min-width:480px;max-width:90vw;"><h3>日报内容（已尝试复制，未成功——以下可手动复制）</h3><textarea rows="16" readonly style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;">${Utils.esc(text)}</textarea></div>`);
        }
    },

    // ========== 待完善池 ==========
    async _renderTodo(box) {
        const list = this._todo;
        if (!list || !list.length) {
            box.innerHTML = `<div class="card"><p class="empty-state">暂无待完善项，点击右上角「✏ 记一条待完善」随时记录改进点</p></div>`;
            return;
        }
        const order = ['待完善', '待讨论', '进行中', '已解决', '已忽略'];
        const groups = {};
        list.forEach(t => { (groups[t.status] = groups[t.status] || []).push(t); });
        const html = order.map(st => {
            const items = groups[st] || [];
            if (!items.length) return '';
            const color = { '待完善': 'var(--warning)', '待讨论': 'var(--info)', '进行中': 'var(--info)', '已解决': 'var(--success)', '已忽略': 'var(--text-muted)' }[st] || 'var(--text-muted)';
            return `<div class="card" style="margin-bottom:12px;border-left:3px solid ${color};">
                <div style="display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--bg-card-hover);">
                    <strong style="font-size:13px;color:var(--text-primary);">${st}</strong>
                    <span class="badge badge-secondary" style="font-size:10px;">${items.length}</span>
                </div>
                <div>${items.map(t => this._todoRow(t)).join('')}</div>
            </div>`;
        }).join('');
        box.innerHTML = html || `<div class="card"><p class="empty-state">暂无待完善项</p></div>`;
    },

    _todoRow(t) {
        const pCls = t.priority === '高' ? 'badge-danger' : t.priority === '中' ? 'badge-warning' : 'badge-secondary';
        return `<div style="display:flex;align-items:flex-start;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border-row);font-size:12.5px;">
            <span style="flex:1;min-width:120px;">
                <div style="color:var(--text-primary);font-weight:600;">${Utils.esc(t.title)}</div>
                ${t.detail ? `<div style="color:var(--text-secondary);margin-top:2px;">${Utils.esc(t.detail)}</div>` : ''}
                <div style="margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;">
                    <span class="badge ${pCls}" style="font-size:10px;">${Utils.esc(t.priority)||'普通'}</span>
                    ${t.source ? `<span class="badge badge-secondary" style="font-size:10px;">📎 ${Utils.esc(t.source)}</span>` : ''}
                    ${t.tag ? `<span class="badge badge-secondary" style="font-size:10px;">#${Utils.esc(t.tag)}</span>` : ''}

                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.openTodoEdit(${t.id})">改</button>
                <span class="btn btn-sm btn-secondary" onclick="PageDevlog.todoQuick(${t.id},'已解决')">✓解决</span>
                <button class="btn btn-sm btn-danger" onclick="PageDevlog.delTodo(${t.id})">删</button>
            </span>

    // 快速改状态
    async todoQuick(id, status) {
        const res = await API.put(`/api/devlogs/todo/${id}`, { status });
        if (res && res.success) { Toast.success('已更新'); this.refresh(); }
        else Toast.error('更新失败');

    // ========== 全部记录 ==========
    async _renderAll(box) {

        if (!logs || !logs.length) { box.innerHTML = `<p class="empty-state">暂无记录，点击右上角添加</p>`; return; }
        box.innerHTML = `<div class="card"><div>${logs.map(i => this._logRow(i, true)).join('')}</div></div>`;
    },

    _logRow(l, showType = false) {

        return `<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border-row);font-size:12.5px;${isSub?'padding-left:34px;':''}">
            <span>${typeIcon}</span>
            ${showType && l.entry_type === 'meeting' ? '<span style="font-size:10px;color:var(--text-muted);">' + Utils.formatDate(l.meeting_date) + '</span>' : ''}
            <span style="flex:1;color:var(--text-primary);${isSub?'color:var(--text-secondary);':''}cursor:pointer;" title="点击查看详情" onclick="PageDevlog.viewTask(${l.id})">${isSub?'└ ':''}${Utils.esc(l.title)}</span>
            ${l.entry_type === 'meeting' && l.topics ? `<div style="flex:1;min-width:100%;order:99;padding:2px 0 0 22px;display:flex;flex-direction:column;gap:1px;">${String(l.topics).split('\n').filter(Boolean).slice(0,5).map(t => `<span style="font-size:11px;color:var(--text-secondary);">· ${Utils.esc(t)}</span>`).join('')}${String(l.topics).split('\n').filter(Boolean).length > 5 ? '<span style="font-size:10px;color:var(--text-muted);">…共 ' + String(l.topics).split('\n').filter(Boolean).length + ' 个主题</span>' : ''}</div>` : ''}
            ${l.owner ? `<span class="badge badge-info" style="font-size:10px;">${Utils.esc(l.owner)}</span>` : ''}
            ${l.iteration ? `<span class="badge badge-secondary" style="font-size:10px;">🔄 ${Utils.esc(l.iteration)}</span>` : ''}
            ${l.direction ? `<span class="badge badge-secondary" style="font-size:10px;">${Utils.esc(l.direction)}</span>` : ''}
            <span class="badge ${stCls}" style="font-size:10px;">${Utils.esc(l.status||'待办')}</span>

            <span style="white-space:nowrap;">
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.viewTask(${l.id})">看</button>
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.openEdit(${l.id},'${l.entry_type}')">编辑</button>
                <button class="btn btn-sm ${isSub?'btn-secondary':'btn-primary'}" onclick="PageDevlog.openAddSub(${l.id})">+子</button>

    _statusCls(s) {
        return s === '已完成' ? 'badge-success' : (s === '进行中' ? 'badge-info' : (s === '已暂停' ? 'badge-warning' : 'badge-secondary'));
    },

    exportReport(kind) {
        Toast.info(kind === 'week' ? '正在生成周报...' : '正在生成月报...');
        window.location.href = `/api/devlogs/report?kind=${kind}`;

    exportTodoMd() {

    },

    exportMd() {

    // ========== 周会汇报（整页视图：结构化进度 + 会议记录 + 联动需求/预警） ==========

    // 本期 ISO 键 → 日期跨度；汇总周用 _weekOf 逻辑
    _curWeekKey() {
        const t = new Date();
        const d = new Date(t.valueOf());
        const dayNr = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() - dayNr + 3);
        const firstThursday = new Date(d.getFullYear(), 0, 4);
        const fDay = (firstThursday.getDay() + 6) % 7;
        firstThursday.setDate(firstThursday.getDate() - fDay + 3);
        const weekNo = 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
        return `${d.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    },

    _labelOf(label) {
        const m = String(label).match(/^(\d{4})-W(\d{2})$/);
        if (m) return `${m[1]}年 第${Number(m[2])}周`;
        return label;
    },

    _stCls(s) {
        if (s === '已完成' || s === '已通过') return 'badge-success';
        if (s === '进行中' || s === '处理中' || s === '待审批' || s === '待完善') return 'badge-info';
        if (s === '已逾期') return 'badge-danger';
        return 'badge-secondary';
    },

    // 周会整页入口：进入 weekly 视图时初始化（默认本周）
    async initWeekly(box) {
        const yw = this._curWeekKey();
        this._wm = { yw, brief: null, note: null };
        box.innerHTML = '<div class="dl-loading" style="padding:40px;text-align:center;color:var(--text-muted);">正在生成周会汇报…</div>';
        try {
            const [brief, note] = await Promise.all([
                API.get(`/api/devlogs/weekly-brief?yw=${yw}`),
                API.get(`/api/devlogs/weekly-meeting?yw=${yw}`)
            ]);
            if (!brief) { box.innerHTML = '<p class="empty-state">加载失败。</p>'; return; }
            this._wm.brief = brief;
            this._wm.note = note || { recap: '', risks: '', blockers: '', next_plan: '', exists: false };
            this._renderWeekly(box);
        } catch (e) { box.innerHTML = '<p class="empty-state">周会数据加载失败。</p>'; }
    },

    // 切换周（delta ±1）
    async wmShift(delta) {
        const m = String(this._wm.yw).match(/^(\d{4})-W(\d{2})$/);
        if (!m) return;
        let [y, w] = [Number(m[1]), Number(m[2])];
        w += delta;
        const maxWeeks = new Date(y, 11, 28).getDate() > 28 ? 53 : 52;
        if (w < 1) { w = maxWeeks; y -= 1; }
        if (w > maxWeeks) { w = 1; y += 1; }
        const yw = `${y}-W${String(w).padStart(2, '0')}`;
        this._wm.yw = yw;
        const box = document.getElementById('dlContent');
        if (box) box.innerHTML = '<div class="dl-loading" style="padding:40px;text-align:center;color:var(--text-muted);">加载中…</div>';
        try {
            const [brief, note] = await Promise.all([
                API.get(`/api/devlogs/weekly-brief?yw=${yw}`),
                API.get(`/api/devlogs/weekly-meeting?yw=${yw}`)
            ]);
            this._wm.brief = brief;
            this._wm.note = note || { recap: '', risks: '', blockers: '', next_plan: '', exists: false };
            this._renderWeekly(box);
        } catch (e) { Toast.error('切换周失败'); }
    },

    _renderWeekly(box) {
        if (!box) return;
        const b = this._wm.brief;
        const n = this._wm.note;
        const s = b.summary;

        const tile = (icon, label, val, cls) => `<div style="flex:1;min-width:120px;background:var(--panel-2);border:1px solid var(--border-row);border-radius:12px;padding:12px 14px;">
            <div style="font-size:11px;color:var(--text-muted);">${icon} ${label}</div>
            <div style="font-size:22px;font-weight:800;${cls || ''}" class="mono">${val}</div></div>`;

        this._wm.ui = this._wm.ui || {};
        const ui = this._wm.ui;
        // 分组开合习惯持久化到 localStorage（key 前缀隔离不同模块），跨会话保留
        const STORAGE_KEY = 'devlog.wm.ui';
        let _persistUi = this._wm._persistUi;
        if (!_persistUi) {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { saved = {}; }

            ui['done'] = saved['done'] !== false;
            ui['doing'] = saved['doing'] !== false;
            ui['todo'] = saved['todo'] !== false;
            ui['overdue'] = saved['overdue'] !== false;
            ui['wmtg'] = saved['wmtg'] !== false;
            ui['wdemand'] = saved['wdemand'] !== false;
            ui['wwarn'] = saved['wwarn'] !== false;
            ui['wtodo'] = saved['wtodo'] !== false;
            this._wm._persistUi = _persistUi = true;
        }
        const grp = (k, title, badgeHtml, list, rowFns, empty) => {

            return `<div class="card" style="margin-bottom:12px;">

            </div>`;
        };

        // 任务行
        const taskRow = (it, kind) => `<div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border-row);font-size:12.5px;flex-wrap:wrap;">

        const dirRows = (b.dirs || []).map(d => {

            <button class="btn btn-sm btn-primary" style="font-size:11px;" onclick="PageDevlog.wmClaim('todo',${t.id})">认领</button>
        </div>`;

        // 会议记录表单（可编辑）
        const notesHtml = `<div class="card" style="margin-bottom:12px;">
