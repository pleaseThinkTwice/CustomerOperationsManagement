// 用法：await AgentProgress.run({ url, data, title })
//   url: 调用大模型的后端接口（需支持 stream=true，返回 task_id）
//   data: 请求体（会自动带 stream:true）
//   title: 面板标题
// 组件：发起 stream → 轮询 /api/task/progress/<task_id> → 实时展示进度 → 完成后返回最终 result。
const AgentProgress = {
    _pollTimer: null,
    _box: null,

    _ensureBox() {
        this._box = document.getElementById('agentProgress');
        if (!this._box) {
            const d = document.createElement('div');
            d.id = 'agentProgress';
            d.className = 'agent-progress';
            d.style.display = 'none';
            document.body.appendChild(d);
            this._box = d;
        }
        return this._box;
    },

    _render(title, stepText, thought, pct, running) {
        const box = this._ensureBox();
        box.style.display = '';
        box.innerHTML = `
            <div class="ap-head">
                <span class="ap-title">${Utils.esc(title)}</span>
                <span class="ap-step">${Utils.esc(stepText)}</span>
            </div>
            <div class="ap-thought">${Utils.esc(thought) || (running ? '正在思考...' : '')}</div>
            ${running ? `<div class="ap-bar"><i style="width:${Math.max(2, pct)}%"></i></div>` : ''}`;
    },

    _close() {
        if (this._pollTimer) { clearInterval(this._pollTimer); this._pollTimer = null; }
        const box = document.getElementById('agentProgress');
        if (box) box.style.display = 'none';
        this._silent = false;
        this._onThought = null;
    },

    async run({ url, data = {}, title = 'AI 处理中', silent = false, onThought = null }) {
        this._close();
        this._silent = !!silent;
        this._onThought = onThought;
        if (!this._silent) this._render(title, '启动中...', '', 5, true);
        try {
            // 发起 stream（FormData=multipart 文件直传；否则 JSON）
            let startRes;
            if (data instanceof FormData) {
                data.append('stream', '1');
                startRes = await API.upload(url, data);
            } else {
                startRes = await API.post(url, { ...data, stream: true });
            }
            if (!startRes || !startRes.task_id) {
                // 兼容后端不支持 stream（仍同步返回了结果）
                if (startRes && (startRes.result !== undefined || startRes.demands || startRes.config || startRes.ok !== undefined)) {
                    this._close();
                    return startRes;
                }
                throw new Error('任务启动失败: ' + (startRes && startRes.error ? startRes.error : '未知'));
            }
            return await this.pollTask(startRes.task_id, title);
        } catch (e) {
            this._close();
            Toast.error('AI 任务失败: ' + e.message);
            return null;
        }
    },

    // 轮询已启动的后台任务到结束。供 run 内部及「上传后拿到 task_id 再轮询」的场景共用。
    // 注意：不在此重置 _silent/_onThought，由调用方（run 或直接调用前）设定。
    async pollTask(taskId, title = 'AI 处理中') {
        if (this._pollTimer) { clearInterval(this._pollTimer); this._pollTimer = null; }
        try {
            for (;;) {
                const res = await this._poll(taskId, title);
                if (res.waiting_input) {
                    const ask = res.ask || {};
                    const answer = await this._askUser(ask);
                    if (answer === null) { this._close(); return { success: false, message: '已取消追问' }; }
                    this._render(title, '继续处理...', '已收到你的回答', 50, true);
                    const cont = await API.post('/api/agent/continue', { sid: ask.sid, answer, stream: true });
                    if (!cont || !cont.task_id) {
                        if (cont && cont.ok !== undefined) { this._close(); return cont; }
                        throw new Error('追问后无法继续');
                    }
                    taskId = cont.task_id;
                    continue;
                }
                this._close();
                if (res.status === 'error') {
                    return (res.result && res.result.ok !== undefined) ? res.result
                        : { success: false, message: (res.result && res.result.error) || res.error || '执行失败' };
                }
                return res.result || { success: false, message: '未获取到结果' };
            }
        } catch (e) {
            this._close();
            Toast.error('AI 任务失败: ' + e.message);
            return null;
        }
    },

    // 轮询到任务结束；若反问则返回 { waiting_input, ask }
    _poll(taskId, title) {
        return new Promise((resolve, reject) => {
            let tries = 0;
            const tick = async () => {
                tries++;
                try {
                    const r = await API.get(`/api/task/progress/${taskId}`);
                    if (!r || !r.success) { clearInterval(this._pollTimer); reject(new Error('进度接口异常')); return; }
                    const total = r.total || 1;
                    const cur = r.current || 0;
                    const pct = total ? Math.min(100, Math.round(cur / total * 100)) : 50;
                    const stepText = r.status === 'running'
                        ? (total > 1 ? `步骤 ${cur} / ${total}` : '生成中...')
                        : (r.status === 'done' ? '完成' : (r.status === 'waiting_input' ? '需要确认' : '已结束'));
                    if (this._silent) {
                        // 静默模式：不弹浮层，把思考过程实时回调给调用方（在聊天界面内展示）
                        if (this._onThought) this._onThought({ thought: r.thought || '', stepText, pct, status: r.status });
                    } else {
                        this._render(title, stepText, r.thought || '', pct, r.status === 'running');
                    }
                    if (r.status === 'waiting_input') {
                        clearInterval(this._pollTimer);
                        const ask = r.result && r.result.need_input ? r.result : {};
                        resolve({ waiting_input: true, ask });
                        return;
                    }
                    if (r.status === 'done' || r.status === 'error') {
                        clearInterval(this._pollTimer);
                        resolve(r);
                        return;
                    }
                    if (tries > 3600) { clearInterval(this._pollTimer); reject(new Error('等待超时')); return; } // ~1800s：Agent 多步 + Doris 重试实测需数分钟
                } catch (e) {
                    clearInterval(this._pollTimer);
                    reject(e);
                }
            };
            tick();
            this._pollTimer = setInterval(tick, 500);
        });
    },

    // 反问弹框：展示 Agent 的问题 + 可多选的选项 checkbox + 自由输入，返回用户回答（或 null 取消）
    _askUser(ask) {
        return new Promise((resolve) => {
            const q = (ask && ask.question) || '请补充信息';
            const opts = (ask && ask.options) || [];
            const optHtml = opts.length
                ? `<div style="margin-bottom:8px;font-size:12px;color:var(--text-muted);">可多选，勾选符合的选项：</div>
                   <div style="margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;">
                   ${opts.map((o, i) => `<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:5px 10px;border:1px solid var(--border-row);border-radius:8px;">
                       <input type="checkbox" class="agent-ask-opt" value="${Utils.esc(o)}">
                       ${Utils.esc(o)}
                   </label>`).join('')}
                   </div>`
                : '';
            Modal.open(`
                <h3>🤔 需要你补充一点信息</h3>
                <p style="color:var(--text-secondary);font-size:14px;">${Utils.esc(q)}</p>
                ${optHtml}
                <div class="form-group"><label>或直接输入</label>
                    <input type="text" id="agent-ask-input" placeholder="例如：客户 oem / 容量 / 时间范围..." style="padding:8px;border:1px solid #ccc;border-radius:6px;width:100%;box-sizing:border-box;">
                </div>
                <div style="text-align:right;margin-top:12px;">
                    <button class="btn btn-secondary" id="agent-ask-ok">全 部 已 选 / 继 续</button>
                </div>`);
            // 点选项只切换勾选，不提交
            document.querySelectorAll('.agent-ask-opt').forEach(cb => {
                cb.onchange = () => { /* 只切换勾选态，不触发提交 */ };
            });
            document.getElementById('agent-ask-ok').onclick = () => {
                const picked = Array.from(document.querySelectorAll('.agent-ask-opt:checked'))
                    .map(c => c.value).filter(Boolean);
                const typed = document.getElementById('agent-ask-input').value.trim();
                Modal.close();
                if (typed) { resolve(typed); return; }
                if (picked.length) { resolve(picked.join('；')); return; }
                resolve(q);   // 什么都没选，把问题原样交回（Agent 会再判断）
            };
        });
    }
};

                <button class="btn btn-sm btn-secondary" ${pg.page >= pg.pages ? 'disabled' : ''} data-pg="next">下一页 &#8250;</button>
            </div>`;
        container.querySelectorAll('[data-pg]').forEach(b => {
            b.onclick = () => {
                const np = b.dataset.pg === 'prev' ? pg.page - 1 : pg.page + 1;
                if (np >= 1 && np <= pg.pages) onPage(np);
            };
        });
    },

    // 安全 HTML 转义（含单引号，兼容 onclick JS 字符串内嵌）
    esc(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },

    // 把 {columns:[], rows:[[]]} 结果导出为 CSV 并下载（数据可导出）
    downloadCSV(filename, columns, rows) {
        const _cell = (v) => {
            // 单元格转义：含分隔符/引号/换行时用双引号包裹
            const s = (v === null || v === undefined) ? '' : String(v);
            if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        };
        // 统一加 \uFEFF BOM，便于 Excel 正确识别 UTF-8 中文
        let csv = '\uFEFF' + (columns || []).map(_cell).join(',') + '\r\n';
        (rows || []).forEach(r => { csv += r.map(_cell).join(',') + '\r\n'; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    },

    // ========== 长文本折叠 通用套件 ==========
    // 统一约定：入参 = 纯文本（本套件内部负责 HTML 转义），返回可直接 innerHTML 的展开/折叠组件。
    // 只要用这两个方法就绝不会出现"二次转义把标签显示成源码"的问题，也无需再手动 Utils.esc。
    _collapseWidget(previewHtml, moreHtml) {
        return `<span class="collapse-widget">${previewHtml}<span class="collapse-more" style="display:none;">${moreHtml}</span>
            <button class="collapse-toggle" style="display:block;margin-top:6px;border:none;background:transparent;color:var(--accent);cursor:pointer;font-size:12px;padding:0;" onclick="Utils.toggleCollapse(this)">… 展开更多</button></span>`;
    },
    _collapseIsLong(text, threshold) {
        return !!text && String(text).length > threshold;
    },

    // 纯文本折叠：text 为纯文本（会被 esc）。适合表格单元格/说明类。
    collapseText(text, threshold = 600) {
        if (!text) return '';
        const s = String(text);
        if (!Utils._collapseIsLong(s, threshold)) return Utils.esc(s).replace(/\n/g, '<br>');
        const preview = Utils.esc(s.substring(0, threshold)).replace(/\n/g, '<br>');
        const rest = Utils.esc(s.substring(threshold)).replace(/\n/g, '<br>');
        return Utils._collapseWidget(preview, rest);
    },

    // 富文本/已安全 HTML 折叠：html 为可直接渲染的安全 HTML（AI 渲染结果等），不会被再次转义。
    collapseHtml(html, plainFallback = '', threshold = 700) {
        let h = html == null ? '' : String(html);
        if (!h.trim()) return plainFallback ? Utils.collapseText(plainFallback, threshold) : '';
        // 加固（任务5/E3）：先经过 mdSanitize（剥离 script/style/事件属性/iframe 等危险元素），
        // 不破坏 md.render 的合法 md-body 标签；兜底依赖后端转义契约的注入面。
        h = Utils.mdSanitize(h);
        // 估算渲染后的文本长度，判断是否需要折叠（避免直接按字符截断破坏标签）
        const tmp = document.createElement('div'); tmp.innerHTML = h;
        const textLen = (tmp.textContent || '').length;
        if (textLen <= threshold) return h;   // 不超限，原样返回（已安全 HTML）
        return Utils._collapseWidget(h, h);   // 超限：预览与展开都显示完整富文本（对象统一），靠按钮收起
    },

    // 通用 Markdown/HTML 输出净化（任务5/E3）：用 DOMParser 剥离危险节点与事件属性，
    // 仅保留标准 md-body 内容标签。可在任何"富 HTML 直插 innerHTML"前调用做兜底。
    mdSanitize(html) {
        if (!html) return '';
        let doc;
        try { doc = new DOMParser().parseFromString(String(html), 'text/html'); }
        catch (e) { return Utils.esc(String(html)); }
        const ALLOWED = new Set(['HTML','HEAD','BODY','P','BR','DIV','SPAN','STRONG','B','EM','I','U','S',
            'H1','H2','H3','H4','H5','H6','UL','OL','LI','TABLE','THEAD','TBODY','TR','TD','TH',
            'BLOCKQUOTE','CODE','PRE','A','HR','IMG','SUP','SUB','DL','DT','DD','DETAILS','SUMMARY']);
        // 移除危险元素
        doc.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea').forEach(n => n.remove());
        // 清除事件/危险属性（遍历所有元素）
        doc.body.querySelectorAll('*').forEach(n => {
            if (!ALLOWED.has(n.tagName.toUpperCase())) {
                // 不合法的标签：保留其文本内容（去掉标签本身）
                const span = doc.createElement('span');
                span.textContent = n.textContent;
                n.replaceWith(span);
                return;
            }
            [...n.attributes].forEach(attr => {
                const nm = attr.name.toLowerCase();
                if (nm.startsWith('on') || nm === 'style' || nm === 'href' && attr.value.trim().toLowerCase().startsWith('javascript:')) {
                    n.removeAttribute(attr.name);
                }
            });
            // A 标签仅允许 http(s)/mailto
            if (n.tagName.toUpperCase() === 'A') {
                const href = (n.getAttribute('href') || '').trim().toLowerCase();
                if (href && !/^(https?:|mailto:|\/)/.test(href)) n.removeAttribute('href');
            }
        });
        return doc.body.innerHTML;
    },
    toggleCollapse(btn) {
        const w = btn.closest('.collapse-widget');
        const more = w.querySelector('.collapse-more');
        const isHidden = more.style.display === 'none';
        more.style.display = isHidden ? 'inline' : 'none';
        btn.textContent = isHidden ? '收起' : '… 展开更多';
    },

    // 兼容旧调用：collapse=collapseText, collapseFlat=collapseHtml
    collapse(text, threshold = 600) { return Utils.collapseText(text, threshold); },
    collapseFlat(plain, richHtml, threshold = 700) { return Utils.collapseHtml(richHtml || '', plain || '', threshold); },

    // 通用表格排序：给 tableEl 启用点击表头排序
    // 规则：
    //   - <th data-no-sort> 的列不参与排序（操作列、文件按钮列等）
    //   - 单元格取值优先 data-sort-value 属性，其次 textContent
    //   - 纯数字（含千分位/负号/小数）按数值排，其余按字符串 localeCompare
    //   - 主子表：无 data-parent-id 的行视为父行，紧跟其后的 data-parent-id 行为子行；
    //     排序时"父行+其子行"作为一组整体移动，子行 display 状态保持不变
    // 本地文件选择器（浏览器原生）：选完即回调 FileList
    // opts: { multiple, accept, onPicked(files) }
    pickFiles(opts = {}) {
        const input = document.createElement('input');
        input.type = 'file';
        if (opts.multiple) input.multiple = true;
        if (opts.accept) input.accept = opts.accept;
        input.style.display = 'none';
        document.body.appendChild(input);
        input.addEventListener('change', () => {
            const files = Array.from(input.files || []);
            input.remove();
            if (files.length && opts.onPicked) opts.onPicked(files);
        }, { once: true });
        input.click();
    },

    enableTableSort(tableEl) {
        if (!tableEl) return;
        if (tableEl.dataset && tableEl.dataset.sortEnabled === '1') return;   // 幂等：已绑定不重复
        if (tableEl.dataset) tableEl.dataset.sortEnabled = '1';
        const thead = tableEl.querySelector('thead');
        const tbody = tableEl.querySelector('tbody');
        if (!thead || !tbody) return;
        const ths = Array.from(thead.querySelectorAll('th'));
        if (!ths.length) return;

        let sortIdx = -1;
        let sortDir = 'asc';
        let originalGroups = null;  // 保存初始行分组顺序，未激活时恢复

        const refreshArrows = () => {
            ths.forEach((th, i) => {
                th.querySelectorAll('.sort-arrow').forEach(e => e.remove());
                if (th.hasAttribute('data-no-sort')) return;
                const arrow = document.createElement('span');
                arrow.className = 'sort-arrow';
                arrow.style.cssText = 'font-size:10px;color:var(--text-muted);margin-left:2px;';
                if (i === sortIdx) {
                    arrow.innerHTML = sortDir === 'asc' ? ' &#9650;' : ' &#9660;';
                } else {
                    arrow.style.opacity = '0.4';
                    arrow.innerHTML = ' &#8661;';
                }
                th.appendChild(arrow);
            });
        };

        ths.forEach((th, idx) => {
            if (th.hasAttribute('data-no-sort')) return;
            th.style.cursor = 'pointer';
            th.title = '点击排序（升序→降序→取消）';
            th.addEventListener('click', () => {
                // 首次点击前惰性保存原始分组顺序
                if (!originalGroups) {
                    const rows0 = Array.from(tbody.children);
                    originalGroups = [];
                    let cur = null;
                    rows0.forEach(tr => {
                        if (tr.hasAttribute('data-parent-id')) {
                            if (cur) cur.children.push(tr);
                        } else {
                            if (cur) originalGroups.push(cur);
                            cur = { parent: tr, children: [] };
                        }
                    });
                    if (cur) originalGroups.push(cur);
                }

                if (sortIdx === idx) {
                    // 同列循环：asc → desc → 取消
                    if (sortDir === 'asc') {
                        sortDir = 'desc';
                    } else {
                        sortIdx = -1;
                        sortDir = 'asc';
                    }
                } else {
                    sortIdx = idx;
                    sortDir = 'asc';
                }
                refreshArrows();

                // 取消排序：恢复原始顺序
                if (sortIdx === -1) {
                    originalGroups.forEach(g => {
                        tbody.appendChild(g.parent);
                        g.children.forEach(c => tbody.appendChild(c));
                    });
                    return;
                }

                // 取行分组：父行 + 紧跟其后的子行（data-parent-id）
                const rows = Array.from(tbody.children);
                const groups = [];
                let current = null;
                rows.forEach(tr => {
                    if (tr.hasAttribute('data-parent-id')) {
                        if (current) current.children.push(tr);
                    } else {
                        if (current) groups.push(current);
                        current = { parent: tr, children: [] };
                    }
                });
                if (current) groups.push(current);

                // 取值 + 排序
                const getVal = (tr, i) => {
                    const cell = tr.children[i];
                    if (!cell) return '';
                    const sv = cell.getAttribute('data-sort-value');
                    return sv !== null ? sv : (cell.textContent || '').trim();
                };
                groups.sort((a, b) => {
                    const va = getVal(a.parent, idx);
                    const vb = getVal(b.parent, idx);
                    const cleanA = String(va).replace(/,/g, '').trim();
                    const cleanB = String(vb).replace(/,/g, '').trim();
                    const isNumA = cleanA !== '' && /^-?\d+(\.\d+)?$/.test(cleanA);
                    const isNumB = cleanB !== '' && /^-?\d+(\.\d+)?$/.test(cleanB);
                    let cmp;
                    if (isNumA && isNumB) {
                        cmp = parseFloat(cleanA) - parseFloat(cleanB);
                    } else {
                        cmp = String(va).localeCompare(String(vb), 'zh');
                    }
                    return sortDir === 'asc' ? cmp : -cmp;
                });

                // 重新插入（保留子行 display 状态）
                groups.forEach(g => {
                    tbody.appendChild(g.parent);
                    g.children.forEach(c => tbody.appendChild(c));
                });
            });
        });

        refreshArrows();
    },
};

// 公共 HTML 转义函数（任务5/E3）：& < > " ' 转义。任何 innerHTML 拼接用户/LLM 文本前先用它。
// Utils.esc 同义；提供全局 esc 便于新页面直接引用。
window.esc = window.esc || function (s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
};

        document.getElementById('om-save').onclick = async () => {

                status: document.getElementById('om-status').value,
                reply: document.getElementById('om-reply').value
            });
            if (res && res.success) { Toast.success('已更新'); this.reopen(); }

    reopen() {
        Modal.close();
        this.open();
        document.querySelectorAll('.ob-tab').forEach(b => b.classList.remove('active'));
        const listBtn = [...document.querySelectorAll('.ob-tab')].find(b => b.dataset.ob === 'list');

    async del(id) {

    }
};

// ============ 新标签页编辑（todo#2）============
// 把某处文字输入放到独立标签页全页编辑，用户可顺手关闭原标签页。
// 数据经 localStorage[key] 传递：编辑器输入即写入，来源页通过 storage 事件实时同步。
// 用法：TabEditor.attach(textareaEl, key, title) 自动在元素旁加"📄 新标签编辑"按钮；
//       或在事件里 TabEditor.open(key, '当前值', '标题')。
window.TabEditor = {
    open(key, currentValue, title) {
        if (!key) return;
        try { localStorage.setItem(key, currentValue == null ? '' : String(currentValue)); } catch (e) {}
        const url = '/editor?k=' + encodeURIComponent(key) + '&t=' + encodeURIComponent(title || '编辑');
        window.open(url, '_blank');
    },

    // 给一个 textarea/input 挂"新标签编辑"，并双向同步 localStorage。
    attach(el, key, title) {
        if (!el) return;
        if (el.dataset.tabEditor) return;         // 防重复
        el.dataset.tabEditor = '1';
        const holder = el.closest('.form-group, .card') || (el.parentElement || document.body);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-sm btn-secondary';
        btn.textContent = '📄 新标签编辑';
        btn.title = '在独立标签页打开，输入会实时同步回来；可关闭本标签专注编辑。';
        btn.style.marginTop = '4px';
        btn.onclick = () => this.open(key, el.value, title || '编辑');
        // 放在输入框下方
        const wrap = el.closest('.form-group, .card, div');
        if (wrap) wrap.appendChild(btn); else holder.appendChild(btn);
        // 监听新标签页保存回写
        this._listen(key, el);
    },

    _listen(key, el) {
        const onStorage = (e) => {
            if (e.key === key) {
                const v = e.newValue;
                if (v != null) el.value = v;
            }
        };
        window.addEventListener('storage', onStorage);
        if (el._tabEditorCleanup) el._tabEditorCleanup();
        el._tabEditorCleanup = () => window.removeEventListener('storage', onStorage);
    },
};


// ============ 可搜索下拉（SearchSelect）============
// 把原生 <select> 换成可直接输入的下拉框：框里显示当前选项，点击后可直接打字过滤，不额外弹搜索框。
// 原生 select 仍是值的来源（隐藏不删），选中后写回 select.value 并派发 change，原有 onchange 逻辑不用改。
// 匹配：默认模糊（空格分词，每个词按「连续子串 → 字符按顺序出现」匹配，大小写不敏感）；
//       输入 /正则/标志 时按正则匹配，正则写错时提示，不过滤。
const SearchSelect = {
    _open: null,   // 当前展开的实例

    enhance(sel, opts) {
        if (!sel || sel._ss) return sel && sel._ss;
        opts = opts || {};
        const wrap = document.createElement('span');
        wrap.className = 'ss';
        wrap.innerHTML = `<input type="text" class="ss-input" autocomplete="off" spellcheck="false"><span class="ss-ar">▾</span>`;
        sel.parentNode.insertBefore(wrap, sel.nextSibling);
        sel.style.display = 'none';
        if (opts.minWidth) wrap.style.minWidth = opts.minWidth;
        const input = wrap.querySelector('.ss-input');
        const inst = { sel, wrap, input, q: '', active: 0 };
        sel._ss = inst;

        wrap.addEventListener('mousedown', e => e.stopPropagation());   // 点框本身不触发「点外面关闭」
        input.addEventListener('focus', () => { if (this._open !== inst) this.open(inst); });
        input.addEventListener('click', () => { if (this._open !== inst) this.open(inst); });
        input.addEventListener('input', () => {
            if (this._open !== inst) this.open(inst, true);
            inst.q = input.value; inst.active = 0; this._render(inst);
        });
        input.addEventListener('keydown', e => this._key(inst, e));
        input.addEventListener('blur', () => setTimeout(() => {
            // 焦点离开且没点到选项：收起并恢复当前选项文字
            if (this._open === inst && document.activeElement !== input && !(inst.panel && inst.panel.contains(document.activeElement))) this.close();
        }, 150));
        wrap.querySelector('.ss-ar').onclick = () => {
            if (this._open === inst) { this.close(); input.blur(); } else input.focus();
        };

        // 代码里直接改 sel.value / selectedIndex 时同步显示文字
        const proto = HTMLSelectElement.prototype;
        ['value', 'selectedIndex'].forEach(k => {
            const d = Object.getOwnPropertyDescriptor(proto, k);
            Object.defineProperty(sel, k, {
                configurable: true,
                get() { return d.get.call(this); },
                set(v) { d.set.call(this, v); SearchSelect._label(inst); },
            });
        });
        // 选项被重新填充（innerHTML）时同步
        new MutationObserver(() => this._open === inst ? this._render(inst) : this._label(inst)).observe(sel, { childList: true, subtree: true });
        sel.addEventListener('change', () => this._label(inst));
        this._label(inst);
        return inst;
    },

    _text(inst) {
        const o = inst.sel.options[inst.sel.selectedIndex];
        return o && o.value ? o.textContent : '';
    },

    _label(inst) {
        if (this._open === inst) return;   // 正在输入时不覆盖
        const o = inst.sel.options[inst.sel.selectedIndex];
        const text = this._text(inst);
        inst.input.value = text;
        inst.input.placeholder = (o && !o.value ? o.textContent : '') || '请选择';
        inst.input.title = text;
    },

    open(inst, typing) {
        this.close();
        this._open = inst;
        inst.q = '';
        inst.wrap.classList.add('open');
        const p = document.createElement('div');
        p.className = 'ss-panel';
        p.innerHTML = `<div class="ss-list"></div><div class="ss-foot"><span class="cnt"></span><span class="err"></span></div>`;
        p.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); });   // 点选项时输入框不失焦
        document.body.appendChild(p);
        inst.panel = p;
        const r = inst.wrap.getBoundingClientRect();
        const w = Math.max(r.width, 240);
        p.style.width = w + 'px';
        p.style.left = Math.min(r.left, window.innerWidth - w - 8) + 'px';
        const below = window.innerHeight - r.bottom;
        if (below < 260 && r.top > below) p.style.bottom = (window.innerHeight - r.top + 4) + 'px';
        else p.style.top = (r.bottom + 4) + 'px';
        // 展开时整段选中当前文字：直接打字即替换为搜索词，不打字则保持原值
        if (!typing) { inst.input.select(); inst.input.placeholder = this._text(inst) || inst.input.placeholder; }
        this._render(inst, true);
    },

    close() {
        const inst = this._open;
        if (!inst) return;
        if (inst.panel) inst.panel.remove();
        inst.panel = null;
        inst.wrap.classList.remove('open');
        inst.q = '';
        this._open = null;
        this._label(inst);
    },

    // 返回 null = 不匹配；否则返回 { score, html }（html 已转义并高亮命中部分）
    _match(text, q, re) {
        const esc = Utils.esc;
        if (re) {
            const m = text.match(re);
            if (!m) return null;
            const i = m.index, j = i + m[0].length;
            return { score: i, html: esc(text.slice(0, i)) + (j > i ? `<mark>${esc(text.slice(i, j))}</mark>` : '') + esc(text.slice(j)) };
        }
        const words = q.toLowerCase().split(/\s+/).filter(Boolean);
        if (!words.length) return { score: 0, html: esc(text) };
        const lower = text.toLowerCase();
        const hit = new Array(text.length).fill(false);
        let score = 0;
        for (const w of words) {
            const i = lower.indexOf(w);
            if (i >= 0) {                       // 连续子串：越靠前分越高
                for (let k = i; k < i + w.length; k++) hit[k] = true;
                score += i;
                continue;
            }
            let pos = 0, first = -1;            // 字符按顺序出现即可（如 sv 命中 SHEV）；不支持拼音
            for (const ch of w) {
                const k = lower.indexOf(ch, pos);
                if (k < 0) return null;
                if (first < 0) first = k;
                hit[k] = true;
                pos = k + 1;
            }
            score += 100 + (pos - first);       // 字符越分散分越低
        }
        let html = '', open = false;
        for (let k = 0; k < text.length; k++) {
            if (hit[k] && !open) { html += '<mark>'; open = true; }
            if (!hit[k] && open) { html += '</mark>'; open = false; }
            html += esc(text[k]);
        }
        if (open) html += '</mark>';
        return { score, html };
    },

    // 输入形如 /pattern/flags 时按正则匹配
    _regex(q) {
        const m = /^\/(.+)\/([a-z]*)$/.exec(q);
        if (!m) return { re: null };
        try { return { re: new RegExp(m[1], (m[2] || 'i').replace(/g/g, '')) }; }
        catch (e) { return { err: '正则无效：' + e.message }; }
    },

    _render(inst, scrollToSel) {
        const p = inst.panel;
        if (!p) return;
        const list = p.querySelector('.ss-list');
        const q = inst.q.trim();
        const { re, err } = this._regex(q);
        p.querySelector('.err').textContent = err || '';
        const fq = err ? '' : q;
        const items = [];
        Array.from(inst.sel.options).forEach((o, idx) => {
            if (!o.value) return;   // 「请选择」类占位项不进列表
            const text = o.textContent;
            const r = re ? (this._match(text, '', re) || (this._match(o.value, '', re) && { score: 50, html: Utils.esc(text) }))
                         : this._match(text, fq, null);
            if (r) items.push({ idx, o, ...r });
        });
        if (fq && !re) items.sort((a, b) => a.score - b.score);
        inst.items = items;
        if (inst.active >= items.length) inst.active = Math.max(0, items.length - 1);
        if (scrollToSel) {
            const k = items.findIndex(it => it.idx === inst.sel.selectedIndex);
            if (k >= 0) inst.active = k;
        }
        list.innerHTML = items.length
            ? items.map((it, k) => `<div class="ss-opt ${k === inst.active ? 'act' : ''} ${it.idx === inst.sel.selectedIndex ? 'sel' : ''}" data-k="${k}" title="${Utils.esc(it.o.textContent)}">${it.html}</div>`).join('')
            : '<div class="ss-empty">没有匹配项</div>';
        list.querySelectorAll('.ss-opt').forEach(el => {
            el.onmousemove = () => { if (inst.active !== +el.dataset.k) { inst.active = +el.dataset.k; this._hl(inst); } };
            el.onclick = () => this._pick(inst, +el.dataset.k);
        });
        p.querySelector('.cnt').textContent = `${items.length} 项${re ? ' · 正则' : (fq ? ' · 模糊' : ' · 可输入搜索，/正则/')}`;
        this._hl(inst);
    },

    _hl(inst) {
        const list = inst.panel && inst.panel.querySelector('.ss-list');
        if (!list) return;
        list.querySelectorAll('.ss-opt').forEach(el => el.classList.toggle('act', +el.dataset.k === inst.active));
        const a = list.querySelector('.ss-opt.act');
        if (a) a.scrollIntoView({ block: 'nearest' });
    },

    _key(inst, e) {
        if (this._open !== inst) {
            if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); this.open(inst); }
            return;
        }
        const n = (inst.items || []).length;
        if (e.key === 'ArrowDown') { e.preventDefault(); if (n) { inst.active = (inst.active + 1) % n; this._hl(inst); } }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) { inst.active = (inst.active - 1 + n) % n; this._hl(inst); } }
        else if (e.key === 'Enter') { e.preventDefault(); if (n) this._pick(inst, inst.active); }
        else if (e.key === 'Escape' || e.key === 'Tab') { this.close(); if (e.key === 'Escape') inst.input.blur(); }
    },

    _pick(inst, k) {
        const it = (inst.items || [])[k];
        if (!it) return;
        const changed = inst.sel.selectedIndex !== it.idx;
        this.close();
        inst.sel.selectedIndex = it.idx;
        inst.input.blur();
        if (changed) inst.sel.dispatchEvent(new Event('change', { bubbles: true }));
    },
};
document.addEventListener('mousedown', () => SearchSelect.close());
window.addEventListener('resize', () => SearchSelect.close());
document.addEventListener('scroll', (e) => {
    // 面板内部列表滚动不关闭，页面滚动时关闭（面板是 fixed 定位，不跟随）
    if (SearchSelect._open && SearchSelect._open.panel && SearchSelect._open.panel.contains(e.target)) return;
    SearchSelect.close();
}, true);
window.SearchSelect = SearchSelect;
</script>

<script>
/**
 * 三视角首页 · 完整前端渲染（严格对齐「首页功能设计-三视角原型.html」结构，数据接真实 /api/dashboard/three_view）。
 * 三个视角闭环：客户视角（OEM 全局）→ 项目视角（客户×电芯）→ 电芯视角（跨客户·同电芯）。
 * 含 SVG 图表工具 + 客户/项目/电芯三视角渲染 + 质量面板（预警/闭环/客诉 + 累积/增量）+ 项目排名切换 + 时间筛选。
 *
 * 对外 API（由 page1 调用）：
 *   ThreeView.loadCustomer(host, oem, cellCap)
 *   ThreeView.loadProject(host, oem, cellCap)
 *   ThreeView.loadCell(host, cellCap)
 *   ThreeView.setSwitch(fn)    // fn(view, payload) 让 page1 承接视角切换（如跳到项目/电芯视角）
 *   ThreeView.setTimeRange({mode, start, end})
 * 宿主容器统一为 page1 的 #p1Dashboard，页面级筛选条仍由 page1 维护。
 */
const ThreeView = (() => {
  // ---- 状态（原型同款）----
  const state = {
    qmetric: 'alarm',      // alarm/closed/complaint
    qacc: false,           // false=月增量 true=累积量
    rank: 'alarm',         // alarm/closed/conn/overdue（客户视角项目排名）
    gran: 'month',         // month/year/d15（接入走势粒度）
    timeRange: { mode: 'all', start: '', end: '' },   // 全局时间筛选：3m/6m/12m/all/custom
    level: 'Pack',         // Pack/Module/Cell（项目视角出货层级）
    view: 'customer',      // customer/project/cell
    oem: '',
    cellCap: '',
    current: null,         // 当前视角原始数据
  };
  // page1 承接视角切换（跳到项目/电芯视角等）
  let onSwitch = null;

  // ---- 颜色/图元 ----
  // 顺序色系：蓝、绿两组各三档（深 → 浅），取值随深浅主题切换（见 :root 的 --seq-*）。
  // 颜色跟着失效模式走，不跟排名走：同一模式在任何图里都是同一个颜色。
  const SEQ = { b1: 'var(--seq-b1)', b2: 'var(--seq-b2)', b3: 'var(--seq-b3)', g1: 'var(--seq-g1)', g2: 'var(--seq-g2)', g3: 'var(--seq-g3)', na: 'var(--seq-na)' };
  const COLORS = { ins: SEQ.b1, soc: SEQ.b2, cap: SEQ.b3, self: SEQ.g1, volt: SEQ.g2, heat: SEQ.g3, other: SEQ.na };
  function modeColor(name) {
    if (name.includes('绝缘')) return COLORS.ins;
    if (name.includes('SOC') || name.includes('一致')) return COLORS.soc;
    if (name.includes('容量')) return COLORS.cap;
    if (name.includes('自放电')) return COLORS.self;
    if (name.includes('压差') || name.includes('电压')) return COLORS.volt;
    if (name.includes('热失控') || name.includes('温')) return COLORS.heat;
    return COLORS.other;
  }

  const fmt = n => (n == null || n === '' ? '0' : Number(n).toLocaleString('zh-CN'));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const wan = n => {
    const v = Number(n) || 0;
    return v >= 10000 ? (v / 10000).toFixed(1).replace(/\.0$/, '') + '万' : fmt(v);
  };
  // 纵坐标「美观刻度」：把上限向上取整到 1/2/2.5/5 × 10^n，刻度均匀规整。
  // 例如 max=8325 → 上限 10000，5 线刻度 0/2500/5000/7500/10000；max=15000→20000，0/5千/1万/1.5万/2万。
  function niceMax(v) {
    v = (Number(v) || 0);
    if (v <= 0) return 10;
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / exp;                       // 1≤f<10
    const m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return m * exp;
  }
  // 按美观上限生成 0..n 的 5 等分刻度标签
  function tickLabels(max) {
    const step = max / 4;
    const out = [];
    for (let g = 4; g >= 0; g--) out.push(niceTick(step * g, max));
    return out;
  }
  function niceTick(v, max) {
    v = Number(v) || 0;
    if (v === 0) return '0';
    return wan(v);                            // ≥1万显示「X万」，<1万显示千分位整数(刻度已规整为整千/整百)
  }

  // ---- 时间筛选（原型：all/3m/6m/12m/custom，作用于质量矩阵）----
  function timeRangeLabels(allLabels) {
    const labs = (allLabels && allLabels.length) ? allLabels.slice() : [];
    const mode = state.timeRange.mode;
    // all 档=近24个月：质量矩阵已保留全量历史（预警外发 donut/总计用全量，与占比卡同源），
    // 走势堆叠图全量月份太长不可读，展示层截近 24 个月。
    if (mode === 'all' || !labs.length) return labs.slice(-24);
    if (mode === 'custom' && state.timeRange.start && state.timeRange.end) {
      const si = labs.indexOf(state.timeRange.start), ei = labs.indexOf(state.timeRange.end);
      if (si >= 0 && ei >= 0 && si <= ei) return labs.slice(si, ei + 1);
      return labs;
    }
    const n = mode === '3m' ? 3 : mode === '6m' ? 6 : mode === '12m' ? 12 : 0;
    if (n) return labs.slice(-n);
    return labs;
  }
  // 按时间范围 + 累积/增量 过滤质量矩阵
  // acc：是否转成逐月累积（默认跟随「月增量 / 累积量」开关，只影响走势图）
  function filterQuality(q, acc = state.qacc) {
    const allLabels = (q && q.labels) || [];
    const labs = timeRangeLabels(allLabels);
    const idx = labs.map(l => allLabels.indexOf(l)).filter(i => i >= 0);
    const pick = type => {
      const mx = (q && q[type]) || {};
      const out = {};
      Object.keys(mx).forEach(m => {
        out[m] = idx.map(i => (mx[m] && mx[m][allLabels[i]]) || 0);
      });
      return out;
    };
    let alarm = pick('alarm'), closed = pick('closed'), complaint = pick('complaint');
    if (acc) {
      const accum = mx => { const o = {}; Object.keys(mx).forEach(m => { let s = 0; o[m] = mx[m].map(v => s += v); }); return o; };
      alarm = accum(alarm); closed = accum(closed); complaint = accum(complaint);
    }
    return { labels: labs, alarm, closed, complaint };
  }

  // ---- SVG 折线 ----
  // todo#1：纵轴智能截断——数据波动幅度小（min > max*0.4）时下限不从 0 起，
  // 放大波动细节；左上角标注起点避免误读。opts.fromZero=true 可强制从 0。
  function niceStep(v) {
    v = Number(v) || 0; if (v <= 0) return 1;
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / exp;
    const m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return m * exp;
  }
  function lineChart(data, labels, color, opts) {
    if (!data || !data.length) return '<div class="t3-empty">暂无趋势数据</div>';
    opts = opts || {};
    const w = 600, h = 200, padL = 52, padR = 14, padT = 16, padB = 26;
    const iw = w - padL - padR, ih = h - padT - padB;
    const rawMax = Math.max(...data), rawMin = Math.min(...data);
    let min = 0, max = niceMax(rawMax);
    if (opts.fromZero !== true && rawMax > 0 && rawMin > rawMax * 0.4 && (rawMax - rawMin) < rawMax * 0.6) {
      const step = niceStep((rawMax - rawMin) / 3);
      min = Math.max(0, Math.floor((rawMin - step * 0.2) / step) * step);
      max = Math.max(rawMax, Math.ceil((rawMax + step * 0.2) / step) * step);
    }
    const xs = data.map((_, i) => padL + iw * i / (data.length - 1 || 1));
    const ys = data.map(v => padT + ih * (1 - (v - min) / ((max - min) || 1)));
    const pts = xs.map((x, i) => `${x},${ys[i]}`).join(' ');
    const id = 't3lg' + Math.floor(Math.random() * 1e6);
    const ticks = [4, 3, 2, 1, 0].map(g => niceTick(min + (max - min) * g / 4, max));
    let grid = '';
    for (let g = 0; g <= 4; g++) {
      const y = padT + ih * g / 4;
      grid += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--grid)"/>` +
        `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" class="tick">${ticks[g]}</text>`;
    }
    const xl = labels.map((l, i) => `<text x="${xs[i]}" y="${h - 7}" text-anchor="middle" class="tick">${esc(l)}</text>`).join('');
    const dots = data.map((v, i) => `<circle class="t3-dot" cx="${xs[i]}" cy="${ys[i]}" r="3.6" fill="${color}"><title>${esc(labels[i])}：${fmt(v)}</title></circle>`).join('');
    const area = `M${xs[0]},${padT + ih} ` + xs.map((x, i) => `L${x},${ys[i]}`).join(' ') + ` L${xs[xs.length - 1]},${padT + ih} Z`;
    return `<svg viewBox="0 0 ${w} ${h}" class="chart"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#${id})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
  }

  // ---- SVG 柱状 ----
  function barChart(data, labels, color, unit = '') {
    if (!data || !data.length) return '<div class="t3-empty">暂无数据</div>';
    const w = 600, h = 200, padL = 52, padR = 14, padT = 18, padB = 26;
    const iw = w - padL - padR, ih = h - padT - padB;
    const max = niceMax(Math.max(...data) * 1.15);   // 美观上限，刻度规整
    const bw = Math.min(38, iw / data.length * 0.55);
    const ticks = tickLabels(max);
    let grid = '';
    for (let g = 0; g <= 4; g++) {
      const y = padT + ih * g / 4;
      grid += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--grid)"/>` +
        `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" class="tick">${ticks[g]}</text>`;
    }
    const bars = data.map((v, i) => {
      const cx = padL + iw * (i + 0.5) / data.length;
      const bh = ih * v / max, y = padT + ih - bh;
      return `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(bh, 1.5)}" rx="4" fill="${color}" opacity=".88"><title>${esc(labels[i])}：${fmt(v)}${esc(unit)}</title></rect>` +
        `<text x="${cx}" y="${y - 5}" text-anchor="middle" class="tick">${v >= 10000 ? wan(v) : v}</text>` +
        `<text x="${cx}" y="${h - 7}" text-anchor="middle" class="tick">${esc(labels[i])}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" class="chart">${grid}${bars}</svg>`;
  }

  // ---- SVG 分组柱状图（双序列并排，todo 任务#5：各容量出货/接入对比） ----
  function groupedBarChart(labels, sA, sB) {
    if (!labels || !labels.length) return '<div class="t3-empty">暂无数据</div>';
    const w = 620, h = 210, padL = 52, padR = 14, padT = 18, padB = 30;
    const iw = w - padL - padR, ih = h - padT - padB;
    const max = niceMax(Math.max(...sA.data, ...sB.data, 1) * 1.15);
    const n = labels.length;
    const gw = iw / n;                       // 每组宽
    const bw = Math.min(26, gw * 0.32);      // 单柱宽
    const ticks = tickLabels(max);
    let grid = '';
    for (let g = 0; g <= 4; g++) {
      const y = padT + ih * g / 4;
      grid += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--grid)"/>` +
        `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" class="tick">${ticks[g]}</text>`;
    }
    let bars = '';
    labels.forEach((lab, i) => {
      const cx = padL + gw * (i + 0.5);
      [[sA, -1], [sB, 1]].forEach(([s, side]) => {
        const v = s.data[i] || 0;
        const bh = ih * v / max, y = padT + ih - bh;
        const x = cx + side * (bw / 2 + 1);
        bars += `<rect x="${x - bw / 2}" y="${y}" width="${bw}" height="${Math.max(bh, 1.5)}" rx="3" fill="${s.color}"><title>${esc(lab)} · ${esc(s.name)}：${fmt(v)}</title></rect>`;
        // 每根柱各自标注数量（0 不标；字号小、颜色随柱，与柱错开避免重叠）
        if (v > 0) {
          bars += `<text x="${x}" y="${y - 4}" text-anchor="middle" class="tick" style="font-size:8.5px;">${v >= 10000 ? wan(v) : v}</text>`;
        }
      });
      bars += `<text x="${cx}" y="${h - 8}" text-anchor="middle" class="tick">${esc(lab)}</text>`;
    });
    const legend = `<div class="legend lg-c"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${sA.color};margin-right:4px;"></i>${esc(sA.name)}</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${sB.color};margin-right:4px;"></i>${esc(sB.name)}</span></div>`;
    return `<svg viewBox="0 0 ${w} ${h}" class="chart">${grid}${bars}</svg>${legend}`;
  }

  // ---- SVG 环形 ----
  function donut(items) {
    if (!items || !items.length) return '<div class="t3-empty">暂无数据</div>';
    const total = items.reduce((s, i) => s + (i.value || 0), 0) || 1;
    const cx = 95, cy = 95, r = 62, sw = 28;
    let a0 = -90, segs = '';
    const rad = d => d * Math.PI / 180;
    items.forEach(it => {
      const a1 = a0 + 360 * it.value / total, large = (a1 - a0) > 180 ? 1 : 0;
      const p0 = [cx + r * Math.cos(rad(a0)), cy + r * Math.sin(rad(a0))];
      const p1 = [cx + r * Math.cos(rad(a1)), cy + r * Math.sin(rad(a1))];
      segs += `<path d="M${p0[0].toFixed(2)},${p0[1].toFixed(2)} A${r},${r} 0 ${large} 1 ${p1[0].toFixed(2)},${p1[1].toFixed(2)}" fill="none" stroke="${esc(it.color)}" stroke-width="${sw}" stroke-linecap="butt"><title>${esc(it.label)}：${fmt(it.value)}（${(100 * it.value / total).toFixed(1)}%）</title></path>`;
      a0 = a1;
    });
    const legend = items.map(it => `<span><i style="background:${esc(it.color)}"></i>${esc(it.label)} <b>${fmt(it.value)}</b>（${(100 * it.value / total).toFixed(1)}%）</span>`).join('');
    return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <svg viewBox="0 0 190 190" style="width:180px;flex:none">${segs}
        <text x="95" y="90" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--text-primary)">${wan(total)}</text>
        <text x="95" y="110" text-anchor="middle" class="tick">总计</text></svg>
      <div class="legend" style="flex-direction:column;align-items:flex-start;gap:8px">${legend}</div></div>`;
  }

  // ---- 堆叠柱（月×模式）----
  // 横轴密度：≤12 期单行「YY-MM」；13~36 期两行（上=月份数字，下=年份，仅年份起点标注 + 年分隔线）；
  // >36 期自动按季度汇总（增量求和、累积取季末值），横轴同为两行（上=Q1~Q4，下=年份）。
  // 每期标签都显示，不旋转、不隔行。
  function quarterize(labels, mx, modes, acc) {
    const keys = [], pos = {};
    labels.forEach((lb, i) => {
      const [yy, mm] = String(lb).split('-');
      const k = yy + 'Q' + Math.ceil((+mm || 1) / 3);
      if (!(k in pos)) { pos[k] = keys.length; keys.push({ key: k, yy, q: 'Q' + Math.ceil((+mm || 1) / 3), from: lb, to: lb, idx: [] }); }
      const g = keys[pos[k]]; g.to = lb; g.idx.push(i);
    });
    const out = {};
    modes.forEach(m => {
      const row = mx[m] || [];
      out[m] = keys.map(g => acc ? (row[g.idx[g.idx.length - 1]] || 0) : g.idx.reduce((s, i) => s + (row[i] || 0), 0));
    });
    return { keys, mx: out };
  }
  function stackedBar(fq, metric, acc = state.qacc) {
    let mx = (fq && fq[metric]) || {};
    const modes = Object.keys(mx).filter(m => (mx[m] || {}).hasOwnProperty('__vals') || Object.values(mx[m] || {}).some(v => v > 0));
    const rawLabels = (fq && fq.labels) || [];
    if (!rawLabels.length || !modes.length) return '<div class="t3-empty">该指标暂无数据</div>';
    // 横轴分组：每期 {top: 上行文字, yy: 年份, tip: 悬停名称}
    let cols;
    const byQuarter = rawLabels.length > 36;
    if (byQuarter) {
      const qz = quarterize(rawLabels, mx, modes, acc);
      mx = qz.mx;
      cols = qz.keys.map(g => ({ top: g.q, yy: g.yy, tip: `20${g.yy} ${g.q}（${g.from}~${g.to}）` }));
    } else {
      cols = rawLabels.map(lb => { const [yy, mm] = String(lb).split('-'); return { top: String(+mm || mm), yy, tip: lb, full: lb }; });
    }
    const twoRow = byQuarter || cols.length > 12;
    const n = cols.length;
    const w = 600, h = twoRow ? 232 : 220, padL = 52, padR = 14, padT = byQuarter ? 24 : 18, padB = twoRow ? 42 : 30;
    const iw = w - padL - padR, ih = h - padT - padB;
    const slot = iw / n;
    const totals = cols.map((_, i) => modes.reduce((s, m) => s + ((mx[m] || {})[i] || 0), 0));
    const max = niceMax(Math.max(...totals) * 1.15);   // 美观上限，刻度规整
    const stTicks = tickLabels(max);
    let grid = '';
    for (let g = 0; g <= 4; g++) {
      const y = padT + ih * g / 4;
      grid += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--grid)"/>` +
        `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" class="tick">${stTicks[g]}</text>`;
    }
    const bw = Math.min(38, slot * 0.55);
    const totLabel = v => v >= 10000 ? wan(v) : String(v);
    // 柱顶合计：估算文字宽度（10.5px 字号约 6.2/字符），放不下时只在悬停提示里显示
    const totFits = Math.max(...totals.map(v => totLabel(v).length)) * 6.2 + 4 <= slot;
    let bars = '';
    cols.forEach((c, i) => {
      const cx = padL + slot * (i + 0.5);
      let yB = padT + ih;
      modes.forEach(m => {
        const v = (mx[m] || {})[i]; if (!v) return;
        const bh = ih * v / max, y = yB - bh;
        bars += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(bh, 0.5)}" fill="${modeColor(m)}" stroke="var(--bg-input)" stroke-width="1.5"><title>${esc(c.tip)} · ${esc(m)}：${fmt(v)}（合计 ${fmt(totals[i])}）</title></rect>`;
        yB = y;
      });
      const yAx = padT + ih;
      if (twoRow) {
        bars += `<text x="${cx}" y="${yAx + 14}" text-anchor="middle" class="tick" style="font-size:9.5px;">${esc(c.top)}</text>`;
        const newYear = i === 0 || cols[i - 1].yy !== c.yy;
        if (newYear) {
          if (i > 0) bars += `<line x1="${padL + slot * i}" y1="${yAx + 3}" x2="${padL + slot * i}" y2="${yAx + 34}" stroke="var(--grid)"/>`;
          // 年份段太窄（如首段只有 1 期）时放不下「2024」，改写「'24」，再窄就省略，避免与下一年重叠
          let span = 0; while (i + span < n && cols[i + span].yy === c.yy) span++;
          const yTxt = span * slot >= 34 ? '20' + c.yy : span * slot >= 22 ? "'" + c.yy : '';
          if (yTxt) bars += `<text x="${padL + slot * i + 4}" y="${yAx + 31}" class="tick" style="font-size:10px;font-weight:600;">${esc(yTxt)}</text>`;
        }
      } else {
        bars += `<text x="${cx}" y="${yAx + 14}" text-anchor="middle" class="tick" style="font-size:9px;">${esc(c.full)}</text>`;
      }
      if (totals[i] > 0 && totFits) bars += `<text x="${cx}" y="${yB - 5}" text-anchor="middle" class="tick">${totLabel(totals[i])}</text>`;
    });
    const note = byQuarter ? `<text x="${w - padR}" y="12" text-anchor="end" class="tick">共 ${rawLabels.length} 个月 · 已按季度汇总</text>` : '';
    const legend = modes.map(m => `<span><i style="background:${modeColor(m)}"></i>${esc(m)}</span>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" class="chart">${note}${grid}${bars}</svg><div class="legend lg-c">${legend}</div>`;
  }

  // ---- KPI 卡 ----
  // 过保数(率)：「1,944（0.38%）」，率 = 过保数 / 累计出货(Pack)
  function overdueVal(n, base) {
    if (n == null) return '-';
    return `${fmt(n)}<span class="vr">（${base ? (100 * n / base).toFixed(2) : '0.00'}%）</span>`;
  }
  function kpiCards(list) {
    // k.tip：口径说明放在悬停提示里，卡片上只留数字
    return list.map(k => `<div class="t3-kpi ${k.cls || ''}"${k.tip ? ` title="${esc(k.tip)}"` : ''}><div class="lab">${k.icon} ${esc(k.label)}</div><div class="val">${k.val}</div><div class="sub">${esc(k.sub || '')}</div></div>`).join('');
  }

  // ---- 排名条 ----
  function renderRanking(items, color, unit = '') {
    if (!items || !items.length) return '<div class="t3-empty">暂无排名数据</div>';
    const max = Math.max(...items.map(i => i.value)) || 1;
    return items.map((it, i) => {
      const pct = (100 * it.value / max).toFixed(1);
      return `<div class="rank-row"><div class="rank-pos ${i < 3 ? 'top' : ''}">${i + 1}</div><div class="rank-name">${esc(it.name)}</div><div class="rank-bar"><i style="width:${pct}%;background:${esc(color)}"></i></div><div class="rank-val">${fmt(it.value)}${esc(unit)}</div><div class="rank-sub">${esc(it.sub || '')}</div></div>`;
    }).join('');
  }

  // ---- 时间线 ----
  function renderTimeline(events) {
    if (!events || !events.length) return '<div class="t3-empty">暂无关键处置事件</div>';
    return `<div class="t3-tl-wrap">${events.map(e => `
      <div class="t3-tl ${e.st || 'b'}">
        <div class="t3-tl-date">${esc(e.date || '')}</div>
        <div class="t3-tl-title">${esc(e.title || '')}</div>
        <div class="t3-tl-desc">${esc(e.desc || '')}</div>
      </div>`).join('')}</div>`;
  }

  // ---- 质量面板（预警/闭环/客诉 + 累积/增量 + 堆叠柱 + 甜甜圈 + 明细表）----
  const QMETA = {
    alarm: { label: '预警外发', icon: '⚠️', color: SEQ.b2, unit: ' 单' },
    closed: { label: '市场闭环', icon: '✅', color: SEQ.g2, unit: ' 单' },
    complaint: { label: '客诉', icon: '📣', color: SEQ.b1, unit: ' 单' },
  };
  function metricByMode(fq, metric) {
    const mx = (fq && fq[metric]) || {};
    return Object.keys(mx).map(m => {
      // 过滤后的矩阵(fq)按下标存数组，原始矩阵(q)按月份标签存对象，两种都要支持
      const row = mx[m] || {};
      const arr = Array.isArray(row) ? row : (fq.labels || []).map(l => row[l] || 0);
      return { label: m, value: arr.reduce((s, v) => s + v, 0), color: modeColor(m) };
    }).filter(x => x.value > 0).sort((a, b) => b.value - a.value);
  }
  // 看板表格列宽：按百分比给出各列建议宽度（空串=自适应分剩余），自动布局下内容不会被截断
  const colg = (...w) => `<colgroup>${w.map(x => x ? `<col style="width:${x}%">` : '<col>').join('')}</colgroup>`;
  // 表头对齐方式同步到同列单元格，保证表头与内容对齐一致
  function alignCells(t) {
    const al = [...t.querySelectorAll('thead th')].map(th => th.classList.contains('num') ? 'num' : th.classList.contains('ctr') ? 'ctr' : '');
    t.querySelectorAll('tbody tr').forEach(tr => {
      if (tr.cells.length !== al.length) return;
      [...tr.cells].forEach((td, i) => { if (al[i]) td.classList.add(al[i]); });
    });
  }
  // 给 host 内所有看板表格启用点击表头排序（todo 任务#3）
  function enableSort(host) {
    host.querySelectorAll('table.t3-tbl').forEach(alignCells);
    if (window.Utils && Utils.enableTableSort) {
      host.querySelectorAll('table.t3-tbl').forEach(t => Utils.enableTableSort(t));
    }
  }

  // ---- 单图表下载 PNG（todo：用户可能想拿图去贴报告/PPT）----
  // SVG 内联在页面里，序列化后脱离页面 CSS（var() 失效），需注入变量与 .tick 样式；
  // 背景填当前主题 body 底色，保证导出图与页面所见一致。
  async function downloadChartSvg(svg, name) {
    try {
      const vb = (svg.getAttribute('viewBox') || '0 0 600 200').split(/\s+/).map(Number);
      const w = vb[2] || 600, h = vb[3] || 200;
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', w); clone.setAttribute('height', h);
      const cs = getComputedStyle(document.documentElement);
      const vars = ['--grid', '--muted', '--text-primary', '--text-muted', '--text-secondary',
                    '--accent', '--ok', '--danger', '--warn', '--bg-secondary', '--panel', '--bg-input',
                    '--seq-b1', '--seq-b2', '--seq-b3', '--seq-g1', '--seq-g2', '--seq-g3', '--seq-na']
        .map(v => `${v}:${cs.getPropertyValue(v).trim()}`).filter(s => !s.endsWith(':')).join(';');
      const st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      st.textContent = `svg{${vars}} text{font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;} .tick{font-size:10.5px;fill:var(--muted);}`;
      clone.insertBefore(st, clone.firstChild);
      const xml = new XMLSerializer().serializeToString(clone);
      const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const scale = 2;                       // 2x 导出，贴文档更清晰
      const cv = document.createElement('canvas');
      cv.width = w * scale; cv.height = h * scale;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = getComputedStyle(document.body).backgroundColor || '#fff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = `${name}_${new Date().toISOString().slice(0, 10)}.png`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      }, 'image/png');
      Toast.success('图表已下载为 PNG');
    } catch (e) {
      Toast.error('图表导出失败：' + (e && e.message));
    }
  }

  function _svgName(svg) {
    // 从 svg 向上找最近的卡片标题 / 面板小标题当文件名
    let el = svg;
    while (el && el !== document.body) {
      const t = el.querySelector && (el.querySelector(':scope > .chead .ctitle, :scope > .qsub'));
      if (t && t.textContent.trim()) return t.textContent.trim().replace(/[\\\/:*?"<>|\s]+/g, '_').slice(0, 40);
      el = el.parentElement;
    }
    return '图表';
  }

  function addChartDownloads(host) {
    host.querySelectorAll('svg').forEach(svg => {
      const wrap = svg.parentElement;
      if (!wrap || wrap.querySelector(':scope > .t3-svgdl')) return;
      if (!svg.getAttribute('viewBox')) return;      // 跳过非图表 svg
      wrap.style.position = 'relative';
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm btn-secondary t3-svgdl';
      btn.textContent = '⬇ PNG';
      btn.title = '下载该图表为 PNG 图片';
      btn.onclick = () => downloadChartSvg(svg, _svgName(svg));
      // 走势图右上角已有「月增量 / 累积量」，PNG 按钮放进标题行，排在切换按钮左边，避免重叠
      const head = wrap.querySelector(':scope > .qbox-head');
      if (head) { btn.classList.add('in-head'); head.insertBefore(btn, head.lastElementChild); }
      else wrap.appendChild(btn);
    });
  }

  function renderQualityPanel(container, q, key, outgoingModes) {
    const fq = filterQuality(q);            // 走势图：随「月增量 / 累积量」
    const fqi = filterQuality(q, false);    // 占比、合计、明细表：固定按区间内月增量求和
    const m = state.qmetric, meta = QMETA[m];
    const byMode = metricByMode(fqi, m);
    const total = byMode.reduce((s, x) => s + x.value, 0);
    // 环形图、明细表、区间合计统一按当前时间范围统计，避免同一张卡上两个总数对不上
    const accLabel = state.qacc ? '累积量' : '月增量';
    const metricTabs = Object.keys(QMETA).map(k => `<button data-qm="${k}" class="${k === m ? 'on' : ''}">${QMETA[k].icon} ${QMETA[k].label}</button>`).join('');
    const accTabs = `<button data-qa="0" class="${!state.qacc ? 'on' : ''}">月增量</button><button data-qa="1" class="${state.qacc ? 'on' : ''}">累积量</button>`;
    const labels = fq.labels || [];
    const range = labels.length ? `${labels[0]} ~ ${labels[labels.length - 1]}` : '-';
    // 明细：预警 / 闭环 / 闭环率 / 客诉 一张表（原「客户重点失效模式」并入这里）
    // 明细表固定展示，不随「预警外发 / 市场闭环 / 客诉」和「月增量 / 累积量」切换
    const sumOf = (metric, mode) => ((fqi[metric] || {})[mode] || []).reduce((a, v) => a + v, 0);
    const allModes = Array.from(new Set([].concat(Object.keys(fqi.alarm || {}), Object.keys(fqi.closed || {}), Object.keys(fqi.complaint || {}))));
    const rows = allModes.map(mode => ({ mode, alarm: sumOf('alarm', mode), closed: sumOf('closed', mode), complaint: sumOf('complaint', mode) }))
      .filter(r => r.alarm || r.closed || r.complaint)
      .sort((a, b) => b.alarm - a.alarm);
    const tot = rows.reduce((t, r) => ({ alarm: t.alarm + r.alarm, closed: t.closed + r.closed, complaint: t.complaint + r.complaint }), { alarm: 0, closed: 0, complaint: 0 });
    const rate = (c, a) => a ? (100 * c / a).toFixed(1) + '%' : '-';
    const share = v => tot.alarm ? (100 * v / tot.alarm).toFixed(1) + '%' : '-';
    const modeTable = `<table class="t3-tbl" style="table-layout:fixed">${colg(...Array(6).fill(100 / 6))}<thead><tr><th>失效模式</th><th class="num">⚠️ 预警外发</th><th class="num">✅ 闭环</th><th class="num">闭环率</th><th class="num">📣 客诉</th><th class="num">预警占比</th></tr></thead><tbody>${
      rows.map(r => `<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${modeColor(r.mode)};margin-right:7px"></i><b>${esc(r.mode)}</b></td>
        <td class="num"><b>${fmt(r.alarm)}</b></td><td class="num">${fmt(r.closed)}</td><td class="num">${rate(r.closed, r.alarm)}</td>
        <td class="num">${fmt(r.complaint)}</td><td class="num">${share(r.alarm)}</td></tr>`).join('')
    }<tr style="background:var(--bg-secondary)"><td><b>合计</b></td><td class="num"><b>${fmt(tot.alarm)}</b></td><td class="num"><b>${fmt(tot.closed)}</b></td><td class="num">${rate(tot.closed, tot.alarm)}</td><td class="num"><b>${fmt(tot.complaint)}</b></td><td class="num">100%</td></tr></tbody></table>`;
    container.innerHTML = `<div class="qpanel">
      <div class="t3-grid2 r21">
        <div class="qbox">
          <div class="qbox-head"><div class="qsub">${meta.icon} ${esc(meta.label)}走势</div>
            <div class="seg" id="t3QA${key}">${accTabs}</div></div>
          ${stackedBar(fq, m)}</div>
        <div class="qbox" style="display:flex;flex-direction:column;">
          <div class="qsub">${meta.icon} ${esc(meta.label)}占比</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;">${donut(byMode)}</div>
        </div>
      </div>
      <div style="margin-top:12px">${modeTable}</div>
    </div>`;
    // 指标切换放在卡片标题「质量分析」同一行；月增量 / 累积量只控制走势图，放在走势图右上角
    const head = document.getElementById('t3QHead' + key);
    if (head) head.innerHTML = `<div class="seg" id="t3QM${key}">${metricTabs}</div>
        <span class="qinfo">${esc(range)} · ${esc(meta.label)}合计 <b>${fmt(total)}</b>${esc(meta.unit)}</span>`;
    const qm = document.getElementById('t3QM' + key);
    const qa = document.getElementById('t3QA' + key);
    if (qm) qm.addEventListener('click', e => { const b = e.target.closest('button[data-qm]'); if (b) { state.qmetric = b.dataset.qm; reframe(); } });
    if (qa) qa.addEventListener('click', e => { const b = e.target.closest('button[data-qa]'); if (b) { state.qacc = b.dataset.qa === '1'; reframe(); } });
  }

  // 用当前视角最新数据整体重渲染（质量面板 Tab 切换 / 时间筛选变化后调用）。
  // 背景：quality 面板的表单状态(state.qmetric/qacc/timeRange)已更新，
  // 此处按 state.view 重新渲染整个视角，保证时间筛选/累积量刷新到位。
  function reframe() {
    const host = document.getElementById('p1Dashboard');
    if (!host || !state.current) return;
    if (state.view === 'customer') renderCustomer(host, state.current, state.oem);
    else if (state.view === 'project') renderProject(host, state.current, state.oem);
    else if (state.view === 'cell') renderCell(host, state.current);
  }

  // ==========================================================================
  // 客户视角
  // ==========================================================================
  function renderCustomer(host, d, oem) {
    state.view = 'customer'; state.current = d; state.oem = oem; state.cellCap = d.cellCap || state.cellCap;
    const k = d.kpi || {};
    const closeRate = k.alarm ? (100 * (k.closed || 0) / k.alarm).toFixed(1) + '%' : '-';
    const two = (a, b) => `${a}<span class="v2"> / ${b}</span>`;
    const kpis = kpiCards([
      { icon: '🚗', label: '累计出货', val: wan(k.cellShip) + ' 颗', sub: `${fmt(k.packShip)} 包`, cls: 'hl', tip: '电芯出货累计，历史累计，不随时间筛选' },
      { icon: '📦', label: '累计接入', val: fmt(k.conn), tip: '历史累计，不随时间筛选' },
      { icon: '⏳', label: '过保数(率)', val: overdueVal(k.overdue, k.packShip), tip: '过保 = 超出质保条款；过保率 = 过保数 / 累计出货(Pack)' },
      { icon: '⚡', label: '活跃车辆', val: fmt(k.active), sub: '近90天', tip: '近90天有数据上报的车辆' },
      { icon: '⚠️', label: '预警外发 / 已闭环', val: two(fmt(k.alarm), fmt(k.closed)), sub: `闭环率 ${closeRate}`, cls: 'bad', tip: '历史累计' },
      { icon: '📊', label: '近7天预警 / 闭环', val: two(k.alarm7 || 0, k.closed7 || 0), cls: 'bad' },
    ]);

    const tr = d.trend || {};
    // 接入走势按粒度选数据：month/year/d15 均为实际接入量（增量，不累加，todo#1）
    const useD15 = state.gran === 'd15';
    const useYear = state.gran === 'year';
    const trendData = useD15 ? (tr.days_data || []) : useYear ? (tr.year_data || []) : (tr.data || []);
    const trendLabels = useD15 ? (tr.days_labels || []) : useYear ? (tr.year_labels || []) : (tr.labels || []);
    const trendHtml = lineChart(trendData, trendLabels, SEQ.b2);
    const granTabs = `<button data-g="month" class="${(!useD15 && !useYear) ? 'on' : ''}">by 月</button><button data-g="year" class="${useYear ? 'on' : ''}">by 年</button><button data-g="d15" class="${useD15 ? 'on' : ''}">近15天</button>`;

    // 项目列表（点击行 → 进入项目视角）
    const projRows = (d.projects || []).map(p => {
      const connRate = p.connRate != null ? p.connRate + '%' : 'N/A';
      const odRate = p.pack ? (100 * (p.overdue || 0) / p.pack).toFixed(2) + '%' : '-';
      const clRate = p.alarm ? (100 * (p.closed || 0) / p.alarm).toFixed(1) + '%' : '-';
      return `<tr style="cursor:pointer" onclick="ThreeView.gotoProject('${esc(oem)}','${esc(p.cap)}')">
        <td><b>${esc(p.name)}</b></td><td class="num">${esc(p.cap)}</td><td>${esc(p.struct || '-')}</td>
        <td><span class="pill g">量产</span></td><td>${esc(p.sop || '-')}</td>
        <td class="num">${fmt(p.pack)}</td><td class="num">${fmt(p.conn)}</td><td class="num">${esc(connRate)}</td>
        <td class="num">${fmt(p.overdue)}（${esc(odRate)}）</td><td class="num">${fmt(p.alarm)}</td>
        <td class="num">${fmt(p.closed)}（${esc(clRate)}）</td>
        <td><span class="lk">进入项目视角 →</span></td></tr>`;
    }).join('') || '<tr><td colspan="12" class="t3-empty">暂无电芯项目数据</td></tr>';

    // 失效模式汇总（响应时间筛选 + 累积/增量）
    const fq = filterQuality(d.quality || { labels: [], alarm: {}, closed: {}, complaint: {} });
    const accLabel = state.qacc ? '累积量' : '区间合计';
    const modeAgg = {};
    ['alarm', 'closed', 'complaint'].forEach(metric => {
      Object.keys(fq[metric] || {}).forEach(mode => {
        modeAgg[mode] = modeAgg[mode] || { name: mode, alarm: 0, closed: 0, complaint: 0 };
        modeAgg[mode][metric] = (fq[metric][mode] || []).reduce((s, v) => s + v, 0);
      });
    });
    const modes = Object.values(modeAgg).sort((a, b) => (b.alarm + b.closed + b.complaint) - (a.alarm + a.closed + a.complaint));
    const grandAlarm = modes.reduce((s, m) => s + m.alarm, 0);
    const grandClosed = modes.reduce((s, m) => s + m.closed, 0);
    const grandComp = modes.reduce((s, m) => s + m.complaint, 0);
    const modeRowsHtml = modes.map(m => {
      const cr = m.alarm ? (100 * m.closed / m.alarm).toFixed(1) + '%' : '-';
      return `<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${modeColor(m.name)};margin-right:7px"></i><b>${esc(m.name)}</b></td>
      <td class="num"><b>${fmt(m.alarm)}</b></td><td class="num">${fmt(m.closed)}</td><td class="num">${esc(cr)}</td>
      <td class="num">${fmt(m.complaint)}</td><td>-</td></tr>`;
    }).join('') + (modes.length ? `<tr style="background:var(--bg-secondary)"><td><b>合计</b></td><td class="num"><b>${fmt(grandAlarm)}</b></td><td class="num"><b>${fmt(grandClosed)}</b></td><td class="num">${grandAlarm ? (100 * grandClosed / grandAlarm).toFixed(1) + '%' : '-'}</td><td class="num"><b>${fmt(grandComp)}</b></td><td>-</td></tr>` : '');

    // 排名
    const rankMeta = { alarm: { label: '预警外发', color: SEQ.b2, unit: '' }, closed: { label: '市场闭环', color: SEQ.g2, unit: '' }, conn: { label: '接入数', color: SEQ.b1, unit: '' }, overdue: { label: '过保数', color: SEQ.g1, unit: '' } };
    const rm = rankMeta[state.rank] || rankMeta.alarm;
    const rankItems = (d.projects || []).map(p => {
      const val = state.rank === 'conn' ? (p.conn || 0) : state.rank === 'overdue' ? (p.overdue || 0) : state.rank === 'closed' ? (p.closed || 0) : (p.alarm || 0);
      let sub = '';
      if (state.rank === 'conn') sub = p.connRate != null ? p.connRate + '%' : 'N/A';
      else if (state.rank === 'closed') sub = p.alarm ? (100 * (p.closed || 0) / p.alarm).toFixed(1) + '%' : '-';
      else if (state.rank === 'overdue') sub = p.pack ? (100 * (p.overdue || 0) / p.pack).toFixed(2) + '%' : '-';
      else sub = `近7天 ${p.alarm7 || 0}`;
      return { name: p.name, value: val, sub };
    }).sort((a, b) => b.value - a.value);

    // 关系区
    const contacts = (d.contacts || []).map(c => `<div class="person"><div class="av">${esc((c.name || '?')[0])}</div><div><div>${esc(c.name || '')}</div><div class="role">${esc(c.role || '')}</div></div><div class="tel">${esc(c.tel || '')}</div></div>`).join('') || '<div class="t3-empty">暂无关键人</div>';
    const visits = (d.visits || []).map(v => `<div class="visit"><div class="dot" style="background:${v.st === 'r' ? 'var(--danger)' : v.st === 'o' ? 'var(--warn)' : 'var(--ok)'}"></div><div class="vt" title="${esc(v.t)}">${esc(v.t)}</div><div class="meta">${esc(v.who || '')} · <span class="pill ${v.st}">${esc(v.stTxt || '')}</span></div></div>`).join('') || '<div class="t3-empty">暂无拜访计划</div>';
    const meetings = (d.meetings || []).map(m => `<div class="meet"><div>${esc(m.t)}</div><div class="meta">${esc(m.m)}</div></div>`).join('') || '<div class="t3-empty">暂无会议</div>';
    const events = renderTimeline(d.events);

    host.innerHTML = `
      ${window.T3_EXTRA ? window.T3_EXTRA : ''}
      <!-- KPI -->
      <div class="t3-kpis">${kpis}</div>
      <!-- 接入走势（左）+ 各容量出货/接入对比（右）并排 -->
      <div class="t3-grid2">
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle">📈 接入走势</div></div>
            <div class="seg" id="t3Gran">${granTabs}</div></div>
          <div class="t3-trend">${trendHtml}</div>
        </div>
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="按电芯容量分组 · 双柱各标数量">📊 各容量出货 / 接入对比</div></div></div>
          <div>${groupedBarChart(
            (d.projects || []).map(p => String(p.cap || p.name || '')),
            { name: '出货(Pack)', color: SEQ.b2, data: (d.projects || []).map(p => p.pack || 0) },
            { name: '接入车辆', color: SEQ.g2, data: (d.projects || []).map(p => p.conn || 0) }
          )}</div>
        </div>
      </div>
      <!-- 质量分析（整行放大，与项目/电芯视角一致，todo 任务#6） -->
      <div class="t3-card">
        <div class="chead"><div class="ctitle" title="by 失效模式 · 累积/增量 + 时间筛选">📊 质量分析</div><div class="qtabs" id="t3QHeadCust"></div></div>
        <div id="t3CustQuality"></div>
      </div>
      <div class="t3-grid2 equal">
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="定位哪个项目拖后腿">🏆 项目排名</div></div>
            <div class="seg" id="t3RankSeg">${Object.keys(rankMeta).map(k => `<button data-r="${k}" class="${k === state.rank ? 'on' : ''}">${rankMeta[k].label}</button>`).join('')}</div></div>
          <div id="t3Ranking">${renderRanking(rankItems, rm.color)}</div>
        </div>
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="召回 / OTA / 停线 / 批量预警 / 索赔 / 质量会">🚨 关键处置事件</div></div>
            <div class="acts"><button class="btn btn-sm btn-secondary" onclick="Page1.addEvent('${esc(oem)}','')">＋ 录入</button></div></div>
          <div id="t3CustEvents">${events}</div>
        </div>
      </div>
      <!-- 项目列表 -->
      <div class="t3-card">
        <div class="chead"><div><div class="ctitle" title="一行 = 一款电芯（容量 × 结构），点击行进入项目视角">🗂️ 电芯项目</div></div></div>
        <div class="tblwrap"><table class="t3-tbl">${colg(12, 7, 8, 7, 7, 10, 7, 7, 9, 7, 9, 10)}<thead>
          <tr><th>电芯项目</th><th class="num">容量(Ah)</th><th>电池结构</th><th class="ctr">状态</th><th>SOP</th><th class="num">累计出货(Pack)</th><th class="num">接入数</th><th class="num">接入率</th><th class="num">过保数(率)</th><th class="num">预警外发</th><th class="num">已闭环(率)</th><th class="ctr">操作</th></tr>
        </thead><tbody>${projRows}</tbody></table></div>
      </div>
      <!-- 关键人 / 拜访 / 会议：每块都能直接新增或跳到对应页面 -->
      <div class="t3-people">
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle">👥 关键人</div></div>
            <div class="acts"><button class="btn btn-sm btn-secondary" onclick="Page1.showAddPersonModal()">＋ 新增</button><button class="btn btn-sm btn-secondary" onclick="App.navigate('page2')">全部 →</button></div></div>
          <div id="t3Contacts">${contacts}</div>
        </div>
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="绿=已完成 · 橙=进行中 · 红=待拜访">📅 拜访计划</div></div>
            <div class="acts"><button class="btn btn-sm btn-secondary" onclick="Page1.showAddVisitModal()">＋ 新增</button><button class="btn btn-sm btn-secondary" onclick="App.navigate('page2')">全部 →</button></div></div>
          <div id="t3Visits">${visits}</div>
        </div>
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle">📝 近期会议</div></div>
            <div class="acts"><button class="btn btn-sm btn-secondary" onclick="Page1.showAddMeetingModal()">＋ 新增</button><button class="btn btn-sm btn-secondary" onclick="App.navigate('page3')">全部 →</button></div></div>
          <div id="t3Meetings">${meetings}</div>
        </div>
      </div>
      `;

    // 质量面板 + 交互绑定
    renderQualityPanel(document.getElementById('t3CustQuality'), d.quality || { labels: [], alarm: {}, closed: {}, complaint: {} }, 'Cust', d.outgoingModes);
    enableSort(host);
    addChartDownloads(host);   // 单图表下载 PNG
    const gran = document.getElementById('t3Gran');
    if (gran) gran.addEventListener('click', e => {
      const b = e.target.closest('button[data-g]'); if (!b) return;
      state.gran = b.dataset.g;          // month=累计 / d15=近15天，切换后重渲染换图
      renderCustomer(host, d, oem);
    });
    const rseg = document.getElementById('t3RankSeg');
    if (rseg) rseg.addEventListener('click', e => {
      const b = e.target.closest('button[data-r]'); if (!b) return;
      state.rank = b.dataset.r;
      document.querySelectorAll('#t3RankSeg button').forEach(x => x.classList.toggle('on', x === b));
      renderCustomer(host, d, oem);
    });
    // 自定义模块在看板下方的 #p1Modules，由 page1 初始化一次（此处不再重复渲染）
  }

  // ==========================================================================
  // 项目视角（客户 × 电芯容量）
  // ==========================================================================
  function renderProject(host, d, oem) {
    state.view = 'project'; state.current = d; state.oem = oem; state.cellCap = d.cellCap || state.cellCap;
    const info = d.info || {};
    const closeRate = info.alarm ? (100 * (info.closed || 0) / info.alarm).toFixed(1) + '%' : '-';
    const connRate = info.packShip ? (100 * (info.conn || 0) / info.packShip).toFixed(1) + '%'
      : (info.connRate != null ? info.connRate + '%' : '-');
    // 出货层级：Pack / Module / Cell（对齐原型，点击切换）
    const LEVEL = { Pack: { key: 'packShip', unit: '包', icon: '📦', sub: '' },
                    Module: { key: 'moduleShip', unit: '模组', icon: '🧱', sub: '' },
                    Cell: { key: 'cellShip', unit: '颗', icon: '🔋', sub: '' } };
    const lv = LEVEL[state.level] || LEVEL.Pack;
    const lvVal = info[lv.key] || 0;
    const lvSub = state.level === 'Pack' ? `模组 ${fmt(info.moduleShip)} · 电芯 ${fmt(info.cellShip)} 颗`
      : state.level === 'Module' ? `${fmt(info.packShip)} 包`
      : `${fmt(info.packShip)} 包`;
    const two = (a, b) => `${a}<span class="v2"> / ${b}</span>`;
    const levelTabs = `<div class="seg" id="t3LevelSeg">${['Pack', 'Module', 'Cell'].map(k =>
      `<button data-l="${k}" class="${k === state.level ? 'on' : ''}">${LEVEL[k].icon} ${k}</button>`).join('')}</div>`;
    const kpis = kpiCards([
      { icon: lv.icon, label: `累计出货（${state.level}）`, val: wan(lvVal) + ' ' + lv.unit, sub: lvSub, cls: 'hl', tip: '出货条码累计' },
      { icon: '📥', label: '累计接入', val: fmt(info.conn), sub: `接入率 ${connRate}`, tip: '接入率 = 接入 / 出货(Pack)' },
      { icon: '🗓️', label: '近15天接入', val: fmt(info.access15 != null ? info.access15 : '-'), tip: '近15天有接入记录的车辆' },
      { icon: '⏳', label: '过保数(率)', val: overdueVal(info.overdue, info.packShip), tip: '过保 = 超出质保条款；过保率 = 过保数 / 累计出货(Pack)' },
      { icon: '⚠️', label: '预警外发 / 已闭环', val: two(fmt(info.alarm), fmt(info.closed)), sub: `闭环率 ${closeRate}`, cls: 'bad', tip: '历史累计' },
      { icon: '📊', label: '近7天预警 / 闭环', val: two(info.alarm7 || 0, info.closed7 || 0), cls: 'bad' },
    ]);
    const structCap = `${info.struct || '-'} · ${info.cap != null ? info.cap : ''}Ah`;

    // 信息条
    const infoStrip = `<div class="t3-strip">
      <div class="it">项目状态<b><span class="pill g">量产</span></b></div>
      <div class="it">SOP 时间<b>${esc(info.sop || '-')}</b></div>
      <div class="it">电池结构<b>${esc(info.struct || '-')}</b></div>
      <div class="it">单包电芯<b>${info.s ? info.s + ' 颗（串联）' : '-'}</b></div>
      <div class="it">电芯容量<b>${esc(info.cap != null ? info.cap + ' Ah' : '-')}</b></div>
      <div class="it">质保条款<b>${esc(info.qy || '-')} / ${esc(info.qkm || '-')} km / SOH ${esc(info.qsoh || '-')}</b></div>
    </div>`;

    const tr = d.trend || {};
    // 接入走势三粒度（todo#2：参考客户视角，数据带 cell_cap 限制，均为实际接入量）
    const useD15 = state.gran === 'd15';
    const useYear = state.gran === 'year';
    const trendData = useD15 ? (tr.days_data || []) : useYear ? (tr.year_data || []) : (tr.data || []);
    const trendLabels = useD15 ? (tr.days_labels || []) : useYear ? (tr.year_labels || []) : (tr.labels || []);
    const trendHtml = lineChart(trendData, trendLabels, SEQ.b2);
    const granTabs = `<div class="seg" id="t3Gran"><button data-g="month" class="${(!useD15 && !useYear) ? 'on' : ''}">by 月</button><button data-g="year" class="${useYear ? 'on' : ''}">by 年</button><button data-g="d15" class="${useD15 ? 'on' : ''}">近15天</button></div>`;

    // 适用车型明细
    const carRows = (d.cars || []).map(c => {
      const pct = info.packShip ? (100 * (c.conn || 0) / info.packShip).toFixed(1) + '%' : '-';
      const apct = info.alarm && c.alarm ? (100 * (c.alarm || 0) / info.alarm).toFixed(1) + '%' : '-';
      return `<tr><td><b>${esc(c.name || c.vehicle_model || '-')}</b></td><td>${esc(c.struct || '-')}</td>
        <td class="num">${fmt(c.conn)}</td><td class="num">${esc(pct)}</td>
        <td class="num">${fmt(c.overdue)}</td><td class="num">${fmt(c.alarm)}</td><td class="num">${esc(apct)}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="t3-empty">暂无适用车型明细</td></tr>';

    // 质保台账
    const wRows = (d.warranty || []).map(w => {
      const stint = (y, mi, s) => `${(y != null ? y + '年' : '-')} / ${(mi != null ? Number(mi).toLocaleString() : '-')}km / SOH${(s != null ? '≥' + s + '%' : '-')}`;
      return `<tr><td>${esc(w.vehicle_model || '-')}</td><td>${esc(w.pn || '-')}</td>
        <td>${stint(w.years, w.mileage, w.soh)}</td></tr>`;
    }).join('') || '<tr><td colspan="3" class="t3-empty">暂无质保台账，可在质保配置维护</td></tr>';

    // SOH 衰减走势（演示近似，标示口径）
    const sohData = []; const sohLabels = [];
    const ageMonths = Math.max(1, Math.min(48, Math.round(((new Date('2026-09-15') - new Date((info.sop || '2024-01') + '-01')) / (30 * 24 * 3600 * 1000)) || 20)));
    for (let m = 0; m <= Math.min(ageMonths, 36); m += 3) {
      sohLabels.push(m + '月');
      sohData.push(+(100 - 0.15 * m - 0.005 * m * m).toFixed(2));
    }
    const sohHtml = lineChart(sohData, sohLabels, SEQ.g2) +
      `<div class="legend"><span>当前车龄 <b>${ageMonths} 个月</b></span><span>当前 SOH <b>${sohData[sohData.length - 1]}%</b></span><span>质保门槛 <b>${esc(info.qsoh || '-')}</b></span></div>`;

    const eventsHtml = renderTimeline(d.events);

    host.innerHTML = `
      <!-- 信息条 -->
      ${infoStrip}
      <!-- KPI + 出货层级切换 -->
      <div style="display:flex;justify-content:flex-end;margin:-4px 0 10px;">${levelTabs}</div>
      <div class="t3-kpis">${kpis}</div>
      <!-- 接入走势 + 活跃/调表 -->
      <div class="t3-grid2">
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle">📈 项目接入走势</div></div>
            ${granTabs}</div>
          <div class="t3-trend">${trendHtml}</div>
        </div>
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="近90天数据上报">🚗 活跃车辆 &amp; 里程调表</div></div></div>
          <div class="t3-kpi" style="box-shadow:none;border:0;padding:4px 0"><div class="val" style="font-size:26px">${fmt(d.active != null ? d.active : info.conn)} <span style="font-size:13px;color:var(--muted);font-weight:500">辆活跃</span></div><div class="sub">近90天</div></div>
          <div class="t3-kpi ${d.mileage ? 'bad' : ''}" style="box-shadow:none;border:0;padding:4px 0"><div class="val" style="font-size:26px">${fmt(d.mileage || 0)} <span style="font-size:13px;color:var(--muted);font-weight:500">辆疑似</span></div><div class="sub">里程调表</div></div>
        </div>
      </div>
      <!-- 项目质量分析（失效模式占比、明细都在这里，不再单独成卡） -->
      <div class="t3-card">
