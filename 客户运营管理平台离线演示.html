    },

    // 独立「材料」弹窗：在同一个地方完成 上传 / 查看 / 下载 / 删除（用户友好，操作集中）
    async openMaterials(mid, title) {
        this._lastMaterialsId = mid;
        const m = await API.get(`/api/meetings/${mid}`);
        const dispTitle = (title || (m && m.title) || '').trim() || `会议 #${mid}`;
        Modal.open(`
            <div class="modal-header"><h3>📁 材料归档 · ${Utils.esc(dispTitle)}</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="Page3.uploadMaterials(${mid})">📤 导入材料</button>
                <span style="font-size:12px;color:var(--text-muted);">选择本地文件上传（可多选），≤100MB/个；导入后随会议留存，可随时下载查看。</span>
            </div>
            <div id="p3MaterialsBox"><div class="empty-state" style="font-size:12px;">加载材料中…</div></div>
        `);
        this.loadMaterials(mid);
    },

    // 读取归档材料列表并渲染到材料弹窗容器
    async loadMaterials(mid) {
        const box = document.getElementById('p3MaterialsBox') || document.getElementById('p3Materials');
        if (!box) return;
        const items = await API.get(`/api/meetings/${mid}/materials`);
        if (!Array.isArray(items)) { box.innerHTML = '<div class="empty-state">无法加载材料</div>'; return; }
        if (!items.length) {
            box.innerHTML = '<div class="empty-state" style="font-size:12px;">暂无归档材料</div>';
            return;
        }
        const fmt = n => n >= 1048576 ? (n/1048576).toFixed(1)+'MB' : n >= 1024 ? Math.round(n/1024)+'KB' : n+'B';
        box.innerHTML = `<div class="table-wrapper"><table>
            <thead><tr><th>文件</th><th>大小</th><th>上传人</th><th>时间</th><th>操作</th></tr></thead>
            <tbody>${items.map(x => `<tr>
                <td><a href="/api/materials/${x.id}/download" download>📄 ${Utils.esc(x.filename)}</a></td>
                <td>${fmt(x.file_size||0)}</td><td>${Utils.esc(x.uploaded_by||'-')}</td>
                <td>${Utils.formatDate(x.created_at)}</td>
                <td><button class="btn btn-danger btn-sm" onclick="Page3.delMaterial(${x.id})">删除</button></td>
            </tr>`).join('')}</tbody>
        </table></div>`;
    },

    // 归档上传（本地多文件直传）
    async uploadMaterials(mid) {
        Utils.pickFiles({
            multiple: true,
            onPicked: async (files) => {
                const fd = new FormData();
                files.forEach(f => fd.append('files', f));
                Toast.info(`正在上传 ${files.length} 个文件...`);
                const res = await API.upload(`/api/meetings/${mid}/materials`, fd);
                if (res && res.success) { Toast.success(`已归档 ${res.count||0} 个文件`); this.loadMaterials(mid); this.loadList(); }
                else Toast.error((res && res.error) || '导入失败');
            }
        });
    },

    async delMaterial(id) {
        if (!confirm('删除该归档材料？')) return;
        const res = await API.del(`/api/materials/${id}`);
        if (res && !res.error) {
            Toast.success('已删除');
            const mid = this._lastMaterialsId;
            if (mid) this.loadMaterials(mid);
            this.loadList();
        }
        else Toast.error('删除失败');
    },

    async deleteMeeting(id) {
        if (!confirm('确定删除这场会议？\n将一并删除其共识、任务和归档材料，且不可恢复。')) return;
        const res = await API.del(`/api/meetings/${id}`);
        if (res && !res.error) {
            Toast.success('会议已删除');
            this.loadList();
        }
    },

    // 跳到需求页，预填本会议信息（客户/来源会议由 PageDemand.openCreateWith 自动带出）
    toDemand(meetingId) {
        Modal.close();
        PageDemand.openCreateWith({ meeting_id: meetingId });
    },

    async openTasks(meetingId) {
        const tasks = await API.get(`/api/meetings/${meetingId}/tasks`);
        this._formTasks = (tasks || []).map(t => ({ ...t }));
        this._formMeetingId = meetingId;
        this._tasksStandalone = true;
        this._tasksEditing = false;  // 默认只读展示
        Modal.open(`
            <div class="modal-header"><h3>关键任务管理</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div style="margin-bottom:16px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                    <span class="card-title">待办任务</span>
                    <div>
                        <button class="btn btn-secondary btn-sm" id="p3TaskEditBtn" onclick="Page3._toggleTasksEdit(true)">编辑</button>
                        <button class="btn btn-secondary btn-sm" onclick="Page3.formAddTask()">+ 新增</button>
                    </div>
                </div>
                <div id="p3FormTasks">${this._renderTasksView(meetingId)}</div>
            </div>
        `);
    },

    // 只读展示（详情风格）：默认只展示计划完成时间，「实际完成」按需切换显示（todo 任务#8）
    _renderTasksView(meetingId) {
        const tasks = this._formTasks || [];
        if (!tasks.length) return `<div style="font-size:12px;color:var(--text-muted);padding:4px 0;">暂无待办，点「+ 新增」添加</div>`;
        const toggleBtn = `<button class="btn btn-sm btn-secondary" style="margin-left:auto;padding:1px 8px;font-size:11px;" onclick="Page3._toggleActual()">${Page3._showActual ? '隐藏实际完成' : '显示实际完成'}</button>`;
        const done = tasks.filter(t => t.status === '已完成').length;
        const rate = tasks.length ? Math.round(done / tasks.length * 100) : 0;
        const rateBadge = `<span class="badge ${rate >= 80 ? 'badge-success' : rate >= 50 ? 'badge-warning' : 'badge-secondary'}" style="font-size:11px;">完成率 ${rate}%（${done}/${tasks.length}）</span>`;
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">${rateBadge}${toggleBtn}</div>` + tasks.map(t => `
            <div class="card" style="padding:10px 12px;margin-bottom:8px;">
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
                    <span style="font-size:12px;color:var(--text-muted);flex:0 0 60px;">负责人</span>
                    <span style="font-size:12px;font-weight:600;flex:0 0 120px;">${Utils.esc(t.owner) || '-'}</span>
                    <span style="font-size:12px;color:var(--text-muted);flex:0 0 70px;">计划完成</span>
                    <span style="font-size:12px;flex:0 0 110px;">${Utils.formatDate(t.planned_date)}</span>
                    ${this._showActual ? `<span style="font-size:12px;color:var(--text-muted);flex:0 0 70px;">实际完成</span>
                    <span style="font-size:12px;flex:0 0 110px;">${Utils.formatDate(t.actual_date) || '-'}</span>` : ''}
                    ${Utils.statusBadge(t.status)}
                </div>
                <div style="font-size:13px;color:var(--text-primary);line-height:1.5;white-space:pre-wrap;word-break:break-all;">${Utils.esc(t.task_description)}</div>
                <div style="display:flex;justify-content:flex-end;margin-top:4px;">
                    <button class="btn btn-secondary btn-sm" data-perm="meeting.edit" onclick="Page3.notifyTask(${t.id})">通知</button>
                </div>
            </div>`).join('');
    },

    // 切换「实际完成时间」列显示（默认隐藏，todo 任务#8）
    _toggleActual() {
        this._showActual = !this._showActual;
        const box = document.getElementById('p3FormTasks');
        if (box) box.innerHTML = this._renderTasksView(this._formMeetingId);
    },

    // 切换只读/编辑模式
    _toggleTasksEdit(editing) {
        this._tasksEditing = editing;
        const box = document.getElementById('p3FormTasks');
        const editBtn = document.getElementById('p3TaskEditBtn');
        if (!box) return;
        if (editing) {
            // 切到编辑态：用 renderFormTasks（卡片式可编辑）
            box.innerHTML = this.renderFormTasks(this._formMeetingId);
            if (editBtn) { editBtn.textContent = '完成'; editBtn.onclick = () => this._toggleTasksEdit(false); }
        } else {
            // 切回只读：重新拉数据刷新
            this._refreshTasksView();
            if (editBtn) { editBtn.textContent = '编辑'; editBtn.onclick = () => this._toggleTasksEdit(true); }
        }
    },

    async _refreshTasksView() {
        const mid = this._formMeetingId;
        const tasks = await API.get(`/api/meetings/${mid}/tasks`);
        this._formTasks = (tasks || []).map(t => ({ ...t }));
        const box = document.getElementById('p3FormTasks');
        if (box) box.innerHTML = this._renderTasksView(mid);
    },

    async notifyTask(taskId) {
        Toast.show('正在发送通知...', 'info');
        const res = await API.post(`/api/tasks/${taskId}/notify`, {});
        if (res) {
            if (res.success) Toast.success(res.message || '已通知责任人');
            else Toast.error(res.message || '通知失败');
        }
    },

    // 一键下发：该会议全部未完成待办，按负责人分组小哨兵私聊通知
    async notifyMeeting(meetingId) {
        if (!confirm('把该会议的未完成待办通过小哨兵通知到各负责人？')) return;
        Toast.show('正在下发通知...', 'info');
        const res = await API.post(`/api/meetings/${meetingId}/notify_tasks`, {});
        if (res) {
            if (res.success) {
                Toast.success(res.message || '已下发');
                (res.detail || []).filter(x => !x.ok).forEach(x =>
                    Toast.error(`${x.owner}: ${x.message || '通知失败'}`));
            } else Toast.error(res.message || res.error || '下发失败');
        }
    }
};

</script>

<!-- /static/js/pages/page4.js -->
<script>
/**
 * 页面4 - 预警闭环管理
 * 主列表 = 预警外发规则（本地真源，docs/外发规则.xlsx 导入，warning.edit 可增删改）；
 * 预警记录（Doris dws_warn 按容量×失效模式聚合 + 本地闭环维护）收纳为下方折叠区。
 */
const Page4 = {
    initialized: false,

    init() {
        const container = document.getElementById('page4');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.loadRules();
    },

    renderLayout() {
        return `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
            <div style="font-size:15px;color:var(--text-secondary);">预警闭环管理</div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <select id="p4Customer" style="width:150px;">${Utils.customerOptions()}</select>
                <button class="btn btn-sm btn-secondary" id="p4AiAnalyze">&#9889; AI 分析</button>
            </div>
        </div>
        <div id="p4Rules" style="margin-bottom:16px;"></div>
        <details id="p4WarnDetails" style="margin-bottom:16px;">
            <summary style="cursor:pointer;font-size:14px;font-weight:700;color:var(--text-secondary);padding:8px 4px;user-select:none;">
                📋 预警记录（按 容量 × 失效模式 聚合 · 本地闭环维护，点击展开）
            </summary>
            <div style="padding:6px 4px 0;">
                <div class="filter-bar">
                    <div class="form-group">
                        <label>容量Ah</label>
                        <input type="text" id="p4Capacity" placeholder="如 116">
                    </div>
                    <div class="form-group">
                        <label>闭环状态</label>
                        <select id="p4Status">
                            <option value="">全部</option>
                            <option value="已闭环">已闭环</option>
                            <option value="未闭环">未闭环</option>
                            <option value="处理中">处理中</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>失效模式</label>
                        <input type="text" id="p4FailureMode" placeholder="关键词...">
                    </div>
                    <button class="btn btn-primary" id="p4Search">查 询</button>
                    <button class="btn btn-success" id="p4Add">+ 新增</button>
                </div>
                <div id="p4List"></div>
            </div>
        </details>`;
    },

    bindEvents() {
        const search = document.getElementById('p4Search');
        if (search) search.onclick = () => this.loadList();
        const add = document.getElementById('p4Add');
        if (add) add.onclick = () => this.openForm();
        const aiBtn = document.getElementById('p4AiAnalyze');
        if (aiBtn) aiBtn.onclick = () => this.aiAnalyze();
        // 折叠区首次展开时才加载预警记录
        const details = document.getElementById('p4WarnDetails');
        if (details) details.addEventListener('toggle', () => {
            if (details.open && !this._warnLoaded) {
                this._warnLoaded = true;
                this.loadList();
            }
        });
        // 顶部客户切换 → 联动外发规则筛选 + 重查预警记录
        const cust = document.getElementById('p4Customer');
        if (cust) cust.onchange = () => {
            const ruleOem = document.getElementById('p4RuleOem');
            if (ruleOem) {
                ruleOem.value = cust.value;
                ruleOem.dispatchEvent(new Event('change'));
            }
            if (this._warnLoaded) this.loadList();
        };
    },

    async aiAnalyze() {
        const oem = document.getElementById('p4Customer').value;
        if (!oem) { Toast.error('请先选择客户'); return; }
        const res = await AgentProgress.run({ url: '/api/warnings/ai-analyze', data: { oem }, title: 'AI 预警分析' });
        if (res && res.success && res.analysis) {
            // 拉取最近几次已落库分析，与本次并列展示
            const hist = (await API.get(`/api/warnings/analyses?oem=` + encodeURIComponent(oem)) || {});
            const items = (hist.items || []).slice(0, 5);
            const histHtml = items.length ? `
                <div style="margin-top:14px;border-top:1px solid var(--border-card);padding-top:10px;">
                    <div style="font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;">历史分析记录（每次已自动保存，可追溯）</div>
                    ${items.map(a => `
                        <div style="border:1px solid var(--border-card);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px;">
                            <div style="color:var(--text-muted);margin-bottom:4px;">${Utils.formatDate(a.created_at)}${a.created_by ? ' · ' + Utils.esc(a.created_by) : ''}</div>
                            <div style="white-space:pre-wrap;color:var(--text-secondary);">${Utils.esc(a.analysis)}</div>
                        </div>`).join('')}
                </div>` : '';
            Modal.open(`<h3>&#9889; ${Utils.esc(oem)} 预警智能分析</h3>
                <div style="max-height:70vh;overflow:auto;padding-right:4px;">
                    <div style="line-height:1.8;font-size:14px;color:var(--text-primary);white-space:pre-wrap;padding:12px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border-card);">${Utils.esc(res.analysis)}</div>
                    ${histHtml}
                </div>
                <div style="text-align:right;margin-top:12px;"><button class="btn btn-secondary" onclick="Modal.close()">关闭</button></div>`);
        } else {
            Toast.error((res && res.message) || '分析失败');
        }
    },

    // ============ 预警外发规则（主列表：本地真源 xlsx 导入，warning.edit 可增删改） ============
    async loadRules() {
        const box = document.getElementById('p4Rules');
        box.innerHTML = '<div class="loading" style="padding:20px;">正在加载预警外发规则...</div>';
        const data = await API.get('/api/warning_rules');
        if (!data || !data.success) {
            box.innerHTML = `<div class="empty-state"><p>加载失败：${Utils.esc(data && data.error || '未知错误')}</p></div>`;
            return;
        }
        const all = data.rows || [];
        this._rules = all;   // 供 editRule 定位单条
        if (!all.length) {
            box.innerHTML = '<div class="card"><div class="card-title">预警外发规则</div><p class="empty-state">暂无有效规则</p></div>';
            return;
        }
        // 筛选控件（oem / 预警类型 / 容量 / 状态），选中后本地过滤重新渲染
        const canEdit = App.hasPerm('warning.edit');
        box.innerHTML = `<div class="card">
            <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                <span>预警外发规则（本地真源 · 共 ${all.length} 条${canEdit ? ' · 可编辑' : ''}）</span>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <select id="p4RuleOem" style="width:130px;"><option value="">全部客户</option></select>
                    <select id="p4RuleAlgo" style="width:110px;"><option value="">全部预警类型</option></select>
                    <select id="p4RuleStatus" style="width:130px;"><option value="">全部状态</option></select>
                    <input id="p4RuleCap" placeholder="容量Ah" style="width:80px;">
                    ${canEdit ? '<button class="btn btn-sm btn-primary" onclick="Page4.editRule(null)">+ 新增规则</button>' : ''}
                </div>
            </div>
            <div class="table-wrapper" style="max-height:60vh;overflow:auto;"><table class="dash-table" id="p4RuleTable" style="font-size:11.5px;">
                <thead><tr>
                    <th>OEM</th><th>容量Ah</th><th>预警类型</th><th>车型</th><th>是否外发</th>
                    <th>不外发天数</th><th>阈值</th><th>不外发位置</th><th>维修建议</th>
                    <th>出货类型</th><th>状态</th><th>外发数量</th><th>TOP排序</th>
                    <th>过保数量</th><th>过保是否外发</th><th>工单完成量</th><th>VIN</th><th>创建时间</th>
                    ${canEdit ? '<th data-no-sort>操作</th>' : ''}
                </tr></thead>
                <tbody id="p4RuleBody"></tbody>
            </table></div>
            <div id="p4RuleCount" style="font-size:11px;color:var(--text-muted);padding:6px 2px;"></div>
        </div>`;

        // 填充筛选下拉（去重排序）
        const fill = (id, key) => {
            const sel = document.getElementById(id);
            const seen = new Set();
            all.forEach(r => { const v = String(r[key] || '').trim(); if (v) seen.add(v); });
            Array.from(seen).sort().forEach(v => {
                sel.insertAdjacentHTML('beforeend', `<option value="${Utils.esc(v)}">${Utils.esc(v)}</option>`);
            });
        };
        fill('p4RuleOem', 'oem');
        fill('p4RuleAlgo', 'algorithm');
        fill('p4RuleStatus', 'status');
        // 顶部已选客户时，规则表联动预筛该客户
        const custSel = document.getElementById('p4Customer');
        if (custSel && custSel.value) document.getElementById('p4RuleOem').value = custSel.value;

        const render = () => {
            const foem = document.getElementById('p4RuleOem').value;
            const falgo = document.getElementById('p4RuleAlgo').value;
            const fstatus = document.getElementById('p4RuleStatus').value;
            const fcap = document.getElementById('p4RuleCap').value.trim();
            const rows = all.filter(r =>
                (!foem || r.oem === foem) &&
                (!falgo || r.algorithm === falgo) &&
                (!fstatus || r.status === fstatus) &&
                (!fcap || String(r.cell_cap || '').includes(fcap)));
            const dash = v => Utils.esc(v || '-') || '-';
            const body = document.getElementById('p4RuleBody');
            body.innerHTML = rows.map(r => `<tr>
                    <td><b>${dash(r.oem)}</b></td>
                    <td class="num">${dash(r.cell_cap)}</td>
                    <td>${dash(r.algorithm)}</td>
                    <td class="cell-ellipsis" style="max-width:150px;" title="${Utils.esc(r.vehicle_model || '')}">${dash(r.vehicle_model)}</td>
                    <td>${dash(r.external_send)}</td>
                    <td class="num">${dash(r.no_send_days)}</td>
                    <td class="num">${dash(r.threshold)}</td>
                    <td class="cell-ellipsis" style="max-width:120px;" title="${Utils.esc(r.abnormal_location || '')}">${dash(r.abnormal_location)}</td>
                    <td class="cell-ellipsis" style="max-width:180px;" title="${Utils.esc(r.repair_suggestion || '')}">${dash(r.repair_suggestion)}</td>
                    <td>${dash(r.shipment_type)}</td>
                    <td>${r.status === '不外发' ? '<span class="badge badge-warning">不外发</span>'
                        : r.status === '只发pack' ? '<span class="badge badge-info">只发pack</span>'
                        : `<span class="badge badge-secondary">${dash(r.status)}</span>`}</td>
                    <td class="num">${dash(r.outgoing_count)}</td>
                    <td>${dash(r.top_order)}</td>
                    <td class="num">${dash(r.overdue_count)}</td>
                    <td>${dash(r.overdue_send)}</td>
                    <td class="num">${dash(r.work_order_done)}</td>
                    <td class="mono" style="font-size:10px;">${dash(r.vin)}</td>
                    <td style="font-size:10px;">${dash(r.create_time)}</td>
                    ${canEdit ? `<td style="white-space:nowrap;">
                        <button class="btn btn-sm btn-secondary" onclick="Page4.editRule(${r.id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="Page4.deleteRule(${r.id})">删除</button></td>` : ''}
                </tr>`).join('') || `<tr><td colspan="${canEdit ? 19 : 18}" class="empty-state">无匹配规则</td></tr>`;
            document.getElementById('p4RuleCount').textContent = `匹配 ${rows.length} / ${all.length} 条 · 点击表头可排序${canEdit ? ' · 行内「编辑/删除」可直接改规则' : ''}`;
            const tbl = document.getElementById('p4RuleTable');
            if (tbl && window.Utils && Utils.enableTableSort) Utils.enableTableSort(tbl);
        };
        ['p4RuleOem', 'p4RuleAlgo', 'p4RuleStatus'].forEach(id => {
            document.getElementById(id).onchange = render;
        });
        document.getElementById('p4RuleCap').oninput = render;
        render();
    },

    // ============ 预警外发规则编辑（warning.edit 权限） ============
    // 字段定义：key / label / 类型（text 单行 / textarea 多行）
    _RULE_FIELDS: [
        { k: 'oem', l: '客户 OEM *' },
        { k: 'cell_cap', l: '电芯容量(Ah)' },
        { k: 'algorithm', l: '预警类型' },
        { k: 'vehicle_model', l: '车辆型号' },
        { k: 'external_send', l: '是否外发' },
        { k: 'no_send_days', l: '不外发天数限制' },
        { k: 'threshold', l: '阈值' },
        { k: 'abnormal_location', l: '不外发的位置' },
        { k: 'repair_suggestion', l: '维修建议', ta: true },
        { k: 'shipment_type', l: '出货类型' },
        { k: 'status', l: '状态（不外发/只发pack/…）' },
        { k: 'outgoing_count', l: '外发表外发数量' },
        { k: 'top_order', l: 'TOP排序逻辑' },
        { k: 'overdue_count', l: '脱保过保数量' },
        { k: 'overdue_send', l: '脱保过保是否外发' },
        { k: 'work_order_done', l: '工单完成量' },
        { k: 'vin', l: 'VIN' },
        { k: 'create_time', l: '创建时间' },
    ],

    editRule(id) {
        const r = id ? (this._rules || []).find(x => x.id === id) : null;
        const fields = this._RULE_FIELDS.map(f => {
            const v = (r && r[f.k]) || '';
            const inp = f.ta
                ? `<textarea data-rk="${f.k}" rows="2" style="width:100%;">${Utils.esc(v)}</textarea>`
                : `<input data-rk="${f.k}" value="${Utils.esc(v)}" style="width:100%;">`;
            return `<div class="form-group" style="flex:1;min-width:200px;"><label>${f.l}</label>${inp}</div>`;
        }).join('');
        Modal.open(`<div style="min-width:640px;max-width:94vw;">
            <h3>${id ? '编辑外发规则 #' + id : '新增外发规则'}</h3>
            <div style="display:flex;flex-wrap:wrap;gap:10px;">${fields}</div>
            <div style="text-align:right;margin-top:12px;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="Page4.saveRule(${id || 'null'})">保存</button>
            </div>
        </div>`);
    },

    async saveRule(id) {
        const payload = {};
        document.querySelectorAll('[data-rk]').forEach(el => {
            payload[el.dataset.rk] = el.value.trim();
        });
        if (!payload.oem) { Toast.error('客户 OEM 必填'); return; }
        const res = id
            ? await API.put(`/api/warning_rules/manage/${id}`, payload)
            : await API.post('/api/warning_rules/manage', payload);
        if (res && res.success) {
            Toast.success(id ? '规则已更新' : '规则已新增');
            Modal.close();
            this.loadRules();
        } else {
            Toast.error((res && res.error) || '保存失败');
        }
    },

    async deleteRule(id) {
        if (!confirm(`删除外发规则 #${id}？删除后不可恢复。`)) return;
        const res = await API.del(`/api/warning_rules/manage/${id}`);
        if (res && res.success) {
            Toast.success('已删除');
            this.loadRules();
        } else {
            Toast.error((res && res.error) || '删除失败');
        }
    },

    async loadList(page) {
        page = page || 1;
        const oem = document.getElementById('p4Customer').value;
        const cap = document.getElementById('p4Capacity').value.trim();
        const status = document.getElementById('p4Status').value;
        const fm = document.getElementById('p4FailureMode').value;

        let url = `/api/warnings?page=${page}&page_size=50&`;
        if (oem) url += `oem=${encodeURIComponent(oem)}&`;
        if (cap) url += `capacity_ah=${encodeURIComponent(cap)}&`;
        if (status) url += `closure_status=${encodeURIComponent(status)}&`;
        if (fm) url += `failure_mode=${encodeURIComponent(fm)}&`;

        const container = document.getElementById('p4List');
        container.innerHTML = '<div class="loading"></div>';
        const res = await API.get(url);
        const data = res && res.items;
        if (!data || !data.length) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;</div><p>暂无预警数据</p></div>';
            Utils.renderPager(document.getElementById('p4Pager'), res, p => Page4.loadList(p));
            return;
        }
        const rows = data.map(w => {
            const audit = w.closure_status === '已闭环'
                ? (w.action_taken ? Utils.esc(w.action_taken) + '<br>' : '') +
                  '<span style="color:var(--text-muted);font-size:11px;">' + Utils.esc(w.closed_by || '') + ' · ' + Utils.esc(w.closed_at || '') + '</span>'
                : '<span style="color:var(--text-muted);font-size:11px;">—</span>';
            // todo#4：列精简——客户/OEM 合并、外发逻辑/数量合并；容量 esc 防 XSS
            const dispLogic = Utils.esc(w.dispatch_logic) || '';
            return `
            <tr>
                <td>${Utils.esc(w.name_cn || w.oem_ch)} <span class="badge badge-info">${Utils.esc(w.oem)}</span></td>
                <td>${Utils.esc(w.capacity_ah) || '-'}</td>
                <td>${Utils.esc(w.risk_type) || '-'}</td>
                <td>${Utils.esc(w.failure_mode)}</td>
                <td><strong style="color:var(--warning);">${w.warning_count}</strong></td>
                <td>${Utils.statusBadge(w.closure_status)}</td>
                <td class="cell-ellipsis" style="max-width:150px;" title="${Utils.esc(w.unclosed_reason) || ''}">${Utils.esc(w.unclosed_reason) || '-'}</td>
                <td class="cell-ellipsis" style="max-width:130px;" title="${dispLogic}"><strong>${w.dispatched_count || 0}</strong>${dispLogic ? `<span style="color:var(--text-muted);font-size:11px;">（${dispLogic}）</span>` : ''}</td>
                <td class="cell-ellipsis" style="max-width:200px;" title="${Utils.esc(audit)}">${audit}</td>
                <td><button class="btn btn-secondary btn-sm" onclick="Page4.openForm(${w.id})">编辑</button></td>
            </tr>`;
        }).join('');
        // todo#4：min-width 防列压缩换行，超宽时 table-wrapper 横向滑动可见右侧列
        container.innerHTML = `<div class="card"><div class="table-wrapper"><table style="min-width:1050px;white-space:nowrap;">
            <thead><tr><th>客户</th><th>容量Ah</th><th>风险类型</th><th>失效模式</th><th>预警数量</th><th>闭环状态</th><th>未闭环原因</th><th>外发（逻辑）</th><th>处置/闭环审计</th><th>操作</th></tr></thead>
            <tbody>${rows}</tbody>
        </table></div></div><div id="p4Pager"></div>`;
        Utils.renderPager(document.getElementById('p4Pager'), res, p => Page4.loadList(p));
    },

    async openForm(id) {
        let w = { oem: '', capacity_ah: '', risk_type: '', failure_mode: '', warning_count: 0, closure_status: '未闭环', unclosed_reason: '', dispatch_logic: '', dispatched_count: 0 };
        if (id) {
            const all = await API.get(`/api/warnings?`);
            const found = (all || []).find(x => x.id === id);
            if (!found) { Toast.error('加载详情失败'); return; }
            w = found;
        }
        const title = id ? '编辑预警' : '新增预警';
        Modal.open(`
            <div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div class="form-row">
                <div class="form-group"><label>客户 *</label><select id="mfWarnCust">${Utils.customerOptions(w.oem)}</select></div>
                <div class="form-group"><label>容量Ah</label><input type="text" id="mfWarnCap" value="${Utils.esc(w.capacity_ah)}" placeholder="如 116"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>风险类型</label><input type="text" id="mfWarnRisk" value="${Utils.esc(w.risk_type)}" placeholder="如：电压异常"></div>
                <div class="form-group"><label>失效模式 *</label><input type="text" id="mfWarnFM" value="${Utils.esc(w.failure_mode)}"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>预警数量</label><input type="number" id="mfWarnCount" value="${w.warning_count}"></div>
                <div class="form-group"><label>已外发处置数</label><input type="number" id="mfWarnDisp" value="${w.dispatched_count}"></div>
            </div>
            <div class="form-group"><label>闭环状态</label>
                <select id="mfWarnStatus">
                    <option value="未闭环" ${w.closure_status==='未闭环'?'selected':''}>未闭环</option>
                    <option value="处理中" ${w.closure_status==='处理中'?'selected':''}>处理中</option>
                    <option value="已闭环" ${w.closure_status==='已闭环'?'selected':''}>已闭环</option>
                </select>
            </div>
            <div class="form-group"><label>未闭环原因</label><textarea id="mfWarnReason" placeholder="说明未闭环原因/阻碍">${Utils.esc(w.unclosed_reason)}</textarea></div>
            <div class="form-group"><label>处置动作（已闭环时必填，如：已派工拆解/返件/软件升级）</label><textarea id="mfWarnAction" placeholder="记录采取的处理措施，便于闭环追溯">${Utils.esc(w.action_taken || '')}</textarea></div>
            <div class="form-group"><label>外发逻辑</label><textarea id="mfWarnLogic" placeholder="如：>50条外发">${Utils.esc(w.dispatch_logic)}</textarea></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="Page4.saveForm(${id || 'null'})">保存</button>
            </div>
        `);
    },

    async saveForm(id) {
        const data = {
            oem: document.getElementById('mfWarnCust').value,
            capacity_ah: document.getElementById('mfWarnCap').value.trim() || null,
            risk_type: document.getElementById('mfWarnRisk').value.trim(),
            failure_mode: document.getElementById('mfWarnFM').value.trim(),
            warning_count: parseInt(document.getElementById('mfWarnCount').value) || 0,
            closure_status: document.getElementById('mfWarnStatus').value,
            dispatched_count: parseInt(document.getElementById('mfWarnDisp').value) || 0,
            unclosed_reason: document.getElementById('mfWarnReason').value.trim(),
            dispatch_logic: document.getElementById('mfWarnLogic').value.trim(),
            action_taken: document.getElementById('mfWarnAction').value.trim()
        };
        // 已闭环但未填处置动作时提醒（不阻断，可留痕）
        if (data.closure_status === '已闭环' && !data.action_taken) {
            Toast.error('已闭环建议填写处置动作，便于追溯');
        }
        if (!data.oem || !data.failure_mode) {
            Toast.error('请填写客户和失效模式');
            return;
        }
        let result;
        if (id) {
            result = await API.put(`/api/warnings/${id}`, data);
        } else {
            result = await API.post('/api/warnings', data);
        }
        if (result && !result.error) {
            Toast.success(id ? '更新成功' : '创建成功');
            Modal.close();
            this.loadList();
        }
    }
};

</script>

<script>
/**
 * 页面5 - 服务阶段性总结（含灵活配置模块 + 导出周报/HTML）
 */
const Page5 = {
    initialized: false,

    init() {
        const container = document.getElementById('page5');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        const custSelect = document.getElementById('p5Customer');
        if (custSelect && custSelect.options[0]) custSelect.options[0].text = '全部客户';
        this.setDefaultDates();
        this.bindEvents();
        this.loadList();
    },

    setDefaultDates() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
        document.getElementById('p5Start').value = `${y}-${m}-01`;
        document.getElementById('p5End').value = `${y}-${m}-${String(lastDay).padStart(2, '0')}`;
    },

    renderLayout() {
        return `
        <div class="filter-bar">
            <div class="form-group">
                <label>客户</label>
                <select id="p5Customer">${Utils.customerOptions()}</select>
            </div>
            <div class="form-group">
                <label>开始日期</label>
                <input type="date" id="p5Start">
            </div>
            <div class="form-group">
                <label>结束日期</label>
                <input type="date" id="p5End">
            </div>
            <button class="btn btn-primary" id="p5Search">查 询</button>
            <button class="btn btn-success" id="p5ExportCsv">⬇ 导出周报</button>
            <button class="btn btn-secondary" id="p5ExportHtml">📄 导出HTML</button>
            <button class="btn btn-info" id="p5Email" data-perm="visit.edit">&#128231; 发送邮件</button>
        </div>
        <div id="p5Summary" style="margin-bottom:20px;"></div>
        <div id="p5List"></div>`;
    },

    bindEvents() {
        document.getElementById('p5Search').onclick = () => this.loadList();
        document.getElementById('p5ExportCsv').onclick = () => this.exportCsv();
        document.getElementById('p5ExportHtml').onclick = () => this.exportHtml();
        document.getElementById('p5Email').onclick = () => this.openEmailDialog();
    },

    async loadList() {
        const oem = document.getElementById('p5Customer').value;
        const start = document.getElementById('p5Start').value;
        const end = document.getElementById('p5End').value;

        let url = '/api/stage_summary?';
        if (oem) url += `oem=${encodeURIComponent(oem)}&`;
        if (start) url += `start_date=${start}&`;
        if (end) url += `end_date=${end}&`;

        const container = document.getElementById('p5List');
        container.innerHTML = '<div class="loading"></div>';
        const data = await API.get(url);
        const summaryDiv = document.getElementById('p5Summary');

        if (!data || !data.length) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9776;</div><p>暂无阶段总结数据</p></div>';
            summaryDiv.innerHTML = '';
            return;
        }

        this._data = data;

        const totalWarnings = data.reduce((sum, d) => sum + (d.dispatch_count || 0), 0);
        const totalReduced = data.reduce((sum, d) => sum + (d.reduced_breakdown || 0), 0);
        const modes = [...new Set(data.map(d => d.failure_mode))];

        summaryDiv.innerHTML = `
        <div class="grid-4">
            <div class="card stat-card">
                <div class="stat-value">${data.length}</div>
                <div class="stat-label">记录总数</div>
            </div>
            <div class="card stat-card">
                <div class="stat-value">${modes.length}</div>
                <div class="stat-label">失效模式类型</div>
            </div>
            <div class="card stat-card">
                <div class="stat-value">${totalWarnings}</div>
                <div class="stat-label">预警外发总数</div>
            </div>
            <div class="card stat-card">
                <div class="stat-value">${totalReduced}</div>
                <div class="stat-label">预计降低抛锚数</div>
            </div>
        </div>`;

        const rows = data.map(d => `
            <tr>
                <td>${Utils.esc(d.name_cn)}</td>
                <td>${Utils.formatDate(d.summary_date)}</td>
                <td>${Utils.esc(d.failure_mode)}</td>
                <td><strong style="color:var(--warning);">${d.dispatch_count || 0}</strong></td>
                <td><strong style="color:var(--success);">${d.reduced_breakdown || 0}</strong></td>
                <td>
                    <button class="btn btn-sm ${d.is_milestone ? 'btn-warning' : 'btn-secondary'}"
                            data-perm="visit.edit" onclick="Page5.toggleMilestone(${d.id})" title="${Utils.esc(d.milestone_note || '')}">
                        ${d.is_milestone ? '&#11088; 里程碑' : '&#9744; 标记'}
                    </button>
                </td>
            </tr>`).join('');

        container.innerHTML = `<div class="card">
            <div class="card-title">阶段性总结明细</div>
            <div class="table-wrapper"><table>
                <thead><tr><th>客户</th><th>日期</th><th>失效模式</th><th>预警外发数量</th><th>预计降低抛锚数</th><th>里程碑</th></tr></thead>
                <tbody>${rows}</tbody>
            </table></div>
        </div>`;
    },

    async toggleMilestone(id) {
        const note = prompt('标记为里程碑？可填写说明（留空则直接标记）：', '');
        if (note === null) return;  // 取消
        const res = await API.post(`/api/stage_summary/${id}/milestone`, {note: note});
        if (res && res.success) {
            Toast.success(res.is_milestone ? '已标记为里程碑' : '已取消里程碑');
            this.loadList();
        }
    },

    openEmailDialog() {
        Modal.open(`<div class="modal-header"><h3>&#128231; 发送阶段总结邮件</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">将当前筛选范围的阶段总结以 HTML 表格邮件发送。</div>
            <div class="form-group"><label>收件人（每行一个邮箱）</label>
                <textarea id="emTo" rows="3" placeholder="someone@catl.com"></textarea></div>
            <div class="form-group"><label>抄送（可选，每行一个）</label>
                <textarea id="emCc" rows="2" placeholder="cc@catl.com"></textarea></div>
            <div class="form-group"><label>邮件主题（可选）</label>
                <input id="emSubject" placeholder="留空用默认主题"></div>
            <div style="text-align:right;margin-top:10px;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="emSend">发送</button>
            </div>`);
        document.getElementById('emSend').onclick = () => this.sendEmail();
    },

    async sendEmail() {
        const to = document.getElementById('emTo').value.split('\n').map(s => s.trim()).filter(Boolean);
        const cc = document.getElementById('emCc').value.split('\n').map(s => s.trim()).filter(Boolean);
        const subject = document.getElementById('emSubject').value.trim();
        if (!to.length) { Toast.error('请填写收件人'); return; }
        const oem = document.getElementById('p5Customer').value;
        const start = document.getElementById('p5Start').value;
        const end = document.getElementById('p5End').value;
        const btn = document.getElementById('emSend');
        btn.disabled = true; btn.textContent = '发送中...';
        const res = await API.post('/api/stage_summary/email', {to, cc, subject, oem, start_date: start, end_date: end});
        btn.disabled = false; btn.textContent = '发送';
        if (res && res.success) {
            Toast.success(`邮件已发送给 ${res.sent_to} 人（${res.records} 条记录）`);
            Modal.close();
        }
    },

    exportCsv() {
        Toast.info('正在生成下载文件...');
        const oem = document.getElementById('p5Customer').value;
        const start = document.getElementById('p5Start').value;
        const end = document.getElementById('p5End').value;
        let url = '/api/stage_summary/export?';
        if (oem) url += `oem=${encodeURIComponent(oem)}&`;
        if (start) url += `start_date=${start}&`;
        if (end) url += `end_date=${end}&`;
        window.location.href = url;
    },

    exportHtml() {
        // 导出当前页面为静态 HTML（#9 灵活配置：可给客户输出阶段报告）
        const oem = document.getElementById('p5Customer');
        const oemName = oem ? oem.options[oem.selectedIndex]?.text : '';
        const start = document.getElementById('p5Start').value;
        const end = document.getElementById('p5End').value;
        const summary = document.getElementById('p5Summary').innerHTML;
        const list = document.getElementById('p5List').innerHTML;

        const html = `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>阶段报告_${oemName}_${start || '全部'}_${end || ''}</title>
<style>
body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f8; color: #1a2332; padding: 40px; }
h1 { color: #0084ff; border-bottom: 2px solid #0084ff; padding-bottom: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin: 20px 0; }
.card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.stat-value { font-size: 28px; font-weight: 700; color: #0084ff; }
.stat-label { font-size: 13px; color: #5a6a7a; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #e8edf5; padding: 12px; text-align: left; color: #0066cc; }
td { padding: 10px 12px; border-bottom: 1px solid #eee; }
.meta { color: #8a9aab; font-size: 13px; margin-bottom: 20px; }
</style></head><body>
<h1>客户运营阶段报告</h1>
<div class="meta">客户：${oemName} | 日期范围：${start || '全部'} ~ ${end || '至今'} | 导出时间：${new Date().toLocaleString('zh-CN')}</div>
<div class="grid-4">${summary}</div>
${list}
</body></html>`;

        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `阶段报告_${oemName}_${start || '全部'}.html`;
        a.click();
        URL.revokeObjectURL(a.href);
        Toast.success('HTML 报告已导出');
    }
};
</script>

    bindEvents() {
        const input = document.getElementById('qa6-input');
        const sendBtn = document.getElementById('qa6-sendBtn');
        sendBtn.addEventListener('click', () => this.sendMessage());
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') this.sendMessage();
        });
    },

    switchTab(tab) {
        document.querySelectorAll('.qa6-tab').forEach(el => el.classList.toggle('qa6-tab-active', el.dataset.tab === tab));
        document.getElementById('qa6-tabPanel-qa').style.display = tab === 'qa' ? '' : 'none';
        document.getElementById('qa6-tabPanel-kb').style.display = tab === 'kb' ? '' : 'none';
        if (tab === 'kb') {
            if (!this.kbScope) this.kbScope = 'qa';
            this.loadKbTree(this.kbScope);
            this.loadKbList();
        }
    },

    async sendMessage() {
        const input = document.getElementById('qa6-input');
        const query = input.value.trim();
        if (!query) return;
        input.value = '';
        this.appendUserMsg(query);

        const msgArea = document.getElementById('qa6-msgArea');
        const typing = document.createElement('div');
        typing.className = 'qa6-msg qa6-bot qa6-typing-msg';
        typing.id = 'qa6-typing';
        typing.innerHTML = `
            <div class="qa6-avatar qa6-avatar-bot">AI</div>
            <div class="qa6-bubble qa6-bubble-bot">
                <div class="qa6-typing"><span></span><span></span><span></span></div>
            </div>`;
        msgArea.appendChild(typing);
        msgArea.scrollTop = msgArea.scrollHeight;

        // 走统一 Agent 引擎（模式 qa），可自主调用 search_kb / view_table / query_sql 多步编排
        // 用进度面板展示思考中/步骤
        const res = await AgentProgress.run({ url: '/api/agent/query', data: { query, mode: 'qa' }, title: '知识库问答中' });

        const t = document.getElementById('qa6-typing');
        if (t) t.remove();

        if (res) {
            this.appendBotReply(res, query);
        } else {
            this.appendBotError();
        }
    },

    appendUserMsg(text) {
        const msgArea = document.getElementById('qa6-msgArea');
        const el = document.createElement('div');
        el.className = 'qa6-msg qa6-user';
        el.innerHTML = `
            <div class="qa6-bubble qa6-bubble-user">${Utils.esc(text)}</div>
            <div class="qa6-avatar qa6-avatar-user">${Utils.esc((App.currentUser && App.currentUser.name || 'U').charAt(0))}</div>`;
        msgArea.appendChild(el);
        msgArea.scrollTop = msgArea.scrollHeight;
    },

    appendBotReply(res, query) {
        const msgArea = document.getElementById('qa6-msgArea');
        const el = document.createElement('div');
        el.className = 'qa6-msg qa6-bot';
        let html = '<div class="qa6-avatar qa6-avatar-bot">AI</div><div class="qa6-bubble qa6-bubble-bot">';

        // Agent 轨迹（若走 Agent 引擎返回了 tools_used/trace）
        const tools = res.tools_used || [];
        const trace = res.trace || [];
        if (res.mode === 'qa' && (tools.length || res.error)) {
            const toolNames = { search_kb: '查知识库', view_table: '查运营表', query_sql: '查 Doris 数据', run_python: 'Python 计算' };
            const badges = tools.map(t => {
                const label = toolNames[t] || t;
                return `<span class="qa6-cat-tag cat-info" style="margin-right:4px;">Agent·${Utils.esc(label)}</span>`;
            }).join('');
            const traceHtml = trace.length ? `
                <details class="agent-trace" style="margin:6px 0 10px;">
                    <summary style="cursor:pointer;font-size:12px;color:#888;">Agent 运行轨迹（${trace.length} 步）${badges}</summary>
                    <ol style="font-size:12px;color:#555;padding-left:18px;margin:6px 0;">
                        ${trace.map(tr => {
                            const argsPreview = Utils.esc(tr.args || '').replace(/\s+/g, ' ').substring(0, 100);
                            const fullHtml = (tr.args && tr.args.length > 100) || (tr.text && tr.text.length > 40)
                                ? `<details style="margin-top:2px;"><summary style="cursor:pointer;color:var(--accent);">查看详情</summary><div style="white-space:pre-wrap;word-break:break-all;background:#f8fafc;padding:6px;border-radius:4px;margin-top:4px;">${Utils.esc(tr.args || '')}${tr.text ? '\n\n结果：' + Utils.esc(tr.text) : ''}</div></details>` : '';
                            return `<li style="margin:3px 0;"><b>${Utils.esc(tr.tool)}</b> ${tr.ok ? '✓' : '✗'} <span style="color:#999;word-break:break-all;">${argsPreview}${tr.args && tr.args.length > 100 ? '…' : ''}</span>${fullHtml}</li>`;
                        }).join('')}
                    </ol>
                </details>` : '';
            html += traceHtml;
        }

        const answer = res.answer || res.llm_answer;
        const LONG = 700; // 超过则折叠
        if (res.report_html) {
            html += `<div class="qa6-llm-block"><div class="qa6-llm-label">AI 回答</div>
                <div style="line-height:1.7;">${Utils.collapseFlat(answer, res.report_html, LONG)}</div></div>`;
        } else if (answer) {
            html += `<div class="qa6-llm-block"><div class="qa6-llm-label">AI 回答</div><div style="line-height:1.7;">${Utils.collapse(String(answer), LONG)}</div></div>`;
        } else if (res.error) {
            html += `<div class="qa6-no-result">${Utils.esc(res.error)}</div>`;
        } else {
            html += `<div class="qa6-no-result">未找到与"${Utils.esc(query)}"相关的知识记录。</div>`;
        }

        html += '</div>';
        el.innerHTML = html;
        msgArea.appendChild(el);
        msgArea.scrollTop = msgArea.scrollHeight;
    },

    appendBotError() {
        const msgArea = document.getElementById('qa6-msgArea');
        const el = document.createElement('div');
        el.className = 'qa6-msg qa6-bot';
        el.innerHTML = `
            <div class="qa6-avatar qa6-avatar-bot">AI</div>
            <div class="qa6-bubble qa6-bubble-bot">
                <div class="qa6-no-result">搜索服务暂时不可用，请稍后重试。</div>
            </div>`;
        msgArea.appendChild(el);
        msgArea.scrollTop = msgArea.scrollHeight;
    },

    getCatClass(cat) {
        const map = { '电池质量': 'battery', '安全问题': 'safety', '抛锚问题': 'breakdown', '充电问题': 'charge',
                      'QA-常见问答': 'battery', '12-算法能力分类': 'info', '数据合作字段及要求': 'other',
                      'qa': 'info', 'xlsx': 'other', 'html': 'other', 'manual': 'other',
                      'customer': 'battery', 'warranty': 'info', 'visit': 'other', 'meeting': 'info', 'warning': 'warning' };
        return map[cat] || 'other';
    },

    async loadStatus() {
        const res = await API.get('/api/qa/status');
        if (res) {
            document.getElementById('qa6-totalCount').textContent = res.total_records;
            document.getElementById('qa6-kbCount').textContent = `| 知识库 ${res.kb_records || 0} 条`;
            document.getElementById('qa6-llmStatus').innerHTML = res.llm_enabled
                ? '<span class="qa6-badge qa6-badge-success">LLM 已启用</span>'
                : '<span class="qa6-badge qa6-badge-info">LLM 未启用</span>';
            document.getElementById('qa6-engineTag').textContent = res.search_engine;
        }
    },

    async loadList() {
        const search = (document.getElementById('qa6-searchInput') || {}).value || '';
        const cat = (document.getElementById('qa6-catFilter') || {}).value || '';
        let url = '/api/qa?';
        if (cat) url += `category=${encodeURIComponent(cat)}&`;

        const _tbody = document.getElementById('qa6-tableBody');
        if (_tbody) _tbody.innerHTML = '<tr><td colspan="4"><div class="loading"></div></td></tr>';

        const all = await API.get(url);
        if (!all) return;

        this.listData = search
            ? all.filter(r => (r.question || '').includes(search) || (r.keywords || '').includes(search))
            : all;

        const tbody = document.getElementById('qa6-tableBody');
        if (this.listData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="qa6-empty">暂无记录</td></tr>';
            return;
        }

        tbody.innerHTML = this.listData.map(r => {
            const catClass = this.getCatClass(r.category);
            return `<tr>
                <td><span class="qa6-cat-tag cat-${catClass}">${Utils.esc(r.category)}</span></td>
                <td class="qa6-cell-q" title="${Utils.esc(r.question)}">${Utils.esc(r.question)}</td>
                <td>${Utils.esc(r.maintainer || '-')}</td>
                <td class="qa6-cell-actions">
                    <button class="qa6-action-btn" data-perm="knowledge.edit" onclick="Page6.openForm(${r.id})">编辑</button>
                    <button class="qa6-action-btn qa6-action-del" data-perm="knowledge.edit" onclick="Page6.deleteRecord(${r.id})">删除</button>
                </td>
            </tr>`;
        }).join('');
    },

    openForm(id) {
        const isEdit = !!id;
        const rec = isEdit ? this.listData.find(r => r.id === id) : {};
        if (isEdit && !rec) { Toast.error('加载详情失败'); return; }

        const catOptions = this.categories.map(c =>
            `<option value="${c}" ${rec.category === c ? 'selected' : ''}>${c}</option>`
        ).join('');

        const userName = (App.currentUser && App.currentUser.name) || '';

        Modal.open(`
            <div class="modal-form">
                <h3>${isEdit ? '编辑' : '新增'} Q&A 记录</h3>
                <div class="form-group">
                    <label>分类 <span class="req">*</span></label>
                    <select id="f6-category" class="form-control">
                        <option value="">请选择</option>
                        ${catOptions}
                    </select>
                </div>
                <div class="form-group">
                    <label>问题 <span class="req">*</span></label>
                    <textarea id="f6-question" class="form-control" rows="3">${Utils.esc(rec.question || '')}</textarea>
                </div>
                <div class="form-group">
                    <label>回答 <span class="req">*</span></label>
                    <textarea id="f6-answer" class="form-control" rows="6">${Utils.esc(rec.answer || '')}</textarea>
                </div>
                <div class="form-group">
                    <label>搜索关键词（逗号分隔）</label>
                    <input type="text" id="f6-keywords" class="form-control" value="${Utils.esc(rec.keywords || '')}" placeholder="例如：鼓包,膨胀,退换货">
                </div>
                <div class="form-group">
                    <label>维护人</label>
                    <input type="text" id="f6-maintainer" class="form-control" value="${Utils.esc(rec.maintainer || userName)}">
                </div>
                <div class="form-actions">
                    <button class="qa6-btn" onclick="Modal.close()">取消</button>
                    <button class="qa6-btn qa6-btn-primary" onclick="Page6.saveForm(${id || 0})">保存</button>
                </div>
            </div>
        `);

        if (!isEdit) {
            document.getElementById('f6-category').value = '';
        }
    },

    async saveForm(id) {
        const data = {
            category: document.getElementById('f6-category').value,
            question: document.getElementById('f6-question').value.trim(),
            answer: document.getElementById('f6-answer').value.trim(),
            keywords: document.getElementById('f6-keywords').value.trim(),
            maintainer: document.getElementById('f6-maintainer').value.trim() || (App.currentUser && App.currentUser.name) || ''
        };

        if (!data.category || !data.question || !data.answer) {
            Toast.error('分类、问题、回答为必填项');
            return;
        }

        if (id) {
            const res = await API.put(`/api/qa/${id}`, data);
            if (res) {
                Toast.success('更新成功');
                Modal.close();
                this.loadList();
                this.loadStatus();
            }
        } else {
            const res = await API.post('/api/qa', data);
            if (res) {
                Toast.success('新增成功');
                Modal.close();
                this.loadList();
                this.loadStatus();
            }
        }
    },

    async deleteRecord(id) {
        if (!confirm('确定删除这条Q&A记录？')) return;
        const res = await API.del(`/api/qa/${id}`);
        if (res) {
            Toast.success('删除成功');
            this.loadList();
            this.loadStatus();
        }
    },

    async handleImport() {
        Utils.pickFiles({
            accept: '.xlsx,.xls',
            onPicked: async (files) => {
                const fd = new FormData();
                fd.append('file', files[0]);
                Toast.info('正在导入...');
                const res = await API.upload('/api/qa/upload', fd);
                if (res) {
                    Toast.success(`导入成功，共 ${res.count} 条记录`);
                    this.loadList();
                    this.loadStatus();
                }
            }
        });
    },

    async handleExport() {
        Toast.info('正在生成下载文件...');
        try {
            const res = await fetch('/api/qa/export');
            if (!res.ok) throw new Error('导出失败');
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'qa_records.xlsx';
            a.click();
            URL.revokeObjectURL(url);
            Toast.success('导出成功');
        } catch (e) {
            Toast.error('导出失败: ' + e.message);
        }
    },

    async loadKbList() {
        const search = (document.getElementById('kb6-searchInput') || {}).value || '';
        const source = (document.getElementById('kb6-sourceFilter') || {}).value || '';
        const scope = this.kbScope || 'qa';
        let url = `/api/knowledge?scope=${scope}&`;
        if (source) url += `source_type=${encodeURIComponent(source)}&`;
        if (search) url += `search=${encodeURIComponent(search)}`;

        const _tbody = document.getElementById('kb6-tableBody');
        if (_tbody) _tbody.innerHTML = '<tr><td colspan="5"><div class="loading"></div></td></tr>';

        const all = await API.get(url);
        if (!all) return;
        this.kbData = all;

        document.getElementById('kb6-totalCount').textContent = all.length;

        const tbody = document.getElementById('kb6-tableBody');
        if (all.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="qa6-empty">暂无知识片段，请先上传文件、同步文件夹或点"新增"</td></tr>';
            return;
        }

        tbody.innerHTML = all.map(r => {
            const preview = (r.content || '').substring(0, 80) + ((r.content || '').length > 80 ? '...' : '');
            const kindBadge = (r.kind || 'document') === 'code'
                ? '<span class="qa6-cat-tag cat-charge">代码</span>'
                : '<span class="qa6-cat-tag cat-info">文档</span>';
            return `<tr>
                <td>${kindBadge} ${Utils.esc(String(r.title || '').replace(/·.*/, '').substring(0, 30))}</td>
                <td><span class="qa6-cat-tag cat-${this.getCatClass(r.source_type)}">${Utils.esc(r.source_type)}</span></td>
                <td>${Utils.esc(r.category || '-')}</td>
                <td class="qa6-cell-q" title="${Utils.esc(r.content || '')}">${Utils.esc(preview)}</td>
                <td class="qa6-cell-actions">
                    <button class="qa6-action-btn" data-perm="knowledge.edit" onclick="Page6.showKbForm(${r.id})">编辑</button>
                    <button class="qa6-action-btn qa6-action-del" data-perm="knowledge.edit" onclick="Page6.deleteKb(${r.id})">删除</button>
                </td>
            </tr>`;
        }).join('');
    },

    // 切换知识库归属（QA / 数智分析）
    switchKbScope(scope) {
        this.kbScope = scope;
        document.querySelectorAll('[data-kbscope]').forEach(b => b.classList.toggle('qa6-tab-active', b.dataset.kbscope === scope));
        const label = scope === 'analysis' ? '数智分析知识库' : 'QA 知识库';
        document.getElementById('kb6-scopeLabel').textContent = `(${label})`;
        this.loadKbTree(scope);
        this.loadKbList();
    },

    async loadKbTree(scope) {
        try {
            const res = await API.get('/api/knowledge/status');
            const cats = (res && res[scope]) ? res[scope].categories : [];
            const box = document.getElementById('kb6-treeBody');
            if (!box) return;
            const byParent = {};
            (cats || []).forEach(c => {
                const pid = c.parent_id || 0;
                (byParent[pid] = byParent[pid] || []).push(c);
            });
            const walk = (pid, depth) => {
                const nodes = byParent[pid] || [];
                return nodes.map(c => {
                    const kids = walk(c.id, depth + 1);
                    return `<div class="kb-tree-item" style="padding-left:${depth * 14}px;">
                        ${kids.length ? '<span class="kb-tree-toggle">▾</span>' : '<span class="kb-tree-toggle">·</span>'}
                        <span class="kb-tree-name">${Utils.esc(c.name)}</span>
                        ${kids ? `<div class="kb-tree-children">${kids}</div>` : ''}
                    </div>`;
                }).join('');
            };
            box.innerHTML = cats && cats.length ? walk(0, 0) : '<div class="kb-tree-empty">暂无分类</div>';
        } catch (e) {
            const box = document.getElementById('kb6-treeBody');
            if (box) box.innerHTML = '<div class="kb-tree-empty">分类树加载失败</div>';
        }
    },

    async uploadKB() {
        Utils.pickFiles({
            onPicked: async (files) => {
                const btn = document.getElementById('kb6-btn-upload');
                const origText = btn ? btn.textContent : '';
                if (btn) { btn.disabled = true; btn.textContent = '处理中...'; }
                Toast.show('正在导入并解析入库，请稍候...', 'info');
                try {
                    const fd = new FormData();
                    fd.append('file', files[0]);
                    fd.append('scope', this.kbScope || 'qa');
                    const res = await API.upload('/api/knowledge/upload', fd);
                    if (res && res.ok) {
                        const kindTxt = res.kind === 'code' ? '代码' : '文档';
                        Toast.success(`导入成功：${res.filename}（${kindTxt}），已解析入库 ${res.added} 条片段`);
                        this.loadKbList();
                        this.loadStatus();
                    } else {
                        Toast.error((res && res.error) || '导入失败');
                    }
                } catch (err) {
                    Toast.error('导入失败: ' + (err.message || ''));
                } finally {
                    if (btn) { btn.disabled = false; btn.textContent = origText; }
                }
            }
        });
    },

    showKbForm(id) {
        const isEdit = !!id;
        const rec = isEdit ? (this.kbData.find(r => r.id === id) || {}) : {};
        if (isEdit && !rec.id) { Toast.error('加载详情失败'); return; }

        Modal.open(`
            <div class="modal-form">
                <h3>${isEdit ? '编辑' : '新增'} 知识片段</h3>
                <div class="form-group">
                    <label>标题 <span class="req">*</span></label>
                    <input type="text" id="f6-kb-title" class="form-control" value="${Utils.esc(rec.title || '')}">
                </div>
                <div class="form-group">
                    <label>内容 <span class="req">*</span></label>
                    <textarea id="f6-kb-content" class="form-control" rows="8">${Utils.esc(rec.content || '')}</textarea>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <input type="text" id="f6-kb-category" class="form-control" value="${Utils.esc(rec.category || '')}" placeholder="例如：QA常见问答、算法能力">
                </div>
                <div class="form-group">
                    <label>搜索关键词</label>
                    <input type="text" id="f6-kb-keywords" class="form-control" value="${Utils.esc(rec.keywords || '')}" placeholder="逗号分隔">
                </div>
                <div class="form-group">
                    <label>来源类型</label>
                    <select id="f6-kb-sourceType" class="form-control">
                        <option value="manual" ${rec.source_type === 'manual' ? 'selected' : ''}>手动录入</option>
                        <option value="qa" ${rec.source_type === 'qa' ? 'selected' : ''}>Q&A同步</option>
                        <option value="xlsx" ${rec.source_type === 'xlsx' ? 'selected' : ''}>Excel</option>
                        <option value="html" ${rec.source_type === 'html' ? 'selected' : ''}>HTML</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="qa6-btn" onclick="Modal.close()">取消</button>
                    <button class="qa6-btn qa6-btn-primary" onclick="Page6.saveKbForm(${id || 0})">保存</button>
                </div>
            </div>
        `);
    },

    async saveKbForm(id) {
        const data = {
            title: document.getElementById('f6-kb-title').value.trim(),
            content: document.getElementById('f6-kb-content').value.trim(),
            category: document.getElementById('f6-kb-category').value.trim(),
            keywords: document.getElementById('f6-kb-keywords').value.trim(),
            source_type: document.getElementById('f6-kb-sourceType').value,
            scope: this.kbScope || 'qa'
        };

        if (!data.title || !data.content) {
            Toast.error('标题和内容为必填项');
            return;
        }

        if (id) {
            const res = await API.put(`/api/knowledge/${id}`, data);
            if (res) {
                Toast.success('更新成功');
                Modal.close();
                this.loadKbList();
            }
        } else {
            const res = await API.post('/api/knowledge', data);
            if (res) {
                Toast.success('新增成功');
                Modal.close();
                this.loadKbList();
            }
        }
    },

    async deleteKb(id) {
        if (!confirm('确定删除这条知识片段？')) return;
        const res = await API.del(`/api/knowledge/${id}?scope=${this.kbScope || 'qa'}`);
        if (res) {
            Toast.success('删除成功');
            this.loadKbList();
        }
    },

    async syncQA() {
        Toast.show('正在同步Q&A记录到知识库...', 'info');
        const res = await API.post('/api/knowledge/sync-qa', {});
        if (res) {
            Toast.success(`同步完成，新增 ${res.added} 条`);
            this.loadKbList();
            this.loadStatus();
        } else {
            Toast.error('同步失败');
        }
    },

    async syncFolder() {
        const btn = document.getElementById('kb6-btn-sync');
        const origText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '处理中...'; }
        try {
            Toast.show('正在解析知识库文件夹...', 'info');
            const res = await API.post('/api/knowledge/sync-folder', { scope: this.kbScope || 'qa' });
            if (res) {
                Toast.success(`同步完成，新增 ${res.added} 条`);
                this.loadKbList();
            } else {
                Toast.error('同步失败');
            }
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = origText; }
        }
    },

    async rebuildKB() {
        if (!confirm('确定重建两个知识库（QA + 数智分析）？将清空后从业务记录与文件夹重新同步。')) return;
        const btn = document.getElementById('kb6-btn-rebuild');
        const origText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '处理中...'; }
        try {
            Toast.show('正在重建知识库...', 'info');
            const res = await API.post('/api/knowledge/rebuild', {});
            if (res) {
                Toast.success('重建完成');
                this.loadKbList();
                this.loadKbTree(this.kbScope);
            } else {
                Toast.error('重建失败');
            }
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = origText; }
        }
    },

    async enrichKB() {
        const btn = document.activeElement && document.activeElement.tagName === 'BUTTON' ? document.activeElement : null;
        const origText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '处理中...'; }
        try {
            Toast.show('正在调用 AI 生成扩展问题，请稍候...', 'info');
            const res = await API.post('/api/knowledge/enrich', {});
            if (res) {
                Toast.success(`AI 增强索引完成，共处理 ${res.enriched} 条`);
                this.loadKbList();
            } else {
                Toast.error('AI 增强索引失败');
            }
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = origText; }
        }
    }
};
</script>

<script>
/**
 * 页面7 - 文档管理
 * 书架按 客户(OEM) → 电芯容量 → 文档类型 三级分类
 * 文档类型：数据委托处理协议 / 数据转发费用协议 / 阳光协议
 */
const Page7 = {
    initialized: false,
    docTypes: ['数据委托处理协议', '数据转发费用协议', '阳光协议'],

    init() {
        const container = document.getElementById('page7');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.loadList();
    },

    renderLayout() {
        const typeOpts = this.docTypes.map(t => `<option value="${t}">${t}</option>`).join('');
        return `
        <div class="filter-bar">
            <div class="form-group">
                <label>客户 (OEM)</label>
                <select id="p7Customer">${Utils.customerOptions()}</select>
            </div>
            <div class="form-group">
                <label>电芯容量</label>
                <input type="text" id="p7Capacity" placeholder="如 116，或填 通用">
            </div>
            <div class="form-group">
                <label>文档类型</label>
                <select id="p7DocType">
                    <option value="">全部类型</option>
                    ${typeOpts}
                </select>
            </div>
            <button class="btn btn-primary" id="p7Search">查 询</button>
            <button class="btn btn-success" id="p7Upload" data-perm="knowledge.edit">+ 上传文档</button>
        </div>
        <div id="p7List"></div>`;
    },

    bindEvents() {
        document.getElementById('p7Search').onclick = () => this.loadList();
        document.getElementById('p7Upload').onclick = () => this.openUpload();
    },

    async loadList() {
        const oem = document.getElementById('p7Customer').value;
        const cap = document.getElementById('p7Capacity').value.trim();
        const dtype = document.getElementById('p7DocType').value;

        let url = '/api/documents?';
        if (oem) url += `oem=${encodeURIComponent(oem)}&`;
        if (cap) url += `capacity_ah=${encodeURIComponent(cap)}&`;
        if (dtype) url += `doc_type=${encodeURIComponent(dtype)}&`;

        const container = document.getElementById('p7List');
        container.innerHTML = '<div class="loading"></div>';
        const data = await API.get(url);
        if (!data || !data.length) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128194;</div><p>暂无文档</p></div>';
            return;
        }
        container.innerHTML = this.renderGrouped(data);
        this.bindGroupToggles();
    },

    // 三级分组：客户 → 容量 → 类型
    renderGrouped(docs) {
        const groups = {};
        docs.forEach(d => {
            const cust = d.name_cn || '未分类客户';
            const cap = (d.capacity_ah !== null && d.capacity_ah !== undefined) ? `${d.capacity_ah}Ah` : '通用';
            const type = d.doc_type || '未分类';
            groups[cust] = groups[cust] || {};
            groups[cust][cap] = groups[cust][cap] || {};
            groups[cust][cap][type] = groups[cust][cap][type] || [];
            groups[cust][cap][type].push(d);
        });

        let gid = 0;
        let html = `<div class="card"><div class="card-title">文档管理 (${docs.length} 份)</div>`;

        Object.keys(groups).sort().forEach(cust => {
            const capMap = groups[cust];
            const custCount = Object.values(capMap).reduce((s, tMap) =>
                s + Object.values(tMap).reduce((ss, arr) => ss + arr.length, 0), 0);
            const custId = `p7g_${gid++}`;
            html += `<div class="doc-group">
                <div class="doc-group-head" data-target="${custId}">
                    <span class="doc-group-arrow">&#9660;</span>
                    <span class="doc-group-name">${Utils.esc(cust)}</span>
                    <span class="doc-group-count">${custCount} 份</span>
                </div>
                <div class="doc-group-body" id="${custId}">`;

            // 容量排序：数值降序，通用置底
            const capKeys = Object.keys(capMap).sort((a, b) => {
                if (a === '通用') return 1;
                if (b === '通用') return -1;
                return parseFloat(b) - parseFloat(a);
            });
            capKeys.forEach(cap => {
                const typeMap = capMap[cap];
                html += `<div class="doc-cap-group">
                    <div class="doc-cap-head">&#128268; ${Utils.esc(cap)}</div>`;
                // 同一容量下所有协议横排：按协议类型顺序平铺进一个书架
                const orderedTypes = this.docTypes.concat(
                    Object.keys(typeMap).filter(t => this.docTypes.indexOf(t) < 0));
                let books = '';
                orderedTypes.forEach(type => {
                    if (!typeMap[type]) return;
                    books += typeMap[type].map(d => this.renderBook(d, type)).join('');
                });
                html += `<div class="bookshelf">${books}</div>`;
                html += `</div>`;
            });

            html += `</div></div>`;
        });

        html += `</div>`;
        return html;
    },

    renderBook(d, type) {
        const badge = type ? `<div class="book-type-badge">${Utils.esc(type)}</div>` : '';
        return `<div class="book-item" onclick="window.open('/api/documents/${d.id}/download')">
            ${badge}
            <span class="book-icon">&#128196;</span>
            <div class="book-title" title="${Utils.esc(d.title || d.file_name)}">${Utils.esc(d.title || d.file_name)}</div>
            <div class="book-meta">${Utils.formatDate(d.upload_date)}</div>
        </div>`;
    },

    bindGroupToggles() {
        document.querySelectorAll('.doc-group-head').forEach(head => {
            head.onclick = () => {
                const body = document.getElementById(head.dataset.target);
                const arrow = head.querySelector('.doc-group-arrow');
                if (body.style.display === 'none') {
                    body.style.display = '';
                    arrow.innerHTML = '&#9660;';
                } else {
                    body.style.display = 'none';
                    arrow.innerHTML = '&#9654;';
                }
            };
        });
    },

    openUpload() {
        Modal.open(`
            <div class="modal-header"><h3>导入文档</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div class="form-group"><label>本地文件 *</label>
                <div style="display:flex;align-items:center;gap:8px;">
                    <button type="button" class="btn btn-secondary" onclick="Page7.pickDocFile()">&#128193; 选择文件</button>
                    <span id="mfDocLabel" style="font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">未选择文件</span>
                </div>
            </div>
            <div class="form-group"><label>文档标题</label><input type="text" id="mfDocTitle" placeholder="留空则使用文件名"></div>
            <div class="form-row">
                <div class="form-group"><label>所属客户 *</label>
                    <select id="mfDocCust">${Utils.customerOptions()}</select>
                </div>
                <div class="form-group"><label>文档类型 *</label>
                    <select id="mfDocType">
                        <option value="">请选择</option>
                        ${this.docTypes.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
            </div>
            <div class="form-group"><label>电芯容量（可选标签，留空则归入"通用"）</label>
                <input type="text" id="mfDocCap" placeholder="如 116，留空为通用">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="Page7.doUpload()">导入</button>
            </div>
        `);
    },

    pickDocFile() {
        Utils.pickFiles({
            onPicked: (files) => {
                this._docFile = files[0];
                document.getElementById('mfDocLabel').textContent = files[0].name;
            }
        });
    },

    async doUpload() {
        if (!this._docFile) {
            Toast.error('请选择文件');
            return;
        }
        const oem = document.getElementById('mfDocCust').value;
        const docType = document.getElementById('mfDocType').value;
        if (!oem) { Toast.error('请选择所属客户'); return; }
        if (!docType) { Toast.error('请选择文档类型'); return; }

        const fd = new FormData();
        fd.append('file', this._docFile);
        fd.append('title', document.getElementById('mfDocTitle').value.trim());
        fd.append('doc_type', docType);
        fd.append('oem', oem);
        fd.append('capacity_ah', document.getElementById('mfDocCap').value.trim() || '');
        fd.append('uploader', App.currentUser ? App.currentUser.name : '');
        const result = await API.upload('/api/documents/upload', fd);
        if (result && !result.error) {
            Toast.success('导入成功');
            Modal.close();
            this._docFile = null;   // E: 提交成功后重置选择状态
            this.loadList();
        }
    }
};

</script>
