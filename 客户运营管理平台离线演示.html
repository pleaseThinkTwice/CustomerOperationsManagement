    downloadReport() {
        const r = this._curReport;
        if (!r) return;
        this._download(r.filename, r.content, 'text/markdown');
    },

    // ---------- 导出 ----------
    async exportSummary() {
        const d = await API.get('/api/insights/export');
        if (!d || d.error) { Toast.error(d && d.error || '导出失败'); return; }
        this._download(d.filename, d.content, 'text/markdown');
    },
    async exportTable(tableName) {
        const d = await API.get('/api/insights/export?table=' + encodeURIComponent(tableName));
        if (!d || d.error) { Toast.error(d && d.error || '导出失败'); return; }
        this._download(d.filename, d.content, 'text/markdown');
    },
    _download(filename, content, type) {
        // 文本类（md/csv/txt）补 BOM，避免 Windows 记事本按 ANSI 读 UTF-8 导致乱码；二进制（xlsx等）前端不经过此函数
        const isText = /text\/(markdown|csv|plain)/.test(type || '');
        const body = isText && typeof content === 'string' && !content.startsWith('\ufeff') ? '\ufeff' + content : content;
        const blob = new Blob([body], { type: type + ';charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    },

    // ---------- 数据资产速查 ----------
    async searchAssets() {
        const qEl = document.getElementById('pi-asset-q');
        const q = qEl ? qEl.value.trim() : '';
        const box = document.getElementById('pi-asset-result');
        if (!q) { box.innerHTML = '<div class="empty-state">输入业务字段关键词进行检索。</div>'; return; }
        box.innerHTML = '<div class="loading">检索中…</div>';
        const d = await API.get('/api/insights/search?q=' + encodeURIComponent(q));
        const items = d.items || [];
        if (!items.length) { box.innerHTML = '<div class="empty-state">已学洞察中未找到包含「' + Utils.esc(q) + '」的表。</div>'; return; }
        box.innerHTML = items.map(it => `
            <div style="border:1px solid var(--border-card);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;" onclick="PageInsight.openDetail(${this._idOf(it.table)})">
                <div style="font-size:13px;font-weight:700;">${Utils.esc(it.table)}</div>
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">${Utils.esc(it.desc || '')}</div>
                <div style="font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;">
                    ${it.matches.map(m => `<span><code style="color:var(--accent);">${Utils.esc(m.col)}</code> ${Utils.esc(m.desc || '')}</span>`).join('')}
                    ${it.match_count > it.matches.length ? `<span style="color:var(--text-muted);">…共 ${it.match_count} 个字段</span>` : ''}
                </div>
            </div>`).join('');
    },
    _idOf(tableName) {
        const it = this._allItems.find(x => x.table_name === tableName);
        return it ? it.id : '';
    },

    // ---------- 报表视图（指标卡 + SVG图 + 结论 + 跨表联动） ----------
    async openDetail(id) {
        Modal.open('<div class="loading">加载洞察…</div>');
        const d = await API.get('/api/insights/' + id);
        if (!d || d.error) { Modal.open(`<h3>数据洞察</h3><div class="empty-state">${Utils.esc(d ? d.error : '加载失败')}</div>`); return; }
        this._curDetail = d;   // 供「审计 SQL 再查」「追问」读取
        const m = d.meta || {};
        const metricCards = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:6px 0 12px;">
            ${[
                { label: '总数据量', value: m.rows || (m.count != null ? String(m.count) : '未知') },
                { label: '时间范围', value: m.time_range || '未知', sub: (m.grain ? '粒度：' + m.grain : '') },
                { label: '核心维度', value: (m.key_fields || []).join('、') || '—' },
            ].map(c => `
              <div style="border:1px solid var(--border-card);border-radius:10px;padding:10px 12px;background:var(--bg-card);">
                <div style="font-size:12px;color:var(--text-muted);">${Utils.esc(c.label)}</div>
                <div style="font-size:16px;font-weight:700;color:var(--accent);margin-top:2px;word-break:break-all;">${Utils.esc(c.value || '—')}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${Utils.esc(c.sub || '')}</div>
              </div>`).join('')}
        </div>`;
        const hasViz = (d.charts && d.charts.length) || (d.conclusions && d.conclusions.length);
        const chartsHtml = (d.charts && d.charts.length)
            ? `<div class="pi-chart-grid">${d.charts.map(c => this.chartCard(c)).join('')}</div>` : '';
        const conclHtml = (d.conclusions && d.conclusions.length)
            ? `<div style="margin:12px 0 6px;"><strong style="font-size:14px;">核心结论</strong></div>
               <div style="display:flex;flex-direction:column;gap:8px;">
                 ${d.conclusions.map(c => `
                   <div style="border:1px solid ${c.level === '重点' ? 'var(--warning)' : 'var(--border-card)'};border-left:4px solid ${c.level === '重点' ? 'var(--warning)' : 'var(--accent)'};border-radius:8px;padding:10px 12px;">
                     <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;">
                       ${c.level === '重点' ? '<span class="badge badge-warning">重点</span>' : '<span class="badge badge-info">一般</span>'}
                       ${Utils.esc(c.title)}
                     </div>
                     <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${Utils.esc(c.body || '')}</div>
                   </div>`).join('')}
               </div>` : '';
        const cols = (d.columns_meta || []).map(c =>
            `<tr><td style="padding:3px 8px;font-family:var(--mono,Consolas,monospace);color:var(--accent);">${Utils.esc(c.col)}</td>
             <td style="padding:3px 8px;color:var(--text-muted);">${Utils.esc(c.type || '-')}</td>
             <td style="padding:3px 8px;color:var(--text-secondary);">${Utils.esc(c.desc || '-')}</td></tr>`).join('');
        const body = `
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">
                <span class="badge badge-info">${Utils.esc(d.table_name)}</span>
                <span style="font-size:12px;color:var(--text-muted);">更新 ${Utils.formatDate(d.updated_at)}${d.trigger_by ? ' · ' + Utils.esc(d.trigger_by) : ''}</span>
            </div>
            ${metricCards}
            ${hasViz ? '' : '<div class="empty-state" style="font-size:12px;padding:8px;">该表为早期学习版本，无图表/结论。点击下方「升级」以生成可视化洞察。</div>'}
            ${chartsHtml}
            ${this.trendBlock(d)}
            ${conclHtml}
            ${this.qualityBlock(d)}
            ${this.askBlock(d.id, (d.conclusions || []).filter(c => c._q))}
            ${this.joinsBlock(d, id)}
            <details style="margin-top:8px;border:1px solid var(--border-card);border-radius:8px;padding:8px;">
                <summary style="cursor:pointer;font-size:13px;color:var(--text-secondary);">🔍 审计可复现 SQL 清单（${(d.queries || []).length}）</summary>
                <div class="md-body" style="padding-top:8px;">${this.sqlAuditBlock(d.queries || [])}</div>
            </details>
            <details style="margin-top:14px;border:1px solid var(--border-card);border-radius:8px;padding:8px;">
                <summary style="cursor:pointer;font-size:13px;color:var(--text-secondary);">字段词典（${d.columns_meta ? d.columns_meta.length : 0}）</summary>
                <table class="data-table" style="width:100%;font-size:12px;border-collapse:collapse;margin-top:6px;">
                    <thead><tr><th style="text-align:left;padding:3px 8px;">字段</th><th style="text-align:left;padding:3px 8px;">类型</th><th style="text-align:left;padding:3px 8px;">含义</th></tr></thead>
                    <tbody>${cols || '<tr><td colspan="3" style="padding:6px;">无</td></tr>'}</tbody>
                </table>
            </details>
            <details style="margin-top:8px;border:1px solid var(--border-card);border-radius:8px;padding:8px;">
                <summary style="cursor:pointer;font-size:13px;color:var(--text-secondary);">详细报告（Markdown 附录）</summary>
                <div class="md-body" style="line-height:1.7;padding-top:8px;">${Utils.mdSanitize(d.report_html) || Utils.esc(d.report || '')}</div>
            </details>`;
        Modal.open(`
            <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;">
                <h3 style="margin:0;">${d.starred ? '⭐ ' : '☆ '}${Utils.esc(d.title || d.table_name)}</h3>
                <div style="display:flex;align-items:center;gap:6px;">
                    <button class="btn btn-sm ${d.starred ? 'btn-primary' : 'btn-secondary'}" onclick="PageInsight.toggleStar(${id});Modal.close();">${d.starred ? '取消收藏' : '收藏'}</button>
                    <button class="modal-close" onclick="Modal.close()">&times;</button>
                </div>
            </div>
            <div style="max-height:78vh;overflow:auto;padding-right:4px;" id="pi-detail-body">${body}</div>`);
        const tl = document.getElementById('pi-tie-load');
        if (tl) tl.onclick = () => this.loadTieCandidates(id);
        const ak = document.getElementById('pi-ask-run');
        if (ak) ak.onclick = () => this.runAsk(id);
        const ai = document.getElementById('pi-ask-input');
        if (ai) ai.addEventListener('keydown', e => { if (e.key === 'Enter') this.runAsk(id); });
    },

    // 图表卡片（SVG 条形/环形，零依赖）
    chartCard(ch) {
        const title = Utils.esc(ch.title || '分布');
        const unit = ch.unit ? `（${Utils.esc(ch.unit)}）` : '';
        let labels = (ch.labels || []).map(x => String(x));
        let values = (ch.values || []).map(Number);
        labels = labels.slice(0, 10); values = values.slice(0, 10);
        if (!values.length) return '';
        if (ch.type === 'pie') {
            return `<div class="card" style="padding:12px;min-width:220px;">
                <div style="font-size:13px;font-weight:700;margin-bottom:6px;">${title}${unit}</div>
                ${this.svgPie(labels, values)}</div>`;
        }
        return `<div class="card" style="padding:12px;min-width:260px;">
            <div style="font-size:13px;font-weight:700;margin-bottom:6px;">${title}${unit}</div>
            ${this.svgBars(labels, values)}</div>`;
    },
    svgBars(labels, values) {
        const max = Math.max(...values, 1);
        let rows = '';
        labels.forEach((l, i) => {
            const w = Math.round((values[i] / max) * 100);
            rows += `
                <div style="display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px;">
                    <div style="width:110px;text-align:right;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${Utils.esc(l || '(空)')}</div>
                    <div style="flex:1;"><div style="background:linear-gradient(90deg,var(--accent),var(--accent-light));height:14px;width:${w}%;border-radius:3px;min-width:2px;"></div></div>
                    <div style="width:64px;text-align:left;font-family:var(--mono,Consolas,monospace);color:var(--text-primary);">${values[i]}</div>
                </div>`;
        });
        return `<div style="overflow-x:auto;">${rows}</div>`;
    },
    svgPie(labels, values) {
        const total = values.reduce((a, b) => a + (b || 0), 0) || 1;
        let acc = 0; const segs = [];
        values.forEach((v, i) => {
            const start = acc * 360; acc += v / total;
            const end = acc * 360;
            const large = (end - start) > 180 ? 1 : 0;
            const r = 60, cx = 75, cy = 75;
            const a0 = (start - 90) * Math.PI / 180, a1 = (end - 90) * Math.PI / 180;
            const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
            const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
            segs.push(`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${this._svgColors[i % this._svgColors.length]}" stroke="#0b1322" stroke-width="1"></path>`);
        });
        const legend = labels.map((l, i) => `
            <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);white-space:nowrap;">
                <span style="width:10px;height:10px;display:inline-block;background:${this._svgColors[i % this._svgColors.length]};border-radius:2px;"></span>
                ${Utils.esc(l || '(空)')} <span style="font-family:var(--mono,Consolas,monospace);">${values[i]}（${((values[i] / total) * 100).toFixed(1)}%）</span>
            </div>`).join('');
        return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <svg width="150" height="150" viewBox="0 0 150 150" style="flex-shrink:0;">
              <circle cx="75" cy="75" r="60" fill="none" stroke="var(--border-card)" stroke-width="1"></circle>
              ${segs.join('')}
            </svg>
            <div style="display:flex;flex-direction:column;gap:4px;">${legend}</div>
        </div>`;
    },

    // 跨表联动区块
    joinsBlock(d, id) {
        const joins = d.joins || [];
        let list = '';
        if (joins.length) {
            list = `<div style="margin-top:6px;">${joins.map(j => `
                <div style="border:1px solid var(--border-card);border-radius:8px;padding:9px 12px;margin-bottom:6px;">
                    <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;">
                        ${j.level === '重点' ? '<span class="badge badge-warning">重点</span>' : ''}
                        ${Utils.esc(j.table)}
                        <span style="font-size:11px;color:var(--text-muted);">${Utils.esc(j.relation || '')}</span>
                    </div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${Utils.esc(j.insight || '')}</div>
                </div>`).join('')}</div>`;
        }
        return `
        <div style="margin:14px 0 4px;"><strong style="font-size:14px;">跨表联动</strong>
            <span style="font-size:11px;color:var(--text-muted);">让 Agent 把本表与其它表 join 挖掘业务见地</span>
        </div>
        <div style="border:1px solid var(--border-card);border-radius:10px;padding:10px;">
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">
                <button class="btn btn-sm btn-secondary" id="pi-tie-load">选择关联表</button>
                <button class="btn btn-sm btn-primary" id="pi-tie-auto">⚡ 一键推荐联动</button>
            </div>
            <div id="pi-tie-pick" style="display:none;margin-bottom:6px;"></div>
            <div id="pi-tie-result">${list}</div>
        </div>`;
    },

    async loadTieCandidates(id) {
        const box = document.getElementById('pi-tie-pick');
        box.style.display = '';
        box.innerHTML = '<div class="loading">加载候选表…</div>';
        const d = await API.get(`/api/insights/${id}/related`);
        box.innerHTML = d.items.length
            ? `<div style="max-height:160px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;">
                  ${d.items.map(t => `<label style="white-space:nowrap;cursor:pointer;">
                      <input type="checkbox" class="pi-tie-cb" data-table="${Utils.esc(t.full_name)}">
                      <span>${Utils.esc(t.table_desc || t.full_name)}</span>
                      ${t.shared_cols && t.shared_cols.length ? `<span style="color:var(--accent);">↔${t.shared_cols.slice(0, 2).join(',')}</span>` : ''}
                  </label>`).join('')}
               </div>
               <div style="margin:6px 0;display:flex;gap:6px;">
                  <button class="btn btn-sm btn-primary" id="pi-tie-run">🚀 用所选表联动</button>
               </div>`
            : '<div class="empty-state">暂无可关联表，先学习更多表。</div>';
        document.getElementById('pi-tie-run').onclick = () => this.runTie(id);
        const auto = document.getElementById('pi-tie-auto');
        if (auto) auto.onclick = () => this.runTie(id, true);
    },

    // ---------- 交互式追问/下钻 ----------
    askBlock(id, followups) {
        const fuHtml = (followups || []).map(f => `
            <div style="border:1px dashed var(--warn, #fbbf24);border-left:4px solid var(--info);border-radius:8px;padding:8px 11px;margin-bottom:6px;background:var(--info-soft, rgba(8,145,178,.06));">
                <div style="font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;">
                    <span class="badge badge-info">追问</span>${Utils.esc(f.title)}
                    ${f._q_ts ? `<span style="font-size:10.5px;color:var(--text-muted);margin-left:auto;">${Utils.esc(f._q_ts)}</span>` : ''}
                </div>
                <div style="font-size:12.5px;color:var(--text-secondary);margin-top:3px;">${Utils.esc(f.body || '')}</div>
            </div>`).join('');
        return `
        <div style="margin:14px 0 4px;"><strong style="font-size:14px;">💬 追问 / 下钻</strong>
            <span style="font-size:11px;color:var(--text-muted);">对你关心的现象继续问，Agent 会执行只读下钻并沉淀为新结论</span>
        </div>
        <div style="border:1px solid var(--border-card);border-radius:10px;padding:10px;">
            ${fuHtml}
            <div style="display:flex;gap:8px;align-items:center;">
                <input id="pi-ask-input" type="text" placeholder="如：按车型看哪几个型号占比最高？近3个月趋势？某维度 top5？"
                    style="flex:1;padding:9px 11px;border:1px solid var(--border-card);border-radius:8px;background:var(--bg-card);color:var(--text-primary);" />
                <button class="btn btn-sm btn-primary" id="pi-ask-run">🔍 追问</button>
            </div>
            <div id="pi-ask-result" style="margin-top:8px;"></div>
        </div>`;
    },

    async runAsk(id) {
        const input = document.getElementById('pi-ask-input');
        const box = document.getElementById('pi-ask-result');
        const q = input ? input.value.trim() : '';
        if (!q) { Toast.error('请输入要追问的问题'); return; }
        const btn = document.getElementById('pi-ask-run');
        box.innerHTML = '<div class="loading">Agent 正在下钻查询并归纳结论…</div>';
        btn.disabled = true;
        try {
            const res = await API.post(`/api/insights/${id}/ask`, { question: q });
            if (res && res.ok) {
                const c = res.conclusion || {};
                box.innerHTML = `
                    <div style="display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border-card);border-left:4px solid var(--info);border-radius:8px;padding:9px 11px;">
                        <div style="flex:1;min-width:0;">
                            <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;">
                                <span class="badge badge-info">追问 · ${Utils.esc(c.level || '一般')}</span>${Utils.esc(c.title || '')}
                            </div>
                            <div style="font-size:12.5px;color:var(--text-secondary);margin-top:3px;">${Utils.esc(c.body || '')}</div>
                            <details style="margin-top:6px;"><summary style="cursor:pointer;font-size:11.5px;color:var(--text-muted);">下钻 SQL（可执行再查）</summary>
                                <pre style="font-family:var(--font-mono,monospace);font-size:11px;background:var(--panel-2);border-radius:6px;padding:8px;margin:4px 0 0;overflow-x:auto;white-space:pre-wrap;">${Utils.esc(res.query || '')}</pre>
                            </details>
                            ${(res.rows_preview || []).length ? `<div style="margin-top:6px;font-size:11px;color:var(--text-muted);">结果预览：${Utils.esc(res.rows_preview.slice(0,3).join(' ｜ '))}</div>` : ''}
                        </div>
                    </div>`;
                if (input) input.value = '';
                // 刷新结论区
                const nd = await API.get(`/api/insights/${id}`);
                if (nd && !nd.error) { const b = document.getElementById('pi-detail-body'); if (b) b.innerHTML = this.injectOpeners(nd, id); }
                Toast.success('已沉淀为追问结论');
            } else {
                box.innerHTML = `<div class="empty-state">${Utils.esc((res && res.error) || '追问失败')}</div>`;
            }
        } catch (e) {
            box.innerHTML = `<div class="empty-state">追问失败：${Utils.esc(e.message || '')}</div>`;
        } finally {
            btn.disabled = false;
        }
    },
    injectOpeners(d, id) {
        // 重新构建 openDetail 的完整 body（复用方法），用于追问后刷新结论与 SQL
        const m = d.meta || {};
        const metricCards = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:6px 0 12px;">
            ${[{ label: '总数据量', value: m.rows || (m.count != null ? String(m.count) : '未知') },
              { label: '时间范围', value: m.time_range || '未知', sub: (m.grain ? '粒度：' + m.grain : '') },
              { label: '核心维度', value: (m.key_fields || []).join('、') || '—' }].map(c => `
              <div style="border:1px solid var(--border-card);border-radius:10px;padding:10px 12px;background:var(--bg-card);">
                <div style="font-size:12px;color:var(--text-muted);">${Utils.esc(c.label)}</div>
                <div style="font-size:16px;font-weight:700;color:var(--accent);margin-top:2px;word-break:break-all;">${Utils.esc(c.value || '—')}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${Utils.esc(c.sub || '')}</div>
              </div>`).join('')}
        </div>`;
        const hasViz = (d.charts && d.charts.length) || (d.conclusions && d.conclusions.length);
        const chartsHtml = (d.charts && d.charts.length)
            ? `<div class="pi-chart-grid">${d.charts.map(c => this.chartCard(c)).join('')}</div>` : '';
        const conclHtml = (d.conclusions && d.conclusions.length)
            ? `<div style="margin:12px 0 6px;"><strong style="font-size:14px;">核心结论</strong></div>
               <div style="display:flex;flex-direction:column;gap:8px;">
                 ${d.conclusions.map(c => c._q ? `
                    <div style="border:1px dashed var(--info);border-left:4px solid var(--info);border-radius:8px;padding:9px 11px;background:var(--info-soft, rgba(8,145,178,.06));">
                      <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;"><span class="badge badge-info">追问</span>${Utils.esc(c.title)}</div>
                      <div style="font-size:13px;color:var(--text-secondary);margin-top:3px;">${Utils.esc(c.body || '')}</div>
                    </div>` : `
                    <div style="border:1px solid ${c.level === '重点' ? 'var(--warning)' : 'var(--border-card)'};border-left:4px solid ${c.level === '重点' ? 'var(--warning)' : 'var(--accent)'};border-radius:8px;padding:10px 12px;">
                      <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;">
                        ${c.level === '重点' ? '<span class="badge badge-warning">重点</span>' : '<span class="badge badge-info">一般</span>'}
                        ${Utils.esc(c.title)}
                      </div>
                      <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${Utils.esc(c.body || '')}</div>
                    </div>`).join('')}
               </div>` : '';
        const cols = (d.columns_meta || []).map(c =>
            `<tr><td style="padding:3px 8px;font-family:var(--mono,Consolas,monospace);color:var(--accent);">${Utils.esc(c.col)}</td>
             <td style="padding:3px 8px;color:var(--text-muted);">${Utils.esc(c.type || '-')}</td>
             <td style="padding:3px 8px;color:var(--text-secondary);">${Utils.esc(c.desc || '-')}</td></tr>`).join('');
        return `
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">
                <span class="badge badge-info">${Utils.esc(d.table_name)}</span>
                <span style="font-size:12px;color:var(--text-muted);">更新 ${Utils.formatDate(d.updated_at)}</span>
            </div>
            ${metricCards}
            ${hasViz ? '' : ''}
            ${chartsHtml}
            ${this.trendBlock(d)}
            ${conclHtml}
            ${this.qualityBlock(d)}
            ${this.askBlock(d.id, (d.conclusions || []).filter(c => c._q))}
            ${this.joinsBlock(d, id)}
            <details style="margin-top:8px;border:1px solid var(--border-card);border-radius:8px;padding:8px;">
                <summary style="cursor:pointer;font-size:13px;color:var(--text-secondary);">🔍 审计可复现 SQL 清单（${(d.queries || []).length}）</summary>
                <div class="md-body" style="padding-top:8px;">${this.sqlAuditBlock(d.queries || [])}</div>
            </details>
            <details style="margin-top:8px;border:1px solid var(--border-card);border-radius:8px;padding:8px;">
                <summary style="cursor:pointer;font-size:13px;color:var(--text-secondary);">字段词典（${d.columns_meta ? d.columns_meta.length : 0}）</summary>
                <table class="data-table" style="width:100%;font-size:12px;border-collapse:collapse;margin-top:6px;">
                    <thead><tr><th style="text-align:left;padding:3px 8px;">字段</th><th style="text-align:left;padding:3px 8px;">类型</th><th style="text-align:left;padding:3px 8px;">含义</th></tr></thead>
                    <tbody>${cols || '<tr><td colspan="3" style="padding:6px;">无</td></tr>'}</tbody>
                </table>
            </details>`;
    },

    // 时间趋势（月度曲线，从 meta.trends 读取）
    trendBlock(d) {
        const t = (d.meta && d.meta.trends) || null;
        if (!t || !t.points || t.points.length < 2) return '';
        const pts = t.points.slice(-24);
        const labels = pts.map(p => String(p.label || ''));
        const values = pts.map(p => Number(p.value) || 0);
        const maxV = Math.max(...values, 1);
        const W = Math.max(360, values.length * 24), H = 150, P = 24;
        const iw = W - P * 2, ih = H - P * 2;
        const x = i => P + (values.length === 1 ? iw / 2 : i * iw / (values.length - 1));
        const y = v => P + ih - (v / maxV) * ih;
        const coords = values.map((v, i) => [x(i), y(v)]);
        const line = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
        const area = `M${coords[0][0].toFixed(1)},${H - P} ` + coords.slice(1).map(c => 'L' + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ') + ` L${coords[coords.length - 1][0].toFixed(1)},${H - P} Z`;
        const dots = coords.map((c, i) => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="#4f8cff"><title>${Utils.esc(labels[i])}: ${values[i]}</title></circle>`).join('');
        const xlabels = labels.map((l, i) => (i % Math.ceil(labels.length / 6) === 0)
            ? `<text x="${x(i).toFixed(0)}" y="${H - 6}" font-size="9" fill="#8496b6" text-anchor="middle">${Utils.esc(l)}</text>` : '').join('');
        const maxLabel = maxV >= 10000 ? (maxV / 10000).toFixed(1) + '万' : String(maxV);
        return `
        <div style="margin:12px 0 4px;"><strong style="font-size:14px;">📈 月度趋势</strong>
            <span style="font-size:11px;color:var(--text-muted);">按 ${Utils.esc(t.date)} 统计 ${Utils.esc(t.num)}</span>
        </div>
        <div style="border:1px solid var(--border-card);border-radius:10px;padding:8px;overflow-x:auto;">
            <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="min-width:${W}px;">
                <g stroke="#e2e8f0" stroke-width="0.5">
                    <line x1="${P}" y1="${y(maxV)}" x2="${W - P}" y2="${y(maxV)}"/>
                    <line x1="${P}" y1="${y(maxV / 2)}" x2="${W - P}" y2="${y(maxV / 2)}"/>
                </g>
                <path d="${area}" fill="rgba(79,140,255,.12)"/>
                <path d="${line}" fill="none" stroke="#4f8cff" stroke-width="2"/>
                ${dots}
                ${xlabels}
                <text x="${P}" y="${P + 4}" font-size="9" fill="#8496b6">${maxLabel}</text>
            </svg>
        </div>`;
    },

    // 数据质量体检
    qualityBlock(d) {
        const q = (d.meta && d.meta.quality) || null;
        if (!q) return '';
        const color = { good: 'var(--ok)', warn: 'var(--warn, #fbbf24)', bad: 'var(--danger)' }[q.verdict] || 'var(--muted)';
        const label = { good: '良好', warn: '需关注', bad: '待修复' }[q.verdict] || '未知';
        const rows = (q.fields || []).slice(0, 12).map(f => `
            <tr>
                <td style="padding:3px 8px;font-family:var(--mono,Consolas,monospace);color:var(--accent);">${Utils.esc(f.col)}</td>
                <td style="padding:3px 8px;color:var(--text-secondary);">${Utils.esc((f.issues || []).join('、') || '正常')}</td>
                <td style="padding:3px 8px;" class="mono">${f.null_rate}%</td>
                <td style="padding:3px 8px;" class="mono">${f.distinct !== undefined ? f.distinct.toLocaleString() : '-'}</td>
            </tr>`).join('');
        if (!rows) return '';
        return `
        <div style="margin:12px 0 4px;"><strong style="font-size:14px;">🧹 数据质量体检</strong>
            <span class="badge" style="background:${color};color:#0b1322;margin-left:6px;">${Utils.esc(label)}</span>
        </div>
        <div style="border:1px solid var(--border-card);border-radius:10px;padding:8px;overflow-x:auto;">
            <table class="data-table" style="width:100%;font-size:12px;border-collapse:collapse;">
                <thead><tr><th style="text-align:left;padding:3px 8px;">字段</th><th style="text-align:left;padding:3px 8px;">问题</th><th style="text-align:left;padding:3px 8px;">空值率</th><th style="text-align:left;padding:3px 8px;">去重数</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
    },

    // ---------- 审计可复现 SQL 清单 ----------
    sqlAuditBlock(queries) {
        if (!queries || !queries.length) return '<div style="font-size:11.5px;color:var(--text-muted);">（早期学习版本，未留存勘探 SQL）</div>';
        return `<div style="display:flex;flex-direction:column;gap:6px;">${queries.map((q, i) => `
            <div style="border:1px solid var(--border-card);border-radius:8px;padding:7px 10px;font-size:11.5px;">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <span style="color:var(--text-muted);font-weight:600;">#${i + 1}</span>
                    <span style="color:var(--accent);font-weight:600;">${Utils.esc(q.purpose || '勘探')}</span>
                    <span style="margin-left:auto;color:var(--text-muted);">${Utils.esc(q.ts || '')}</span>
                    <button class="btn btn-sm btn-secondary" onclick="PageInsight.rerunQuery(${i})" title="执行这条 SQL 看真实结果">再查</button>
                </div>
                <pre style="font-family:var(--font-mono,monospace);font-size:10.5px;background:var(--panel-2);border-radius:5px;padding:6px;margin-top:5px;overflow-x:auto;white-space:pre-wrap;">${Utils.esc(q.sql || '')}</pre>
                <div class="pi-rerun-result"></div>
            </div>`).join('')}</div>`;
    },

    // 重新执行某条审计 SQL 并在其下展示结果
    async rerunQuery(idx) {
        const detail = this._curDetail || null;
        if (!detail) { Toast.error('请重新打开洞察详情'); return; }
        const q = (detail.queries || [])[idx];
        if (!q) { Toast.error('未找到该条勘探记录'); return; }
        const btnEl = event && event.target;
        const pre = btnEl && btnEl.closest('div');
        const box = pre ? pre.querySelector('.pi-rerun-result') : null;
        if (box) box.innerHTML = '<div class="loading">查询中…</div>';
        const res = await API.post('/api/insights/run-query', { sql: q.sql, max_rows: 30 });
        if (box) {
            if (res && res.ok) {
                const head = (res.columns || []).map(c => `<th style="text-align:left;padding:3px 6px;">${Utils.esc(c)}</th>`).join('');
                const rows = (res.rows || []).map(r => `<tr>${r.map(v => `<td style="padding:2px 6px;">${Utils.esc(String(v ?? ''))}</td>`).join('')}</tr>`).join('');
                box.innerHTML = `<div style="margin-top:6px;border:1px solid var(--border-card);border-radius:6px;overflow-x:auto;">
                    <table class="data-table" style="font-size:11px;border-collapse:collapse;width:100%;"><thead><tr>${head}</tr></thead><tbody>${rows || '<tr><td style="padding:4px;">（无结果）</td></tr>'}</tbody></table>
                    <div style="font-size:10.5px;color:var(--text-muted);padding:3px 6px;">共 ${(res.rows || []).length} 行</div></div>`;
            } else {
                box.innerHTML = `<div style="font-size:11.5px;color:var(--danger);margin-top:5px;">${Utils.esc((res && res.error) || '执行失败')}</div>`;
            }
        }
    },

    async runTie(id, auto) {
        let rel;
        if (auto) {
            const d = await API.get(`/api/insights/${id}/related`);
            // 一键推荐：默认取前 3 张（同库/共享字段评分的顶部）
            rel = (d.items || []).slice(0, 3).map(t => t.full_name);
            if (!rel.length) { Toast.error('暂无可推荐关联表'); return; }
        } else {
            rel = [...document.querySelectorAll('#pi-tie-pick .pi-tie-cb:checked')].map(c => c.dataset.table);
            if (!rel.length) { Toast.error('请先勾选要联动的关联表'); return; }
        }
        const btn = document.getElementById(auto ? 'pi-tie-auto' : 'pi-tie-run');
        const resBox = document.getElementById('pi-tie-result');
        const old = btn.innerHTML; btn.disabled = true; btn.textContent = '挖掘中…';
        resBox.innerHTML = '<div class="loading">Agent 正在挖掘跨表见地…</div>';
        try {
            const res = await AgentProgress.run({ url: `/api/insights/${id}/ties`, data: { related: rel }, title: '跨表联动分析' });
            const drows = await API.get(`/api/insights/${id}`);
            if (res && res.ok) {
                resBox.innerHTML = this.joinsResultHtml(drows.joins || []);
                Toast.success(`联动完成，发现 ${(drows.joins || []).length} 条见地`);
            } else {
                resBox.innerHTML = `<div class="empty-state">${Utils.esc((res && (res.message || res.error)) || '分析失败')}</div>`;
            }
        } catch (e) {
            resBox.innerHTML = `<div class="empty-state">分析失败：${Utils.esc(e.message)}</div>`;
        } finally {
            btn.disabled = false; btn.innerHTML = old;
        }
    },

    joinsResultHtml(joins) {
        if (!joins || !joins.length) return '<div class="empty-state">未发现可联动见地，换些关联表试试。</div>';
        return joins.map(j => `
            <div style="border:1px solid var(--border-card);border-radius:8px;padding:9px 12px;margin-bottom:6px;">
                <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;">
                    ${j.level === '重点' ? '<span class="badge badge-warning">重点</span>' : '<span class="badge badge-info">一般</span>'}
                    ${Utils.esc(j.table)}
                    <span style="font-size:11px;color:var(--text-muted);">${Utils.esc(j.relation || '')}</span>
                </div>
                <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${Utils.esc(j.insight || '')}</div>
            </div>`).join('');
    },

    async del(id) {
        if (!confirm('删除这条洞察？')) return;
        const res = await API.del(`/api/insights/${id}`);
        if (res && res.success) { Toast.success('已删除'); this._resetCache(); this.loadList(); this.loadOverview(); }
        else Toast.error('删除失败');
    }
};
</script>

<!-- /static/js/pages/page_handbook.js -->
<script>
// ============ 知识中心（page18）：统一入口，聚合 常用速查 / 查询手册 / 知识库 / 数据洞察 ============
const PageHandbook = {
    initialized: false,
    books: [],
    cur: { file: '', sheet: '' },
    curTab: 'common',

    async init() {
        const box = document.getElementById('page18');
        if (!box) return;
        if (!this.initialized) {
            box.innerHTML = this._layout();
            this.initialized = true;
            this.bind();
        }
        // 每次进入重刷当前 tab（同步文档新增）
        if (this.curTab === 'common') await this.loadCommon();
        else if (this.curTab === 'docs') await this.loadBooks();
        else if (this.curTab === 'qa' || this.curTab === 'analysis') await this.loadKb(this.curTab);
        else if (this.curTab === 'insights') await this.loadInsights();
    },

    _layout() {
        return `
        <div class="dash-hero">
            <div style="width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--brand-soft, rgba(37,99,235,.12));color:var(--accent);">📚</div>
            <div style="flex:1;min-width:180px;">
                <div class="hero-title">知识中心</div>
                <div class="hero-sub">统一入口：常用速查 → 查询手册 → Q&A/数智分析知识库 → 数据洞察<span style="margin-left:8px;font-size:11px;opacity:.85;">（数智分析查数按：工具箱 → 常用表/常用知识 → 数据洞察 → 全表）</span></div>
            </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 12px;">
            <button class="btn btn-sm kh-tab kh-common" onclick="PageHandbook.switchTab('common')">⭐ 常用速查</button>
            <button class="btn btn-sm btn-secondary kh-tab kh-docs" onclick="PageHandbook.switchTab('docs')">📖 查询手册(references)</button>
            <button class="btn btn-sm btn-secondary kh-tab kh-qa" onclick="PageHandbook.switchTab('qa')">💬 Q&A 知识库</button>
            <button class="btn btn-sm btn-secondary kh-tab kh-analysis" onclick="PageHandbook.switchTab('analysis')">🧠 数智分析知识库</button>
            <button class="btn btn-sm btn-secondary kh-tab kh-insights" onclick="PageHandbook.switchTab('insights')">🗃️ 数据洞察</button>
        </div>
        <div id="khBody"><div class="loading" style="padding:16px;"></div></div>`;
    },

    bind() {
        document.querySelectorAll('.kh-tab').forEach(b => b.style.cursor = 'pointer');
    },

    // 切换 Tab：高亮 + 渲染对应视图
    async switchTab(tab) {
        this.curTab = tab;
        document.querySelectorAll('.kh-tab').forEach(b => {
            const on = b.classList.contains('kh-' + tab);
            b.className = 'btn btn-sm kh-tab kh-' + tab + (on ? '' : ' btn-secondary');
        });
        const body = document.getElementById('khBody');
        body.innerHTML = '<div class="loading" style="padding:16px;"></div>';
        if (tab === 'common') await this.loadCommon();
        else if (tab === 'docs') await this.renderDocs();
        else if (tab === 'qa' || tab === 'analysis') await this.renderKb(tab);
        else if (tab === 'insights') await this.renderInsights();
    },

    // ---------- 常用速查：常用表.md + 常用知识.md（已 sync 进分析知识库） ----------
    async loadCommon() {
        const body = document.getElementById('khBody');
        if (!body) return;
        let common = [];
        try {
            const d = await API.get('/api/knowledge?scope=analysis&search=常用表', { timeout: 15000 });
            common = (d && Array.isArray(d) ? d : []);
        } catch (e) { /* 离线容错 */ }
        const tbl = common.filter(x => x.source_file === 'docs/常用表.md');
        const kb = common.filter(x => x.source_file === 'docs/常用知识.md');
        const renderItems = (list) => list.map(it =>
            `<div style="padding:10px 4px;border-bottom:1px dashed var(--border-row);font-size:13px;">
                <div style="font-weight:700;margin-bottom:4px;">${Utils.esc(it.title || '')}</div>
                <div style="font-size:12.5px;color:var(--text-secondary);white-space:pre-wrap;max-height:320px;overflow:auto;">${Utils.esc((it.content || '').slice(0, 1600))}</div>
            </div>`).join('') || '<p class="empty-state">暂无内容（文档可在 <span class="mono">docs/常用表.md</span> 与 <span class="mono">docs/常用知识.md</span> 维护）</p>';

        body.innerHTML = `
            <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="card">
                    <div class="dash-sec-title"><h3>🗂️ 常用表 <span class="mono" style="font-size:11px;">docs/常用表.md</span></h3>
                        <button class="btn btn-sm btn-secondary" onclick="App.navigate('page9')">在数智分析里问</button></div>
                    ${renderItems(tbl)}
                </div>
                <div class="card">
                    <div class="dash-sec-title"><h3>🧠 常用知识/口径 <span class="mono" style="font-size:11px;">docs/常用知识.md</span></h3>
                        <button class="btn btn-sm btn-secondary" onclick="App.navigate('page9')">在数智分析里问</button></div>
                    ${renderItems(kb)}
                </div>
            </div>`;
    },

    // ---------- 查询手册 references：列表 + 内容 ----------
    async renderDocs() {
        const body = document.getElementById('khBody');
        body.innerHTML = `
            <div class="grid" style="display:grid;grid-template-columns:300px 1fr;gap:16px;">
                <div class="card" style="align-self:start;">
                    <div class="dash-sec-title"><h3>手册列表</h3></div>
                    <div id="phBooks" style="padding:10px 14px;"><div class="loading"></div></div>
                </div>
                <div class="card">
                    <div id="phHeader" style="padding:12px 16px;border-bottom:1px solid var(--border-row);">
                        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                            <strong id="phTitle">请选择左侧手册</strong>
                            <select id="phSheet" style="font-size:12px;padding:4px 8px;border:1px solid var(--border-row);border-radius:6px;background:var(--panel);color:var(--ink);"></select>
                            <input id="phSearch" type="text" placeholder="搜索关键词..." onkeydown="if(event.key==='Enter')PageHandbook.search()"
                                style="flex:1;min-width:160px;font-size:12.5px;padding:7px 10px;border:1px solid var(--border-row);border-radius:6px;background:var(--panel);color:var(--ink);"/>
                            <button class="btn btn-primary btn-sm" onclick="PageHandbook.search()">搜 索</button>
                        </div>
                    </div>
                    <div id="phBody" style="padding:0 16px;"><p class="empty-state" style="padding:30px;">...</p></div>
                </div>
            </div>`;
        await this.loadBooks();
    },

    async loadBooks() {
        const box = document.getElementById('phBooks');
        if (!box) return;
        const d = await API.get('/api/handbook/list', { timeout: 15000 });
        this.books = (d && d.success && d.handbooks) || [];
        box.innerHTML = this.books.length ? this.books.map(b => `
            <div style="padding:8px 4px;border-bottom:1px solid var(--border-row);cursor:pointer;border-radius:6px;"
                 onmouseover="this.style.background='var(--panel-2)'" onmouseout="this.style.background=''"
                 onclick="PageHandbook.open('${Utils.esc(b.file)}')">
                <div style="font-weight:700;font-size:13px;">${Utils.esc(b.file.replace(/\.xlsx$/, ''))}</div>
                <div style="font-size:11px;color:var(--text-muted);">${(b.sheets || []).length} 个 sheet</div>
            </div>`).join('')
            : '<p class="empty-state">暂无手册</p>';
    },

    async open(file) {
        this.cur = { file, sheet: '' };
        const bk = this.books.find(b => b.file === file);
        const sheets = (bk && bk.sheets) || [];
        const sheetSel = document.getElementById('phSheet');
        const title = document.getElementById('phTitle');
        if (title) title.textContent = file.replace(/\.xlsx$/, '');
        if (sheetSel) {
            sheetSel.innerHTML = sheets.length
                ? sheets.map((s, i) => `<option value="${Utils.esc(s.name)}">${Utils.esc(s.name)}${i === 0 ? '（默认）' : ''}</option>`).join('')
                : '<option value="">--</option>';
            sheetSel.value = sheets.length ? sheets[0].name : '';
            sheetSel.onchange = () => this.search();
        }
        this.cur.sheet = (sheets.length ? sheets[0].name : '');
        this.search();
    },

    sheet() {
        const sel = document.getElementById('phSheet');
        this.cur.sheet = sel ? sel.value : '';
        return this.cur.sheet;
    },

    async search() {
        const q = (document.getElementById('phSearch') || { value: '' }).value || '';
        const body = document.getElementById('phBody');
        if (!this.cur.file || !body) return;
        body.innerHTML = '<div class="loading"></div>';
        const url = `/api/handbook/view?file=${encodeURIComponent(this.cur.file)}`
            + `&sheet=${encodeURIComponent(this.sheet())}`
            + (q ? `&q=${encodeURIComponent(q)}` : '')
            + '&limit=300';
        const d = await API.get(url, { timeout: 20000 });
        if (!d || !d.success) { body.innerHTML = `<p class="empty-state">${Utils.esc((d && d.error) || '加载失败')}</p>`; return; }
        const headers = d.headers || [];
        const rows = d.rows || [];
        if (!rows.length) { body.innerHTML = '<p class="empty-state">无匹配数据</p>'; return; }
        const cell = v => `<td style="font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border-row);vertical-align:top;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:normal;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;" title="${Utils.esc(v)}">${Utils.esc(v)}</td>`;
        body.innerHTML = `
            <div style="font-size:12px;color:var(--text-muted);padding:8px 0;">匹配 ${rows.length} 行${q ? '，关键词「' + Utils.esc(q) + '」' : ''}</div>
            <div style="overflow:auto;max-height:70vh;">
            <table class="dash-table" style="width:100%;">
                <thead><tr>${headers.map(h => `<th style="font-size:12px;white-space:nowrap;position:sticky;top:0;background:var(--panel);">${Utils.esc(h)}</th>`).join('')}</tr></thead>
                <tbody>${rows.map(r => `<tr>${headers.map((_, i) => cell(r[i] || '')).join('')}</tr>`).join('')}</tbody>
            </table>
            </div>`;
    },

    // ---------- 知识库（QA / 数智分析）条目列表 ----------
    async renderKb(scope) {
        const body = document.getElementById('khBody');
        body.innerHTML = `
            <div class="card">
                <div class="dash-sec-title">
                    <h3>${scope === 'qa' ? '💬 Q&A 知识库' : '🧠 数智分析知识库'} <span style="font-size:11px;color:var(--text-muted);font-weight:400;">${scope === 'qa' ? '业务规范 / 流程 / 标准问答' : '数据口径 / 表结构 / 常用查询 / 表迁移'}</span></h3>
                    <div style="display:flex;gap:8px;">
                        <input id="khSearch" type="text" placeholder="搜索..." value="${Utils.esc(this._kbQ || '')}"
                            onkeydown="if(event.key==='Enter')PageHandbook.loadKb('${scope}')"
                            style="flex:1;min-width:180px;font-size:12.5px;padding:7px 10px;border:1px solid var(--border-row);border-radius:6px;background:var(--panel);color:var(--ink);"/>
                        <button class="btn btn-primary btn-sm" onclick="PageHandbook.loadKb('${scope}')">搜 索</button>
                    </div>
                </div>
                <div id="khKbList" style="margin-top:10px;"><div class="loading" style="padding:14px;"></div></div>
            </div>`;
        await this.loadKb(scope);
    },

    async loadKb(scope) {
        this.curTab = scope;
        const q = (document.getElementById('khSearch') || { value: '' }).value || '';
        this._kbQ = q;
        const list = document.getElementById('khKbList');
        if (!list) return;
        list.innerHTML = '<div class="loading" style="padding:14px;"></div>';
        let items = [];
        try {
            const d = await API.get(`/api/knowledge?scope=${scope}&search=${encodeURIComponent(q)}`, { timeout: 20000 });
            items = (d && Array.isArray(d) ? d : []);
        } catch (e) { /* 容错 */ }
        if (!items.length) { list.innerHTML = '<p class="empty-state">暂无内容</p>'; return; }
        const fmt = v => v ? String(v).replace(/\s+/g, ' ') : '';
        list.innerHTML = `<div style="max-height:68vh;overflow:auto;">
            <table class="dash-table" style="width:100%;font-size:12.5px;">
                <thead><tr><th style="width:34%;">标题</th><th>内容摘要</th><th style="width:120px;">关键词</th></tr></thead>
                <tbody>${items.map(it => `<tr>
                    <td style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;" title="${Utils.esc(it.title || '')}">${Utils.esc(it.title || '')}</td>
                    <td style="color:var(--text-secondary);white-space:pre-wrap;">${Utils.esc(fmt(it.content).slice(0, 240))}${fmt(it.content).length > 240 ? '…' : ''}</td>
                    <td style="font-size:11px;color:var(--text-muted);">${Utils.esc(fmt(it.keywords).slice(0, 60))}</td>
                </tr>`).join('')}</tbody>
            </table></div>`;
    },

    // ---------- 数据洞察：已沉淀结论概览 ----------
    async renderInsights() {
        const body = document.getElementById('khBody');
        body.innerHTML = `
            <div class="card">
                <div class="dash-sec-title">
                    <h3>🗃️ 数据洞察 <span style="font-size:11px;color:var(--text-muted);font-weight:400;">Agent 学习表结构沉淀的知识，可被数智分析检索（search_insight）</span></h3>
                    <button class="btn btn-secondary btn-sm" onclick="App.navigate('page14')">进入数据洞察管理 →</button>
                </div>
                <div id="khInsights" style="margin-top:10px;"><div class="loading" style="padding:14px;"></div></div>
            </div>`;
        try {
            const d = await API.get('/api/insights', { timeout: 20000 });
            const items = (d && d.items) || [];
            const list = document.getElementById('khInsights');
            const done = items.filter(it => it.status === 'done');
            if (!list) return;
            if (!items.length) { list.innerHTML = '<p class="empty-state">尚未学习任何表，进入数据洞察页可学习</p>'; return; }
            list.innerHTML = `
                <div style="font-size:12px;color:var(--text-muted);padding:6px 0;">共 ${items.length} 条，已完成 ${done.length}</div>
                <div style="max-height:60vh;overflow:auto;">
                <table class="dash-table" style="width:100%;font-size:12.5px;">
                    <thead><tr><th>表</th><th>标题</th><th>状态</th><th>时间</th></tr></thead>
                    <tbody>${items.map(it => `<tr>
                        <td style="font-family:monospace;font-size:12px;">${Utils.esc(it.table_name || '')}</td>
                        <td>${Utils.esc(it.title || '')}</td>
                        <td>${it.status === 'done' ? '<span style="color:var(--success);">✓ 已学习</span>' : Utils.esc(it.status || '')}</td>
                        <td style="color:var(--text-muted);">${Utils.esc(it.created_at || '')}</td>
                    </tr>`).join('')}</tbody>
                </table></div>`;
        } catch (e) {
            const list = document.getElementById('khInsights');
            if (list) list.innerHTML = `<p class="empty-state">暂无权限或加载失败（数据洞察仅对授权用户开放）</p>`;
        }
    },
};
window.PageHandbook = PageHandbook;
</script>

<script>
/**
 * 页面15 - ADG 系统导航
 * 展示 ADG 现有系统清单：系统名称 / 地址(可跳转) / 用途 / 部署状态 / 权限管控 / 负责人
 * page15.view 权限可在前端增删改（todo：系统导航前端可编辑，2026-09-23）
 */
const PageAdg = {
    initialized: false,
    _data: [],
    _STATUSES: ['待部署', '已部署内测中', '已上线', '使用中'],

    init() {
        const container = document.getElementById('page15');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.load();
    },

    _canEdit() { return App.hasPerm && App.hasPerm('adg.edit'); },

    renderLayout() {
        return `
        <div style="background:linear-gradient(120deg,var(--accent-dark),var(--accent));border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div>
                <div style="font-size:17px;font-weight:800;opacity:.95;">🗂 ADG 现有系统导航</div>
                <div style="font-size:12px;opacity:.8;margin-top:4px;">各组在用系统一览 · 点击可直接跳转 · 数据源自《ADG现有系统信息收集》${this._canEdit() ? ' · 可维护' : ''}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <div class="form-group" style="margin:0;">
                    <input type="text" id="adgSearch" placeholder="搜索系统 / 负责人 / 用途" style="border:none;border-radius:8px;padding:8px 12px;width:220px;background:rgba(255,255,255,.9);color:#333;">
                </div>
                ${this._canEdit() ? '<button class="btn btn-sm" style="background:#fff;color:var(--accent);font-weight:700;" onclick="PageAdg.openForm()">+ 新增系统</button>' : ''}
            </div>
        </div>
        <div id="adgStats" style="margin-bottom:16px;"></div>
        <div id="adgList"></div>`;
    },

    bindEvents() {
        document.getElementById('adgSearch').oninput = (e) => {
            clearTimeout(this._t);
            this._t = setTimeout(() => this.render(), 250);
        };
    },

    _tile(icon, label, value, color, bg) {
        return `<div class="card stat-card" style="padding:14px 16px;position:relative;">
            <div style="position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:${bg};color:${color};">${icon}</div>
            <div class="stat-label">${label}</div><div class="stat-value" style="margin-top:6px;color:${color};">${value}</div>
        </div>`;
    },

    async load() {
        const d = await API.get('/api/adg/systems');
        this._data = d || [];
        this.render();
    },

    render() {
        const data = this._data;
        const kw = (document.getElementById('adgSearch')?.value || '').trim().toLowerCase();
        // 统计
        const byStatus = s => data.filter(x => this._stGroup(x.status) === s).length;
        document.getElementById('adgStats').innerHTML = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
            ${this._tile('🗂', '系统总数', data.length, 'var(--accent)', 'rgba(100,210,255,.12)')}
            ${this._tile('✅', '已上线/在用', byStatus('已上线') + byStatus('已部署') + byStatus('使用中'), 'var(--success)', 'rgba(37,211,102,.12)')}
            ${this._tile('⏳', '待部署', byStatus('待部署'), 'var(--warning)', 'rgba(255,169,77,.12)')}
            ${this._tile('👤', '负责人', new Set(data.map(x => x.owner).filter(Boolean)).size, 'var(--text-secondary)', 'rgba(150,200,255,.10)')}
        </div>`;

        // 过滤
        const filtered = data.filter(x =>
            !kw || [x.name, x.owner, x.purpose, x.status].some(v => String(v || '').toLowerCase().includes(kw)));
        if (!filtered.length) {
            document.getElementById('adgList').innerHTML = `<div class="empty-state">${data.length ? '无匹配系统' : '暂无系统数据'}</div>`;
            return;
        }
        // 分组：已部署/使用中 → 待部署
        const groups = [
            ['已上线', ['已上线', '已部署', '已部署内测中', '使用中', '已部署使用中']],
            ['待部署', ['待部署']],
        ];
        const boxes = [];
        for (const [gName, gStatuses] of groups) {
            const items = filtered.filter(x => gStatuses.includes(this._stGroup(x.status)));
            if (!items.length) continue;
            boxes.push(`<div style="margin-bottom:20px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                    <span style="font-weight:800;font-size:14px;color:var(--accent-light);">${gName}</span>
                    <span class="badge badge-info" style="font-size:11px;">${items.length} 个系统</span>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;">
                    ${items.map(x => this._card(x)).join('')}
                </div>
            </div>`);
        }
        document.getElementById('adgList').innerHTML = boxes.join('');
    },

    _stGroup(status) {
        const s = String(status || '');
        if (s.includes('已上线')) return '已上线';
        if (s.includes('使用中')) return '使用中';
        if (s.includes('待部署')) return '待部署';
        if (s.includes('已部署') || s.includes('内测')) return '已部署';
        return '未分类';
    },

    _statusBadge(status) {
        const g = this._stGroup(status);
        const map = { '已部署': 'badge-success', '使用中': 'badge-success', '待部署': 'badge-warning' };
        return `<span class="badge ${map[g] || 'badge-secondary'}" style="font-size:10px;">${Utils.esc(status || '未分类')}</span>`;
    },

    _accessBadge(acc) {
        if (acc === '有') return '<span class="badge badge-info">需申请权限</span>';
        if (acc === '无') return '<span class="badge badge-secondary">免申请</span>';
        return `<span class="badge badge-warning">${Utils.esc(acc || '')}</span>`;
    },

    _card(x) {
        const url = x.url || '';
        const canVisit = url && /^(https?:)?\/\//i.test(url);
        const canEdit = this._canEdit();
        return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="width:34px;height:34px;border-radius:9px;background:rgba(100,210,255,.12);color:var(--accent);display:grid;place-items:center;font-size:16px;flex:none;">&#128451;</span>
                <strong style="flex:1;font-size:14px;color:var(--text-primary);">${Utils.esc(x.name)}</strong>
                ${canEdit ? `<span style="display:flex;gap:4px;flex:none;">
                    <button class="btn btn-sm btn-secondary" data-perm="adg.edit" onclick="PageAdg.openForm(${x.id})" title="编辑该系统">编辑</button>
                    <button class="btn btn-sm btn-danger" data-perm="adg.edit" onclick="PageAdg.delSystem(${x.id})" title="删除该系统">删除</button>
                </span>` : ''}
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">${this._statusBadge(x.status)} ${this._accessBadge(x.access)}</div>
            <div style="font-size:12.5px;color:var(--text-secondary);line-height:1.6;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${Utils.esc(x.purpose || '—')}</div>
            <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;">
                <span>&#9998;</span>${Utils.esc(x.owner || '—')}
            </div>
            ${canVisit
                ? `<a href="${Utils.esc(url)}" target="_blank" rel="noopener noreferrer" style="text-align:center;display:block;padding:8px;border-radius:8px;border:1px solid var(--border-strong);color:var(--accent);font-weight:700;font-size:12px;text-decoration:none;transition:background .15s;" onmouseover="this.style.background='rgba(100,210,255,.08)'" onmouseout="this.style.background=''">打开系统 ↗</a>`
                : '<div style="text-align:center;padding:8px;border-radius:8px;background:var(--bg-input);color:var(--text-muted);font-size:12px;">暂无入口</div>'}
        </div>`;
    },

    // ============ 前端维护（page15.view 权限，2026-09-23） ============
    openForm(id) {
        const x = id ? this._data.find(s => s.id === id) : null;
        const stOpts = this._STATUSES.map(s =>
            `<option value="${s}" ${(x && x.status === s) ? 'selected' : ''}>${s}</option>`).join('');
        const acc = (x && x.access) || '无';
        Modal.open(`<div style="min-width:560px;max-width:94vw;">
            <h3>${id ? '编辑系统 #' + id : '新增系统'}</h3>
            <div class="form-group"><label>系统名称 *</label><input id="af-name" value="${Utils.esc(x ? x.name : '')}" placeholder="如：大数据自定义查询平台"></div>
            <div class="form-row">
                <div class="form-group"><label>地址 URL</label><input id="af-url" value="${Utils.esc(x ? x.url : '')}" placeholder="https://…（留空则卡片显示暂无入口）"></div>
                <div class="form-group"><label>负责人</label><input id="af-owner" value="${Utils.esc(x ? x.owner : '')}" placeholder="如：吴胜平"></div>
            </div>
            <div class="form-group"><label>用途</label><textarea id="af-purpose" rows="2" style="width:100%;resize:vertical;font-family:inherit;">${Utils.esc(x ? x.purpose : '')}</textarea></div>
            <div class="form-row">
                <div class="form-group"><label>部署状态</label><select id="af-status">${stOpts}</select></div>
                <div class="form-group"><label>权限管控</label><select id="af-access">
                    <option value="无" ${acc === '无' ? 'selected' : ''}>无（免申请）</option>
                    <option value="有" ${acc === '有' ? 'selected' : ''}>有（需申请权限）</option>
                </select></div>
                <div class="form-group"><label>排序号</label><input type="number" id="af-sort" value="${x ? (x.sort_order || 0) : (this._data.length + 1)}"></div>
            </div>
            <div style="text-align:right;margin-top:12px;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="PageAdg.saveForm(${id || 'null'})">保存</button>
            </div>
        </div>`);
    },

    async saveForm(id) {
        const payload = {
            name: (document.getElementById('af-name').value || '').trim(),
            url: (document.getElementById('af-url').value || '').trim(),
            purpose: (document.getElementById('af-purpose').value || '').trim(),
            status: document.getElementById('af-status').value,
            access: document.getElementById('af-access').value,
            owner: (document.getElementById('af-owner').value || '').trim(),
            sort_order: parseInt(document.getElementById('af-sort').value) || 0,
        };
        if (!payload.name) { Toast.error('系统名称必填'); return; }
        const res = id
            ? await API.put(`/api/adg/systems/${id}`, payload)
            : await API.post('/api/adg/systems', payload);
        if (res && (res.success || res.id)) {
            Toast.success(id ? '已更新' : '已新增');
            Modal.close();
            this.load();
        } else {
            Toast.error((res && res.error) || '保存失败');
        }
    },

    async delSystem(id) {
        const x = this._data.find(s => s.id === id);
        if (!confirm(`删除系统「${x ? x.name : '#' + id}」？删除后不可恢复。`)) return;
        const res = await API.del(`/api/adg/systems/${id}`);
        if (res && res.success) {
            Toast.success('已删除');
            this.load();
        } else {
            Toast.error((res && res.error) || '删除失败');
        }
    },
};
</script>

<script>
    // 初始化
    App.init();
</script>
</body>
</html>
