        const rowHtml = (w) => {
            const logic = w.logic_text || '';
            const logicDisplay = logic ? Utils.esc(logic) : '<span style="color:var(--text-muted);">待补充</span>';
            const hasRule = w.has_not_outgoing_rule;
            const ruleBadge = hasRule
                ? '<span class="badge badge-success" title="有不外发配置">不外发</span>'
                : '<span style="color:var(--text-muted);font-size:11px;">-</span>';
            const measures = w.handling_measures
                ? `<span style="font-size:12px;color:var(--text-secondary);" title="${Utils.esc(w.abnormal_values||'')}">${Utils.esc(w.handling_measures)}</span>`
                : '<span style="color:var(--text-muted);font-size:11px;">-</span>';
            return `<tr>
                <td>${Utils.esc(w.oem)}</td>
                <td>${Utils.esc(w.cell_cap)}</td>
                <td>${Utils.esc(w.fault_type)}</td>
                <td>${logicDisplay}</td>
                <td><strong style="color:var(--warning);">${w.outgoing_count.toLocaleString()}</strong></td>
                <td style="text-align:center;">${ruleBadge}</td>
                <td style="max-width:180px;">${measures}</td>
                <td><button class="btn btn-sm btn-secondary p1-logic-edit" data-cap="${Utils.esc(w.cell_cap)}" data-fault="${Utils.esc(w.fault_type)}" data-logic="${Utils.esc(logic)}">编辑逻辑</button></td>
            </tr>`;
        };
        const trs = visibleRows.map(rowHtml).join('');
        const moreBtn = rows.length > FM_DEFAULT
            ? `<div style="text-align:center;padding:8px 0 4px;"><button class="btn btn-sm btn-secondary" id="p1FmToggle" onclick="Page1.toggleFmExpand()">${showAll ? '收起 ▲' : '展开查看全部 ' + rows.length + ' 条 ▼'}</button></div>`
            : '';
        return `<div class="card" style="margin-top:20px;">
            <div class="dash-sec-title">
                <span class="sec-ic" style="background:rgba(255,169,77,.14);color:var(--warning);">⚠️</span>
                <h3>客户重点失效模式</h3>
                <span class="sub">历史外发聚合 · 关联不外发规则</span>
                <div style="margin-left:auto;display:flex;gap:8px;">
                    <button class="btn btn-sm btn-secondary">导出</button>
                    <button class="btn btn-sm btn-primary" onclick="Page1.aiAnalyzeWarnings()" style="background:linear-gradient(135deg,var(--accent-dark),var(--accent));">⚡ AI 分析</button>
                </div>
            </div>
            <div class="table-wrapper"><table class="dash-table">
                <thead><tr><th>客户</th><th>电芯容量</th><th>预警模式</th><th>预警逻辑</th><th class="num">外发数量</th><th>不外发</th><th>处理措施</th><th data-no-sort>操作</th></tr></thead>
                <tbody>${trs}</tbody>
            </table></div>
            ${moreBtn}
        </div>`;
    },

    // 切换失效模式展开/收起
    toggleFmExpand() {
        this._fmExpandAll = !this._fmExpandAll;
        this.loadDashboard(true);   // 重取数据并重渲染
    },

    editWarningLogic(cellCap, faultType, currentLogic) {
        // 首页「编辑逻辑」→ 打开预警逻辑编辑弹窗（委托给真实实现）
        this.editWarningLogicReal(cellCap, faultType, currentLogic || '');
    },

    async aiAnalyzeWarnings() {
        const oem = document.getElementById('p1Customer').value;
        if (!oem) { Toast.error('请先选择客户'); return; }
        const res = await AgentProgress.run({ url: '/api/warnings/ai-analyze', data: { oem }, title: 'AI 预警分析' });
        if (res && res.success && res.analysis) {
            Modal.open(`<h3>⚡ ${oem} 预警智能分析</h3>
                <div style="line-height:1.8;font-size:14px;color:var(--text-primary);white-space:pre-wrap;padding:12px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border-card);">${Utils.esc(res.analysis)}</div>
                <div style="text-align:right;margin-top:12px;"><button class="btn btn-secondary" onclick="Modal.close()">关闭</button></div>`);
        } else {
            Toast.error((res && res.message) || '分析失败');
        }
    },

    editWarningLogicReal(cellCap, faultType, currentLogic) {
        const html = `
            <h3>编辑预警逻辑</h3>
            <div class="form-group"><label>电芯容量</label><input type="text" value="${Utils.esc(cellCap)}" readonly></div>
            <div class="form-group"><label>预警模式</label><input type="text" value="${Utils.esc(faultType)}" readonly></div>
            <div class="form-group"><label>预警逻辑</label><textarea id="mlLogic" rows="4" placeholder="填写该失效模式的预警判定逻辑/阈值说明">${Utils.esc(currentLogic)}</textarea></div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="mlSave">保存</button>
            </div>`;
        Modal.open(html);
        document.getElementById('mlSave').onclick = async () => {
            const res = await API.post('/api/warning_logic', {
                oem: this.currentOem,
                cell_cap: cellCap,
                fault_type: faultType,
                logic_text: document.getElementById('mlLogic').value
            });
            if (res && res.success) {
                Toast.show('保存成功', 'success');
                Modal.close();
                this.loadDashboard(true);   // 本地数据已变更 → 绕过缓存刷新当日看板
            } else {
                Toast.error('保存失败');
            }
        };
    },

    // ========== 编辑质保信息 ==========
    async editWarrantySettings(ds) {
        const oem = this.currentOem;
        const cap = ds.cap, vm = ds.vm || '';
        let wid = ds.wid ? parseInt(ds.wid) : null;
        let py = ds.py !== '' ? parseInt(ds.py) : null;
        let pm = ds.pm !== '' ? parseInt(ds.pm) : null;
        let ps = ds.ps !== '' ? parseInt(ds.ps) : null;
        let cy = ds.cy !== '' ? parseInt(ds.cy) : null;
        let cm = ds.cm !== '' ? parseInt(ds.cm) : null;
        let cs = ds.cs !== '' ? parseInt(ds.cs) : null;

        // 若本地无记录，先从 Doris 初始化
        if (!wid) {
            Toast.show('正在从 Doris 初始化质保信息...', 'info');
            const initRes = await API.post(`/api/warranty_settings/init?oem=${encodeURIComponent(oem)}&cell_cap=${encodeURIComponent(cap)}`);
            if (initRes && initRes.added > 0) {
                // 取回刚写入的记录
                const wsRows = await API.get(`/api/warranty_settings?oem=${encodeURIComponent(oem)}&cell_cap=${encodeURIComponent(cap)}`);
                const matched = (wsRows || []).find(r => (r.vehicle_model || '') === vm);
                if (matched) {
                    wid = matched.id;
                    py = matched.passenger_years; pm = matched.passenger_mileage; ps = matched.passenger_soh;
                    cy = matched.commercial_years; cm = matched.commercial_mileage; cs = matched.commercial_soh;
                }
            }
        }

        const html = `
            <h3>编辑质保信息</h3>
            <div class="form-group"><label>电芯容量</label><input type="text" value="${Utils.esc(cap)}" readonly></div>
            <div class="form-group"><label>车型</label><input type="text" value="${Utils.esc(vm) || '通用'}" readonly></div>
            <table style="width:100%;border-collapse:collapse;margin-bottom:12px;">
                <thead><tr>
                    <th style="text-align:left;padding:6px 8px;font-size:12px;color:var(--text-muted);">规格</th>
                    <th style="text-align:left;padding:6px 8px;font-size:12px;color:var(--text-muted);">质保年限（年）</th>
                    <th style="text-align:left;padding:6px 8px;font-size:12px;color:var(--text-muted);">质保里程（km）</th>
                    <th style="text-align:left;padding:6px 8px;font-size:12px;color:var(--text-muted);">质保容量（%）</th>
                </tr></thead>
                <tbody>
                    <tr>
                        <td style="padding:6px 8px;color:var(--accent);">乘用车</td>
                        <td style="padding:4px 8px;"><input type="number" id="wPY" value="${py ?? ''}" min="1" max="20" style="width:80px;"></td>
                        <td style="padding:4px 8px;"><input type="number" id="wPM" value="${pm ?? ''}" min="1" style="width:100px;"></td>
                        <td style="padding:4px 8px;"><input type="number" id="wPS" value="${ps ?? ''}" min="1" max="100" style="width:80px;"></td>
                    </tr>
                    <tr>
                        <td style="padding:6px 8px;color:var(--text-secondary);">运营车</td>
                        <td style="padding:4px 8px;"><input type="number" id="wCY" value="${cy ?? ''}" min="1" max="20" style="width:80px;"></td>
                        <td style="padding:4px 8px;"><input type="number" id="wCM" value="${cm ?? ''}" min="1" style="width:100px;"></td>
                        <td style="padding:4px 8px;"><input type="number" id="wCS" value="${cs ?? ''}" min="1" max="100" style="width:80px;"></td>
                    </tr>
                </tbody>
            </table>
            <p style="font-size:11px;color:var(--text-muted);">注：保存后更新展示数据，过保车辆数由定时任务根据新质保参数重新推演。</p>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="wSave">保存</button>
            </div>`;
        Modal.open(html);

        document.getElementById('wSave').onclick = async () => {
            if (!wid) {
                Toast.error('质保记录不存在，请先确认该项目有 Doris 质保数据');
                return;
            }
            const data = {
                passenger_years:    parseInt(document.getElementById('wPY').value) || null,
                passenger_mileage:  parseInt(document.getElementById('wPM').value) || null,
                passenger_soh:      parseInt(document.getElementById('wPS').value) || null,
                commercial_years:   parseInt(document.getElementById('wCY').value) || null,
                commercial_mileage: parseInt(document.getElementById('wCM').value) || null,
                commercial_soh:     parseInt(document.getElementById('wCS').value) || null,
            };
            const res = await API.put(`/api/warranty_settings/${wid}`, data);
            if (res && res.success) {
                Toast.show('保存成功', 'success');
                Modal.close();
                this.loadDashboard(true);   // 本地数据已变更 → 绕过缓存刷新当日看板
            } else {
                Toast.error('保存失败');
            }
        };
    },

    // ========== 初始化质保数据（从 Excel 导入）==========
    async importWarrantyExcel() {
        const existing = await API.get('/api/warranty_settings?oem=&cell_cap=');
        const hasExcel = (existing || []).some(r => r.source === 'excel');
        if (hasExcel) {
            if (!confirm(`已有质保数据（Excel 导入），是否强制重新导入覆盖？`)) return;
        }
        Toast.show('正在从 Excel 导入质保数据，请稍候（需查询 Doris，约需 30-60 秒）...', 'info');
        const url = '/api/warranty_settings/parse-excel' + (hasExcel ? '?force=1' : '');
        const res = await API.post(url, {});
        if (res && !res.error) {
            const msg = `导入完成：写入 ${res.imported} 条，Doris 匹配 ${res.pn_matched_doris} 个PN，无匹配 ${res.pn_no_doris} 个PN`;
            Toast.show(msg, 'success');
            this.loadDashboard(true);   // 本地数据已变更 → 绕过缓存刷新当日看板
        } else {
            Toast.error('导入失败: ' + (res && res.error ? res.error : '未知错误'));
        }
    },

    // ========== 新增弹窗 ==========
    showAddVisitModal() {
        const oem = this.currentOem;
        const html = `
            <h3>新增拜访计划</h3>
            <div class="form-group"><label>拜访日期</label><input type="date" id="mvDate"></div>
            <div class="form-group"><label>主题</label><input type="text" id="mvSubject" placeholder="拜访主题"></div>
            <div class="form-group"><label>对接人员</label><input type="text" id="mvContact" placeholder="对接人员"></div>
            <div class="form-group"><label>联系电话</label><input type="text" id="mvPhone" placeholder="联系电话"></div>
            <div class="form-group"><label>拜访内容</label><textarea id="mvContent" rows="3" placeholder="拜访内容"></textarea></div>
            <div class="form-group"><label>完成状态</label>
                <select id="mvStatus"><option value="0">计划中</option><option value="1">已完成</option></select>
            </div>
            <div class="form-group"><label>拜访总结（已完成时填写）</label><textarea id="mvSummary" rows="2"></textarea></div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="mvSave">保存</button>
            </div>`;
        Modal.open(html);
        document.getElementById('mvSave').onclick = async () => {
            const res = await API.post('/api/visit_plans', {
                oem: oem,
                visit_date: document.getElementById('mvDate').value,
                subject: document.getElementById('mvSubject').value,
                contact_person: document.getElementById('mvContact').value,
                contact_phone: document.getElementById('mvPhone').value,
                visit_content: document.getElementById('mvContent').value,
                is_completed: parseInt(document.getElementById('mvStatus').value),
                summary: document.getElementById('mvSummary').value
            });
            if (res && res.id) { Toast.show('新增成功', 'success'); Modal.close(); this.loadDashboard(true); }
            else Toast.error('新增失败');
        };
    },

    showAddPersonModal() {
        const oem = this.currentOem;
        const html = `
            <h3>新增关键人物</h3>
            <div class="form-group"><label>类型</label>
                <select id="mpType"><option value="external">外部客户关键人</option><option value="internal">内部PQM负责人</option></select>
            </div>
            <div class="form-group"><label>姓名</label><input type="text" id="mpName" placeholder="姓名"></div>
            <div class="form-group"><label>部门</label><input type="text" id="mpDept" placeholder="部门"></div>
            <div class="form-group"><label>职位</label><input type="text" id="mpPos" placeholder="职位"></div>
            <div class="form-group"><label>风格</label><input type="text" id="mpStyle" placeholder="沟通风格"></div>
            <div class="form-group"><label>电话</label><input type="text" id="mpPhone" placeholder="电话"></div>
            <div class="form-group"><label>邮箱</label><input type="text" id="mpEmail" placeholder="邮箱"></div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="mpSave">保存</button>
            </div>`;
        Modal.open(html);
        document.getElementById('mpSave').onclick = async () => {
            const res = await API.post('/api/key_persons', {
                oem: oem,
                type: document.getElementById('mpType').value,
                name: document.getElementById('mpName').value,
                department: document.getElementById('mpDept').value,
                position: document.getElementById('mpPos').value,
                style: document.getElementById('mpStyle').value,
                phone: document.getElementById('mpPhone').value,
                email: document.getElementById('mpEmail').value
            });
            if (res && res.id) { Toast.show('新增成功', 'success'); Modal.close(); this.loadDashboard(true); }
            else Toast.error('新增失败');
        };
    },

    showAddMeetingModal() {
        const oem = this.currentOem;
        const html = `
            <h3>新增会议记录</h3>
            <div class="form-group"><label>会议标题</label><input type="text" id="mmTitle" placeholder="会议标题"></div>
            <div class="form-group"><label>会议日期</label><input type="date" id="mmDate"></div>
            <div class="form-group"><label>会议目的</label><input type="text" id="mmPurpose" placeholder="会议目的"></div>
            <div class="form-group"><label>外部参与人员</label><input type="text" id="mmExt" placeholder="外部参与人员"></div>
            <div class="form-group"><label>内部参与人员</label><input type="text" id="mmInt" placeholder="内部参与人员"></div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="mmSave">保存</button>
            </div>`;
        Modal.open(html);
        document.getElementById('mmSave').onclick = async () => {
            const res = await API.post('/api/meetings', {
                oem: oem,
                title: document.getElementById('mmTitle').value,
                meeting_date: document.getElementById('mmDate').value,
                purpose: document.getElementById('mmPurpose').value,
                participants_external: document.getElementById('mmExt').value,
                participants_internal: document.getElementById('mmInt').value
            });
            if (res && res.id) { Toast.show('新增成功', 'success'); Modal.close(); this.loadDashboard(true); }
            else Toast.error('新增失败');

    }
};

</script>

<!-- /static/js/pages/page_tools.js -->
<script>
// ============ 工具箱（可配置工具库）============
// 运营常用查询工具：按分类分组渲染（同分类合并一个卡片，tab 切换）→ 填参数执行 → 结果表。
// 参数类型：text / number / select / oem（客户下拉）/ cell_cap（按 OEM 联动的容量下拉）。
// 管理员可新增/编辑/删除工具定义（{name, description, params, sql_template, result_columns}）。
const PageTools = {
    initialized: false,
    tools: [],
    isAdmin: false,

    async init() {
        const box = document.getElementById('page19');
        if (!box) return;
        if (!this.initialized) {
            box.innerHTML = this._layout();
            this.initialized = true;
        }
        this.isAdmin = App.hasPerm('tool.manage');
        await this.load();
    },

    _layout() {
        return `
        <div class="dash-hero">
            <div style="width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--brand-soft, rgba(37,99,235,.12));color:var(--accent);">🧰</div>
            <div style="flex:1;min-width:180px;">
                <div class="hero-title">工具箱</div>
                <div class="hero-sub">运营常用查询工具 · 直查不绕弯 ·<span style="margin-left:6px;">管理员可维护工具定义（查看 / 改 SQL / 新增）</span></div>
            </div>
            <div style="display:flex;gap:8px;">
                ${this.isAdmin ? '<button class="btn btn-primary btn-sm" onclick="PageTools.openEdit(null)">+ 新增工具</button>' : ''}
            </div>
        </div>
        <div id="ptGrid" style="margin-top:16px;"><div class="loading" style="padding:20px;"></div></div>`;
    },

    // ---- 参数控件渲染（支持 text/number/select/oem/cell_cap）----
    _paramInput(t, p, i) {
        const def = p.default || '';
        const wrap = (inner) => `<div class="form-group" style="flex:1;min-width:150px;"><label>${Utils.esc(p.label || p.name)}${p.required ? ' *' : ''}</label>${inner}</div>`;
        if (p.type === 'oem') {
            const opts = (App.customers || []).map(c =>
                `<option value="${Utils.esc(c.oem)}" ${def === c.oem ? 'selected' : ''}>${Utils.esc(c.oem_ch || c.name_cn || c.oem)} (${Utils.esc(c.oem)})</option>`).join('');
            return wrap(`<select data-tp="${i}" data-ttype="oem" style="width:100%;" onchange="PageTools._onOemChange(${t.id})"><option value="">请选择客户</option>${opts}</select>`);
        }
        if (p.type === 'cell_cap') {
            return wrap(`<select data-tp="${i}" data-ttype="cell_cap" id="ptCap_${t.id}" style="width:100%;" disabled><option value="">全部容量（先选客户）</option></select>`);
        }
        if (p.type === 'select') {
            const opts = (p.options || []).map(o => `<option value="${Utils.esc(o)}" ${def === o ? 'selected' : ''}>${Utils.esc(o)}</option>`).join('');
            return wrap(`<select data-tp="${i}" style="width:100%;">${opts}</select>`);
        }
        if (p.type === 'number') {
            return wrap(`<input type="number" data-tp="${i}" value="${Utils.esc(def)}" placeholder="${Utils.esc(p.placeholder || '')}" style="width:100%;">`);
        }
        return wrap(`<input type="text" data-tp="${i}" value="${Utils.esc(def)}" placeholder="${Utils.esc(p.placeholder || '')}" style="width:100%;">`);
    },

    // OEM 切换 → 联动刷新同卡片内的容量下拉
    async _onOemChange(toolId) {
        const t = this.tools.find(x => x.id === toolId);
        if (!t) return;
        const pane = document.getElementById(`ptPane_${toolId}`);
        const capSel = document.getElementById(`ptCap_${toolId}`);
        if (!pane || !capSel) return;
        let oem = '';
        (t.params || []).forEach((p, i) => {
            if (p.type === 'oem') {
                const el = pane.querySelector(`[data-tp="${i}"]`);
                if (el) oem = el.value;
            }
        });
        capSel.disabled = true;
        capSel.innerHTML = '<option value="">加载中...</option>';
        if (!oem) {
            capSel.innerHTML = '<option value="">全部容量（先选客户）</option>';
            return;
        }
        const d = await API.get(`/api/customers/cell_caps?oem=${encodeURIComponent(oem)}`);
        const caps = (d && d.caps) || (Array.isArray(d) ? d : []);
        capSel.innerHTML = '<option value="">全部容量</option>' +
            caps.map(c => `<option value="${Utils.esc(c)}">${Utils.esc(c)} Ah</option>`).join('');
        capSel.disabled = false;
    },

    // ---- 分组卡片：同 category 的工具合并一个卡片，tab 切换 ----
    _groupCard(category, tools) {
        const tabs = tools.map((t, idx) =>
            `<button class="btn btn-sm ${idx === 0 ? 'btn-primary' : 'btn-secondary'}" id="ptTab_${t.id}" onclick="PageTools._switchTab('${category.replace(/'/g, "\\'")}', ${t.id})" style="margin-right:6px;">${Utils.esc(t.name)}</button>`).join('');
        const bodies = tools.map((t, idx) => {
            const paramInputs = (t.params || []).map((p, i) => this._paramInput(t, p, i)).join('');
            return `<div id="ptPane_${t.id}" style="display:${idx === 0 ? '' : 'none'};">
                <div style="padding:4px 0 0;font-size:12.5px;color:var(--text-secondary);">${Utils.esc(t.description || '')}</div>
                <div style="display:flex;gap:12px;flex-wrap:wrap;padding:12px 0 0;">${paramInputs || '<span style="color:var(--text-muted);font-size:12px;">（无参数，直接执行）</span>'}</div>
                <div style="text-align:right;padding-top:8px;">
                    <button class="btn btn-sm btn-primary" onclick="PageTools.run(${t.id})" id="ptRun_${t.id}">执 行</button>
                </div>
                <div id="ptRes_${t.id}" style="padding:8px 0 14px;"></div>
            </div>`;
        }).join('');
        const editBtns = this.isAdmin
            ? tools.map(t => `<button class="btn btn-sm btn-secondary" onclick="PageTools.openEdit(${t.id})">✏ ${Utils.esc(t.name)}</button>`).join(' ')
            : '';
        return `<div class="card" style="margin-bottom:16px;">
            <div class="dash-sec-title">
                <span class="sec-ic" style="background:rgba(16,185,129,.14);color:var(--success);">🛠️</span>
                <h3>${Utils.esc(category || '通用工具')}</h3>
                <span class="sub">${tools.length > 1 ? tools.length + ' 个工具' : ''}</span>
                <div style="margin-left:auto;display:flex;gap:6px;">${editBtns}</div>
            </div>
            ${tools.length > 1 ? `<div style="padding:10px 17px 0;border-bottom:1px solid var(--border-row);">${tabs}</div>` : ''}
            <div style="padding:8px 17px 8px;">${bodies}</div>
        </div>`;
    },

    _switchTab(category, toolId) {
        // 同组所有 pane 隐藏，显示选中；tab 高亮切换
        const group = this.tools.filter(t => (t.category || '通用工具') === category);
        group.forEach(t => {
            const pane = document.getElementById(`ptPane_${t.id}`);
            const tab = document.getElementById(`ptTab_${t.id}`);
            if (pane) pane.style.display = (t.id === toolId) ? '' : 'none';
            if (tab) tab.className = 'btn btn-sm ' + (t.id === toolId ? 'btn-primary' : 'btn-secondary');
        });
    },

    async load() {
        const grid = document.getElementById('ptGrid');
        if (!grid) return;
        grid.innerHTML = '<div class="loading" style="padding:20px;"></div>';
        const d = await API.get('/api/tools');
        this.tools = (d && d.success && d.items) || [];
        if (!this.tools.length) {
            grid.innerHTML = '<p class="empty-state" style="padding:30px;">暂无工具。管理员可点击右上角「+ 新增工具」创建。</p>';
            return;
        }
        // 按 category 分组（保持 sort_order 顺序）
        const groups = [];
        const seen = {};
        this.tools.forEach(t => {
            const cat = t.category || '通用工具';
            if (!seen[cat]) { seen[cat] = []; groups.push(cat); }
            seen[cat].push(t);
        });
        grid.innerHTML = groups.map(cat => this._groupCard(cat, seen[cat])).join('');
    },

    async run(id) {
        const btn = document.getElementById('ptRun_' + id);
        const res = document.getElementById('ptRes_' + id);
        if (!res) return;
        const t = this.tools.find(x => x.id === id);
        if (!t) return;
        // 读参数 + 必填校验
        const params = {};
        const paramsDef = t.params || [];
        let missing = [];
        paramsDef.forEach((p, i) => {
            const input = document.querySelector(`#ptPane_${id} [data-tp="${i}"]`);
            if (input) {
                params[p.name] = input.value;
                if (p.required && !String(input.value).trim()) missing.push(p.label || p.name);
            }
        });
        if (missing.length) {
            res.innerHTML = `<p class="empty-state" style="padding:8px 0;color:var(--danger);">请填写必填参数：${missing.map(Utils.esc).join('、')}</p>`;
            return;
        }
        btn.disabled = true; btn.textContent = '查询中...';
        res.innerHTML = '<div class="loading" style="padding:10px;"></div>';
        const r = await API.post(`/api/tools/${id}/run`, { params });
        btn.disabled = false; btn.textContent = '执 行';
        if (!r || !r.success) {
            res.innerHTML = `<p class="empty-state" style="padding:8px 0;">${Utils.esc((r && r.error) || '执行失败')}</p>`;
            return;
        }
        const cols = r.columns || [];
        const rows = r.rows || [];
        if (!rows.length) {
            res.innerHTML = '<p class="empty-state" style="padding:8px 0;">未查询到结果（请检查参数是否正确，如客户/容量/编号）</p>';
            return;
        }
        // 注意：两行截断的 -webkit-box hack 不能直接放 td 上（会顶掉 table-cell 布局，
        // 所有单元格竖排堆成一列——todo#2 bug），必须套在内层 div 里。
        const cell = v => `<td style="font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border-row);max-width:240px;" title="${Utils.esc(v == null ? '' : v)}"><div style="overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;">${Utils.esc(v == null ? '-' : String(v))}</div></td>`;
        res.innerHTML = `<div style="overflow:auto;max-height:60vh;"><table class="dash-table pt-restable" style="width:100%;">
            <thead><tr>${cols.map(c => `<th style="font-size:12px;white-space:nowrap;">${Utils.esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${rows.map(row => `<tr>${row.map(cell).join('')}</tr>`).join('')}</tbody>
        </table><div style="font-size:11px;color:var(--text-muted);padding:6px 2px;">共 ${rows.length} 行 · 点击表头可排序</div></div>`;
        const tableEl = res.querySelector('table.pt-restable');
        if (tableEl && window.Utils && Utils.enableTableSort) Utils.enableTableSort(tableEl);
    },

    // ============ 管理员维护 ============
    openEdit(id) {
        const t = id ? this.tools.find(x => x.id === id) : { name: '', description: '', params: [], sql_template: '', result_columns: [], category: '' };
        const paramRows = (t.params || []).map((p, i) => this._paramRow(p)).join('') || '';
        const body = `
        <div style="min-width:560px;max-width:94vw;">
            <h3>${id ? '维护工具：' + Utils.esc(t.name) : '新增工具'}</h3>
            <div class="form-group"><label>工具名 *</label><input id="tl-name" value="${Utils.esc(t.name)}" placeholder="如 单车过保查询"></div>
            <div class="form-group"><label>说明</label><textarea id="tl-desc" rows="2">${Utils.esc(t.description)}</textarea></div>
            <div class="form-group"><label>分类（同分类的工具会合并为一个卡片）</label><input id="tl-cat" value="${Utils.esc(t.category)}" placeholder="如 单车查询"></div>
            <div class="form-group"><label>参数定义（SQL 中用 {{参数名}} 占位）</label>
                <div id="tl-params">${paramRows}</div>
                <button class="btn btn-sm btn-secondary" onclick="PageTools._addParamRow()">+ 参数</button>
            </div>
            <div class="form-group"><label>执行 SQL（只读 Doris；{{参数名}} 占位）</label><textarea id="tl-sql" rows="6" style="font-family:monospace;font-size:12px;">${Utils.esc(t.sql_template)}</textarea></div>
            <div class="form-group"><label>结果列（英文逗号分隔，空则用查询返回列名）</label><input id="tl-cols" value="${Utils.esc((t.result_columns || []).join(','))}" placeholder="如 deviceid,cell_cap,current_status"></div>
            <div style="text-align:right;"><button class="btn btn-secondary" onclick="Modal.close()">取消</button> <button class="btn btn-primary" onclick="PageTools.saveTool(${id || 'null'})">保存</button></div>
        </div>`;
        Modal.open(body);
    },

    _paramRow(p) {
        p = p || {};
        const typeOpts = [['text', '文本'], ['number', '数字'], ['select', '下拉'], ['oem', '客户OEM下拉'], ['cell_cap', '容量联动下拉']]
            .map(([v, l]) => `<option value="${v}" ${p.type === v ? 'selected' : ''}>${l}</option>`).join('');
        return `
            <div class="tool-param-row" style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
                <input type="text" data-pk="name" value="${Utils.esc(p.name || '')}" placeholder="参数名(如 deviceid)" style="flex:1;min-width:110px;">
                <input type="text" data-pk="label" value="${Utils.esc(p.label || '')}" placeholder="标签" style="flex:1;min-width:90px;">
                <select data-pk="type" style="flex:0 0 120px;">${typeOpts}</select>
                <label style="flex:0 0 auto;display:flex;align-items:center;font-size:11px;"><input type="checkbox" data-pk="required" ${p.required ? 'checked' : ''}>必填</label>
                <button class="btn btn-sm btn-secondary" onclick="this.closest('.tool-param-row').remove()">✕</button>
            </div>`;
    },

    _addParamRow() {
        const box = document.getElementById('tl-params');
        if (box) box.insertAdjacentHTML('beforeend', this._paramRow({}));
    },

    async saveTool(id) {
        const name = document.getElementById('tl-name').value.trim();
        if (!name) { Toast.error('工具名不能为空'); return; }
        // 收集参数
        const params = [];
        document.querySelectorAll('#tl-params .tool-param-row').forEach(r => {
            const g = k => { const el = r.querySelector(`[data-pk="${k}"]`); return el ? el.value : ''; };
            const req = r.querySelector('[data-pk="required"]');
            const nm = g('name');
            if (nm) params.push({ name: nm, label: g('label') || nm, type: g('type') || 'text', required: req ? req.checked : false });
        });
        const cols = document.getElementById('tl-cols').value.split(',').map(s => s.trim()).filter(Boolean);
        const payload = {
            name,
            description: document.getElementById('tl-desc').value.trim(),
            category: document.getElementById('tl-cat').value.trim(),
            params,
            sql_template: document.getElementById('tl-sql').value,
            result_columns: cols,
            enabled: true,
        };
        const res = id
            ? await API.put(`/api/tools/manage/${id}`, payload)
            : await API.post('/api/tools/manage', payload);
        if (res && (res.success || res.id)) {
            Toast.success(id ? '工具已更新' : '工具已创建');
            Modal.close();
            this.load();
        } else { Toast.error((res && res.error) || '保存失败'); }
    },
};
window.PageTools = PageTools;

</script>

<script>
// ============ 我的待办（独立 tab）============
// 侧边栏「我的待办」：当前登录账号的会议任务 / 认领的预警 / 部门需求，完整列表 + 分类筛选。
const PageTodo = {
    initialized: false,

    async init() {
        const box = document.getElementById('page17');
        if (!box) return;
        if (!this.initialized) {
            box.innerHTML = this._layout();
            this.initialized = true;
        }
        await this.load();
    },

    _layout() {
        return `
        <div class="dash-hero">
            <div style="width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--brand-soft, rgba(37,99,235,.12));color:var(--accent);">🗂️</div>
            <div style="flex:1;min-width:180px;">
                <div class="hero-title">我的待办</div>
                <div class="hero-sub">会议任务 · 认领的预警 · 部门需求 一屏看清</div>
            </div>
            <div class="hero-badge" id="ptWho">待办加载中...</div>
        </div>
        <div class="card" style="margin-top:16px;">
            <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-row);flex-wrap:wrap;">
                <strong style="font-size:14px;">我的待办清单</strong>
                <div id="ptStat" style="display:flex;gap:6px;font-size:12px;"></div>
                <div style="margin-left:auto;display:flex;gap:6px;" id="ptFilter"></div>
            </div>
            <div id="ptList" style="padding:6px 16px;"><div class="loading" style="padding:20px;"></div></div>
        </div>`;
    },

    _badge(txt, color) {
        return `<span class="badge" style="background:${color};color:#0b1322;">${txt}</span>`;
    },

    _status(it) {
        if (it.kind === 'warning') {
            if (it.status === '未闭环') return this._badge('未闭环', 'var(--danger)');
            return this._badge('处理中', 'var(--warn, #fbbf24)');
        }
        if (it.kind === 'pool') {
            if (it.status === '待审批') return this._badge('待审批', 'var(--accent)');
            if (it.status === '已通过') return this._badge('已通过', 'var(--info)');
            return this._badge(it.status || '任务', 'var(--muted, #8496b6)');
        }
        if (it.status === '已逾期') return this._badge('已逾期', 'var(--danger)');
        if (it.status === '进行中') return this._badge('进行中', 'var(--info)');
        return this._badge(it.status || '待处理', 'var(--warn, #fbbf24)');
    },

    _icon(it) {
        return it.kind === 'meeting_task' ? '📌' : (it.kind === 'warning' ? '⚠️' : '📥');
    },

    _kindLabel(it) {
        return it.kind === 'meeting_task' ? '会议任务'
            : (it.kind === 'warning' ? '认领预警' : '需求');
    },

    _go(it) {
        const page = it.kind === 'warning' ? 'page4'
            : (it.kind === 'pool' ? 'page16' : 'page3');
        return `<a style="font-size:12px;color:var(--accent);cursor:pointer;white-space:nowrap;" onclick="App.navigate('${page}')">前往处置 →</a>`;
    },

    // 会议任务状态下拉（负责人本人可直接改状态，后端权限分层放行）
    _taskSelect(it) {
        if (it.kind !== 'meeting_task' || !it.id) return `<span style="flex:none;">${this._status(it)}</span>`;
        const opts = ['待处理', '进行中', '已完成'].map(s =>
            `<option value="${s}" ${it.status === s ? 'selected' : ''}>${s}</option>`).join('');
        return `<select style="flex:none;font-size:12px;padding:2px 6px;border:1px solid var(--border-row);border-radius:6px;background:var(--bg-card);color:var(--text-primary);"
                onchange="PageTodo.setTaskStatus(${it.id}, this.value)">${opts}</select>`;
    },

    async setTaskStatus(id, status) {
        const res = await API.put(`/api/tasks/${id}`, { status, actual_date: '' });
        if (res && res.success) {
            Toast.success(status === '已完成' ? '已标记完成' : `状态已改为「${status}」`);
            this.load();
        } else Toast.error((res && (res.message || res.error)) || '修改失败');
    },

    _row(it) {
        return `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-row);flex-wrap:wrap;">
            <span style="flex:none;width:22px;text-align:center;">${this._icon(it)}</span>
            <span style="flex:1;min-width:180px;font-size:13px;">
                ${Utils.esc(it.title)}
                ${it.meta ? `<span style="color:var(--text-muted);font-size:12px;"> · ${Utils.esc(it.meta)}</span>` : ''}
                ${it.kind === 'meeting_task' && it.status === '已完成' && it.actual_date
                    ? `<span style="color:var(--text-muted);font-size:11px;"> · 完成于 ${Utils.formatDate(it.actual_date)}</span>` : ''}
            </span>
            ${this._taskSelect(it)}
            <span style="flex:none;font-size:11px;color:var(--text-muted);">${this._kindLabel(it)}</span>
            <span style="flex:none;">${this._go(it)}</span>
        </div>`;
    },

    async load() {
        const listEl = document.getElementById('ptList');
        const statEl = document.getElementById('ptStat');
        const whoEl = document.getElementById('ptWho');
        const filterEl = document.getElementById('ptFilter');
        if (!listEl) return;
        listEl.innerHTML = '<div class="loading" style="padding:20px;"></div>';
        const d = await API.get('/api/workbench/my_todos', { timeout: 25000 });
        const ok = d && d.success;
        if (!ok) {
            listEl.innerHTML = `<p class="empty-state">待办加载失败：${Utils.esc((d && d.error) || '未知错误')}</p>`;
            return;
        }
        const items = d.items || [];
        const who = (d.name || d.username || '');
        if (whoEl) whoEl.innerHTML = `当前账号：${Utils.esc(who)}`;
        if (statEl) statEl.innerHTML = `
            ${this._badge('已完成 ' + (d.done || 0), 'var(--success)')}
            ${this._badge('待办 ' + (d.todo || 0), 'var(--warn, #fbbf24)')}
            <span style="font-size:12px;color:var(--text-muted);">共 ${d.total || 0} 项</span>`;

        const DONE_SET = ['已完成', '已闭环', '已通过'];
        const isDone = it => DONE_SET.includes(it.status);
        const kinds = [
            { key: 'all', label: '待办', fn: it => !isDone(it) },
            { key: 'done', label: '✅ 已完成', fn: isDone },
            { key: 'warning', label: '⚠️ 认领预警', fn: it => it.kind === 'warning' },
            { key: 'pool', label: '📥 部门需求', fn: it => it.kind === 'pool' },
            { key: 'meeting_task', label: '📌 会议任务', fn: it => it.kind === 'meeting_task' },
        ];
        this._filter = this._filter || 'all';
        if (filterEl) {
            filterEl.innerHTML = kinds.map(k =>
                `<button class="btn btn-sm ${this._filter === k.key ? 'btn-primary' : 'btn-secondary'}" data-k="${k.key}" onclick="PageTodo.setFilter('${k.key}')">${k.label}</button>`).join('');
        }
        const shown = items.filter(it => (kinds.find(k => k.key === this._filter) || kinds[0]).fn(it));
        if (!shown.length) {
            listEl.innerHTML = `<p class="empty-state" style="padding:20px;">🎉 该分类暂无待办${this._filter !== 'all' ? '，可切换其它分类' : '，都清完了'}</p>`;
            return;
        }
        listEl.innerHTML = shown.map(it => this._row(it)).join('');
    },

    setFilter(k) {
        this._filter = k;
        // 更新按钮高亮并刷新
        document.querySelectorAll('#ptFilter .btn').forEach(b => {
            const on = b.dataset.k === k;
            b.classList.toggle('btn-primary', on);
            b.classList.toggle('btn-secondary', !on);
        });
        this.load();
    },
};
window.PageTodo = PageTodo;
</script>

<script>
/**
 * 首页可配置模块（需求4）：用户可添加/修改/删除，选择展示形式（柱状/折线/饼图/表格/数字）
 * 纯 SVG 渲染，无外部依赖（适配内网无 CDN 环境）。
 */
const DashboardModules = {
    async init(containerId) {
        this.container = document.getElementById(containerId);
        if (!this.container) return;
        await this.load();
    },

    async load() {
        const mods = await API.get('/api/dashboard/modules');
        if (!mods) return;
        this.mods = mods;
        this.container.innerHTML = this.render();
        this.bindManage();
    },

    render() {
        const items = (this.mods || []).map(m => `
            <div class="t3-card">
                <div class="chead"><div><div class="ctitle">${Utils.esc(m.title || '未命名模块')} <span class="badge badge-info" style="font-size:10px;">${this.typeLabel(m.display_type)}</span></div></div>
                    <div class="acts">
                        <button class="btn btn-sm btn-secondary dm-edit" data-id="${m.id}">编辑</button>
                        <button class="btn btn-sm btn-danger dm-del" data-id="${m.id}">删除</button>
                    </div></div>
                <div>${this.renderContent(m)}</div>
            </div>`).join('');
        return `
        <div class="t3-card">
            <div class="chead"><div><div class="ctitle" title="用自然语言让 AI 生成图表，或手动添加柱状 / 折线 / 饼图 / 表格 / 数字模块">🧩 自定义模块</div></div>
                <div class="acts">
                    <button class="btn btn-sm btn-secondary" id="dmAiAdd">&#9889; AI 生成</button>
                    <button class="btn btn-sm btn-primary" id="dmAdd">＋ 添加模块</button>
                </div></div>
            <div id="dmList">${items ? `<div class="dm-grid">${items}</div>` : '<div class="t3-empty">还没有自定义模块</div>'}</div>
        </div>`;
    },

    typeLabel(t) {
        const map = { bar: '柱状图', line: '折线图', pie: '饼图', table: '表格', number: '数字' };
        return map[t] || t;
    },

    // 安全截断标签（避免 slice 切坏多字节中文）
    shortLabel(s, n) {
        s = String(s == null ? '' : s);
        if ([...s].length <= n) return s;
        return [...s].slice(0, n).join('') + '…';
    },

    renderContent(m) {
        const data = m.data || [];
        switch (m.display_type) {
            case 'bar': return this.renderBar(data, m.title);
            case 'line': return this.renderLine(data, m.title);
            case 'pie': return this.renderPie(data, m.title);
            case 'table': return this.renderTable(data);
            case 'number': return this.renderNumber(data);
            default: return '<p class="empty-state">未知展示类型</p>';
        }
    },

    // ---- SVG 柱状图 ----
    renderBar(data, title) {
        const pairs = (data || []).filter(d => d && d.label != null && d.value != null);
        if (!pairs.length) return '<p class="empty-state">暂无数据</p>';
        const W = 560, H = 220, padL = 46, padB = 34, padT = 16;
        const iw = W - padL;
        const ih = H - padT - padB;
        const maxV = Math.max(...pairs.map(p => Number(p.value) || 0), 1);
        const bw = Math.min(50, iw / pairs.length * 0.6);
        const gap = iw / pairs.length;
        let bars = '';
        pairs.forEach((p, i) => {
            const h = (Number(p.value) || 0) / maxV * ih;
            const x = padL + i * gap + (gap - bw) / 2;
            const y = padT + ih - h;
            bars += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="var(--accent)" rx="3">
                <title>${Utils.esc(p.label)}: ${p.value}</title></rect>
                <text x="${x + bw / 2}" y="${H - padB + 16}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${Utils.esc(this.shortLabel(p.label, 6))}</text>`;
        });
        // 网格线
        let grid = '';
        for (let g = 1; g <= 4; g++) {
            const gy = padT + (ih / 5) * g;
            const val = Math.round(maxV / 5 * g);
            grid += `<line x1="${padL}" y1="${gy}" x2="${W}" y2="${gy}" stroke="var(--border-card)" stroke-width="1"/>
                <text x="${padL - 6}" y="${gy + 4}" text-anchor="end" font-size="10" fill="var(--text-muted)">${val}</text>`;
        }
        return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;">
            <line x1="${padL}" y1="${padT + ih}" x2="${W}" y2="${padT + ih}" stroke="var(--border-card)" stroke-width="1"/>${grid}${bars}</svg>`;
    },

    // ---- SVG 折线图 ----
    renderLine(data, title) {
        const pairs = (data || []).filter(d => d && d.label != null && d.value != null);
        if (!pairs.length) return '<p class="empty-state">暂无数据</p>';
        const W = 560, H = 220, padL = 46, padB = 34, padT = 16;
        const iw = W - padL, ih = H - padT - padB;
        const maxV = Math.max(...pairs.map(p => Number(p.value) || 0), 1);
        const gap = pairs.length > 1 ? iw / (pairs.length - 1) : 0;
        const pts = pairs.map((p, i) => {
            const x = padL + (pairs.length > 1 ? i * gap : iw / 2);
            const y = padT + ih - (Number(p.value) || 0) / maxV * ih;
            return { x, y, label: p.label, value: p.value };
        });
        const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="1.5">
            <title>${Utils.esc(p.label)}: ${p.value}</title></circle>
            <text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1) - 8}" text-anchor="middle" font-size="10" fill="var(--text-secondary)">${Utils.esc(this.shortLabel(p.label, 6))}</text>`).join('');
        let grid = '';
        for (let g = 1; g <= 4; g++) {
            const gy = padT + (ih / 5) * g;
            const val = Math.round(maxV / 5 * g);
            grid += `<line x1="${padL}" y1="${gy}" x2="${W}" y2="${gy}" stroke="var(--border-card)" stroke-width="1"/>
                <text x="${padL - 6}" y="${gy + 4}" text-anchor="end" font-size="10" fill="var(--text-muted)">${val}</text>`;
        }
        return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;">
            ${grid}
            <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
            ${dots}</svg>`;
    },

    // ---- SVG 饼图 ----
    renderPie(data, title) {
        const pairs = (data || []).filter(d => d && d.label != null && d.value != null);
        if (!pairs.length) return '<p class="empty-state">暂无数据</p>';
        const total = pairs.reduce((s, p) => s + (Number(p.value) || 0), 0) || 1;
        const R = 80, CX = 110, CY = 100;
        const colors = ['#4f8cff', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#38bdf8', '#fb7185', '#2dd4bf'];
        let arc = '';
        let angleStart = -Math.PI / 2;
        pairs.forEach((p, i) => {
            const frac = (Number(p.value) || 0) / total;
            const angleEnd = angleStart + frac * 2 * Math.PI;
            const largeArc = frac > 0.5 ? 1 : 0;
            const x1 = CX + R * Math.cos(angleStart), y1 = CY + R * Math.sin(angleStart);
            const x2 = CX + R * Math.cos(angleEnd), y2 = CY + R * Math.sin(angleEnd);
            arc += `<path d="M${CX},${CY} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${largeArc} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${colors[i % colors.length]}">
                <title>${Utils.esc(p.label)}: ${p.value} (${(frac * 100).toFixed(1)}%)</title></path>`;
            angleStart = angleEnd;
        });
        const legend = pairs.map((p, i) => `
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin-bottom:4px;">
                <span style="width:10px;height:10px;border-radius:2px;background:${colors[i % colors.length]};display:inline-block;"></span>
                ${Utils.esc(p.label)}: <strong>${p.value}</strong> (${((Number(p.value) || 0) / total * 100).toFixed(1)}%)
            </div>`).join('');
        return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
            <svg width="220" height="200" viewBox="0 0 220 200">${arc}
                <text x="${CX}" y="${CY}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text-primary)">${total}</text>
            </svg>
            <div>${legend}</div>
        </div>`;
    },

    // ---- 表格 ----
    renderTable(data) {
        const cols = (data && data.columns) || [];
        const rows = (data && data.rows) || data || [];
        // 若是 [{}] 数组，自动提取列
        let cols2 = cols;
        let rows2 = rows;
        if (!cols2.length && Array.isArray(rows) && rows.length && typeof rows[0] === 'object' && !Array.isArray(rows[0])) {
            cols2 = Object.keys(rows[0]);
            rows2 = rows.map(r => cols2.map(c => r[c]));
        }
        if (!rows2 || !rows2.length) return '<p class="empty-state">暂无数据</p>';
        const head = cols2.length ? `<thead><tr>${cols2.map(c => `<th>${Utils.esc(c)}</th>`).join('')}</tr></thead>` : '';
        const bodyRows = rows2.map(r => `<tr>${r.map(c => `<td>${Utils.esc(c)}</td>`).join('')}</tr>`).join('');
        return `<div class="table-wrapper"><table>${head}<tbody>${bodyRows}</tbody></table></div>`;
    },

    // ---- 数字卡片 ----
    renderNumber(data) {
        const arr = (data || []).filter(d => d && d.label != null && d.value != null);
        if (!arr.length) return '<p class="empty-state">暂无数据</p>';
        return `<div style="display:flex;gap:20px;flex-wrap:wrap;">
            ${arr.map(d => `<div style="flex:1;min-width:150px;text-align:center;padding:18px;border:1px solid var(--border-card);border-radius:10px;background:var(--bg-card);">
                <div style="font-size:30px;font-weight:700;color:var(--accent-light);">${Utils.esc(d.value)}</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">${Utils.esc(d.label)}</div>
            </div>`).join('')}</div>`;
    },

    // ---- 管理 ----
    bindManage() {
        const add = document.getElementById('dmAdd');
        if (add) add.onclick = () => this.openEdit(null);
        const aiAdd = document.getElementById('dmAiAdd');
        if (aiAdd) aiAdd.onclick = () => this.openAiGenerate();
        document.querySelectorAll('.dm-edit').forEach(b => b.onclick = () => this.openEdit(parseInt(b.dataset.id)));
        document.querySelectorAll('.dm-del').forEach(b => b.onclick = () => this.del(parseInt(b.dataset.id)));
    },

    // ---- AI 生成图表模块 ----
    openAiGenerate() {
        Modal.open(`
            <h3>&#9889; AI 生成图表模块</h3>
            <div class="form-group"><label>用自然语言描述想要的图表</label>
                <textarea id="aiDesc" rows="4" placeholder="例如：展示各电池容量档位的接入车辆数量柱状图"></textarea>
            </div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="aiGenBtn">&#9889; 生成</button>
            </div>
            <div id="aiPreview" style="margin-top:14px;"></div>`);
        document.getElementById('aiGenBtn').onclick = () => this.runAiGenerate();
    },

    async runAiGenerate() {
        const text = document.getElementById('aiDesc').value.trim();
        if (!text) { Toast.error('请描述想生成的图表'); return; }
        const btn = document.getElementById('aiGenBtn');
        btn.disabled = true; btn.textContent = '生成中...';
        try {
            const res = await AgentProgress.run({ url: '/api/dashboard/modules/ai-generate', data: { text }, title: 'AI 生成图表' });
            if (res && res.success && res.config) {
                // 语义引导：需要用户进一步确认
                if (res.config.needs_clarification) {
                    const extra = prompt(res.config.clarification || '请补充更多信息：', text);
                    if (extra && extra.trim()) {
                        document.getElementById('aiDesc').value = extra.trim();
                        this.runAiGenerate();  // 用补充信息重新生成
                    }
                    return;
                }
                this._pendingAi = res.config;
                this.renderAiPreview(res.config);
                const isReal = res.config.title && res.config.title.includes('真实数据');
                Toast.success(isReal ? '已生成（含真实数据），可编辑后保存' : '已生成，可编辑后保存');
            } else {
                Toast.error((res && res.message) || 'AI 生成失败');
            }
        } catch (e) { Toast.error('请求失败'); }
        finally { btn.disabled = false; btn.textContent = '&#9889; 生成'; }
    },

    renderAiPreview(cfg) {
        const dataStr = JSON.stringify(cfg.data, null, 2);
        document.getElementById('aiPreview').innerHTML = `
            <div class="card" style="margin-top:8px;background:var(--bg-card);">
                <div class="card-title" style="font-size:13px;">生成结果（可编辑后保存）</div>
                <div class="form-group"><label>模块标题</label><input type="text" id="aiTitle" value="${Utils.esc(cfg.title)}"></div>
                <div class="form-group"><label>展示形式</label>
                    <select id="aiType">
                        ${['bar', 'line', 'pie', 'number', 'table'].map(t => `<option value="${t}" ${cfg.display_type === t ? 'selected' : ''}>${this.typeLabel(t)}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group"><label>数据 JSON</label>
                    <textarea id="aiData" rows="7" style="font-family:monospace;font-size:12px;">${Utils.esc(dataStr)}</textarea>
                </div>
                <div style="text-align:right;">
                    <button class="btn btn-primary" id="aiSave" onclick="DashboardModules.saveAi()">保存模块</button>
                </div>
            </div>`;
    },

    async saveAi() {
        const title = document.getElementById('aiTitle').value.trim();
        if (!title) { Toast.error('模块标题不能为空'); return; }
        let data = [];
        try { data = JSON.parse(document.getElementById('aiData').value.trim() || '[]'); }
        catch (e) { Toast.error('数据 JSON 格式错误'); return; }
        if (!Array.isArray(data)) data = [data];
        const type = document.getElementById('aiType').value;
        const res = await API.post('/api/dashboard/modules', { title, display_type: type, data, sort_order: 0 });
        if (res && res.id) {
            Toast.success('模块已添加');
            Modal.close();
            this.load();
        } else { Toast.error('保存失败'); }
    },

    async openEdit(id) {
        const m = id ? (this.mods.find(x => x.id === id) || {}) : {};
        let data = (m.data && Array.isArray(m.data)) ? m.data : [];
        if (m.display_type && m.display_type !== 'table' && !data.length) {
            data = [{ label: '示例1', value: 10 }, { label: '示例2', value: 20 }];
        }
        if (m.display_type === 'table' && data.length && data[0] && typeof data[0] === 'object' && !('label' in data[0])) {
            // table 已是 [{"列":"值"}]，保持原样
        }
        const dataStr = data.length ? JSON.stringify(data, null, 2) : '[]';
        const isTable = (m.display_type || 'bar') === 'table';
        const rowsHtml = isTable ? '' : this.renderRowEditor(data);
        Modal.open(`
            <h3>${id ? '编辑模块' : '添加模块'}</h3>
            <div class="form-group"><label>模块标题</label><input type="text" id="dmTitle" value="${Utils.esc(m.title || '')}" placeholder="模块标题"></div>
            <div class="form-group"><label>展示形式</label>
                <select id="dmType" onchange="DashboardModules.toggleRowEditor(this)">
                    ${['bar', 'line', 'pie', 'number', 'table'].map(t => `<option value="${t}" ${(m.display_type || 'bar') === t ? 'selected' : ''}>${this.typeLabel(t)}</option>`).join('')}
                </select>
            </div>
            <div id="dmRowEditor">${rowsHtml}</div>
            <div class="form-group"><label>数据（JSON，可手动编辑）</label>
                <textarea id="dmData" rows="6" style="font-family:monospace;font-size:12px;">${Utils.esc(dataStr)}</textarea>
            </div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="dmSave">保存</button>
            </div>`);
        document.getElementById('dmSave').onclick = () => this.save(id);
    },

    // ---- 简易行编辑器（非 table 类型用）----
    _rowSeq: 0,
    renderRowEditor(data) {
        const rows = (data && Array.isArray(data)) ? data : [];
        const items = rows.map((d, i) => `
            <tr data-r="${++this._rowSeq}" style="border-bottom:1px solid var(--border-card);">
                <td style="padding:4px;"><input type="text" class="dm-rlabel" value="${Utils.esc(String(d.label != null ? d.label : ''))}" placeholder="名称" style="width:100%;"></td>
                <td style="padding:4px;"><input type="number" step="any" class="dm-rvalue" value="${d.value != null ? d.value : ''}" placeholder="数值" style="width:100%;"></td>
                <td style="padding:4px;text-align:center;"><button class="btn btn-danger btn-sm" onclick="DashboardModules.delRow(this)">删</button></td>
            </tr>`).join('');
        return `<div style="margin-bottom:8px;border:1px solid var(--border-card);border-radius:8px;padding:8px;">
            <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">快捷编辑（名称 / 数值）：</div>
            <table style="width:100%;border-collapse:collapse;"><tbody>
                ${items || '<tr><td colspan="3" style="text-align:center;color:var(--text-muted);font-size:12px;padding:8px;">暂无数据行，点「+ 添加一行」</td></tr>'}
            </tbody></table>
            <button class="btn btn-sm btn-secondary" id="dmAddRow" onclick="DashboardModules.addRow()">+ 添加一行</button>
        </div>`;
    },

    _collectRowData() {
        const editor = document.getElementById('dmRowEditor');
        if (!editor) return null;
        const rows = editor.querySelectorAll('tbody tr[data-r]');
        if (!rows.length) return [];
        const out = [];
        rows.forEach(r => {
            const label = r.querySelector('.dm-rlabel').value.trim();
            const val = r.querySelector('.dm-rvalue').value;
            out.push({ label, value: val === '' ? 0 : Number(val) });
        });
        return out;
    },

    addRow() {
        const tbody = document.querySelector('#dmRowEditor tbody');
        if (!tbody) return;
        tbody.insertAdjacentHTML('beforeend', `
            <tr data-r="${++this._rowSeq}"><td style="padding:4px;"><input class="dm-rlabel" placeholder="名称" style="width:100%;"></td>
            <td style="padding:4px;"><input class="dm-rvalue" type="number" step="any" placeholder="数值" style="width:100%;"></td>
            <td style="padding:4px;text-align:center;"><button class="btn btn-danger btn-sm" onclick="DashboardModules.delRow(this)">删</button></td></tr>`);
    },

    delRow(btn) {
        const tr = btn.closest('tr');
        if (tr) tr.remove();
        // 空行清除后显示提示
        const tbody = document.querySelector('#dmRowEditor tbody');
        if (tbody && !tbody.querySelectorAll('tr[data-r]').length) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--text-muted);font-size:12px;padding:8px;">暂无数据行，点「+ 添加一行」</td></tr>';
        }
    },

    toggleRowEditor(sel) {
        const type = sel.value;
        const editor = document.getElementById('dmRowEditor');
        if (!editor) return;
        if (type === 'table') {
            editor.innerHTML = '';
        } else {
            // 从当前 JSON 解析已有行，重建行编辑器
            let data = [];
            try { data = JSON.parse(document.getElementById('dmData').value.trim() || '[]'); }
            catch (e) { data = []; }
            if (!Array.isArray(data)) data = [data];
            editor.innerHTML = this.renderRowEditor(data);
            this.syncDataFromRows();
        }
    },

    syncDataFromRows() {
        const data = this._collectRowData();
        if (data !== null) {
            document.getElementById('dmData').value = JSON.stringify(data, null, 2);
        }
    },

    async save(id) {
        const title = document.getElementById('dmTitle').value.trim();
        if (!title) { Toast.error('模块标题不能为空'); return; }
        const type = document.getElementById('dmType').value;
        let data = [];
        if (type !== 'table') {
            const rows = this._collectRowData();
            if (rows !== null) {
                data = rows;
            } else {
                try { data = JSON.parse(document.getElementById('dmData').value.trim() || '[]'); }
                catch (e) { Toast.error('数据 JSON 格式错误，请检查'); return; }
            }
        } else {
            try { data = JSON.parse(document.getElementById('dmData').value.trim() || '[]'); }
            catch (e) { Toast.error('数据 JSON 格式错误，请检查'); return; }
        }
        if (!Array.isArray(data)) data = [data];
        const res = id
            ? await API.put(`/api/dashboard/modules/${id}`, { title, display_type: type, data, sort_order: 0 })
            : await API.post('/api/dashboard/modules', { title, display_type: type, data, sort_order: 0 });
        if (res) {
            Toast.success(id ? '模块已更新' : '模块已添加');
            Modal.close();
            this.load();
        }
    },

    async del(id) {
        if (!confirm('确定删除该模块？')) return;
        const res = await API.del(`/api/dashboard/modules/${id}`);
        if (res) { Toast.success('已删除'); this.load(); }
    }
};
</script>

<!-- /static/js/pages/page2.js -->
<script>
/**
 * 页面2 - 客户档案维护（客户标识=oem）
 * oem 由 Doris 播种，档案字段本地手动维护
 */
const Page2 = {
    initialized: false,

    // 生成可安全内嵌到 onclick JS 字符串参数的编码（URICode + 额外转义单引号，
    // 因为 encodeURIComponent 会保留 ' 不编码）。入口统一用 decodeURIComponent 还原。
    jsArg(s) {
        return encodeURIComponent(String(s == null ? '' : s)).replace(/'/g, '%27');
    },

    init() {
        const container = document.getElementById('page2');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.loadList();
    },

    renderLayout() {
        return `
        <div class="filter-bar">
            <div class="form-group">
                <label>客户名称/OEM</label>
                <input type="text" id="p2FilterName" placeholder="输入关键词...">
            </div>
            <div class="form-group">
                <label>等级</label>
                <select id="p2FilterLevel">
                    <option value="">全部</option>
                    <option value="重要">重要</option>
                    <option value="一般">一般</option>
                </select>
            </div>
            <button class="btn btn-primary" id="p2Search">查 询</button>
            <button class="btn btn-success" id="p2Add" data-perm="customer.edit">+ 新增客户</button>
        </div>
        <div id="p2List"></div>`;
    },

    bindEvents() {
        document.getElementById('p2Search').onclick = () => this.loadList();
        document.getElementById('p2Add').onclick = () => this.openForm();
    },

    async loadList() {
        const name = document.getElementById('p2FilterName').value;
        const level = document.getElementById('p2FilterLevel').value;
        let url = '/api/customers?';
        if (name) url += `name_cn=${encodeURIComponent(name)}&`;
        if (level) url += `level=${encodeURIComponent(level)}&`;

        const container = document.getElementById('p2List');
        container.innerHTML = '<div class="loading"></div>';
        const data = await API.get(url);
        if (!data || !data.length) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9783;</div><p>暂无客户数据</p></div>';
            return;
        }
        this._expandedOem = this._expandedOem || null;
        const rows = data.map(c => `
            <tr id="p2row-${this.jsArg(c.oem)}">
                <td><span class="badge badge-info">${Utils.esc(c.oem)}</span></td>
                <td class="cell-ellipsis" title="${Utils.esc(c.oem_ch || c.name_cn) || ''}">${Utils.esc(c.oem_ch || c.name_cn) || '-'}</td>
                <td>${Utils.levelBadge(c.level)}</td>
                <td>${Utils.esc(c.relationship_status) || '-'}</td>
                <td class="actions">
                    <button class="btn btn-secondary btn-sm" onclick="Page2.togglePersons('${this.jsArg(c.oem)}')" id="p2toggle-${this.jsArg(c.oem)}">&#9654; 关键人</button>
                    <button class="btn btn-secondary btn-sm" onclick="Page2.openDetail('${this.jsArg(c.oem)}')">详情</button>
                    <button class="btn btn-secondary btn-sm" onclick="Page2.openForm('${this.jsArg(c.oem)}')">编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="Page2.remove('${this.jsArg(c.oem)}')">删除</button>
                </td>
            </tr>
            <tr id="p2expand-${this.jsArg(c.oem)}" style="display:none;"><td colspan="5" style="padding:0;"></td></tr>`).join('');
        container.innerHTML = `<div class="card"><div class="table-wrapper"><table>
            <thead><tr><th>OEM</th><th>客户名称</th><th>等级</th><th>客户关系</th><th>操作</th></tr></thead>
            <tbody id="p2Tbody">${rows}</tbody>
        </table></div></div>`;
    },

    async togglePersons(rawOem) {
        const oem = decodeURIComponent(rawOem);
        const expandRow = document.getElementById(`p2expand-${this.jsArg(oem)}`);
        const toggleBtn = document.getElementById(`p2toggle-${this.jsArg(oem)}`);
        if (!expandRow) return;
        // 已展开 → 收起
        if (expandRow.style.display !== 'none') {
            expandRow.style.display = 'none';
            if (toggleBtn) toggleBtn.innerHTML = '&#9654; 关键人';
            this._expandedOem = null;
            return;
        }
        // 展开：先收起其他已展开行
        if (this._expandedOem && this._expandedOem !== oem) {
            const prev = document.getElementById(`p2expand-${this.jsArg(this._expandedOem)}`);
            const prevBtn = document.getElementById(`p2toggle-${this.jsArg(this._expandedOem)}`);
            if (prev) prev.style.display = 'none';
            if (prevBtn) prevBtn.innerHTML = '&#9654; 关键人';
        }
        this._expandedOem = oem;
        expandRow.style.display = '';
        if (toggleBtn) toggleBtn.innerHTML = '&#9660; 关键人';
        const td = expandRow.querySelector('td');
        td.innerHTML = '<div class="loading" style="padding:12px;"></div>';
        const c = await API.get(`/api/customers/${encodeURIComponent(oem)}`);
        if (!c || c.error) { td.innerHTML = '<div style="padding:12px;color:var(--danger);">加载失败</div>'; return; }

    async openForm(rawOem) {
        // onclick 里用 encodeURIComponent 传参，这里还原，避免特殊字符（如单引号）破坏 JS/HTML
        const oem = rawOem ? decodeURIComponent(rawOem) : '';
        let c = { oem: '', oem_ch: '', name_cn: '', name_en: '', address: '', location: '', kpi: '', decision_auth: '', level: '一般', cooperation_scope: '', relationship_status: '', market_quality: '', algorithm_capability: '' };

        if (isEdit) {
            const detail = await API.get(`/api/customers/${encodeURIComponent(oem)}`);

        }

            <div class="form-row">
                <div class="form-group"><label>OEM ${isEdit ? '' : '*'}</label>
                    <input type="text" id="mfOem" value="${Utils.esc(c.oem)}" ${isEdit ? 'readonly' : ''} placeholder="客户英文简称，如 fne"></div>
                <div class="form-group"><label>OEM中文</label><input type="text" id="mfOemCh" value="${Utils.esc(c.oem_ch)}" placeholder="如：广汽本田"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>中文名称</label><input type="text" id="mfNameCn" value="${Utils.esc(c.name_cn)}" placeholder="如：广汽本田汽车有限公司"></div>

            </div>

            <div class="form-row">

            <div class="form-row">
                <div class="form-group"><label>等级</label>

                <div class="form-group"><label>客户关系状态</label><input type="text" id="mfRelation" value="${Utils.esc(c.relationship_status)}" placeholder="如：战略合作"></div>
                <div class="form-group"><label>市场质量表现</label><input type="text" id="mfQuality" value="${Utils.esc(c.market_quality)}" placeholder="如：良好"></div>
            </div>
            <div class="form-group"><label>算法能力</label><input type="text" id="mfAlgo" value="${Utils.esc(c.algorithm_capability)}" placeholder="如：优秀"></div>
            ${isEdit ? `
            <hr style="border:0;border-top:1px solid var(--border-row);margin:16px 0;">
            <h3 style="font-size:14px;color:var(--accent-light);margin:0 0 6px;">关键人矩阵（可在编辑时直接维护）</h3>
            <div id="p2EditPersons">${this.renderPersonsTab(c)}</div>` : ''}
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="Page2.saveForm(${isEdit ? `'${this.jsArg(oem)}'` : 'null'})">保存</button>
            </div>
        `);

    async saveForm(rawOem) {
        const oem = rawOem ? decodeURIComponent(rawOem) : '';
        const data = {
            oem_ch: document.getElementById('mfOemCh').value.trim(),
            name_cn: document.getElementById('mfNameCn').value.trim(),
            name_en: document.getElementById('mfNameEn').value.trim(),
            address: document.getElementById('mfAddress').value.trim(),
            location: document.getElementById('mfLocation').value.trim(),
            kpi: document.getElementById('mfKpi').value.trim(),
            decision_auth: document.getElementById('mfDecision').value.trim(),
            level: document.getElementById('mfLevel').value,
            cooperation_scope: document.getElementById('mfScope').value.trim(),
            relationship_status: document.getElementById('mfRelation').value.trim(),
            market_quality: document.getElementById('mfQuality').value.trim(),
            algorithm_capability: document.getElementById('mfAlgo').value.trim()
        };
        let result;
        if (oem) {
            result = await API.put(`/api/customers/${encodeURIComponent(oem)}`, data);
        } else {
            data.oem = document.getElementById('mfOem').value.trim();
            if (!data.oem) { Toast.error('OEM 不能为空'); return; }
            result = await API.post('/api/customers', data);
        }
        if (result && !result.error) {
            Toast.success(oem ? '更新成功' : '创建成功');
            Modal.close();
            this.loadList();
            App.loadCustomers();
        } else {
            Toast.error((result && result.error) || '保存失败');
        }
    },

    async remove(rawOem) {
        const oem = rawOem ? decodeURIComponent(rawOem) : '';
        if (!confirm('确定删除该客户？所有关联数据将一并删除。')) return;
        const result = await API.del(`/api/customers/${encodeURIComponent(oem)}`);
        if (result) {
            Toast.success('删除成功');
            this.loadList();
            App.loadCustomers();
        }
    },

    async openDetail(rawOem) {
        const oem = rawOem ? decodeURIComponent(rawOem) : '';
        const c = await API.get(`/api/customers/${encodeURIComponent(oem)}`);
        if (!c || c.error) { Toast.error('加载详情失败'); return; }

        Modal.open(`
            <div class="modal-header"><h3>${Utils.esc(c.oem_ch || c.name_cn || c.oem)} (${Utils.esc(c.oem)}) - 客户档案</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div style="display:flex;gap:8px;margin-bottom:16px;">
                <button class="btn btn-secondary btn-sm p2-tab active" data-tab="info">基本信息</button>
                <button class="btn btn-secondary btn-sm p2-tab" data-tab="visit">拜访计划</button>
                <button class="btn btn-secondary btn-sm p2-tab" data-tab="agreements">合作协议</button>
                <button class="btn btn-secondary btn-sm p2-tab" data-tab="persons">关键人矩阵</button>
            </div>
            <div id="p2TabContent">${this.renderInfoTab(c)}</div>
        `);
        document.querySelectorAll('.p2-tab').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.p2-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                const content = document.getElementById('p2TabContent');
                if (tab === 'info') content.innerHTML = this.renderInfoTab(c);
                else if (tab === 'visit') content.innerHTML = this.renderVisitTab(c);
                else if (tab === 'agreements') content.innerHTML = this.renderAgreementsTab(c);
                else if (tab === 'persons') content.innerHTML = this.renderPersonsTab(c);
            };
        });
    },

    renderInfoTab(c) {
        return `<table>
            <tr><td style="color:var(--text-secondary);width:120px;">OEM</td><td>${Utils.esc(c.oem)}</td></tr>
            <tr><td style="color:var(--text-secondary);">OEM中文</td><td>${Utils.esc(c.oem_ch) || '-'}</td></tr>
            <tr><td style="color:var(--text-secondary);">中文名称</td><td>${Utils.esc(c.name_cn) || '-'}</td></tr>
            <tr><td style="color:var(--text-secondary);">英文名</td><td>${Utils.esc(c.name_en) || '-'}</td></tr>
            <tr><td style="color:var(--text-secondary);">地址</td><td>${Utils.esc(c.address) || '-'}</td></tr>
            <tr><td style="color:var(--text-secondary);">地点</td><td>${Utils.esc(c.location) || '-'}</td></tr>
            <tr><td style="color:var(--text-secondary);">客户KPI</td><td>${Utils.esc(c.kpi) || '-'}</td></tr>

            <tr><td style="color:var(--text-secondary);">客户关系</td><td>${Utils.esc(c.relationship_status) || '-'}</td></tr>

            <tr><td style="color:var(--text-secondary);">算法能力</td><td>${Utils.esc(c.algorithm_capability) || '-'}</td></tr>

    renderVisitTab(c) {
        if (!c.visit_plans || !c.visit_plans.length) return '<div class="empty-state"><p>暂无拜访计划</p></div>';
        const rows = c.visit_plans.map(v => `<tr>
            <td>${Utils.formatDate(v.visit_date)}</td>
            <td>${Utils.esc(v.subject) || '-'}</td>
            <td>${Utils.esc(v.contact_person)}</td>
            <td class="cell-ellipsis" title="${Utils.esc(v.visit_content)}">${Utils.esc(v.visit_content) || '-'}</td>
            <td>${v.is_completed ? Utils.statusBadge('已完成') : Utils.statusBadge('待处理')}</td>
        </tr>`).join('');
        return `<div class="table-wrapper"><table>
            <thead><tr><th>日期</th><th>主题</th><th>对接人</th><th>内容</th><th>状态</th></tr></thead>
            <tbody>${rows}</tbody>
        </table></div>`;

    renderAgreementsTab(c) {
        if (!c.agreements || !c.agreements.length) return '<div class="empty-state"><p>暂无合作协议</p></div>';
        return `<div class="bookshelf">${c.agreements.map(d => `
            <div class="book-item" onclick="window.open('/api/documents/${d.id}/download')">
                <span class="book-icon">&#128196;</span>
                <div class="book-title">${Utils.esc(d.title || d.file_name)}</div>
                <div class="book-meta">${Utils.formatDate(d.upload_date)}</div>
            </div>`).join('')}
        </div>`;
