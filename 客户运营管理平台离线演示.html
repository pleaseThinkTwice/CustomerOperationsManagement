<script>
/**
 * 页面8 - OEM 映射维护
 * 维护 tab1.oem(客档表) ↔ tab2.cust_grp_name(出货表) 的映射关系
 * oem/cust_grp_name 下拉候选来自 Doris(只读)，映射本身存本地 SQLite
 */
const Page8 = {
    initialized: false,
    oemList: [],        // [{oem, oem_ch}]
    custGrpList: [],    // [{cust_grp_name, cnt}]
    mappingData: [],
    dorisLoaded: false,

    init() {
        const container = document.getElementById('page8');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.bindEvents();
            this.initialized = true;
        }
        this.loadDorisOptions();
        this.loadMapping();
    },

    renderLayout() {
        return `
        <div class="filter-bar">
            <div class="form-group">
                <label>OEM 筛选</label>
                <select id="p8OemFilter">
                    <option value="">全部 OEM</option>
                </select>
            </div>
            <button class="btn btn-primary" id="p8Search">查 询</button>
            <button class="btn btn-success" id="p8Add" data-perm="oem_mapping.edit">+ 新增映射</button>
            <span id="p8DorisStatus" style="margin-left:12px;font-size:12px;color:var(--text-muted);"></span>
        </div>
        <div id="p8List"></div>`;
    },

    bindEvents() {
        document.getElementById('p8Search').onclick = () => this.loadMapping();
        document.getElementById('p8Add').onclick = () => this.openAddModal();
    },

    // 并发加载 Doris 两个下拉候选
    async loadDorisOptions() {
        const statusEl = document.getElementById('p8DorisStatus');
        statusEl.textContent = '正在从 Doris 加载候选...';
        const [oemRes, custRes] = await Promise.all([
            API.get('/api/doris/oem_list'),
            API.get('/api/doris/cust_grp_list')
        ]);
        // oem 列表
        if (Array.isArray(oemRes)) {
            this.oemList = oemRes;
            const filterSel = document.getElementById('p8OemFilter');
            filterSel.innerHTML = '<option value="">全部 OEM</option>' +
                oemRes.map(o => `<option value="${Utils.esc(o.oem)}">${Utils.esc(o.oem)} - ${Utils.esc(o.oem_ch)}</option>`).join('');
        }
        if (Array.isArray(custRes)) {
            this.custGrpList = custRes;
        }
        this.dorisLoaded = Array.isArray(oemRes) && Array.isArray(custRes);
        if (this.dorisLoaded) {
            statusEl.textContent = `Doris 候选就绪: OEM ${this.oemList.length} 个 / 客户集团 ${this.custGrpList.length} 个`;
            statusEl.style.color = 'var(--success)';
        } else {
            statusEl.textContent = 'Doris 候选加载失败，新增时下拉不可用';
            statusEl.style.color = 'var(--danger)';
        }
    },

    async loadMapping() {
        const oem = document.getElementById('p8OemFilter').value;
        let url = '/api/oem_mapping';
        if (oem) url += `?oem=${encodeURIComponent(oem)}`;
        const container = document.getElementById('p8List');
        container.innerHTML = '<div class="loading"></div>';
        const data = await API.get(url);
        this.mappingData = Array.isArray(data) ? data : [];
        this.renderList();
    },

    renderList() {
        const container = document.getElementById('p8List');
        if (!this.mappingData.length) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128279;</div><p>暂无映射，点击"新增映射"添加</p></div>';
            return;
        }
        const rows = this.mappingData.map(m => `
            <tr>
                <td><span class="badge badge-info">${Utils.esc(m.oem)}</span></td>
                <td>${Utils.esc(m.oem_ch) || '-'}</td>
                <td class="cell-ellipsis" title="${Utils.esc(m.cust_grp_name)}">${Utils.esc(m.cust_grp_name)}</td>
                <td>
                    <button class="btn btn-sm btn-danger" data-perm="oem_mapping.edit" onclick="Page8.deleteMapping(${m.id})">删除</button>
                </td>
            </tr>`).join('');
        container.innerHTML = `<div class="card">
            <div class="card-title">OEM ↔ 客户集团 映射 (${this.mappingData.length} 条)</div>
            <div class="table-wrapper"><table>
                <thead><tr><th>OEM</th><th>OEM中文</th><th>客户集团名(cust_grp_name)</th><th>操作</th></tr></thead>
                <tbody>${rows}</tbody>
            </table></div>
        </div>`;
    },

    openAddModal() {
        if (!this.dorisLoaded) {
            Toast.error('Doris 候选未就绪，无法新增');
            return;
        }
        const oemOpts = '<option value="">请选择 OEM</option>' +
            this.oemList.map(o => `<option value="${Utils.esc(o.oem)}" data-ch="${Utils.esc(o.oem_ch)}">${Utils.esc(o.oem)} - ${Utils.esc(o.oem_ch)}</option>`).join('');
        const custOpts = '<option value="">请选择客户集团</option>' +
            this.custGrpList.map(c => `<option value="${Utils.esc(c.cust_grp_name)}">${Utils.esc(c.cust_grp_name)} (${c.cnt})</option>`).join('');
        Modal.open(`
            <h3>新增 OEM 映射</h3>
            <div class="form-group">
                <label>OEM (客档表) <span class="req">*</span></label>
                <select id="p8mOem">${oemOpts}</select>
            </div>
            <div class="form-group">
                <label>OEM 中文</label>
                <input type="text" id="p8mOemCh" readonly placeholder="选择 OEM 后自动带出">
            </div>
            <div class="form-group">
                <label>客户集团名 (出货表 cust_grp_name) <span class="req">*</span></label>
                <select id="p8mCustGrp">${custOpts}</select>
            </div>
            <div style="text-align:right;margin-top:12px;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="p8mSave">保存</button>
            </div>
        `);
        // OEM 选择自动带出中文
        const oemSel = document.getElementById('p8mOem');
        oemSel.onchange = () => {
            const opt = oemSel.options[oemSel.selectedIndex];
            document.getElementById('p8mOemCh').value = opt ? (opt.dataset.ch || '') : '';
        };
        document.getElementById('p8mSave').onclick = () => this.saveMapping();
    },

    async saveMapping() {
        const oem = document.getElementById('p8mOem').value;
        const oem_ch = document.getElementById('p8mOemCh').value;
        const cust_grp_name = document.getElementById('p8mCustGrp').value;
        if (!oem || !cust_grp_name) {
            Toast.error('OEM 和客户集团名均为必填');
            return;
        }
        const res = await API.post('/api/oem_mapping', { oem, oem_ch, cust_grp_name });
        if (res && res.id) {
            Toast.success('新增成功');
            Modal.close();
            this.loadMapping();
        } else {
            Toast.error((res && res.error) || '新增失败');
        }
    },

    async deleteMapping(id) {
        if (!confirm('确定删除这条映射？')) return;
        const res = await API.del(`/api/oem_mapping/${id}`);
        if (res && res.success) {
            Toast.success('删除成功');
            this.loadMapping();
        } else {
            Toast.error('删除失败');
        }
    }
};

</script>

<script>
/**
 * Page9 · 数智分析（自然语言数据分析：SQL + Python 双引擎，含常用问题快照 / 多问题报告 / 数据查看）
 * 复用全局 App / API / Toast / Modal / Utils。
 */
const Page9 = {
    renderErr: (msg) => `<div class="empty-state" style="padding:10px;color:var(--danger);">${Utils.esc(msg)}</div>`,

    renderTable(cols, rows) {
        let h = '<div class="table-wrapper"><table class="data-table" style="width:100%;border-collapse:collapse;font-size:13px;">'
            + '<thead><tr>';
        cols.forEach(c => h += `<th style="border:1px solid var(--border-row);padding:6px;background:var(--panel-2);">${Utils.esc(c)}</th>`);

    },

    // 展开/收起高级面板（统一入口下的次要功能藏到"高级"里，避免干扰）

    // ============ 绑定事件 ============
    bind() {
        document.getElementById('p9-run').onclick = () => this.runQuery();
        // 输入框：Enter 发送，Shift+Enter 换行，textarea 自动增高（claude 式）
        const q = document.getElementById('p9-query');
        q.addEventListener('keydown', (e) => {
            // 中文输入法组合态（选词确认 Enter）不触发发送
            if (e.isComposing || e.keyCode === 229) return;
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.runQuery(); return; }
            if (e.key === 'Enter' && e.shiftKey) { this._autoGrow(q); }
        });
        q.addEventListener('input', () => this._autoGrow(q));
        // 数智分析问题可在独立标签页长文编辑（todo#2）：开新标签可关闭原标签，内容实时同步
        window.TabEditor && TabEditor.attach(q, 'p9.query', '📊 数智分析问题');
        document.getElementById('p9-genreport').onclick = () => this.genReport();
        document.getElementById('p9-dvquery').onclick = () => this.runDataView();
        document.getElementById('p9-dvtable').onchange = () => this.runDataView();
        document.getElementById('p9-snaprefresh').onclick = () => this.refreshSnap();
        // 数智分析可查表目录
        document.getElementById('p9-ctreload').onclick = () => this.loadCatalog();
        document.getElementById('p9-ctcols').onclick = () => this.showTableCols();
        document.getElementById('p9-ctview').onclick = () => this.viewTableData();
        document.getElementById('p9-cttable').onchange = () => this.showTableCols();
        this.loadSnap();
        this.loadDataViews();
        this.loadCatalog();
        this.loadUserFavorites();
        this.loadUserKnowledge();
    },

    // ============ 自然语言分析（Agent 引擎）============
    async runQuery() {
        if (this._running) return;   // 并发/连按 Enter 防重复发送
        const q = document.getElementById('p9-query').value.trim();
        const box = document.getElementById('p9-result');
        if (!q) return;
        this._running = true;
        // 会话序号：新会话后回来的旧请求不再渲染（防孤儿气泡）
        const seq = (this._chatSeq = (this._chatSeq || 0) + 1);
        const btn = document.getElementById('p9-run');
        const origText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
        // 多轮对话（todo#5 收尾）：维护最近几轮 Q/A 作为上下文传给 Agent
        if (!this._chatHistory) this._chatHistory = [];
        this._appendChat('user', q);
        // 思考直接进聊天流，可展开/收起（不再弹独立窗口）
        this._thinkEl = this._appendThinkBubble(seq);
        box.innerHTML = '<div class="empty-state">正在思考并查数，结合此前对话上下文…</div>';
        try {
            const payload = { query: q, mode: 'analysis', history: this._recentHistory() };
            const res = await AgentProgress.run({
                url: '/api/agent/query', data: payload, title: '数智分析中',
                silent: true,
                onThought: (t) => this._appendThinkStep(seq, t)
            });
            // AgentProgress 失败时不抛异常，返回 {success:false, message}
            if (!res || res.success === false) {
                this._removeThinkBubble(seq);
                box.innerHTML = this.renderErr((res && (res.message || res.error)) || '查询失败，请稍后重试');
                return;
            }

            // Agent 轨迹
            const tools = res.tools_used || [];
            const trace = res.trace || [];
            const toolNames = { query_sql: '查数据', run_python: 'Python计算', search_kb: '查知识库', view_table: '查运营表', run_tool: '用工具箱', list_tools: '看工具箱', search_insight: '查数据洞察' };
            let h = '';
            if (trace.length) {
                const badges = tools.map(t =>
                    `<span class="badge badge-info" style="margin-right:4px;">Agent·${Utils.esc(toolNames[t] || t)}</span>`).join('');
                h += `<details style="margin-bottom:10px;border:1px solid var(--border-row);border-radius:8px;padding:8px;">
                    <summary style="cursor:pointer;font-size:13px;color:var(--text-secondary);">Agent 运行轨迹（${trace.length} 步） ${badges}</summary>
                    <ol style="font-size:12px;color:var(--text-secondary);padding-left:18px;margin:8px 0;">
                        ${trace.map(tr => {
                            const argsPreview = Utils.esc(tr.args || '').replace(/\s+/g, ' ').substring(0, 120);
                            const hasMore = (tr.args && tr.args.length > 120) || (tr.text && tr.text.length > 60);
                            const inner = hasMore ? `<details style="margin-top:2px;">
                                <summary style="cursor:pointer;color:var(--accent);">查看详情</summary>
                                <div style="color:var(--text-secondary);background:var(--bg-card);padding:6px;border-radius:4px;margin-top:4px;word-break:break-all;white-space:pre-wrap;">${Utils.esc(tr.args || '')}${tr.text ? '\n\n结果：' + Utils.esc(tr.text) : ''}</div>
                            </details>` : '';
                            return `<li style="margin:4px 0;">
                                <b>${Utils.esc(tr.tool)}</b> <span style="color:${tr.ok ? 'var(--success)' : 'var(--danger)'};">${tr.ok ? '✓' : '✗'}</span>
                                <span style="color:var(--text-muted);word-break:break-all;">${argsPreview}${tr.args && tr.args.length > 120 ? '…' : ''}</span>
                                ${inner}
                            </li>`;
                        }).join('')}
                    </ol>
                </details>`;
            }

            const meta = `Agent 共 ${res.steps || 0} 步 / 工具：${tools.join('、') || '无'}`;
            this._lastResult = { answer: res.answer || '', question: q };
            // 对话式：结论只在聊天流气泡，下方 result 区只放操作条 + 编辑区（不重复结论正文）
            const answerBlock = res.answer
                ? `<div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                        <span style="font-size:12px;color:var(--text-muted);">${Utils.esc(meta)}</span>
                        <span style="display:flex;gap:6px;">
                            <button class="btn btn-sm btn-secondary" id="p9-refine-btn" onclick="Page9.startRefine()">✏️ 编辑/优化</button>
                            <button class="btn btn-sm btn-primary" onclick="Page9.saveAsFavorite()">⭐ 存为常用</button>
                            ${res.trace_id ? `<button class="btn btn-sm btn-secondary" onclick="Page9.sendFeedback(${res.trace_id},1)">👍</button><button class="btn btn-sm btn-secondary" onclick="Page9.sendFeedback(${res.trace_id},-1)">👎</button>` : ''}
                        </span>
                    </div>
                    <div id="p9-ansedit" style="display:none;">
                        <textarea id="p9-ansedit-text" rows="10" style="width:100%;box-sizing:border-box;padding:8px;font-size:13px;"></textarea>
                        <div style="display:flex;gap:8px;margin-top:6px;align-items:flex-end;flex-wrap:wrap;">
                            <input id="p9-refine-prompt" type="text" placeholder="想怎么调整？如：改成表格/top5/换个角度…"
                                style="flex:1;min-width:180px;padding:8px;border:1px solid var(--border-card);border-radius:6px;"/>
                            <button class="btn btn-primary" id="p9-refine-ok" onclick="Page9.doRefine()">🔁 按提示词优化</button>
                            <button class="btn btn-secondary" id="p9-refine-save" onclick="Page9.saveEdited()">💾 保存修改</button>
                            <button class="btn btn-secondary" onclick="Page9.cancelEdit()">取消</button>
                        </div>
                    </div>`
                : '';
            if (answerBlock) {
                h += answerBlock;
            }
            if (res.error) h += this.renderErr(res.error);

            // 结果为空时的友好提示（区分"真无数据"和"查询失败"）
            if (!h.trim()) {
                if (res.ok === false || res.error) {
                    h = this.renderErr(res.error || '查询失败，可能是 Doris 超时或 SQL 错误，请缩小查询范围后重试。');
                } else if (res.row_count === 0 || (!res.rows || !res.rows.length)) {
                    h = '<div class="empty-state" style="padding:20px;">查询成功但未返回数据。可能原因：<br>① 查询条件过严，无匹配数据；<br>② 数据量过大被 LIMIT 截断（当前上限 5000 行）；<br>③ Doris 查询超时（120秒）。<br>建议：缩小查询范围或加筛选条件。</div>';
                } else {
                    h = `<div class="empty-state">Agent 执行完成但未生成分析结论（${meta}）。<br>已获取 ${res.row_count || 0} 行数据，请尝试更具体的问题。</div>`;
                }
            }

            box.innerHTML = h || '<div class="empty-state">无结果</div>';
            // 记录本轮对话：有结论则把后端渲染好的 report_html 作为助手气泡（claude 式，完整可读），无则提示
            const ans = res && res.answer;
            const html = res && res.report_html;
            if (this._thinkEl) { this._finalizeThinkBubble(seq, res); }   // 思考过程保留在聊天流，折叠收起；异常走 catch 移除
            if (ans || html) {
                if (html) {
                    this._appendChat('assistant', '', { html: html });
                } else {
                    this._appendChat('assistant', String(ans).slice(0, 2000));
                }
                this._chatHistory.push({ role: 'user', content: q });
                this._chatHistory.push({ role: 'assistant', content: String(ans || '').slice(0, 2000) });
                if (this._chatHistory.length > 50) this._chatHistory = this._chatHistory.slice(-50);
            } else {
                const errTxt = (res && (res.error || res.message)) || '查询失败';
                this._appendChat('assistant', '⚠️ ' + String(errTxt));
                this._chatHistory.push({ role: 'user', content: q });
            }
        } catch (e) {
            this._removeThinkBubble(seq);
            this._appendChat('assistant', '⚠️ 请求失败，请重试。');
            box.innerHTML = this.renderErr('请求失败：' + e.message);
        } finally {
            // 无论成败都恢复按钮，保证可以连续提问（此前失败后按钮永久禁用，"怎么点都不动"）
            if (btn) { btn.disabled = false; btn.textContent = origText; }
            this._running = false;
            // claude 式：发送后清空输入框并聚焦，便于连续追问
            const qin = document.getElementById('p9-query');
            if (qin && seq === this._chatSeq) { qin.value = ''; qin.style.height = 'auto'; qin.focus(); }
        }
    },

    // 多轮对话（todo#5 收尾）：取最近几轮 Q/A 作为后端上下文（避免过大，取最后 6 条）
    _recentHistory() {
        return (this._chatHistory || []).slice(-6).map(t => ({ role: t.role, content: t.content }));
    },

// 在顶部对话区追加一条气泡（用户左 / 助手右）。opts.html 为后端已安全渲染的 HTML（如 report_html）；否则按文本/摘要展示。
    _appendChat(role, content, opts) {
        opts = opts || {};
        const welcome = document.getElementById('p9-welcome');
        if (welcome && role === 'user') welcome.remove();
        const box = document.getElementById('p9-chat');
        if (!box) {
            if (!this.chatEl) this.chatEl = document.getElementById('p9-chat');
            if (!this.chatEl) return;
        }
        const target = box || this.chatEl;
        const isUser = role === 'user';
        const card = document.createElement('div');
        card.style.cssText = 'display:flex;gap:8px;margin-bottom:10px;align-items:flex-start;' + (isUser ? 'flex-direction:row-reverse;' : '');
        const avatar = document.createElement('div');
        avatar.textContent = isUser ? '🧑' : '🤖';
        avatar.style.cssText = 'width:26px;height:26px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-size:14px;flex:0 0 auto;';
        const bubble = document.createElement('div');
        if (isUser) {
            bubble.style.cssText = 'max-width:78%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word;white-space:pre-wrap;background:var(--brand-soft, rgba(37,99,235,.12));color:var(--text-primary);';
            bubble.textContent = content;   // 用户输入始终走 textContent，杜绝注入
        } else {
            bubble.className = 'p9-ans-bubble';
            bubble.style.cssText = 'max-width:82%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.65;word-break:break-word;background:var(--panel-2);color:var(--text-primary);';
            if (opts.html) {
                bubble.innerHTML = (Utils.mdSanitize ? Utils.mdSanitize(opts.html) : opts.html);   // 统一净化，防 XSS
            } else if (opts.thinking) {
                bubble.innerHTML = '<span class="loading" style="padding:2px;"></span> <span style="color:var(--text-muted);font-size:12.5px;">' + Utils.esc(content || '正在思考…') + '</span>';
            } else {
                bubble.textContent = content;          // 纯文本助手消息，直接 textContent
            }
        }
        card.appendChild(avatar);
        card.appendChild(bubble);
        if (!this.chatEl) this.chatEl = target;
        target.appendChild(card);
        target.scrollTop = target.scrollHeight;
        return card;   // 返回便于后续移除（如思考占位）
    },

    // textarea 自动增高（claude 式输入框随内容长高，最高 160px）
    _autoGrow(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    },

    // ===== 思考过程：直接进聊天流，可展开/收起（不走独立浮窗）=====
    _appendThinkBubble(seq) {
        const chat = document.getElementById('p9-chat');
        if (!chat) return null;
        const welcome = document.getElementById('p9-welcome');
        if (welcome) welcome.remove();
        const card = document.createElement('div');
        card.id = 'p9-think-' + seq;
        card.style.cssText = 'display:flex;gap:8px;margin-bottom:10px;align-items:flex-start;';
        card.innerHTML = `
            <div style="width:26px;height:26px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-size:14px;flex:0 0 auto;">🤔</div>
            <details open style="flex:1;background:var(--panel-2);border:1px solid var(--border-row);border-radius:12px;padding:8px 12px;font-size:12.5px;">
                <summary style="cursor:pointer;color:var(--text-secondary);font-weight:600;">正在思考…</summary>
                <div id="p9-think-body-${seq}" style="margin-top:6px;color:var(--text-secondary);line-height:1.7;"></div>
            </details>`;
        chat.appendChild(card);
        chat.scrollTop = chat.scrollHeight;
        return card;
    },

    _appendThinkStep(seq, t) {
        const body = document.getElementById('p9-think-body-' + seq);
        if (!body) return;
        const txt = (t && t.thought) || '';
        // 去重：后端 thought 是"最新一条"（非增量），轮询期间每 500ms 回调一次会重复刷同一条；
        // 记录已展示文本，相同则只更新 summary，不重复 append。
        if (txt) {
            if (!this._thinkShown) this._thinkShown = {};
            const key = seq + '::' + txt;
            if (!this._thinkShown[key]) {
                this._thinkShown[key] = true;
                const div = document.createElement('div');
                div.textContent = '🔹 ' + txt;      // 思考文本走 textContent，杜绝注入
                body.appendChild(div);
            }
        }
        const sum = body.closest('details') && body.closest('details').querySelector('summary');
        if (sum) sum.textContent = '🤔 正在思考…' + ((t && t.stepText) ? ' · ' + t.stepText : '');
        const chat = document.getElementById('p9-chat');
        if (chat) chat.scrollTop = chat.scrollHeight;
    },

    _finalizeThinkBubble(seq, res) {
        const card = document.getElementById('p9-think-' + seq);
        if (!card) return;
        const det = card.querySelector('details');
        const body = document.getElementById('p9-think-body-' + seq);
        if (!body || !body.childElementCount) { card.remove(); return; }   // 没有实际思考内容则不留空壳
        // 附上工具徽章并默认收起
        const tools = (res && res.tools_used) || [];
        const badge = tools.length ? ' · 用到的工具：' + tools.join('/') : '';
        if (det) {
            det.removeAttribute('open');      // 默认收起，点击展开
            const sum = det.querySelector('summary');
            if (sum) sum.textContent = '🤔 思考过程（' + body.childElementCount + ' 步' + badge + '，点击展开）';
        }
    },

    _removeThinkBubble(seq) {
        const card = document.getElementById('p9-think-' + seq);
        if (card) card.remove();
    },

    // 新会话：清空对话历史与结果区（并恢复欢迎占位）
    newChat() {
        this._chatHistory = [];
        this._thinkEl = null;
        this._thinkShown = {};   // 清空思考去重缓存
        // 会话号 +1：让在途旧请求回来后不渲染到新话题（防孤儿气泡）
        this._chatSeq = (this._chatSeq || 0) + 1;
        const chat = document.getElementById('p9-chat');
        if (chat) chat.innerHTML = '<div id="p9-welcome" style="text-align:center;color:var(--text-muted);font-size:13px;padding:40px 20px;line-height:2;">👋 新会话已开启，描述你的分析需求开始对话。</div>';
        const box = document.getElementById('p9-result');
        if (box) box.innerHTML = '';
        if (this.chatEl) this.chatEl = null;
    },

    // ============ 结果编辑 / 提示词优化 / 存为常用 ============
    startRefine() {
        const cur = this._lastResult && this._lastResult.answer;
        const tv = document.getElementById('p9-ansedit-text');
        if (tv && cur !== undefined) tv.value = cur;
        const edit = document.getElementById('p9-ansedit');
        if (edit) edit.style.display = '';
        document.getElementById('p9-refine-prompt').focus();
    },

    cancelEdit() {
        const edit = document.getElementById('p9-ansedit');
        if (edit) edit.style.display = 'none';
    },

    saveEdited() {
        const v = document.getElementById('p9-ansedit-text').value;
        if (!v) { Toast.error('内容为空'); return; }
        this._lastResult.answer = v;
        this._renderAnswerText(v);
        this.cancelEdit();
        Toast.success('已保存（本次展示的版本）');
    },

    async doRefine() {
        const prompt = document.getElementById('p9-refine-prompt').value.trim();
        const cur = document.getElementById('p9-ansedit-text').value || (this._lastResult && this._lastResult.answer);
        if (!prompt) { Toast.error('请输入修改要求'); return; }
        if (!cur) { Toast.error('没有可优化的结果'); return; }
        const btn = document.getElementById('p9-refine-ok');
        if (btn) { btn.disabled = true; btn.textContent = '优化中…'; }
        try {
            const r = await API.post('/api/agent/refine', { answer: cur, prompt });
            if (r && r.ok) {
                this._lastResult.answer = r.answer;
                document.getElementById('p9-ansedit-text').value = r.answer;
                this._renderAnswerText(r.answer);
                this.cancelEdit();
                Toast.success('已按你的要求优化');
            } else {
                Toast.error((r && r.error) || '优化失败');
            }
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = '🔁 按提示词优化'; }
        }
    },

    _renderAnswerText(text) {
        // 对话式：编辑/优化结果回写到聊天流最后一条助手气泡（而非下方已移除的 p9-ansview）
        const chat = document.getElementById('p9-chat');
        if (!chat) return;
        const bubbles = chat.querySelectorAll('.p9-ans-bubble');
        const last = bubbles[bubbles.length - 1];
        if (last) last.innerHTML = Utils.collapse(String(text || ''), 1500);
    },

    async sendFeedback(traceId, fb) {
        if (fb === -1) {
            // 差评：弹框收集改进意见
            const text = prompt('请告诉我们哪里需要改进（可留空直接提交）：', '');
            if (text === null) return;  // 取消
            try {
                await API.post('/api/agent/feedback', {trace_id: String(traceId), feedback: -1, feedback_text: text});
                Toast.show('感谢反馈！已记录改进意见 👎', 'success');
            } catch (e) { Toast.error('反馈提交失败'); }
        } else {
            // 好评：直接提交
            try {
                await API.post('/api/agent/feedback', {trace_id: String(traceId), feedback: 1});
                Toast.show('已标记为有用 👍', 'success');
            } catch (e) { Toast.error('反馈提交失败'); }
        }
    },

    // ============ 常用问题快照 ============
    async loadSnap() {
        const box = document.getElementById('p9-snapbox');
        try {
            const r = await fetch('/api/nl2sql/snapshots?action=pull');
            const d = await r.json();
            if (d.error) { document.getElementById('p9-snapdate').textContent = '加载失败'; box.innerHTML = this.renderErr(d.error); return; }
            document.getElementById('p9-snapdate').textContent = d.date ? `快照日期：${Utils.formatDate(d.date)}` : '暂无快照';
            if (!d.items || !d.items.length) { box.innerHTML = '<div class="empty-state">暂无常用问题。</div>'; return; }
            // 收集问题列表，供渲染与"多问题统一报告"勾选使用
            this.snapItems = d.items;
            this.renderSnapItems();
        } catch (e) {
            document.getElementById('p9-snapdate').textContent = '加载失败';
            box.innerHTML = this.renderErr(e.message);
        }
    },

    // 渲染快照条目（单条可点开查看报告；默认收起，仅显示问题+状态）
    renderSnapItems() {
        const box = document.getElementById('p9-snapbox');
        if (!box) return;
        // 先记录已勾选（供"统一报告"用），重渲染后回填，避免展开/收起丢勾选
        const checked = new Set(
            [...(box.querySelectorAll('input[data-q]:checked') || [])].map(c => c.dataset.q));
        const items = this.snapItems || [];
        if (typeof this.snapExpanded === 'undefined') this.snapExpanded = false;
        this.snapOpen = this.snapOpen || {};
        let h = '';
        items.forEach((it, idx) => {
            const open = this.snapExpanded || !!this.snapOpen[idx];
            const okB = it.ok ? '<span class="badge badge-success">OK</span>' : '<span class="badge badge-danger">失败</span>';
            const rep = (it.ok && it.report_html)
                ? `<div class="md-body" style="line-height:1.7;margin:6px 0;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border-card);border-radius:8px;">${Utils.mdSanitize(it.report_html)}</div>` : '';
            const body = it.ok ? this.renderTable(it.columns || [], it.rows || [])
                : this.renderErr(it.error || '执行失败');
            h += `<div style="border:1px solid var(--border-row);border-radius:8px;margin-bottom:8px;padding:8px;">
                <div style="display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;"
                    onclick="Page9.toggleItem(${idx})" title="点击查看/收起报告">
                    <span style="transition:.15s;font-size:11px;color:var(--text-muted);display:inline-block;transform:rotate(${open ? 90 : 0}deg);">▶</span>
                    <span style="flex:1;">${Utils.esc(it.question)}</span> ${okB}
                    <span style="font-size:12px;color:var(--text-muted);">（${it.row_count || 0} 行）</span>
                    <span style="font-size:11px;color:var(--accent);">${open ? '收起' : '查看报告'}</span>
                </div>
                <label style="display:block;margin:4px 0 0 14px;font-size:12px;color:var(--text-muted);" title="勾选后可用于下方【生成统一报告】">
                    <input type="checkbox" data-q="${Utils.esc(it.question)}" ${checked.has(it.question) ? 'checked' : ''} style="margin-right:4px;"/>勾选用于统一报告
                </label>
                <div class="p9-snap-item-body" style="${open ? '' : 'display:none;'}">
                    ${rep}
                    <details><summary style="cursor:pointer;font-size:12px;color:var(--text-secondary);">数据预览</summary>${body}</details>
                </div>
                </div>`;
        });
        box.innerHTML = h;
        this.updateSnapToggleBtn();
    },

    // 单条：点击展开/收起该条报告（不重新拉快照，即时响应）
    toggleItem(idx) {
        this.snapOpen = this.snapOpen || {};
        this.snapOpen[idx] = !this.snapOpen[idx];
        // 若全局展开开着，单条点击聚焦该条（收起其它），否则单条态看不到变化
        this.snapExpanded = false;
        this.renderSnapItems();
    },

    // 全局展开/收起全部报告
    toggleSnap() {
        this.snapExpanded = !this.snapExpanded;
        this.snapOpen = {};   // 全局切换时清空单条态，避免叠加困惑
        this.renderSnapItems();
    },

    updateSnapToggleBtn() {
        const btn = document.getElementById('p9-snaptoggle');
        if (btn) btn.textContent = this.snapExpanded ? '收起报告' : '展开报告';
    },

    async refreshSnap() {
        document.getElementById('p9-snapdate').textContent = '刷新中…';
        const r = await fetch('/api/nl2sql/snapshots/refresh', { method: 'POST' });
        const d = await r.json();
        document.getElementById('p9-snapdate').textContent = d.error
            ? ('刷新失败：' + d.error)
            : `已刷新：成功 ${d.ok} 项 / 失败 ${d.failed} 项`;
        this.loadSnap();
    },

    // ============ 多问题统一报告 ============
    async genReport() {
        const out = document.getElementById('p9-report');
        document.getElementById('p9-rmeta').textContent = '';
        const btn = document.getElementById('p9-genreport');
        const origText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '处理中...'; }
        try {
            const snap = await (await fetch('/api/nl2sql/snapshots?action=read')).json();
            const wanted = new Set(
                [...document.querySelectorAll('#p9-snapbox input[type="checkbox"]:checked')].map(c => c.dataset.q));
            if (!wanted.size) { document.getElementById('p9-rmeta').textContent = '请先勾选至少一个常用问题。'; return; }
            const picked = (snap.items || []).filter(it => wanted.has(it.question))
                .map(it => ({ question: it.question, columns: it.columns, rows: it.rows }));
            out.innerHTML = '<div class="empty-state">正在生成统一报告，请稍候…</div>';
            document.getElementById('p9-rmeta').textContent = `已选 ${picked.length} 个问题`;
            const r = await fetch('/api/nl2sql/report', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: picked, prompt: document.getElementById('p9-reportprompt').value.trim() })
            });
            const d = await r.json();
            out.innerHTML = d.ok
                ? `<div class="md-body" style="line-height:1.7;">${Utils.mdSanitize(d.report_html) || Utils.esc(d.report || '')}</div>`
                : this.renderErr('生成失败：' + (d.error || '未知'));
} catch (e) {
            out.innerHTML = this.renderErr('请求失败：' + e.message);
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = origText; }
        }
    },

    // ============ 数据查看 ============
    async loadDataViews() {
        const sel = document.getElementById('p9-dvtable');
        try {
            const d = await (await fetch('/api/dataview')).json();
            // 方案B：数据查看只保留本地运营表；Doris 全量表归「数智分析可查表」，避免两模块重叠

            local.forEach(v => {
                sel.insertAdjacentHTML('beforeend',
                    `<option value="${Utils.esc(v.key)}">${Utils.esc(v.title)}</option>`);
            });
            const info = document.getElementById('p9-dvinfo');
            if (info) info.textContent = `（本地 ${local.length} 张；Doris 全量表见下方「数智分析可查表」）`;

            sel.innerHTML = `<option value="">加载失败：${Utils.esc(e.message)}</option>`;

    },

        const key = document.getElementById('p9-dvtable').value;
        const box = document.getElementById('p9-dvresult');
        document.getElementById('p9-dvinfo').textContent = '';
        if (!key) { box.innerHTML = '<div class="empty-state">请先选择数据表。</div>'; return; }

        // 文件名默认取表名，非法字符替换为下划线
        const fn = (d.title || '数据') + '.csv';
        Utils.downloadCSV(fn, d.columns, d.rows);
        Toast.success('已导出 ' + d.rows.length + ' 行');
    },

    // ============ 数智分析可查表目录（500+ 张，输入过滤 → 看字段 → 一键查前N行） ============
async loadCatalog() {
        const input = document.getElementById('p9-cttable');
        const info = document.getElementById('p9-ctinfo');
        const dl = document.getElementById('p9-catlist');
        try {
            const res = await fetch('/api/nl2sql/tables');
            let d = null;
            try { d = await res.json(); } catch (e) { d = null; }
            if (!res.ok || !d) {
                const hint = (res.status === 404 || res.status === 405)
                    ? '接口未生效：请重启后端服务（新增了 /api/nl2sql/tables 接口）。'
                    : (res.status === 401 ? '请重新登录后刷新。' : `HTTP ${res.status}`);
                if (info) info.textContent = `目录加载失败：${hint}`;
                return;
            }
            if (d.error) { if (info) info.textContent = '目录加载失败：' + d.error; return; }
            this._cat = d.tables || [];
            const metaEl = document.getElementById('p9-ctmeta');
            if (metaEl) metaEl.textContent = '';
            const fieldsEl = document.getElementById('p9-ctfields');
            if (fieldsEl) fieldsEl.innerHTML = '';
            if (dl) {
                dl.innerHTML = this._cat.length
                    ? this._cat.map(t => `<option value="${Utils.esc(t.table)}">${t.desc ? Utils.esc(t.desc) : ''}</option>`).join('')
                    : '';
            }
            if (input) input.value = '';
            if (info) info.textContent = this._cat.length ? `共 ${this._cat.length} 张 Doris 可查表（含数据洞察自动学习表，输入关键词过滤）` : '暂无已登记可查表';
        } catch (e) {
            if (info) info.textContent = '目录加载失败（网络或接口错误）';
        }
    },

    async showTableCols() {
        const sel = document.getElementById('p9-cttable');
        const metaEl = document.getElementById('p9-ctmeta');
        const fieldsEl = document.getElementById('p9-ctfields');
        const table = sel ? sel.value : '';
        if (!table) { metaEl.textContent = '请先选择一张表。'; fieldsEl.innerHTML = ''; return; }
        metaEl.textContent = '加载字段…';
        try {
            const d = await (await fetch('/api/nl2sql/tables/columns?table=' + encodeURIComponent(table))).json();
            if (d.error) { metaEl.textContent = d.error; fieldsEl.innerHTML = ''; return; }
            const f = d.fields || [];
            metaEl.textContent = `表：${d.table}${d.desc ? ' · ' + d.desc : ''} · ${f.length} 个字段`;
            if (!f.length) { fieldsEl.innerHTML = '<div class="empty-state">该表暂无字段说明。</div>'; return; }
            const rows = f.map(x => `<tr><td class="mono" style="padding:4px 8px;border-bottom:1px solid var(--border-row);">${Utils.esc(x.col)}</td>
                <td style="padding:4px 8px;border-bottom:1px solid var(--border-row);color:var(--text-muted);font-size:12px;">${Utils.esc(x.type)}</td>
                <td style="padding:4px 8px;border-bottom:1px solid var(--border-row);">${Utils.esc(x.desc || '')}</td></tr>`).join('');
            fieldsEl.innerHTML = `<div class="table-wrapper" style="max-height:220px;overflow-y:auto;"><table style="width:100%;font-size:12px;border-collapse:collapse;">
                <thead><tr><th style="text-align:left;">字段</th><th style="text-align:left;width:110px;">类型</th><th style="text-align:left;">含义</th></tr></thead>
                <tbody>${rows}</tbody></table></div>`;
        } catch (e) {
            metaEl.textContent = '字段加载失败：' + e.message;
        }
    },

    async viewTableData() {
        const table = document.getElementById('p9-cttable').value;
        const limitEl = document.getElementById('p9-ctlimit');
        const metaEl = document.getElementById('p9-ctmeta');
        const fieldsEl = document.getElementById('p9-ctfields');
        if (!table) { metaEl.textContent = '请先选择一张表。'; return; }
        const limit = Math.min(5000, Math.max(1, parseInt(limitEl.value, 10) || 200));
        metaEl.textContent = `正在查询 ${table}（前 ${limit} 行）…`;
        const box = fieldsEl;
        box.innerHTML = '<div class="empty-state">查询中（Doris）…</div>';
        try {
            const d = await (await fetch('/api/nl2sql/tables/view?table=' + encodeURIComponent(table) + '&limit=' + limit)).json();
            if (!d.ok) { metaEl.textContent = ''; box.innerHTML = this.renderErr(d.error || '查询失败'); return; }
            this._ctExport = { title: d.table || table, columns: d.columns || [], rows: d.rows || [] };
            metaEl.innerHTML = `表：${Utils.esc(d.table)} · ${d.row_count} 行 `
                + `<button class="btn btn-sm btn-secondary" style="margin-left:8px;" onclick="Page9.exportCatalogCsv()">⬇ 导出CSV</button>`;
            box.innerHTML = this.renderTable(d.columns || [], d.rows || []);
        } catch (e) {
            metaEl.textContent = '';
            box.innerHTML = this.renderErr('查询失败：' + e.message);
        }
    },

    exportCatalogCsv() {
        const d = this._ctExport;
        if (!d || !d.columns || !d.columns.length) { Toast.error('暂无可导出的数据'); return; }
        Utils.downloadCSV((d.title || '数据') + '.csv', d.columns, d.rows);
        Toast.success('已导出 ' + d.rows.length + ' 行');
    },

    init() { this.render(); }
};
</script>

<!-- /static/js/pages/page_demand.js -->
<script>
/**
 * 页面10 - 需求管理（需求提报 / 审批 / 分配责任人 / 消息推送）
 * 管理员：审批、删除；普通用户：提报、编辑自己的需求。
 */
const PageDemand = {
    initialized: false,
    _meetings: [],   // 会议列表缓存（供「来源会议」下拉，联动可选）

    init() {
        const container = document.getElementById('page10');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.load();
    },

    renderLayout() {
        return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
            <div style="font-size:15px;color:var(--text-secondary);">
                需求提报与审批 · 拆解会议纪要/客户需求，分配责任人并推送通知
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="btn btn-secondary" id="pdAiAdd">&#9889; AI 智能拆解</button>
                <button class="btn btn-primary" id="pdAdd" data-perm="demand.edit">+ 新增需求</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">需求列表</div>
            <div class="table-wrapper"><table>
                <thead><tr>
                    <th>ID</th><th>标题</th><th>来源客户</th><th>背景 / 需求说明</th><th>标签</th>
                    <th>责任人</th><th>优先级</th><th>计划时间</th><th>状态</th><th>操作</th>
                </tr></thead>
                <tbody id="pdTbody"><tr><td colspan="10" class="empty-state" style="text-align:center;padding:20px;">加载中...</td></tr></tbody>
            </table></div>
        </div>`;
    },

    bindEvents() {
        document.getElementById('pdAdd').onclick = () => this.openEdit(null);
        document.getElementById('pdAiAdd').onclick = () => this.openAiGenerate();
    },

    async load() {
        const tbody = document.getElementById('pdTbody');
        tbody.innerHTML = '<tr><td colspan="10" class="empty-state" style="text-align:center;padding:20px;">加载中...</td></tr>';
        const data = await API.get('/api/demands');
        if (!data || !data.length) {
            tbody.innerHTML = '<tr><td colspan="10" class="empty-state" style="text-align:center;padding:20px;">暂无需求</td></tr>';
            return;
        }
        const canApprove = App.hasPerm('demand.approve'); const canDel = App.hasPerm('demand.delete');
        tbody.innerHTML = data.map(d => {
            // 背景/需求说明：collapseText 内部负责转义，直接 innerHTML，勿再手动 esc
            const bg = String(d.background || '').trim();
            const bgCell = bg ? `<span style="cursor:help;">${Utils.collapseText(bg, 60)}</span>` : '-';
            const owner = d.owner || d.demanded_by || '-';
            const timeRange = d.start_date || d.due_date
                ? `${d.start_date ? Utils.esc(String(d.start_date).substring(5)) : '?'} ~ ${d.due_date ? Utils.esc(String(d.due_date).substring(5)) : '?'}`
                : '-';
            return `
            <tr>
                <td>${d.id}</td>
                <td style="max-width:300px;"><div style="display:flex;align-items:center;gap:4px;min-width:0;">
                    <span class="cell-ellipsis" style="min-width:0;" title="${Utils.esc(d.title)}">${Utils.esc(d.title)}</span>
                    ${d.meeting_title ? `<a href="javascript:;" class="badge badge-info" style="font-size:10px;text-decoration:none;flex:none;"
                        title="来自会议：${Utils.esc(d.meeting_title)}${d.meeting_date ? '（' + Utils.esc(String(d.meeting_date).substring(0,10)) + '）' : ''}，点击查看会议"
                        onclick="PageDemand.viewMeeting(${d.meeting_id})">&#128279; 会议</a>` : ''}
                </div></td>
                <td>${Utils.esc(d.source_oem) || '-'}</td>
                <td style="max-width:220px;">${bgCell}</td>
                <td>${Utils.esc(d.tags) || '-'}</td>
                <td>${Utils.esc(owner)}</td>
                <td>${this.priorityBadge(d.priority)}</td>
                <td class="mono" style="white-space:nowrap;">${timeRange}</td>
                <td>${Utils.statusBadge(d.status)}</td>
                <td class="actions">
                    <button class="btn btn-secondary btn-sm" onclick="PageDemand.openEdit(${d.id})">编辑</button>
                    ${canApprove && (d.status === '待审批' || d.status === '已驳回') ? `<button class="btn btn-primary btn-sm" onclick="PageDemand.openReview(${d.id},'${Utils.esc(d.status)}')">审批</button>` : ''}
                    ${canDel ? `<button class="btn btn-danger btn-sm" onclick="PageDemand.del(${d.id})">删除</button>` : ''}
                </td>
            </tr>`;
        }).join('');
    },

    priorityBadge(p) {
        const cls = p === '高' ? 'danger' : (p === '中' ? 'warning' : 'info');
        return `<span class="badge badge-${cls}">${Utils.esc(p || '普通')}</span>`;
    },

    async openEdit(id, prefill) {
        prefill = prefill || {};
        let d = {};
        if (id) {
            const list = await API.get('/api/demands');
            d = (list || []).find(x => x.id === id) || {};
            if (!d.id) {
                Toast.error('加载详情失败');
                return;
            }
        } else {
            // 预填（如来自会议页「拆解为需求」）
            d = { ...prefill };
        }
        const customers = App.customers || [];
        const oemOpts = '<option value="">无（通用需求）</option>' +
            customers.map(c => `<option value="${Utils.esc(c.oem)}" ${c.oem === d.source_oem ? 'selected' : ''}>${Utils.esc(c.oem_ch || c.name_cn || c.oem)} (${Utils.esc(c.oem)})</option>`).join('');
        // 来源会议下拉（联动可选：很多需求并非会议产生，默认「无」）
        if (!this._meetings.length) {
            try { this._meetings = await API.get('/api/meetings') || []; } catch (e) { this._meetings = []; }
        }
        const meetOpts = '<option value="0">无（非会议需求）</option>' +
            this._meetings.map(m => `<option value="${m.id}" data-oem="${Utils.esc(m.oem || '')}" ${m.id === (d.meeting_id || 0) ? 'selected' : ''}>${Utils.esc(String(m.meeting_date || '').substring(0, 10))} ${Utils.esc(m.title || '')}${m.customer_name ? '（' + Utils.esc(m.customer_name) + '）' : ''}</option>`).join('');
        Modal.open(`
            <h3>${id ? '编辑需求' : '新增需求'}</h3>
            <div class="form-group"><label>标题 *</label><input type="text" id="pd-title" value="${Utils.esc(d.title)}" placeholder="需求标题"></div>
            <div class="form-group"><label>来源会议（可选）</label><select id="pd-meeting">${meetOpts}</select></div>
            <div class="form-group"><label>来源客户（会议/客户拆解）</label><select id="pd-oem">${oemOpts}</select></div>
            <div class="form-group"><label>需求背景</label><textarea id="pd-bg" rows="3" placeholder="需求背景/说明">${Utils.esc(d.background)}</textarea></div>
            <div class="form-group"><label>需求标签（逗号分隔）</label><input type="text" id="pd-tags" value="${Utils.esc(d.tags)}" placeholder="如：数据接口, 质保, 预警"></div>
            <div class="form-row">
                <div class="form-group"><label>责任处理人</label><input type="text" id="pd-owner" value="${Utils.esc(d.owner)}" placeholder="姓名"></div>
                <div class="form-group"><label>责任人工号</label><input type="text" id="pd-empid" value="${Utils.esc(d.owner_employee_id)}" placeholder="用于消息推送"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>优先级</label>
                    <select id="pd-priority">
                        <option value="低" ${d.priority === '低' ? 'selected' : ''}>低</option>
                        <option value="普通" ${(!d.priority || d.priority === '普通') ? 'selected' : ''}>普通</option>
                        <option value="高" ${d.priority === '高' ? 'selected' : ''}>高</option>
                    </select>
                </div>
                <div class="form-group"><label>开始日期</label><input type="date" id="pd-start" value="${d.start_date ? String(d.start_date).substring(0,10) : ''}"></div>
                <div class="form-group"><label>期望完成日期</label><input type="date" id="pd-due" value="${d.due_date ? String(d.due_date).substring(0,10) : ''}"></div>
            </div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="pd-save">保存</button>
            </div>`);
        // 选了来源会议 → 自动带出该会议的客户（仅在客户为空时）
        document.getElementById('pd-meeting').onchange = function () {
            const opt = this.options[this.selectedIndex];
            const oem = (opt && opt.dataset.oem) || '';
            if (oem && !document.getElementById('pd-oem').value) {
                document.getElementById('pd-oem').value = oem;
            }
        };
        document.getElementById('pd-save').onclick = () => this.save(id);
    },

    async save(id) {
        const title = document.getElementById('pd-title').value.trim();
        if (!title) { Toast.error('需求标题不能为空'); return; }
        const data = {
            title,
            source_oem: document.getElementById('pd-oem').value,
            meeting_id: parseInt(document.getElementById('pd-meeting').value, 10) || 0,
            background: document.getElementById('pd-bg').value.trim(),
            tags: document.getElementById('pd-tags').value.trim(),
            owner: document.getElementById('pd-owner').value.trim(),
            owner_employee_id: document.getElementById('pd-empid').value.trim(),
            priority: document.getElementById('pd-priority').value,
            start_date: document.getElementById('pd-start').value,
            due_date: document.getElementById('pd-due').value,
        };
        const res = id
            ? await API.put(`/api/demands/${id}`, data)
            : await API.post('/api/demands', data);
        if (res) {
            Toast.success(id ? '需求已更新' : '需求已提报，等待审批');
            Modal.close();
            this.load();
        }
    },

    openReview(id, status) {
        Modal.open(`
            <h3>审批需求 #${id}</h3>
            <div class="form-group"><label>审批意见</label><textarea id="pr-comment" rows="3" placeholder="审批意见/说明"></textarea></div>
            <div class="form-group"><label>通过后是否通知责任人</label>
                <select id="pr-notify"><option value="1">是（推送钉钉消息）</option><option value="0">否</option></select>
            </div>
            <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn btn-danger" id="pr-reject">驳 回</button>
                <button class="btn btn-success" id="pr-approve">通 过</button>
            </div>`);
        const act = (action) => async () => {
            const res = await API.post(`/api/demands/${id}/review`, {
                action,
                comment: document.getElementById('pr-comment').value.trim(),
                notify: document.getElementById('pr-notify').value === '1'
            });
            if (res && res.success) {
                Toast.success(res.push ? '已通过，' + res.push.message : (action === 'approve' ? '已通过' : '已驳回'));
                Modal.close();
                this.load();
            } else {
                Toast.error((res && res.message) || '操作失败');
            }
        };
        document.getElementById('pr-approve').onclick = act('approve');
        document.getElementById('pr-reject').onclick = act('reject');
    },

    async del(id) {
        if (!confirm(`确定删除需求 #${id}？`)) return;
        const res = await API.del(`/api/demands/${id}`);
        if (res) { Toast.success('已删除'); this.load(); }
    },

    // 查看来源会议：跳到会议纪要页并打开详情
    viewMeeting(meetingId) {
        if (!meetingId) { Toast.error('来源会议不存在（可能已被删除）'); return; }
        Modal.close();
        App.navigate('page3');
        Page3.openDetail(meetingId);
    },

    // 供会议页调用：跳到本页并打开新增表单（预填会议信息，含自动带出会议客户）
    async openCreateWith(prefill) {
        prefill = prefill || {};
        // 确保会议列表已加载，以便下拉预选与带出客户
        if (!this._meetings.length) {
            try { this._meetings = await API.get('/api/meetings') || []; } catch (e) { this._meetings = []; }
        }
        const meet = prefill.meeting_id ? (this._meetings.find(m => m.id === prefill.meeting_id) || {}) : {};
        if (meet.oem && !prefill.source_oem) prefill.source_oem = meet.oem;
        App.navigate('page10');
        this.openEdit(null, prefill);
    },

    // AI 拆解弹窗文本预填（供会议页在弹窗渲染后调用）
    prefillAiText(text) {
        const tv = document.getElementById('ai-text');
        if (tv) tv.value = text || '';
    },

    // ============ AI 智能拆解（会议纪要/客户诉求 → 多条结构化需求，可编辑后保存） ============
    _aiDrafts: [],
    _aiMeetingId: 0,   // 本轮 AI 拆解关联的来源会议（0=非会议需求）

    openAiGenerate(meetingId) {
        this._aiMeetingId = meetingId || 0;
        const customers = App.customers || [];
        // 从会议进入时，预选该会议的客户
        const meet = meetingId ? (this._meetings.find(m => m.id === meetingId) || {}) : {};
        if (meetingId && !this._meetings.length) {
            // 缓存为空时补拉一次（异步，仅影响客户预选）
            API.get('/api/meetings').then(list => {
                this._meetings = list || [];
                const m = this._meetings.find(x => x.id === meetingId) || {};
                const sel = document.getElementById('ai-oem');
                if (sel && m.oem) sel.value = m.oem;
            }).catch(() => {});
        }
        const oemOpts = '<option value="">无（通用需求）</option>' +
            customers.map(c => `<option value="${Utils.esc(c.oem)}" ${c.oem === meet.oem ? 'selected' : ''}>${Utils.esc(c.oem_ch || c.name_cn || c.oem)} (${Utils.esc(c.oem)})</option>`).join('');
        Modal.open(`
            <h3>&#9889; AI 智能拆解需求${this._aiMeetingId ? '<span class="badge badge-info" style="font-size:11px;margin-left:8px;">关联来源会议</span>' : ''}</h3>
            <div class="form-group"><label>来源客户（可选）</label><select id="ai-oem">${oemOpts}</select></div>
            <div class="form-group"><label>会议纪要 / 客户诉求文本</label>
                <textarea id="ai-text" rows="8" placeholder="粘贴会议纪要或客户诉求原文，AI 将自动拆解为多条可执行需求..."></textarea>
            </div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="ai-run">&#9889; 智能拆解</button>
            </div>
            <div id="ai-result" style="margin-top:14px;"></div>`);
        document.getElementById('ai-run').onclick = () => this.runAiGenerate();
    },

    async runAiGenerate() {
        const text = document.getElementById('ai-text').value.trim();
        if (!text) { Toast.error('请粘贴会议纪要或客户诉求文本'); return; }
        const oem = document.getElementById('ai-oem').value;
        const btn = document.getElementById('ai-run');
        btn.disabled = true; btn.textContent = '拆解中...';
        try {
            const res = await AgentProgress.run({ url: '/api/demands/ai-generate', data: { text, source_oem: oem }, title: 'AI 智能拆解' });
            if (res && res.success && res.demands && res.demands.length) {
                this._aiDrafts = res.demands.map((d, i) => ({ ...d, source_oem: d.source_oem || oem, meeting_id: this._aiMeetingId || 0, _idx: i }));
                this.renderAiDrafts();
            } else {
                Toast.error((res && res.message) || 'AI 未能拆解出需求');
            }
        } catch (e) { Toast.error('请求失败'); }
        finally { btn.disabled = false; btn.textContent = '&#9889; 智能拆解'; }
    },

    renderAiDrafts() {
        const box = document.getElementById('ai-result');
        const rows = this._aiDrafts.map((d, i) => `
            <div class="ai-card" style="border:1px solid var(--border-card);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--bg-card);">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <strong style="color:var(--accent-light);">需求 #${i + 1}</strong>
                    <button class="btn btn-danger btn-sm" onclick="PageDemand.removeAiDraft(${i})">移除</button>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:2;"><label>标题 *</label><input type="text" class="ai-t" value="${Utils.esc(d.title)}"></div>
                    <div class="form-group"><label>优先级</label>
                        <select class="ai-p"><option value="低" ${d.priority==='低'?'selected':''}>低</option><option value="普通" ${!d.priority||d.priority==='普通'?'selected':''}>普通</option><option value="高" ${d.priority==='高'?'selected':''}>高</option></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>责任处理人</label><input type="text" class="ai-o" value="${Utils.esc(d.owner)}"></div>
                    <div class="form-group"><label>责任人工号</label><input type="text" class="ai-e" value="${Utils.esc(d.owner_employee_id)}"></div>
                    <div class="form-group"><label>期望完成日期</label><input type="date" class="ai-d" value="${d.due_date ? String(d.due_date).substring(0,10) : ''}"></div>
                </div>
                <div class="form-group"><label>背景 / 说明</label><textarea class="ai-b" rows="2" placeholder="需求背景说明">${Utils.esc(d.background)}</textarea></div>
                <div class="form-group"><label>标签（逗号分隔）</label><input type="text" class="ai-tg" value="${Utils.esc(d.tags)}" placeholder="逗号分隔，如：数据接口,质保"></div>
            </div>`).join('');
        box.innerHTML = `
            ${rows}
            <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="PageDemand.clearAiDrafts()">清空</button>
                <button class="btn btn-primary" id="ai-save-all" onclick="PageDemand.saveAiDrafts()">保存全部需求（${this._aiDrafts.length}）</button>
            </div>`;
    },

    removeAiDraft(i) {
        this._aiDrafts.splice(i, 1);
        this.renderAiDrafts();
    },

    clearAiDrafts() {
        this._aiDrafts = [];
        this.renderAiDrafts();
    },

    async saveAiDrafts() {
        let ok = 0;
        const cards = document.querySelectorAll('#ai-result .ai-card');
        const btn = document.getElementById('ai-save-all');
        const origText = btn ? btn.textContent : '';
        const total = this._aiDrafts.length;
        if (btn) btn.disabled = true;
        try {
            for (let i = 0; i < this._aiDrafts.length; i++) {
                let title = '';
                const card = cards[i];
                if (btn) btn.textContent = `正在保存 ${i + 1}/${total}...`;
                if (card) {
                    title = card.querySelector('.ai-t').value.trim();
                    if (!title) { Toast.error(`需求 #${i + 1} 标题不能为空`); return; }
                    const bg = card.querySelector('.ai-b').value.trim();
                    const tags = card.querySelector('.ai-tg').value.trim();
                    const owner = card.querySelector('.ai-o').value.trim();
                    const empid = card.querySelector('.ai-e').value.trim();
                    const prio = card.querySelector('.ai-p').value;
                    const due = card.querySelector('.ai-d').value;
                    const oem = this._aiDrafts[i].source_oem || '';
                    const res = await API.post('/api/demands', {
                        title, background: bg, tags, owner, owner_employee_id: empid,
                        priority: prio, due_date: due, source_oem: oem,
                        meeting_id: this._aiDrafts[i].meeting_id || 0
                    });
                    if (res && res.id) ok++;
                } else {
                    // 卡片未渲染（理论上不会走到），跳过
                    continue;
                }
            }
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = origText; }
        }
        if (ok) {
            Toast.success(`已保存 ${ok} 条需求（待审批）`);
            Modal.close();
            this.load();
        } else {
            Toast.error('保存失败');
        }
    }
};
</script>

<script>
/**
 * 页面16 - 部门需求池
 * 面向咱们大数据部门内部：提需求（材料=文本说明）→ 授权审批人任一审批 → 排期/责任人 → 完成(填完成时间)。
 * 与页10「需求管理」分离：本池不关联个别 OEM，纯部门流转。
 */
const PageDemandPool = {
    initialized: false,
    _meta: null,      // { can_approve, approvers, categories }
    _filter: '全部',   // 状态筛选：全部/待审批/已通过/已驳回/已完成
    _mine: false,     // 只看我提的

    init() {
        const container = document.getElementById('page16');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.load();
    },

    renderLayout() {
        return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
            <div style="font-size:15px;color:var(--text-secondary);">
                部门需求池 · 提需求 → 审批(授权审批人任一) → 排期 → 完成
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="btn btn-secondary" id="dpiRefresh">🔄 刷新</button>
                <button class="btn btn-primary" id="dpiAdd">＋ 提需求</button>
            </div>
        </div>

        <!-- 状态筛选 -->
        <div style="display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border-row);padding-bottom:10px;flex-wrap:wrap;align-items:center;">
            ${['全部','待审批','已通过','已驳回','已完成'].map(s => `
                <button class="btn btn-sm dpi-filter ${this._filter===s?'btn-primary':'btn-secondary'}" data-f="${s}"
                    onclick="PageDemandPool.setFilter('${s}')">${s === '全部' ? '📋 全部' : s}</button>`).join('')}
            <label style="margin-left:12px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;">
                <input type="checkbox" id="dpiMine" ${this._mine ? 'checked' : ''}> 只看我提的
            </label>
            <span style="flex:1;"></span>
            <span style="font-size:12px;color:var(--text-muted);">审批：由系统配置的授权审批人（任一通过即通过）</span>
        </div>

        <div id="dpiStats" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;"></div>
        <div id="dpiContent"></div>`;
    },

    bindEvents() {
        document.getElementById('dpiAdd').onclick = () => this.openEdit(null);
        const rbtn = document.getElementById('dpiRefresh');
        if (rbtn) rbtn.onclick = () => { this.load(); Toast.success('已刷新'); };
        const mine = document.getElementById('dpiMine');
        if (mine) mine.onchange = () => { this._mine = mine.checked; this.load(); };
    },

    setFilter(f) {
        this._filter = f;
        document.querySelectorAll('.dpi-filter').forEach(b => {
            const on = b.dataset.f === f;
            b.classList.toggle('btn-primary', on);
            b.classList.toggle('btn-secondary', !on);
        });
        this.load();
    },

    async load() {
        if (!this._meta) {
            this._meta = await API.get('/api/demand-pool/meta') || { can_approve: false, approvers: [], categories: [], me: {} };
        }
        const q = new URLSearchParams();
        if (this._filter !== '全部') q.set('status', this._filter);
        if (this._mine) q.set('mine', '1');
        const list = await API.get(`/api/demand-pool?${q.toString()}`);
        this._list = list || [];
        this.renderStats();
        this.renderTable();
    },

    renderStats() {
        const box = document.getElementById('dpiStats');
        const l = this._list || [];
        const st = (s) => ({ key: s, n: l.filter(x => x.status === s).length });
        const stat = (icon, label, key, cls) => {
            const n = key === 'total' ? l.length : st(key).n;
            return `<div style="background:var(--panel-2);border:1px solid var(--border-row);border-radius:12px;padding:10px 12px;">
                <div style="font-size:11px;color:var(--text-muted);">${icon} ${label}</div>
                <div style="font-size:20px;font-weight:800;${cls || ''}" class="mono">${n}</div></div>`;
        };
        box.innerHTML =
            stat('📋', '共 ' + (this._mine ? '我的' : '全部'), 'total')
            + stat('⏳', '待审批', '待审批', 'color:var(--warning);')
            + stat('✅', '已通过', '已通过', 'color:var(--info);')
            + stat('🚫', '已驳回', '已驳回', 'color:var(--muted);')
            + stat('🏁', '已完成', '已完成', 'color:var(--success);');
    },

    _prioBadge(p) {
        const cls = p === '高' ? 'danger' : (p === '中' ? 'warning' : 'info');
        return `<span class="badge badge-${cls}">${Utils.esc(p || '普通')}</span>`;
    },

    _stCls(s) {
        return { '待审批': 'badge-warning', '已通过': 'badge-info', '已驳回': 'badge-danger', '已完成': 'badge-success' }[s] || 'badge-info';
    },

    renderTable() {
        const box = document.getElementById('dpiContent');
        const l = this._list || [];
        if (!l.length) {
            box.innerHTML = `<div class="card"><div class="empty-state" style="padding:30px;text-align:center;">暂无需求，点击右上角「＋ 提需求」发起一条</div></div>`;
            return;
        }
        const canApprove = this._meta && this._meta.can_approve;
        const me = (App.currentUser || {});
        const rows = l.map(d => {
            const canDel = canApprove || d.requested_by === me.username || d.requested_name === me.name;
            const act = [];
            if (d.status === '待审批' && canApprove) {
                act.push(`<button class="btn btn-primary btn-sm" onclick="PageDemandPool.openReview(${d.id})">审批</button>`);
            }
            if (d.status === '已通过') {
                act.push(`<button class="btn btn-primary btn-sm" onclick="PageDemandPool.openComplete(${d.id})">🏁 完成</button>`);
            }
            if (d.status === '已驳回' && (d.requested_by === me.username || d.requested_name === me.name)) {
                act.push(`<button class="btn btn-secondary btn-sm" onclick="PageDemandPool.reopen(${d.id})">🔄 重新提审</button>`);
            }
            if (d.status !== '已完成') {
                act.push(`<button class="btn btn-secondary btn-sm" onclick="PageDemandPool.openEdit(${d.id})">编辑/排期</button>`);
            }
            if (canDel) {
                act.push(`<button class="btn btn-danger btn-sm" onclick="PageDemandPool.del(${d.id})">删除</button>`);
            }
            return `<tr>
                <td class="mono">${d.id}</td>
                <td><div style="font-weight:700;">${Utils.esc(d.title)}</div>
                    ${d.category ? `<span class="badge badge-secondary" style="font-size:10px;">${Utils.esc(d.category)}</span>` : ''}</td>
                <td style="max-width:220px;">${Utils.collapseText(String(d.description || ''), 60)}</td>
                <td>${Utils.esc(d.requested_name || d.requested_by) || '-'}</td>
                <td>${this._prioBadge(d.priority)}</td>
                <td><span class="badge ${this._stCls(d.status)}">${d.status}</span></td>
                <td>${Utils.esc(d.reviewer) || '-'}${d.review_comment ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${Utils.esc(d.review_comment)}</div>` : ''}</td>
                <td>${Utils.esc(d.owner) || '-'}<div style="font-size:11px;color:var(--text-muted);">计划 ${Utils.formatDate(d.planned_date)}</div></td>
                <td>${d.status === '已完成' ? `<span class="mono" style="color:var(--success);font-weight:700;">${Utils.formatDate(d.actual_date)}</span>` : '-'}</td>
                <td class="actions" style="white-space:nowrap;">${act.join(' ')}</td>
            </tr>`;
        }).join('');

        box.innerHTML = `<div class="card"><div class="cat-table-wrapper"><table>
            <thead><tr>
                <th>ID</th><th>标题 / 分类</th><th>需求材料·说明</th><th>提报人</th><th>优先级</th>
                <th>状态</th><th>审批</th><th>责任人 / 计划</th><th>完成时间</th><th>操作</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table></div></div>`;
    },

    async openEdit(id) {
        let d = {};
        if (id) {
            d = (this._list || []).find(x => x.id === id) || {};
            if (!d.id) { await this.load(); d = (this._list || []).find(x => x.id === id) || {}; }
        }
        const cats = (this._meta && this._meta.categories) || [];
        const catOpts = '<option value="">未分类</option>' + cats.map(c =>
            `<option value="${c}" ${d.category === c ? 'selected' : ''}>${c}</option>`).join('');
        const prioOpts = ['高', '中', '低'].map(p => `<option value="${p}" ${(d.priority || '中') === p ? 'selected' : ''}>${p}</option>`).join('');

        const canEditTitle = !d.status || d.status === '待审批' || d.status === '已驳回';
        const titleInput = canEditTitle
            ? `<input type="text" id="dp-title" value="${Utils.esc(d.title)}" placeholder="一句话说清要什么">`
            : `<input type="text" id="dp-title" value="${Utils.esc(d.title)}" disabled style="background:var(--panel-2);">`;
        const ownerInput = `<input type="text" id="dp-owner" value="${Utils.esc(d.owner || '')}" placeholder="责任处理人（排期时填）">`;

        Modal.open(`
            <h3>${id ? '编辑 / 排期需求 #' + d.id : '提一条部门需求'}</h3>
            <div class="form-group"><label>需求标题 *</label>${titleInput}</div>
            <div class="form-group"><label>需求材料 / 说明</label>
                <textarea id="dp-desc" rows="4" placeholder="说清背景、要什么数据/功能、验收标准等（纯文本）">${Utils.esc(d.description || '')}</textarea></div>
            <div class="form-row">
                <div class="form-group"><label>分类</label><select id="dp-cat">${catOpts}</select></div>
                <div class="form-group"><label>优先级</label><select id="dp-prio">${prioOpts}</select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>责任处理人</label>${ownerInput}</div>
                <div class="form-group"><label>计划完成日期</label><input type="date" id="dp-planned" value="${d.planned_date ? String(d.planned_date).substring(0,10) : ''}"></div>
            </div>
            ${id ? '' : `<div style="font-size:12px;color:var(--text-muted);">提报后将进入 <b>待审批</b>，由 李瑞林/刘子丽 任一审批。</div>`}
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="dp-save">${id ? '保存' : '提报'}${id && d.status === '已通过' ? '(通过后不可改标题)' : ''}</button>
            </div>`);
        document.getElementById('dp-save').onclick = () => this.save(id);
    },

    async save(id) {
        const title = document.getElementById('dp-title').value.trim();
        if (!title && !id) { Toast.error('需求标题不能为空'); return; }
        const data = {
            description: document.getElementById('dp-desc').value.trim(),
            category: document.getElementById('dp-cat').value,
            priority: document.getElementById('dp-prio').value,
            owner: document.getElementById('dp-owner').value.trim(),
            planned_date: document.getElementById('dp-planned').value,
        };
        if (title) data.title = title;
        const res = id
            ? await API.put(`/api/demand-pool/${id}`, data)
            : await API.post('/api/demand-pool', data);
        if (res) {
            Toast.success(id ? '已保存' : '已提报，等待审批');
            Modal.close();
            this.load();
        }
    },

    openReview(id) {
        Modal.open(`
            <h3>审批需求 #${id}</h3>
            <div class="form-group"><label>审批意见</label><textarea id="dp-rc" rows="3" placeholder="通过/驳回意见（可选）"></textarea></div>
            <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn btn-danger" id="dp-reject">沉 回</button>
                <button class="btn btn-primary" id="dp-approve">通 过</button>
            </div>`);
        document.getElementById('dp-approve').onclick = () => this.review(id, 'approve');
        document.getElementById('dp-reject').onclick = () => this.review(id, 'reject');
    },

    async review(id, action) {
        const btn = action === 'approve' ? document.getElementById('dp-approve') : document.getElementById('dp-reject');
        btn.disabled = true;
        const res = await API.post(`/api/demand-pool/${id}/review`, {
            action,
            comment: document.getElementById('dp-rc').value.trim(),
        });
        if (res && res.success) {
            Toast.success(action === 'approve' ? '已通过' : '已驳回');
            Modal.close();
            this.load();
        } else {
            Toast.error((res && res.message) || '审批失败');
            btn.disabled = false;
        }
    },

    openComplete(id) {
        Modal.open(`
            <h3>完成需求 #${id}</h3>
            <div class="form-group"><label>完成时间</label><input type="date" id="dp-actual" value="${this._localToday()}"></div>
            <p style="color:var(--text-muted);font-size:12px;margin:0;">标记完成后，状态将变为「已完成」，完成时间自动记录。</p>
            <div style="text-align:right;margin-top:12px;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="dp-complete">确认完成</button>
            </div>`);
        document.getElementById('dp-complete').onclick = async () => {
            const res = await API.post(`/api/demand-pool/${id}/complete`, {
                actual_date: document.getElementById('dp-actual').value,
            });
            if (res && res.success) { Toast.success('已标记完成'); Modal.close(); this.load(); }
            else Toast.error((res && res.message) || '操作失败');
        };
    },

    _localToday() {
        const t = new Date();
        return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    },

    async reopen(id) {
        if (!confirm('确定重新提审该需求？状态将回到「待审批」。')) return;
        // 复用编辑保存：仅改状态需后端支持；此处通过更新升级回待审批
        const res = await API.put(`/api/demand-pool/${id}`, { _reopen: true });
        if (res && res.success) { Toast.success('已重新提审'); this.load(); }
        else Toast.error('操作失败');
    },

    async del(id) {
        if (!confirm(`确定删除需求 #${id}？`)) return;
        const res = await API.del(`/api/demand-pool/${id}`);
        if (res && res.success) { Toast.success('已删除'); this.load(); }
        else Toast.error((res && res.message) || '删除失败');
    },
};
</script>
