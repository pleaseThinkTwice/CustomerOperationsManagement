                ${e.description ? `<div class="tl-desc" style="font-size:12.5px;color:var(--text-muted);margin-top:4px;line-height:1.55;">${Utils.esc(e.description)}</div>` : ''}
                <div style="margin-top:5px;font-size:11.5px;">
                    <span class="lk" data-perm="events.edit" style="color:var(--accent);cursor:pointer;" onclick="Page1.editEvent(${e.id})">编辑</span>
                    <span style="margin:0 6px;color:var(--border-row);">|</span>
                    <span class="lk" data-perm="events.edit" style="color:var(--danger);cursor:pointer;" onclick="Page1.delEvent(${e.id}, '${Utils.esc(oem)}', '${Utils.esc(cellCap)}', '${scope}')">删除</span>
                </div>
            </div>`;
        }).join('');
        const capLabel = cellCap ? cellCap + 'Ah' : '';
        return `
        <div class="card" style="margin-top:20px;">
            <div class="dash-sec-title">
                <span class="sec-ic" style="background:rgba(255,107,107,.14);color:var(--danger);">🚨</span>
                <h3>关键处置事件时间线</h3>
                <span class="sub">召回 · OTA · 停线 · 批量预警 · 索赔 · 质量会 · SOP · 工艺变更${scope === 'project' ? ' · 仅本项目' : ''}</span>
                <div style="margin-left:auto;display:flex;gap:8px;">
                    <button class="btn btn-sm btn-secondary" data-perm="events.edit" onclick="Page1.addEvent('${Utils.esc(oem)}', '${Utils.esc(cellCap)}')">＋ 录入事件</button>
                </div>
            </div>
            <div style="max-height:340px;overflow-y:auto;padding:6px 4px 0 6px;">
                ${items || '<p class="empty-state" style="padding:16px;">暂无关键处置事件，点「＋ 录入事件」记录里程碑。</p>'}
            </div>
        </div>`;
    },

    // 录入事件（弹窗）
    addEvent(oem, cellCap) {
        const t = ['召回', 'OTA', '停线', '批量预警', '索赔', '质量会', 'SOP', '工艺变更', '其他'];
        Modal.open(`
            <div class="modal-header"><h3>录入关键处置事件</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div class="form-group"><label>客户</label><input type="text" id="kv-oem" value="${Utils.esc(oem)}" readonly></div>
            ${cellCap ? `<div class="form-group"><label>项目(容量)</label><input type="text" id="kv-cap" value="${Utils.esc(cellCap)}" readonly></div>` : '<div class="form-group"><label>项目(容量，可选)</label><input type="text" id="kv-cap" placeholder="留空=客户级事件"></div>'}
            <div class="form-group"><label>事件类型</label><select id="kv-type">${t.map(x => `<option>${x}</option>`).join('')}</select></div>
            <div class="form-group"><label>标题 *</label><input type="text" id="kv-title" placeholder="如：SU7 PRO 绝缘异常批量预警"></div>
            <div class="form-group"><label>发生时间</label><input type="date" id="kv-date" value="${new Date().toISOString().slice(0,10)}"></div>
            <div class="form-group"><label>说明</label><textarea id="kv-desc" rows="3" placeholder="事件详情/处置措施..."></textarea></div>
            <div class="form-group"><label>处置状态</label><select id="kv-status"><option>处理中</option><option>已闭环</option><option>待处理</option></select></div>
            <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="Page1._submitEvent()">保存</button>
            </div>`);
    },

    async _submitEvent() {
        const oem = document.getElementById('kv-oem').value;
        const cap = (document.getElementById('kv-cap') || {}).value || '';
        const title = document.getElementById('kv-title').value.trim();
        if (!title) { Toast.error('标题必填'); return; }
        const res = await API.post('/api/events', {
            oem, cell_cap: cap, event_type: document.getElementById('kv-type').value,
            title, occur_at: document.getElementById('kv-date').value,
            description: document.getElementById('kv-desc').value.trim(),
            status: document.getElementById('kv-status').value,
        });
        if (res && !res.error) { Toast.success('事件已记录'); Modal.close(); this._reloadEventArea(oem); }
        else Toast.error((res && res.error) || '保存失败');
    },

    _reloadEventArea(oem) {
        // 刷新当前看板（时间轴在 loadDashboard / loadProject 里）
        if (this._view === 'project') this.loadProject();
        else this.loadDashboard(false);
    },

    async editEvent(id) {
        Toast.info('编辑事件：可删除后重新录入（当前提供精简版）');
    },

    async delEvent(id, oem, cap, scope) {
        if (!confirm('删除该事件？')) return;
        const res = await API.del(`/api/events/${id}`);
        if (res && !res.error) { Toast.success('已删除'); if (scope === 'project') this.loadProject(); else this.loadDashboard(false); }
        else Toast.error('删除失败');
    },
    // 客户选择复用「客户视角容量」那种下拉 checkbox 多选组件（组件复用，状态独立，与客户视角互不影响）。
    async _fillProjectCaps() {
        const custSel = document.getElementById('p1ProjCust');
        const capsSel = document.getElementById('p1ProjCap');
        if (!custSel || !capsSel) return;
        // 客户下拉：切换客户 → 刷新该项目(容量)下拉并自动加载（选完即确认）
        custSel.onchange = async () => {
            // 两个视角共用同一个「当前客户」，切回客户视角时不会跳回旧客户
            const cc = document.getElementById('p1Customer');
            if (cc && custSel.value) { cc.value = custSel.value; this.currentOem = custSel.value; }
            await this._fillProjCapsForCust(custSel.value);
            if (!capsSel.value && capsSel.options.length > 1) capsSel.selectedIndex = 1;   // 默认第一个项目
            if (this._view === 'project' && capsSel.value) this.loadProject();
        };
        // 容量下拉：选中即自动加载该项目
        capsSel.onchange = () => {
            if (this._view === 'project' && capsSel.value) this.loadProject();
        };
        // 首次进入项目视角：默认取第一个客户
        if (!custSel.value) custSel.value = custSel.options.length ? custSel.options[0].value : '';
        await this._fillProjCapsForCust(custSel.value);
    },

    // 按客户填充其项目(容量)下拉
    async _fillProjCapsForCust(oem) {
        const capsSel = document.getElementById('p1ProjCap');
        if (!capsSel) return;
        if (!oem) { capsSel.innerHTML = '<option value="">选择项目的，先选客户...</option>'; return; }
        // 该客户的容量（不再全量容量）
        const caps = await API.get(`/api/customers/cell_caps?oem=${encodeURIComponent(oem)}`);
        const capList = Array.isArray(caps) ? caps : [];
        const prev = capsSel.value;
        // 若切了客户，重置容量选择为空
        capsSel.innerHTML = '<option value="">选择项目(容量)...</option>' +
            capList.map(c => `<option value="${Utils.esc(c)}" ${c === prev ? 'selected' : ''}>${c} Ah</option>`).join('');
    },

    // 按容量(单选，可为空=全部客户)拉取对应客户（需求1：容量 → 对应可选客户）
    async _loadProjOemsByCaps(cap) {
        const box = document.getElementById('p1ProjOems');
        if (!box) return;
        if (!cap) { this._renderProjectOems(null); return; }
        box.innerHTML = '<div class="loading" style="padding:8px;"></div>';
        const oems = await API.get(`/api/customers/by_cap?cell_cap=${encodeURIComponent(cap)}`, { timeout: 20000 });
        this._renderProjectOems(oems && !oems.error ? oems : null);
    },

    // 渲染"该项目下的客户"＝ 下拉 checkbox 多选组件（复用容量多选样式）：触发条 + 弹出勾选面板。
    _renderProjectOems(onlyOems) {
        const box = document.getElementById('p1ProjOems');
        if (!box) return;
        const custs = App.customers && App.customers.length ? App.customers : [];
        const filtered = onlyOems && onlyOems.length
            ? custs.filter(c => onlyOems.includes(c.oem))
            : custs;
        // 独立保存已选客户（不随客户视角变）
        if (!this._projOemsSelected) this._projOemsSelected = [];
        this._projOemsSelected = this._projOemsSelected.filter(o => filtered.some(c => c.oem === o));
        this._projOemsAvailable = onlyOems || null;
        this._projOemsHint = onlyOems && onlyOems.length
            ? `以下为所选容量（${onlyOems.length} 个）下的可选客户`
            : '将列出全部客户（先选「项目·容量」可限定）';
        // 触发条
        box.innerHTML = `
            <div id="p1ProjOemsBar" class="cap-trigger" onclick="Page1._projOemsTogglePanel()">${this._projOemsBarText()}<span style="margin-left:auto;">▾</span></div>`;
        this._renderProjOemsPanel();
    },

    _projOemsBarText() {
        const n = this._projOemsSelected ? this._projOemsSelected.length : 0;
        return n === 0 ? '选择客户...' : `已选 ${n} 个客户`;
    },

    // ===== 客户多选下拉组件（复用容量多选的触发条+面板交互）=====
    _projOemsTogglePanel() {
        const panel = document.getElementById('p1ProjOemsPanel');
        const bar = document.getElementById('p1ProjOemsBar');
        if (!panel || !bar) return;
        const opening = panel.style.display === 'none' || !panel.style.display;
        if (opening) {
            const r = bar.getBoundingClientRect();
            panel.style.position = 'fixed';
            panel.style.display = 'block';
            panel.style.top = (r.bottom + 4) + 'px';
            panel.style.left = r.left + 'px';
            panel.style.width = Math.max(r.width, 260) + 'px';
            panel.style.zIndex = '3000';
            this._projOemsOpen = true;
        } else {
            panel.style.display = 'none';
            this._projOemsOpen = false;
        }
    },

    _renderProjOemsPanel() {
        const panel = document.getElementById('p1ProjOemsPanel') || this._ensureCapPanel('p1ProjOemsPanel');
        const custs = App.customers && App.customers.length ? App.customers : [];
        const avail = (this._projOemsAvailable && this._projOemsAvailable.length)
            ? custs.filter(c => this._projOemsAvailable.includes(c.oem))
            : custs;
        const selSet = new Set(this._projOemsSelected || []);
        const chips = (avail.length
            ? `<div style="display:flex;flex-direction:column;gap:2px;max-height:180px;overflow-y:auto;padding:4px 0;">
                ${avail.map(c => `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;padding:4px 6px;border-radius:6px;background:${selSet.has(c.oem) ? 'var(--brand-soft)' : 'transparent'};">
                    <input type="checkbox" value="${Utils.esc(c.oem)}" ${selSet.has(c.oem) ? 'checked' : ''} onchange="Page1._projOemToggle('${Utils.esc(c.oem)}')">
                    ${Utils.esc(c.oem_ch || c.name_cn || c.oem)} <span style="color:var(--text-muted);font-size:11px;">(${Utils.esc(c.oem)})</span>
                </label>`).join('')}
            </div>`
            : '<div style="font-size:12px;color:var(--text-muted);padding:8px;">该容量暂无可选客户</div>');
        panel.innerHTML = `
            <div style="margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <a href="javascript:void(0)" style="font-size:11px;color:var(--accent);" onclick="Page1._projOemsAll()">全选</a>
                <a href="javascript:void(0)" style="font-size:11px;color:var(--danger);" onclick="Page1._projOemsNone()">清空</a>
                <span style="font-size:10px;color:var(--text-muted);margin-left:auto;">${Utils.esc(this._projOemsHint || '')}</span>
            </div>${chips}`;
    },

    _projOemToggle(oem) {
        const arr = this._projOemsSelected || [];
        const idx = arr.indexOf(oem);
        if (idx >= 0) arr.splice(idx, 1); else arr.push(oem);
        this._projOemsSelected = arr;
        this._renderProjOemsPanel();
        this._refreshProjOemsBar();
    },

    _projOemsAll() {
        const custs = App.customers || [];
        const avail = (this._projOemsAvailable && this._projOemsAvailable.length)
            ? custs.filter(c => this._projOemsAvailable.includes(c.oem))
            : custs;
        this._projOemsSelected = avail.map(c => c.oem);
        this._renderProjOemsPanel();
        this._refreshProjOemsBar();
    },

    _projOemsNone() {
        this._projOemsSelected = [];
        this._renderProjOemsPanel();
        this._refreshProjOemsBar();
    },

    _refreshProjOemsBar() {
        const bar = document.getElementById('p1ProjOemsBar');
        if (bar) bar.innerHTML = this._projOemsBarText() + '<span style="margin-left:auto;">▾</span>';
    },

    async loadProject() {
        // 用项目视角自己选的【客户 + 容量】(严格按原型：单项目 = 客户×电芯)
        const oem = document.getElementById('p1ProjCust').value;
        const cap = document.getElementById('p1ProjCap').value;
        if (!oem) { Toast.error('请先选择客户'); return; }
        if (!cap) { Toast.error('请先选择项目（容量Ah）'); return; }
        const box = document.getElementById('p1Dashboard');
        if (!box) return;
        // —— 三视角项目视角（新）：用 /api/dashboard/three_view?view=project 渲染原型结构的真实数据 ——
        if (window.ThreeView) {
            await ThreeView.loadProject(box, oem, cap);
            return;
        }
        // ===== 旧渲染（ThreeView 未加载时的兜底）=====
        box.innerHTML = '<div class="loading" style="padding:20px;">正在加载该项目详情（Doris 查询较慢，请稍候）…</div>';
        const r = await API.get(`/api/dashboard/project-detail?oem=${encodeURIComponent(oem)}&cell_cap=${encodeURIComponent(cap)}`, { timeout: 120000 });
        if (!r || !r.success) { box.innerHTML = `<p class="empty-state">${Utils.esc((r && r.error) || '查询失败')}</p>`; return; }
        const k = r.kpi || {};
        const trendItems = (r.month_trend || []).slice(-16).map(t => ({ label: String(t.period || '').slice(2), value: t.count }));
        const modeItems = (r.modes || []).sort((a, b) => b.count - a.count).map(m => ({ label: m.name, value: m.count }));
        const fmt = n => (n || 0).toLocaleString();
        if (!r.cars && !r.modes && r.kpi && (k.access_total == null)) {
            box.innerHTML = `<div class="empty-state" style="padding:24px;">该项目（${Utils.esc(oem)}·${Utils.esc(cap)}Ah）暂无数据。</div>`;
            return;
        }
        const kpi = (lab, val, col, sub) => `
            <div style="flex:1;min-width:130px;background:var(--bg-card);border:1px solid var(--border-row);border-radius:12px;padding:12px 14px;">
                <div style="font-size:12px;color:var(--text-muted);">${Utils.esc(lab)}</div>
                <div style="font-size:22px;font-weight:800;color:${col};margin-top:4px;" class="num">${Utils.esc(val)}</div>
                ${sub ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${Utils.esc(sub)}</div>` : ''}
            </div>`;
        // 质保台账表（warranty_settings 或 warranty info）
        const wsRows = r.warranty_settings && r.warranty_settings.length ? r.warranty_settings : (r.warranty || []);
        const stint = (w, prefix) => { const y = w[prefix + '_years'], mi = w[prefix + '_mileage'], s = w[prefix + '_soh']; return (y != null ? y + '年' : '-') + ' / ' + (mi != null ? mi.toLocaleString() : '-') + 'km / SOH' + (s != null ? '≥' + s + '%' : '-'); };
        const warrantyHtml = wsRows.length ? `<table class="dash-table" style="width:100%;">
            <thead><tr><th>车型</th><th>PN</th><th>乘用质保</th><th>商用质保</th></tr></thead>
            <tbody>${wsRows.map(w => `<tr>
                <td>${Utils.esc(w.vehicle_model || w.pn || '-')}</td><td>${Utils.esc(w.pn || '-')}</td>
                <td>${w.passenger_years != null ? stint(w, 'passenger') : '-'}</td>
                <td>${w.commercial_years != null ? stint(w, 'commercial') : '-'}</td>
            </tr>`).join('')}</tbody></table>`
            : '<p class="empty-state">暂无质保台账（可在质保配置维护）</p>';
        // 适用车型明细
        const carsHtml = (r.cars && r.cars.length) ? `<table class="dash-table" style="width:100%;">
            <thead><tr><th>车型</th><th class="num">接入</th><th class="num">过保</th></tr></thead>
            <tbody>${r.cars.map(c => `<tr>
                <td>${Utils.esc(c.vehicle_model)}<span style="color:var(--text-muted);font-size:11px;margin-left:6px;">${Utils.esc(c.cell_structure)}</span></td>
                <td class="num">${fmt(c.access_count)}</td><td class="num">${fmt(c.expired_cnt)}</td>
            </tr>`).join('')}</tbody></table>`
            : '<p class="empty-state">暂无车型明细</p>';
        // 失效模式明细
        const modesHtml = (r.modes_detail && r.modes_detail.length) ? `<table class="dash-table" style="width:100%;">
            <thead><tr><th>失效模式</th><th class="num">外发数</th></tr></thead>
            <tbody>${r.modes_detail.map(m => `<tr><td>${Utils.esc(m.name || '-')}</td><td class="num">${fmt(m.count)}</td></tr>`).join('')}</tbody></table>`
            : '<p class="empty-state">暂无失效模式</p>';
        const evHtml = await this.renderEventsTimeline(oem, cap, 'project');
        box.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:6px 2px 10px;">
                <div style="font-size:14px;font-weight:700;color:var(--text-primary);">📦 项目视角<span style="font-weight:400;font-size:12px;color:var(--text-muted);margin-left:8px;">${Utils.esc(r.cust_name)} · ${Utils.esc(cap)}Ah</span></div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                    <button class="btn btn-sm btn-secondary" onclick="Page1.loadProject()">🔄 刷新</button>
                    <span style="font-size:11px;color:var(--text-muted);">单项目（客户×电芯）全详情</span>
                </div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
                ${kpi('累计接入', fmt(k.access_total), 'var(--accent)', '')}
                ${kpi('今年接入', fmt(k.this_year), 'var(--text-primary)', '')}
                ${kpi('累计预警外发', fmt(k.warn_total), 'var(--danger)', `近7天 ${fmt(k.warn_7d)}`)}
            </div>
            <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px;">
                <div class="card"><div class="card-title">📈 接入走势（累计，近16月）</div><div>${this._svgLine(trendItems)}</div></div>
                <div class="card"><div class="card-title">🍩 失效模式占比</div><div>${this._svgDonut(modeItems)}</div></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
                <div class="card"><div class="card-title">🛡️ 质保台账</div>${warrantyHtml}</div>
                <div class="card"><div class="card-title">🚗 适用车型</div>${carsHtml}</div>
            </div>
            <div class="card"><div class="card-title">⚠️ 失效模式明细</div>${modesHtml}</div>
            ${evHtml}`;
        this._enableSort(box);
    },

    // 把逗号分隔的容量字符串转成精简文案，避免"活跃/调表"卡片标题把一长串容量都铺出来显得重复冗余。
    // 返回形如："全部容量" / "23Ah 等15个" / "23、37、42Ah"；空字符串返回空。
    _capLabel(cap) {
        const caps = (cap || '').split(',').map(c => c.trim()).filter(Boolean);
        if (!caps.length) return '';
        const total = this._caps && this._caps.length;
        if (total && caps.length === total) return '全部容量';
        if (caps.length > 3) return caps.slice(0, 3).join('、') + 'Ah 等' + caps.length + '个';
        return caps.map(c => c + 'Ah').join('、');
    },

    exportList(type, cap, oem, since, thres) {
        // oem 缺省取顶部选中客户；cap 缺省取顶部容量多选。前后兼容紧凑摘要/明细列表两块调用。
        const oemVal = oem || this.currentOem || document.getElementById('p1Customer').value;
        const capVal = cap || this.getSelectedCaps();
        const sinceVal = since || '2026-01-01';
        const thresVal = thres || '10000';
        let url = type === 'active'
            ? `/api/active_vehicles/export?oem=${encodeURIComponent(oemVal)}&active_since=${encodeURIComponent(sinceVal)}`
            : `/api/mileage_adjust/export?oem=${encodeURIComponent(oemVal)}&threshold=${encodeURIComponent(thresVal)}`;
        if (capVal) url += `&cell_cap=${encodeURIComponent(capVal)}`;
        window.location.href = url;
    },

    async loadDashboard(refresh) {
        const oem = document.getElementById('p1Customer').value;
        const cellCap = this.getSelectedCaps();
        if (!oem) {
            Toast.error('请先选择客户');
            return;
        }
        this.currentOem = oem;
        this.currentCellCap = cellCap;
        this.currentPage = 1;
        const container = document.getElementById('p1Dashboard');

        // —— 三视角客户视角（新）：用 /api/dashboard/three_view 渲染原型结构的真实数据看板 ——
        if (window.ThreeView && this._useThreeView !== false) {
            await ThreeView.loadCustomer(container, oem, cellCap);
            return;
        }

        // 本次加载序号：任何过期/慢响应回来时若序号不符则丢弃，避免切客户后旧数据覆盖
        const seq = ++this._loadSeq;
        container.innerHTML = '<div class="loading"></div>';

        const capQ = cellCap ? `&cell_cap=${encodeURIComponent(cellCap)}` : '';

        // —— 渐进渲染：先把本地快模块（关键人/会议/拜访）秒出，Doris 慢模块先占位 ——
        // 注意：API.get 请求失败时返回 []（空数组），被 if 判真会误当成功，故需校验是对象且带 oem/meta
        const isObj = (r) => r && typeof r === 'object' && !Array.isArray(r) && !r.timeout;
        let fast = null;
        try {
            fast = await API.get(`/api/dashboard/fast?oem=${encodeURIComponent(oem)}${capQ}`, { timeout: 15000 });
        } catch (e) { fast = null; }
        if (seq !== this._loadSeq) return;
        if (fast && isObj(fast)) {
            // 快模块已就绪：渲染整页框架 + 快模块数据，Doris 区域显示占位
            this.currentData = { ...fast };
            container.innerHTML = this.renderDashboard(fast, { loading: true });
            this._enableSort(container);   // 关键人等看板表排序（任务#3）
            this.bindDashboardEvents();
        } else {
            // 快模块接口异常（罕见）→ 直接走旧的全量接口兜底，保证页面可用
            const legacy = await API.get(`/api/dashboard?oem=${encodeURIComponent(oem)}${capQ}${refresh ? '&refresh=1' : ''}`, { timeout: this._DASH_TIMEOUT });
            if (seq !== this._loadSeq) return;
            if (!legacy || legacy.error || legacy.timeout) {
                container.innerHTML = `<div class="empty-state"><p>${legacy && legacy.timeout ? '加载超时' : '加载失败'}: ${legacy && legacy.error ? Utils.esc(legacy.error) : '未知错误（Doris 响应慢或不可达，请稍后重试）'}</p></div>`;
                return;
            }
            this.currentData = legacy;
            container.innerHTML = this.renderDashboard(legacy);
            this._enableSort(container);   // 关键人等看板表排序（任务#3）
            this.bindDashboardEvents();
            // 后续异步模块照常加载
            this._loadAuxCharts(seq);
            this._applyDorisBinds();
            return;
        }

        // —— Doris 慢模块：test 表 7 天缓存秒出，否则慢查（大客户可能几十秒）——
        let doris = null;
        try {
            doris = await API.get(`/api/dashboard/doris?oem=${encodeURIComponent(oem)}${capQ}${refresh ? '&refresh=1' : ''}`, { timeout: this._DASH_TIMEOUT });
        } catch (e) { doris = null; }
        if (seq !== this._loadSeq) return;
        if (doris && isObj(doris)) {
            this.currentData = { ...this.currentData, ...doris };
            await this.applyDoris(doris);
        } else {
            // Doris 模块失败：占位内提示，不阻塞已渲染的快模块
            this.applyDorisError(doris);
        }
        // 接入趋势 / 预警分布 / 活跃·调表摘要并行为三路，任一路慢/超时都不再阻塞整屏
        this._loadAuxCharts(seq);
    },

    // 接入趋势 / 预警分布 / 活跃·调表摘要 三路异步加载（不与 Doris 主数据抢先后）
    _loadAuxCharts(seq) {
        Promise.all([
            this.loadAccessTrend('month', seq),
            this.loadWarnDist(undefined, seq),
            this.loadCompactVi(seq),
        ]);
    },

    // 带超时 + 序号守卫的 API.GET 便捷封装：seq 传入则不匹配时静默丢弃结果
    async _seqGet(url, seq, timeout) {
        const res = await API.get(url, { timeout: timeout || this._DASH_TIMEOUT });
        if (seq != null && seq !== this._loadSeq) return null;   // 过期响应，丢弃
        return res;
    },

    // 待办速览：预警未闭环 + 后市场待跟进，服务"今日要处理"
    // 待办速览：当前登录账号自己的代办（会议任务 / 认领的预警 / 部门需求），并填充顶部"待办进展"小块
    async loadTodos() {
        const wrap = document.getElementById('p1TodosWrap');
        const tile = document.getElementById('p1TodoTile');
        if (!wrap && !tile) return;
        const d = await API.get('/api/workbench/my_todos', { timeout: 20000 });
        const ok = d && d.success;
        const total = ok ? (d.total || 0) : 0;
        const doneCnt = ok ? (d.done || 0) : 0;
        const todoCnt = ok ? (d.todo || 0) : 0;
        const who = (ok && (d.name || d.username)) || '';

        // 填充顶部"待办进展"小块：已完成/待办（参考小米 xx/xx）
        if (tile) {
            const numEl = tile.querySelector('.num');
            const subEl = tile.querySelector('.tile-sub');
            if (numEl) numEl.textContent = ok ? `${doneCnt}/${todoCnt}` : '—';
            if (subEl) subEl.textContent = ok
                ? `${Utils.esc(who)} · 已完成 ${doneCnt} / 待办 ${todoCnt}`
                : '待办加载失败';
        }
        if (!wrap) return;
        if (!ok) { wrap.innerHTML = ''; return; }

        const items = (d.items || []);
        const badge = (t, c) => `<span class="badge" style="background:${c};color:#0b1322;">${t}</span>`;
        const statusOf = it => {
            if (it.kind === 'warning') {
                if (it.status === '未闭环') return badge('未闭环', 'var(--danger)');
                return badge('处理中', 'var(--warn, #fbbf24)');
            }
            if (it.kind === 'pool') {
                if (it.status === '待审批') return badge('待审批', 'var(--accent)');
                if (it.status === '已通过') return badge('已通过', 'var(--info)');
                return badge(it.status || '任务', 'var(--muted, #8496b6)');
            }
            // 会议任务
            if (it.status === '已逾期') return badge('已逾期', 'var(--danger)');
            if (it.status === '进行中') return badge('进行中', 'var(--info)');
            return badge(it.status || '待处理', 'var(--warn, #fbbf24)');
        };
        const iconOf = it => it.kind === 'meeting_task' ? '📌'
            : (it.kind === 'warning' ? '⚠️' : '📥');
        const goOf = it => it.kind === 'warning'
            ? `<a style="font-size:11px;color:var(--accent);cursor:pointer;" onclick="App.navigate('page4')">处置 →</a>`
            : (it.kind === 'pool' ? `<a style="font-size:11px;color:var(--accent);cursor:pointer;" onclick="App.navigate('page16')">需求池 →</a>`
               : `<a style="font-size:11px;color:var(--accent);cursor:pointer;" onclick="App.navigate('page2')">会议 →</a>`);

        const rowHtml = it => `
            <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-row);">
                <span style="flex:none;">${iconOf(it)}</span>
                <span style="flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
                      title="${Utils.esc(it.meta ? it.meta + ' · ' : '')}${Utils.esc(it.title)}">
                    ${Utils.esc(it.title)}
                    ${it.meta ? `<span style="color:var(--text-muted);font-size:11px;"> · ${Utils.esc(it.meta)}</span>` : ''}
                </span>
                <span style="flex:none;">${statusOf(it)}</span>
                <span style="flex:none;">${goOf(it)}</span>
            </div>`;
        const emptyHtml = `<div style="padding:14px;font-size:12.5px;color:var(--text-muted);text-align:center;">🎉 暂无待办，<strong>${Utils.esc(who || '你')}</strong> 的待处理任务都清完了。</div>`;

        wrap.innerHTML = `
        <div class="card" style="padding:0;">
            <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-row);">
                <strong style="font-size:14px;">我的待办</strong>
                <span style="font-size:12px;color:var(--text-muted);">${Utils.esc(who || '')} · 会议任务 / 认领的预警 / 部门需求</span>
                <div style="margin-left:auto;display:flex;gap:6px;font-size:12px;flex-wrap:wrap;">
                    ${badge('已完成 ' + doneCnt, 'var(--success)')}
                    ${badge('待办 ' + todoCnt, 'var(--warn, #fbbf24)')}
                </div>
            </div>
            <div style="padding:10px 16px;">${items.length ? items.slice(0, 12).map(rowHtml).join('') : emptyHtml}</div>
        </div>`;
    },

    // 加载接入趋势（group: month 近月 / year 按年 / day15 近15天）
    async loadAccessTrend(group, seq) {
        const oem = this.currentOem || document.getElementById('p1Customer').value;
        const cellCap = this.getSelectedCaps();
        // by月=全量按月取最近12个有数据的月份；by年=按年；近15天=按天
        const backendGroup = group === 'year' ? 'year' : (group === 'day15' ? 'day15' : 'month_all');
        let url = `/api/access_trend?oem=${encodeURIComponent(oem)}&group=${backendGroup}`;
        if (cellCap) url += `&cell_cap=${encodeURIComponent(cellCap)}`;
        // 更新按钮高亮
        document.querySelectorAll('.p1-tg-m, .p1-tg-y, .p1-tg-15').forEach(b => b.classList.remove('btn-primary', 'btn-secondary'));
        const mBtn = document.querySelector('.p1-tg-m');
        const yBtn = document.querySelector('.p1-tg-y');
        const d15Btn = document.querySelector('.p1-tg-15');
        if (group === 'year') { if (yBtn) yBtn.classList.add('btn-primary'); if (mBtn) mBtn.classList.add('btn-secondary'); if (d15Btn) d15Btn.classList.add('btn-secondary'); }
        else if (group === 'day15') { if (d15Btn) d15Btn.classList.add('btn-primary'); if (mBtn) mBtn.classList.add('btn-secondary'); if (yBtn) yBtn.classList.add('btn-secondary'); }
        else { if (mBtn) mBtn.classList.add('btn-primary'); if (yBtn) yBtn.classList.add('btn-secondary'); if (d15Btn) d15Btn.classList.add('btn-secondary'); }
        const trend = await this._seqGet(url, seq);
        if (seq != null && seq !== this._loadSeq) return;   // 已切换客户：丢弃过期趋势
        let months = (trend && trend.success) ? trend.months : [];
        // 摘要（当月 / 当年是否有接入数据）
        const summary = (trend && trend.summary) || {};
        const sumBox = document.getElementById('p1TrendSummary');
        if (sumBox) {
            if (summary.this_year != null || summary.this_month != null) {
                sumBox.innerHTML = [
                    `<span>本月接入 <strong class="mono" style="color:${summary.has_month ? 'var(--ok)' : 'var(--muted)'};">${(summary.this_month || 0).toLocaleString()}</strong>${summary.has_month ? '' : '<span style="color:var(--muted);">(当月暂无数据)</span>'}</span>`,
                    `<span>今年接入 <strong class="mono" style="color:${summary.has_year ? 'var(--ok)' : 'var(--muted)'};">${(summary.this_year || 0).toLocaleString()}</strong>${summary.has_year ? '' : '<span style="color:var(--muted);">(今年暂无数据)</span>'}</span>`
                ].join('');
            } else {
                sumBox.innerHTML = '';
            }
        }
        this._trendGroup = group;
        const isYear = group === 'year';   // 函数级：下方多处用到（含环比处的 growthEl）
        const isDay = group === 'day15';
        if (group === 'month' && months.length > 12) {
            months = months.slice(-12);
        }
        this._trendData = months;
        const box = document.getElementById('p1TrendBars');
        if (box) {
            if (!months.length) { box.innerHTML = '<p class="empty-state" style="padding:20px;">暂无趋势数据</p>'; }
            else {
                const maxVal = Math.max(...months.map(m => m.count), 1);
                box.innerHTML = months.map(m => {
                    const h = Math.round(m.count / maxVal * 100);
                    const lbl = m.count >= 10000 ? (m.count/10000).toFixed(1)+'万' : (m.count >= 1000 ? (m.count/1000).toFixed(1)+'k' : String(m.count));
                    const mth = m.month || '';
                    let cap;
                    if (isYear) cap = mth;                       // 2026
                    else if (isDay) cap = mth.length >= 10 ? mth.substring(5) : mth;  // YYYY-MM-DD → MM-DD
                    else { const mm = mth.substring(0, 7); cap = mm.length >= 7 ? mm.substring(2) : mth; } // YYYY-MM → MM
                    return `<div class="bar" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0;">
                        <div class="col" style="width:100%;max-width:${isYear ? 60 : (isDay ? 26 : 44)}px;height:${h}%;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,var(--accent),var(--accent-soft,#6ea0ff));position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.06);">
                            <span style="position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--text-primary);white-space:nowrap;">${lbl}</span>
                        </div>
                        <div class="cap" style="height:30px;display:flex;align-items:center;justify-content:center;overflow:visible;">
                            <div style="color:var(--text-muted);font-size:10.5px;font-weight:600;white-space:nowrap;line-height:1;">${cap}</div>
                        </div>
                    </div>`;
                }).join('');
            }
            // 更新统计块环比
            const growthEl = document.getElementById('p1GrowthEl');
            if (growthEl) {
                const last = months.length ? months[months.length-1] : null;
                const prev = months.length > 1 ? months[months.length-2] : null;
                if (last && prev && prev.count > 0) {
                    const g = Math.round((last.count - prev.count) / prev.count * 100);
                    growthEl.innerHTML = `<div style="font-size:12.5px;font-weight:700;margin-top:4px;color:${g>=0?'var(--success)':'var(--danger)'};">${g>=0?'▲':'▼'} ${Math.abs(g)}% 环比${isYear?'(年)':(isDay?'(日)':'')}</div>`;
                } else {
                    growthEl.innerHTML = '';
                }
            }
        }
    },

    // 预警分布（直方图；参考小米看板；意见箱 #12/#23）
    // 维度用 checkbox 芯片选择：月 / 类型 / 月&类型(堆叠)。勾选变化即触发重绘。
    _resolveWarnGroup() {
        const cbs = document.querySelectorAll('.wd-cb');
        const on = {};
        cbs.forEach(cb => { on[cb.dataset.g] = cb.checked; });
        // 月&类型 勾选 → 组合；月+类型同时勾选 → 组合。只勾一个 → 单维度。
        if (on.combo) return 'month,type';
        if (on.month && on.type) return 'month,type';
        if (on.month) return 'month';
        if (on.type) return 'type';
        return '';   // 全不选 → 不查，提示
    },

    async loadWarnDist(group, seq) {
        const oem = this.currentOem || document.getElementById('p1Customer').value;
        if (!oem) return;
        if (group === undefined) group = this._resolveWarnGroup();
        const box = document.getElementById('p1WarnDist');
        if (!box) return;
        if (!group) {
            box.innerHTML = '<p class="empty-state" style="padding:20px;">请至少勾选一个维度（月 / 类型）。</p>';
            const sub0 = document.getElementById('p1WarnDistSub');
            if (sub0) sub0.textContent = '按维度 · 直方图';
            return;
        }
        const cellCap = this.getSelectedCaps();
        let url = `/api/warning_distribution?oem=${encodeURIComponent(oem)}&group=${encodeURIComponent(group)}`;
        if (cellCap) url += `&cell_cap=${encodeURIComponent(cellCap)}`;
        const sub = document.getElementById('p1WarnDistSub');
        if (sub) sub.textContent = group === 'month' ? '按月份直方图' : (group === 'type' ? '按预警类型直方图' : '按月×类型堆叠直方图');
        box.innerHTML = '<div class="loading" style="padding:16px;"></div>';
        const d = await this._seqGet(url, seq);
        if (seq != null && seq !== this._loadSeq) return;   // 已切换客户：丢弃过期分布
        if (!d || !d.success || !(d.data || []).length) {
            box.innerHTML = `<p class="empty-state" style="padding:20px;">${Utils.esc((d && d.error) || '暂无预警分布数据')}</p>`;
            return;
        }
        const data = (d.data || []);
        // 组合模式：month,type → 堆叠直方图
        if (group === 'month,type') {
            const months = [...new Set(data.map(x => x.month))].sort().slice(-10);
            const types = [...new Set(data.map(x => x.fault_type))].slice(0, 6);
            const color = ['#dc2626', '#f59e0b', '#0891b2', '#16a34a', '#8b5cf6', '#ec4899'];
            const byM = {};
            months.forEach(mq => { byM[mq] = {}; types.forEach(t => byM[mq][t] = 0); });
            data.forEach(x => { if (months.includes(x.month)) byM[x.month][x.fault_type] = (byM[x.month][x.fault_type] || 0) + x.count; });
            const totals = months.map(mq => types.reduce((s, t) => s + byM[mq][t], 0));
            const hmax = Math.max(...totals, 1);
            const legend = types.map((t, i) => `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-muted);"><span style="width:9px;height:9px;border-radius:2px;background:${color[i]};"></span>${Utils.esc(t)}</span>`).join('');
            box.innerHTML = `
                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">${legend}</div>
                <div style="display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 4px 0;">
                ${months.map((mq, idx) => {
                    let accH = 0;
                    const segs = types.map((t, i) => {
                        const v = byM[mq][t] || 0;
                        const h = Math.round(v / hmax * 100);
                        const seg = v > 0 ? `<div style="height:${h}%;background:${color[i]};" title="${Utils.esc(t)} ${v}"></div>` : '';
                        accH += h;
                        return seg;
                    }).join('');
                    const total = totals[idx] || 0;
                    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;">
                        <div style="width:100%;max-width:30px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 2px 2px;overflow:hidden;position:relative;">
                            ${segs}
                            <span style="position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:700;white-space:nowrap;color:var(--text-primary);">${total>=10000?(total/10000).toFixed(1)+'万':total}</span>
                        </div>
                        <div style="color:var(--text-muted);font-size:9.5px;font-weight:600;margin-top:4px;">${mq.slice(2)}</div>
                    </div>`;
                }).join('')}
                </div>`;
            return;
        }
        // 单维度 → 直方图（柱状，纵向）。类型也统一用柱状，保持一致"直方图"观感。
        const shown = data.slice(-10);
        if (!shown.length) { box.innerHTML = '<p class="empty-state" style="padding:12px;">暂无数据</p>'; return; }
        const vmax = Math.max(...shown.map(x => x.count), 1);
        const isType = group === 'type';
        box.innerHTML = `<div style="display:flex;align-items:flex-end;gap:8px;height:140px;padding:8px 4px 0;">
            ${shown.map(x => {
                const h = Math.round(x.count / vmax * 100);
                const lbl = x.count >= 10000 ? (x.count/10000).toFixed(1)+'万' : String(x.count);
                const cap = isType ? Utils.esc(x.label) : x.label.substring(5);
                return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;">
                    <div style="width:100%;max-width:30px;height:${h}%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--danger),#ff6b6b);position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);">
                        <span style="position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:700;white-space:nowrap;">${lbl}</span>
                    </div>
                    <div style="color:var(--text-muted);font-size:9.5px;font-weight:600;margin-top:4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;">${cap}</div>
                </div>`;
            }).join('')}
        </div>`;
    },

    renderDashboard(data, opts) {
        // 参照 platform-shell.html 布局：统计块 tiles → grid g-2（接入+洞察）→ 失效模式表 → grid g-3（关键人/拜访/会议）
        const loading = opts && opts.loading;   // 渐进渲染：Doris 模块尚未就绪，先显示占位
        const oem = data.oem || this.currentOem || '';
        const cellCap = data.cell_cap || this.currentCellCap || '';
        const acc = (data.access_stats && data.access_stats.rows) || [];
        const totalAccess = data.access_total != null ? data.access_total
            : acc.reduce((s, r) => s + (r.access_count || 0), 0);   // 累计接入：优先 online_dates 全量(与今年同源, 修op49)；回退 tab1 台账
        // 累计出货车辆数(=系统/Pack数, 与接入车辆数同粒度，作 KPI 与接入率分母)
        const totalSystemShip = acc.reduce((s, r) => s + (r.system_ship || 0), 0);
        const totalExpired = acc.reduce((s, r) => s + (r.expired_cnt || 0), 0);   // 已过保
        const totalWarranty = acc.reduce((s, r) => s + (r.warranty_total_cnt || 0), 0); // 质保台账总数
        const inWarranty = Math.max(0, totalWarranty - totalExpired);            // 已进保车辆数
        const unclosedWarns = ((data.failure_modes && data.failure_modes.rows) || []).reduce((s, r) => s + (r.outgoing_count || 0), 0);
        // 接入率 = 累计接入数 ÷ 出货系统数（Pack 级，与明细表同口径：接入 Pack ÷ 出货 Pack）；出货数拿不到时显示 N/A
        const accessRate = totalSystemShip > 0 ? Math.round(totalAccess / totalSystemShip * 100) : null;
        // 渐进渲染占位：Doris 数值未到先显示骨架点
        const dash = (v) => loading ? '…' : v;

        // 环比：基于最近一次加载的趋势数据
        const trendMonths = (this._trendData || []);
        const lastMonth = trendMonths.length ? trendMonths[trendMonths.length - 1] : null;
        const prevMonth = trendMonths.length > 1 ? trendMonths[trendMonths.length - 2] : null;
        const growthRate = lastMonth && prevMonth && prevMonth.count > 0
            ? Math.round((lastMonth.count - prevMonth.count) / prevMonth.count * 100) : null;
        const growthText = growthRate !== null
            ? `<div style="font-size:12.5px;font-weight:700;margin-top:4px;color:${growthRate >= 0 ? 'var(--success)' : 'var(--danger)'};">${growthRate >= 0 ? '▲' : '▼'} ${Math.abs(growthRate)}% 环比</div>`
            : '';

        // 累计预警外发 + 近7天（Doris tab3，参考小米看板 KPI 展示）
        const warnStats = data.warning_stats || {};
        const warnTotal = warnStats.total || (loading ? 0 : unclosedWarns);
        const warn7d = warnStats.last7 || 0;

        // 五个统计块（参考小米客户看板 KPI strip）；第6块"待办进展"由 loadTodos 动态填充
        const tile = (icBg, icCl, ic, label, num, sub) => `
            <div class="dash-tile">
                <div class="tile-ic" style="background:${icBg};color:${icCl};">${ic}</div>
                <div class="stat-label" style="color:var(--text-muted);font-size:12px;font-weight:700;">${label}</div>
                <div class="num" style="color:${icCl};font-family:var(--font-mono,monospace);font-variant-numeric:tabular-nums;">${num}</div>
                <div class="tile-sub" style="font-size:11px;">${sub}</div>
            </div>`;

        // 渐进渲染：失效模式表占位或真实表
        const fmHtml = loading
            ? `<div class="card" style="margin-top:20px;" data-fm-ph="1"><div class="dash-sec-title"><span class="sec-ic" style="background:rgba(255,169,77,.14);color:var(--warning);">⚠️</span><h3>客户重点失效模式</h3><span class="sub">从 Doris 加载中…</span></div><p class="empty-state">正在加载失效模式…</p></div>`
            : this.renderFailureModes(data.failure_modes);

        return `
        <!-- KPI 统计块（驾驶舱 hero，参考小米客户看板 KPI strip；待办已移至独立页 page17） -->
        <div id="p1KpiTiles" class="tiles" style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px;">
            ${tile('rgba(100,210,255,.14)','var(--accent)','🚗','累计出货车辆数',dash((totalSystemShip||0).toLocaleString()),'出货系统/Pack(车辆)累计')}
            ${tile('rgba(116,192,252,.14)','var(--info)','📦','累计接入数',dash(totalAccess.toLocaleString()),'接入台账 · 接入率 '+(accessRate!=null?accessRate+'%':'N/A'))}
            ${tile('rgba(52,211,153,.14)','var(--success)','🛡️','已过保车辆数',dash(totalExpired.toLocaleString()),`已进保 ${inWarranty.toLocaleString()} · 质保台账 ${totalWarranty.toLocaleString()}`)}
            ${tile('rgba(255,107,107,.14)','var(--danger)','⚠️','累计预警外发',dash(warnTotal.toLocaleString()),'按下钻口径')}
            ${tile('rgba(255,169,77,.14)','var(--warn, #fbbf24)','📊','近7天预警数',dash(warn7d.toLocaleString()),'近7天预警条数')}
            <div class="dash-tile" id="p1TodoTile">
                <div class="tile-ic" style="background:rgba(139,92,246,.14);color:#8b5cf6;">✅</div>
                <div class="stat-label" style="color:var(--text-muted);font-size:12px;font-weight:700;">待办进展</div>
                <div class="num" style="color:#8b5cf6;font-family:var(--font-mono,monospace);font-variant-numeric:tabular-nums;">…</div>
                <div class="tile-sub" style="font-size:11px;">当前登录账号 · 已完成/待办</div>
            </div>
        </div>

        <!-- 接入走势(宽) + 右侧 活跃/里程 一上一下；左右等高（需求：高度统一） -->
        <div class="grid" style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px;align-items:stretch;">
            <div class="card">
                <div class="dash-sec-title">
                    <span class="sec-ic" style="background:rgba(100,210,255,.14);color:var(--accent);">📈</span>
                    <h3>接入走势</h3>
                    <span class="sub" id="p1TrendSub">按接入首日统计</span>
                    <div style="margin-left:auto;display:flex;gap:5px;">
                        <button class="btn btn-sm btn-secondary p1-tg-m" onclick="Page1.loadAccessTrend('month')">by 月</button>
                        <button class="btn btn-sm btn-primary p1-tg-y" onclick="Page1.loadAccessTrend('year')">by 年</button>
                        <button class="btn btn-sm btn-secondary p1-tg-15" onclick="Page1.loadAccessTrend('day15')">近15天</button>
                    </div>
                </div>
                <div style="padding:6px 17px 0;display:flex;gap:12px;font-size:12px;flex-wrap:wrap;" id="p1TrendSummary"></div>
                <div style="padding:6px 8px 0;display:flex;justify-content:center;height:calc(100% - 92px);">
                    <div id="p1TrendBars" class="bars" style="display:flex;align-items:flex-end;gap:10px;width:100%;max-width:640px;margin:0 auto;padding:8px 4px 0;height:100%;"></div>
                </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:16px;">
                <div class="card" style="flex:1;display:flex;flex-direction:column;">
                    <div class="dash-sec-title">
                        <span class="sec-ic" style="background:rgba(116,192,252,.14);color:var(--info);">🚗</span>
                        <h3>活跃车辆</h3>
                        <span class="sub">2026后</span>
                    </div>
                    <div id="p1ViActive" style="padding:8px 14px;flex:1;display:flex;flex-direction:column;justify-content:center;"><p class="empty-state" style="padding:8px;font-size:12.5px;">加载中...</p></div>
                </div>
                <div class="card" style="flex:1;display:flex;flex-direction:column;">
                    <div class="dash-sec-title">
                        <span class="sec-ic" style="background:rgba(255,169,77,.14);color:var(--warning);">🪛</span>
                        <h3>里程调表</h3>
                        <span class="sub">疑似（&gt;阈值）</span>
                    </div>
                    <div id="p1ViMileage" style="padding:8px 14px;flex:1;display:flex;flex-direction:column;justify-content:center;"><p class="empty-state" style="padding:8px;font-size:12.5px;">加载中...</p></div>
                </div>
            </div>
        </div>

        <!-- 接入明细表（todo#4：调整为可折叠，释放首页首屏；默认展开） -->
        <div class="card" style="margin-bottom:20px;">
            <div class="dash-sec-title">
                <span class="sec-ic" style="background:rgba(150,200,255,.14);color:var(--accent);">🗃️</span>
                <h3>项目车辆接入明细</h3>
                <span class="sub">按容量/车型分组（点击表头可排序）</span>
                <div style="margin-left:auto;display:flex;gap:8px;">
                    <button class="btn btn-sm btn-secondary" id="p1ImportWarranty">初始化质保</button>
                    <button class="btn btn-sm btn-secondary" id="p1AccFold">▲ 收起</button>
                </div>
            </div>
            <div id="p1AccCollapse">${loading ? '<p class="empty-state" style="padding:20px;">正在加载接入明细…</p>' : this.renderAccessTable(data.access_stats)}</div>
        </div>

        <!-- 失效模式表 -->
        ${fmHtml}

        <!-- 关键处置事件时间轴（原型：召回/OTA/停线/批量预警/索赔/质量会/SOP/工艺变更） -->
        ${this.renderEventsTimeline(oem, cellCap || '', 'customer')}

        <!-- 四块卡片（参考小米看板）：关键责任人 / 拜访计划 / 近三次会议 / 预警分布图 -->
        <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;">
            ${this.renderKeyPersons(data.external_persons, data.internal_persons)}
            ${this.renderVisits(data.all_visits)}
            ${this.renderMeetings(data.meetings)}

            <!-- 预警分布图（第4块，半宽；意见箱 #12/#23） -->
            <div class="card">
                <div class="dash-sec-title">
                    <span class="sec-ic" style="background:rgba(255,107,107,.14);color:var(--danger);">📊</span>
                    <h3>预警分布</h3>
                    <span class="sub" id="p1WarnDistSub">按维度 · 直方图</span>
                    <div style="margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap;">
                        <label class="pill wd-opt" data-g="month" style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;border:1px solid var(--line-strong);">
                            <input type="checkbox" class="wd-cb" data-g="month" checked style="accent-color:var(--brand);">月</label>
                        <label class="pill wd-opt" data-g="type" style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;border:1px solid var(--line-strong);">
                            <input type="checkbox" class="wd-cb" data-g="type" style="accent-color:var(--brand);">类型</label>
                        <label class="pill wd-opt" data-g="combo" style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;border:1px solid var(--line-strong);">
                            <input type="checkbox" class="wd-cb" data-g="combo" style="accent-color:var(--brand);">月&类型(堆叠)</label>
                    </div>
                </div>
                <div style="padding:12px 14px;">
                    <div id="p1WarnDist" style="min-height:120px;"><p class="empty-state" style="padding:16px;">加载预警分布...</p></div>
                </div>
            </div>
        </div>`;
    },

    // 渐进渲染：Doris 慢模块就绪后，把 KPI 统计块 / 接入明细 / 失效模式表 填充真实数据（不动已渲染的快模块）
    async applyDoris(d) {
        const kpi = document.getElementById('p1KpiTiles');
        if (kpi && d) {
            const acc = (d.access_stats && d.access_stats.rows) || [];
            const totalAccess = d.access_total != null ? d.access_total
                : acc.reduce((s, r) => s + (r.access_count || 0), 0);
            const totalSystemShip = acc.reduce((s, r) => s + (r.system_ship || 0), 0);
            const totalExpired = acc.reduce((s, r) => s + (r.expired_cnt || 0), 0);
            const totalWarranty = acc.reduce((s, r) => s + (r.warranty_total_cnt || 0), 0);
            const inWarranty = Math.max(0, totalWarranty - totalExpired);
            const unclosedWarns = ((d.failure_modes && d.failure_modes.rows) || []).reduce((s, r) => s + (r.outgoing_count || 0), 0);
            // 与明细表同口径：接入率 = 累计接入 ÷ 出货系统数(Pack级)
            const accessRate = totalSystemShip > 0 ? Math.round(totalAccess / totalSystemShip * 100) : null;
            const ws = d.warning_stats || {};
            const warnTotal = ws.total || unclosedWarns;
            const warn7d = ws.last7 || 0;
            const tile = (bg, cl, ic, label, num, sub) => `<div class="dash-tile"><div class="tile-ic" style="background:${bg};color:${cl};">${ic}</div><div class="stat-label" style="color:var(--text-muted);font-size:12px;font-weight:700;">${label}</div><div class="num" style="color:${cl};font-family:var(--font-mono,monospace);font-variant-numeric:tabular-nums;">${num}</div><div class="tile-sub" style="font-size:11px;">${sub}</div></div>`;
            // 保留第6块"待办进展"（占位，由 loadTodos 动态填充；渐进渲染后不重复新增）
            const todo = kpi.querySelector('#p1TodoTile');
            kpi.innerHTML = tile('rgba(100,210,255,.14)','var(--accent)','🚗','累计出货车辆数',(totalSystemShip||0).toLocaleString(),'出货系统/Pack(车辆)累计')
                + tile('rgba(116,192,252,.14)','var(--info)','📦','累计接入数',totalAccess.toLocaleString(),'接入台账 · 接入率 '+(accessRate!=null?accessRate+'%':'N/A'))
                + tile('rgba(52,211,153,.14)','var(--success)','🛡️','已过保车辆数',totalExpired.toLocaleString(),`已进保 ${inWarranty.toLocaleString()} · 质保台账 ${totalWarranty.toLocaleString()}`)
                + tile('rgba(255,107,107,.14)','var(--danger)','⚠️','累计预警外发',warnTotal.toLocaleString(),'按下钻口径')
                + tile('rgba(255,169,77,.14)','var(--warn, #fbbf24)','📊','近7天预警数',warn7d.toLocaleString(),'近7天预警条数')
                + (todo ? todo.outerHTML : '<div class="dash-tile" id="p1TodoTile"><div class="tile-ic" style="background:rgba(139,92,246,.14);color:#8b5cf6;">✅</div><div class="stat-label" style="color:var(--text-muted);font-size:12px;font-weight:700;">待办进展</div><div class="num" style="color:#8b5cf6;font-family:var(--font-mono,monospace);font-variant-numeric:tabular-nums;">…</div><div class="tile-sub" style="font-size:11px;">当前登录账号 · 已完成/待办</div></div>');
        }
        // 接入明细
        const accC = document.getElementById('p1AccCollapse');
        if (accC) accC.innerHTML = this.renderAccessTable((d && d.access_stats) || { rows: [] });
        // 失效模式表：替换占位卡片
        const fmNode = document.querySelector('#p1Dashboard .dash-sec-title h3');
        const container = document.getElementById('p1Dashboard');
        // 定位占位卡片（渐进渲染时插入的"正在加载失效模式…"卡片），用新的真实卡片替换
        const ph = container && container.querySelector('[data-fm-ph]');
        if (ph && ph.parentNode) {
            const tmp = document.createElement('div');
            tmp.innerHTML = this.renderFailureModes((d && d.failure_modes) || { rows: [] });
            ph.parentNode.replaceChild(tmp.firstChild, ph);
            this._enableSort(tmp.firstChild);   // 失效模式表点击表头排序（任务#3）
        }
        this._applyDorisBinds();
    },

    applyDorisError(d) {
        const accC = document.getElementById('p1AccCollapse');
        if (accC) accC.innerHTML = `<p class="empty-state" style="padding:20px;">${d && d.error ? Utils.esc(d.error) : 'Doris 数据加载失败，请稍后重试或点击「查询」刷新'}</p>`;
        // 失效模式占位卡片 → 提示失败
        const container = document.getElementById('p1Dashboard');
        const ph = container && container.querySelector('[data-fm-ph]');
        if (ph) {
            ph.querySelector('p').textContent = '失效模式加载失败，请稍后重试';
        }
        const kpi = document.getElementById('p1KpiTiles');
        if (kpi && !kpi.querySelector('.dash-load-err')) {
            const el = document.createElement('div');
            el.className = 'dash-load-err';
            el.style.cssText = 'grid-column:1/-1;font-size:12px;color:var(--danger);';
            el.textContent = 'Doris 统计模块加载失败（统计数值暂缺）';
            kpi.appendChild(el);
        }
    },

    // 接入明细 / 失效模式 编辑按钮等二次绑定（渐进渲染后 DOM 重绘了这些区域，需重新挂事件）
    _applyDorisBinds() {
        this._bindAccessPager();
        document.querySelectorAll('.p1-logic-edit').forEach(el => {
            if (el.dataset.bound) return;
            el.dataset.bound = '1';
            el.onclick = () => this.editWarningLogic(el.dataset.cap, el.dataset.fault, el.dataset.logic || '');
        });
        document.querySelectorAll('.p1-warranty-edit').forEach(el => {
            if (el.dataset.bound) return;
            el.dataset.bound = '1';
            el.onclick = () => this.editWarrantySettings(el.dataset);
        });
    },

    bindDashboardEvents() {
        this._bindAccessPager();
        const addVisitBtn = document.getElementById('p1AddVisit');
        if (addVisitBtn) addVisitBtn.onclick = () => this.showAddVisitModal();
        const addPersonBtn = document.getElementById('p1AddPerson');
        if (addPersonBtn) addPersonBtn.onclick = () => this.showAddPersonModal();
        const addMeetingBtn = document.getElementById('p1AddMeeting');
        if (addMeetingBtn) addMeetingBtn.onclick = () => this.showAddMeetingModal();
        document.querySelectorAll('.p1-meeting-tasks-toggle').forEach(el => {
            el.onclick = (e) => { e.preventDefault(); this.toggleMeetingTasks(el.dataset.meetingId); };
        });
        document.querySelectorAll('.p1-logic-edit').forEach(el => {
            if (el.dataset.bound) return;
            el.dataset.bound = '1';
            el.onclick = () => this.editWarningLogic(el.dataset.cap, el.dataset.fault, el.dataset.logic || '');
        });
        document.querySelectorAll('.p1-warranty-edit').forEach(el => {
            if (el.dataset.bound) return;
            el.dataset.bound = '1';
            el.onclick = () => this.editWarrantySettings(el.dataset);
        });
        const importBtn = document.getElementById('p1ImportWarranty');
        if (importBtn) importBtn.onclick = () => this.importWarrantyExcel();
        // 接入明细折叠（todo#4：调整展示位置，默认展开可收起以释放首屏）
        const foldBtn = document.getElementById('p1AccFold');
        const foldBox = document.getElementById('p1AccCollapse');
        if (foldBtn && foldBox) {
            const apply = (open) => {
                foldBox.style.display = open ? '' : 'none';
                foldBtn.innerHTML = open ? '▲ 收起' : '▼ 展开';
            };
            foldBtn.onclick = () => apply(foldBox.style.display === 'none');
            this._accessFolded = foldBox.style.display === 'none';
            window.addEventListener('resize', () => { /* 占位：保持状态，无需重建 */ });
        }
        // 预警分布维度 checkbox：勾选变动 → 立即重绘
        document.querySelectorAll('.wd-cb').forEach(cb => {
            cb.onchange = () => {
                // 保证至少勾一个：若全不选则恢复被取消的那个
                const on = Array.from(document.querySelectorAll('.wd-cb')).some(c => c.checked);
                if (!on) { cb.checked = true; return; }
                const g = this._resolveWarnGroup();
                this.loadWarnDist(g);
            };
        });
    },

    // 接入明细分页按钮（渐进渲染后 #p1AccCollapse 被重绘，需重新挂上一页/下一页）
    _bindAccessPager() {
        const prevBtn = document.getElementById('p1AccPrev');
        const nextBtn = document.getElementById('p1AccNext');
        if (prevBtn) prevBtn.onclick = () => {
            if (this.currentPage > 1) { this.currentPage--; this.refreshAccessTable(); }
        };
        if (nextBtn && !nextBtn.dataset.bound) {
            nextBtn.dataset.bound = '1';
            nextBtn.onclick = () => {
                const rows = ((this.currentData.access_stats || {}).rows) || [];
                const maxPage = Math.ceil(rows.length / this.pageSize) || 1;
                if (this.currentPage < maxPage) { this.currentPage++; this.refreshAccessTable(); }
            };
        }
    },

    // ========== 模块1: 接入明细表格（接入数/出货数仅用于计算「接入率」，表内突出展示接入率）==========
    renderAccessTable(accessStats) {
        const rows = (accessStats && accessStats.rows) || [];
        const shipErr = accessStats && accessStats.ship_error;
        if (!rows.length) {
            const msg = accessStats && accessStats.error ? accessStats.error : '暂无接入数据';
            return `<div style="padding:16px;"><p class="empty-state">${Utils.esc(msg)}</p></div>`;
        }
        const maxPage = Math.ceil(rows.length / this.pageSize) || 1;
        const tip = shipErr ? `<div style="font-size:11px;color:var(--danger);padding:4px 16px;">出货数据获取失败，接入率暂不可算: ${Utils.esc(shipErr)}</div>` : '';
        // 排序指示（todo#3：首页看板表字段可点击排序）
        const th = (label, key, cls) => {
            const s = this._accessSort;
            const active = s && s.key === key;
            const arrow = active ? (s.dir === 'asc' ? ' &#9650;' : ' &#9660;') : '';
            return `<th ${cls ? `class="${cls}"` : ''} style="cursor:pointer;white-space:nowrap;"
                data-sort="${key}" onclick="Page1.toggleAccessSort('${key}')"
                title="点击排序">${label}${arrow}${active ? '' : ' <span style="font-size:10px;color:var(--text-muted);">⇅</span>'}</th>`;
        };
        return `${tip}
        <div class="table-wrapper"><table class="dash-table">
            <thead><tr>
                ${th('容量Ah', 'cell_cap')}
                ${th('电池结构', 'cell_structure')}
                ${th('接入数', 'access_count', 'num')}
                <th title="出货数=该容量出货条码数；默认 Pack(系统)=接入率分母，可下拉切换 Cell/Module">出货数</th>
                ${th('接入率', 'access_rate', 'acc-rate-h')}
                ${th('质保年限', 'warranty_years')}
                ${th('质保里程(km)', 'passenger_mileage')}
                ${th('质保容量(SOH%)', 'passenger_soh')}
                ${th('过保数', 'expired_cnt', 'num')}
                ${th('过保率', 'expired_rate', 'num')}
                <th>操作</th>
            </tr></thead>
            <tbody id="p1AccTbody">${this.renderAccessRows(rows)}</tbody>
        </table></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px;">
            <span id="p1AccPage" style="font-size:12px;color:var(--text-muted);">第 ${this.currentPage} / ${maxPage} 页 (共 ${rows.length} 行)</span>
            <div>
                <button class="btn btn-sm btn-secondary" id="p1AccPrev">上一页</button>
                <button class="btn btn-sm btn-secondary" id="p1AccNext">下一页</button>
            </div>
        </div>`;
    },

    // 点击表头排序（todo#3）：同 key 再点切换升/降；按 key 从 row 取值排序。
    toggleAccessSort(key) {
        const s = this._accessSort;
        this._accessSort = (s && s.key === key)
            ? { key: key, dir: s.dir === 'asc' ? 'desc' : 'asc' }
            : { key: key, dir: 'asc' };
        this.currentPage = 1;   // 排序后回到第一页
        this.refreshAccessTable();
    },

    _accessRowVal(d, key) {
        switch (key) {
            case 'cell_cap': return parseFloat(d.cell_cap);
            case 'access_count': return d.access_count == null ? 0 : d.access_count;
            case 'access_rate': return d.access_rate == null ? -1 : d.access_rate;
            case 'expired_cnt': return d.expired_cnt == null ? 0 : d.expired_cnt;
            case 'expired_rate': return d.expired_rate == null ? 0 : d.expired_rate;
            case 'passenger_mileage': return (d.passenger_mileage != null ? d.passenger_mileage : (d.commercial_mileage != null ? d.commercial_mileage : 0));
            case 'passenger_soh': return (d.passenger_soh != null ? d.passenger_soh : (d.commercial_soh != null ? d.commercial_soh : 0));
            case 'warranty_years': return (d.passenger_years != null ? d.passenger_years : (d.commercial_years != null ? d.commercial_years : 0));
            // 文本列
            case 'cell_structure': return (d.cell_structure || '');
            case 'vehicle_model': return (d.vehicle_model || '');
            default: return '';
        }
    },

    renderAccessRows(allRows) {
        // 表头排序（todo#3）：按当前排序 key 对全量数据排序后再分页
        let data = allRows;
        const s = this._accessSort;
        if (s && s.key) {
            const dir = s.dir === 'desc' ? -1 : 1;
            data = allRows.slice().sort((a, b) => {
                const va = this._accessRowVal(a, s.key);
                const vb = this._accessRowVal(b, s.key);
                if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
                return String(va).localeCompare(String(vb), 'zh') * dir;
            });
        }
        const start = (this.currentPage - 1) * this.pageSize;
        const pageData = data.slice(start, start + this.pageSize);
        if (!pageData.length) return '<tr><td colspan="11" class="empty-state">暂无数据</td></tr>';
        return pageData.map(d => {
            // 接入率 = 接入数 / 出货数（后端 access_rate 已算好）；接入数/出货数仅作 tooltip 提示
            const ar = d.access_rate;
            const rateCell = ar != null
                ? `<div title="接入率=接入数(该容量全部车型合计)/出货系统数（容量级，舍弃车型细分）" style="display:inline-flex;align-items:center;gap:8px;justify-content:center;min-width:118px;">
                    <div style="width:70px;height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden;">
                        <div style="width:${Math.min(100, ar)}%;height:100%;background:${ar >= 90 ? 'var(--ok)' : (ar >= 60 ? 'var(--warn)' : 'var(--danger)')};border-radius:5px;"></div>
                    </div>
                    <strong class="mono" style="font-variant-numeric:tabular-nums;">${ar}%</strong>
                  </div>`
                : '<span style="color:var(--text-muted);">N/A</span>';
            const py = d.passenger_years, cy = d.commercial_years;
            const warrantyYears = (py != null && cy != null) ? `${py}/${cy}年` : (py != null ? py+'年' : '-');
            const expiredCnt  = d.expired_cnt != null ? d.expired_cnt.toLocaleString() : '0';
            const expiredRate = d.expired_rate != null ? d.expired_rate + '%' : '0%';
            const editBtn = `<button class="btn btn-sm btn-secondary p1-warranty-edit"
                data-wid="${d.warranty_id || ''}"
                data-cap="${Utils.esc(d.cell_cap)}"
                data-vm="${Utils.esc(d.vehicle_model || '')}"
                data-py="${py ?? ''}" data-pm="${d.passenger_mileage ?? ''}" data-ps="${d.passenger_soh ?? ''}"
                data-cy="${cy ?? ''}" data-cm="${d.commercial_mileage ?? ''}" data-cs="${d.commercial_soh ?? ''}">
                编辑</button>`;
            return `<tr>
                <td class="mono" style="font-family:monospace;">${Utils.esc(d.cell_cap)}</td>
                <td>${Utils.esc(d.cell_structure) || '-'}</td>
                <td class="num" title="该容量全部车型接入合计（车型细分无出货明细，故按容量级统计）">${d.access_count != null ? d.access_count.toLocaleString() : '0'}</td>
                <td><div class="acc-ship" data-pack="${d.pack_cnt ?? ''}" data-module="${d.module_cnt ?? ''}" data-cell="${d.cell_cnt ?? ''}"
                        data-ship-pack="${d.system_ship ?? ''}" data-ship-module="${d.module_ship ?? ''}" data-ship-cell="${d.cell_ship ?? ''}"
                        style="display:flex;align-items:center;gap:6px;white-space:nowrap;">
                        <!-- 默认 Pack(出货系统数)=接入率分母口径，Cell 为电芯出货；可下拉切换层级兼顾其它视图 -->
                        <select class="ship-lv" onchange="Page1._shipLevelChange(this)" style="font-size:11px;padding:2px 4px;" title="出货数：默认 Pack(系统·接入粒度)，可切换 Cell/Module">
                            <option value="pack" selected>Pack</option>
                            <option value="module">Module</option>
                            <option value="cell">Cell</option>
                        </select>
                        <span class="ship-val mono" style="font-family:monospace;color:var(--ink-2);">${(d.system_ship ?? (d.cell_cnt ?? 0)).toLocaleString()}</span>
                    </div></td>
                <td style="text-align:center;">${rateCell}</td>
                <td>${warrantyYears}</td>
                <td class="mono">${d.passenger_mileage != null ? (d.passenger_mileage || 0).toLocaleString() : (d.commercial_mileage != null ? (d.commercial_mileage || 0).toLocaleString() : '-')}</td>
                <td class="mono">${d.passenger_soh != null ? d.passenger_soh + '%' : (d.commercial_soh != null ? d.commercial_soh + '%' : '-')}</td>
                <td class="num">${expiredCnt}</td>
                <td class="num">${expiredRate}</td>
                <td>${editBtn}</td>
            </tr>`;
        }).join('');
    },

    // 出货层级切换：Pack/Module/Cell（显示对应换算后的数量）
    _shipLevelChange(sel) {
        const wrap = sel.closest('.acc-ship');
        if (!wrap) return;
        const lv = sel.value;
        // 「出货数」列：始终显示出货条码（Ship_*），Pack=出货系统数(接入率分母)/Module/Cell 为其它出货层级
        const valShip = lv === 'pack' ? wrap.dataset.shipPack
            : (lv === 'module' ? wrap.dataset.shipModule : wrap.dataset.shipCell);
        const sp = wrap.querySelector('.ship-val');
        if (sp) sp.textContent = Number(valShip || 0).toLocaleString();
    },

    refreshAccessTable() {
        const tbody = document.getElementById('p1AccTbody');
        if (!tbody || !this.currentData) return;
        const rows = ((this.currentData.access_stats || {}).rows) || [];
        tbody.innerHTML = this.renderAccessRows(rows);
        const pageInfo = document.getElementById('p1AccPage');
        if (pageInfo) {
            const maxPage = Math.ceil(rows.length / this.pageSize) || 1;
            pageInfo.textContent = `第 ${this.currentPage} / ${maxPage} 页 (共 ${rows.length} 行)`;
        }
    },

    // ========== 拜访计划（visit-item 列表，三色圆点）==========
    _demoTag() {
        // 「样例」标记：演示数据，非真实记录
        return `<span style="display:inline-block;font-size:10px;font-weight:700;color:var(--text-muted);background:var(--bg-input);border:1px dashed var(--border-card);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;">样例</span>`;
    },

    _demoPersons() {
        const d = [['张', '技术对接', '138****0001'], ['李', '商务经理', '139****0002'], ['王', '售后主管', '137****0003']];
        return d.map(([n, pos, phone], i) => `<div class="person" style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-row);">
            <div class="av" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;background:var(--accent);">${n}</div>
            <div><div class="nm" style="font-weight:700;color:var(--text-secondary);">${n}${i===0?'工':''}</div>
            <div class="ro" style="color:var(--text-muted);font-size:12.5px;">${pos}</div></div>
            <div class="ct" style="margin-left:auto;text-align:right;font-size:12px;color:var(--text-muted);">${phone}</div>
        </div>`).join('')
        + `<div style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding:8px 0 2px;">暂无真实关键人，以上为样例</div>`;
    },

    renderVisits(visits) {
        const addBtn = `<button class="btn btn-sm btn-primary" id="p1AddVisit" style="margin-left:auto;">+ 新增</button>`;
        if (!visits || !visits.length) {
            // 空时填入「样例」标记的演示数据，让布局不至于空白
            return `<div class="card">
                <div class="dash-sec-title">
                    <span class="sec-ic" style="background:rgba(16,185,129,.14);color:var(--success);">📅</span>
                    <h3>拜访计划${this._demoTag()}</h3>${addBtn}
                </div>
                <div style="padding:6px 17px;">
                    ${[
                        {subject: '产品技术交流', contact_person: '张工', date: '本月'},
                        {subject: '商务拜访', contact_person: '李经理', date: '下月'},
                        {subject: '售后关怀走访', contact_person: '王工', date: '规划中'},
                    ].map((v, i) => `<div class="visit-item" style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-row);">
                        <span class="vdot vd-plan" style="width:9px;height:9px;border-radius:50%;flex:none;"></span>
                        <div><div class="vt" style="font-weight:700;color:var(--text-secondary);">${v.subject}</div>
                        <div class="vs" style="color:var(--text-muted);font-size:12.5px;">对接：${v.contact_person}</div></div>
                        <div class="vday" style="margin-left:auto;font-weight:700;font-size:12.5px;color:var(--text-muted);">${v.date}</div>
                    </div>`).join('')}
                    <div style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding:8px 0 2px;">暂无真实拜访，以上为样例</div>
                </div>
            </div>`;
        }
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const halfYear = new Date(today); halfYear.setDate(halfYear.getDate() + 180);
        const items = visits.map(v => {
            // 本地时区解析 YYYY-MM-DD，避免 UTC 解析在边界日差一天
            const vd = v.visit_date ? new Date(String(v.visit_date).replace(/-/g, '/') + ' 00:00:00') : null;
            let dotClass = 'vd-done', dayColor = 'var(--text-muted)', dayText = Utils.formatDate(v.visit_date);
            if (v.is_completed) { dotClass = 'vd-done'; }
            else if (vd && vd < today) { dotClass = 'vd-late'; dayColor = 'var(--danger)'; dayText = '已逾期'; }
            else if (vd && vd >= today && vd <= halfYear) { dotClass = 'vd-plan'; dayColor = 'var(--success)'; }
            return `<div class="visit-item" style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-row);">
                <span class="vdot ${dotClass}" style="width:9px;height:9px;border-radius:50%;flex:none;"></span>
                <div><div class="vt" style="font-weight:700;">${Utils.esc(v.subject || '拜访')}</div>
                <div class="vs" style="color:var(--text-muted);font-size:12.5px;">对接：${Utils.esc(v.contact_person) || '-'}</div></div>
                <div class="vday" style="margin-left:auto;font-weight:700;font-size:12.5px;color:${dayColor};">${dayText}</div>
            </div>`;
        }).join('');
        return `<div class="card">
            <div class="dash-sec-title">
                <span class="sec-ic" style="background:rgba(16,185,129,.14);color:var(--success);">📅</span>
                <h3>拜访计划</h3>
                <span class="sub">三色状态</span>${addBtn}
            </div>
            <div style="padding:12px 17px;">${items}</div>
        </div>`;
    },

    // ========== 关键人（头像列表，参照 platform-shell）==========
    renderKeyPersons(external, internal) {
        const addBtn = `<button class="btn btn-sm btn-primary" id="p1AddPerson" style="margin-left:auto;">+ 新增</button>`;

        // 关键人做成规整表格：列= 姓名 / 职位(负责事项) / 联系方式（几行几列结构）
        const row = (p) => `
            <tr>
                <td style="font-weight:700;white-space:nowrap;">${Utils.esc(p.name || '-')}</td>
                <td>${Utils.esc(p.position || p.department || '-')}</td>
                <td class="mono" style="font-size:11.5px;color:var(--text-muted);white-space:nowrap;">
                    ${Utils.esc(p.phone || (p.email ? p.email : '-'))}
                </td>
            </tr>`;
        const extBody = (external || []).map(row).join('');
        const intBody = (internal || []).map(row).join('');
        const hasData = (external && external.length) || (internal && internal.length);
        const table = (body) => `<div class="table-wrapper" style="max-height:220px;overflow:auto;">
            <table class="dash-table" style="width:100%;">
                <thead><tr><th style="width:30%;">姓名</th><th>职位 / 负责事项</th><th style="width:34%;">联系方式</th></tr></thead>
                <tbody>${body}</tbody>
            </table>
        </div>`;
        return `<div class="card">
            <div class="dash-sec-title">
                <span class="sec-ic" style="background:rgba(79,140,255,.14);color:var(--accent);">👥</span>
                <h3>外部关键人</h3>${addBtn}
            </div>
            <div style="padding:12px 17px;">
                ${extBody ? table(extBody) : `<p class="empty-state" style="padding:12px;">暂无外部关键人，点击右上角「+ 新增」添加</p>`}
                ${intBody ? `<div style="margin-top:12px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding-bottom:4px;">内部 PQM</div>${table(intBody)}` : ''}
            </div>
        </div>`;
    },

    // ========== 会议记录（visit-item 列表，参照 platform-shell）==========
    renderMeetings(meetings) {
        const addBtn = `<button class="btn btn-sm btn-primary" id="p1AddMeeting" style="margin-left:auto;">+ 新增</button>`;
        if (!meetings || !meetings.length) {
            return `<div class="card">
                <div class="dash-sec-title">
                    <span class="sec-ic" style="background:rgba(139,92,246,.14);color:#8b5cf6;">📝</span>
                    <h3>近期会议${this._demoTag()}</h3>${addBtn}
                </div>
                <div style="padding:6px 17px;">
                    ${['月度经营对账会','技术交底会','客户拜访总结'].map((t, i) => `<div class="visit-item" style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-row);">
                        <span class="vdot" style="width:9px;height:9px;border-radius:50%;flex:none;background:var(--accent);"></span>
                        <div><div class="vt" style="font-weight:700;color:var(--text-secondary);">${t}${i===0?'(本周)':''}</div>
                        <div class="vs" style="color:var(--text-muted);font-size:12.5px;">共识 2 · 任务 3</div></div>
                        <div class="vday" style="margin-left:auto;font-weight:700;font-size:12.5px;color:var(--text-muted);">样例</div>
                    </div>`).join('')}
                    <div style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding:8px 0 2px;">暂无真实会议，以上为样例</div>
                </div>
            </div>`;
        }
        const items = meetings.map(m => {
            const consensusCount = (m.consensus || []).length;
            const taskCount = m.task_total || (m.tasks || []).length;
            const hasMat = m.material_name ? true : false;
            return `<div class="visit-item" style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-row);">
                <span class="vdot" style="width:9px;height:9px;border-radius:50%;flex:none;background:var(--accent);"></span>
                <div style="flex:1;min-width:0;"><div class="vt" style="font-weight:700;">${Utils.esc(m.title)}</div>
                <div class="vs" style="color:var(--text-muted);font-size:12.5px;">共识 ${consensusCount} · 任务 ${taskCount} · ${Utils.formatDate(m.meeting_date)}</div>
                <div style="margin-top:4px;display:flex;gap:8px;align-items:center;">
                    <button class="btn btn-sm btn-secondary" onclick="Page1.uploadMeetingMaterial(${m.id})" style="padding:2px 8px;font-size:11px;">📤 上传资料</button>
                    ${hasMat
                        ? `<a class="btn btn-sm btn-primary" href="/api/meetings/${m.id}/material" download="${Utils.esc(m.material_name)}" style="padding:2px 8px;font-size:11px;text-decoration:none;">📥 ${Utils.esc(m.material_name)}</a>`
                        : ''}
                </div></div>
                <div class="vday" style="margin-left:auto;align-self:flex-start;font-weight:700;font-size:12.5px;">${Utils.formatDate(m.meeting_date)}</div>
            </div>`;
        }).join('');
        return `<div class="card">
            <div class="dash-sec-title">
                <span class="sec-ic" style="background:rgba(139,92,246,.14);color:#8b5cf6;">📝</span>
                <h3>近期会议</h3>${addBtn}
            </div>
            <div style="padding:12px 17px;">${items}</div>
        </div>`;
    },

    // 导入会议材料（用户本地文件直传，统一走归档接口 meeting_materials，消除双轨）
    async uploadMeetingMaterial(mid) {
        Utils.pickFiles({
            multiple: true,
            onPicked: async (files) => {
                const fd = new FormData();
                files.forEach(f => fd.append('files', f));
                const res = await API.upload(`/api/meetings/${mid}/materials`, fd);
                if (res && res.success) { Toast.success(`已归档 ${res.count||0} 个文件`); this.loadDashboard(true); }
                else Toast.error((res && res.error) || '导入失败');
            }
        });
    },

    toggleMeetingTasks(meetingId) {
        const el = document.getElementById('p1MeetingTasks_' + meetingId);
        if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    },

    // ========== 模块3: 客户重点失效模式（Doris tab3 + 本地可编辑预警逻辑）==========
    renderFailureModes(failureModes) {
        const rows = (failureModes && failureModes.rows) || [];
        if (!rows.length) {
            const msg = failureModes && failureModes.error ? failureModes.error : '暂无失效模式数据';
            return `<div class="card" style="margin-top:20px;">
                <div class="dash-sec-title"><span class="sec-ic" style="background:rgba(255,169,77,.14);color:var(--warning);">⚠️</span><h3>客户重点失效模式</h3></div>
                <p class="empty-state">${Utils.esc(msg)}</p>
            </div>`;
        }
        // 默认只显示前 8 条(按外发数量已排序)，超出用「展开全部」折叠，避免表格过长
        const FM_DEFAULT = 8;
        const showAll = this._fmExpandAll === true;
        const visibleRows = showAll ? rows : rows.slice(0, FM_DEFAULT);
