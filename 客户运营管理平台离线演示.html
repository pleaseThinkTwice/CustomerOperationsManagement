    renderPersonsTab(c) {
        const external = (c.key_persons || []).filter(p => p.type === 'external');
        const internal = (c.key_persons || []).filter(p => p.type === 'internal');
        const renderGroup = (title, persons, type) => {
            const rows = persons.map(p => `<tr data-pid="${p.id}">
                <td>${Utils.esc(p.name)}</td><td>${Utils.esc(p.department) || '-'}</td>
                <td>${Utils.esc(p.position) || '-'}</td><td>${Utils.esc(p.superior) || '-'}</td>
                <td>${Utils.esc(p.style) || '-'}</td>
                <td>${Utils.esc(p.phone) || '-'}</td><td>${Utils.esc(p.email) || '-'}</td>
                <td class="actions">
                    <button class="btn btn-secondary btn-sm" onclick="Page2.editPerson(this,${p.id},'${Utils.esc(c.oem)}')">编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="Page2.removePerson(${p.id},'${Utils.esc(c.oem)}')">删除</button>
                </td>
            </tr>`).join('');
            const blueprintBtn = (type === 'external' && persons.length)
                ? ` <button class="btn btn-sm btn-info" style="margin-left:8px;" onclick="Page2.showBlueprint('${Utils.esc(c.oem)}')">&#128202; 蓝图</button>` : '';
            return `<h4 style="color:var(--accent-light);margin:12px 0 8px;display:flex;align-items:center;">${title}${blueprintBtn}</h4>
                <div class="table-wrapper"><table>
                    <thead><tr><th>姓名</th><th>部门</th><th>职位</th><th>上级</th><th>风格</th><th>电话</th><th>邮箱</th><th>操作</th></tr></thead>
                    <tbody id="ptb-${type}-${Utils.esc(c.oem)}">${rows}</tbody>
                </table></div>
                <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
                    <button class="btn btn-secondary btn-sm" data-perm="customer.edit" onclick="Page2.addPerson('${Utils.esc(c.oem)}','${type}')">+ 增加${title}</button>
                    <span style="font-size:11px;color:var(--text-muted);">上级：可不填（暂无），或选本客户已有的人，或直接输入新姓名</span>
                </div>`;
        };
        return renderGroup('外部关键人', external, 'external') + renderGroup('内部负责人', internal, 'internal') + this.superiorList(c.oem, c.key_persons)
            + this.renderBatchImport(c.oem);
    },

    // 批量导入工具条（todo#4）：下载模板 + 上传 Excel 批量填关键人
    renderBatchImport(oem) {
        return `
        <div style="margin-top:18px;padding:12px 14px;border:1px dashed var(--border-card);border-radius:10px;background:var(--bg-card);">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">
                <span style="font-size:13px;font-weight:700;color:var(--text-primary);">批量导入关键人</span>
                <span style="font-size:11px;color:var(--text-muted);">用 Excel 一次填写多条关键人（客户自动为当前 ${Utils.esc(oem)}）</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-secondary btn-sm" onclick="Page2.downloadPersonTemplate('${Utils.esc(oem)}')">&#11015; 下载模板</button>
                <button class="btn btn-primary btn-sm" data-perm="customer.edit" onclick="Page2.uploadPersons('${Utils.esc(oem)}')">&#11014; 导入 Excel</button>
                <span style="font-size:11px;color:var(--text-muted);">选择本地 Excel 上传，同客户下同名人员自动更新。</span>
            </div>
            <div id="p2ImpResult-${Utils.esc(oem)}" style="margin-top:8px;font-size:12px;"></div>
        </div>`;
    },

    downloadPersonTemplate(oem) {
        const url = '/api/key_persons/template' + (oem ? `?oem=${encodeURIComponent(oem)}` : '');
        window.location.href = url;
    },

    async uploadPersons(oem) {
        Utils.pickFiles({
            accept: '.xlsx,.xls',
            onPicked: async (files) => {
                const resHolder = document.getElementById(`p2ImpResult-${Utils.esc(oem)}`);
                if (resHolder) resHolder.innerHTML = '<span class="loading" style="padding:4px;"></span>';
                try {
                    const fd = new FormData();
                    fd.append('file', files[0]);
                    fd.append('oem', oem);
                    const res = await API.upload(`/api/key_persons/import`, fd);
                    if (res && res.success) {
                        let msg = `导入 ${res.imported||0} 条，更新 ${res.updated||0} 条`;
                        if (res.skipped) msg += `，跳过 ${res.skipped} 条`;
                        let html = `<div style="color:var(--success);padding:6px;">${msg}</div>`;
                        if (res.items && res.items.length) {
                            html += `<ul style="margin:4px 0 0 14px;font-size:11px;color:var(--text-secondary);max-height:120px;overflow:auto;">`
                                + res.items.map(i => `<li>${i.action==='import'?'新增':'更新'} · ${Utils.esc(i.oem)} · ${Utils.esc(i.name)}</li>`).join('')
                                + `</ul>`;
                        }
                        if (res.errors && res.errors.length) {
                            html += `<div style="color:var(--danger);margin-top:6px;max-height:100px;overflow:auto;font-size:11px;">失败 ${res.errors.length} 条：`
                                + res.errors.map(e => `<div>· ${Utils.esc(e.msg || '')}</div>`).join('') + `</div>`;
                        }
                        if (resHolder) resHolder.innerHTML = html;
                        // 刷新本客户关键人矩阵
                        this.refreshPersons(oem);
                    } else {
                        if (resHolder) resHolder.innerHTML = `<div style="color:var(--danger);padding:6px;">${Utils.esc((res&&res.error)||'导入失败')}</div>`;
                    }
                } catch (e) {
                    if (resHolder) resHolder.innerHTML = `<div style="color:var(--danger);padding:6px;">导入异常：${Utils.esc(e.message||e)}</div>`;
                }
            }
        });
    },

    addPerson(oem, type) {
        const tbody = document.getElementById(`ptb-${type}-${oem}`);
        if (!tbody) return;
        if (tbody.querySelector('tr.p2-adding')) return;
        const inp = (cls, ph) => `<input type="text" class="${cls}" placeholder="${ph}" style="width:100%;font-size:12px;">`;
        const tr = document.createElement('tr');
        tr.className = 'p2-adding';
        tr.innerHTML = `
            <td>${inp('p2p-name','姓名 *')}</td>
            <td>${inp('p2p-dept','部门')}</td>
            <td>${inp('p2p-pos','职位')}</td>
            <td>${inp('p2p-superior','选人/暂不填')}</td>
            <td>${inp('p2p-style','风格')}</td>
            <td>${inp('p2p-phone','电话')}</td>
            <td>${inp('p2p-email','邮箱')}</td>
            <td class="actions">
                <button class="btn btn-primary btn-sm" onclick="Page2.savePerson(this,'${oem}','${type}')">保存</button>
                <button class="btn btn-secondary btn-sm" onclick="this.closest('tr').remove()">取消</button>
            </td>`;
        tbody.appendChild(tr);
        tr.querySelector('.p2p-name').focus();
    },

    // 上级可选列表：同客户已有的所有人（供 datalist 下拉"选已有"，也可直接输入新姓名/留空=暂无）
    superiorList(oem, persons) {
        const names = (Array.isArray(persons) ? persons : []).map(p => p.name).filter(Boolean);
        if (names.length) {
            return `<datalist id="p2p-superior-list-${Utils.esc(oem)}">${
                names.map(n => `<option value="${Utils.esc(n)}">`).join('')}</datalist>`;
        }
        return '<datalist id="p2p-superior-list-' + Utils.esc(oem) + '"></datalist>';
    },

    async savePerson(btn, oem, type) {
        const tr = btn.closest('tr');
        const name = tr.querySelector('.p2p-name').value.trim();
        if (!name) { Toast.error('姓名不能为空'); return; }
        const data = {
            oem: oem,
            type: type,
            name: name,
            department: tr.querySelector('.p2p-dept').value.trim(),
            position: tr.querySelector('.p2p-pos').value.trim(),
            superior: (tr.querySelector('.p2p-superior') ? tr.querySelector('.p2p-superior').value.trim() : ''),
            style: tr.querySelector('.p2p-style').value.trim(),
            phone: tr.querySelector('.p2p-phone').value.trim(),
            email: tr.querySelector('.p2p-email').value.trim()
        };
        const result = await API.post('/api/key_persons', data);
        if (result) {
            Toast.success('添加成功');
            this.refreshPersons(oem);
        }
    },

    async editPerson(btn, pid, oem) {
        const tr = btn.closest('tr');
        if (tr.classList.contains('p2-editing')) return;
        tr.classList.add('p2-editing');
        const tds = tr.querySelectorAll('td');
        // 列序：name, dept, pos, superior, style, phone, email, actions → 取值列 0~6
        const vals = Array.from(tds).slice(0, 7).map(td => {
            const t = td.textContent.trim();
            return t === '-' ? '' : t;
        });
        const inp = (cls, val) => `<input type="text" class="${cls}" value="${Utils.esc(val)}" style="width:100%;font-size:12px;">`;
        tr.innerHTML = `
            <td>${inp('p2p-name', vals[0])}</td>
            <td>${inp('p2p-dept', vals[1])}</td>
            <td>${inp('p2p-pos', vals[2])}</td>
            <td>${inp('p2p-superior', vals[3])}</td>
            <td>${inp('p2p-style', vals[4])}</td>
            <td>${inp('p2p-phone', vals[5])}</td>
            <td>${inp('p2p-email', vals[6])}</td>
            <td class="actions">
                <button class="btn btn-primary btn-sm" onclick="Page2.updatePerson(this,${pid},'${oem}')">保存</button>
                <button class="btn btn-secondary btn-sm" onclick="Page2.refreshPersons('${oem}')">取消</button>
            </td>`;
        tr.querySelector('.p2p-name').focus();
    },

    async updatePerson(btn, pid, oem) {
        const tr = btn.closest('tr');
        const name = tr.querySelector('.p2p-name').value.trim();
        if (!name) { Toast.error('姓名不能为空'); return; }
        const data = {
            name: name,
            department: tr.querySelector('.p2p-dept').value.trim(),
            position: tr.querySelector('.p2p-pos').value.trim(),
            superior: (tr.querySelector('.p2p-superior') ? tr.querySelector('.p2p-superior').value.trim() : ''),
            style: tr.querySelector('.p2p-style').value.trim(),
            phone: tr.querySelector('.p2p-phone').value.trim(),
            email: tr.querySelector('.p2p-email').value.trim()
        };
        const result = await API.put(`/api/key_persons/${pid}`, data);
        if (result) {
            Toast.success('更新成功');
            this.refreshPersons(oem);
        }
    },

    async refreshPersons(oem) {
        const c = await API.get(`/api/customers/${encodeURIComponent(oem)}`);
        if (!c || c.error) return;
        // 优先级：列表展开行 > 编辑弹窗里的关键人矩阵 > 详情页 Tab
        const expandTd = document.querySelector(`#p2expand-${this.jsArg(oem)} > td`);
        if (expandTd && this._expandedOem === oem) {
            expandTd.innerHTML = `<div style="padding:8px 12px;background:var(--panel-2);border-radius:8px;margin:4px;">
                ${this.renderPersonsTab(c)}
            </div>`;
            return;
        }
        const editBox = document.getElementById('p2EditPersons');
        if (editBox) { editBox.innerHTML = this.renderPersonsTab(c); return; }
        const content = document.getElementById('p2TabContent');
        if (content) content.innerHTML = this.renderPersonsTab(c);
    },

    async showBlueprint(rawOem) {
        const oem = decodeURIComponent(rawOem);
        const c = await API.get(`/api/customers/${encodeURIComponent(oem)}`);
        if (!c || c.error) { Toast.error('加载失败'); return; }
        const persons = (c.key_persons || []).filter(p => p.type === 'external');
        if (!persons.length) { Toast.info('该客户暂无外部关键人'); return; }

        // 按 superior 字段建树：superior 为空或指向不存在的人 = 根节点
        const byName = {};
        persons.forEach(p => { byName[p.name] = p; });
        const roots = [];
        const childrenMap = {}; // name -> [person]
        persons.forEach(p => {
            const sup = (p.superior || '').trim();
            if (sup && byName[sup]) {
                (childrenMap[sup] = childrenMap[sup] || []).push(p);
            } else {
                roots.push(p);
            }
        });

        // 递归渲染树节点（缩进式）
        const renderNode = (p, depth) => {
            const kids = childrenMap[p.name] || [];
            const indent = depth * 28;
            const color = depth === 0 ? 'var(--accent)' : 'var(--text-secondary)';
            const childRows = kids.map(k => renderNode(k, depth + 1)).join('');
            return `<div style="margin-left:${indent}px;padding:6px 10px;border-left:2px solid var(--border-row);margin-bottom:4px;position:relative;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span style="font-weight:${depth === 0 ? '700' : '500'};color:${color};">${Utils.esc(p.name)}</span>
                    ${p.position ? `<span class="badge badge-secondary" style="font-size:11px;">${Utils.esc(p.position)}</span>` : ''}
                    ${p.department ? `<span style="font-size:11px;color:var(--text-muted);">${Utils.esc(p.department)}</span>` : ''}
                    ${p.phone ? `<span style="font-size:11px;color:var(--text-muted);">&#9742; ${Utils.esc(p.phone)}</span>` : ''}
                    ${kids.length ? `<span style="font-size:11px;color:var(--accent-light);">(${kids.length} 下属)</span>` : ''}
                </div>
            </div>${childRows}`;
        };

        const treeHtml = roots.map(r => renderNode(r, 0)).join('');
        const noSuperior = persons.filter(p => {
            const sup = (p.superior || '').trim();
            return sup && !byName[sup];
        });

        Modal.open(`<div class="modal-header">
            <h3>&#128202; ${Utils.esc(c.oem_ch || c.name_cn || c.oem)} 关键人蓝图</h3>
            <button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">
                外部关键人上下级关系树（基于「上级」字段）。共 ${persons.length} 人，${roots.length} 个顶层。
            </div>
            <div style="max-height:60vh;overflow:auto;">${treeHtml}</div>
            ${noSuperior.length ? `<div style="margin-top:12px;padding:8px 10px;background:var(--bg-card);border-radius:8px;font-size:12px;color:var(--warning);">
                &#9888; ${noSuperior.length} 人的上级「${noSuperior.map(p => Utils.esc(p.superior)).join('、')}」未在关键人名单中，未连入树。
            </div>` : ''}
            <div style="text-align:right;margin-top:12px;"><button class="btn btn-secondary" onclick="Modal.close()">关闭</button></div>`);
    },

    async removePerson(pid, oem) {
        if (!confirm('确定删除该关键人？')) return;
        const result = await API.del(`/api/key_persons/${pid}`);
        if (result) { Toast.success('已删除'); this.refreshPersons(oem); }
    }
};

</script>

<!-- /static/js/pages/page3.js -->
<script>
/**
 * 页面3 - 会议纪要管理
 */
const Page3 = {
    initialized: false,
    _showActual: false,   // 任务「实际完成时间」列默认隐藏，用户可切换显示（todo 任务#8）

    init() {
        const container = document.getElementById('page3');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.loadList();
    },

    renderLayout() {
        return `
        <div class="filter-bar">
            <div class="form-group">
                <label>客户筛选</label>
                <select id="p3Customer">${Utils.customerOptions()}</select>
            </div>
            <button class="btn btn-primary" id="p3Search">查 询</button>
            <button class="btn btn-success" id="p3Add" data-perm="meeting.edit">+ 新增会议</button>
            <button class="btn btn-secondary" id="p3AiSummary">&#9889; AI 智能提取</button>
            <button class="btn btn-secondary" id="p3BatchSummary" title="批量上传文件或粘贴多场会议纪要，AI 一次提取">&#9889; 批量智能提取</button>
        </div>
        <div id="p3List"></div>`;
    },

    bindEvents() {
        document.getElementById('p3Search').onclick = () => this.loadList();
        document.getElementById('p3Add').onclick = () => this.openForm();
        document.getElementById('p3AiSummary').onclick = () => this.openAiSummary();
        document.getElementById('p3BatchSummary').onclick = () => this.openBatchSummary();
    },

    // ===== AI 智能提取会议纪要 =====
    openAiSummary() {
        Modal.open(`
            <h3>&#9889; AI 智能提取会议纪要</h3>
            <div class="form-group"><label>粘贴会议纪要原文</label>
                <textarea id="aiMeetingText" rows="10" placeholder="粘贴会议纪要/会议记录原文，AI 将自动提取标题、目的、参与人、共识和任务..."></textarea>
            </div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" id="aiMeetingRun" data-perm="meeting.edit">&#9889; 提取</button>
            </div>
            <div id="aiMeetingResult" style="margin-top:12px;"></div>`);
        document.getElementById('aiMeetingRun').onclick = () => this.runAiSummary();
        // 长文纪要可在新标签页编辑（todo#2）
        window.TabEditor && TabEditor.attach(document.getElementById('aiMeetingText'), 'p3.aiMeeting', '📋 会议纪要原文');
    },

    async runAiSummary() {
        const text = document.getElementById('aiMeetingText').value.trim();
        if (!text) { Toast.error('请粘贴会议纪要文本'); return; }
        const btn = document.getElementById('aiMeetingRun');
        btn.disabled = true; btn.textContent = '提取中...';
        const res = await AgentProgress.run({ url: '/api/meetings/ai-summarize', data: { text }, title: 'AI 提取会议纪要' });
        btn.disabled = false; btn.textContent = '⚡ 提取';
        if (res && res.success && res.meeting) {
            const m = res.meeting;
            document.getElementById('aiMeetingResult').innerHTML = `
                <div class="card" style="margin-top:8px;">
                    <div class="card-title">提取结果（确认后一键创建会议）</div>
                    <p><strong>标题：</strong>${Utils.esc(m.title || '')}</p>
                    <p><strong>目的：</strong>${Utils.esc(m.purpose || '')}</p>
                    <p><strong>外部参与人：</strong>${Utils.esc(m.participants_external || '')}</p>
                    <p><strong>内部参与人：</strong>${Utils.esc(m.participants_internal || '')}</p>
                    ${m.consensus && m.consensus.length ? `<p><strong>共识：</strong></p><ul>${m.consensus.map(c=>`<li>${Utils.esc(c)}</li>`).join('')}</ul>` : ''}
                    ${m.tasks && m.tasks.length ? `<p><strong>任务：</strong></p><ul>${m.tasks.map(t=>`<li>${Utils.esc(t.task_description||'')} — ${Utils.esc(t.owner||'')} (${Utils.esc(t.planned_date||'')})</li>`).join('')}</ul>` : ''}
                    <button class="btn btn-primary" onclick="Page3.createFromAi(${JSON.stringify(m).replace(/"/g,'&quot;')})">一键创建会议</button>
                </div>`;
            Toast.success('提取完成，确认后可一键创建');
        } else {
            Toast.error((res && res.message) || '提取失败');
        }
    },

    createFromAi(m) {
        Modal.close();
        // 预填表单创建会议
        this.openForm(null, {
            title: m.title || '', purpose: m.purpose || '',
            participants_external: m.participants_external || '',
            participants_internal: m.participants_internal || '',
            material_name: m.material_name || '',
            _ai_consensus: m.consensus || [],
            _ai_tasks: m.tasks || [],
        });
    },

    // ===== 批量智能提取（上传文件 / 粘贴多场） =====
    openBatchSummary() {
        const selOem = (document.getElementById('p3Customer') || {}).value || '';
        Modal.open(`
            <div class="modal-header"><h3>&#9889; 批量智能提取会议纪要</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">
                一次提取多场会议：上传 .txt/.md/.docx 文件（每个文件 = 一场），或在文本框粘贴多场纪要（用 <code>===</code> 单独成行分隔）。
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1;"><label>统一归属客户（可选，提取后可逐条改）</label>
                    <select id="batchOem">${Utils.customerOptions(selOem)}</select></div>
            </div>
            <div class="form-group"><label>选择本地文件（支持 .txt/.md/.docx，每个文件 = 一场）</label>
                <div style="display:flex;align-items:center;gap:8px;">
                    <button type="button" class="btn btn-secondary" onclick="Page3.pickBatchFiles()">&#128193; 选择文件</button>
                    <span id="batchFilesLabel" style="font-size:12px;color:var(--text-muted);">未选择文件</span>
                </div>
            </div>
            <div class="form-group"><label>或粘贴多场会议纪要（用 <code>===</code> 单独成行分隔每场）</label>
                <textarea id="batchText" rows="6" placeholder="第一场会议纪要内容...&#10;===&#10;第二场会议纪要内容..."></textarea>
            </div>
            <div style="text-align:right;margin-bottom:8px;">
                <button class="btn btn-primary" id="batchRun" data-perm="meeting.edit">&#9889; 开始批量提取</button>
            </div>
            <div id="batchResults"></div>`);
        document.getElementById('batchRun').onclick = () => this.runBatchSummary();
    },

    pickBatchFiles() {
        Utils.pickFiles({
            multiple: true,
            accept: '.txt,.md,.csv,.docx',
            onPicked: (files) => {
                this._batchFiles = files;
                document.getElementById('batchFilesLabel').textContent =
                    files.length === 1 ? files[0].name : `已选 ${files.length} 个文件`;
            }
        });
    },

    async runBatchSummary() {
        const oem = document.getElementById('batchOem').value || '';
        const files = this._batchFiles || [];
        const paste = (document.getElementById('batchText') || {}).value || '';
        // 粘贴文本按 === 单独成行拆分
        const texts = paste.split(/^\s*={3,}\s*$/m).map(s => s.trim()).filter(Boolean);
        if (!files.length && !texts.length) { Toast.error('请选择文件或粘贴会议纪要文本'); return; }

        const btn = document.getElementById('batchRun');
        btn.disabled = true; btn.textContent = '提取中...';
        document.getElementById('batchResults').innerHTML = '<div class="loading"></div>';
        let res = null;
        try {
            if (files.length) {
                const fd = new FormData();
                files.forEach(f => fd.append('files', f));
                fd.append('oem', oem);
                res = await AgentProgress.run({
                    url: '/api/meetings/ai-summarize-batch',
                    data: fd,
                    title: '批量AI提取会议纪要',
                });
            } else {
                res = await AgentProgress.run({
                    url: '/api/meetings/ai-summarize-batch',
                    data: { texts: texts.map((t, i) => ({ text: t, filename: `粘贴第${i + 1}场`, oem })) },
                    title: '批量AI提取会议纪要',
                });
            }
        } finally {
            btn.disabled = false; btn.textContent = '⚡ 开始批量提取';
            this._batchFiles = null;   // E: 提交后重置选择状态
            const lb = document.getElementById('batchFilesLabel');
            if (lb) lb.textContent = '未选择文件';
        }
        if (!res || !res.success) {
            Toast.error((res && res.message) || '批量提取失败');
            document.getElementById('batchResults').innerHTML = '';
            return;
        }
        this._batchResults = (res.results || []).map(r => ({
            filename: r.filename || '',
            oem: r.oem || oem,
            success: !!r.success,
            meeting: r.meeting || null,
            error: r.error || '',
        }));
        this.renderBatchResults();
    },

    renderBatchResults() {
        const items = this._batchResults || [];
        if (!items.length) { document.getElementById('batchResults').innerHTML = ''; return; }
        const okCount = items.filter(x => x.success).length;
        const rows = items.map((x, i) => {
            if (!x.success) {
                return `<tr><td>${Utils.esc(x.filename)}</td><td colspan="4" style="color:var(--danger,#c0392b);">提取失败：${Utils.esc(x.error)}</td></tr>`;
            }
            const m = x.meeting || {};
            return `<tr>
                <td>${Utils.esc(x.filename)}</td>
                <td><input type="text" class="br-title" value="${Utils.esc(m.title || '')}" style="width:100%;"></td>
                <td><select class="br-oem">${Utils.customerOptions(x.oem)}</select></td>
                <td>${(m.consensus || []).length} 条 / ${(m.tasks || []).length} 任务</td>
                <td><input type="date" class="br-date" value="${Utils.esc((m.meeting_date || '').substring(0, 10))}"></td>
            </tr>`;
        }).join('');
        document.getElementById('batchResults').innerHTML = `
            <div class="card-title" style="margin-top:8px;">提取结果（成功 ${okCount}/${items.length}，可逐条修改后一键创建）</div>
            <div class="table-wrapper"><table>
                <thead><tr><th>来源</th><th>会议标题</th><th>客户</th><th>共识/任务</th><th>会议日期</th></tr></thead>
                <tbody>${rows}</tbody>
            </table></div>
            <div style="text-align:right;margin-top:10px;">
                <button class="btn btn-success" onclick="Page3.batchCreateMeetings()">💾 全部创建为会议（${okCount}）</button>
            </div>`;
    },

    async batchCreateMeetings() {
        const items = (this._batchResults || []).filter(x => x.success);
        if (!items.length) { Toast.error('没有可创建的会议'); return; }
        const rows = document.querySelectorAll('#batchResults tbody tr');
        const meetings = [];
        items.forEach((x, i) => {
            const tr = rows[i];
            const m = x.meeting || {};
            meetings.push({
                oem: (tr.querySelector('.br-oem') || {}).value || x.oem,
                title: ((tr.querySelector('.br-title') || {}).value || m.title || '').trim(),
                meeting_date: (tr.querySelector('.br-date') || {}).value || m.meeting_date || '',
                purpose: m.purpose || '',
                participants_external: m.participants_external || '',
                participants_internal: m.participants_internal || '',
                material_name: m.material_name || '',
                consensus: m.consensus || [],
                tasks: m.tasks || [],
            });
        });
        const res = await API.post('/api/meetings/batch-create', { meetings });
        if (res && res.success) {
            const msg = `已创建 ${res.created_count} 场会议` + (res.failed_count ? `，${res.failed_count} 场失败` : '');
            Toast.success(msg);
            Modal.close();
            this.loadList();
        }
    },

    async loadList(page) {
        page = page || 1;
        this._pgPage = page;
        const oem = document.getElementById('p3Customer').value;
        let url = `/api/meetings?page=${page}&page_size=50&`;
        if (oem) url += `oem=${encodeURIComponent(oem)}&`;

        const container = document.getElementById('p3List');
        container.innerHTML = '<div class="loading"></div>';
        const res = await API.get(url);
        const data = res && res.items;
        if (!data || !data.length) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9998;</div><p>暂无会议记录</p></div>';
            Utils.renderPager(document.getElementById('p3Pager'), res, p => Page3.loadList(p));
            return;
        }
        const rows = data.map(m => `
            <tr>
                <td class="cell-ellipsis" title="${Utils.esc(m.title) || ''}" style="vertical-align:middle;">${Utils.esc(m.title)}</td>
                <td style="vertical-align:middle;">${Utils.esc(m.customer_name)}</td>
                <td style="vertical-align:middle;">${Utils.formatDate(m.meeting_date)}</td>
                <td style="vertical-align:middle;white-space:nowrap;">${Utils.esc(m.recorder) || '-'}</td>
                <td style="vertical-align:middle;max-width:360px;white-space:pre-wrap;word-break:break-word;line-height:1.5;">${Utils.esc(m.purpose) || '-'}</td>
                <td style="white-space:nowrap;vertical-align:middle;">
                    <button class="btn btn-secondary btn-sm" onclick="Page3.openDetail(${m.id})">详情</button>
                    <button class="btn btn-secondary btn-sm" data-perm="meeting.edit" onclick="Page3.openForm(${m.id})">编辑</button>
                    <button class="btn btn-primary btn-sm" data-perm="meeting.edit" onclick="Page3.openTasks(${m.id})">任务</button>
                    <button class="btn btn-secondary btn-sm" data-perm="meeting.edit" onclick="Page3.notifyMeeting(${m.id})">下发通知</button>
                    <button class="btn btn-info btn-sm" onclick="Page3.openMaterials(${m.id})">材料${(m.materials_count||0)>0?`<span class="badge">${m.materials_count}</span>`:''}</button>
                    <button class="btn btn-success btn-sm" onclick="Page3.exportExcel(${m.id})">导出</button>
                    <button class="btn btn-danger btn-sm" data-perm="meeting.edit" onclick="Page3.deleteMeeting(${m.id})">删除</button>
                </td>
            </tr>`).join('');
        container.innerHTML = `<div class="card"><div class="table-wrapper"><table>
            <thead><tr><th>会议名称</th><th>客户</th><th>日期</th><th>记录人</th><th>目的</th><th>操作</th></tr></thead>
            <tbody>${rows}</tbody>
        </table></div></div><div id="p3Pager"></div>`;
        Utils.renderPager(document.getElementById('p3Pager'), res, p => Page3.loadList(p));
    },

    // 导出客户会议为 Excel（按 docs/会议纪要模板.xlsx 填充，todo：模板导出替代 md）
    exportExcel(id) {
        Toast.info('正在生成 Excel...');
        window.location.href = `/api/meetings/${id}/export/xlsx`;
    },

    async openForm(id, prefill) {
        let m = { oem: '', title: '', purpose: '', meeting_date: '', participants_external: '', participants_internal: '', recorder: '', material_name: '', consensus: [], tasks: [] };
        if (id) {
            const detail = await API.get(`/api/meetings/${id}`);
            if (!detail || detail.error) { Toast.error('加载详情失败'); return; }
            m = detail;
            m.consensus = (detail.consensus || []).map(c => c.content);
        } else {
            // 新建默认记录人 = 当前登录人（todo#3，可改）
            m.recorder = (App.currentUser && App.currentUser.name) || '';
            if (prefill) {
                // AI 提取后预填
                m.title = prefill.title || '';
                m.purpose = prefill.purpose || '';
                m.oem = prefill.oem || '';
                m.participants_external = prefill.participants_external || '';
                m.participants_internal = prefill.participants_internal || '';
                m.material_name = prefill.material_name || '';
                m.consensus = prefill._ai_consensus || [];
                m.tasks = prefill._ai_tasks || [];
            }
        }
        const title = id ? '编辑会议' : '新增会议';
        const consensusHtml = (m.consensus.length ? m.consensus : ['']).map((c, i) =>
            `<div class="consensus-row" style="display:flex;gap:8px;margin-bottom:8px;">
                <textarea class="consensus-input" rows="2" placeholder="共识内容..." style="flex:1;resize:vertical;min-height:40px;font-family:inherit;">${Utils.esc(c)}</textarea>
                <button class="btn btn-danger btn-sm" style="align-self:flex-start;" onclick="this.parentElement.remove()">-</button>
            </div>`
        ).join('');

        // 待办任务（todo#7：合并进编辑弹窗，编辑会议时一并维护）
        this._formTasks = (m.tasks || []).map(t => ({ ...t }));
        this._formMeetingId = id || null;
        this._tasksStandalone = false;  // 编辑弹窗模式：批量保存
        const tasksHtml = this.renderFormTasks(this._formMeetingId);

        Modal.open(`
            <div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="Modal.close()">&times;</button></div>
            <div style="margin-bottom:16px;">
                <div class="card-title" style="margin-bottom:8px;">基本信息</div>
                <div class="form-row">
                    <div class="form-group"><label>客户 *</label><select id="mfMeetCust">${Utils.customerOptions(m.oem)}</select></div>
                    <div class="form-group"><label>会议日期 *</label><input type="date" id="mfMeetDate" value="${m.meeting_date ? m.meeting_date.substring(0,10) : ''}"></div>
                </div>
                <div class="form-group"><label>会议名称 *</label><input type="text" id="mfMeetTitle" value="${Utils.esc(m.title)}" placeholder="如：2026Q1客户季度复盘会"></div>
                <div class="form-group"><label>会议目的</label><textarea id="mfMeetPurpose" rows="2" placeholder="如：季度业务回顾" style="width:100%;resize:vertical;font-family:inherit;">${Utils.esc(m.purpose)}</textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>外部参与人</label><textarea id="mfMeetExtPart" rows="2" placeholder="多人用逗号分隔" style="width:100%;resize:vertical;font-family:inherit;">${Utils.esc(m.participants_external)}</textarea></div>
                    <div class="form-group"><label>内部参与人</label><textarea id="mfMeetIntPart" rows="2" placeholder="多人用逗号分隔" style="width:100%;resize:vertical;font-family:inherit;">${Utils.esc(m.participants_internal)}</textarea></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>记录人</label><input type="text" id="mfMeetRecorder" value="${Utils.esc(m.recorder)}" placeholder="纪要记录人，默认当前登录人"></div>
                    <div class="form-group"><label>会议材料名称</label><input type="text" id="mfMeetMaterial" value="${Utils.esc(m.material_name)}" placeholder="如：2026Q1汇报材料.pptx"></div>
                </div>
            </div>
            <div style="margin-bottom:16px;">
                <div class="card-title" style="margin-bottom:8px;">会议共识 <button type="button" class="btn btn-secondary btn-sm" style="margin-left:8px;" onclick="Page3.addConsensusRow()">+ 增加</button></div>
                <div id="consensusContainer">${consensusHtml}</div>
            </div>
            <div style="margin-bottom:16px;">
                <div class="card-title" style="margin-bottom:8px;">待办任务 <button type="button" class="btn btn-secondary btn-sm" style="margin-left:8px;" onclick="Page3.formAddTask()" data-perm="meeting.edit">+ 新增待办</button></div>
                <div id="p3FormTasks">${tasksHtml}</div>
            </div>
            <div class="modal-footer" style="display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border-row);padding-top:12px;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="Page3.saveForm(${id || 'null'})">保存</button>
            </div>
        `);
        // 草稿保护：有未保存内容时关闭需确认 + 自动保存到 localStorage
        this._setupDraftProtection(id);
        // 从 localStorage 恢复上次未保存的草稿（仅新建时）
        if (!id) this._restoreDraft();
    },

    // 草稿保护：Modal 关闭前检查 + 自动保存到 localStorage
    _setupDraftProtection(id) {
        const DRAFT_KEY = 'p3_meeting_draft';
        // 定时自动保存（每 3 秒）
        if (this._draftTimer) clearInterval(this._draftTimer);
        this._draftTimer = setInterval(() => this._saveDraft(DRAFT_KEY), 3000);
        // Modal 关闭检查
        Modal._draftCheck = () => this._hasUnsavedContent();
        // 页面卸载前保存
        this._beforeUnloadDraft = () => this._saveDraft(DRAFT_KEY);
        window.addEventListener('beforeunload', this._beforeUnloadDraft);
    },

    _hasUnsavedContent() {
        const title = (document.getElementById('mfMeetTitle') || {}).value;
        const purpose = (document.getElementById('mfMeetPurpose') || {}).value;
        const consensus = Array.from(document.querySelectorAll('.consensus-input')).map(el => el.value.trim()).filter(v => v);
        return (title && title.trim()) || (purpose && purpose.trim()) || consensus.length > 0;
    },

    _saveDraft(key) {
        const titleEl = document.getElementById('mfMeetTitle');
        if (!titleEl) return;  // 表单已关闭
        const draft = {
            oem: (document.getElementById('mfMeetCust') || {}).value || '',
            title: titleEl.value || '',
            purpose: (document.getElementById('mfMeetPurpose') || {}).value || '',
            meeting_date: (document.getElementById('mfMeetDate') || {}).value || '',
            participants_external: (document.getElementById('mfMeetExtPart') || {}).value || '',
            participants_internal: (document.getElementById('mfMeetIntPart') || {}).value || '',
            recorder: (document.getElementById('mfMeetRecorder') || {}).value || '',
            material_name: (document.getElementById('mfMeetMaterial') || {}).value || '',
            consensus: Array.from(document.querySelectorAll('.consensus-input')).map(el => el.value).filter(v => v),
            saved_at: new Date().toISOString()
        };
        try { localStorage.setItem(key, JSON.stringify(draft)); } catch(e) {}
    },

    _restoreDraft() {
        const DRAFT_KEY = 'p3_meeting_draft';
        let draft;
        try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch(e) { return; }
        if (!draft || !draft.title) return;
        // 超过 24 小时的草稿不恢复
        if (Date.now() - new Date(draft.saved_at).getTime() > 86400000) {
            localStorage.removeItem(DRAFT_KEY);
            return;
        }
        // 填回表单
        if (draft.oem) { const el = document.getElementById('mfMeetCust'); if (el) el.value = draft.oem; }
        if (draft.title) { const el = document.getElementById('mfMeetTitle'); if (el) el.value = draft.title; }
        if (draft.purpose) { const el = document.getElementById('mfMeetPurpose'); if (el) el.value = draft.purpose; }
        if (draft.meeting_date) { const el = document.getElementById('mfMeetDate'); if (el) el.value = draft.meeting_date; }
        if (draft.participants_external) { const el = document.getElementById('mfMeetExtPart'); if (el) el.value = draft.participants_external; }
        if (draft.participants_internal) { const el = document.getElementById('mfMeetIntPart'); if (el) el.value = draft.participants_internal; }
        if (draft.recorder) { const el = document.getElementById('mfMeetRecorder'); if (el) el.value = draft.recorder; }
        if (draft.material_name) { const el = document.getElementById('mfMeetMaterial'); if (el) el.value = draft.material_name; }
        // 恢复共识
        if (draft.consensus && draft.consensus.length) {
            const container = document.getElementById('consensusContainer');
            if (container) {
                container.innerHTML = draft.consensus.map(c =>
                    `<div class="consensus-row" style="display:flex;gap:8px;margin-bottom:8px;">
                        <input type="text" class="consensus-input" value="${Utils.esc(c)}" placeholder="共识内容..." style="flex:1;">
                        <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">-</button>
                    </div>`).join('');
            }
        }
        Toast.info('已恢复上次未保存的草稿');
    },

    _clearDraft() {
        if (this._draftTimer) { clearInterval(this._draftTimer); this._draftTimer = null; }
        if (this._beforeUnloadDraft) { window.removeEventListener('beforeunload', this._beforeUnloadDraft); this._beforeUnloadDraft = null; }
        try { localStorage.removeItem('p3_meeting_draft'); } catch(e) {}
        Modal._draftCheck = null;
    },

    // 渲染编辑弹窗内的待办任务行（todo#7）
    renderFormTasks(meetingId) {
        const tasks = this._formTasks || [];
        if (!tasks.length) return `<div id="p3ft-empty" style="font-size:12px;color:var(--text-muted);padding:4px 0;">暂无待办，点「+ 新增待办」添加</div>`;
        const rows = tasks.map((t, i) => this.renderFormTaskRow(t, meetingId, i)).join('');
        return `<div id="p3ft-tbody" style="display:flex;flex-direction:column;gap:8px;">${rows}</div>`;
    },

    renderFormTaskRow(t, meetingId, idx) {
        const empty = document.getElementById('p3ft-empty');
        if (empty) empty.remove();
        const statusOpts = ['待处理', '进行中', '已完成'].map(s =>
            `<option value="${s}" ${(t.status === s) ? 'selected' : ''}>${s}</option>`).join('');
        const tid = t.id != null ? t.id : 'NEW';
        return `<div class="card" data-tid="${tid === 'NEW' ? '' : t.id}" data-idx="${idx}" data-dirty="0" style="padding:10px 12px;">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                <input type="text" class="p3ft-owner" value="${Utils.esc(t.owner || '')}" placeholder="负责人" style="flex:0 0 140px;font-size:12px;">
                <input type="date" class="p3ft-planned" value="${Utils.esc(t.planned_date || '')}" style="flex:0 0 140px;font-size:12px;">
                <select class="p3ft-status" style="flex:0 0 100px;font-size:12px;">${statusOpts}</select>
                <span style="flex:1;"></span>
                <button class="btn btn-primary btn-sm" onclick="Page3.formSaveTask(this)">保存</button>
                ${tid !== 'NEW' ? `<button class="btn btn-danger btn-sm" onclick="Page3.formDelTask(this,${t.id},${meetingId})">删除</button>` : ''}
            </div>
            <textarea class="p3ft-desc" rows="2" placeholder="任务描述 *" style="width:100%;resize:vertical;font-family:inherit;font-size:12px;">${Utils.esc(t.task_description || '')}</textarea>
        </div>`;
    },

    _editTaskDesc(idx) {
        const row = document.querySelector(`div[data-idx="${idx}"]`);
        if (!row) return;
        const ta = row.querySelector('.p3ft-desc');
        if (ta) ta.focus();
    },

    formAddTask() {
        // 先把当前 DOM 里已填写的行同步回 _formTasks，再新增空行重渲染，
        // 避免「新增一行导致前面已填/已点保存的行回退消失」（意见 #52）。
        this._syncDomTasksToForm();
        if (!this._formTasks) this._formTasks = [];
        this._formTasks.push({ id: null, task_description: '', owner: '', planned_date: '', status: '待处理' });
        // 独立任务弹窗在只读模式下点新增 → 自动切到编辑态
        if (this._tasksStandalone && !this._tasksEditing) {
            this._tasksEditing = true;
            const editBtn = document.getElementById('p3TaskEditBtn');
            if (editBtn) { editBtn.textContent = '完成'; editBtn.onclick = () => this._toggleTasksEdit(false); }
        }
        const box = document.getElementById('p3FormTasks');
        if (box) box.innerHTML = this.renderFormTasks(this._formMeetingId);
        this._focusFirstDesc();
    },

    // 读取当前弹窗内所有待办 DOM 行，写回 _formTasks，保证重渲染不丢已填内容（意见 #52）
    _syncDomTasksToForm() {
        const wrap = document.getElementById('p3FormTasks');
        if (!wrap || !this._formTasks) return;
        const rows = wrap.querySelectorAll('[data-tid]');
        const nid = (r) => r.getAttribute('data-tid') || null;
        // 已存在的 id 行直接更新其值
        [...rows].forEach((tr, i) => {
            const id = nid(tr);
            const item = { id: id || null, task_description: tr.querySelector('.p3ft-desc')?.value.trim() || '', owner: tr.querySelector('.p3ft-owner')?.value.trim() || '', planned_date: tr.querySelector('.p3ft-planned')?.value || '', status: tr.querySelector('.p3ft-status')?.value || '待处理' };
            if (id) {
                const existing = this._formTasks.find(t => String(t.id) === String(id));
                if (existing) Object.assign(existing, item); else this._formTasks.push(item);
            } else {
                // 未入库新行：替换第一个 id=null 的占位，保证后续新增仍添加新行
                const idx = this._formTasks.findIndex(t => t.id === null);
                if (idx >= 0) this._formTasks[idx] = item; else this._formTasks.push(item);
            }
        });
    },

    _focusFirstDesc() {
        const el = document.querySelector('#p3FormTasks .p3ft-desc');
        if (el) el.focus();
    },

    // 行内"保存"：仅校验并标记该行已填；真正的入库由底部「保存会议」时统一执行（todo/意见 #52）
    // 这样新增会议也能把待办一起存，不再出现"增加一个，前面保存就消失"。
    async formSaveTask(btn) {
        const row = btn.closest('[data-tid]');  // 兼容 div 卡片布局
        const desc = row.querySelector('.p3ft-desc').value.trim();
        if (!desc) { Toast.error('任务描述不能为空'); return; }
        const tid = row.dataset.tid;
        const data = {
            task_description: desc,
            owner: (row.querySelector('.p3ft-owner') || {}).value?.trim() || '',
            planned_date: (row.querySelector('.p3ft-planned') || {}).value || '',
            status: (row.querySelector('.p3ft-status') || {}).value || '待处理',
        };
        if (this._tasksStandalone) {
            // 独立任务弹窗：立即调后端 API
            const mid = this._formMeetingId;
            if (tid) {
                const res = await API.put(`/api/tasks/${tid}`, data);
                if (res && !res.error) {
                    Toast.success('任务已更新');
                    // 同步 _formTasks 里的值
                    const t = (this._formTasks || []).find(x => String(x.id) === String(tid));
                    if (t) Object.assign(t, data);
                }
                else Toast.error('更新失败');
            } else {
                const res = await API.post(`/api/meetings/${mid}/tasks`, data);
                if (res && !res.error) {
                    Toast.success(res.notify ? '任务已添加，已通知责任人' : '任务已添加');
                    // 重新拉数据刷新 _formTasks
                    const tasks = await API.get(`/api/meetings/${mid}/tasks`);
                    this._formTasks = (tasks || []).map(t => ({ ...t }));
                    // 编辑态下重渲染编辑列表
                    if (this._tasksEditing) {
                        const box = document.getElementById('p3FormTasks');
                        if (box) box.innerHTML = this.renderFormTasks(mid);
                    }
                }
            }
        } else {
            // 编辑弹窗模式：标记待保存，保存会议时批量入库
            this._markRowSaved(row);
            Toast.success('待办已记录，保存会议时一并入库');
        }
    },

    // 收集编辑弹窗内当前所有待办行（含未入库的新行）
    _collectFormTasks() {
        const rows = document.querySelectorAll('#p3FormTasks [data-tid]');
        const tasks = [];
        rows.forEach(row => {
            const desc = (row.querySelector('.p3ft-desc') || {}).value || '';
            if (!desc.trim()) return;
            tasks.push({
                id: row.dataset.tid || null,
                data: {
                    task_description: desc.trim(),
                    owner: ((row.querySelector('.p3ft-owner') || {}).value || '').trim(),
                    planned_date: (row.querySelector('.p3ft-planned') || {}).value || '',
                    status: (row.querySelector('.p3ft-status') || { value: '待处理' }).value || '待处理',
                },
            });
        });
        return tasks;
    },

    async formDelTask(btn, tid, meetingId) {
        const row = btn.closest('[data-tid]');  // 兼容 div 卡片布局
        if (!tid) {
            // 新增未入库行：直接删行 + 从 _formTasks 移除
            if (this._formTasks && Array.isArray(this._formTasks)) {
                const idx = (this._formTasks || []).findIndex(t => t.id === null);
                if (idx >= 0) this._formTasks.splice(idx, 1);
            }
            if (row) row.remove();
            return;
        }
        if (!confirm('确定删除这条待办？')) return;
        const r = await API.del(`/api/tasks/${tid}`);
        if (r && !r.error) {
            if (this._formTasks && Array.isArray(this._formTasks)) {
                this._formTasks = this._formTasks.filter(t => t.id !== tid);
            }
            Toast.success('待办已删除');
            if (this._tasksStandalone) {
                // 编辑态删后重渲染编辑列表
                if (this._tasksEditing) {
                    const box = document.getElementById('p3FormTasks');
                    if (box) box.innerHTML = this.renderFormTasks(this._formMeetingId);
                }
            } else if (row) {
                row.remove();
            }
        }
        else Toast.error('删除失败');
    },

    _markRowSaved(row) {
        if (row) { row.style.opacity = '0.7'; }
        const btn = row && row.querySelector('.btn-primary');
        if (btn) btn.textContent = '已保存';
    },

    addConsensusRow() {
        const container = document.getElementById('consensusContainer');
        const div = document.createElement('div');
        div.className = 'consensus-row';
        div.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;';
        div.innerHTML = `<input type="text" class="consensus-input" placeholder="共识内容..." style="flex:1;"><button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">-</button>`;
        container.appendChild(div);
    },

    async saveForm(id) {
        const data = {
            oem: document.getElementById('mfMeetCust').value,
            title: document.getElementById('mfMeetTitle').value.trim(),
            purpose: document.getElementById('mfMeetPurpose').value.trim(),
            meeting_date: document.getElementById('mfMeetDate').value,
            participants_external: document.getElementById('mfMeetExtPart').value.trim(),
            participants_internal: document.getElementById('mfMeetIntPart').value.trim(),
            recorder: document.getElementById('mfMeetRecorder').value.trim(),
            material_name: document.getElementById('mfMeetMaterial').value.trim(),
            consensus: Array.from(document.querySelectorAll('.consensus-input')).map(el => el.value.trim()).filter(v => v)
        };
        if (!data.oem || !data.title || !data.meeting_date) {
            Toast.error('请填写必填字段');
            return;
        }
        // 收集当前编辑弹窗内的待办行（含未入库新行），随会议主体一并保存（意见 #52：不再"保存就消失"）
        const tasks = this._collectFormTasks();
        let meetingId = id;
        let result;
        if (meetingId) {
            result = await API.put(`/api/meetings/${meetingId}`, data);
        } else {
            result = await API.post('/api/meetings', data);
            meetingId = result && result.id;
        }
        if (result && !result.error && meetingId) {
            // 逐条入库待办：有 id → 更新；无 id → 新增
            for (const t of tasks) {
                if (t.id) {
                    await API.put(`/api/tasks/${t.id}`, t.data);
                } else {
                    await API.post(`/api/meetings/${meetingId}/tasks`, t.data);
                }
            }
            Toast.success(id ? '更新成功' : '创建成功');
            this._clearDraft();
            Modal.forceClose();
            this.loadList();
        } else {
            Toast.error((result && result.error) || '保存失败，请检查必填字段');
        }
    },

    async openDetail(id) {

        // 会议共识拼接（供「AI 拆解为需求」预填文本）

        Modal.open(`

                <tr><td style="color:var(--text-secondary);width:100px;">客户</td><td>${Utils.esc(m.customer_name)}</td></tr>
                <tr><td style="color:var(--text-secondary);">日期</td><td>${Utils.formatDate(m.meeting_date)}</td></tr>
                <tr><td style="color:var(--text-secondary);">记录人</td><td>${Utils.esc(m.recorder) || '-'}</td></tr>
                <tr><td style="color:var(--text-secondary);">目的</td><td>${Utils.esc(m.purpose) || '-'}</td></tr>
                <tr><td style="color:var(--text-secondary);">外部参与</td><td>${Utils.esc(m.participants_external) || '-'}</td></tr>
                <tr><td style="color:var(--text-secondary);">内部参与</td><td>${Utils.esc(m.participants_internal) || '-'}</td></tr>
                <tr><td style="color:var(--text-secondary);">材料</td><td>${Utils.esc(m.material_name) || '-'}</td></tr>
            </table>
            ${consensusHtml ? `<div class="card-title">会议共识</div><ol style="padding-left:20px;margin-bottom:16px;">${consensusHtml}</ol>` : ''}
            ${tasksHtml ? `<div class="card-title">关键任务</div><div style="margin-bottom:16px;">${tasksHtml}</div>` : ''}
            <div class="modal-footer" style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--border-row);padding-top:12px;">
                <span style="flex:1;font-size:11px;color:var(--text-muted);align-self:center;">把本会议拆解为需求（联动需求管理，可跳过）</span>
                ${consensusText ? `<button class="btn btn-primary btn-sm" onclick="Modal.close();PageDemand.openAiGenerate(${m.id});PageDemand.prefillAiText(${JSON.stringify(consensusText).replace(/"/g,'&quot;')})">&#9889; AI 拆解为需求</button>` : ''}
                <button class="btn btn-success btn-sm" onclick="Page3.toDemand(${m.id})">+ 拆解为需求</button>
            </div>
