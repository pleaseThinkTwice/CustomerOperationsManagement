<script>
/**
 * 页面11 - 系统管理（用户与权限）
 * 仅 user.manage 权限可见。
 * 上半区：用户权限管理（基于《客户营运管理平台账号申请.xlsx》）
 *   - 为用户配置可访问客户(OEM) 多选权限、账号状态、自定义动态列
 *   - 动态列可由管理员新增/删除
 * 下半区：用户 CRUD / 角色说明 / 登录日志 / 操作日志
 */
const PageSysAdmin = {
    initialized: false,
    _users: [],       // 全量用户（含账号信息/oem权限/动态列）
    _dynCols: [],     // 自定义动态列定义
    _perms: [],       // 角色权限点列表
    _actType: 'page', // 行为频率视图：page / question

    init() {
        const container = document.getElementById('page11');
        if (!this.initialized) {
            container.innerHTML = this.renderLayout();
            this.initialized = true;
        }
        this.bindEvents();
        this.loadAll();
        this.loadUsers();
        this.loadRoles();
        this.loadLoginLogs();
        this.loadOpLogs();
        this.loadActivity();
    },

    // ===== 汇总加载 =====
    async loadAll() {
        const d = await API.get('/api/users/all-detail');
        if (!d || !d.success) { Toast.error((d && d.message) || '加载用户权限失败'); return; }
        this._users = d.users || [];
        this._dynCols = d.dynamic_cols || [];
        this._perms = d.permissions || [];
        // 全量可配置模块（判断「覆盖=全部」用）
        this._allModules = (d.module_pages || []).map(m => m.perm);
        this.renderPermTable();
    },

    // ===== 在弹窗中保存用户权限/账号信息 =====
    async savePerms(uid) {
        const oems = [...document.querySelectorAll('.pup-oem-cb:checked')].map(x => x.value);
        const account_status = document.getElementById('pup-status').value.trim();
        const dyn = {};
        this._dynCols.forEach(co => {
            const el = document.getElementById('pup-dc-' + co.col_key);
            if (el) dyn[co.col_key] = el.value.trim();
        });
        const r1 = await API.put(`/api/users/${uid}/oem-perms`, { oems });
        const r2 = await API.put(`/api/users/${uid}/account-info`, { account_status, dynamic_cols: dyn });
        if (r1 && r1.success && r2 && r2.success) {
            Toast.success('权限已保存');
            Modal.close();
            this.loadAll();
        } else {
            Toast.error('保存失败');
        }
    },

    // ===== 权限表头/单元格（含可见模块）=====
    moduleBadge(u) {
        if (u.is_admin) return '<span class="badge badge-info">全部</span>';
        if (!u.module_override) return '<span style="color:var(--text-muted);font-size:11px;">跟随角色</span>';
        const mods = Array.isArray(u.module_modules) ? u.module_modules : [];
        if (!mods.length) return '<span class="badge badge-danger" title="已显式隐藏全部模块">全部隐藏</span>';
        // 覆盖值覆盖了全部可配置模块 → 显示「全部」
        const all = this._allModules || [];
        const coversAll = all.length && all.every(p => mods.includes(p));
        if (coversAll) return '<span class="badge badge-success" title="已配置为全部模块可见">全部</span>';
        return `<span class="badge badge-secondary" title="${Utils.esc(mods.join('、'))}">自定义 ${mods.length} 个</span>`;
    },

    renderPermTable() {
        const wrap = document.getElementById('psaPermWrap');
        if (!wrap) return;
        const cust = App.customers || [];
        const custMap = {};
        (cust || []).forEach(x => { custMap[x.oem] = x.oem_ch || x.name_cn || x.oem; });
        const addBtn = document.getElementById('psaAddCol');
        if (addBtn) addBtn.onclick = () => this.addDynamicCol();
        if (!this._users.length) {
            wrap.innerHTML = '<div class="table-wrapper"><table><thead><tr>' +
                `<th>工号</th><th>姓名</th><th>角色</th><th>可访问客户(OEM)</th><th>可见模块</th><th>账号状态</th>` +
                this.renderDynColHeader() + `<th>操作</th></tr></thead>` +
                `<tbody><tr><td colspan="${6 + this._dynCols.length + 1}" class="empty-state" style="text-align:center;padding:20px;">暂无用户</td></tr></tbody></table></div>`;
            return;
        }
        const head = `<tr>
            <th>工号</th><th>姓名</th><th>角色</th><th>可访问客户(OEM)</th><th>可见模块</th><th>账号状态</th>
            ${this.renderDynColHeader()}<th>操作</th>
        </tr>`;
        const body = this._users.map(u => {
            const allCustOems = (App.customers || []).map(x => x.oem).filter(Boolean);
            const oemPerms = u.oem_perms || [];
            const oemCoversAll = oemPerms.length && allCustOems.length && allCustOems.every(o => oemPerms.includes(o));
            const oemTxt = (u.is_admin || oemCoversAll)
                ? '<span class="badge badge-info">全部</span>'
                : (oemPerms.map(o => {
                    const name = custMap[o] || o;
                    return `<span class="badge badge-secondary" title="${Utils.esc(name)}">${Utils.esc(o)}</span>`;
                }).join(' ') || '<span style="color:var(--text-muted);font-size:11px;">未授权</span>');
            const statusBadge = u.account_status === '停用'
                ? '<span class="badge badge-danger">停用</span>'
                : (u.account_status ? `<span class="badge badge-success">${Utils.esc(u.account_status)}</span>` : '<span style="color:var(--text-muted);font-size:11px;">-</span>');
            const dynTds = this._dynCols.map(co =>
                `<td style="font-size:12px;color:var(--text-secondary);">${Utils.esc((u.dynamic_cols || {})[co.col_key] || '') || '<span style="color:var(--text-muted);font-size:11px;">-</span>'}</td>`).join('');
            const ops = u.is_admin
                ? '<span style="color:var(--text-muted);font-size:11px;">内置管理员</span>'
                : `<button class="btn btn-sm btn-primary" onclick="PageSysAdmin.openPermEdit(${u.id})">配置权限</button>
                   <button class="btn btn-sm btn-secondary" onclick="PageSysAdmin.openModuleEdit(${u.id})">可见模块</button>`;
            return `<tr>
                <td class="mono">${Utils.esc(u.employee_id || u.username || '')}</td>
                <td><strong>${Utils.esc(u.name || u.username || '-')}</strong></td>
                <td><span class="badge badge-info">${Utils.esc(u.role_name || u.role_code || u.role || '-')}</span></td>
                <td style="max-width:200px;">${oemTxt}</td>
                <td>${this.moduleBadge(u)}</td>
                <td>${statusBadge}</td>
                ${dynTds}
                <td class="actions">${ops}</td>
            </tr>`;
        }).join('');
        wrap.innerHTML =
            `<div class="table-wrapper"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
    },

    // ===== 动态列管理 =====
    async addDynamicCol() {
        const name = prompt('请输入要新增的列名（如：负责项目、区域）：');
        if (!name || !name.trim()) return;
        const r = await API.post('/api/user-dynamic-cols', { col_name: name.trim() });
        if (r && r.success) { Toast.success('已新增列'); this.loadAll(); }
        else Toast.error((r && r.message) || '新增失败');
    },

    async delDynamicCol(colKey, colName) {
        if (!confirm(`确定删除动态列「${colName}」？所有用户该列内容将一并清除。`)) return;
        try {
            const res = await fetch('/api/user-dynamic-cols', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ col_key: colKey })
            });
            const json = await res.json();
            if (json && json.success) { Toast.success('已删除'); this.loadAll(); }
            else Toast.error((json && json.message) || '删除失败');
        } catch {
            Toast.error('删除失败');
        }
    },

    openPermEdit(uid) {
        const u = (this._users || []).find(x => x.id === uid);

                <div style="border:1px solid var(--border-card);border-radius:8px;padding:10px;max-height:220px;overflow:auto;">

                                <span style="font-weight:600;">${Utils.esc(c.oem)}</span>

                    </div>
                </div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">

        document.querySelectorAll('.pup-oem-cb').forEach(cb => { cb.checked = on; });
    },

    // ===== 配置「该用户能看见哪些模块」（覆盖角色默认）=====
    async openModuleEdit(uid) {
        const u = (this._users || []).find(x => x.id === uid);
        if (!u) return;
        if (u.is_admin) { alert('管理员拥有全部模块，无需配置'); return; }
        Modal.open('<div class="loading">加载中…</div>');
        const d = await API.get(`/api/users/${uid}/module-perms`);
        if (!d || !d.success) { Modal.open('<div class="empty-state">加载失败</div>'); return; }
        const modules = d.all_modules || [];
        // 当前生效值：有覆盖用覆盖，否则用角色默认
        const cur = new Set(d.is_override ? (d.override_modules || []) : (d.role_default_modules || []));
        const isAll = d.role_code === 'admin' || d.role_default_modules === null;
        const roleTxt = d.role_default_modules && d.role_default_modules.length
            ? `（${d.role_default_modules.length} 个）`
            : (isAll ? '（全部）' : '（无）');
        const listHtml = modules.map(m => `
            <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;cursor:pointer;">
                <input type="checkbox" class="ump-cb" value="${Utils.esc(m.perm)}" ${cur.has(m.perm) ? 'checked' : ''}>
                <span>${Utils.esc(m.name)}</span>
                <small style="color:var(--text-muted);">${Utils.esc(m.page || '')}</small>
            </label>`).join('');
        Modal.open(`
            <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;">
                <h3 style="margin:0;">可见模块 · ${Utils.esc(u.name || u.username)}</h3>
                <button class="modal-close" onclick="Modal.close()">&times;</button>
            </div>
            <div style="font-size:12px;color:var(--text-muted);margin:6px 0 10px;">
                勾选该用户登录后能看到的模块（仅影响本用户，覆盖其角色 ${Utils.esc(u.role_name || u.role_code || '')}${roleTxt} 的默认）。不勾代表该模块隐藏；操作类权限仍跟随角色。
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px 20px;max-height:300px;overflow:auto;border:1px solid var(--border-card);border-radius:8px;padding:12px;">
                ${listHtml || '<div class="empty-state">无可配置模块</div>'}
            </div>
            ${d.is_override ? `<div style="margin-top:10px;font-size:12px;color:var(--warn);">该用户当前为「自定义」可见模块。</div>` : ''}
            <div style="display:flex;gap:8px;margin-top:12px;justify-content:space-between;align-items:center;">
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-sm btn-secondary" onclick="document.querySelectorAll('.ump-cb').forEach(c=>c.checked=true)">全选</button>
                    <button class="btn btn-sm btn-secondary" onclick="document.querySelectorAll('.ump-cb').forEach(c=>c.checked=false)">清空</button>
                    <button class="btn btn-sm btn-danger" id="ump-restore" ${d.is_override ? '' : 'disabled'} title="删除自定义配置，恢复跟随角色默认">恢复角色默认</button>
                </div>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-secondary btn-sm" onclick="Modal.close()">取消</button>
                    <button class="btn btn-primary btn-sm" id="ump-save">保存</button>
                </div>
            </div>`);
        const saveBtn = document.getElementById('ump-save');
        if (saveBtn) saveBtn.onclick = async () => {
            const picked = [...document.querySelectorAll('.ump-cb:checked')].map(c => c.value);
            const res = await API.put(`/api/users/${uid}/module-perms`, { modules: picked });
            if (res && res.success) { Toast.success('可见模块已保存'); Modal.close(); this.loadAll(); }
            else { Modal.close(); Toast.error((res && res.message) || '保存失败'); }
        };
        const restoreBtn = document.getElementById('ump-restore');
        if (restoreBtn) restoreBtn.onclick = async () => {
            if (!confirm('确定恢复该用户为「跟随角色默认」？其自定义可见模块配置将被清除。')) return;
            const res = await API.del(`/api/users/${uid}/module-perms`);
            if (res && res.success) { Toast.success(res.message || '已恢复'); Modal.close(); this.loadAll(); }
            else { Modal.close(); Toast.error((res && res.message) || '恢复失败'); }
        };
    },

    setActivityType(t) {

        document.querySelectorAll('.psa-act-tab').forEach(b => {

            b.classList.toggle('btn-primary', on);
            b.classList.toggle('btn-secondary', !on);

        this.refreshActivity();
    },

    async refreshActivity() {
        const user = document.getElementById('psaActUser');
        const uname = user ? user.value.trim() : '';
        const q = new URLSearchParams({ type: this._actType });
        if (uname) q.set('username', uname);
        const d = await API.get(`/api/activity/stats?${q.toString()}`);
        const box = document.getElementById('psaActivity');
        if (!box) return;
        const rows = (d && d.rows) || [];
        if (!rows.length) {
            box.innerHTML = '<p class="empty-state" style="padding:16px;">暂无行为记录——用户访问页面 / 发起问答后会自动累积</p>';
            return;
        }
        const head = this._actType === 'page'
            ? '<th>用户</th><th>页面</th><th>访问次数</th><th>最近访问</th>'
            : '<th>用户</th><th>查询的问题</th><th>查询次数</th><th>最近查询</th>';
        box.innerHTML = `<div style="max-height:320px;overflow:auto;"><table style="font-size:12px;">
            <thead><tr>${head}</tr></thead><tbody>
            ${rows.map(r => `<tr>
                <td style="white-space:nowrap;">${Utils.esc(r.username) || '-'}</td>
                <td>${this._actType === 'page'
                    ? (r.page_name ? Utils.esc(r.page_name) + ' <span class="mono" style="color:var(--text-muted);font-size:11px;">(' + Utils.esc(r.target) + ')</span>' : Utils.esc(r.target))
                    : Utils.esc(r.target)}</td>
                <td class="mono" style="font-weight:700;">${r.count}</td>
                <td class="mono" style="color:var(--text-muted);font-size:11px;">${Utils.esc(String(r.updated_at || '').replace('T',' ').substring(0,16)) || '-'}</td>

            </tbody></table></div>`;
    },
