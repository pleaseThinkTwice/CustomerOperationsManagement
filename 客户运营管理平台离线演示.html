        <div class="chead"><div class="ctitle" title="by 失效模式 · 累积/增量 + 时间筛选">📊 质量分析</div><div class="qtabs" id="t3QHeadProj"></div></div>
        <div id="t3ProjQuality"></div>
      </div>
      <!-- SOH + 质保台账 -->
      <div class="t3-grid2">
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="识别拐点 · 近似口径">📉 SOH 衰减走势</div></div></div>
          <div>${sohHtml}</div>
        </div>
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="按电芯项目维护">🛡️ 质保台账</div></div></div>
          <div class="tblwrap"><table class="t3-tbl">${colg(20, 20, '')}<thead><tr><th>车型</th><th>PN</th><th>质保条款</th></tr></thead><tbody>${wRows}</tbody></table></div>
        </div>
      </div>
      <!-- 适用车型 -->
      <div class="t3-card">
        <div class="chead"><div><div class="ctitle" title="该电芯项目下所有车型">🚗 适用车型明细</div></div></div>
        <div class="tblwrap"><table class="t3-tbl">${colg(18, 17, 13, 13, 13, 13, 13)}<thead><tr><th>车型</th><th>电池结构</th><th class="num">接入</th><th class="num">占比</th><th class="num">过保数</th><th class="num">预警外发</th><th class="num">预警占比</th></tr></thead><tbody>${carRows}</tbody></table></div>
      </div>
      <!-- 项目关键处置事件 -->
      <div class="t3-card">
        <div class="chead"><div><div class="ctitle" title="OTA / 工艺变更 / 投诉 / 索赔 / 停线 / SOP 节点">🚨 项目关键处置事件</div></div>
          <div class="acts"><button class="btn btn-sm btn-secondary" onclick="Page1.addEvent('${esc(oem)}','${esc(state.cellCap)}')">＋ 录入</button></div></div>
        <div id="t3ProjEvents">${eventsHtml}</div>
      </div>
      <div style="text-align:right;margin-top:6px;">
        <button class="btn btn-primary" onclick="ThreeView.gotoCell('${esc(state.cellCap)}')">🔋 下钻进入电芯视角 →</button>
      </div>`;

    // 质量面板
    renderQualityPanel(document.getElementById('t3ProjQuality'), d.quality || { labels: [], alarm: {}, closed: {}, complaint: {} }, 'Proj', d.outgoingModes);
    enableSort(host);
    addChartDownloads(host);   // 单图表下载 PNG
    // 接入走势粒度切换（todo#2：与客户视角一致）
    const pgran = document.getElementById('t3Gran');
    if (pgran) pgran.addEventListener('click', e => {
      const b = e.target.closest('button[data-g]'); if (!b) return;
      state.gran = b.dataset.g;
      renderProject(host, d, oem);
    });
    // 出货层级切换
    const lseg = document.getElementById('t3LevelSeg');
    if (lseg) lseg.addEventListener('click', e => {
      const b = e.target.closest('button[data-l]'); if (!b) return;
      state.level = b.dataset.l;
      renderProject(host, d, oem);
    });
    return host;
  }

  // ==========================================================================
  // 电芯视角（跨客户·同电芯容量）
  // ==========================================================================
  function renderCell(host, d) {
    state.view = 'cell'; state.current = d; state.cellCap = d.cellCap || state.cellCap;
    const rows = d.rows || [];
    const info = d.info || {};
    const closeRate = info.alarm ? (100 * (info.closed || 0) / info.alarm).toFixed(1) + '%' : '-';
    const kpis = kpiCards([
      { icon: '🔋', label: '电芯累计出货', val: wan(info.cell) + ' 颗', sub: `${fmt(info.pack)} 包 · ${info.custCount || 0} 客户`, cls: 'hl' },
      { icon: '📥', label: '接入电芯数', val: wan(info.conn) + ' 辆', tip: '已装车并接入' },
      { icon: '⚠️', label: '失效电芯数', val: fmt(info.alarm), cls: 'bad', tip: '关联预警外发' },
      { icon: '✅', label: '市场已闭环', val: fmt(info.closed), sub: `闭环率 ${closeRate}`, cls: 'ok' },
      { icon: '📉', label: '失效率（ppm）', val: info.ppm != null ? info.ppm : '0', cls: (info.ppm || 0) > 20 ? 'bad' : '', tip: '失效 / 出货 × 10⁶' },
      { icon: '📊', label: '今年接入', val: fmt(info.year), tip: '跨客户合计' },
    ]);

    // 跨客户对比表
    const custRows = rows.map(r => {
      const rPpm = r.cell ? ((1000000 * (r.alarm || 0)) / r.cell).toFixed(1) : '0';
      const rClRate = r.alarm ? (100 * (r.closed || 0) / r.alarm).toFixed(1) + '%' : '-';
      const pct = info.cell ? (100 * (r.cell || 0) / info.cell).toFixed(1) + '%' : '-';
      return `<tr style="cursor:pointer" onclick="ThreeView.gotoProject('${esc(r.oem)}','${esc(r.cap || d.cellCap)}')">
        <td><b>${esc(r.oem)}</b></td>
        <td class="num">${fmt(r.pack)}</td><td class="num">${fmt(r.cell)}</td><td class="num">${fmt(r.conn)}</td>
        <td class="num">${fmt(r.year)}</td><td class="num">${fmt(r.alarm)}</td>
        <td class="num">${fmt(r.closed)}（${esc(rClRate)}）</td><td class="num"><b>${esc(rPpm)}</b></td><td class="num">${esc(pct)}</td>
        <td><span class="lk">进入项目视角 →</span></td></tr>`;
    }).join('') || '<tr><td colspan="10" class="t3-empty">暂无用该容量的客户</td></tr>';
    const sumRow = `<tr style="background:var(--bg-secondary)"><td><b>合计</b></td>
      <td class="num"><b>${fmt(info.pack)}</b></td><td class="num"><b>${fmt(info.cell)}</b></td><td class="num"><b>${fmt(info.conn)}</b></td>
      <td class="num"><b>${fmt(info.year)}</b></td><td class="num"><b>${fmt(info.alarm)}</b></td>
      <td class="num"><b>${fmt(info.closed)}（${esc(closeRate)}）</b></td><td class="num"><b>${esc(info.ppm != null ? info.ppm : '0')}</b></td><td class="num">100%</td><td>-</td></tr>`;


    // SOH 分布（近似口径）
    const sohLabels = ['<90', '90~92', '92~94', '94~96', '96~98', '98~100'];
    const sohData = [0.1, 0.6, 3.1, 9.8, 34.5, 51.9];
    const sohHtml = barChart(sohData, sohLabels, SEQ.g2, ' %');

    // ppm 走势（近似）
    const ppmData = [12.1, 13.8, 15.2, 17.6, 19.4, 21.8, 23.1, 22.4, 20.9, Number(info.ppm || 0)];
    const ppmLabels = ['25-12', '26-01', '26-02', '26-03', '26-04', '26-05', '26-06', '26-07', '26-08', '26-09'];
    const ppmHtml = lineChart(ppmData, ppmLabels, SEQ.b2);

    // 批次出货柱状 + 批次表
    const batches = d.batches || [];
    const batchBarHtml = batches.length
      ? barChart(batches.map(b => b.qty), batches.map(b => b.batch.slice(-5) + '·' + b.cust[0]), SEQ.b2, ' 颗')
      : '<div class="t3-empty">暂无批次数据</div>';
    const batchRows = batches.map(b => `
      <tr><td><b>${esc(b.cust)}</b></td><td><b>${esc(b.batch)}</b></td><td>${esc(b.plant)}</td>
      <td class="num">${fmt(b.qty)}</td><td class="num">${fmt(b.failed)}</td><td class="num"><b>${esc(b.ppm)}</b></td>
      <td><span class="pill ${b.status === '预警中' ? 'r' : b.status === '关注' ? 'o' : 'g'}">${esc(b.status)}</span></td></tr>`).join('')
      || '<tr><td colspan="7" class="t3-empty">暂无批次数据</td></tr>';

    // 异常电芯明细
    const riskRows = (d.risks || []).map(r => `
      <tr><td><b>${esc(r.cust)}</b></td><td>${esc(r.vin || '—')}</td><td>${esc(r.pack || '—')}</td><td>${esc(r.pos || '—')}</td>
      <td><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${modeColor(r.mode)};margin-right:7px"></i>${esc(r.mode)}</td>
      <td class="num">${esc(r.soh || '—')}</td><td><span class="pill ${r.st || 'o'}">${esc(r.stTxt || '待核查')}</span></td></tr>`).join('')
      || '<tr><td colspan="7" class="t3-empty">暂无可追踪的异常电芯</td></tr>';

    const eventsHtml = renderTimeline(d.events);

    host.innerHTML = `
      <!-- 信息条 -->
      <div class="t3-strip">
        <div class="it">电芯容量<b>${esc(d.cellCap)} Ah</b></div>
        <div class="it">使用客户<b>${esc(rows.map(r => r.oem).join('、') || '-')}（共 ${rows.length} 个）</b></div>
        <div class="it">涉及项目<b>${rows.length} 个电芯项目</b></div>
      </div>
      <!-- KPI -->
      <div class="t3-kpis">${kpis}</div>
      <!-- 跨客户对比 -->
      <div class="t3-card">
        <div class="chead"><div><div class="ctitle" title="同一颗电芯，不同客户的质量差异一目了然">🏢 跨客户对比（该电芯所有客户）</div></div></div>
        <div class="tblwrap"><table class="t3-tbl">${colg(10, 10, 10, 9, 9, 9, 12, 8, 9, 14)}<thead><tr>
          <th>客户</th><th class="num">出货(Pack)</th><th class="num">出货(Cell)</th><th class="num">接入数</th><th class="num">今年接入</th>
          <th class="num">预警外发</th><th class="num">已闭环(率)</th><th class="num">ppm</th><th class="num">出货占比</th><th class="ctr">操作</th>
        </tr></thead><tbody>${custRows}${sumRow}</tbody></table></div>
      </div>
      <!-- SOH 分布 + 失效率走势（失效模式占比在质量分析里，不再单独成卡） -->
      <div class="t3-grid2 equal">
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="接入电芯 SOH 直方图 · 横轴 SOH 区间(%) · 纵轴占比(%)">📶 SOH 分布</div></div></div>
          <div>${sohHtml}</div>
        </div>
        <div class="t3-card">
          <div class="chead"><div><div class="ctitle" title="按月 · ppm（失效 / 出货 × 10⁶）">📉 电芯失效率走势</div></div></div>
          <div>${ppmHtml}</div>
        </div>
      </div>
      <!-- 电芯质量分析 -->
      <div class="t3-card">
        <div class="chead"><div class="ctitle" title="跨客户聚合 · 累积/增量 + 时间筛选">📊 质量分析</div><div class="qtabs" id="t3QHeadCell"></div></div>
        <div id="t3CellQuality"></div>
      </div>
      <!-- 批次追溯：出货柱状 + 明细 -->
      <div class="t3-card">
        <div class="chead"><div><div class="ctitle" title="批次 → 预警 → 车辆 · 近似口径">🗃️ 电芯批次追溯</div></div></div>
        <div style="max-width:760px;">${batchBarHtml}</div>
        <div class="tblwrap" style="margin-top:8px;"><table class="t3-tbl">${colg(12, 16, 16, 14, 12, 14, 16)}<thead><tr>
          <th>客户</th><th>批次号</th><th>电芯基地</th><th class="num">出货颗数</th><th class="num">失效颗数</th><th class="num">失效率(ppm)</th><th class="ctr">状态</th>
        </tr></thead><tbody>${batchRows}</tbody></table></div>
      </div>
      <!-- 异常电芯明细 -->
      <div class="t3-card">
        <div class="chead"><div><div class="ctitle" title="关联预警闭环工单">🔎 异常电芯明细（高风险）</div></div></div>
        <div class="tblwrap"><table class="t3-tbl">${colg(11, 20, 15, 12, 18, 10, 14)}<thead><tr>
          <th>客户</th><th>VIN</th><th>电池包号</th><th>电芯位号</th><th>失效模式</th><th class="num">SOH</th><th class="ctr">预警状态</th>
        </tr></thead><tbody>${riskRows}</tbody></table></div>
      </div>
      <!-- 电芯批次关键处置事件 -->
      <div class="t3-card">
        <div class="chead"><div><div class="ctitle" title="批次隔离 / 换电 / 召回 / 索赔批次">🚨 电芯批次关键处置事件</div></div></div>
        <div id="t3CellEvents">${eventsHtml}</div>
      </div>
      <div style="text-align:right;margin-top:6px;">
        ${state.oem
          ? `<button class="btn btn-secondary" onclick="ThreeView.gotoProject('${esc(state.oem)}','${esc(state.cellCap)}')">← 返回项目视角（${esc(state.oem)} · ${esc(state.cellCap)}Ah）</button>`
          : `<button class="btn btn-secondary" onclick="ThreeView.gotoCustomer('')">← 返回客户视角</button>`}
      </div>`;

    renderQualityPanel(document.getElementById('t3CellQuality'), d.quality || { labels: [], alarm: {}, closed: {}, complaint: {} }, 'Cell', d.outgoingModes);
    enableSort(host);
    addChartDownloads(host);   // 单图表下载 PNG
    return host;
  }

  // ==========================================================================
  // 数据加载入口（供 page1 调用）
  // ==========================================================================
  // 骨架屏（保留 t3-loading 类：下载页面据此判断「尚未加载完成」）
  function skeleton(tip) {
    const k = '<div class="sk"></div>'.repeat(6);
    return `<div class="t3-loading t3-skel"><div class="sk-tip">${esc(tip)}</div>
      <div class="sk-kpis">${k}</div>
      <div class="sk-row"><div class="sk"></div><div class="sk"></div></div>
      <div class="sk sk-full"></div></div>`;
  }
  function base_q() {
    let q = '?';
    if (state.timeRange.mode && state.timeRange.mode !== 'all') q += `&time_range=${encodeURIComponent(state.timeRange.mode)}`;
    return q;
  }
  async function loadCustomer(host, oem, cellCap) {
    if (!host) return;
    state.oem = oem; state.cellCap = cellCap || '';
    host.innerHTML = skeleton('正在加载客户视角看板…');
    const q = `?view=customer&oem=${encodeURIComponent(oem)}` + (cellCap ? `&cell_cap=${encodeURIComponent(cellCap)}` : '');
    let d;
    try {
      const r = await API.get('/api/dashboard/three_view' + q);
      if (!r || r.error) throw new Error((r && r.error) || '无数据');
      d = r;
    } catch (e) {
      host.innerHTML = `<div class="t3-empty">${esc(e.message)}</div>`;
      return;
    }
    renderCustomer(host, d, oem);
  }
  async function loadProject(host, oem, cellCap) {
    if (!host) return;
    state.oem = oem; state.cellCap = cellCap;
    host.innerHTML = skeleton('正在加载项目视角看板…');
    const q = `?view=project&oem=${encodeURIComponent(oem)}&cell_cap=${encodeURIComponent(cellCap)}`;
    let d;
    try {
      const r = await API.get('/api/dashboard/three_view' + q);
      if (!r || r.error) throw new Error((r && r.error) || '无数据');
      d = r;
    } catch (e) {
      host.innerHTML = `<div class="t3-empty">${esc(e.message)}</div>`;
      return;
    }
    renderProject(host, d, oem);
  }
  async function loadCell(host, cellCap) {
    if (!host) return;
    state.cellCap = cellCap;
    host.innerHTML = skeleton('正在加载电芯视角看板（跨客户聚合，请稍候）…');
    const q = `?view=cell&cell_cap=${encodeURIComponent(cellCap)}`;
    let d;
    try {
      const r = await API.get('/api/dashboard/three_view' + q, { timeout: 120000 });
      if (!r || r.error) throw new Error((r && r.error) || '无数据');
      d = r;
    } catch (e) {
      host.innerHTML = `<div class="t3-empty">${esc(e.message)}</div>`;
      return;
    }
    renderCell(host, d);
  }

  // ---- 视角切换（翻身给 page1）----
  function gotoProject(oem, cap) {
    if (onSwitch) onSwitch('project', { oem, cellCap: cap });
    else { const host = document.getElementById('p1Dashboard'); if (host) loadProject(host, oem, cap); }
  }
  function gotoCell(cap) {
    if (onSwitch) onSwitch('cell', { cellCap: cap, oem: state.oem });
    else { const host = document.getElementById('p1Dashboard'); if (host) loadCell(host, cap); }
  }
  function gotoCustomer(oem) {
    if (onSwitch) onSwitch('customer', { oem: oem || state.oem });
    else { const host = document.getElementById('p1Dashboard'); if (host && (oem || state.oem)) loadCustomer(host, oem || state.oem, ''); }
  }

  return {
    loadCustomer, loadProject, loadCell,
    renderCustomer, renderProject, renderCell,
    gotoProject, gotoCell, gotoCustomer,
    setSwitch(fn) { onSwitch = fn; },
    setTimeRange(tr) { if (tr) state.timeRange = { mode: tr.mode || 'all', start: tr.start || '', end: tr.end || '' }; },
    getState() { return { view: state.view, oem: state.oem, cellCap: state.cellCap, timeRange: state.timeRange.mode || 'all' }; },
    reframe,
  };
})();

// 挂到 window：page1 与 onclick（gotoProject/gotoCell/gotoCustomer 由模板 onclick 调用）
window.ThreeView = ThreeView;
</script>

<!-- /static/js/pages/page1.js -->
<script>
/**
 * 页面1 - 首页看板（客户标识=oem，数据源=Doris + 本地）
 * 模块1 项目车辆接入总数(Doris tab1接入+tab2出货) | 拜访计划(三色) | 关键人矩阵 | 会议卡片 | 客户重点失效模式(Doris tab3+本地逻辑)
 */
const Page1 = {
    initialized: false,
    currentData: null,
    currentPage: 1,
    pageSize: 10,
    // 加载序号：每次切换客户/容量自增，用于丢弃过期(慢)响应，避免旧数据覆盖新选择导致"卡死/错乱"
    _loadSeq: 0,
    // 看板各 Doris 接口超时(ms)：大客户(小米XMS等)一次全链查询可能很慢，超时改为优雅降级而非无限等待
    _DASH_TIMEOUT: 60000,

    async init() {
        const container = document.getElementById('page1');
        const is_first_load = !this.initialized;
        if (is_first_load) {
            const default_oem = App.customers.length ? App.customers[0].oem : '';
            container.innerHTML = this.renderLayout(default_oem);
            this.initialized = true;
            this._view = 'customer';
            this._initCapOutsideClick();
            this._mountViewDock();        // 右侧悬停视图面板（参考 TB 视图管理）
            // 筛选下拉支持模糊搜索 / 正则
            ['p1Customer', 'p1ProjCust', 'p1ProjCap', 'p1CellProduct'].forEach(id =>
                SearchSelect.enhance(document.getElementById(id), { minWidth: id.includes('Cap') || id === 'p1CellProduct' ? '130px' : '190px' }));
        }
        this.bindEvents();
        // 三视角内部跳转（项目行下钻 / 电芯下钻 / 返回）交由 page1 承接
        if (window.ThreeView) ThreeView.setSwitch((v, p) => this._threeSwitch(v, p));

        if (is_first_load) {
            // 自定义模块（不依赖客户，始终加载）
            await DashboardModules.init('p1Modules');
            if (App.customers.length) {
                await this.loadCapacityOptions();
                // 有设为默认的视图则直接打开它，否则走默认客户视角
                const dft = this._getSavedViews().find(v => v.isDefault);
                if (dft) {
                    await this.applySavedView(dft.id, true);
                } else {
                    // 首次打开：不强制刷新，Doris 模块直接吃 test 表 7 天缓存（秒出、流畅）
                    // 手动点「查询」按钮才会 refresh=1 强制重查 Doris。
                    await this.loadDashboard(false);
                    this._renderCrumbs();
                }
            }
        }
    },

    renderLayout(selected_oem = '') {
        return `
        <div class="card" style="margin-bottom:20px;">
            <!-- 一行筛选条：视角 | 客户 / 容量（随视角切换）| 时间范围 …… 下载页面；选完即加载，不需要「查看」按钮 -->
            <div class="p1-toolbar">
                <div class="t3-vswitch" style="flex:0 0 auto;">
                    <button class="p1-view-c on" data-view="customer" onclick="Page1.switchView('customer')">👤 客户视角</button>
                    <button class="p1-view-p" data-view="project" onclick="Page1.switchView('project')">📦 项目视角</button>
                    <button class="p1-view-cell" data-view="cell" onclick="Page1.switchView('cell')">🔋 电芯视角</button>
                </div>
                <span class="p1-sep"></span>
                <!-- 客户视角 -->
                <span class="p1-fgrp" id="p1FilterC">
                    <span class="p1-flab">客户</span>
                    <select id="p1Customer">${Utils.customerOptions(selected_oem)}</select>
                </span>
                <!-- 项目视角：项目 = 某客户 × 某款电芯 -->
                <span class="p1-fgrp" id="p1FilterP" style="display:none;">
                    <span class="p1-flab">客户</span>
                    <select id="p1ProjCust">${Utils.customerOptions(selected_oem)}</select>
                    <span class="p1-flab" title="该客户电量项目（一款电芯可含多个车型）">容量</span>
                    <select id="p1ProjCap"><option value="">选择项目(容量)...</option></select>
                </span>
                <!-- 电芯视角：跨客户看同一容量电芯 -->
                <span class="p1-fgrp" id="p1FilterCell" style="display:none;">
                    <span class="p1-flab">电芯容量</span>
                    <select id="p1CellProduct"><option value="">选择电芯产品...</option></select>
                </span>
                <span class="p1-sep"></span>
                <div class="t3-timefilter" id="p1TimeFilter" style="flex:0 0 auto;" title="时间范围作用于：接入走势趋势图 + 质量分析面板。顶部 KPI 为历史累计，不随时间筛选变化">
                    <span class="p1-flab">时间</span>
                    <div class="seg" id="p1SegTime">
                        <button data-t="3m">近3月</button><button data-t="6m">近6月</button>
                        <button data-t="12m">近12月</button><button data-t="all" class="on">全部</button>
                    </div>
                </div>
                <!-- 下载页面：当前看板导出为独立 HTML（给客户看）；视图管理在页面右侧悬停面板 -->
                <button class="btn btn-sm btn-primary" style="margin-left:auto;" title="下载页面：把当前看板导出为独立 HTML 文件（自带样式与图表，无需登录即可查看），可直接发给客户" onclick="Page1.downloadPage()">⬇ 下载</button>
            </div>
            <div id="p1Dashboard">
                <div class="empty-state">
                    <div class="empty-icon">&#9670;</div>
                    <p>请选择客户后查看看板数据</p>
                </div>
            </div>
        </div>
        <div id="p1Modules" style="margin-top:20px;"></div>`;
    },

    bindEvents() {
        document.getElementById('p1Customer').onchange = async () => {
            // 先刷新容量(await 防并发竞态)，再加载看板；容量加载是慢请求不放行会带着旧容量查
            await this.loadCapacityOptions();
            this.loadDashboard(false);   // 切客户/容量 → Doris 模块走 7 天 test 表缓存（秒出，流畅）
        };
        // 全局时间筛选：作用于三视角所有质量面板
        const segTime = document.getElementById('p1SegTime');
        if (segTime) segTime.onclick = (e) => {
            const b = e.target.closest('button[data-t]');
            if (!b) return;
            document.querySelectorAll('#p1SegTime button').forEach(x => x.classList.toggle('on', x === b));
            if (window.ThreeView) {
                ThreeView.setTimeRange({ mode: b.dataset.t });
                ThreeView.reframe();
            }
        };
    },

    // 顶部看板筛选 → 联动车辆洞察（OEM/cell_cap 全局一次选择，车辆洞察跟随顶部）
    syncToVehicleInsight() {
        this._updateViScope();
        this.loadVehicleInsight();
    },

    // 在车辆洞察区显示当前从顶部继承的客户 + 容量
    _updateViScope() {
        const scope = document.getElementById('p1viScope');
        if (!scope) return;
        const oem = this.currentOem || document.getElementById('p1Customer').value;
        const cap = this.getSelectedCaps();
        const name = this._custName();
        scope.innerHTML = `<strong>${Utils.esc(name)}</strong> <span class="mono" style="color:var(--text-muted);">(${Utils.esc(oem)})</span> · 容量 ${Utils.esc(cap ? cap.split(',').map(c => c + 'Ah').join('、') : '全部')}`;
    },

    // ===== 同 AH 不同 OEM 对比 =====
    async loadOemCompare() {
        const cap = document.getElementById('p1CompareCap').value;
        if (!cap) { Toast.error('请先选择容量(AH)'); return; }
        const since = document.getElementById('p1viSince').value || '2026-01-01';
        const thres = document.getElementById('p1viThres').value || '10000';
        const box = document.getElementById('p1CompareResult');
        box.innerHTML = '<div class="loading" style="padding:14px;">正在查询同 AH 各 OEM 对比...</div>';
        const d = await API.get(`/api/oem_comparison?cell_cap=${encodeURIComponent(cap)}&active_since=${encodeURIComponent(since)}&threshold=${encodeURIComponent(thres)}`);
        if (!d || !d.success) {
            box.innerHTML = `<p class="empty-state">${Utils.esc(d && d.error || '查询失败')}</p>`;
            return;
        }
        const rows = d.rows || [];
        if (!rows.length) {
            box.innerHTML = '<p class="empty-state">该容量暂无数据</p>';
            return;
        }
        const maxAccess = Math.max(...rows.map(r => r.access_count), 1);
        const trs = rows.map(r => {
            const pct = Math.round(r.access_count / maxAccess * 100);
            return `<tr>
                <td><strong>${Utils.esc(r.oem_ch || r.oem)}</strong> <span style="color:var(--text-muted);font-size:11px;">${Utils.esc(r.oem)}</span></td>
                <td><div style="display:flex;align-items:center;gap:8px;">
                    <div style="flex:1;height:18px;background:var(--bg-input);border-radius:4px;overflow:hidden;">
                        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));border-radius:4px;"></div>
                    </div>
                    <strong style="min-width:60px;text-align:right;color:var(--accent-light);">${(r.access_count || 0).toLocaleString()}</strong>
                </div></td>
                <td><strong style="color:var(--success);">${(r.active_count || 0).toLocaleString()}</strong></td>
                <td><strong style="color:var(--danger);">${(r.mileage_count || 0).toLocaleString()}</strong></td>
            </tr>`;
        }).join('');
        box.innerHTML = `<p style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">容量 ${Utils.esc(cap)}Ah · ${rows.length} 个客户对比</p>
        <div class="table-wrapper"><table class="dash-table" style="font-size:13px;">
            <thead><tr><th>客户</th><th>接入数</th><th>活跃数</th><th>调表数</th></tr></thead>
            <tbody>${trs}</tbody>
        </table></div>`;
        this._enableSort(box);
    },

    // 给容器内所有看板表启用点击表头排序（todo 任务#3）
    // 排除 #p1AccCollapse 内的接入明细表——它有专属的 toggleAccessSort 排序，避免双绑定冲突
    _enableSort(box) {
        if (!box || !window.Utils || !Utils.enableTableSort) return;
        box.querySelectorAll('table.dash-table').forEach(t => {
            if (t.closest('#p1AccCollapse')) return;
            Utils.enableTableSort(t);
        });
    },

    // ========== 车辆洞察（活跃 / 里程调表识别；OEM/cell_cap 跟随顶部全局选择）==========
    // 填充「同 AH 不同 OEM 对比」的容量下拉（基于当前 OEM 的真实容量）
    async loadVehicleInsightCaps() {
        const oem = this.currentOem || document.getElementById('p1Customer').value;
        const url = `/api/customers/cell_caps?oem=${encodeURIComponent(oem)}`;
        const caps = await API.get(url);
        this._viCaps = (Array.isArray(caps) ? caps : []);
        const cmpSel = document.getElementById('p1CompareCap');
        if (cmpSel) {
            cmpSel.innerHTML = '<option value="">选择容量...</option>' +
                (this._viCaps.map(c => `<option value="${Utils.esc(c)}">${Utils.esc(c)} Ah</option>`).join(''));
        }
    },

    _viCapChangeBar() {
        const bar = document.getElementById('p1viCapBar');
        if (bar && this._viCapSelected) {
            const n = this._viCapSelected.length;
            bar.innerHTML = (n === this._viCaps.length ? '全部容量' : ('已选 ' + n + ' 个容量'))
                + ' <span style="margin-left:auto;">▾</span>';
        }
    },

    _viCapTogglePanel() {
        const panel = document.getElementById('p1viCapPanel');
        const bar = document.getElementById('p1viCapBar');
        if (!panel || !bar) return;
        const opening = panel.style.display === 'none' || !panel.style.display;
        if (opening) {
            const r = bar.getBoundingClientRect();
            panel.style.position = 'fixed';
            panel.style.display = 'block';
            panel.style.top = (r.bottom + 4) + 'px';
            panel.style.left = r.left + 'px';
            panel.style.width = Math.max(r.width, 220) + 'px';
            panel.style.zIndex = '3000';
            this._viCapPanelOpen = true;
        } else {
            panel.style.display = 'none';
            this._viCapPanelOpen = false;
        }
    },

    _renderViCapPanel() {
        const panel = document.getElementById('p1viCapPanel') || this._ensureCapPanel('p1viCapPanel');
        const selSet = new Set(this._viCapSelected);
        panel.innerHTML = `
            <div style="margin-bottom:6px;display:flex;align-items:center;gap:8px;">
                <a href="javascript:void(0)" style="font-size:11px;color:var(--accent);" onclick="Page1._viCapAll()">全选</a>
                <a href="javascript:void(0)" style="font-size:11px;color:var(--danger);" onclick="Page1._viCapNone()">清空</a>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto;padding:4px 0;">
                ${this._viCaps.map(v => `<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;padding:2px 6px;border:1px solid var(--border-row);border-radius:6px;background:${selSet.has(v) ? 'var(--brand-soft)' : 'var(--panel)'};">
                    <input type="checkbox" value="${Utils.esc(v)}" ${selSet.has(v) ? 'checked' : ''}
                        onchange="Page1._viCapToggle('${Utils.esc(v)}')">
                    ${Utils.esc(v)} Ah
                </label>`).join('')}
            </div>`;
    },

    _viCapToggle(val) {
        const idx = this._viCapSelected.indexOf(val);
        if (idx >= 0) this._viCapSelected.splice(idx, 1);
        else this._viCapSelected.push(val);
        this.viSelected = this._viCapSelected;
        this._viCapChangeBar();
        this._renderViCapPanel();
    },

    _viCapAll() {
        this._viCapSelected = [...(this._viCaps || [])];
        this.viSelected = this._viCapSelected;
        this._viCapChangeBar();
        this._renderViCapPanel();
    },

    _viCapNone() {
        this._viCapSelected = [];
        this.viSelected = this._viCapSelected;
        this._viCapChangeBar();
        this._renderViCapPanel();
    },

    getSelectedViCaps() {
        // todo#2：容量多选框已移除，恒为全部容量
        return '';
    },

    fmtLonDate(d) {
        // Doris DATETIME 被解析为 "Tue, 25 Aug 2026 00:00:00 GMT" 之类，这里规范化为 YYYY-MM-DD
        if (!d) return '';
        const s = String(d);
        const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (m) return `${m[1]}-${m[2]}-${m[3]}`;
        const date = new Date(s);
        if (!isNaN(date)) {
            return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        }
        return s.substring(0, 10);
    },

    async loadVehicleInsight() {
        const oem = this.currentOem || document.getElementById('p1Customer').value;   // 跟随顶部 OEM
        const cap = this.getSelectedViCaps();                                        // 跟随顶部 cell_cap
        const since = document.getElementById('p1viSince').value || '2026-01-01';
        const thres = document.getElementById('p1viThres').value || '10000';
        const box = document.getElementById('p1viResult');
        box.innerHTML = '<div class="loading" style="padding:14px;">正在识别车辆（活跃/调表）...</div>';
        const oemParam = oem ? `oem=${encodeURIComponent(oem)}&` : '';
        const [active, mileage] = await Promise.all([
            API.get(`/api/active_vehicles?${oemParam}${cap?'&cell_cap='+encodeURIComponent(cap):''}&active_since=${encodeURIComponent(since)}&limit=30`),
            API.get(`/api/mileage_adjust?${oemParam}${cap?'&cell_cap='+encodeURIComponent(cap):''}&threshold=${encodeURIComponent(thres)}&limit=30`)
        ]);
        if ((!active || !active.count) && (!mileage || !mileage.count)) {
            box.innerHTML = '<p class="empty-state" style="padding:12px 0;">该客户暂无活跃/调表车辆数据，可换客户或调整筛选后再试。</p>';
            return;
        }
        box.innerHTML = `
        <div class="grid-2" style="gap:16px;">
            ${this.renderActiveBox(active, cap, since)}
            ${this.renderMileageBox(mileage, cap, thres)}
        </div>`;
    },

    // 顶部摘要：活跃车辆 / 里程调表（真实数据，参考小米第一屏并列三块）
    async loadCompactVi(seq) {
        const oem = this.currentOem || document.getElementById('p1Customer').value;
        const cap = this.getSelectedCaps();
        const since = '2026-01-01';
        const thres = '10000';
        const actBox = document.getElementById('p1ViActive');
        const milBox = document.getElementById('p1ViMileage');
        if (!actBox && !milBox) return;
        const oemParam = oem ? `oem=${encodeURIComponent(oem)}&` : '';
        const [active, mileage] = await Promise.all([
            this._seqGet(`/api/active_vehicles?${oemParam}${cap ? '&cell_cap=' + encodeURIComponent(cap) : ''}&active_since=${encodeURIComponent(since)}&limit=6`, seq),
            this._seqGet(`/api/mileage_adjust?${oemParam}${cap ? '&cell_cap=' + encodeURIComponent(cap) : ''}&threshold=${encodeURIComponent(thres)}&limit=6`, seq)
        ]);
        if (seq != null && seq !== this._loadSeq) return;   // 已切换客户：不渲染过期数据
        if (actBox) actBox.innerHTML = this.compactActive(active, cap, since);
        if (milBox) milBox.innerHTML = this.compactMileage(mileage, cap, thres);
    },

    compactActive(d, cap, since) {
        if (!d || !d.success) return `<p class="empty-state" style="padding:10px;font-size:12.5px;">${Utils.esc((d && d.error) || '加载失败')}</p>`;
        const rows = d.rows || [];
        const capTxt = this._capLabel(cap);
        return `<div style="font-size:32px;font-weight:800;color:var(--accent-light);line-height:1;">${(d.count || 0).toLocaleString()}<span style="font-size:12px;color:var(--text-muted);font-weight:400;"> 辆活跃</span></div>
            <div style="font-size:11px;color:var(--text-muted);margin:4px 0 8px;">2026后 · ≥ ${since}${capTxt ? ' · ' + capTxt : ''}</div>
            ${d.count ? `<div style="text-align:right;"><button class="btn btn-sm btn-secondary" onclick="Page1.exportList('active','${Utils.esc(cap || '')}')">⬇ 下载清单</button></div>` : '<div style="font-size:11px;color:var(--text-muted);">暂无活跃车辆</div>'}`;
    },

    compactMileage(d, cap, thres) {
        if (!d || !d.success) return `<p class="empty-state" style="padding:10px;font-size:12.5px;">${Utils.esc((d && d.error) || '加载失败')}</p>`;
        const rows = d.rows || [];
        const capTxt = this._capLabel(cap);
        return `<div style="font-size:32px;font-weight:800;color:var(--warning);line-height:1;">${(d.count || 0).toLocaleString()}<span style="font-size:12px;color:var(--text-muted);font-weight:400;"> 辆疑似</span></div>
            <div style="font-size:11px;color:var(--text-muted);margin:4px 0 8px;">里程调表 · &gt;${thres}km${capTxt ? ' · ' + capTxt : ''}</div>
            ${d.count ? `<div style="text-align:right;"><button class="btn btn-sm btn-secondary" onclick="Page1.exportList('mileage','${Utils.esc(cap || '')}')">⬇ 下载清单</button></div>` : '<div style="font-size:11px;color:var(--text-muted);">未识别到调表车辆</div>'}`;
    },

    renderActiveBox(d, cap, since) {
        const err = d && d.error;
        if (!d || !d.success) {
            return `<div class="card"><div class="card-title">2026 年后活跃车辆</div><p class="empty-state">${Utils.esc(err || '加载失败')}</p></div>`;
        }
        const rows = d.rows || [];
        const capTxt = this._capLabel(cap);
        const list = rows.length ? `<div style="max-height:150px;overflow:auto;margin-top:8px;border:1px solid var(--border-card);border-radius:6px;">
            ${rows.map(r => `<div style="padding:3px 8px;font-size:11px;font-family:monospace;color:var(--text-secondary);border-bottom:1px solid var(--border-card);">${Utils.esc(r.deviceid)} — 最后活跃 ${Utils.esc(this.fmtLonDate(r.last_online_date))}</div>`).join('')}
            ${d.count > rows.length ? `<div style="padding:4px 8px;font-size:11px;color:var(--text-muted);">… 仅显示前 ${rows.length} 辆，共 ${d.count} 辆</div>` : ''}
        </div>` : '<p class="empty-state">无活跃车辆</p>';
        return `<div class="card">
            <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>2026 年后活跃车辆${capTxt ? ' · 容量 ' + capTxt : ''}（≥ ${since}）</span>
                ${d.count ? `<button class="btn btn-sm btn-secondary" onclick="Page1.exportList('active')">⬇ 下载清单</button>` : ''}
            </div>
            <div style="font-size:30px;font-weight:700;color:var(--accent-light);">${d.count}<span style="font-size:12px;color:var(--text-muted);font-weight:400;"> 辆</span></div>
            ${list}
        </div>`;
    },

    renderMileageBox(d, cap, thres) {
        const err = d && d.error;
        if (!d || !d.success) {
            return `<div class="card"><div class="card-title">里程调表车辆识别</div><p class="empty-state">${Utils.esc(err || '加载失败')}</p></div>`;
        }
        const rows = d.rows || [];
        const list = rows.length ? `<div style="max-height:150px;overflow:auto;margin-top:8px;border:1px solid var(--border-card);border-radius:6px;">
            ${rows.map(r => `<div style="display:flex;justify-content:space-between;padding:3px 8px;font-size:11px;color:var(--text-secondary);border-bottom:1px solid var(--border-card);">
                <span style="font-family:monospace;">${Utils.esc(r.vin)}</span>
                <span style="color:var(--danger);">调差 ${Utils.esc(r.diff ?? 0)} km</span></div>`).join('')}
            ${d.count > rows.length ? `<div style="padding:4px 8px;font-size:11px;color:var(--text-muted);">… 仅显示差值最大的前 ${rows.length} 辆，共 ${d.count} 辆</div>` : ''}
        </div>` : '<p class="empty-state">未识别到调表车辆</p>';
        return `<div class="card">
            <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>里程调表车辆${this._capLabel(cap) ? ' · ' + this._capLabel(cap) : ''}（阈值 &gt; ${thres} km）</span>
                ${d.count ? `<button class="btn btn-sm btn-secondary" onclick="Page1.exportList('mileage')">⬇ 下载清单</button>` : ''}
            </div>
            <div style="font-size:30px;font-weight:700;color:var(--danger);">${d.count}<span style="font-size:12px;color:var(--text-muted);font-weight:400;"> 辆</span></div>
            ${list}
        </div>`;
    },

    _capChangeView() {
        const bar = document.getElementById('p1CapBar');
        if (bar && this._capSelected) {
            const n = this._capSelected.length;
            bar.textContent = n === this._caps.length
                ? `全部容量（${n}个）`
                : (n ? `已选 ${n} 个容量` : '全部容量');
        }
    },

    // 点击面板外部自动关闭容量下拉
    _initCapOutsideClick() {
        document.addEventListener('click', (e) => {
            const inside = ['p1CapPanel', 'p1viCapPanel', 'p1ProjOemsPanel', 'p1CapBar', 'p1viCapBar', 'p1ProjOemsBar']
                .some(id => {
                    const el = document.getElementById(id);
                    return el && el.contains(e.target);
                });
            if (inside) return;   // 点击面板/触发条内部，不关闭
            const cap = document.getElementById('p1CapPanel');
            if (cap) cap.style.display = 'none';
            const vicap = document.getElementById('p1viCapPanel');
            if (vicap) vicap.style.display = 'none';
            const po = document.getElementById('p1ProjOemsPanel');
            if (po) po.style.display = 'none';
        });
    },

    _capTogglePanel() {
        const panel = document.getElementById('p1CapPanel');
        const bar = document.getElementById('p1CapBar');
        if (!panel || !bar) return;
        const opening = panel.style.display === 'none' || !panel.style.display;
        if (opening) {
            const r = bar.getBoundingClientRect();
            panel.style.position = 'fixed';
            panel.style.display = 'block';
            panel.style.top = (r.bottom + 4) + 'px';
            panel.style.left = r.left + 'px';
            panel.style.width = Math.max(r.width, 220) + 'px';
            panel.style.zIndex = '3000';
            this._capPanelOpen = true;
        } else {
            panel.style.display = 'none';
            this._capPanelOpen = false;
        }
    },

    _renderCapPanel() {
        const panel = document.getElementById('p1CapPanel') || this._ensureCapPanel('p1CapPanel');
        const selSet = new Set(this._capSelected);
        panel.innerHTML = `
            <div style="margin-bottom:6px;display:flex;align-items:center;gap:8px;">
                <a href="javascript:void(0)" style="font-size:11px;color:var(--accent);" onclick="Page1._capAll()">全选</a>
                <a href="javascript:void(0)" style="font-size:11px;color:var(--danger);" onclick="Page1._capNone()">清空</a>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto;padding:4px 0;">
                ${this._caps.map(v => `<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;padding:2px 6px;border:1px solid var(--border-row);border-radius:6px;background:${selSet.has(v) ? 'var(--brand-soft)' : 'var(--panel)'};">
                    <input type="checkbox" value="${Utils.esc(v)}" ${selSet.has(v) ? 'checked' : ''}
                        onchange="Page1._capToggle('${Utils.esc(v)}')">
                    ${Utils.esc(v)} Ah
                </label>`).join('')}
            </div>`;
    },

    _capToggle(val) {
        const idx = this._capSelected.indexOf(val);
        if (idx >= 0) this._capSelected.splice(idx, 1);
        else this._capSelected.push(val);
        this._capChangeView();
        this._renderCapPanel();
        // 选完即确认：客户视角下重载看板
        if (this._view === 'customer' && document.getElementById('p1Customer').value) this.loadDashboard(false);
    },

    _capAll() {
        this._capSelected = [...(this._caps || [])];
        this._capChangeView();
        this._renderCapPanel();
        if (this._view === 'customer' && document.getElementById('p1Customer').value) this.loadDashboard(false);
    },

    _capNone() {
        this._capSelected = [];
        this._capChangeView();
        this._renderCapPanel();
        if (this._view === 'customer' && document.getElementById('p1Customer').value) this.loadDashboard(false);
    },

    async loadCapacityOptions() {
        // todo#2：容量多选框已移除——仅静默加载 _caps 供文案/项目视角使用，不再渲染筛选 UI
        const oem = document.getElementById('p1Customer').value;
        if (!oem) return;
        const box = document.getElementById('p1Capacity');
        if (!box) {   // DOM 已移除：拉一次容量清单后直接返回
            try {
                const caps = await API.get(`/api/customers/cell_caps?oem=${encodeURIComponent(oem)}`);
                this._caps = Array.isArray(caps) ? caps : [];
            } catch (e) { this._caps = []; }
            return;
        }
        const caps = await API.get(`/api/customers/cell_caps?oem=${encodeURIComponent(oem)}`);
        this._caps = Array.isArray(caps) ? caps : [];
        // 保留已选
        const prev = this.capsSelected || [];
        this.capsSelected = prev.filter(v => this._caps.includes(v));
        if (this._caps.length && !this.capsSelected.length) this.capsSelected = [...this._caps]; // 默认全选
        this._capSelected = this.capsSelected;
        // 下拉多选 checkbox
        box.innerHTML = `
            <div id="p1CapBar" class="cap-trigger" onclick="Page1._capTogglePanel()">
                ${this._caps.length === this._capSelected.length ? '全部容量' : ('已选 ' + this._capSelected.length + ' 个容量')}
                <span style="margin-left:auto;">▾</span>
            </div>`;
        // 面板挂到 body，避免被 card 的 overflow/transform 裁切
        this._capPanel = this._ensureCapPanel('p1CapPanel');
        this._capPanelOpen = false;
        this._renderCapPanel();
        box.style.width = '100%';
        box.className = '';
    },

    // 确保在 body 上创建下拉面板（脱离任何带 overflow/transform 的祖先，不被裁切）
    _ensureCapPanel(id) {
        let p = document.getElementById(id);
        if (!p) {
            p = document.createElement('div');
            p.id = id;
            p.className = 'cap-panel';
            p.style.display = 'none';
            document.body.appendChild(p);
        }
        return p;
    },

    getSelectedCaps() {
        // todo#2：客户视角容量多选框已移除，恒为全部容量（cell_cap 不传 → 后端查全量）
        return '';
    },

    // 当前选中客户的可读名称
    _custName() {
        const oem = this.currentOem || this._lastOem || '';
        if (!oem) return '全部客户';
        const c = (App.customers || []).find(x => x.oem === oem);
        return c ? (c.oem_ch || c.name_cn || c.oem) : oem;
    },

    // 顶部「当前客户」标签：与下拉 客户(OEM) 一致 → "中文名 (oem)"
    // 当前选中容量的可读文本
    _selCapsText() {
        const caps = (this._capSelected ? this._capSelected : (this.capsSelected || [])).filter(Boolean);
        if (!caps.length) return '';
        if (caps.length === (this._caps || []).length) return caps.map(c => c + 'Ah').join('、');
        return caps.length > 3 ? caps.slice(0, 3).join('、') + 'Ah 等' + caps.length + '个' : caps.map(c => c + 'Ah').join('、');
    },

    // ============ 客户/项目/电芯 三视角（任务5：电芯=某容量AH跨客户对比）============
    // ============ 视图管理：右侧悬停面板（参考 Teambition 视图管理，localStorage） ============
    // 视图 = 视角 + 客户 + 项目容量/电芯容量 + 时间范围。系统视图「默认视图」不可改；
    // 我的视图可新建 / 应用 / 重命名 / 用当前筛选覆盖 / 设为默认（打开首页自动应用）/ 删除。
    _getSavedViews() {
        let list;
        try { list = JSON.parse(localStorage.getItem('p1SavedViews') || '[]'); } catch (e) { list = []; }
        if (!Array.isArray(list)) list = [];
        // 兼容旧数据（按下标存、没有 id）
        let patched = false;
        list.forEach((v, i) => { if (!v.id) { v.id = 'v' + Date.now().toString(36) + i; patched = true; } });
        if (patched) { try { localStorage.setItem('p1SavedViews', JSON.stringify(list)); } catch (e) {} }
        return list;
    },
    _putSavedViews(list) {
        try { localStorage.setItem('p1SavedViews', JSON.stringify(list)); } catch (e) { Toast.error('视图保存失败（浏览器存储不可用）'); }
        this._renderViewDock();
    },
    // 收集当前筛选组合（视角 + 客户 + 项目容量/电芯容量 + 时间范围）
    _collectView() {
        const view = this._view || 'customer';
        const v = { view };
        if (view === 'project') {
            v.oem = (document.getElementById('p1ProjCust') || {}).value || '';
            v.projCap = (document.getElementById('p1ProjCap') || {}).value || '';
        } else {
            v.oem = (document.getElementById('p1Customer') || {}).value || '';
        }
        if (view === 'cell') v.cellProduct = (document.getElementById('p1CellProduct') || {}).value || '';
        v.timeRange = window.ThreeView ? (ThreeView.getState().timeRange || 'all') : 'all';
        return v;
    },
    _sameView(a, b) {
        if (!a || !b) return false;
        return ['view', 'oem', 'projCap', 'cellProduct', 'timeRange'].every(k => String(a[k] || '') === String(b[k] || ''));
    },
    _viewDesc(v) {
        const vn = { customer: '客户视角', project: '项目视角', cell: '电芯视角' }[v.view] || '客户视角';
        const tn = { '3m': '近3月', '6m': '近6月', '12m': '近12月', all: '全部时间' }[v.timeRange || 'all'] || '全部时间';
        const c = (App.customers || []).find(x => x.oem === v.oem);
        const cust = v.view === 'cell' ? '' : (c ? (c.oem_ch || c.name_cn || c.oem) : (v.oem || ''));
        const cap = v.view === 'project' ? v.projCap : (v.view === 'cell' ? v.cellProduct : '');
        return [vn, cust, cap ? cap + 'Ah' : '', tn].filter(Boolean).join(' · ');
    },

    _mountViewDock() {
        if (document.getElementById('p1ViewDock')) return;
        const d = document.createElement('div');
        d.id = 'p1ViewDock';
        d.className = 'vdock';
        let pinned = false;
        try { pinned = localStorage.getItem('p1ViewDockPinned') === '1'; } catch (e) {}
        if (pinned) d.classList.add('pinned');
        d.style.display = (App.currentPage === 'page1') ? '' : 'none';
        document.body.appendChild(d);
        // 悬停展开时刷新「当前筛选已修改」提示
        d.addEventListener('mouseenter', () => this._renderViewDock());
        this._renderViewDock();
    },

    _toggleViewDockPin() {
        const d = document.getElementById('p1ViewDock');
        if (!d) return;
        const on = !d.classList.contains('pinned');
        d.classList.toggle('pinned', on);
        try { localStorage.setItem('p1ViewDockPinned', on ? '1' : '0'); } catch (e) {}
        this._renderViewDock();
    },

    _renderViewDock() {
        const d = document.getElementById('p1ViewDock');
        if (!d) return;
        const views = this._getSavedViews();
        const active = views.find(v => v.id === this._activeViewId);
        const curName = active ? active.name : '默认视图';
        const cur = this._collectView();
        const dirty = active && !this._sameView(active, cur);
        // 悬停时内容没变就不重绘，避免光标下的元素被替换
        const sig = JSON.stringify([views, this._activeViewId, this._renamingId, dirty, d.classList.contains('pinned')]);
        if (sig === this._viewDockSig) return;
        this._viewDockSig = sig;
        const item = v => {
            if (this._renamingId === v.id) {
                return `<div class="vdock-item on"><span class="ic">✏️</span><div class="tx">
                    <input id="vdRename" value="${Utils.esc(v.name)}" maxlength="30"
                        onkeydown="if(event.key==='Enter')Page1.renameSavedView('${v.id}',this.value);if(event.key==='Escape')Page1._cancelRename();"
                        onblur="Page1.renameSavedView('${v.id}',this.value)"></div></div>`;
            }
            return `<div class="vdock-item ${v.id === this._activeViewId ? 'on' : ''}" onclick="Page1.applySavedView('${v.id}')" title="${Utils.esc(this._viewDesc(v))}">
                <span class="ic">🔖</span>
                <div class="tx"><div class="nm">${Utils.esc(v.name)}</div><div class="ds">${Utils.esc(this._viewDesc(v))}</div></div>
                ${v.isDefault ? '<span class="dft" title="打开首页时自动应用">默认</span>' : ''}
                <span class="ops" onclick="event.stopPropagation()">
                    <button title="${v.isDefault ? '取消默认' : '设为默认'}" onclick="Page1.setDefaultView('${v.id}')">${v.isDefault ? '★' : '☆'}</button>
                    <button title="用当前筛选覆盖" onclick="Page1.updateSavedView('${v.id}')">⟳</button>
                    <button title="重命名" onclick="Page1.startRename('${v.id}')">✏️</button>
                    <button title="删除" onclick="Page1.deleteSavedView('${v.id}')">🗑</button>
                </span>
            </div>`;
        };
        d.innerHTML = `
            <div class="vdock-tab" title="视图管理 · 当前：${Utils.esc(curName)}"><span>🔖</span><span class="lb">视图</span><span class="cur">${Utils.esc(curName)}</span></div>
            <div class="vdock-panel"><div class="vdock-inner">
                <div class="vdock-head"><b>视图</b>
                    <button class="vdock-pin" title="${d.classList.contains('pinned') ? '取消固定' : '固定面板'}" onclick="Page1._toggleViewDockPin()">📌</button>
                </div>
                ${dirty ? `<div class="vdock-dirty">当前筛选与「${Utils.esc(active.name)}」不同
                    <button class="btn btn-sm btn-primary" onclick="Page1.updateSavedView('${active.id}')">保存到该视图</button></div>` : ''}
                <div class="vdock-body">
                    <div class="vdock-sec">系统视图</div>
                    <div class="vdock-item ${!this._activeViewId ? 'on' : ''}" onclick="Page1.applySavedView('')">
                        <span class="ic">🏠</span>
                        <div class="tx"><div class="nm">默认视图</div><div class="ds">客户视角 · 全部时间</div></div>
                        ${views.some(v => v.isDefault) ? '' : '<span class="dft">默认</span>'}
                    </div>
                    <div class="vdock-sec">我的视图（${views.length}）</div>
                    ${views.length ? views.map(item).join('') : '<div class="vdock-empty">还没有保存的视图。调好视角、客户、容量和时间范围后，在下方起个名字保存。</div>'}
                </div>
                <div class="vdock-foot">
                    <input id="vdNewName" placeholder="新视图名称，如：蔚来102Ah近3月" maxlength="30"
                        onkeydown="if(event.key==='Enter')Page1.saveCurrentView()">
                    <button class="btn btn-sm btn-primary" onclick="Page1.saveCurrentView()">保存</button>
                </div>
            </div></div>`;
        if (this._renamingId) {
            const el = document.getElementById('vdRename');
            if (el) { el.focus(); el.select(); }
        }
    },

    saveCurrentView() {
        const input = document.getElementById('vdNewName');
        const name = (input && input.value || '').trim();
        if (!name) { Toast.info('先给视图起个名字'); if (input) input.focus(); return; }
        const views = this._getSavedViews();
        const v = this._collectView();
        v.id = 'v' + Date.now().toString(36);
        v.name = name;
        views.push(v);
        this._activeViewId = v.id;
        this._putSavedViews(views);
        Toast.success(`视图「${name}」已保存`);
    },

    updateSavedView(id) {
        const views = this._getSavedViews();
        const v = views.find(x => x.id === id);
        if (!v) return;
        Object.assign(v, this._collectView());
        this._activeViewId = id;
        this._putSavedViews(views);
        Toast.success(`已用当前筛选更新「${v.name}」`);
    },

    startRename(id) {
        this._renamingId = id;
        this._renderViewDock();
    },
    _cancelRename() {
        this._renamingId = null;
        this._renderViewDock();
    },
    renameSavedView(id, name) {
        if (this._renamingId !== id) return;   // 回车后 blur 再触发一次，忽略
        this._renamingId = null;
        name = (name || '').trim();
        const views = this._getSavedViews();
        const v = views.find(x => x.id === id);
        if (v && name && name !== v.name) {
            v.name = name;
            this._putSavedViews(views);
            Toast.success('已重命名');
        } else {
            this._renderViewDock();
        }
    },

    setDefaultView(id) {
        const views = this._getSavedViews();
        const v = views.find(x => x.id === id);
        if (!v) return;
        const on = !v.isDefault;
        views.forEach(x => { x.isDefault = false; });
        v.isDefault = on;
        this._putSavedViews(views);
        Toast.success(on ? `打开首页时将自动应用「${v.name}」` : '已取消默认视图');
    },

    deleteSavedView(id) {
        const views = this._getSavedViews();
        const idx = views.findIndex(x => x.id === id);
        if (idx < 0) return;
        if (!confirm(`删除视图「${views[idx].name}」？`)) return;
        views.splice(idx, 1);
        if (this._activeViewId === id) this._activeViewId = null;
        this._putSavedViews(views);
        Toast.success('已删除');
    },

    // id 为空 = 系统「默认视图」：客户视角 + 当前客户 + 全部时间
    async applySavedView(id, silent) {
        const v = id ? this._getSavedViews().find(x => x.id === id)
            : { view: 'customer', oem: (document.getElementById('p1Customer') || {}).value || '', timeRange: 'all', name: '默认视图' };
        if (!v) return;
        this._activeViewId = id || null;
        this._renderViewDock();
        try {
            // 时间范围
            const tr = v.timeRange || 'all';
            if (window.ThreeView) ThreeView.setTimeRange({ mode: tr });
            document.querySelectorAll('#p1SegTime button').forEach(b =>
                b.classList.toggle('on', b.dataset.t === tr));
            // 客户
            const cust = document.getElementById('p1Customer');
            if (cust && v.oem && v.view !== 'project') {
                cust.value = v.oem;
                this.currentOem = v.oem;
            }
            if (v.view === 'project') {
                this.switchView('project', false);
                const pcust = document.getElementById('p1ProjCust');
                if (pcust && v.oem) pcust.value = v.oem;
                await this._fillProjectCaps();
                const pc = document.getElementById('p1ProjCap');
                if (pc && v.projCap) pc.value = v.projCap;
                if (pc && pc.value) await this.loadProject();
            } else if (v.view === 'cell') {
                this.switchView('cell', false);
                await this._fillCellCaps();
                const cp = document.getElementById('p1CellProduct');
                if (cp && v.cellProduct) cp.value = v.cellProduct;
                if (cp && cp.value) await this.loadCellView();
            } else {
                this.switchView('customer', false);
                await this.loadCapacityOptions();
                await this.loadDashboard(false);
            }
            this._renderCrumbs();
            this._renderViewDock();
            if (!silent) Toast.info(`已切换到「${v.name}」`);
        } catch (e) {
            Toast.error('应用视图失败：' + (e && e.message));
        }
    },

    // ============ 下载页面：当前看板导出为独立 HTML（todo#1，给客户看） ============
    // 快照 #p1Dashboard 当前渲染结果 + 内联全站 CSS（外链 + <style>），
    // 去掉交互（onclick 在独立文件里无定义），生成无需登录即可打开的单文件。
    async downloadPage() {
        const host = document.getElementById('p1Dashboard');
        if (!host || !host.innerHTML.trim() || host.querySelector('.t3-loading, .loading')) {
            Toast.error('看板尚未加载完成，请稍候再下载');
            return;
        }
        // 当前视角上下文（离线引擎据此取这一份数据；其余视角提示需重新导出）
        const st = window.ThreeView ? ThreeView.getState() : { view: 'customer', oem: '', cellCap: '' };
        const view = st.view || 'customer';
        const oem = this.currentOem || (st.oem || '') || (document.getElementById('p1Customer') || {}).value || '';
        let cellCap = st.cellCap || '';
        if (view === 'project' || view === 'cell') {
            const capSel = document.getElementById('p1ProjCap') || document.getElementById('p1CellProduct');
            if (!cellCap && capSel) cellCap = capSel.value || '';
        }
        Toast.info('正在拉取当前视角数据并生成离线可交互 HTML…');
        try {
            // 1) 内联加载离线渲染引擎源码
            let engineJs = '';
            try { engineJs = await (await fetch('/static/js/pages/dashboard_export.js')).text(); }
            catch (e) { engineJs = ''; }
            if (!engineJs.trim()) { Toast.error('离线渲染引擎加载失败'); return; }
            // 2) 现取当前视角数据（一次请求）
            let q = `?view=${encodeURIComponent(view)}`;
            if (view === 'customer') q += `&oem=${encodeURIComponent(oem)}`;
            else if (view === 'project') q += `&oem=${encodeURIComponent(oem)}&cell_cap=${encodeURIComponent(cellCap)}`;
            else if (view === 'cell') q += `&cell_cap=${encodeURIComponent(cellCap)}`;
            const r = await API.get('/api/dashboard/three_view' + q, { timeout: 120000 });
            if (!r || r.error) { Toast.error('拉取看板数据失败：' + ((r && r.error) || '无数据')); return; }
            const payload = { view, oem, cellCap, data: r };
            // 3) 收集全站样式 + 主题
            let css = '';
            for (const link of document.querySelectorAll('link[rel="stylesheet"]')) {
                try { css += (await (await fetch(link.href)).text()) + '\n'; } catch (e) { /* 单个失败忽略 */ }
            }
            document.querySelectorAll('style').forEach(s => { css += s.textContent + '\n'; });
            // 4) 标题与文件名
            const custSel = document.getElementById('p1Customer');
            const opt = custSel && custSel.selectedOptions && custSel.selectedOptions[0];
            const custName = (opt && opt.textContent && opt.textContent.split(' (')[0]) || oem || '客户';
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            const vname = { customer: '客户视角', project: '项目视角', cell: '电芯视角' }[view] || '客户视角';
            // 5) 组装独立可交互 HTML：内联数据 + 离线引擎 + 顶栏（视角/时间范围）+ 样式/主题
            const html = `<!DOCTYPE html>
<html lang="zh-CN" data-theme="${theme}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>客户看板 · ${Utils.esc(custName)} · ${vname} · ${dateStr}</title>
<style>${css}</style>
<script>window.EXPORT_PAYLOAD = ${JSON.stringify(payload)};<\/script>
</head>
<body>
<div id="off-dash" style="padding:24px;max-width:1600px;margin:0 auto;">
  <!-- 顶栏：与平台一致（视角切换 + 时间范围）；离线可交互，仅含当前视角数据 -->
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:nowrap;margin:0 0 12px 0;overflow-x:auto;">
    <div class="t3-vswitch" style="flex:0 0 auto;">
      <button class="off-view-c ${view==='customer'?'on':''}" data-v="customer" onclick="OfflineDash.switchView('customer')">👤 客户视角</button>
      <button class="off-view-p ${view==='project'?'on':''}" data-v="project" onclick="OfflineDash.switchView('project')">📦 项目视角</button>
      <button class="off-view-cell ${view==='cell'?'on':''}" data-v="cell" onclick="OfflineDash.switchView('cell')">🔋 电芯视角</button>
    </div>
    <div class="t3-timefilter" id="offSegBox" style="flex:0 0 auto;">
      <span style="font-size:12px;color:var(--text-muted);font-weight:700;">📅 时间范围</span>
      <div class="seg" id="offSegTime">
        <button data-t="3m">近3月</button><button data-t="6m">近6月</button>
        <button data-t="12m">近12月</button><button data-t="all" class="on">全部</button>
      </div>
    </div>
    <div style="margin-left:auto;font-size:12px;color:var(--text-muted);flex:0 0 auto;">
      ${Utils.esc(vname)} · ${Utils.esc(custName)}<span class="mono" style="color:var(--text-muted)"> (${Utils.esc(oem)})</span>
    </div>
  </div>
  <div id="p1Dashboard"><div class="t3-loading">正在渲染离线看板…</div></div>
  <div style="text-align:center;color:var(--text-muted);font-size:12px;padding:24px 0 8px;">
    客户看板离线版 · 生成于 ${now.toLocaleString('zh-CN')} · 数据快照（时间范围/失效模式/接入粒度等图表可在本地交互，视角切换需重新导出）
  </div>
</div>
<script>
${engineJs}
(function () {
  OfflineDash.setData(window.EXPORT_PAYLOAD);
  // 顶栏时间范围
  var seg = document.getElementById('offSegTime');
  if (seg) seg.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]'); if (!b) return;
    document.querySelectorAll('#offSegTime button').forEach(function (x) { x.classList.toggle('on', x === b); });
    OfflineDash.setTimeRange({ mode: b.dataset.t });
  });
  // 顶栏视角切换
  document.querySelectorAll('.off-view-c,.off-view-p,.off-view-cell').forEach(function (b) {
    b.addEventListener('click', function () { OfflineDash.switchView(b.dataset.v); });
  });
  OfflineDash.init();
})();<\/script>
</body>
</html>`;
            // 6) 触发下载
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `客户看板_${custName}_${vname}_${dateStr}.html`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
            Toast.success('已下载离线可交互看板（时间范围/图表可本地操作）');
        } catch (e) {
            Toast.error('生成下载失败：' + e.message);
        }
    },

    switchView(mode, shouldAuto) {
        // shouldAuto=true（默认）：切视角后自动出内容，不再等用户点「查询/查看」；
        // 下钻路径(_threeSwitch)显式加载，传 false 避免重复载。
        const preAuto = shouldAuto !== false;
        this._view = mode;
        const fc = document.getElementById('p1FilterC');
        const fp = document.getElementById('p1FilterP');
        const fcell = document.getElementById('p1FilterCell');
        const bc = document.querySelector('.p1-view-c');
        const bp = document.querySelector('.p1-view-p');
        const bcell = document.querySelector('.p1-view-cell');
        const show = m => m === mode;
        if (fc) fc.style.display = show('customer') ? '' : 'none';
        if (fp) fp.style.display = show('project') ? '' : 'none';
        if (fcell) fcell.style.display = show('cell') ? '' : 'none';
        // 新 vswitch：用 .on 高亮
        if (bc) bc.className = (mode === 'customer' ? 'p1-view-c on' : 'p1-view-c');
        if (bp) bp.className = (mode === 'project' ? 'p1-view-p on' : 'p1-view-p');
        if (bcell) bcell.className = (mode === 'cell' ? 'p1-view-cell on' : 'p1-view-cell');
        this._renderCrumbs();

        // —— 选完即确认：切视角自动加载对应内容 ——
        const run = async () => {
            try {
                if (mode === 'customer') {
                    // 保持客户视角：切回时重载当前客户看板
                    const oem = (document.getElementById('p1Customer') || {}).value || '';
                    if (oem) await this.loadDashboard(false);
                } else if (mode === 'project') {
                    const pcust = document.getElementById('p1ProjCust');
                    const ccust = (document.getElementById('p1Customer') || {}).value || '';
                    if (pcust && ccust && pcust.value !== ccust) {
                        pcust.value = ccust;
                        const capSel0 = document.getElementById('p1ProjCap');
                        if (capSel0) capSel0.value = '';
                    }
                    await this._fillProjectCaps();
                    const capSel = document.getElementById('p1ProjCap');
                    if (capSel && !capSel.value && capSel.options.length > 1) capSel.selectedIndex = 1;
                    const cap = capSel ? capSel.value : '';
                    if (cap) await this.loadProject();
                } else if (mode === 'cell') {
                    await this._fillCellCaps();
                    // 默认选中当前上下文的电芯产品（客户视角的 oem + 项目视角的 cell_cap）
                    const oem = this.currentOem || (document.getElementById('p1Customer') || {}).value || '';
                    const projCap = (document.getElementById('p1ProjCap') || {}).value || '';
                    if (projCap) {
                        // 从项目视角切过来：按 oem + cell_cap 匹配产品
                        this._selectCellProduct(oem, projCap);
                    }
                    const sel = document.getElementById('p1CellProduct');
                    if (sel && !sel.value && sel.options.length > 1) sel.selectedIndex = 1;   // 默认第一个容量
                    if (sel && sel.value) await this.loadCellView();
                }
            } catch (e) { /* 自动加载失败不阻塞切换 */ }
        };
        if (preAuto) run();
    },

    // 面包屑：客户 › 项目 › 电芯 回跳
    _renderCrumbs() {
        const box = document.getElementById('p1Crumbs');
        if (!box) return;
        const ts = window.ThreeView ? ThreeView.getState() : {};
        const parts = [];
        const addCrumb = (txt, active, onClick) => {
            parts.push(`<div class="t3-crumb ${active ? 'cur' : ''}" ${onClick ? `onclick="${onClick}" style="cursor:pointer"` : ''}>${txt}</div>`);
        };
        const oem = this.currentOem || (document.getElementById('p1Customer') || {}).value || '';
        if (this._view === 'project') {
            const cap = (document.getElementById('p1ProjCap') || {}).value || '';
            addCrumb(`👤 客户：${oem || '-'}`, false, "Page1.switchView('customer')");
            addCrumb(`📦 项目：${cap ? cap + 'Ah' : '-'}`, true, '');
        } else if (this._view === 'cell') {
            const cap = (document.getElementById('p1CellProduct') || {}).value || '';
            addCrumb(`👤 客户：${oem || '-'}`, false, "Page1.switchView('customer')");
            addCrumb(`📦 项目`, false, "Page1.switchView('project')");
            addCrumb(`🔋 电芯：${cap ? cap + 'Ah' : ''}`, true, '');
        } else {
            addCrumb(`👤 客户：${oem || '-'}`, true, '');
        }
        box.innerHTML = parts.join('');
    },

    // —— 三视角内部跳转承接（ThreeView.setSwitch）——
    // 客户视角点项目行 → 项目视角；项目视角「下钻进入电芯视角」→ 电芯视角；电芯视角「返回项目视角」→ 项目视角。
    async _threeSwitch(view, payload) {
        const p = payload || {};
        if (view === 'project') {
            // 切到项目视角筛选条，预填客户 + 容量，再加载
            this.switchView('project', false);
            const cSel = document.getElementById('p1ProjCust');
            if (cSel && p.oem && cSel.value !== p.oem) cSel.value = p.oem;
            await this._fillProjectCaps();   // 会把容量下拉填成该客户的容量
            const capSel = document.getElementById('p1ProjCap');
            if (capSel && p.cellCap) capSel.value = p.cellCap;
            // 该cap可能不在下拉里，补一个 option
            if (capSel && p.cellCap && [...capSel.options].every(o => String(o.value) !== String(p.cellCap))) {
                const opt = document.createElement('option');
                opt.value = p.cellCap; opt.textContent = p.cellCap + ' Ah';
                capSel.appendChild(opt); capSel.value = p.cellCap;
            }
            await this.loadProject();
            this._renderCrumbs();
        } else if (view === 'cell') {
            this.switchView('cell', false);
            await this._fillCellCaps();
            // 按上下文 oem + cell_cap 匹配电芯产品
            const oem = p.oem || this.currentOem || '';
            if (p.cellCap) this._selectCellProduct(oem, p.cellCap);
            const sel = document.getElementById('p1CellProduct');
            if (sel && sel.value) await this.loadCellView();
            this._renderCrumbs();
        } else if (view === 'customer') {
            this.switchView('customer', false);
            const cSel = document.getElementById('p1Customer');
            if (cSel && p.oem) cSel.value = p.oem;
            await this.loadDashboard(false);
        }
    },

    // 填电芯视角的容量下拉（只按 cell_cap，不区分结构/PN）
    async _fillCellCaps() {
        const sel = document.getElementById('p1CellProduct');
        if (!sel) return;
        // 按当前上下文客户过滤（如果有），否则全量
        const oem = this.currentOem || (document.getElementById('p1Customer') || {}).value || '';
        const url = oem ? `/api/customers/cell_products?oem=${encodeURIComponent(oem)}` : '/api/customers/cell_products';
        const products = await API.get(url);
        const list = (Array.isArray(products) ? products : []);
        this._cellProducts = list;
        // 按 cell_cap 去重，只保留容量维度
        const seen = new Set();
        const caps = [];
        for (const p of list) {
            const cap = String(p.cell_cap);
            if (!seen.has(cap)) { seen.add(cap); caps.push(p.cell_cap); }
        }
        const prev = sel.value;
        sel.innerHTML = '<option value="">选择电芯容量...</option>' +
            caps.map(cap => `<option value="${Utils.esc(cap)}" ${cap === prev ? 'selected' : ''}>${Utils.esc(cap)} Ah</option>`).join('');
        sel.onchange = () => {
            if (this._view === 'cell' && sel.value) this.loadCellView();
        };
    },

    // 按上下文（oem + cell_cap）选中电芯容量下拉的匹配项
    _selectCellProduct(oem, cellCap) {
        const sel = document.getElementById('p1CellProduct');
        if (!sel || !cellCap) return;
        sel.value = String(cellCap);
    },

    // 电芯视角看板：选定电芯容量 → 看该容量电芯整体表现（不按结构/PN 限制）
    async loadCellView() {
        const cap = (document.getElementById('p1CellProduct') || {}).value || '';
        if (!cap) { Toast.error('请先选择电芯容量'); return; }
        const box = document.getElementById('p1Dashboard');
        if (!box) return;
        // —— 三视角电芯视角：/api/dashboard/three_view?view=cell ——
        if (window.ThreeView) {
            await ThreeView.loadCell(box, cap);
            return;
        }
        box.innerHTML = '<div class="loading" style="padding:20px;">正在加载该款电芯数据（Doris 查询较慢，请稍候）…</div>';
        const r = await API.get(`/api/dashboard/cell?cell_cap=${encodeURIComponent(cap)}`, { timeout: 120000 });
        if (!r || !r.success) { box.innerHTML = `<p class="empty-state">${Utils.esc((r && r.error) || '查询失败')}</p>`; return; }
        const rows = r.rows || [];
        if (!rows.length) {
            box.innerHTML = `<div class="empty-state" style="padding:24px;">暂无该款电芯 (${Utils.esc(cap)}Ah · ${Utils.esc(struct || '-')})的客户数据，或数据尚未接入。</div>`;
            return;
        }
        const custName = oem => {
            const c = (App.customers || []).find(x => x.oem === oem);
            return c ? (c.oem_ch || c.name_cn || oem) : oem;
        };
        const dataRows = rows.filter(x => x.oem !== '合计');
        const sum = rows.find(x => x.oem === '合计') || {};
        // 合并各客户失效模式占比（甜甜圈）与接入走势（折线，合并后取近16个月）
        const modesMap = {};
        dataRows.forEach(r => (r.modes || []).forEach(m => { modesMap[m.name] = (modesMap[m.name] || 0) + (m.count || 0); }));
        const modeItems = Object.entries(modesMap).sort((a, b) => b[1] - a[1]).map(([name, count]) => ({ label: name, value: count }));
        const trendMap = {};
        dataRows.forEach(r => (r.month_trend || []).forEach(m => { trendMap[m.period] = Math.max(trendMap[m.period] || 0, m.count || 0); }));
        const trendArr = Object.entries(trendMap).sort((a, b) => a[0] < b[0] ? -1 : 1).slice(-16);
        const trendItems = trendArr.map(([p, v]) => ({ label: p.slice(2), value: v }));
        const fmt = n => (n || 0).toLocaleString();
        const kpi = (lab, val, col, sub) => `
            <div style="flex:1;min-width:130px;background:var(--bg-card);border:1px solid var(--border-row);border-radius:12px;padding:12px 14px;">
                <div style="font-size:12px;color:var(--text-muted);">${Utils.esc(lab)}</div>
                <div style="font-size:22px;font-weight:800;color:${col};margin-top:4px;" class="num">${Utils.esc(val)}</div>
                ${sub ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${Utils.esc(sub)}</div>` : ''}
            </div>`;
        box.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:6px 2px 10px;">
                <div style="font-size:14px;font-weight:700;color:var(--text-primary);">🔋 电芯视角<span style="font-weight:400;font-size:12px;color:var(--text-muted);margin-left:8px;">容量 ${Utils.esc(cap)}Ah</span></div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                    <span class="badge badge-info mono">在用客户 ${dataRows.length}</span>
                    <span class="badge badge-info mono">出货层级：${this._accLevel || 'System'}</span>
                    <button class="btn btn-sm btn-secondary" onclick="Page1.loadCellView()">🔄 刷新</button>
                    <span style="font-size:11px;color:var(--text-muted);">跨客户对比 · 按接入/预警/失效</span>
                </div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
                ${kpi('累计接入', fmt(sum.access_total), 'var(--accent)', '跨客户合计')}
                ${kpi('今年接入', fmt(sum.this_year), 'var(--text-primary)', '')}
                ${kpi('出货条码(系统)', fmt(sum.ship_system), 'var(--text-primary)', '')}
                ${kpi('累计预警外发', fmt(sum.warn_total), 'var(--danger)', `近7天 ${fmt(sum.warn_7d)}`)}
            </div>
            <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px;">
                <div class="card"><div class="card-title">📈 接入走势（累计，近16月）</div><div>${this._svgLine(trendItems)}</div></div>
                <div class="card"><div class="card-title">🍩 失效模式占比（跨客户合计）</div><div>${this._svgDonut(modeItems)}</div></div>
            </div>
            <div class="card">
                <div class="card-title">🏢 跨客户对比（同一颗电芯，不同客户质量差异）</div>
                <div class="table-wrapper"><table class="dash-table" style="width:100%;">
                <thead><tr>
                    <th>客户</th><th class="num">累计接入</th><th class="num">今年接入</th>
                    <th class="num">出货条码(系统)</th><th class="num">累计预警外发</th><th class="num">近7天预警</th>
                    <th>失效模式TOP</th>
                </tr></thead>
                <tbody>${rows.map(x => {
                    const isSum = x.oem === '合计';
                    const topCell = x.top_fault
                        ? `${Utils.esc(x.top_fault)} <span class="num" style="color:var(--danger);">×${(x.top_fault_cnt||0).toLocaleString()}</span>`
                        : (isSum ? '' : '<span style="color:var(--text-muted);">—</span>');
                    return `<tr ${isSum ? 'style="font-weight:800;background:var(--panel-2);"' : ''}>
                        <td>${isSum ? '合计' : Utils.esc(custName(x.oem))}<span style="color:var(--text-muted);font-size:10px;font-weight:400;">${isSum ? '' : ` (${Utils.esc(x.oem)})`}</span></td>
                        <td class="num">${(x.access_total||0).toLocaleString()}</td>
                        <td class="num">${(x.this_year||0).toLocaleString()}</td>
                        <td class="num">${(x.ship_system||0).toLocaleString()}</td>
                        <td class="num">${(x.warn_total||0).toLocaleString()}</td>
                        <td class="num">${(x.warn_7d||0).toLocaleString()}</td>
                        <td>${topCell}</td>
                    </tr>`;
                }).join('')}</tbody>
            </table></div></div>`;
        this._enableSort(box);
    },

    // SVG 折线图（接入走势）
    _svgLine(items) {
        const pairs = (items || []).filter(d => d && d.label != null && d.value != null);
        if (!pairs.length) return '<p class="empty-state">暂无走势数据</p>';
        const W = 560, H = 220, padL = 46, padB = 34, padT = 16;
        const iw = W - padL, ih = H - padT - padB;
        const maxV = Math.max(...pairs.map(p => Number(p.value) || 0), 1);
        const gap = pairs.length > 1 ? iw / (pairs.length - 1) : 0;
        const pts = pairs.map((p, i) => ({
            x: padL + (pairs.length > 1 ? i * gap : iw / 2),
            y: padT + ih - (Number(p.value) || 0) / maxV * ih, label: p.label, value: p.value }));
        const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)" stroke="#fff" stroke-width="1.5"><title>${Utils.esc(p.label)}: ${p.value}</title></circle>
            <text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1) - 8}" text-anchor="middle" font-size="9.5" fill="var(--text-secondary)">${Utils.esc(p.label)}</text>`).join('');
        let grid = '';
        for (let g = 1; g <= 4; g++) {
            const gy = padT + (ih / 5) * g; const val = Math.round(maxV / 5 * (5 - g));
            grid += `<line x1="${padL}" y1="${gy}" x2="${W}" y2="${gy}" stroke="var(--border-row)" stroke-width="1"/><text x="${padL - 6}" y="${gy + 4}" text-anchor="end" font-size="10" fill="var(--text-muted)">${val >= 10000 ? (val / 10000).toFixed(1) + '万' : val}</text>`;
        }
        return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:600px;">${grid}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
    },

    // SVG 甜甜圈/饼图（失效占比）
    _svgDonut(items) {
        const pairs = (items || []).filter(d => d && d.label != null && d.value != null);
        if (!pairs.length) return '<p class="empty-state">暂无失效数据</p>';
        const total = pairs.reduce((s, p) => s + (Number(p.value) || 0), 0) || 1;
        const R = 72, CX = 96, CY = 92, RIN = 40;
        const colors = ['#4f8cff', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#38bdf8', '#fb7185', '#2dd4bf'];
        let arc = ''; let aStart = -Math.PI / 2;
        pairs.forEach((p, i) => {
            const frac = (Number(p.value) || 0) / total; const aEnd = aStart + frac * 2 * Math.PI;
            const x1 = CX + R * Math.cos(aStart), y1 = CY + R * Math.sin(aStart);
            const x2 = CX + R * Math.cos(aEnd), y2 = CY + R * Math.sin(aEnd);
            arc += `<path d="M${CX},${CY} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${frac > 0.5 ? 1 : 0} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${colors[i % colors.length]}"><title>${Utils.esc(p.label)}: ${p.value} (${(frac * 100).toFixed(1)}%)</title></path>`;
            aStart = aEnd;
        });
        const legend = pairs.map((p, i) => `<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin-bottom:4px;">
            <span style="width:10px;height:10px;border-radius:2px;background:${colors[i % colors.length]};display:inline-block;"></span>
            ${Utils.esc(p.label)}: <strong>${p.value}</strong> (${((Number(p.value) || 0) / total * 100).toFixed(1)}%)</div>`).join('');
        return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
            <svg width="192" height="184" viewBox="0 0 192 184">${arc}
                <text x="${CX}" y="${CY}" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-primary)">${total}</text>
                <text x="${CX}" y="${CY + 16}" text-anchor="middle" font-size="10" fill="var(--text-muted)">失效</text>
            </svg>
            <div style="flex:1;min-width:160px;">${legend}</div>
        </div>`;
    },

    // ===== 关键处置事件时间轴（原型：召回/OTA/停线/批量预警/索赔/质量会/SOP/工艺变更）=====
    async renderEventsTimeline(oem, cellCap, scope) {
        if (!oem) return '';
        let evs = [];
        try {
            const scopeP = scope === 'project' ? 'project' : 'all';
            const q = scope === 'project'
                ? `/api/events?oem=${encodeURIComponent(oem)}&cell_cap=${encodeURIComponent(cellCap)}`
                : `/api/events?oem=${encodeURIComponent(oem)}&scope=${scopeP}`;
            const d = await API.get(q, { timeout: 15000 });
            if (Array.isArray(d)) evs = d;
        } catch (e) { /* 容错 */ }
        const TYPE_COLOR = { '召回': 'var(--danger)', 'OTA': 'var(--accent)', '停线': 'var(--danger)', '批量预警': 'var(--warning)', '索赔': 'var(--warning)', '质量会': 'var(--accent)', 'SOP': 'var(--success)', '工艺变更': 'var(--accent)', '其他': 'var(--text-muted)' };
        const ST_COLOR = { '已闭环': 'var(--success)', '处理中': 'var(--warning)', '待处理': 'var(--danger)' };
        const items = evs.map(e => {
            const c = TYPE_COLOR[e.event_type] || 'var(--text-muted)';
            const sc = ST_COLOR[e.status] || 'var(--text-muted)';
            const date = (e.occur_at || '').slice(0, 10) || '—';
            return `<div class="tl-item ${e.status === '已闭环' ? 'g' : (e.status === '待处理' ? 'r' : 'o')}" style="position:relative;padding:0 0 14px 24px;border-left:2px solid var(--border-row);">
                <div class="tl-date" style="font-size:11.5px;color:var(--text-muted);font-weight:600;">${Utils.esc(date)}</div>
                <div class="tl-title" style="font-size:13.5px;font-weight:700;margin:2px 0 3px;">${Utils.esc(e.title || '')}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <span class="pill" style="background:${c}22;color:${c};">${Utils.esc(e.event_type || '事件')}</span>
                    <span class="pill" style="background:${sc}22;color:${sc};">${Utils.esc(e.status || '')}</span>
                    ${e.cell_cap ? `<span class="pill" style="background:var(--panel-2);color:var(--text-muted);">${Utils.esc(e.cell_cap)}Ah</span>` : ''}
                </div>
