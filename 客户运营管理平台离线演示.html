<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户运营管理平台 · 离线演示版</title>
    <style>
/* ============ 客户运营管理平台 - 深浅双主题样式 ============ */

/* ---- 深色主题（默认） ---- */
:root,
[data-theme="dark"] {
    --bg-primary: #0a0e27;
    --bg-secondary: #0f1335;
    --bg-card: rgba(15, 25, 60, 0.7);
    --bg-card-hover: rgba(20, 35, 80, 0.85);
    --bg-input: rgba(10, 14, 39, 0.8);
    --bg-sidebar: rgba(8, 12, 35, 0.95);
    --bg-header: rgba(8, 12, 35, 0.9);
    --bg-body-grad: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0a0e27 100%);
    --border-card: rgba(100, 210, 255, 0.2);
    --border-card-hover: rgba(100, 210, 255, 0.5);
    --border-row: rgba(100, 210, 255, 0.06);
    --accent: #64d2ff;
    --accent-light: #a0e9ff;
    --accent-dark: #3ab8e8;
    --text-primary: #e8f4ff;
    --text-secondary: #8ba4c4;
    --text-muted: #5a7a9a;
    --success: #69db7c;
    --warning: #ffa94d;
    --danger: #ff6b6b;
    --info: #74c0fc;
    --purple: #b197fc;
    --btn-primary-text: #0a0e27;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --sidebar-width: 240px;
    --header-height: 60px;
    --radius: 12px;
    --radius-sm: 8px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    /* ---- AGENTS.md 设计令牌桥接（深色，指向已有语义令牌）---- */
    --bg: var(--bg-primary);
    --panel: var(--bg-card);
    --panel-2: var(--bg-secondary);
    --line: var(--border-row);
    --line-strong: var(--border-card);
    --border-strong: var(--border-card-hover);
    --ink: var(--text-primary);
    --ink-2: var(--text-secondary);
    --muted: var(--text-muted);
    --faint: var(--text-muted);
    --text-danger: var(--danger);
    --brand: var(--accent);
    --brand-ink: #0a0e27;
    --brand-soft: rgba(100, 210, 255, 0.14);
    --ring: rgba(100, 210, 255, 0.30);
    --ok: var(--success);
    --ok-soft: rgba(105, 219, 124, 0.14);
    --warn: var(--warning);
    --warn-soft: rgba(255, 169, 77, 0.14);
    --danger-soft: rgba(255, 107, 107, 0.14);
    --info-soft: rgba(116, 192, 252, 0.14);
    --font-mono: "Consolas", "JetBrains Mono", ui-monospace, monospace;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --grid: rgba(139, 164, 196, 0.14);   /* 图表网格线 */
    /* 图表顺序色（Sequential）：蓝、绿两组，各三档由深到浅。深色底取值 */
    --seq-b1: #1a50c0; --seq-b2: #4f94f2; --seq-b3: #98c6ff;
    --seq-g1: #0f7f45; --seq-g2: #2bb868; --seq-g3: #8ee0a2;
    --seq-na: #64748b;   /* 未归类的失效模式 */
}

/* ---- 浅色主题 ---- */
[data-theme="light"] {
    --bg-primary: #f0f2f8;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.95);
    --bg-card-hover: rgba(248, 250, 255, 1);
    --bg-input: #ffffff;
    --bg-sidebar: #ffffff;
    --bg-header: rgba(255, 255, 255, 0.95);
    --bg-body-grad: linear-gradient(135deg, #f0f2f8 0%, #e8edf5 50%, #f0f2f8 100%);
    --border-card: rgba(0, 120, 200, 0.15);
    --border-card-hover: rgba(0, 120, 200, 0.35);
    --border-row: rgba(0, 0, 0, 0.05);
    --accent: #0084ff;
    --accent-light: #2e96ff;
    --accent-dark: #0066cc;
    --text-primary: #1a2332;
    --text-secondary: #5a6a7a;
    --text-muted: #8a9aab;
    --success: #1aaa55;
    --warning: #e89100;
    --danger: #e53e3e;
    --info: #3182ce;
    --purple: #805ad5;
    --btn-primary-text: #ffffff;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);

    /* ---- AGENTS.md 设计令牌桥接（浅色）---- */
    --bg: var(--bg-primary);
    --panel: var(--bg-card);
    --panel-2: var(--bg-secondary);
    --line: var(--border-row);
    --line-strong: var(--border-card);
    --border-strong: var(--border-card-hover);
    --ink: var(--text-primary);
    --ink-2: var(--text-secondary);
    --muted: var(--text-muted);
    --faint: var(--text-muted);
    --text-danger: var(--danger);
    --brand: var(--accent);
    --brand-ink: #ffffff;
    --brand-soft: rgba(0, 132, 255, 0.10);
    --ring: rgba(0, 132, 255, 0.30);
    --ok: var(--success);
    --ok-soft: rgba(26, 170, 85, 0.12);
    --warn: var(--warning);
    --warn-soft: rgba(232, 145, 0, 0.12);
    --danger-soft: rgba(229, 62, 62, 0.12);
    --info-soft: rgba(49, 130, 206, 0.12);
    --font-mono: "Consolas", "JetBrains Mono", ui-monospace, monospace;
    --grid: rgba(26, 35, 50, 0.08);
    /* 图表顺序色：浅色底取值 */
    --seq-b1: #1a47aa; --seq-b2: #3f83e2; --seq-b3: #86b8f5;
    --seq-g1: #0a6634; --seq-g2: #169a50; --seq-g3: #62cb88;
    --seq-na: #94a3b8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
    background: var(--bg-body-grad);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

/* ============ 布局 ============ */
.app-container {
    display: flex;
    min-height: 100vh;
}

/* 侧边栏 */
.sidebar {
    width: var(--sidebar-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-card);
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(20px);
}

.sidebar-logo {
    height: var(--header-height);
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--border-card);
}

.sidebar-logo h1 {
    font-size: 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    letter-spacing: 1px;
}

.sidebar-nav {
    flex: 1;
    padding: 16px 0;
    overflow-y: auto;
}

.nav-item {
    display: flex;
    align-items: center;
    padding: 12px 24px;
    cursor: pointer;
    transition: var(--transition);
    border-left: 3px solid transparent;
    color: var(--text-secondary);
    font-size: 14px;
    gap: 12px;
    text-decoration: none;
}

.nav-item:hover {
    background: rgba(100, 210, 255, 0.05);
    color: var(--text-primary);
}

.nav-item.active {
    background: rgba(100, 210, 255, 0.1);
    border-left-color: var(--accent);
    color: var(--accent);
}

.nav-item .nav-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

/* 二级子项（比父级低一层，如：工具箱/查询手册 挂在 数智分析 之下） */
.nav-item.nav-sub {
    padding-left: 44px;
    font-size: 13px;
}
.nav-item.nav-sub .nav-sub-bullet {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--text-muted); flex: none; margin-left: 2px;
}

/* 主内容区 */
.main-content {
    margin-left: var(--sidebar-width);
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* 顶部栏 */
.header {
    height: var(--header-height);
    background: var(--bg-header);
    border-bottom: 1px solid var(--border-card);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(20px);
}

.header-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
}

.header-user {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-user select {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    outline: none;
    cursor: pointer;
}

.header-user select:focus {
    border-color: var(--accent);
}

.opinion-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: opacity .15s;
}

.opinion-btn:hover {
    opacity: .85;
}

/* 知识库：QA / 数智分析 子标签 */
.qa6-tab-bar-sub {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    border-bottom: 2px solid var(--border-card);
    padding-bottom: 4px;
}
.qa6-tab-bar-sub .qa6-tab {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    cursor: pointer;
    font-size: 13px;
}
.qa6-tab-bar-sub .qa6-tab:hover { background: rgba(116,140,255,.08); }
.qa6-tab-bar-sub .qa6-tab-active {
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    font-weight: 600;
}
/* 知识库分类树 */
.qa6-kb-tree {
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    margin-bottom: 8px;
    max-height: 180px;
    overflow: auto;
    background: var(--bg-input);
}
.qa6-kb-tree-head {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 6px;
}
.kb-tree-item { font-size: 13px; line-height: 1.8; }
.kb-tree-toggle { color: var(--text-secondary); margin-right: 4px; }
.kb-tree-name { color: var(--text-primary); }
.kb-tree-empty { color: var(--text-secondary); font-size: 12px; }
.qa6-kb-tree .kb-tree-item .kb-tree-toggle { cursor: default; }

/* 内容区域 */
.page-content {
    flex: 1;
    padding: 24px;
}

/* ============ 卡片 (玻璃拟态) ============ */
.card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    padding: 20px;
    backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
    transition: var(--transition);
}

.card:hover {
    border-color: var(--border-card-hover);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}

.card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-light);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(100, 210, 255, 0.1);
    display: flex;
    align-items: center;
    gap: 8px;
}

.card-title::before {
    content: '';
    width: 4px;
    height: 16px;
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    border-radius: 2px;
}

/* ============ 表格 ============ */
.table-wrapper {
    overflow-x: auto;
    border-radius: var(--radius-sm);
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

thead {
    background: rgba(100, 210, 255, 0.08);
}

th {
    padding: 12px 14px;
    text-align: left;
    color: var(--accent-light);
    font-weight: 600;
    white-space: nowrap;
    border-bottom: 1px solid var(--border-card);
}

td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-row);
    color: var(--text-primary);
}

tr:hover td {
    background: rgba(100, 210, 255, 0.03);
}

/* ============ 表单控件 ============ */
.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
}

input[type="text"],
input[type="date"],
input[type="number"],
input[type="email"],
input[type="tel"],
textarea,
select {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    font-family: inherit;
    transition: var(--transition);
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(100, 210, 255, 0.1);
}

textarea {
    resize: vertical;
    min-height: 80px;
}

/* ============ 按钮 ============ */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    font-family: inherit;
    text-decoration: none;
}

.btn-primary {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: var(--btn-primary-text);
}

.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(100, 210, 255, 0.3);
}

.btn-secondary {
    background: rgba(100, 210, 255, 0.1);
    color: var(--accent);
    border: 1px solid var(--border-card);
}

.btn-secondary:hover {
    background: rgba(100, 210, 255, 0.2);
    border-color: var(--accent);
}

.btn-success {
    background: linear-gradient(135deg, #4caf50, var(--success));
    color: var(--btn-primary-text);
}

.btn-danger {
    background: rgba(255, 107, 107, 0.15);
    color: var(--danger);
    border: 1px solid rgba(255, 107, 107, 0.3);
}

.btn-danger:hover {
    background: rgba(255, 107, 107, 0.25);
}

.btn-sm {
    padding: 5px 10px;
    font-size: 12px;
}

/* ============ 筛选栏 ============ */
.filter-bar {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
}

.filter-bar .form-group {
    margin-bottom: 0;
    min-width: 160px;
}

.filter-bar select,
.filter-bar input {
    width: auto;
    min-width: 160px;
}

/* ============ 网格布局 ============ */
.grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

/* ============ 统计数字卡片 ============ */
.stat-card {
    text-align: center;
    padding: 20px;
}

.stat-value {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
}

/* ============ 标签/徽章 ============ */
.badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
}

.badge-success {
    background: rgba(105, 219, 124, 0.15);
    color: var(--success);
    border: 1px solid rgba(105, 219, 124, 0.3);
}

.badge-warning {
    background: rgba(255, 169, 77, 0.15);
    color: var(--warning);
    border: 1px solid rgba(255, 169, 77, 0.3);
}

.badge-danger {
    background: rgba(255, 107, 107, 0.15);
    color: var(--danger);
    border: 1px solid rgba(255, 107, 107, 0.3);
}

.badge-info {
    background: rgba(116, 192, 252, 0.15);
    color: var(--info);
    border: 1px solid rgba(116, 192, 252, 0.3);
}

.badge-purple {
    background: rgba(177, 151, 252, 0.15);
    color: var(--purple);
    border: 1px solid rgba(177, 151, 252, 0.3);
}

/* ============ 模态框 ============ */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3000;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition);
}

.modal-overlay.active {
    opacity: 1;
    pointer-events: all;
}

.modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    padding: 24px;
    width: 92%;
    max-width: 960px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    transform: translateY(20px);
    transition: var(--transition);
}

.modal-overlay.active .modal {
    transform: translateY(0);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-card);
}

.modal-header h3 {
    font-size: 16px;
    color: var(--accent-light);
}

.modal-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
}

.modal-close:hover {
    color: var(--danger);
    background: rgba(255, 107, 107, 0.1);
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-card);
}

/* ============ 书架文档展示 ============ */
.bookshelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
}

.book-item {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.book-item:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(100, 210, 255, 0.15);
}

.book-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
}

.book-icon {
    font-size: 32px;
    margin-bottom: 10px;
    display: block;
}

.book-title {
    font-size: 12px;
    color: var(--text-primary);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.book-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
}

/* ============ 文档管理三级分组 ============ */
.doc-group {
    margin-bottom: 16px;
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    overflow: hidden;
}
.doc-group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(100, 210, 255, 0.06);
    cursor: pointer;
    user-select: none;
    transition: var(--transition);
}
.doc-group-head:hover {
    background: rgba(100, 210, 255, 0.12);
}
.doc-group-arrow {
    font-size: 12px;
    color: var(--accent);
    width: 14px;
    display: inline-block;
}
.doc-group-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    flex: 1;
}
.doc-group-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 2px 10px;
    border-radius: 10px;
}
.doc-group-body {
    padding: 12px 16px;
}
.doc-cap-group {
    margin-bottom: 14px;
}
.doc-cap-head {
    font-size: 13px;
    font-weight: 600;
    color: var(--purple);
    padding: 6px 0;
    margin-bottom: 8px;
    border-bottom: 1px dashed var(--border-card);
}
.doc-cap-group .bookshelf {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    padding-left: 12px;
}
.book-type-badge {
    display: inline-block;
    font-size: 10px;
    color: var(--accent);
    background: rgba(100, 210, 255, 0.12);
    border: 1px solid rgba(100, 210, 255, 0.3);
    border-radius: 8px;
    padding: 1px 8px;
    margin-bottom: 8px;
}

/* ============ 空状态 ============ */
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
}

.empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
}

/* ============ 加载状态 ============ */
.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 30px;
    color: var(--text-muted);
    font-size: 14px;
}

.loading::before {
    content: '';
    width: 20px;
    height: 20px;
    border: 2px solid var(--border-card);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ============ Toast 通知 ============ */
.toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    animation: slideIn 0.3s ease;
    box-shadow: var(--shadow);
}

.toast-success {
    background: rgba(105, 219, 124, 0.15);
    border: 1px solid rgba(105, 219, 124, 0.4);
    color: var(--success);
}

.toast-error {
    background: rgba(255, 107, 107, 0.15);
    border: 1px solid rgba(255, 107, 107, 0.4);
    color: var(--danger);
}

.toast-info {
    background: rgba(116, 192, 252, 0.15);
    border: 1px solid rgba(116, 192, 252, 0.4);
    color: var(--info);
}

/* 通用长文本截断：单行省略号，悬浮 title 看全文。
   勿改回 -webkit-box + line-clamp：会覆盖 td 的 table-cell 显示，导致单元格垂直不居中且文本折行 */
.cell-ellipsis {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* ============ 响应式 ============ */
@media (max-width: 1200px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
    .sidebar { width: 60px; }
    .sidebar-logo h1 { display: none; }
    .nav-item span { display: none; }
    .main-content { margin-left: 60px; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* ============ 滚动条 ============ */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(100, 210, 255, 0.2);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(100, 210, 255, 0.4);
}

/* ============ 页面过渡 ============ */
.page {
    display: none;
    animation: fadeIn 0.3s ease;
}

.page.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ============ 内联表单布局 ============ */
.form-inline {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
}

.form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
}

/* ============ 操作列 ============ */
.actions {
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
}

/* ============ 页面6: Q&A 智能知识库 ============ */
.qa6-wrap {
    display: flex;
    gap: 16px;
    height: calc(100vh - var(--header-height) - 40px);
    min-height: 500px;
}

/* --- 左侧聊天区 --- */
.qa6-chat {
    flex: 1 1 58%;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    overflow: hidden;
    backdrop-filter: blur(12px);
}
.qa6-chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-card);
    background: rgba(10, 20, 50, 0.5);
}
.qa6-chat-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
}
.qa6-engine-tag {
    font-size: 11px;
    color: var(--text-muted);
    background: rgba(100, 210, 255, 0.08);
    padding: 2px 8px;
    border-radius: 4px;
}
.qa6-msg-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.qa6-msg {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-width: 88%;
}
.qa6-msg.qa6-user {
    margin-left: auto;
    flex-direction: row-reverse;
}
.qa6-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
}
.qa6-avatar-bot {
    background: linear-gradient(135deg, var(--accent), var(--purple));
    color: #fff;
}
.qa6-avatar-user {
    background: rgba(100, 210, 255, 0.15);
    color: var(--accent);
    border: 1px solid var(--border-card);
}
.qa6-bubble {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
}
.qa6-bubble-bot {
    background: rgba(20, 35, 80, 0.6);
    color: var(--text-primary);
    border: 1px solid var(--border-card);
}
.qa6-bubble-user {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
}

/* 打字指示器 */
.qa6-typing {
    display: flex;
    gap: 4px;
    padding: 4px 0;
}
.qa6-typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-secondary);
    animation: qa6-typing-bounce 1.4s infinite ease-in-out;
}
.qa6-typing span:nth-child(2) { animation-delay: 0.2s; }
.qa6-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes qa6-typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
}

/* 搜索结果 */
.qa6-result-count {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 10px;
}
.qa6-result-card {
    background: rgba(10, 20, 50, 0.4);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 10px;
}
.qa6-result-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}
.qa6-rank {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
}
.qa6-rank.rank-1 { background: rgba(105, 219, 124, 0.2); color: var(--success); }
.qa6-rank.rank-2 { background: rgba(255, 169, 77, 0.2); color: var(--warning); }
.qa6-rank.rank-3 { background: rgba(177, 151, 252, 0.2); color: var(--purple); }
.qa6-cat-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
}
.qa6-cat-tag.cat-battery { background: rgba(105, 219, 124, 0.15); color: var(--success); }
.qa6-cat-tag.cat-safety { background: rgba(255, 107, 107, 0.15); color: var(--danger); }
.qa6-cat-tag.cat-breakdown { background: rgba(255, 169, 77, 0.15); color: var(--warning); }
.qa6-cat-tag.cat-charge { background: rgba(116, 192, 252, 0.15); color: var(--info); }
.qa6-cat-tag.cat-other { background: rgba(177, 151, 252, 0.15); color: var(--purple); }
.qa6-match-score {
    font-size: 12px;
    color: var(--text-secondary);
    margin-left: auto;
}
.qa6-match-score strong { color: var(--accent); }
.qa6-result-progress {
    height: 4px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 2px;
    margin-bottom: 8px;
    overflow: hidden;
}
.qa6-progress-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
}
.qa6-progress-high { background: var(--success); }
.qa6-progress-mid { background: var(--warning); }
.qa6-progress-low { background: var(--danger); }
.qa6-result-q {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-light);
    margin-bottom: 6px;
}
.qa6-result-a {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
}
.qa6-no-result {
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
    padding: 16px;
}
.qa6-llm-block {
    margin-top: 10px;
    padding: 12px;
    background: linear-gradient(135deg, rgba(100, 210, 255, 0.08), rgba(177, 151, 252, 0.08));
    border: 1px solid rgba(100, 210, 255, 0.15);
    border-radius: var(--radius-sm);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-primary);
}
.qa6-llm-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--purple);
    margin-bottom: 6px;
}

/* 输入区 */
.qa6-input-area {
    display: flex;
    gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid var(--border-card);
    background: rgba(10, 20, 50, 0.3);
}
.qa6-input {
    flex: 1;
    background: rgba(10, 20, 50, 0.6);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text-primary);
    font-size: 14px;
    transition: var(--transition);
}
.qa6-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(100, 210, 255, 0.15);
}
.qa6-send-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
}
.qa6-send-btn:hover { opacity: 0.85; transform: scale(1.05); }

/* --- 右侧管理面板 --- */
.qa6-panel {
    flex: 0 0 40%;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    overflow: hidden;
    backdrop-filter: blur(12px);
}
.qa6-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-card);
    background: rgba(10, 20, 50, 0.5);
}
.qa6-panel-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
}
.qa6-panel-actions {
    display: flex;
    gap: 6px;
}
.qa6-btn {
    padding: 6px 12px;
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    background: rgba(20, 35, 80, 0.5);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
}
.qa6-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-card-hover);
}
.qa6-btn-primary {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    border-color: var(--accent);
    color: #fff;
}
.qa6-panel-stats {
    display: flex;
    gap: 16px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-secondary);
    border-bottom: 1px solid rgba(100, 210, 255, 0.08);
}
.qa6-stat-item strong { color: var(--accent); }
.qa6-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
}
.qa6-badge-success { background: rgba(105, 219, 124, 0.15); color: var(--success); }
.qa6-badge-info { background: rgba(116, 192, 252, 0.15); color: var(--info); }
.qa6-filter-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
}
.qa6-filter-input {
    flex: 1;
    background: rgba(10, 20, 50, 0.6);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    color: var(--text-primary);
    font-size: 13px;
}
.qa6-filter-input:focus { outline: none; border-color: var(--accent); }
.qa6-filter-select {
    background: rgba(10, 20, 50, 0.6);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
}
.qa6-table-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px;
}
.qa6-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.qa6-table th {
    text-align: left;
    padding: 8px 6px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 12px;
    border-bottom: 1px solid var(--border-card);
    position: sticky;
    top: 0;
    background: var(--bg-secondary);
    z-index: 1;
}
.qa6-table td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--border-row);
    color: var(--text-secondary);
    vertical-align: top;
}
.qa6-table tr:hover td { background: rgba(100, 210, 255, 0.04); }
.qa6-cell-q {
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: normal;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.qa6-cell-actions {
    white-space: nowrap;
}
.qa6-action-btn {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    transition: var(--transition);
}
.qa6-action-btn:hover { color: var(--accent-light); text-decoration: underline; }
.qa6-action-del { color: var(--danger); margin-left: 4px; }
.qa6-action-del:hover { color: #ff9999; }
.qa6-empty {
    text-align: center;
    color: var(--text-muted);
    padding: 30px 0;
}

/* 滚动条 */
.qa6-msg-area::-webkit-scrollbar,
.qa6-table-wrap::-webkit-scrollbar { width: 5px; }
.qa6-msg-area::-webkit-scrollbar-thumb,
.qa6-table-wrap::-webkit-scrollbar-thumb {
    background: rgba(100, 210, 255, 0.2);
    border-radius: 3px;
}
.qa6-msg-area::-webkit-scrollbar-track,
.qa6-table-wrap::-webkit-scrollbar-track { background: transparent; }

/* ============ 知识库管理 Tab ============ */
.qa6-tab-bar { display:flex;border-bottom:1px solid var(--border-card);margin-bottom:12px; }
.qa6-tab { padding:8px 16px;font-size:13px;color:var(--text-muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:var(--transition);font-family:inherit; }
.qa6-tab:hover { color:var(--text-secondary); }
.qa6-tab-active { color:var(--accent);border-bottom-color:var(--accent);font-weight:600; }
.qa6-btn-success { background:rgba(105,219,124,0.15);color:var(--success);border:1px solid rgba(105,219,124,0.3); }
.qa6-btn-success:hover { background:rgba(105,219,124,0.25);border-color:var(--success); }
.qa6-btn-warning { background:rgba(255,169,77,0.15);color:var(--warning);border:1px solid rgba(255,169,77,0.3); }
.qa6-btn-warning:hover { background:rgba(255,169,77,0.25);border-color:var(--warning); }

/* ============ 知识库管理面板 - 来源tag颜色 ============ */
.qa6-cat-tag.cat-info { background:rgba(116,192,252,0.15);color:var(--info); }
.qa6-cat-tag.cat-warning { background:rgba(255,169,77,0.15);color:var(--warning); }

/* ============ Markdown 渲染（新增智能能力用） ============ */
.md-body { line-height: 1.7; font-size: 14px; word-break: break-word; color: var(--text-primary); }
.md-body .md-h { margin: 12px 0 8px; font-size: 16px; color: var(--text-primary); }
.md-body h1.md-h { font-size: 18px; }
.md-body h2.md-h { font-size: 17px; }
.md-body h3.md-h, .md-body h4.md-h, .md-body h5.md-h, .md-body h6.md-h { font-size: 15px; }
.md-body .md-p { margin: 6px 0; color: var(--text-secondary); }
.md-body ul, .md-body ol { margin: 6px 0; padding-left: 24px; color: var(--text-secondary); }
.md-body li { margin: 2px 0; }
.md-body blockquote { margin: 8px 0; padding: 6px 14px; border-left: 3px solid var(--info); color: var(--text-secondary); background: rgba(116, 192, 252, 0.10); }
/* 行内代码 */
.md-body .md-code { background: var(--bg-input); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: Consolas, monospace; }
/* 代码块 */
.md-body .md-pre { background: var(--bg-card); color: var(--text-primary); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; border: 1px solid var(--border-card); }
.md-body .md-pre code { background: transparent; color: inherit; padding: 0; }
/* 表格：边框 + 内边距 + 表头 + 斑马纹，文字清晰 */
.md-body .md-table { margin: 10px 0; font-size: 13px; border-collapse: collapse; width: 100%; }
.md-body .md-table th,
.md-body .md-table td { border: 1px solid #d1d5db; padding: 6px 10px; text-align: left; color: #1f2937; }
.md-body .md-table th { background: #e5e7eb; color: #111827; font-weight: 600; }
.md-body .md-table tbody tr:nth-child(even) { background: #f9fafb; }
.md-body a { color: var(--primary, #2563eb); text-decoration: underline; }

/* ===== AI 任务进度面板 ===== */
.agent-progress {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: min(520px, calc(100vw - 32px));
    background: var(--bg-card, #0f1a2f);
    border: 1px solid var(--border-card, #2a3b5c);
    border-radius: var(--radius, 12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    padding: 16px;
    z-index: 3100;
    color: var(--text-primary);
}
.agent-progress .ap-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
}
.agent-progress .ap-title { font-weight: 700; font-size: 14px; color: var(--accent-light); }
.agent-progress .ap-step { font-size: 12px; color: var(--text-muted); }
.agent-progress .ap-thought {
    font-size: 12px; color: var(--text-secondary);
    min-height: 36px; line-height: 1.5;
    border-left: 3px solid var(--accent);
    padding: 4px 8px; margin-bottom: 10px;
    background: rgba(79,140,255,0.06); border-radius: 4px;
}
.agent-progress .ap-bar {
    height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden;
}
.agent-progress .ap-bar > i {
    display: block; height: 100%; background: var(--accent);
    width: 0%; transition: width 0.3s ease; border-radius: 3px;
}
.agent-progress .ap-spin { font-size: 22px; animation: ap-spin 1s linear infinite; }
@keyframes ap-spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }

/* ============ 参考项目精致样式覆盖（platform-shell.html 风格） ============ */

/* 侧栏精致化 */
.sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-card);
    padding: 16px 12px;
}
.sidebar .sidebar-brand {
    display: flex; align-items: center; gap: 11px; padding: 6px 8px 16px;
}
.sidebar .sidebar-brand .mk {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    display: grid; place-items: center;
    color: var(--btn-primary-text); font-weight: 800; font-size: 17px;
}
.sidebar .sidebar-brand b { font-size: 15px; font-weight: 800; color: var(--text-primary); }
.sidebar .sidebar-brand small { display: block; color: var(--text-muted); font-size: 11px; font-weight: 600; }
.nav-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 11px;
    border-radius: 9px; color: var(--text-secondary); text-decoration: none;
    font-weight: 600; font-size: 13.5px; cursor: pointer; margin-bottom: 2px;
    border-left: 3px solid transparent; transition: var(--transition);
}
.nav-item .nav-icon { width: 18px; text-align: center; opacity: .9; }
.nav-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.nav-item.active {
    background: linear-gradient(90deg, var(--bg-card), transparent);
    color: var(--accent-light); border-left-color: var(--accent);
}
/* 二级子项（精致侧栏） */
.nav-item.nav-sub { padding-left: 30px; font-size: 12.5px; color: var(--text-muted); }
.nav-item.nav-sub:hover { color: var(--text-primary); }
.nav-item.nav-sub.active { color: var(--accent-light); }

/* 顶栏精致化 */
.header {
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-card);
    padding: 12px 24px;
}
.header-title { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
.header-title small { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.header-user { display: flex; align-items: center; gap: 10px; }

/* 统计块（tile） */
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
.stat-card, .card {
    background: var(--bg-card); border: 1px solid var(--border-card);
    border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
}
.card .card-title {
    display: flex; align-items: center; gap: 10px;
    padding: 15px 17px; border-bottom: 1px solid var(--border-row);
    font-size: 15px; font-weight: 800;
}
.card .card-title .sub { color: var(--text-muted); font-size: 12px; font-weight: 600; }
.stat-card {
    padding: 16px 17px; position: relative; overflow: hidden;
}
.stat-card .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -.6px; color: var(--accent-light); }
.stat-card .stat-label { color: var(--text-muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }

/* 按钮精致化 */
.btn { border-radius: 9px; font-weight: 600; font-size: 12.5px; padding: 7px 13px; }
.btn-primary { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: var(--btn-primary-text); }
.btn-sm { padding: 5px 10px; font-size: 11.5px; }
.btn-success { background: linear-gradient(135deg, #16a34a, var(--success)); color: var(--btn-primary-text); }
.btn-danger { background: linear-gradient(135deg, #dc2626, var(--danger)); color: #fff; }
.btn-secondary { background: var(--bg-input); border: 1px solid var(--border-card); color: var(--text-secondary); }
.btn-info { background: var(--info); color: var(--btn-primary-text); }
.btn-warning { background: var(--warning); color: var(--btn-primary-text); }

/* 表格精致化 */
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .05em;
     text-transform: uppercase; color: var(--text-muted);
     padding: 11px 17px; border-bottom: 1px solid var(--border-card); background: var(--bg-input); }
td { padding: 12px 17px; border-bottom: 1px solid var(--border-row); }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg-card-hover); }

/* 徽章精致化 */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
         border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge-success { color: var(--success); background: rgba(105,219,124,0.15); }
.badge-danger { color: var(--danger); background: rgba(255,107,107,0.15); }
.badge-warning { color: var(--warning); background: rgba(255,169,77,0.15); }
.badge-info { color: var(--info); background: rgba(116,192,252,0.15); }
.badge-secondary { color: var(--text-muted); background: var(--bg-input); }

/* 筛选栏精致化 */
.filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.form-group input, .form-group select, .form-group textarea {
    border: 1px solid var(--border-card); background: var(--bg-input); color: var(--text-primary);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(100,210,255,0.15);
}

/* 容量勾选精致化 */
.cap-checklist label {
    border-radius: 999px !important; padding: 6px 12px !important;
}
.cap-checklist label:hover { border-color: var(--accent) !important; }

/* 模态框精致化 */
.modal-content {
    border-radius: 18px !important; box-shadow: var(--shadow) !important;
    border: 1px solid var(--border-card) !important;
    max-width: 600px; width: 100%;
}
.modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border-row); }
.modal-header h3 { font-size: 16px; font-weight: 800; }
.modal-close { font-size: 18px; }

/* Toast 精致化 */
.toast { border-radius: 11px !important; font-weight: 600 !important; }

/* 意见箱卡片精致化 */
.ob-card { border-radius: 12px !important; }

/* AI 进度面板精致化 */
.agent-progress { border-radius: 16px !important; }

/* 登录页精致化 */
.login-card { border-radius: 18px !important; box-shadow: var(--shadow) !important; }
.login-logo { font-size: 26px !important; font-weight: 800 !important; }

/* 空状态精致化 */
.empty-state { text-align: center; padding: 30px; color: var(--text-muted); }
.empty-icon { font-size: 32px; margin-bottom: 8px; }

/* 进度条/迷你条形 */
.agent-progress .ap-bar { height: 6px; border-radius: 3px; overflow: hidden; }
.agent-progress .ap-bar > i { display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-dark), var(--accent)); transition: width .3s; }

/* 内容区 */
.page-content { padding: 22px 24px 60px; }
.page { display: none; }
.page.active { display: block; }

/* ============ 参考布局：侧栏导航分组 + 徽章 + 底部用户区 ============ */
.navlbl {
    font-size: 10.5px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-muted);
    padding: 12px 10px 5px;
}
.nav-item .bdg {
    margin-left: auto; background: var(--danger); color: #fff;
    font-size: 10.5px; font-weight: 800; border-radius: 999px;
    padding: 1px 7px; min-width: 18px; text-align: center;
}
.nav-item .bdg:empty { display: none; }

.sidefoot {
    margin-top: auto; padding-top: 12px;
    border-top: 1px solid var(--border-row);
    display: flex; align-items: center; gap: 10px;
}
.sidefoot .av {
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--accent); color: var(--btn-primary-text);
    display: grid; place-items: center; font-weight: 800; font-size: 13px;
}
.sidefoot b { color: var(--text-primary); font-size: 13px; }
.sidefoot small { color: var(--text-muted); font-size: 11px; display: block; }

/* 图标按钮 */
.iconbtn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border-card); background: var(--bg-card);
    color: var(--text-secondary); cursor: pointer;
    display: grid; place-items: center; font-size: 15px;
}
.iconbtn:hover { border-color: var(--border-card-hover); color: var(--text-primary); }

/* 顶栏标题带副标题 */
.header-title small {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
}

/* 统计块带图标 */
.tile-icon {
    position: absolute; right: 14px; top: 14px;
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center; font-size: 16px;
}
.tile-icon.brand { background: rgba(100,210,255,0.12); color: var(--accent); }
.tile-icon.info { background: rgba(116,192,252,0.12); color: var(--info); }
.tile-icon.warn { background: rgba(255,169,77,0.12); color: var(--warning); }
.tile-icon.danger { background: rgba(255,107,107,0.12); color: var(--danger); }

/* 迷你条形图（纯 CSS） */
.bars { display: flex; align-items: flex-end; gap: 14px; height: 150px; padding: 8px 4px 0; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
.bar .col {
    width: 100%; max-width: 46px; border-radius: 8px 8px 3px 3px;
    background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, transparent));
    position: relative;
}
.bar .col span { position: absolute; top: -19px; left: 0; right: 0; text-align: center; font-size: 11.5px; font-weight: 700; }
.bar .cap { color: var(--text-muted); font-size: 11.5px; font-weight: 600; }

/* 车辆洞察小卡 */
.insight { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.iblock { border: 1px solid var(--border-card); border-radius: 12px; padding: 13px; background: var(--bg-input); }
.iblock .t { color: var(--text-muted); font-size: 12px; font-weight: 700; }
.iblock .n { font-size: 22px; font-weight: 800; margin-top: 4px; }
.iblock .n.warn { color: var(--warning); }
.iblock .n.danger { color: var(--danger); }
.iblock .go { margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; }

/* 关键人列表 */
.people { display: flex; flex-direction: column; }
.person { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border-row); }
.person:last-child { border: none; }
.person .av {
    width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center; font-weight: 800; color: #fff; flex: none;
}
.person .nm { font-weight: 700; }
.person .ro { color: var(--text-muted); font-size: 12.5px; }
.person .ct { margin-left: auto; text-align: right; font-size: 12px; color: var(--text-muted); }

/* 拜访/会议列表 */
.visit-item { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--border-row); }
.visit-item:last-child { border: none; }
.vdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.vd-done { background: var(--text-muted); }
.vd-plan { background: var(--success); }
.vd-late { background: var(--danger); }
.visit-item .vt { font-weight: 700; }
.visit-item .vs { color: var(--text-muted); font-size: 12.5px; }
.visit-item .vday { margin-left: auto; font-weight: 700; font-size: 12.5px; }


/* ============ 多选下拉（原生 select multiple + 全选清空） ============ */
.ms-wrapper { display: flex; flex-direction: column; gap: 6px; }
.ms-actions { display: flex; justify-content: space-between; padding: 2px 4px; }
.ms-actions a { font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; text-decoration: none; }
.ms-select {
    width: 100%; min-height: 60px; max-height: 150px;
    background: var(--bg-input); color: var(--text-primary);
    border: 1px solid var(--border-card); border-radius: 10px;
    padding: 6px; font-size: 13px; font-family: inherit; outline: none;
}
.ms-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(100,210,255,0.15); }
.ms-select option { padding: 6px 8px; border-radius: 6px; }
.ms-select option:checked { background: var(--accent); color: var(--btn-primary-text); }
.ms-hint { font-size: 11px; color: var(--text-muted); }
.ms-opt.on .ms-cbx { background: var(--accent); border-color: var(--accent); color: var(--btn-primary-text); }

/* ============ 数据洞察：报表视图图表网格 ============ */
.pi-chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin: 8px 0 4px;
}
.pi-chart-grid .card {
    min-width: 0;
    word-break: break-word;
}

/* ============ 首页看板：驾驶舱视觉升级 ============ */
/* 页头 hero */
.dash-hero {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 18px 20px; margin-bottom: 18px;
    background: linear-gradient(135deg,
        var(--brand-soft, rgba(37,99,235,.08)),
        color-mix(in srgb, var(--bg) 60%, transparent));
    border: 1px solid var(--border-card);
    border-radius: 16px;
}
.dash-hero .hero-title { font-size: 17px; font-weight: 800; color: var(--text-primary); }
.dash-hero .hero-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.dash-hero .hero-badge {
    font-size: 11.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
    background: var(--brand-soft, rgba(37,99,235,.1)); color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
}
/* 统计块 hero */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.dash-tile {
    position: relative; overflow: hidden; padding: 16px 17px; min-height: 108px;
    border-radius: 16px; border: 1px solid var(--border-card);
    background: var(--panel); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.dash-tile:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(20,29,46,.10); border-color: var(--accent); }
.dash-tile .num {
    font-size: 30px; font-weight: 800; letter-spacing: -.7px; line-height: 1.05;
    margin-top: 10px; font-variant-numeric: tabular-nums;
    animation: dashFade .5s ease both;
}
.dash-tile .tile-ic {
    position: absolute; right: 14px; top: 14px; width: 36px; height: 36px;
    border-radius: 12px; display: grid; place-items: center; font-size: 17px;
}
.dash-tile .tile-sub { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
.dash-tile .trend { font-size: 12.5px; font-weight: 700; margin-top: 6px; }
/* 区块卡片头 */
.dash-sec-title {
    display: flex; align-items: center; gap: 10px; padding: 15px 17px;
    border-bottom: 1px solid var(--border-row);
}
.dash-sec-title .sec-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
.dash-sec-title h3 { font-size: 15px; font-weight: 800; margin: 0; }
.dash-sec-title .sub { color: var(--text-muted); font-size: 12px; font-weight: 600; }
/* 走势柱 */
#p1TrendBars .col { transition: height .5s cubic-bezier(.2,.7,.2,1); }
/* 数字/通用 fade */
@keyframes dashFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* 表格驾驶舱化：表头高对比 + 斑马纹 + 数字对齐 */
.dash-table th { background: var(--panel-2); color: var(--text-secondary); position: sticky; top: 0; }
.dash-table tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--panel) 92%, var(--line) 8%); }
.dash-table td.num, .dash-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
/* 失效模式条 */
.fmode-row { border: 1px solid var(--border-card); border-left: 3px solid var(--brand); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel); }
.fmode-row:hover { border-color: var(--accent); }
/* 空状态精致化 */
.empty-state .empty-ic { font-size: 30px; opacity: .5; margin-bottom: 6px; }

@media (max-width: 900px) {
    .dash-hero { flex-direction: column; align-items: flex-start; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }

/* ============ 首页布局编辑模式 ============ */
.ly-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.layout-item {
    position: relative;
    transition: box-shadow .2s, opacity .2s;
}
.layout-item.ly-editing {
    border: 2px dashed var(--line-strong);
    border-radius: 12px;
    padding: 8px;
    background: var(--panel-2);
}
.layout-item.ly-dragging {
    opacity: .5;
    outline: 3px solid var(--brand);
}
.layout-item.ly-drag-over {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--ring);
}
.ly-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0 8px;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-row);
    margin-bottom: 6px;
}
.ly-ctrl-label {
    flex: 1;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-primary);
}
.ly-drag {
    cursor: grab;
    font-size: 18px;
    color: var(--faint);
    user-select: none;
    padding: 0 4px;
}
.ly-drag:hover { color: var(--brand); }
.ly-drag:active { cursor: grabbing; }
.ly-hidden-bar {
    background: var(--warn-soft);
    border: 1px solid var(--warn);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    margin-bottom: 10px;
}

/* 布局尺寸档位 */
.ly-full { width: 100%; }
.ly-two3 { width: 66.66%; }
.ly-half { width: 50%; }
.ly-third { width: 33.33%; }

/* 自由拖拽调整大小（右下角手柄，编辑模式可见） */
.ly-resize-handle {
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 18px;
    height: 18px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: nwse-resize;
    font-size: 13px;
    color: var(--faint);
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    user-select: none;
    z-index: 10;
}
.ly-resize-handle:hover { color: var(--brand); border-color: var(--brand); }
.layout-item.ly-editing .ly-resize-handle { display: flex; }
.layout-item.ly-resizing { outline: 2px solid var(--brand); }

/* 容量多选下拉 checkbox（下拉触发条 + 弹出面板） */
.cap-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border-row);
    border-radius: 8px;
    background: var(--panel);
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-primary);
    box-sizing: border-box;
    user-select: none;
}
.cap-trigger:hover { border-color: var(--line-strong); }
.cap-panel {
    position: absolute;
    z-index: 60;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    min-width: 220px;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 10px 12px;
}

/* ================= 三视角首页（对齐「首页功能设计-三视角原型.html」） ================= */
.t3-loading{padding:40px;text-align:center;color:var(--muted);}
/* 骨架屏：数据回来前先占好版面，避免整页跳动 */
.t3-skel{padding:0;}
.t3-skel .sk{border-radius:14px;background:linear-gradient(90deg,var(--panel) 25%,var(--bg-card-hover) 50%,var(--panel) 75%);background-size:200% 100%;animation:t3sk 1.2s ease-in-out infinite;border:1px solid var(--line);}
.t3-skel .sk-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px;}
.t3-skel .sk-kpis .sk{height:92px;}
.t3-skel .sk-row{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px;}
.t3-skel .sk-row .sk{height:260px;}
.t3-skel .sk-full{height:220px;margin-bottom:14px;}
.t3-skel .sk-tip{font-size:12px;color:var(--muted);margin:0 0 10px 2px;}
@keyframes t3sk{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
@media(max-width:1100px){.t3-skel .sk-kpis{grid-template-columns:repeat(3,1fr);}}
/* 首页一行筛选条：视角 | 客户 | 容量 | 时间 …… 下载 */
.p1-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px 0;}
.p1-toolbar .p1-fgrp{display:inline-flex;align-items:center;gap:8px;}
.p1-toolbar .p1-flab{font-size:12px;color:var(--text-muted);font-weight:700;white-space:nowrap;}
.p1-toolbar select{width:auto;min-width:150px;max-width:240px;height:34px;padding:4px 10px;font-size:13px;}
.p1-toolbar .p1-sep{width:1px;height:22px;background:var(--line-strong);}
.t3-empty{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px;}
.t3-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px;}
@media(max-width:1280px){.t3-kpis{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.t3-kpis{grid-template-columns:repeat(2,1fr);}}
.t3-kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);}
.t3-kpi .lab{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
.t3-kpi .val{font-size:23px;font-weight:800;margin-top:7px;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t3-kpi .val .v2{font-size:16px;font-weight:700;color:var(--ok);}   /* 「a / b」合并卡的第二个数 */
.t3-kpi .val .vr{font-size:16px;font-weight:700;color:var(--muted);}   /* 「数（率）」卡的率，中性色 */

  // 拦截 fetch
  window.fetch = async function (input, init) {
    var url = typeof input === 'string' ? input : (input && (input.url || input.href)) || '';
    try {
      if (!url || url.indexOf('/api/') === 0) {
        // 本地 API：一律给假数据
        return resolve(url, init || {});
      }
    } catch (e) {
      return json({ success: true, error: 'mock:' + e.message }, 500);
    }
    if (url.indexOf('/static/') === 0 || url.indexOf('style.css') >= 0 || /\.(css|js|png|svg|json)$/i.test(url)) {
      // 本地静态资源：走真实 fetch（http 文件协议下可能失败，但样式已内联）
      if (REAL_FETCH) { try { return await REAL_FETCH(input, init); } catch (e) { return new Response('', { status: 404 }); } }
      return new Response('', { status: 404 });
    }
    // 其它：尽力走真实 fetch
    if (REAL_FETCH) { try { return await REAL_FETCH(input, init); } catch (e) { return empty(); } }
    return empty();
  };

<script>
/**
 * 客户运营管理平台 - SPA 核心框架
 */
const App = {
    currentPage: 'page1',
    currentUser: null,
    users: [],
    customers: [],
    capacities: [],
    _inited: {},   // 页面是否已初始化（用于避免切换时重建 DOM）

    async init() {
        // 登录态校验：未登录则跳转登录页
        const me = await this.loadMe();
        if (!me) return;
        // 首登/管理员重置后强制改密
        if (me.must_change_password) {
            this.forceChangePassword();
            return;  // 改了密码前先不加载其它
        }
        this.initTheme();
        await this.loadUsers();          // 内部按权限跳过（无 user.manage 不调用，避免 403）
        await this.loadCustomers();
        await this.loadCapacities();
        this.bindNav();
        this.loadBadges();
        this.navigate('page1');
    },

    // 强制改密（首登/被重置）
    forceChangePassword() {
        Modal.open(`<h3>&#128274; 请修改初始密码</h3>
            <p style="color:var(--text-muted);font-size:13px;margin:0 0 12px;">为保障安全，首次登录（或管理员重置后）需修改初始密码才能继续使用平台。</p>
            <div class="form-group"><label>当前密码（初始密码）</label><input type="password" id="fcp-old"></div>
            <div class="form-group"><label>新密码（至少6位）</label><input type="password" id="fcp-new"></div>
            <div class="form-group"><label>确认新密码</label><input type="password" id="fcp-confirm"></div>
            <div style="text-align:right;margin-top:12px;">
                <button class="btn btn-primary" id="fcp-save">确认修改</button>
            </div>`);
        document.getElementById('fcp-save').onclick = async () => {
            const oldp = document.getElementById('fcp-old').value;
            const np = document.getElementById('fcp-new').value;
            const cf = document.getElementById('fcp-confirm').value;
            if (!oldp) { Toast.error('请输入当前密码'); return; }
            if (!np || np.length < 6) { Toast.error('新密码至少6位'); return; }
            if (np !== cf) { Toast.error('两次输入不一致'); return; }
            const res = await API.post('/api/change_password', { old_password: oldp, new_password: np });
            if (res && res.success) {
                Toast.success('密码已修改，请使用新密码');
                Modal.close();
                this.currentUser.must_change_password = false;
                this.initTheme();
                await this.loadUsers();
                await this.loadCustomers();
                await this.loadCapacities();
                this.bindNav();
                this.loadBadges();
                this.navigate('page1');
            } else {
                Toast.error((res && res.message) || '修改失败');
            }
        };
    },

    // 加载导航徽章计数（未闭环预警 + 待审批需求）
    async loadBadges() {
        try {
            const [warnings, demands] = await Promise.all([
                API.get('/api/warnings'),
                API.get('/api/demands')
            ]);
            const unclosed = (warnings || []).filter(w => w.closure_status === '未闭环').length;
            const pending = (demands || []).filter(d => d.status === '待审批').length;
            const bdgWarn = document.getElementById('bdg-warn');
            const bdgDemand = document.getElementById('bdg-demand');
            if (bdgWarn) bdgWarn.textContent = unclosed > 0 ? unclosed : '';
            if (bdgDemand) bdgDemand.textContent = pending > 0 ? pending : '';
        } catch (e) { }
    },

    // ============ 当前登录用户 ============
    async loadMe() {
        try {
            const res = await fetch('/api/me');
            if (this.API_HANDLE(res)) { window.location.href = '/login'; return null; }
            if (!res.ok) { window.location.href = '/login'; return null; }
            const data = await res.json();
            if (data && data.success) {
                this.currentUser = data.user;
                this.userPerms = new Set(data.user.perms || []);
                this.renderCurrentUser();
                this.renderNavByPerms();
                this.applyPerms();
                this._setupPermObserver();
                return data.user;
            }
        } catch (e) { }
        window.location.href = '/login';
        return null;
    },

    API_HANDLE(res) {
        return res && res.status === 401;
    },

    // ============ 权限 ============
    hasPerm(code) {
        if (!this.userPerms) return false;
        return this.userPerms.has('*') || this.userPerms.has(code);
    },

    renderNavByPerms() {
        // 按权限隐藏无权访问的菜单项
        const navMap = {
            'page1': 'page1.view', 'page2': 'page2.view', 'page3': 'page3.view',
            'page4': 'page4.view', 'page5': 'page5.view', 'page6': 'page6.view',
            'page7': 'page7.view', 'page8': 'page8.view', 'page9': 'page9.view',
            'page10': 'page10.view',             'page11': 'user.manage',
            'page12': 'page12.view',
            'page13': 'page13.view',
            'page14': 'page14.view',
            'page15': 'page15.view',
            'page16': 'page16.view',
            'page17': 'page17.view',
            'page18': 'page18.view',
            'page19': 'page19.view',
        };
        Object.entries(navMap).forEach(([pageId, perm]) => {
            const nav = document.querySelector(`.nav-item[data-page="${pageId}"]`);
            if (nav) {
                if (this.hasPerm(perm)) {
                    nav.style.display = '';
                } else {
                    nav.style.display = 'none';
                }
            }
        });
    },

    // 无对应权限时隐藏带 data-perm 的编辑类控件（按钮等）。
    // 页面每次动态渲染后需重新调用（App.applyPerms() 或传 root 缩小范围）。
    applyPerms(root) {
        (root || document).querySelectorAll('[data-perm]').forEach(el => {
            el.style.display = this.hasPerm(el.dataset.perm) ? '' : 'none';
        });
    },

    // 监听 DOM 变化（各页面表格/列表动态渲染）自动重放权限隐藏，
    // 免去每个 render 函数手动调用 applyPerms。50ms 防抖。
    _setupPermObserver() {
        let t = null;
        const mo = new MutationObserver(() => {
            if (t) clearTimeout(t);
            t = setTimeout(() => this.applyPerms(), 50);
        });
        mo.observe(document.body, { childList: true, subtree: true });
    },

    renderCurrentUser() {
        const u = this.currentUser || {};
        const roleTxt = u.role_name || (u.role === 'admin' ? '管理员' : (u.role_code === 'manager' ? '客户经理' : 'Member'));

                    <span class="av" style="width:26px;height:26px;border-radius:50%;background:rgba(100,210,255,0.12);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;">${Utils.esc(initial)}</span>

                <button class="iconbtn" onclick="App.logout()" title="退出登录">⏻</button>`;
        }
        // 侧栏底部用户区
        const sfAv = document.getElementById('sidefoot-av');
        const sfName = document.getElementById('sidefoot-name');
        const sfRole = document.getElementById('sidefoot-role');
        if (sfAv) sfAv.textContent = initial;
        if (sfName) sfName.textContent = u.name || u.username;
        if (sfRole) sfRole.textContent = roleTxt;
    },

    // 自助修改密码
    openChangePassword() {
        Modal.open(`<h3>&#128274; 修改密码</h3>
            <div class="form-group"><label>当前密码</label><input type="password" id="cp-old"></div>
            <div class="form-group"><label>新密码（至少6位）</label><input type="password" id="cp-new"></div>

// ============ 全局 fetch 401 拦截（会话失效统一跳登录页） ============
// 覆盖 window.fetch：凡收到 401（登录端点除外）即跳转登录页。
// 这样所有裸 fetch(如 page6/page9) 及未走 API 封装的请求都能统一处理。
(function () {
    if (window.__fetchWrapped) return;
    window.__fetchWrapped = true;
    const origFetch = window.fetch.bind(window);
    const loginPaths = ['/api/login', '/login'];
    window.fetch = async function (input, init) {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const isLogin = loginPaths.some(p => url.includes(p));
        // CSRF 防护（优化计划 #4）：统一带 X-Requested-With，后端对写请求校验
        const hdrs = Object.assign({}, (init && init.headers) || {});
        if (hdrs && hdrs.constructor === Headers && !hdrs.has('X-Requested-With')) hdrs.append('X-Requested-With', 'fetch');
        else if (hdrs && hdrs.constructor !== Headers) hdrs['X-Requested-With'] = 'fetch';
        const ninit = Object.assign({}, init, { headers: hdrs });
        const resp = await origFetch(input, ninit);
        if (!isLogin && resp && resp.status === 401) {
            // 静默跳登录页（避免页面自身再弹一次错误）
            window.location.href = '/login';
        }
        return resp;
    };
})();

// ============ API 封装 ============
const API = {
    // 401 未登录 → 跳转登录页
    _handleAuth(res) {
        if (res && res.status === 401) {
            window.location.href = '/login';
            return true;
        }
        return false;
    },

    async get(url, opts) {
        // opts.timeout(ms)：超时则中断请求并返回 {timeout:true}，避免慢接口(如 Doris 大客户)让页面一直卡在 loading。
        // 默认不超时，兼容既有调用；页面关键请求在 BOSS 用 timeout 传值显式声明。
        opts = opts || {};
        const ctrl = opts.timeout ? new AbortController() : null;
        const timer = ctrl ? setTimeout(() => ctrl.abort(), opts.timeout) : null;
        try {
            const res = await fetch(url, ctrl ? { signal: ctrl.signal } : undefined);
            if (this._handleAuth(res)) return [];
            if (!res.ok) {
                let detail = '';
                try { const j = await res.json(); detail = j.error || j.message || ''; } catch (e) {}
                throw new Error(`HTTP ${res.status} ${url.split('?')[0]}${detail ? ' · ' + detail : ''}`);
            }
            return await res.json();
        } catch (e) {
            if (ctrl && e && e.name === 'AbortError') return { timeout: true, error: '请求超时' };
            Toast.error('请求失败: ' + e.message);
            return [];
        } finally {
            if (timer) clearTimeout(timer);
        }
    },

    async post(url, data) {
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (this._handleAuth(res)) return null;
            const json = await res.json();
            if (!res.ok) throw new Error(`${json.error || `HTTP ${res.status}`} (${url.split('?')[0]})`);
            return json;
        } catch (e) {
            Toast.error('操作失败: ' + e.message);
            return null;
        }
    },

    // 文件直传（multipart）：formData 已含全部字段（文件 + 附带参数）
    // F: XHR 实时进度条；G: 上传期间防并发；B: 同名 409 自动弹确认后带 overwrite 重发
    _uploading: false,
    _uploadBox: null,
    _uploadPct: null,
    _uploadEnsureBox() {
        if (!this._uploadBox) {
            const d = document.createElement('div');
            d.style.cssText = 'position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10000;background:var(--bg-card,#fff);border:1px solid var(--border,#e5e7eb);border-radius:10px;padding:10px 18px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:260px;display:none;';
            d.innerHTML = '<div style="font-size:12px;color:var(--text-muted,#888);margin-bottom:6px;">⬆ 正在上传 <span id="apiUploadPct" style="font-weight:600;color:inherit;"></span></div>'
                + '<div style="height:6px;border-radius:3px;background:var(--bg-hover,#eee);overflow:hidden;"><i id="apiUploadBar" style="display:block;height:100%;width:2%;background:var(--accent,#2563eb);border-radius:3px;transition:width .15s;"></i></div>';
            document.body.appendChild(d);
            this._uploadBox = d;
            this._uploadPct = d.querySelector('#apiUploadPct');
            this._uploadBar = d.querySelector('#apiUploadBar');
        }
        return this._uploadBox;
    },
    _xhrUpload(url, formData) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', url);
            xhr.upload.addEventListener('progress', e => {
                if (e.lengthComputable && this._uploadBar) {
                    const pct = Math.round(e.loaded / e.total * 100);
                    this._uploadBar.style.width = pct + '%';
                    this._uploadPct.textContent = pct + '%';
                }
            });
            xhr.addEventListener('load', () => {
                let json = null;
                try { json = JSON.parse(xhr.responseText); } catch (e) { json = null; }
                if (xhr.status === 401) { window.location.href = '/login'; return reject(new Error('未登录')); }
                if (xhr.status >= 200 && xhr.status < 300) return resolve(json);
                const err = new Error((json && (json.error || json.message)) || `HTTP ${xhr.status}`);
                err.status = xhr.status;
                err.code = json && json.code;
                reject(err);
            });
            xhr.addEventListener('error', () => reject(new Error('网络错误')));
            xhr.send(formData);
        });
    },
    async upload(url, formData, opts = {}) {
        if (this._uploading) { Toast.info('已有上传进行中，请稍候'); return null; }
        this._uploading = true;
        const box = this._uploadEnsureBox();
        box.style.display = '';
        this._uploadBar.style.width = '2%';
        this._uploadPct.textContent = '0%';
        try {
            try {
                return await this._xhrUpload(url, formData);
            } catch (e) {
                // B: 同名冲突 → 用户确认后带 overwrite=1 重发（幂等覆盖）
                if (e.status === 409 && e.code === 'file_exists' && opts.confirmOverwrite !== false) {
                    box.style.display = 'none';
                    if (confirm(e.message + '\n\n是否覆盖已有文件？')) {
                        box.style.display = '';
                        this._uploadBar.style.width = '2%';
                        this._uploadPct.textContent = '0%';
                        formData.append('overwrite', '1');
                        return await this._xhrUpload(url, formData);
                    }
                    return null;
                }
                throw e;
            }
        } catch (e) {
            Toast.error('上传失败: ' + e.message);
            return null;
        } finally {
            this._uploading = false;
            box.style.display = 'none';
        }
    },

    async put(url, data) {
        try {
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (this._handleAuth(res)) return null;
            const json = await res.json();
            if (!res.ok) throw new Error(`${json.error || `HTTP ${res.status}`} (${url.split('?')[0]})`);
            return json;
        } catch (e) {
            Toast.error('操作失败: ' + e.message);
            return null;
        }
    },

    async del(url) {
        try {
            const res = await fetch(url, { method: 'DELETE' });
            if (this._handleAuth(res)) return null;
            const json = await res.json();
            if (!res.ok) throw new Error(`${json.error || `HTTP ${res.status}`} (${url.split('?')[0]})`);
            return json;
        } catch (e) {
            Toast.error('删除失败: ' + e.message);
            return null;
        }
    },

};
