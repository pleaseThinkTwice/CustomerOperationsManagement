                </div>
                <div style="margin-top:12px;"><label style="font-size:12px;font-weight:600;color:var(--text-secondary);">下周边际 / 计划（Markdown）</label>
                    <textarea id="wm-next" rows="3" style="width:100%;box-sizing:border-box;margin-top:4px;">${Utils.esc(n.next_plan)}</textarea></div>
                <div style="text-align:right;margin-top:12px;">
                    <button class="btn btn-primary" onclick="PageDevlog.wmSave()">💾 保存会议记录</button>
                    <button class="btn btn-secondary" onclick="PageDevlog.wmExport()">⬇ 导出周会纪要 MD（渲染后）</button>
                </div>
            </div>
        </div>`;

        const meetingsGroup = b.meetings && b.meetings.length
            ? grp('wmtg', '📝 本期会议纪要', '', b.meetings.map(m => ({ id: m.id, title: m.title, owner: m.owner || '', due_date: m.date, status: '会议', openType: 'meeting' })), (m) => taskRow(m, 'meeting'), '本期无会议纪要')
            : '';

        box.innerHTML = `
            <!-- 周报头：周别切换 + 导出 -->
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.wmShift(-1)">← 上周</button>
                <span class="mono" style="color:var(--accent);font-size:18px;font-weight:800;">${Utils.esc(this._labelOf(this._wm.yw))}</span>
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.wmShift(1)">下周 →</button>
                <span style="flex:1;"></span>
                <button class="btn btn-sm btn-secondary" onclick="PageDevlog.wmExport()">⬇ 导出周会纪要 MD</button>
                <button class="btn btn-sm btn-primary" onclick="PageDevlog.wmSave()">💾 保存会议记录</button>
            </div>

            <!-- 概览卡 -->
            <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;">
                ${tile('📋', '本期任务', s.total)}
                ${tile('✅', '已完成', s.done, 'color:var(--success);')}
                ${tile('▶', '进行中', s.doing, 'color:var(--info);')}
                ${tile('⬜', '待办/暂停', s.todo)}
                ${tile('⚠', '逾期', s.overdue, 'color:var(--danger);')}
            </div>

            <!-- 分工概览 -->
            <div class="card" style="margin-bottom:16px;">
                <div style="font-weight:700;padding:10px 16px 6px;font-size:13px;">📊 本期分工概览（方向 / 责任人）</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 16px 14px;">
                    <div class="table-wrapper"><table style="width:100%;font-size:12px;border-collapse:collapse;">
                        <thead><tr><th>方向</th><th>完成</th><th>完成率</th><th>进行中</th><th>逾期</th></tr></thead><tbody>${dirRows}</tbody></table></div>
                    <div class="table-wrapper"><table style="width:100%;font-size:12px;border-collapse:collapse;">
                        <thead><tr><th>责任人</th><th>完成</th><th>完成率</th><th>进行中</th><th>逾期</th></tr></thead><tbody>${ownerRows}</tbody></table></div>
                </div>
            </div>

            <!-- 任务分组 -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-bottom:16px;">
                <div>${grp('done', '✅ 本期已完成', '', b.done, (x)=>taskRow(x,'done'), '本期无已完成任务')}
                    ${grp('doing', '▶ 进行中', '', b.doing, (x)=>taskRow(x,'doing'), '本期无进行中任务')}</div>
                <div>${grp('todo', '⬜ 待办 / 暂停', '', b.todo, (x)=>taskRow(x,'todo'), '本期无待办任务')}
                    ${grp('overdue', '⚠ 逾期未完成', (b.overdue||[]).length?`<span class="badge badge-danger" style="font-size:10px;">${b.overdue.length}</span>`:'', b.overdue, (x)=>taskRow(x,'overdue'), '本期无逾期任务')}</div>
            </div>

            <!-- 联动区：需求 / 预警 / 待完善（可整体折叠，记住用户习惯） -->
            <div class="card" style="margin-bottom:16px;border-color:var(--line-strong);">
                <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border-row);cursor:pointer;" onclick="PageDevlog.wmToggle('wlink')">
                    <span style="transform:rotate(${ui['wlink'] !== false ? 90 : 0}deg);transition:.15s;">▶</span>
                    <span style="font-weight:800;font-size:14px;">🔗 周会联动</span>
                    <span style="font-size:12px;color:var(--text-muted);">来自：需求(页10) / 预警闭环(页4) / 待完善池(页13) —— 会上直接点名认领</span>
                    <span style="flex:1;"></span>
                    <span style="font-size:11px;color:var(--text-muted);">点击折叠/展开</span>
                </div>
                ${ui['wlink'] !== false ? `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:14px 16px;">
                    <div>${grp('wdemand', '📥 待办需求', (b.summary.demands||0)?`<span class="badge badge-info" style="font-size:10px;">${b.summary.demands}</span>`:'', b.demands, demandRow, '暂无待办需求')}</div>
                    <div>${grp('wwarn', '🚨 未闭环预警', (b.summary.warnings||0)?`<span class="badge badge-danger" style="font-size:10px;">${b.summary.warnings}</span>`:'', b.warnings, warningRow, '暂无未闭环预警')}</div>
                    <div>${grp('wtodo', '📌 待完善池', (b.summary.todos||0)?`<span class="badge badge-warning" style="font-size:10px;">${b.summary.todos}</span>`:'', b.todos, todoRow, '暂无待完善项')}</div>
                </div>` : ''}
            </div>

            ${meetingsGroup}
            ${notesHtml}`;
    },

    wmToggle(k) {
        this._wm.ui = this._wm.ui || {};
        this._wm.ui[k] = this._wm.ui[k] === false;
        // 记录用户开合习惯（localStorage 持久化，跨会话保留）
        try {
            localStorage.setItem('devlog.wm.ui', JSON.stringify(this._wm.ui));
        } catch (e) { /* 忽略存储异常 */ }
        const box = document.getElementById('dlContent');
        if (box) this._renderWeekly(box);
    },

    // 联动区认领：把 需求/预警/待完善 指派给某责任人（走专用安全接口，只更新 owner/状态列）
    async wmClaim(kind, id) {
        const me = (App.currentUser || {}).name || (App.currentUser || {}).username || '';
        const owner = await this._wmPromptOwner(me);
        if (owner === null) return;   // 用户取消
        const res = await API.post('/api/devlogs/weekly-claim', { kind, id, owner });
        if (res && res.success) {
            Toast.success(res.message || '已认领');
            const box = document.getElementById('dlContent');
            if (box) this.refreshWeeklyAfterClaim(box);
        } else {
            Toast.error(res && res.message ? res.message : '认领失败');
        }
    },

    // 认领：弹输入框填责任人（预填当前登录人）
    async _wmPromptOwner(def) {
        const v = prompt('指派责任人（姓名）', def || '');
        return v === null ? null : (v.trim() || def || '');
    },

    // 认领后刷新周会数据
    async refreshWeeklyAfterClaim(box) {
        try {
            const [brief, note] = await Promise.all([
                API.get(`/api/devlogs/weekly-brief?yw=${this._wm.yw}`),
                API.get(`/api/devlogs/weekly-meeting?yw=${this._wm.yw}`)
            ]);
            this._wm.brief = brief;
            this._wm.note = note || this._wm.note;
            this._renderWeekly(box);
        } catch (e) { Toast.error('刷新失败'); }
    },

    async wmSave() {
        const n = {
            yw: this._wm.yw,
            agenda: document.getElementById('wm-agenda').value,
            recap: document.getElementById('wm-recap').value,
            risks: document.getElementById('wm-risks').value,
            blockers: document.getElementById('wm-blockers').value,
            next_plan: document.getElementById('wm-next').value,
        };
        const res = await API.put('/api/devlogs/weekly-meeting', n);
        if (res && res.success) {
            Toast.success('会议记录已保存');
            this._wm.note = Object.assign({}, this._wm.note, n, { exists: true });
            const box = document.getElementById('dlContent');
            if (box) this._renderWeekly(box);
        }
    },

    wmExport() {
        Toast.info('正在生成周会纪要 MD…');
        window.location.href = `/api/devlogs/weekly-meeting/export?yw=${encodeURIComponent(this._wm.yw)}`;
    },

    // 子任务：直接从父任务 id 打开新增表单（无限层级——任意任务都可再拆）
    openAddSub(parentId) {
        this.openEdit(null, 'task', parentId);
    },

    // ========== 新增/编辑任务 ==========
    async openEdit(id, forcedType, parentId) {
        let l = {};
        if (id) {
            const list = await API.get('/api/devlogs');
            l = (list || []).find(x => x.id === id) || {};
        }
        const entryType = forcedType || l.entry_type || 'task';
        const logs = this._logs || [];
        // 责任人默认推荐：新建且未填时默认当前登录人（中文名），便于各自记自己的完成记录
        const DEFAULT_OWNER = this._curUserOwner();
        const ownerVal = l.owner || (!id ? DEFAULT_OWNER : '');

        // 上级任务下拉（父任务候选：task/milestone，不含自身及自身子孙，避免成环）
        const idsInTree = this._descendantIds(id ? [l] : [], id);
        const parentOpts = logs
            .filter(x => x.id !== id && (x.entry_type === 'task' || x.entry_type === 'milestone') && !idsInTree.has(x.id))
            .map(x => {
                const label = x.title + (x.owner ? '（' + x.owner + '）' : '');
                const prefix = x.iteration ? '🔄 ' + x.iteration + ' · ' : '';
                return `<option value="${x.id}" ${(l.parent_id || parentId || 0) == x.id ? 'selected' : ''}>${prefix}${Utils.esc(label)}</option>`;
            }).join('');
        const parentSel = `<div class="form-group"><label>上级任务（可选，挂成子任务，可无限拆解）</label><select id="dl-parent"><option value="0">— 无，作为顶层/大任务 —</option>${parentOpts}</select></div>`;

        const statusOpts = ['待办','进行中','已完成','已暂停'].map(s => `<option value="${s}" ${l.status===s?'selected':''}>${s}</option>`).join('');
        const prioOpts = ['高','中','低','普通'].map(p => `<option value="${p}" ${l.priority===p?'selected':''}>${p}</option>`).join('');

        let body = `<h3>${id ? '编辑' : '新增'}${entryType==='meeting'?'会议纪要':(entryType==='milestone'?'里程碑':(parentId?'子任务':'大任务'))}</h3>`;
        body += `<div class="form-group"><label>标题 *</label><input type="text" id="dl-title" value="${Utils.esc(l.title)}" placeholder="标题"></div>`;
        if (entryType !== 'meeting') {
            body += parentSel;
            body += `<div class="form-row" style="display:flex;gap:12px;">
                <div class="form-group" style="flex:1;"><label>项目方向</label><input type="text" id="dl-direction" value="${Utils.esc(l.direction)}" list="dl-dir-list" placeholder="如：平台建设、数据能力、客户运营"><datalist id="dl-dir-list">${this._dirOptions()}</datalist></div>
                <div class="form-group" style="flex:1;"><label>迭代/版本</label><input type="text" id="dl-iteration" value="${Utils.esc(l.iteration)}" placeholder="如：V2.0、迭代3"></div>
            </div>`;
            body += `<div class="form-group"><label>所属大模块（细分组，可选）</label><input type="text" id="dl-module" value="${Utils.esc(l.module)}" placeholder="如：客户运营、知识库、架构优化"></div>`;
        }
        if (entryType === 'meeting') {
            // 会议纪要 · 三块：基本信息 / 研讨内容 / 行动项（参考 20260907会议纪要.docx）
            body += `<div style="font-size:12px;font-weight:800;color:var(--accent);margin:4px 0 6px;">一、基本信息</div>`;
            body += `<div class="form-row" style="display:flex;gap:12px;flex-wrap:wrap;">
                <div class="form-group" style="flex:1;min-width:150px;"><label>会议日期</label><input type="date" id="dl-mdate" value="${l.meeting_date ? String(l.meeting_date).substring(0,10) : ''}"></div>
                <div class="form-group" style="flex:1;min-width:140px;"><label>起止时间</label><input type="text" id="dl-mtime" value="${Utils.esc(l.meeting_time)}" placeholder="如 16:30~19:00"></div>
                <div class="form-group" style="flex:1;min-width:150px;"><label>会议地点</label><input type="text" id="dl-mloc" value="${Utils.esc(l.meeting_location)}" placeholder="如 D1-16F-1628"></div>
            </div>
            <div class="form-group"><label>参会人员</label><input type="text" id="dl-attendees" value="${Utils.esc(l.attendees)}" placeholder="逗号分隔"></div>
            <div style="font-size:12px;font-weight:800;color:var(--accent);margin:8px 0 6px;">二、研讨内容</div>
            <div class="form-group"><label>议题 / 主题（每个一行，可含研讨结论）</label><textarea id="dl-topics" rows="${((l.topics||'').split('\n').length || 1) + 1}" placeholder="例：&#10;· 平台阶段进度同步&#10;· 客户预警闭环情况">${Utils.esc(l.topics || '')}</textarea></div>
            <div class="form-group"><label>研讨纪要 / 结论</label><textarea id="dl-minutes" rows="5">${Utils.esc(l.minutes)}</textarea></div>
            <div style="font-size:12px;font-weight:800;color:var(--accent);margin:8px 0 6px;">三、行动项</div>
            <div id="dl-acts">${this._actionRows(l.id, id)}</div>
            <div style="margin:4px 0 8px;"><button class="btn btn-sm btn-secondary" onclick="PageDevlog._addActionRow()">+ 加一行行动项</button></div>`;
        } else {
            body += `<div class="form-row" style="display:flex;gap:12px;">
                <div class="form-group" style="flex:1;"><label>责任人</label><input type="text" id="dl-owner" value="${Utils.esc(ownerVal)}" placeholder="负责人"></div>
                <div class="form-group" style="flex:1;"><label>优先级</label><select id="dl-prio">${prioOpts}</select></div>
                <div class="form-group" style="flex:1;"><label>状态</label><select id="dl-status">${statusOpts}</select></div>
            </div>
            <div class="form-row" style="display:flex;gap:12px;">
                <div class="form-group" style="flex:1;"><label>开始日期</label><input type="date" id="dl-sdate" value="${l.start_date ? String(l.start_date).substring(0,10) : ''}"></div>
                <div class="form-group" style="flex:1;"><label>截止日期</label><input type="date" id="dl-ddate" value="${l.due_date ? String(l.due_date).substring(0,10) : ''}"></div>
                <div class="form-group" style="flex:1;"><label>预估工时(h)</label><input type="number" id="dl-estimate" value="${l.estimate||0}" min="0" step="0.5"></div>
            </div>
            <div class="form-row" style="display:flex;gap:12px;">
                <div class="form-group" style="flex:1;"><label>依赖</label><input type="text" id="dl-depend" value="${Utils.esc(l.depend_on)}" placeholder="如：#8、#12"></div>
                ${entryType === 'milestone' ? `<div class="form-group" style="flex:1;"><label>进度%</label><input type="number" id="dl-progress" value="${l.progress||0}" min="0" max="100"></div>` : ''}
            </div>
            <div class="form-group"><label>描述</label><textarea id="dl-desc" rows="3">${Utils.esc(l.description)}</textarea></div>`;
        }
        body += `<div style="text-align:right;"><button class="btn btn-secondary" onclick="Modal.close()">取消</button> <button class="btn btn-primary" id="dl-save">保存</button></div>`;
        Modal.open(body);
        document.getElementById('dl-save').onclick = () => this.save(id, entryType);
    },

    // ========== 查看任务详情（只读） ==========
    async viewTask(id) {
        let l = (this._logs || []).find(x => x.id === id) || {};
        // 本地记录可能来自汇总接口（缺 description/minutes 等长文本），尽量取全量记录
        try {
            const list = await API.get('/api/devlogs');
            l = (list || []).find(x => x.id === id) || l;
        } catch (e) { /* 保留本地记录 */ }
        if (!l.id) { Toast.error('记录不存在'); return; }

        const kv = (label, val) => val ? `<div style="display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid var(--border-row);font-size:12.5px;">
            <span style="flex:none;width:72px;color:var(--text-muted);">${label}</span><span style="flex:1;color:var(--text-primary);word-break:break-all;">${Utils.esc(val)}</span>
        </div>` : '';
        const stCls = this._stCls(l.status || '待办');
        const typeLabel = { task: '任务', meeting: '会议纪要', milestone: '里程碑' }[l.entry_type] || '记录';
        const topicsHtml = (l.topics && String(l.topics).trim())
            ? `<div style="padding:4px 0;">${String(l.topics).split('\n').filter(Boolean).map(t => `<div style="padding:2px 0;font-size:12.5px;color:var(--text-primary);">· ${Utils.esc(t)}</div>`).join('')}</div>`
            : '';
        const descHtml = (l.description && String(l.description).trim())
            ? `<div style="white-space:pre-wrap;line-height:1.7;font-size:12.5px;color:var(--text-secondary);padding:4px 0;">${Utils.esc(l.description)}</div>`
            : '';

        Modal.open(`
            <div style="min-width:460px;max-width:92vw;max-height:82vh;overflow-y:auto;">
                <div style="display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border-row);">
                    <span>${l.entry_type === 'meeting' ? '📝' : (l.entry_type === 'milestone' ? '🎯' : '🔧')}</span>
                    <strong style="flex:1;font-size:15px;color:var(--text-primary);line-height:1.5;">${typeLabel} · ${Utils.esc(l.title || '(无标题)')}</strong>
                    <span class="badge ${stCls}" style="font-size:10px;">${Utils.esc(l.status || '待办')}</span>
                </div>
                <div style="padding:8px 0;">
                    ${typeLabel === '会议纪要' ? '' : `
                        <div style="display:flex;gap:6px;flex-wrap:wrap;padding:6px 0;">
                            ${l.parent_id && l.parent_id > 0 ? '<span class="badge badge-secondary" style="font-size:10px;">子任务</span>' : '<span class="badge badge-secondary" style="font-size:10px;">顶层任务</span>'}
                            ${l.direction ? `<span class="badge badge-secondary" style="font-size:10px;">方向：${Utils.esc(l.direction)}</span>` : ''}
                            ${l.iteration ? `<span class="badge badge-secondary" style="font-size:10px;">迭代：${Utils.esc(l.iteration)}</span>` : ''}
                            ${l.module ? `<span class="badge badge-secondary" style="font-size:10px;">模块：${Utils.esc(l.module)}</span>` : ''}
                            ${l.priority ? `<span class="badge ${l.priority === '高' ? 'badge-danger' : l.priority === '中' ? 'badge-warning' : 'badge-secondary'}" style="font-size:10px;">优先：${Utils.esc(l.priority)}</span>` : ''}
                            ${l.estimate ? `<span class="badge badge-info" style="font-size:10px;">预估 ${Utils.esc(l.estimate)}h</span>` : ''}
                        </div>`}
                    ${typeLabel === '会议纪要' ? (() => {
                        let h = '';
                        const acts = (this._logs || []).filter(x => x.parent_id === l.id && l.id);
                        h += `<div style="font-size:11px;font-weight:800;color:var(--accent);margin:6px 0 4px;">一、基本信息</div>`;
                        h += kv('会议日期', l.meeting_date ? String(l.meeting_date).substring(0,10) : '');
                        h += kv('起止时间', l.meeting_time);
                        h += kv('会议地点', l.meeting_location);
                        h += kv('参会人员', l.attendees);
                        h += `<div style="font-size:11px;font-weight:800;color:var(--accent);margin:8px 0 4px;">二、研讨内容</div>`;
                        if (l.topics && String(l.topics).trim()) h += `<div style="padding:7px 2px;border-bottom:1px solid var(--border-row);"><div style="margin-bottom:4px;color:var(--text-muted);font-size:12px;">议题 / 主题</div>${topicsHtml}</div>`;
                        if (l.minutes) h += `<div style="padding:7px 2px;border-bottom:1px solid var(--border-row);"><div style="margin-bottom:4px;color:var(--text-muted);font-size:12px;">研讨纪要 / 结论</div><div style="white-space:pre-wrap;line-height:1.7;font-size:12.5px;color:var(--text-secondary);">${Utils.esc(l.minutes)}</div></div>`;
                        else h += kv('研讨纪要 / 结论', '（无）');
                        h += `<div style="font-size:11px;font-weight:800;color:var(--accent);margin:8px 0 4px;">三、行动项（${acts.length}）</div>`;
                        if (acts.length) {
                            h += `<table class="dash-table" style="width:100%;"><thead><tr>
                                <th>任务及说明</th><th>负责人</th><th>开始</th><th>结束</th><th>完成时间</th><th>状态</th></tr></thead><tbody>`;
                            h += acts.map(a => {
                                const st = (a.status || '待办');
                                const stc = a.status === '已完成' ? 'var(--ok)' : (a.status === '已逾期' ? 'var(--danger)' : 'var(--warn)');
                                return `<tr style="font-size:12px;">
                                    <td style="max-width:180px;">${Utils.esc(a.title)}</td>
                                    <td>${Utils.esc(a.owner || '-')}</td>
                                    <td>${a.start_date ? String(a.start_date).substring(0,10) : '-'}</td>
                                    <td>${a.due_date ? String(a.due_date).substring(0,10) : '-'}</td>
                                    <td>${a.actual_date ? String(a.actual_date).substring(0,10) : '-'}</td>
                                    <td><span class="badge" style="background:${stc};color:#0b1322;">${Utils.esc(st)}</span></td></tr>`;
                            }).join('');
                            h += `</tbody></table>`;
                        } else { h += `<div style="padding:6px 2px;color:var(--text-muted);font-size:12px;">（无行动项）</div>`; }
                        return h;
                    })() : `
                        ${kv('开始日期', l.start_date ? String(l.start_date).substring(0,10) : '')}
                        ${kv('截止日期', l.due_date ? String(l.due_date).substring(0,10) : '')}
                        ${kv('完成日期', l.actual_date ? String(l.actual_date).substring(0,10) : '')}
                        ${kv('责任人', l.owner)}
                        ${kv('依赖', l.depend_on)}
                        <div style="padding:7px 2px;border-bottom:1px solid var(--border-row);">
                            <div style="margin-bottom:4px;color:var(--text-muted);font-size:12px;">任务描述</div>
                            ${descHtml || '<div style="color:var(--text-muted);font-size:12px;">（无描述）</div>'}
                        </div>`}
                    ${topicsHtml ? `<div style="padding:7px 2px;border-bottom:1px solid var(--border-row);"><div style="margin-bottom:4px;color:var(--text-muted);font-size:12px;">会议主题 / 议题</div>${topicsHtml}</div>` : ''}
                    ${kv('创建时间', l.created_at ? String(l.created_at).replace('T',' ').substring(0,16) : '')}
                    ${kv('最近更新', l.updated_at ? String(l.updated_at).replace('T',' ').substring(0,16) : '')}
                </div>
                <div style="text-align:right;margin-top:10px;">
                    <button class="btn btn-secondary" onclick="Modal.close()">关闭</button>
                    ${l.entry_type === 'meeting' ? `<button class="btn btn-secondary" onclick="PageDevlog.exportMeeting(${l.id})">📤 导出Word</button>` : ''}
                    ${l.entry_type === 'meeting' ? `<button class="btn btn-secondary" onclick="PageDevlog.toOpsMeeting(${l.id})">📋 导入运营会议纪要</button>` : ''}
                    <button class="btn btn-primary" onclick="PageDevlog.closeAndEdit(${l.id},'${Utils.esc(l.entry_type || 'task')}')">✏ 编辑</button>
                </div>
            </div>`);
    },

    // 导出会议纪要 Word（到 uploads/会议纪要/，便于发邮件）
    exportMeeting(id) {
        Toast.info('正在生成 Word...');
        window.location.href = `/api/devlogs/${id}/meeting-export`;
    },

    // todo#2：把项目（开发日志）会议纪要一键导入到运营会议纪要（meetings 表）。
    // 选择归属客户(oem) 后调用后端 /api/devlogs/<id>/to-operations-meeting。
    async toOpsMeeting(id) {
        const l = (this._logs || []).find(x => x.id === id) || {};
        if (!l.id) { Toast.error('记录不存在'); return; }
        const custOpts = (App.customers || [])
            .map(c => `<option value="${Utils.esc(c.oem)}">${Utils.esc(c.oem_ch || c.name_cn || c.oem)} (${Utils.esc(c.oem)})</option>`)
            .join('');
        Modal.open(`
            <h3>📋 导入到运营会议纪要</h3>
            <p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">把「${Utils.esc(l.title || '(无标题)')}」导入为运营会议纪要（进入【会议纪要】页）。
            议题将作为会议共识、行动项将作为会议任务一并带入。</p>
            <div class="form-group"><label>归属客户 *（运营会议纪要按客户归档）</label>
                <select id="toms-oem">${custOpts || '<option value="">（暂无可选客户）</option>'}</select></div>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:10px;">
                <input type="checkbox" id="toms-merge"> 已导入过则合并追加（避免重复）
            </label>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="PageDevlog._confirmToOps(${id})">确认导入</button>
            </div>`);
    },

    async _confirmToOps(id, _retry) {
        const oem = (document.getElementById('toms-oem') || {}).value || '';
        if (!oem) { Toast.error('请选择归属客户'); return; }
        const merge = !!(document.getElementById('toms-merge') || {}).checked;
        const btn = document.querySelector('#modalRoot button.btn-primary');
        const orig = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '导入中…'; }
        try {
            // 用原生 fetch 以便拿到 409（已导入）状态码，提示用户可勾选"合并"
            const res = await fetch(`/api/devlogs/${id}/to-operations-meeting`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' },
                body: JSON.stringify({ oem, merge }),
            });
            const json = await res.json().catch(() => ({}));
            if (res.ok && json.success) {
                Toast.success(json.message || '已导入');
                Modal.close();
                this.refresh();
            } else {
                // 409 已导入 / 其它错误，给出可复选"合并"重试
                const msg = (json && (json.message || json.error)) || '导入失败';
                Toast.error(msg);
                const mergeEl = document.getElementById('toms-merge');
                if (mergeEl && res.status === 409) mergeEl.checked = true;
            }
        } catch (e) {
            Toast.error('导入失败：' + e.message);
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = orig; }
        }
    },

    // ========== 会议纪要·行动项 ==========
    // 行动项 = 挂在会议(parent_id=会议id)下的子任务。每行：说明|负责人|开始|结束|完成时间|状态
    _actionRows(meetingId, editingId) {
        const acts = meetingId ? (this._logs || []).filter(x => x.parent_id === meetingId) : [];
        if (acts.length) return acts.map(a => this._actionRow(a)).join('');
        return this._actionRow(null);
    },

    _actionRow(a) {
        const opts = ['待办', '进行中', '已完成'].map(s =>
            `<option value="${s}" ${a && a.status === s ? 'selected' : ''}>${s}</option>`).join('');
        const inpTxt = (id) =>
            `<input type="text" data-act="${id}" value="${Utils.esc(a && a[id] || '')}" placeholder="${a ? '' : '如：接入异常监控闭环'}">`;
        const inpDate = (id) =>
            `<input type="date" data-act="${id}" value="${a && a[id] ? String(a[id]).substring(0,10) : ''}">`;
        return `<div class="dl-act-row" style="display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;">
            <input type="hidden" data-act="actid" value="${a ? a.id : ''}">
            <div style="flex:2;min-width:170px;">${inpTxt('title')}</div>
            <div style="flex:1;min-width:80px;">${inpTxt('owner')}</div>
            <div style="flex:1;min-width:108px;">${inpDate('start_date')}</div>
            <div style="flex:1;min-width:108px;">${inpDate('due_date')}</div>
            <div style="flex:1;min-width:108px;">${inpDate('actual_date')}</div>
            <div style="flex:1;min-width:92px;"><select data-act="status">${opts}</select></div>
            <button class="btn btn-sm btn-secondary" onclick="this.parentNode.remove()">✕</button>
        </div>`;
    },

    _addActionRow() {
        const box = document.getElementById('dl-acts');
        if (box) box.insertAdjacentHTML('beforeend', this._actionRow(null));
    },

    // 保存会议的行动项（子任务，parent_id=会议id）
    async _saveActionRows(meetingId) {
        if (!meetingId) return;
        const rows = Array.from(document.querySelectorAll('#dl-acts .dl-act-row'));
        const cur = (App.currentUser || {});
        for (const r of rows) {
            const val = id => { const el = r.querySelector(`[data-act="${id}"]`); return el ? el.value.trim() : ''; };
            const actid = val('actid');
            const title = val('title');
            if (actid && !title) { await API.del(`/api/devlogs/${actid}`); continue; }
            if (!actid && !title) continue;
            const payload = {
                title, entry_type: 'task', parent_id: meetingId,
                owner: val('owner'), start_date: val('start_date'),
                due_date: val('due_date'), actual_date: val('actual_date'),
                status: val('status') || '待办',
                created_by: cur.username || cur.name || '',
            };
            if (actid) await API.put(`/api/devlogs/${actid}`, payload);
            else await API.post('/api/devlogs', payload);
        }
    },

    // 从查看详情跳到编辑
    closeAndEdit(id, type) {
        Modal.close();
        this.openEdit(id, type);
    },

    // 方向 datalist 候选（从现有数据去重 + 常用）
    _dirOptions() {
        const seen = new Set();
        const opts = ['平台基础与架构','智能','运营','开发','管理','首页看板'];
        (this._logs || []).forEach(l => { if (l.direction) opts.push(l.direction); });
        return opts.filter((o) => { if (!o || seen.has(o)) return false; seen.add(o); return true; })
            .map(o => `<option value="${Utils.esc(o)}"></option>`).join('');
    },

    // 收集某节点自身及全部子孙 id（用于父任务下拉排除环）
    _descendantIds(nodes, excludeId) {
        const set = new Set();
        const walk = (list) => {
            (list || []).forEach(n => {
                if (!excludeId || n.id !== excludeId) set.add(n.id);
                walk(n.children);
            });
        };
        walk(nodes);
        return set;
    },

    async save(id, entryType) {
        const title = document.getElementById('dl-title').value.trim();
        if (!title) { Toast.error('标题不能为空'); return; }
        const data = { title, entry_type: entryType };
        if (entryType === 'meeting') {
            data.meeting_date = document.getElementById('dl-mdate').value;
            const mtEl = document.getElementById('dl-mtime');
            data.meeting_time = mtEl ? mtEl.value.trim() : '';
            const mlEl = document.getElementById('dl-mloc');
            data.meeting_location = mlEl ? mlEl.value.trim() : '';
            data.attendees = document.getElementById('dl-attendees').value.trim();
            const tpEl = document.getElementById('dl-topics');
            data.topics = tpEl ? tpEl.value.trim() : '';
            data.minutes = document.getElementById('dl-minutes').value.trim();
            const cur2 = (App.currentUser || {});
            if (!id) data.created_by = cur2.username || cur2.name || '';
            // 会议主记录先保存，拿到会议 id 后续处理行动项
            const mres = id ? await API.put(`/api/devlogs/${id}`, data) : await API.post('/api/devlogs', data);
            const meetingId = id || (mres && mres.id);
            if (!meetingId) { Toast.error('会议保存失败'); return; }
            await this._saveActionRows(meetingId);
            if (mres && (mres.id || mres.success)) {
                Toast.success(id ? '已更新' : '已创建');
                Modal.close();
                this.refresh();
            } else { Toast.error('保存失败'); }
            return;
        } else {
            data.owner = document.getElementById('dl-owner').value.trim();
            data.priority = document.getElementById('dl-prio').value;
            data.status = document.getElementById('dl-status').value;
            data.start_date = document.getElementById('dl-sdate').value;
            data.due_date = document.getElementById('dl-ddate').value;
            data.description = document.getElementById('dl-desc').value.trim();
            const dirEl = document.getElementById('dl-direction');
            if (dirEl) data.direction = dirEl.value.trim();
            const iterEl = document.getElementById('dl-iteration');
            if (iterEl) data.iteration = iterEl.value.trim();
            const modEl = document.getElementById('dl-module');
            data.module = modEl ? modEl.value.trim() : '';
            const depEl = document.getElementById('dl-depend');
            if (depEl) data.depend_on = depEl.value.trim();
            const estEl = document.getElementById('dl-estimate');
            if (estEl) data.estimate = parseFloat(estEl.value) || 0;
            const parEl = document.getElementById('dl-parent');
            // 避免把自己设为自己的父任务
            if (parEl) data.parent_id = parEl.value === String(id) ? 0 : parseInt(parEl.value) || 0;
            if (entryType === 'milestone') data.progress = parseInt(document.getElementById('dl-progress').value) || 0;
        }
        if (id) data.entry_type = entryType;
        const cur = (App.currentUser || {});
        if (!id) data.created_by = cur.username || cur.name || '';
        const res = id ? await API.put(`/api/devlogs/${id}`, data) : await API.post('/api/devlogs', data);
        if (res && (res.id || res.success)) {
            Toast.success(id ? '已更新' : '已创建');
            Modal.close();
            this.refresh();
        } else { Toast.error('保存失败'); }
    },

    async del(id) {
        if (!confirm('确定删除该任务？（其全部子任务将一并删除）')) return;
        const res = await API.del(`/api/devlogs/${id}`);
        if (res && res.success) { Toast.success('已删除'); this.refresh(); }
    },

    // ========== 待完善清单 新增/编辑 ==========
    async openTodoEdit(id) {
        let t = {};
        if (id) t = (this._todo || []).find(x => x.id === id) || {};
        const prioOpts = ['高','中','低','普通'].map(p => `<option value="${p}" ${t.priority===p?'selected':''}>${p}</option>`).join('');
        const statusOpts = ['待完善','待讨论','进行中','已解决','已忽略'].map(s => `<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('');
        Modal.open(`
            <h3>${id ? '编辑' : '记一条'}待完善</h3>
            <div class="form-group"><label>标题 *</label><input id="tp-title" value="${Utils.esc(t.title)}" placeholder="待完善的点，如：XX 接口返回字段需补充"></div>
            <div class="form-group"><label>详细说明</label><textarea id="tp-detail" rows="3">${Utils.esc(t.detail)}</textarea></div>
            <div class="form-row" style="display:flex;gap:12px;">
                <div class="form-group" style="flex:1;"><label>来源</label><input id="tp-source" value="${Utils.esc(t.source)}" placeholder="如：会议、需求、自查"></div>
                <div class="form-group" style="flex:1;"><label>优先级</label><select id="tp-prio">${prioOpts}</select></div>
                <div class="form-group" style="flex:1;"><label>状态</label><select id="tp-status">${statusOpts}</select></div>
            </div>
            <div class="form-row" style="display:flex;gap:12px;">
                <div class="form-group" style="flex:1;"><label>标签</label><input id="tp-tag" value="${Utils.esc(t.tag)}" placeholder="逗号分隔，如：ui,api"></div>
                <div class="form-group" style="flex:1;"><label>关联客户(OEM)</label><input id="tp-oem" value="${Utils.esc(t.oem)}" placeholder="可选"></div>
            </div>
            <div style="text-align:right;"><button class="btn btn-secondary" onclick="Modal.close()">取消</button> <button class="btn btn-primary" id="tp-save">保存</button></div>`);
        document.getElementById('tp-save').onclick = async () => {
            const title = document.getElementById('tp-title').value.trim();
            if (!title) { Toast.error('标题不能为空'); return; }
            const data = {
                title,
                detail: document.getElementById('tp-detail').value.trim(),
                source: document.getElementById('tp-source').value.trim(),
                priority: document.getElementById('tp-prio').value,
                status: document.getElementById('tp-status').value,
                tag: document.getElementById('tp-tag').value.trim(),
                oem: document.getElementById('tp-oem').value.trim(),
            };
            if (!id) { const cur = App.currentUser || {}; data.created_by = cur.username || cur.name || ''; }
            const res = id ? await API.put(`/api/devlogs/todo/${id}`, data) : await API.post('/api/devlogs/todo', data);
            if (res && (res.id || res.success)) { Toast.success(id ? '已更新' : '已记入待完善池'); Modal.close(); this.refresh(); }
            else Toast.error('保存失败');
        };
    },

    async delTodo(id) {
        if (!confirm('确定删除该待完善项？')) return;
        const res = await API.del(`/api/devlogs/todo/${id}`);
        if (res && res.success) { Toast.success('已删除'); this.refresh(); }
    }
};
</script>

    init() {

    renderLayout() {

        <!-- 单表学习面板 -->
        <div id="pi-single" style="display:none;margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <select id="piLearnable" class="form-control" style="min-width:360px;padding:8px;border:1px solid var(--border-card);border-radius:8px;background:var(--bg-card);color:var(--text-primary);">
                    <option value="">— 选择一张表 —</option>

    bindEvents() {
        document.getElementById('pi-toggle-batch').onclick = () => {
            const p = document.getElementById('pi-batch');
            const show = p.style.display === 'none';
            p.style.display = show ? '' : 'none';
            if (show) this.openBatch();
        };
        document.getElementById('pi-toggle-single').onclick = () => {
            const p = document.getElementById('pi-single');
            const show = p.style.display === 'none';
            p.style.display = show ? '' : 'none';
            if (show) { document.getElementById('pi-batch').style.display = 'none'; this.loadSingleOptions(); }
            else document.getElementById('pi-batch').style.display = '';
        };
        const kbBtn = document.getElementById('pi-kb-sync');
        if (kbBtn) kbBtn.onclick = () => this.syncToKb();
        const rpBtn = document.getElementById('pi-report');
        if (rpBtn) rpBtn.onclick = () => this.openReport();
        const ea = document.getElementById('pi-asset-expandall');
        if (ea) ea.onclick = () => this.setAssetExpanded(true);
        const ca = document.getElementById('pi-asset-collapseall');
        if (ca) ca.onclick = () => this.setAssetExpanded(false);
        document.getElementById('piStart').onclick = () => this.startLearn();
        document.getElementById('piLearnable').onchange = () => this.previewColumns();
        document.getElementById('pi-select-all').onchange = () => this.applySelectAll();
        document.getElementById('pi-batch-start').onclick = () => this.startBatch();
        document.getElementById('pi-asset-search').onclick = () => this.searchAssets();
        const aq = document.getElementById('pi-asset-q');
        if (aq) aq.addEventListener('keydown', e => { if (e.key === 'Enter') this.searchAssets(); });
        const src = document.getElementById('pi-src');
        if (src) src.addEventListener('input', () => this.reloadItems());
        const flt = document.getElementById('pi-flt');
        if (flt) flt.onchange = () => this.reloadItems();
        document.getElementById('pi-export').onclick = () => this.exportSummary();
        const fuOpen = document.getElementById('pi-fu-open');
        if (fuOpen) fuOpen.onclick = () => this.toggleFuBoard(true);
        const fuClose = document.getElementById('pi-fu-close');
        if (fuClose) fuClose.onclick = () => this.toggleFuBoard(false);
    },

    // ---------- 洞察总览大屏 ----------
    // ---------- 表资产·按业务域 ----------
    async loadAssetDomains() {
        const total = document.getElementById('pi-asset-total');
        try {
            const d = await API.get('/api/insights/assets-by-domain');
            this._assetDomains = d.items || [];
            if (total) total.textContent = `（已学 ${d.total || 0} 张）`;
            this.renderAssetDomains();
        } catch (e) {
            const body = document.getElementById('pi-asset-body');
            if (body) body.innerHTML = '<div class="empty-state">表资产加载失败</div>';
        }
    },

    renderAssetDomains() {
        const body = document.getElementById('pi-asset-body');
        if (!body) return;
        const items = this._assetDomains || [];
        if (!items.length) { body.innerHTML = '<div class="empty-state">暂无已学表</div>'; return; }
        if (typeof this._assetOpen === 'undefined') this._assetOpen = {};
        body.innerHTML = items.map((g, gi) => {
            const open = this._assetOpen[gi];
            const n = g.tables.length;
            return `<div class="card" style="margin-bottom:8px;">
                <div data-asset-g="${gi}" style="display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-bottom:${open?'1px solid var(--border-row)':'none'};">
                    <span style="transform:rotate(${open?90:0}deg);transition:.15s;">▶</span>
                    <span style="font-weight:700;font-size:14px;flex:1;">${Utils.esc(g.domain)}</span>
                    <span class="badge badge-info">${n} 张</span>
                </div>
                ${open ? `<div style="max-height:320px;overflow:auto;">${g.tables.map(t => `<div style="display:flex;gap:6px;padding:6px 12px 6px 32px;border-bottom:1px solid var(--border-row);font-size:12px;">
                    <span class="mono" style="color:var(--text-secondary);min-width:0;">${Utils.esc(t.table_name)}</span>
                    <span style="color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${Utils.esc(t.desc || '')}</span>
                </div>`).join('')}</div>` : ''}
            </div>`;
        }).join('');
        // 绑定分组点击展开
        body.querySelectorAll('[data-asset-g]').forEach(el => {
            el.onclick = () => {
                const gi = Number(el.dataset.assetG);
                this._assetOpen[gi] = !this._assetOpen[gi];
                this.renderAssetDomains();
            };
        });
    },

    setAssetExpanded(all) {
        const items = this._assetDomains || [];
        items.forEach((_, i) => { this._assetOpen[i] = all; });
        this.renderAssetDomains();
    },

    async loadOverview() {
        const box = document.getElementById('pi-overview');
        if (!box) return;
        const d = await API.get('/api/insights/overview');
        if (!d || d.error) { box.innerHTML = ''; return; }
        const pct = d.catalog_total ? Math.round((d.with_charts / d.catalog_total) * 100) : 0;
        const metric = `
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;">
            ${[{ label: '已洞察数据表', value: d.total, sub: `覆盖 ${d.by_db.length} 个库` },
               { label: '含可视化分析', value: d.with_charts, sub: d.catalog_total ? `占全仓 ${pct}%` : '' },
               { label: '含业务结论', value: d.with_conclusions, sub: '' }]
              .map(c => `
                <div class="card" style="padding:12px;text-align:center;">
                  <div style="font-size:15px;color:var(--text-muted);">${Utils.esc(c.label)}</div>
                  <div style="font-size:26px;font-weight:800;color:var(--accent);font-family:var(--mono,Consolas,monospace);">${c.value}</div>
                  <div style="font-size:11px;color:var(--text-muted);">${Utils.esc(c.sub || '')}</div>
                </div>`).join('')}
          </div>`;
        const dbCards = (d.by_db || []).map(b => {
            const cp = b.count ? Math.round((b.with_charts / b.count) * 100) : 0;
            return `
              <div style="border:1px solid var(--border-card);border-radius:10px;padding:10px 12px;background:var(--bg-card);min-width:150px;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <strong style="font-size:13px;">${Utils.esc(b.db)}</strong><span class="badge badge-info">${b.count}</span>
                </div>
                <div style="height:6px;background:var(--border-card);border-radius:3px;margin:8px 0 4px;overflow:hidden;">
                  <div style="height:100%;width:${cp}%;background:linear-gradient(90deg,var(--accent),var(--accent-light));"></div>
                </div>
                <div style="font-size:11px;color:var(--text-muted);">可视化 ${b.with_charts}/${b.count}</div>
              </div>`;
        }).join('');
        const hl = (d.highlights || []).map(h => `
          <div style="border-left:4px solid ${h.level === '重点' ? 'var(--warning)' : 'var(--accent)'};background:var(--bg-card);border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text-primary);">
              ${h.level === '重点' ? '<span class="badge badge-warning">重点</span>' : ''}
              <span onclick="PageInsight.detailByTable(\'${Utils.esc(h.table)}\')" style="cursor:pointer;color:var(--accent);">${Utils.esc(h.title)}</span>
            </div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${Utils.esc((h.body || '').slice(0, 120))}${(h.body || '').length > 120 ? '…' : ''}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">来源表：${Utils.esc(h.table)}</div>
          </div>`).join('');
        const recent = (d.recent || []).slice(0, 5).map(r => `
          <div style="font-size:12px;padding:3px 0;cursor:pointer;" onclick="PageInsight.openDetail(${r.id})">
            <span style="color:var(--text-muted);">${Utils.formatDate(r.updated_at)}</span> ${Utils.esc(r.title || r.table_name)}
          </div>`).join('');
        box.innerHTML = `
          ${metric}
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div>
              <div style="font-size:14px;font-weight:700;margin-bottom:8px;">按库覆盖</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;">${dbCards || '<div class="empty-state">暂无洞察</div>'}</div>
            </div>
            <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:16px;">
              <div>
                <div style="font-size:14px;font-weight:700;margin-bottom:8px;">重点结论</div>
                ${hl || '<div class="empty-state">暂无结论</div>'}
              </div>
              <div>
                <div style="font-size:14px;font-weight:700;margin-bottom:8px;">最近更新</div>
                <div style="border:1px solid var(--border-card);border-radius:10px;padding:8px 12px;">${recent || '<div class="empty-state">暂无</div>'}</div>
              </div>
            </div>
          </div>`;
    },

    async detailByTable(tableName) {
        const d = await API.get('/api/insights');
        const it = (d.items || []).find(x => x.table_name === tableName);
        if (it) this.openDetail(it.id);
        else Toast.error('未找到该表洞察');
    },

    // ---------- 后市场信号台 ----------
    _sigTheme: 'all',
    async loadSignals() {
        const box = document.getElementById('pi-signals');
        const thBox = document.getElementById('pi-signals-themes');
        if (!box) return;
        const d = await API.get('/api/insights/signals');
        if (!d || !d.signals || !d.signals.length) { box.innerHTML = ''; thBox.innerHTML = ''; return; }
        // 先清空再重渲染，避免重复追加
        thBox.innerHTML = '';
        // 跟进状态概览
        const fs = d.followup_stats || {};
        const statTxt = ['待跟进', '处理中', '已闭环'].map(s => (fs[s] ? `${s} ${fs[s]}` : '')).filter(Boolean).join(' · ');
        if (statTxt) thBox.insertAdjacentHTML('beforeend', `<span style="font-size:12px;color:var(--muted, #8496b6);">跟进中：${statTxt}</span>`);
        // 主题标签
        const themes = [{ key: 'all', name: '全部', count: d.signals.length }].concat(d.themes || []);
        const themeColors = { warning_cluster: 'var(--warning)', fault_predict: 'var(--danger)', warranty: 'var(--ok)', self_discharge: 'var(--info)', data_quality: 'var(--muted, #8496b6)' };
        thBox.insertAdjacentHTML('beforeend', themes.map(t => `
            <button class="btn btn-sm ${this._sigTheme === t.key ? 'btn-primary' : 'btn-secondary'}"
                onclick="PageInsight.filterSignals('${t.key}')"
                style="margin:0;">${Utils.esc(t.name)} <span class="badge badge-secondary">${t.count}</span></button>`).join(''));
        this.renderSignals(d.signals, themeColors);
        this.renderFuBoard();
    },

    // 跟进看板：按状态分组展示所有信号跟进，支持快速流转
    async renderFuBoard() {
        const colsBox = document.getElementById('pi-fu-board-cols');
        const listBox = document.getElementById('pi-fu-board-list');
        if (!colsBox) return;
        const d = await API.get('/api/insights/followups');
        const items = d.items || [];
        const order = ['待跟进', '处理中', '已闭环'];
        const colorMap = { '待跟进': 'var(--warning)', '处理中': 'var(--info)', '已闭环': 'var(--ok)' };
        // 顶部三列状态计数
        colsBox.innerHTML = order.map(st => {
            const n = items.filter(x => x.status === st).length;
            return `
            <div style="border:1px solid var(--border-card);border-left:4px solid ${colorMap[st]};border-radius:8px;padding:8px 10px;text-align:center;">
                <div style="font-size:12px;color:var(--text-muted);">${st}</div>
                <div style="font-size:22px;font-weight:800;font-family:var(--mono,Consolas,monospace);color:${colorMap[st]};">${n}</div>
            </div>`;
        }).join('');
        // 明细列表（未闭环优先，按时间倒序）
        const sorted = items.slice().sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status));
        listBox.innerHTML = sorted.length
            ? sorted.map(x => `
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border-card);padding:7px 4px;font-size:12px;">
                    <div style="min-width:0;flex:1;word-break:break-all;">
                        <span class="badge" style="background:${colorMap[x.status] || 'var(--accent)'};color:#0b1322;font-size:10px;">${Utils.esc(x.status)}</span>
                        <strong>${Utils.esc(x.signal_title || x.signal_table)}</strong>
                        <span style="color:var(--text-muted);font-family:var(--mono,Consolas,monospace);">${Utils.esc(x.signal_table)}</span>
                        ${x.action_note ? `<span style="color:var(--text-secondary);"> · ${Utils.esc(x.action_note)}</span>` : ''}
                        ${x.created_by ? `<span style="color:var(--text-muted);"> · ${Utils.esc(x.created_by)}</span>` : ''}
                    </div>
                    <div style="display:flex;gap:4px;flex-shrink:0;">
                        ${x.status !== '已闭环' ? `<button class="btn btn-sm btn-secondary" onclick="PageInsight.advanceFollowupQuick(${x.id}, '已闭环')">闭环</button>` : ''}
                        <button class="btn btn-sm btn-danger" onclick="PageInsight.delFollowup(${x.id})">删</button>
                    </div>
                </div>`).join('')
            : '<div class="empty-state" style="padding:8px;">暂无跟进任务。点击信号卡片的「待跟进」把预知到的信号转为处置。</div>';
    },

    toggleFuBoard(show) {
        const board = document.getElementById('pi-fu-board');
        if (board) board.style.display = show ? '' : 'none';
        if (show) this.renderFuBoard();
    },

    // 看板快捷流转状态
    async advanceFollowupQuick(fid, status) {
        const res = await API.put(`/api/insights/followups/${fid}`, { status });
        if (res && res.success) { Toast.success('已更新'); this.renderFuBoard(); this.loadSignals(); }
        else Toast.error((res && res.error) || '操作失败');
    },

    async delFollowup(fid) {
        if (!confirm('删除这条跟进？')) return;
        const res = await API.del(`/api/insights/followups/${fid}`);
        if (res && res.success) { Toast.success('已删除'); this.renderFuBoard(); this.loadSignals(); }
        else Toast.error('删除失败');
    },

    filterSignals(key) {
        this._sigTheme = key;
        this.loadSignals();
    },

    renderSignals(signals, themeColors) {
        const box = document.getElementById('pi-signals');
        const themeNames = { warning_cluster: '预警聚集', fault_predict: '失效/故障', warranty: '质保/寿命', self_discharge: '自放电', data_quality: '数据质量' };
        const statusColor = { '待跟进': 'var(--warning)', '处理中': 'var(--info)', '已闭环': 'var(--ok)' };
        let list = signals;
        if (this._sigTheme !== 'all') list = signals.filter(s => s.theme === this._sigTheme);
        if (!list.length) { box.innerHTML = '<div class="empty-state">该主题暂无信号</div>'; return; }
        box.innerHTML = list.map(s => {
            const color = themeColors[s.theme] || 'var(--accent)';
            const concl = (s.conclusions && s.conclusions.length)
                ? s.conclusions.filter(c => c.level === '重点').slice(0, 2).map(c => ({ title: c.title, body: c.body }))
                : [];
            const charts = s.charts || [];
            const fuStatus = s.followup_status ? `<span class="badge" style="background:${statusColor[s.followup_status] || 'var(--accent)'};color:#0b1322;">${Utils.esc(s.followup_status)}</span>` : '';
            const fuBtn = fuStatus
                ? `<button class="btn btn-sm btn-secondary" onclick="PageInsight.advanceFollowup(${s.followup_id}, '${Utils.esc(s.table)}')">更新跟进</button>`
                : `<button class="btn btn-sm" style="background:var(--warning);color:#0b1322;" onclick="PageInsight.followSignal('${Utils.esc(s.table)}', '${Utils.esc((concl[0] && concl[0].title) || '')}')">待跟进</button>`;
            return `
            <div style="border:1px solid var(--border-card);border-left:4px solid ${color};border-radius:10px;padding:12px;background:var(--bg-card);display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                        <span class="badge" style="background:${color};color:#0b1322;font-weight:700;">${Utils.esc(themeNames[s.theme] || s.theme)}</span>
                        ${s.severity ? (s.severity === 'high'
                            ? '<span class="badge" style="background:var(--danger);color:#0b1322;">高优先</span>'
                            : (s.severity === 'low'
                                ? '<span class="badge" style="background:var(--muted,#8496b6);color:#0b1322;">低</span>'
                                : '<span class="badge" style="background:var(--warning);color:#0b1322;">中</span>')) : ''}
                        ${fuStatus}
                    </div>
                    <span style="font-size:11px;color:var(--text-muted);">${Utils.esc(s.rows || '')}${s.time_range ? ' · ' + Utils.esc(s.time_range) : ''}</span>
                </div>
                <div style="font-size:12px;color:var(--text-secondary);word-break:break-all;font-family:var(--mono,Consolas,monospace);">${Utils.esc(s.table)}</div>
                ${concl.map(c => `
                    <div style="font-size:12px;">
                        <div style="font-weight:700;color:var(--text-primary);">${Utils.esc(c.title)}</div>
                        <div style="color:var(--text-secondary);margin-top:2px;">${Utils.esc((c.body || '').slice(0, 110))}${(c.body || '').length > 110 ? '…' : ''}</div>
                    </div>`).join('')}
                ${charts.length ? `<div style="font-size:11px;color:var(--text-muted);">图表 ${charts.length} 个 · 字段 ${s.field_count}</div>` : ''}
                <div style="margin-top:auto;display:flex;gap:6px;">
                    <button class="btn btn-sm btn-secondary" onclick="PageInsight.detailByTable('${Utils.esc(s.table)}')">查看该表洞察</button>
                    ${fuBtn}
                </div>
            </div>`;
        }).join('');
    },

    // 将一条信号标记为待跟进（创建跟进任务）
    async followSignal(table, title) {
        const res = await API.post('/api/insights/followups', { table, title });
        if (res && res.success) { Toast.success('已加入待跟进'); this.loadSignals(); }
        else Toast.error((res && res.error) || '操作失败');
    },

    // 更新跟进状态（处理中/已闭环）
    async advanceFollowup(fid, table) {
        const act = prompt('更新跟进状态：输入 处理中 或 已闭环（也可附加备注，用 ; 分隔）', '已闭环');
        if (act === null) return;
        const [status, note] = act.split(';');
        const st = (status || '').trim();
        if (!['待跟进', '处理中', '已闭环'].includes(st)) { Toast.error('请输入 处理中 / 已闭环'); return; }
        const res = await API.put(`/api/insights/followups/${fid}`, { status: st, action_note: (note || '').trim() });
        if (res && res.success) { Toast.success('已更新跟进状态'); this.loadSignals(); }
        else Toast.error((res && res.error) || '操作失败');
    },

    // ---------- 同步到数智分析知识库 ----------
    async syncToKb() {
        const btn = document.getElementById('pi-kb-sync');
        if (!btn) return;
        const original = btn.textContent;
        btn.disabled = true; btn.textContent = '同步中…';
        try {
            const res = await API.post('/api/insights/kb-sync', { only_new: true, with_favorites: true });
            if (res && res.success) {
                Toast.success(`已同步：${res.tables_synced} 张表结构，知识库累计 ${res.analysis_kb_total} 条`);
            } else {
                Toast.error((res && res.message) || (res && res.error) || '同步失败');
            }
        } catch (e) {
            Toast.error('同步失败：' + (e && e.message ? e.message : '未知'));
        } finally {
            btn.disabled = false; btn.textContent = original;
        }
    },

    // ---------- 单表学习 ----------
    async loadSingleOptions() {
        const sel = document.getElementById('piLearnable');
        if (!sel) return;
        const d = await API.get('/api/insights/learnable');
        this.catalog = d.items || [];
        sel.innerHTML = '<option value="">— 选择一张表 —</option>';
        this.catalog.forEach(t => {
            sel.insertAdjacentHTML('beforeend',
                `<option value="${Utils.esc(t.full_name)}">[${Utils.esc(t.db)}] ${Utils.esc(t.table)}${t.learned ? ' ✓已学' : ''}</option>`);
        });
    },

    async previewColumns() {
        const table = document.getElementById('piLearnable').value;
        const box = document.getElementById('piCols');
        if (!table) { box.innerHTML = ''; return; }
        box.innerHTML = '<div class="loading">加载字段…</div>';
        const d = await API.get('/api/insights/learnable/columns?table=' + encodeURIComponent(table));
        const cols = d.columns || [];
        if (!cols.length) { box.innerHTML = '<div style="font-size:12px;color:var(--text-muted);">Doris 未启用或无权限，暂无法预览字段。</div>'; return; }
        box.innerHTML = `<div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;">字段预览（${cols.length}）· 空备注将由 Agent 采样推断</div>`
            + `<table class="data-table" style="width:100%;font-size:12px;border-collapse:collapse;">
                <thead><tr><th style="text-align:left;padding:5px;border-bottom:1px solid var(--border-card);">字段</th>
                <th style="text-align:left;padding:5px;border-bottom:1px solid var(--border-card);">类型</th>
                <th style="text-align:left;padding:5px;border-bottom:1px solid var(--border-card);">含义/备注</th></tr></thead><tbody>`

                <td style="padding:4px 6px;color:var(--text-muted);">${Utils.esc(c.type || '-')}</td>
                <td style="padding:4px 6px;color:var(--text-secondary);${c.comment ? '' : 'color:var(--warning);'}">${Utils.esc(c.comment || '（空，采样推断）')}</td></tr>`).join('')
            + '</tbody></table>';

    async startLearn() {
        const table = document.getElementById('piLearnable').value;
        if (!table) { Toast.error('请先选择要学习的表'); return; }
        const btn = document.getElementById('piStart');
        btn.disabled = true; btn.textContent = '学习中…';
        const res = await AgentProgress.run({ url: '/api/insights/learn', data: { table_name: table }, title: `数据洞察 · ${table}` });
        btn.disabled = false; btn.textContent = '学习';
        if (res && res.ok && res.id) { Toast.success('学习完成'); this._resetCache(); this.loadList(); this.loadOverview(); this.openDetail(res.id); }
        else Toast.error((res && (res.message || res.error)) || '学习失败');
    },

    // ---------- 批量学习 ----------
    async openBatch() {
        const box = document.getElementById('pi-catalog');
        box.innerHTML = '<div class="loading">加载可学表清单…</div>';
        const d = await API.get('/api/insights/learnable');
        this.catalog = d.items || [];
        const groups = {};
        this.catalog.forEach(t => { (groups[t.db] = groups[t.db] || []).push(t); });
        const dbNames = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
        let h = '';
        dbNames.forEach(db => {
            const tbls = groups[db];
            h += `<div style="margin-bottom:6px;">
                <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;">
                    <input type="checkbox" class="pi-db-all" data-db="${Utils.esc(db)}"> ${Utils.esc(db)} <span style="color:var(--text-muted);font-weight:400;">(${tbls.length})</span>
                </label>
                <div style="margin-left:24px;display:flex;flex-wrap:wrap;gap:4px 12px;">
                    ${tbls.map(t => `<label style="font-size:12px;cursor:pointer;white-space:nowrap;">
                        <input type="checkbox" class="pi-tbl" data-table="${Utils.esc(t.full_name)}" data-db="${Utils.esc(db)}">
                        ${Utils.esc(t.table)}</label>`).join('')}
                </div></div>`;
        });
        box.innerHTML = h;
        box.querySelectorAll('.pi-db-all, .pi-tbl').forEach(cb => cb.checked = true);
        const selAll = document.getElementById('pi-select-all');
        if (selAll) selAll.checked = true;
        this.updBatchCount();
        box.querySelectorAll('.pi-db-all').forEach(cb => cb.onchange = () => {
            const db = cb.dataset.db;
            box.querySelectorAll(`.pi-tbl[data-db="${db}"]`).forEach(t => t.checked = cb.checked);
            this.updBatchCount();
        });
        box.querySelectorAll('.pi-tbl').forEach(t => t.onchange = () => { this.updBatchCount(); });
    },

    applySelectAll() {
        const on = document.getElementById('pi-select-all').checked;
        const box = document.getElementById('pi-catalog');
        box.querySelectorAll('.pi-db-all, .pi-tbl').forEach(cb => cb.checked = on);
        this.updBatchCount();
    },

    updBatchCount() {
        const box = document.getElementById('pi-catalog');
        const n = box ? box.querySelectorAll('.pi-tbl:checked').length : 0;
        document.getElementById('pi-batch-count').textContent = `已选 ${n} / ${this.catalog.length} 张表`;
    },

    async startBatch() {
        const tables = [...document.querySelectorAll('#pi-catalog .pi-tbl:checked')].map(c => c.dataset.table);
        if (!tables.length) { Toast.error('请至少勾选一张表'); return; }
        const workers = parseInt(document.getElementById('pi-workers').value, 10) || 10;
        const btn = document.getElementById('pi-batch-start');
        btn.disabled = true; btn.textContent = '批量学习中…';
        try {
            const res = await AgentProgress.run({
                url: '/api/insights/learn-many', data: { tables, workers },
                title: `批量学习 ${tables.length} 张表（${workers} 线程）`,
            });
            if (res && res.ok) Toast.success(`批量完成：成功 ${res.succeeded} / ${res.total}`);
            else Toast.error((res && (res.message || res.error)) || '批量学习失败');
            this._resetCache(); this.loadList(); this.loadOverview();
        } catch (e) {
            Toast.error('批量学习失败：' + e.message);
        } finally {
            btn.disabled = false; btn.textContent = '🚀 一键批量学习';
        }
    },

    // ---------- 已学洞察列表 + 搜索/筛选 ----------
    async loadList() {
        const box = document.getElementById('piList');
        if (!box) return;
        if (!this._allItems.length) {
            box.innerHTML = '<div class="loading">加载中…</div>';
            const d = await API.get('/api/insights');
            this._allItems = d.items || [];
        }
        this.reloadItems();
    },

    reloadItems() {
        const box = document.getElementById('piList');
        const statsBox = document.getElementById('piStats');
        const empty = document.getElementById('piEmpty');
        const kwEl = document.getElementById('pi-src');
        const kw = kwEl ? kwEl.value.trim().toLowerCase() : '';
        const flt = (document.getElementById('pi-flt') || {}).value || 'all';
        // 筛选/搜索变化时重置页码（加载更多则保持）
        const filterKey = kw + '|' + flt;
        if (filterKey !== this._listFilter) { this._listFilter = filterKey; this._listPage = 20; }
        let items = this._allItems;
        if (kw) items = items.filter(it => (it.table_name + '|' + (it.table_desc || '')).toLowerCase().includes(kw));
        if (flt === 'star') items = items.filter(it => it.starred);
        else if (flt === 'chart') items = items.filter(it => it.has_charts || it.has_conclusions);
        else if (flt === 'noviz') items = items.filter(it => it.status === 'done' && !it.has_charts && !it.has_conclusions);
        else if (flt === 'fail') items = items.filter(it => it.status !== 'done');

        if (!items.length) {
            box.innerHTML = '<div class="empty-state">没有符合条件的洞察。' + (kw ? '换个关键词试试。' : '') + '</div>';
            statsBox.innerHTML = `<span class="badge badge-info">共 ${this._allItems.length} 条</span>`;
            empty.style.display = 'none';
            return;
        }
        const done = items.filter(i => i.status === 'done').length;
        const fail = items.length - done;
        empty.style.display = 'none';
        statsBox.innerHTML = `
            <span class="badge badge-info">共 ${this._allItems.length} 条</span>
            <span class="badge badge-info">筛出 ${items.length}</span>
            <span class="badge badge-success">成功 ${done}</span>
            ${fail ? `<span class="badge badge-danger">失败 ${fail}</span>` : ''}`;
        // 懒加载：一次只渲染部分，点「加载更多」再增（数据全量缓存在 _allItems，仅控 DOM 量）
        const PAGE = 20;
        if (typeof this._listPage !== 'number') this._listPage = PAGE;
        const shown = items.slice(0, this._listPage);
        let html = shown.map(it => {
            const st = it.status === 'done'
                ? (it.has_charts || it.has_conclusions
                    ? '<span class="badge badge-success">已学习</span>'
                    : '<span class="badge badge-warning">早版·可升级</span>')
                : `<span class="badge badge-danger" title="${Utils.esc(it.error || '')}">失败</span>`;
            return `
            <div class="card" style="margin-bottom:10px;padding:14px 16px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
                    <div style="min-width:0;flex:1;">
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <strong style="font-size:14px;">${Utils.esc(it.table_desc || it.table_name)}</strong>${st}
                            ${it.has_charts ? '<span class="badge badge-info">图表</span>' : ''}
                            ${it.has_conclusions ? '<span class="badge badge-info">结论</span>' : ''}
                        </div>
                        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;word-break:break-all;">
                            <span class="mono" style="font-family:var(--mono,Consolas,monospace);">${Utils.esc(it.table_name)}</span>
                            · 字段 ${it.field_count || 0} · 更新 ${Utils.formatDate(it.updated_at)}${it.trigger_by ? ' · ' + Utils.esc(it.trigger_by) : ''}
                        </div>
                    </div>
                    <div style="display:flex;gap:6px;flex-shrink:0;">
                        <button class="btn btn-sm ${it.starred ? 'btn-primary' : 'btn-secondary'}" title="${it.starred ? '取消收藏' : '收藏/PIN'}" onclick="PageInsight.toggleStar(${it.id})">${it.starred ? '⭐' : '☆'}</button>
                        <button class="btn btn-sm btn-secondary" onclick="PageInsight.openDetail(${it.id})">查看</button>
                        <button class="btn btn-sm btn-secondary" onclick="PageInsight.exportTable('${Utils.esc(it.table_name)}')">导出</button>
                        <button class="btn btn-sm btn-secondary" onclick="PageInsight.relearn('${Utils.esc(it.table_name)}')">${(it.has_charts || it.has_conclusions) ? '重新学习' : '升级'}</button>
                        <button class="btn btn-sm btn-danger" onclick="PageInsight.del(${it.id})">删</button>
                    </div>
                </div>
            </div>`;
        }).join('');
        // 底部「加载更多」/「已全部显示」
        const moreHtml = shown.length < items.length
            ? `<div style="text-align:center;padding:10px 0;"><button class="btn btn-sm btn-secondary" id="piListMore">加载更多（还有 ${items.length - shown.length} 条）</button></div>`
            : (items.length > PAGE ? `<div style="text-align:center;padding:8px 0;color:var(--text-muted);font-size:12px;">已全部显示</div>` : '');
        box.innerHTML = `${html}${moreHtml}`;
        const more = document.getElementById('piListMore');
        if (more) more.onclick = () => { this._listPage += PAGE; this.reloadItems(); };
    },

    _resetCache() { this._allItems = []; },

    // 收藏/PIN（全局星标）。长按不确定，直接弹输入框填关注备注（可留空）
    async toggleStar(id, note) {
        if (note === undefined) {
            const cur = this._allItems.find(x => x.id === id) || {};
            const action = cur.starred ? '取消收藏' : '收藏';
            if (!cur.starred) {
                const n = prompt(`收藏这条洞察（可填关注备注，也可留空）：`, cur.star_note || '');
                if (n === null) return;
                note = n;
            } else {
                note = cur.star_note || '';
            }
            const res = await API.post(`/api/insights/${id}/star`, { starred: cur.starred ? 0 : 1, note });
            if (res && res.success) {
                Toast.success(cur.starred ? '已取消收藏' : '已收藏');
                this._resetCache(); this.loadList();
            }
            return;
        }
        const res2 = await API.post(`/api/insights/${id}/star`, { starred: 1, note });
        if (res2 && res2.success) { Toast.success('已收藏'); this._resetCache(); this.loadList(); }
    },

    async relearn(tableName) {
        const short = tableName.split('.').pop();
        if (!confirm(`重新学习表 ${short}？（将覆盖已有洞察）`)) return;
        const res = await AgentProgress.run({ url: '/api/insights/learn', data: { table_name: tableName }, title: `数据洞察 · ${short}` });
        if (res && res.ok && res.id) { Toast.success('已重新学习'); this._resetCache(); this.loadList(); this.loadOverview(); this.openDetail(res.id); }
        else Toast.error((res && (res.message || res.error)) || '学习失败');
    },

        if (!scope) {

            Modal.open(`

                <div class="form-group"><label>范围</label>
                    <select id="pi-rep-scope">
                        <option value="all">全部含结论的洞察</option>

                    </select>
                </div>
                <div style="text-align:right;"><button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="PageInsight.openReport(document.getElementById('pi-rep-scope').value)">生成</button></div>`);
            return;
        }
        const res = await API.post('/api/insights/report', { scope });

                <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;">

                    <button class="modal-close" onclick="Modal.close()">&times;</button>
                </div>
                <div style="max-height:70vh;overflow:auto;padding-right:4px;">
                    <div class="md-body" style="line-height:1.7;">${Utils.renderMd ? Utils.renderMd(res.content) : '<pre style="white-space:pre-wrap;">' + Utils.esc(res.content) + '</pre>'}</div>
                </div>
                <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
                    <button class="btn btn-secondary" onclick="PageInsight.downloadReport()">⬇ 下载 .md</button>
                    <button class="btn btn-primary" onclick="Modal.close()">完成</button>
